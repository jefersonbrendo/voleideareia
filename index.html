ede e D1 no fundo da meia-quadra direita.","passoAPasso":["A1 ataca contra o bloqueio de B1; B1 consegue amortecer/raspar na bola no bloqueio (1\u00ba toque da dupla!) e grita imediatamente: 'TOCOU! \u00c9 DOIS!'.","Dependendo de onde a bola amortecida pelo bloqueio cair, a dupla executa uma das duas reconstru\u00e7\u00f5es:","Caso 1 (A bola amortecida passa alta para o meio/fundo da quadra): D1 avan\u00e7a, usa o 2\u00ba contato para LEVANTAR direto para a rede (n\u00e3o defende para o meio, j\u00e1 levanta na ponta!), e B1 (que acabou de descer do bloqueio) abre 2 passos e ATACA no 3\u00ba toque!","Caso 2 (A bola amortecida cai curtinha logo atr\u00e1s de B1 junto \u00e0 rede): como a regra da praia permite que o bloqueador d\u00ea o 2\u00ba contato seguido, o pr\u00f3prio B1 vira na areia e LEVANTA no 2\u00ba toque para D1 vir correndo do fundo e ATACAR no 3\u00ba toque!","Realizam 8 lances variando entre o Caso 1 e o Caso 2."],"pontosAtencao":["Essa \u00e9 a jogada que separa os jogadores experientes de praia dos iniciantes: no Caso 1, quando a bola toca no bloco e vai para o fundo, o defensor D1 tem que lembrar que o toque dele j\u00e1 \u00e9 o LEVANTAMENTO para o bloqueador bater!","Para o bloqueador B1 no Caso 1: depois que a bola raspou na sua m\u00e3o e foi para tr\u00e1s, n\u00e3o v\u00e1 atr\u00e1s dela \u2014 abra r\u00e1pido para a antena gritando 'LEVANTA PRA MIM!' para voc\u00ea atacar!","No Caso 2, B1 aproveita a regra exclusiva do bloqueio para dar dois toques seguidos (1\u00ba no bloqueio + 2\u00ba levantando de manchete ou toque)."],"erroComum":"Depois do toque no bloqueio, os dois jogadores correrem juntos para a bola para levantar e ningu\u00e9m abrir para atacar no 3\u00ba toque; corrija com a chamada 'Tocou! Abre pra bater!'. Varia\u00e7\u00f5es","variacaoFacil":"O professor lan\u00e7a a bola batendo na m\u00e3o de B1 no salto para simular o amortecimento de forma controlada.","variacaoDificil":"Jogo real onde A1 tenta furar o bloqueio e B1 busca ativamente o toque de amortecimento para armar a transi\u00e7\u00e3o de 2 toques restantes.","paraTurma":"Em turmas de 4 a 12 alunos, coloque duplas na direita recebendo ataques da esquerda: toda vez que houver toque no bloqueio e a dupla acertar a transi\u00e7\u00e3o dos 2 toques restantes matando o ponto, ela ganha 3 pontos.","meta":"Executar com sucesso 7 de 10 reconstru\u00e7\u00f5es ap\u00f3s toque no bloqueio (sem cometer 4 toques e com ataque v\u00e1lido no 3\u00ba contato).","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 ataca (seta 1) e a bola toca no bloqueio de B1 (1\u00ba toque) subindo para o meio da quadra direita (seta 2). D1 avan\u00e7a (seta tracejada 1) e j\u00e1 executa o levantamento no 2\u00ba toque (seta 3) para a ponta, enquanto B1 sai da rede abrindo para a antena (seta tracejada 2) e ataca no 3\u00ba toque (seta 4).","codigo":"BLQ-AVA-143"},{"numero":144,"secao":8,"nome":"Desafio 'Rei do Pared\u00e3o': sequ\u00eancia valendo ponto de Bloqueio + Defesa + Transi\u00e7\u00e3o","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (2 contra 2 em desafio competitivo na areia)","tempo":"12 minutos","material":"6 bolas OP\u00c7\u00c3O 1: LINHA OP\u00c7\u00c3O 2: DIAG A1 L1 B1 D1 1","objetivo":"Aplicar sob press\u00e3o de placar todo o repert\u00f3rio t\u00e1tico da se\u00e7\u00e3o (sinais nas costas, fechar linha/diagonal, falso bloqueio, pulling e transi\u00e7\u00e3o de contra-ataque).","comoMontar":"Quadra oficial 16x8m em disputa 2x2: Dupla do Pared\u00e3o (B1 + D1) no lado direito sacando e defendendo; Dupla Desafiante (A1 + L1) no lado esquerdo recepcionando e atacando.","passoAPasso":["Disputa de sets at\u00e9 12 pontos onde apenas a dupla que est\u00e1 sacando/bloqueando (Dupla do Pared\u00e3o) marca pontos especiais de sistema defensivo:","Regra de Pontua\u00e7\u00e3o do Pared\u00e3o: Bloqueio direto no ch\u00e3o ('Monster Block') = 3 PONTOS imediatos! Toque de amortecimento no bloqueio seguido de ponto no contra- ataque = 2 PONTOS! Falso bloqueio/retirada ou fechamento perfeito que gera defesa do parceiro e ponto de contra-ataque = 2 PONTOS!","Se a Dupla Desafiante (A1 + L1) virar o side-out, ela ganha 1 ponto normal e rouba o direito de ir para o lado do Pared\u00e3o sacar e bloquear.","Antes de cada saque, \u00e9 obrigat\u00f3rio mostrar o sinal atr\u00e1s das costas combinando o sistema entre B1 e D1.","Vence o desafio a dupla que alcan\u00e7ar 12 pontos primeiro somando seus bloqueios e contra-ataques."],"pontosAtencao":["Para ganhar o desafio, o bloqueador n\u00e3o pode ser previs\u00edvel: misture 2 bolas fechando a paralela, 1 bola de falso bloqueio retirando no \u00faltimo segundo e 1 bola fechando a diagonal na leitura!","Quando voc\u00ea varia entre pular na rede e retirar de surpresa, voc\u00ea entra na cabe\u00e7a do atacante advers\u00e1rio e for\u00e7a o erro dele.","Mantenha a comunica\u00e7\u00e3o energ\u00e9tica ap\u00f3s cada ponto entre bloqueador e defensor."],"erroComum":"Querer ganhar 3 pontos em todas as bolas tentando saltar at\u00e9 em levantamentos que ficaram a 4 metros da rede; corrija lembrando que o falso bloqueio + contra-ataque tamb\u00e9m vale 2 pontos preciosos. Varia\u00e7\u00f5es","variacaoFacil":"A Dupla do Pared\u00e3o tem direito a 3 saques seguidos garantidos antes de rodar, independentemente de levar o side-out.","variacaoDificil":"Se o atacante explorar o bloqueio para fora (block-out) ou se B1 tocar na rede, a Dupla do Pared\u00e3o perde 2 pontos do seu placar!","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a o grande torneio final da Se\u00e7\u00e3o 8: uma dupla come\u00e7a no 'Trono do Pared\u00e3o' e as demais entram desafiando no side-out. Quem derruba o side-out corre por baixo da rede para assumir o Pared\u00e3o!","meta":"Conquistar pelo menos 3 a\u00e7\u00f5es diretas ou indiretas de bloqueio (bloqueio no ch\u00e3o, amortecimento ou indu\u00e7\u00e3o para a defesa) por set.","descricaoDiagrama":"Quadra 16x8m vista de cima no desafio 2x2 completo. B1 na rede direita mostra o sinal nas costas para D1 sacar (seta 1) e escolhe taticamente entre fechar a paralela (sombra superior), fechar a diagonal (sombra central) ou retirar em falso bloqueio (seta tracejada 1), gerando a defesa e o contra-ataque da dupla (setas 2, 3 e 4).","codigo":"BLQ-AVA-144"},{"numero":145,"secao":9,"nome":"Base de defesa na areia e ativa\u00e7\u00e3o da plataforma","nivel":"Iniciante","jogadores":"2 jogadores (1 atacante/batedor A1 na rede e 1 defensor J1 no fundo)","tempo":"7 minutos","material":"4 bolas, 2 cones e 1 zona alvo COBERTURA J1 (5m) ALVO 1,5mA1 J1 1 2 Base baixa a 5m + Plataforma \u00e0 frente dos joelhos Quadra 16x8m vista de cima. A1 junto \u00e0 rede esquerda bate a bola (seta 1) para a meia-quadra direita. J1 posicionado a 5m da rede entre 2 cones dentro da sua \u00e1rea de cobertura amortece a bola e a envia em arco alto (seta 2) para a Zona Alvo a","objetivo":"Construir a postura baixa equilibrada na areia fofa (p\u00e9s afastados, quadril abaixo dos joelhos e bra\u00e7os \u00e0 frente) para defender bolas batidas a 5 metros.","comoMontar":"Na meia-quadra direita, posicione 2 cones a 5 metros da rede afastados 1,5m entre si (base de J1). Demarque uma Zona Alvo de 2x2m no centro da quadra direita a 1,5m da rede. A1 fica junto \u00e0 rede do lado esquerdo com as bolas.","passoAPasso":["J1 posiciona-se entre os 2 cones a 5 metros da rede com os p\u00e9s um pouco mais largos que os ombros, pontas dos p\u00e9s ativas na areia e quadril baixo.","Os bra\u00e7os de J1 come\u00e7am semiflexionados e abertos \u00e0 frente da linha dos joelhos, com as palmas voltadas para cima prontas para unir.","Quando A1 levanta o bra\u00e7o para bater na bola, J1 faz uma leve press\u00e3o dos antep\u00e9s contra a areia (ativa\u00e7\u00e3o da base) congelando a cabe\u00e7a.","A1 bate a bola controlada na dire\u00e7\u00e3o da cintura de J1; J1 une a plataforma firme e levanta a bola a 4 metros de altura para cair dentro da Zona Alvo central.","Ap\u00f3s 10 defesas consecutivas, J1 e A1 trocam de fun\u00e7\u00e3o."],"pontosAtencao":["Manter o peito inclinado \u00e0 frente dos joelhos: se o peso ficar nos calcanhares na areia fofa, a bolada derruba o defensor sentado.","Nunca esperar a bola com as m\u00e3os j\u00e1 entrela\u00e7adas; una os polegares apenas na fra\u00e7\u00e3o de segundo do impacto.","Direcionar a bola para o centro da quadra com arco alto, dando tempo para a transi\u00e7\u00e3o."],"erroComum":"Subir o quadril e esticar as pernas no momento em que o atacante bate na bola; corrija exigindo que os cotovelos permane\u00e7am \u00e0 frente dos joelhos dobrados at\u00e9 a bola subir. Varia\u00e7\u00f5es","variacaoFacil":"A1 lan\u00e7a a bola com as duas m\u00e3os por cima da cabe\u00e7a em trajet\u00f3ria firme na cintura de J1.","variacaoDificil":"A1 bate bolas variando meio metro para a esquerda ou para a direita de J1, exigindo um passo lateral curto de ajuste.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 batedores na rede (um em cada corredor) e duas filas de defensores a 5 metros. Cada aluno defende 3 bolas seguidas na Zona Alvo e vai para o fim da fila.","meta":"Colocar 8 de 10 bolas defendidas com altura m\u00ednima de 4 metros dentro da Zona Alvo central.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 junto \u00e0 rede esquerda bate a bola (seta 1) para a meia-quadra direita. J1 posicionado a 5m da rede entre 2 cones dentro da sua \u00e1rea de cobertura amortece a bola e a envia em arco alto (seta 2) para a Zona Alvo a 1,5m da rede.","codigo":"DEF-INI-145"},{"numero":146,"secao":9,"nome":"Defesa de ataque forte no corpo (amortecimento de ombros e quadril)","nivel":"Iniciante","jogadores":"2 jogadores (1 atacante A1 e 1 defensor J1)","tempo":"8 minutos","material":"5 bolas, 2 cones e 1 zona alvo AMORTECIMENTO (5,5m) ALVO 2mA1 J1 1 1 2 Recolher abd\u00f4men em \"C\" tirando o peso da cortada","objetivo":"Aprender a absorver a velocidade de uma cortada potente encolhendo o abd\u00f4men e cedendo os ombros para tr\u00e1s no milissegundo do impacto.","comoMontar":"A1 fica a 1,5m da rede na meia-quadra esquerda (ou sobre um caixote) com as bolas. J1 fica a 5,5 metros da rede na meia-quadra direita. Zona Alvo central demarcada a 2 metros da rede na quadra direita.","passoAPasso":["J1 assume a base baixa aos 5,5 metros da rede.","A1 faz o autolan\u00e7amento e bate uma cortada forte diretamente na linha do est\u00f4mago/quadril de J1.","No instante do contato da bola nos antebra\u00e7os, J1 N\u00c3O empurra os bra\u00e7os para frente: ele contrai o abd\u00f4men em formato de 'C' (arredondando levemente as costas para tr\u00e1s) e cede 5 cent\u00edmetros com a plataforma para tirar o peso da pancada.","A energia da cortada \u00e9 absorvida e a bola sobe macia a 4,5 metros de altura caindo na Zona Alvo no centro da quadra.","Realizam 8 pancadas seguidas e invertem os pap\u00e9is."],"pontosAtencao":["Contra bola forte na praia, qualquer movimento dos bra\u00e7os para cima faz a bola voltar de gra\u00e7a para o outro lado da rede ou sair no fundo.","Incline a plataforma um pouco mais vertical (polegares apontando mais para frente/baixo) para a bola subir reta no seu pr\u00f3prio lado.","Se a pancada for muito forte, permita que o quadril recue ou sente na areia ap\u00f3s a bola sair limpa do bra\u00e7o."],"erroComum":"Travar o corpo duro e balan\u00e7ar os bra\u00e7os contra a cortada, devolvendo a bola na m\u00e3o do atacante advers\u00e1rio; corrija pedindo para 'puxar o umbigo para dentro' na hora da batida. Varia\u00e7\u00f5es","variacaoFacil":"A1 bate a cortada com os p\u00e9s no ch\u00e3o a 3 metros da rede (70% de pot\u00eancia).","variacaoDificil":"A1 salta na rede e bate com 90% de pot\u00eancia variando entre cintura e coxas de J1.","paraTurma":"Em turmas de 4 a 12 alunos, o professor (ou 2 alunos atacantes) bate cortadas da rede esquerda para duas filas de defensores aos 5,5m na direita. Um aluno fica na Zona Alvo agarrando as bolas amortecidas.","meta":"Amortecer 7 de 10 cortadas fortes fazendo a bola subir alta dentro da pr\u00f3pria quadra na Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 a 1,5m da rede esquerda desfere cortada forte (seta 1) contra J1 a 5,5m da rede na quadra direita. J1 recua levemente o centro de gravidade absorvendo o impacto (seta tracejada curta) e faz a bola subir (seta 2) para a Zona Alvo a 2m da rede.","codigo":"DEF-INI-146"},{"numero":147,"secao":9,"nome":"Defesa reflexa na altura do rosto e ombros (toque de defesa / m\u00e3os espalmadas)","nivel":"Iniciante","jogadores":"2 jogadores (1 atacante A1 e 1 defensor J1)","tempo":"8 minutos","material":"5 bolas, 2 cones e 1 zona alvo DEFESA ALTA (5m) ALVO 2m A1 J1 1 2","objetivo":"Usar o recurso oficial da regra do v\u00f4lei de praia para bolas atacadas forte na altura da cabe\u00e7a: defesa por cima com m\u00e3os espalmadas/concha firme.","comoMontar":"A1 posiciona-se a 2m da rede na meia-quadra esquerda. J1 posiciona-se a 5 metros da rede na meia- quadra direita. Zona Alvo central a 2m da rede na direita.","passoAPasso":["Explica\u00e7\u00e3o da Regra da Praia: no v\u00f4lei de praia, quando a bola vem de um ATAQUE FORTE (hard-driven ball), a regra permite que o defensor fa\u00e7a o toque de defesa por cima mesmo que a bola seja levemente retida ou saia girando, desde que seja uma a\u00e7\u00e3o reflexa defensiva!","J1 fica na base aos 5 metros com as m\u00e3os abertas na altura da cintura/peito.","A1 bate bolas r\u00e1pidas e tensas mirando especificamente na linha do peito, ombros e testa de J1.","Em vez de tentar encolher os bra\u00e7os para fazer manchete no pesco\u00e7o, J1 sobe rapidamente as duas m\u00e3os abertas e tensas acima do peito/testa (polegares pr\u00f3ximos formando um escudo firme) e amortece a bola para o alto.","A bola sobe no centro da quadra caindo na Zona Alvo; trocam a cada 8 bolas."],"pontosAtencao":["A permiss\u00e3o da regra vale EXCLUSIVAMENTE para bolas atacadas com velocidade/for\u00e7a: se a bola vier lenta (largada ou saque), n\u00e3o pode reter nos dedos!","Deixe os dedos abertos e os punhos firmes inclinados para cima para que a bola suba em vez de bater no seu rosto.","Flexione levemente os joelhos no impacto para ajudar a amortecer a pancada alta."],"erroComum":"Virar o rosto de lado com medo da bola alta ou tentar juntar as m\u00e3os em soco mandando a bola longe; corrija mantendo o queixo baixo e as duas palmas firmes voltadas para frente/cima. Varia\u00e7\u00f5es","variacaoFacil":"A1 avisa 'ALTA!' antes de bater na linha da testa de J1 para treinar o posicionamento do escudo das m\u00e3os.","variacaoDificil":"A1 mistura sem avisar: 1 bola forte na barriga (manchete) e 1 bola forte na testa (defesa alta de m\u00e3os abertas).","paraTurma":"Em turmas de 4 a 12 alunos, forme 2 esta\u00e7\u00f5es paralelas. O atacante bate bolas tensas na linha do ombro/cabe\u00e7a do defensor, que amortece para um terceiro aluno na Zona Alvo. Rod\u00edzio a cada 5 bolas.","meta":"Defender 7 de 10 bolas fortes altas controlando-as para o alto dentro da Zona Alvo central.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 a 2m da rede esquerda bate bola tensa alta na linha da cabe\u00e7a (seta 1) de J1 a 5m da rede direita. J1 aciona o escudo de m\u00e3os altas e amortece a bola (seta 2) para a Zona Alvo a 2m da rede.","codigo":"DEF-INI-147"},{"numero":148,"secao":9,"nome":"Avan\u00e7o explosivo na bola curta (pingo e poke) mantendo o equil\u00edbrio","nivel":"Iniciante","jogadores":"2 jogadores (1 atacante A1 e 1 defensor J1)","tempo":"8 minutos","material":"5 bolas, 3 cones e 1 zona alvo CORREDOR DE AVAN\u00c7O (5m 2m) ALVO 2m A1 J1 1 12","objetivo":"Acelerar da base de 5 metros at\u00e9 os 2 metros da rede para levantar bolas largadas curtas sem tocar na rede e sem perder o controle do corpo.","comoMontar":"Na meia-quadra direita, coloque 1 cone a 5m da rede (base de J1) e 2 cones a 2m da rede (ponto de queda da bola curta). Demarque a Zona Alvo no centro a 2m da rede. A1 fica junto \u00e0 rede na esquerda.","passoAPasso":["J1 aguarda em base baixa aos 5 metros da rede, com o peso na ponta dos p\u00e9s.","A1 simula que vai bater forte, mas aplica um 'poke' (n\u00f3 dos dedos) ou largada curta que cruza a rede e cai em dire\u00e7\u00e3o aos cones de 2 metros.","J1 l\u00ea a desacelera\u00e7\u00e3o do bra\u00e7o de A1, explode para frente em 3 passadas rasantes e entra com a perna dominante em afundo amplo aos 2 metros.","Com a manchete (ou uma m\u00e3o fechada com dorso plano) paralela \u00e0 areia, J1 levanta a bola antes que ela toque o ch\u00e3o, colocando-a na Zona Alvo ao lado.","Retorna de costas at\u00e9 o cone de 5m e repete; trocam a cada 8 bolas."],"pontosAtencao":["N\u00e3o corra olhando para o ch\u00e3o: mantenha os olhos na parte inferior da bola durante toda a arrancada.","Como voc\u00ea est\u00e1 correndo r\u00e1pido em dire\u00e7\u00e3o \u00e0 rede, incline a plataforma para tr\u00e1s/cima (quase 80 graus) para a bola subir verticalmente e n\u00e3o passar direto pela rede.","Use o p\u00e9 da frente deslizando na areia fofa para frear antes da linha central."],"erroComum":"Balan\u00e7ar o bra\u00e7o para frente enquanto corre na bola curta, jogando a bola na fita da rede; corrija pedindo para apenas 'colocar a raquete do bra\u00e7o embaixo da bola' e deixar ela quicar para cima. Varia\u00e7\u00f5es","variacaoFacil":"J1 come\u00e7a um pouco mais adiantado (a 4 metros da rede) e A1 faz um arco um pouco mais alto na largada.","variacaoDificil":"J1 come\u00e7a com um joelho apoiado na areia aos 5 metros; ao ver o movimento de A1, levanta e arranca para buscar a bola curta aos 2m.","paraTurma":"Em turmas de 4 a 12 alunos, posicione 2 lan\u00e7adores na rede esquerda soltando bolas curtas e duas filas de defensores aos 5m na direita. Quem defende j\u00e1 recolhe a pr\u00f3pria bola na Zona Alvo e entrega ao lan\u00e7ador.","meta":"Alcan\u00e7ar e colocar 7 de 10 bolas curtas dentro da Zona Alvo sem encostar na rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 junto \u00e0 rede esquerda executa um poke curto (seta 1) para a faixa de 2m da quadra direita. J1 sai do cone de 5m em sprint frontal (seta tracejada 1) at\u00e9 os cones de 2m e levanta a bola (seta 2) para a Zona Alvo central.","codigo":"DEF-INI-148"},{"numero":149,"secao":9,"nome":"Recuo com giro de quadril na bola alta no fundo (defesa de lob)","nivel":"Iniciante","jogadores":"2 jogadores (1 atacante A1 e 1 defensor J1)","tempo":"8 minutos","material":"5 bolas, 3 cones e 1 zona alvo ALVO 2m A1 J1 1 1 2","objetivo":"Abandonar o h\u00e1bito lento de correr de costas na areia, abrindo o quadril para correr de lado/frente e recuperar o lob a 7,5 metros da rede.","comoMontar":"Na meia-quadra direita, coloque 1 cone adiantado a 3,5 metros da rede (posi\u00e7\u00e3o inicial de J1) e 2 cones nos cantos de fundo a 7,5 metros da rede. Zona Alvo central a 2m da rede. A1 na rede esquerda.","passoAPasso":["J1 inicia no cone de 3,5 metros da rede (simulando um defensor que adiantou esperando largada).","A1 aplica um 'lob' (bola alta por cobertura) enviando a bola por cima da cabe\u00e7a de J1 em dire\u00e7\u00e3o a um dos cones de 7,5 metros l\u00e1 no fundo.","Assim que v\u00ea a trajet\u00f3ria alta, J1 gira imediatamente o quadril 135 graus para o lado da bola e corre de frente/diagonal olhando por cima do ombro.","Ao chegar no cone de 7,5m antes da bola cair, J1 planta o p\u00e9 externo na areia, gira os ombros de volta para o centro da quadra e executa uma manchete alta e longa at\u00e9 a Zona Alvo.","Alterna um lob no fundo esquerdo e um no fundo direito; trocam a cada 8 bolas."],"pontosAtencao":["Na areia fofa, tentar recuar pulando de costas faz o calcanhar travar nos buracos e o jogador cair sentado: gire o quadril no primeiro passo!","Corra mirando meio passo ATR\u00c1S de onde a bola vai cair para conseguir bater nela de tr\u00e1s para frente rumo \u00e0 rede.","Como a defesa vem l\u00e1 dos 7,5 metros, use a extens\u00e3o potente das pernas para a bola chegar na Zona Alvo aos 2m."],"erroComum":"Tocar na bola ainda virado de costas para a rede, jogando a bola para fora da quadra de fundo; corrija exigindo que o p\u00e9 mais pr\u00f3ximo da linha de fundo pare atr\u00e1s da bola virando o peito para a rede. Varia\u00e7\u00f5es","variacaoFacil":"Colocar os cones de fundo a 6 metros da rede (recuo mais curto de 2,5 metros).","variacaoDificil":"A1 primeiro finge que vai largar curto (fazendo J1 dar 1 passo para frente aos 3m) e s\u00f3 ent\u00e3o lan\u00e7a o lob aos 7,5m.","paraTurma":"Em turmas de 4 a 12 alunos, 1 lan\u00e7ador na rede envia lobs alternados para os dois cantos de fundo enquanto a fila de defensores sai do cone de 3,5m. Rod\u00edzio cont\u00ednuo a cada bola.","meta":"Recuperar 7 de 10 bolas de lob no fundo (7,5m) trazendo-as altas para dentro da Zona Alvo a 2m da rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 na rede esquerda envia um lob alto por cobertura (seta 1) para os cones a 7,5m no fundo direito. J1 parte do cone a 3,5m, gira o quadril e corre at\u00e9 o fundo (seta tracejada 1), virando de frente para devolver a bola alta (seta 2) na Zona Alvo a 2m da rede.","codigo":"DEF-INI-149"},{"numero":150,"secao":9,"nome":"Leitura do ombro e do cotovelo do atacante (antecipa\u00e7\u00e3o visual)","nivel":"Intermedi\u00e1rio","jogadores":"2 ou 3 jogadores (1 atacante A1, 1 levantador L1 e 1 defensor J1)","tempo":"9 minutos","material":"5 bolas, 3 cones e 1 zona alvo LEITURA DE OMBRO E COTOVELO ALVO A1 L1 J1 1 2a","objetivo":"Treinar os olhos do defensor para ler o giro de ombro (paralela vs. diagonal) e a queda do cotovelo (forte vs. largada) antes da m\u00e3o tocar na bola.","comoMontar":"A1 e L1 na meia-quadra esquerda. Na meia-quadra direita, J1 come\u00e7a no cone central a 5,5m da rede, com 1 cone \u00e0 sua esquerda (paralela), 1 \u00e0 sua direita (diagonal) e 1 \u00e0 frente (curta). Zona Alvo a 2m da rede.","passoAPasso":["L1 levanta a bola para A1 na entrada esquerda; J1 mant\u00e9m o olhar fixo no OMBRO e no COTOVELO de A1 (n\u00e3o olha apenas para a bola)."],"pontosAtencao":["No ar, A1 d\u00e1 uma pista corporal clara antes de bater:2 Pista 1: A1 mant\u00e9m o cotovelo alto e aponta o peito/ombro para a linha -> J1 antecipa 1 passo lateral para a esquerda e defende o ataque na paralela. 3 Pista 2: A1 gira o peito para o meio da quadra -> J1 antecipa 1 passo para a direita e defende na diagonal. 4 Pista 3: A1 abaixa o cotovelo ou desacelera o bra\u00e7o -> J1 grita 'CURTA!' antes mesmo do toque na bola e dispara para a frente salvando o pingo! 5 Todas as defesas devem subir na Zona Alvo central; trocam a cada 10 ataques. 6 Um defensor que espera a bola sair da m\u00e3o do atacante para come\u00e7ar a ler chega sempre atrasado na areia: a leitura acontece nos \u00faltimos 0,3 segundos ANTES do impacto!","Cotovelo alto + costas arqueadas = vem pancada; cotovelo baixo ou m\u00e3o na frente da testa = vem bola curta.","Fa\u00e7a o 'split-step' (destrave dos p\u00e9s na areia) no exato momento em que o atacante tira os p\u00e9s do ch\u00e3o."],"erroComum":"Ficar hipnotizado olhando s\u00f3 para a bola subindo e descendo sem olhar para o corpo do atacante; corrija pedindo para J1 gritar 'FORTE!' ou 'CURTA!' um instante antes da batida. Varia\u00e7\u00f5es","variacaoFacil":"A1 faz o ataque com os p\u00e9s no ch\u00e3o sobre um caixote, exagerando no giro de ombros para facilitar a leitura inicial.","variacaoDificil":"A1 tenta esconder o golpe at\u00e9 o \u00faltimo milissegundo, testando a rea\u00e7\u00e3o pura de J1.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 1 dupla atacando na esquerda e uma fila de defensores no cone central da direita. Cada defensor l\u00ea e defende 3 ataques variados seguidos antes de rodar.","meta":"Antecipar corretamente a dire\u00e7\u00e3o/velocidade e defender 7 de 10 ataques dentro da Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta (seta 1) para A1 na esquerda. J1 no cone central a 5,5m na direita l\u00ea o ombro e cotovelo de A1, antecipando o deslocamento (setas tracejadas) para a paralela, diagonal ou curta para interceptar o ataque (setas 2a, 2b, 2c) e enviar \u00e0 Zona Alvo (seta 3).","codigo":"DEF-INT-150"},{"numero":151,"secao":9,"nome":"Leitura da qualidade do levantamento (ajustando a profundidade da base)","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (A1 atacante, L1 levantador e J1 defensor)","tempo":"9 minutos","material":"5 bolas, 4 cones e 1 zona alvo AJUSTE DE PROFUNDIDADE (6m 4m) ALVO 2m A1 L1 J1 1b","objetivo":"Aprender a recuar ou adiantar a base de defesa na areia conforme o levantamento advers\u00e1rio saia perfeito na rede ou afastado no fundo.","comoMontar":"A1 e L1 na meia-quadra esquerda. Na meia-quadra direita, marque duas linhas de cones para J1: Linha Recuada (a 6 metros da rede) e Linha Adiantada (a 4 metros da rede). Zona Alvo a 2m da rede.","passoAPasso":["Regra T\u00e1tica de Leitura na Praia: a posi\u00e7\u00e3o do levantamento advers\u00e1rio dita onde a bola pode cair na sua quadra!","A1 passa a bola para L1; L1 varia propositalmente o levantamento entre duas dist\u00e2ncias:","Situa\u00e7\u00e3o A (Levantamento Perfeito a 1m\u20131,5m da rede): como A1 tem \u00e2ngulo para cravar para baixo com for\u00e7a total, J1 permanece firme na Linha Recuada (aos 6m) em postura baixa para amortecer a pancada.","Situa\u00e7\u00e3o B (Levantamento Ruim/Afastado a 3,5m\u20134m da rede): como de longe da rede A1 N\u00c3O consegue bater para baixo (a rede impede!) e s\u00f3 pode mandar bola com arco ou largada curta, J1 avan\u00e7a imediatamente 2 metros na areia at\u00e9 a Linha Adiantada (aos 4m) enquanto a bola ainda est\u00e1 no ar!","J1 estanca aos 4m e defende f\u00e1cil a bola colocada ou o ataque em arco; rodam a cada 8 bolas."],"pontosAtencao":["Muitos defensores ficam enterrados l\u00e1 nos 6,5 metros mesmo quando o advers\u00e1rio vai atacar l\u00e1 do fundo da quadra dele, levando ponto bobo de largada no meio: se o levantamento deles ficou longe da rede, AVANCE!","Da mesma forma, se o levantamento ficou muito baixo (abaixo da fita da rede), o atacante s\u00f3 pode empurrar a bola para cima: d\u00ea 2 passos para frente!","Sempre pare os dois p\u00e9s na nova base antes da m\u00e3o do atacante tocar na bola."],"erroComum":"Continuar correndo para a frente na hora exata em que o atacante bate na bola l\u00e1 dos 4m e tomar um lob por cima da cabe\u00e7a; corrija exigindo parada total na linha de 4m no instante do golpe. Varia\u00e7\u00f5es","variacaoFacil":"L1 grita 'PERTO!' ou 'LONGE!' ao levantar para criar o reflexo de ajuste de base em J1.","variacaoDificil":"Incluir uma 3\u00aa situa\u00e7\u00e3o: levantamento passado demais para fora da antena (onde J1 fecha tudo para a diagonal porque A1 n\u00e3o pode bater na paralela).","paraTurma":"Em turmas de 4 a 12 alunos, jogue com duplas de defensores no lado direito ajustando a profundidade juntas conforme o levantamento de L1 no lado esquerdo.","meta":"Ajustar a base no tempo certo e defender 7 de 10 bolas colocando-as na Zona Alvo central.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 na esquerda varia o levantamento: se levantar perto da rede (1a), J1 mant\u00e9m a base recuada aos 6m; se o levantamento ficar longe aos 3,5m (1b), J1 avan\u00e7a imediatamente para a base adiantada aos 4m (seta tracejada 1) para defender o ataque (seta 2) na Zona Alvo (seta 3).","codigo":"DEF-INT-151"},{"numero":152,"secao":9,"nome":"T\u00e9cnica segura de peixinho e deslize na areia fofa","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (1 lan\u00e7ador/atacante A1 e 1 defensor J1)","tempo":"9 minutos","material":"5 bolas, 2 cones e 1 zona alvo ZONA DE PEIXINHO FRONTAL ALVO 2m A1 J1 1 1 2 Entrada rasante de peito + Queixo erguido no deslize","objetivo":"Executar o mergulho frontal (peixinho) entrando rente \u00e0 areia sem bater os joelhos ou cotovelos, salvando bolas a 3 metros de dist\u00e2ncia.","comoMontar":"J1 come\u00e7a no cone a 5,5 metros da rede na meia- quadra direita. A1 fica junto \u00e0 rede na esquerda com bolas. Zona Alvo central a 2 metros da rede na direita.","passoAPasso":["J1 posiciona-se em base bem baixa aos 5,5 metros.","A1 envia uma bola curta e r\u00e1pida a cerca de 2,5 a 3 metros \u00e0 frente/diagonal de J1 (uma bola que n\u00e3o d\u00e1 para alcan\u00e7ar apenas correndo em p\u00e9).","J1 d\u00e1 2 passos explosivos mantendo o peito pr\u00f3ximo ao joelho da frente e, no \u00faltimo apoio, projeta o corpo horizontalmente rente \u00e0 areia (nunca pulando para cima antes de cair!).","Toca por baixo da bola (com a manchete ou com o dorso/n\u00f3 da m\u00e3o fechada) antes de o corpo tocar o solo, levanta o queixo olhando para a bola subir e desliza sobre o peito/abd\u00f4men amortecendo com as m\u00e3os ao lado do peito.","Empurra a areia imediatamente para ficar de p\u00e9; trocam a cada 6 peixinhos."],"pontosAtencao":["Seguran\u00e7a na areia: NUNCA mergulhe apontando a ponta do joelho ou a ponta do cotovelo para baixo!","Entre rasante como um avi\u00e3o pousando de barriga na areia e mantenha o queixo erguido.","Se a bola estiver a 1 cent\u00edmetro da areia, use uma m\u00e3o s\u00f3 espalmada no ch\u00e3o ou fechada em punho para criar um cal\u00e7o embaixo da bola.","Toque na bola de baixo para cima (dando arco de 4 metros) para dar tempo de voc\u00ea se levantar."],"erroComum":"Parar de correr cedo demais e se jogar de cima para baixo batendo pesado na areia; corrija pedindo um passo de afundo longo antes de deslizar o peito. Varia\u00e7\u00f5es","variacaoFacil":"Come\u00e7ar ajoelhado com um p\u00e9 \u00e0 frente a 3,5m da rede para treinar apenas o impulso rasante, o toque na bola e o deslize de peito.","variacaoDificil":"Logo ap\u00f3s salvar a primeira bola de peixinho, A1 solta uma segunda bola a 2 metros para o outro lado obrigando J1 a levantar em 1 segundo.","paraTurma":"Em turmas de 4 a 12 alunos, divida em 2 corredores de mergulho na quadra direita. Os alunos fazem 1 peixinho, alisam a areia com o p\u00e9 ao levantar e voltam pela lateral para a fila.","meta":"Salvar 6 de 10 bolas no mergulho frontal fazendo-as subir limpas at\u00e9 a Zona Alvo com queda suave e segura.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 na rede esquerda envia bola curta esticada (seta 1) aos 2,5m da quadra direita. J1 parte do cone de 5,5m em arrancada e mergulho de peixinho (seta tracejada 1), salva a bola rente \u00e0 areia e a levanta (seta 2) para a Zona Alvo a 2m da rede.","codigo":"DEF-INT-152"},{"numero":153,"secao":9,"nome":"Mergulho lateral com extens\u00e3o de um bra\u00e7o (alcance m\u00e1ximo nas linhas)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (1 atacante/lan\u00e7ador A1 e 1 defensor J1)","tempo":"9 minutos","material":"5 bolas, 3 cones e 1 zona alvo ALVO 2mA1 J1 1a 1b 1 2 Quadra 16x8m vista de cima. A1 na rede esquerda envia bolas abertas nas duas","objetivo":"Aumentar o raio de alcance lateral usando a impuls\u00e3o da perna externa e a defesa de um bra\u00e7o s\u00f3 (punho/antebra\u00e7o) quando n\u00e3o d\u00e1 tempo de unir as duas m\u00e3os.","comoMontar":"Na meia-quadra direita, coloque 1 cone central a 5m da rede (J1) e 2 cones junto \u00e0s linhas laterais (a 3,5m de cada lado de J1). Zona Alvo no centro a 2m da rede. A1 na rede esquerda.","passoAPasso":["J1 come\u00e7a no cone central (5m).","A1 bate ou lan\u00e7a uma bola r\u00e1pida e baixa bem aberta na dire\u00e7\u00e3o de um dos cones da linha lateral (3,5 metros longe de J1).","Quando a bola vai muito longe para o lado, tentar correr com as duas m\u00e3os juntas reduz o seu alcance em meio metro! J1 d\u00e1 1 passo cruzado explosivo e se projeta lateralmente esticando apenas o BRA\u00c7O DE FORA.","J1 toca por baixo da bola com o ter\u00e7o firme do antebra\u00e7o ou com o punho fechado virado para cima, trazendo a bola alta de volta para o centro da quadra (Zona Alvo).","Amortece a queda rolando sobre a lateral da coxa/costas na areia fofa e levanta r\u00e1pido; realiza 4 para a direita e 4 para a esquerda."],"pontosAtencao":["Quando usar um bra\u00e7o s\u00f3 na defesa de praia, trave o punho r\u00edgido e aponte a superf\u00edcie interna do antebra\u00e7o para o centro da sua quadra (nunca para fora da linha lateral).","Caia absorvendo o impacto na lateral do gl\u00fateo e das costas (rolamento lateral), nunca apoiando a m\u00e3o esticada para tr\u00e1s para n\u00e3o for\u00e7ar o punho ou o ombro.","Mire a bola bem alta (5 metros) no meio da quadra para o seu parceiro alcan\u00e7ar."],"erroComum":"Tentar levar as duas m\u00e3os juntas numa bola a 3,5 metros de dist\u00e2ncia lateral e a bola bater na ponta dos dedos indo para fora; corrija liberando o uso de um bra\u00e7o s\u00f3 nas bolas nos cones extremos. Varia\u00e7\u00f5es","variacaoFacil":"Posicionar os cones laterais a 2,5 metros do centro.","variacaoDificil":"A1 finta o olhar para um lado e lan\u00e7a a bola r\u00e1pida no cone lateral oposto.","paraTurma":"Em turmas de 4 a 12 alunos, 1 lan\u00e7ador na rede alimenta a fila central de defensores alternando uma bola na linha esquerda e outra na linha direita.","meta":"Recuperar 6 de 10 bolas extremas nas linhas laterais com um bra\u00e7o trazendo-as para dentro da Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 na rede esquerda envia bolas abertas nas duas linhas laterais (setas 1a e 1b) aos cones a 5m da rede direita. J1 parte do cone central em mergulho lateral com extens\u00e3o de um bra\u00e7o (setas tracejadas) e levanta a bola (setas 2) para a Zona Alvo central.","codigo":"DEF-INT-153"},{"numero":154,"secao":9,"nome":"Defesa no corredor da paralela (com bloqueio fechando a diagonal - Sinal 2)","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (B1 bloqueador + J1 defensor contra A1 atacante + L1 levantador)","tempo":"10 minutos","material":"5 bolas, 2 cones e 1 zona alvo SINAL 2: BLOQUEIO FECHA DIAGONAL \u00c1REA DE DEFESA J1: CORREDOR PARALELA ALVO 2m A1 L1 B1","objetivo":"Posicionar-se corretamente na 'janela limpa' ao lado do bloqueio quando o parceiro mostra 2 dedos (fecha a diagonal), cobrindo o tiro na linha e o lob.","comoMontar":"Na meia-quadra esquerda: A1 na ponta superior e L1 no centro. Na meia-quadra direita: B1 na rede mostrando 2 dedos (fecha a diagonal) e J1 posicionado no corredor da paralela superior a 5,5m da rede e a 1,2m da linha lateral. Zona Alvo a 2m da rede.","passoAPasso":["Antes da jogada, B1 mostra o sinal de 2 dedos nas costas para J1 (indicando que B1 vai trancar a diagonal de A1).","L1 levanta para A1 na ponta; B1 d\u00e1 um passo para dentro na rede fechando toda a sombra da diagonal.","Enquanto B1 se posiciona, J1 ajusta a sua base a 5,5m da rede e a 1,2m da linha lateral, garantindo que consiga enxergar a bola e o bra\u00e7o de A1 PELA LATERAL EXTERNA do bloqueio de B1 (nunca fique escondido atr\u00e1s das costas do seu bloqueador!).","A1 ataca no corredor livre da paralela (cortada forte na linha, lob no fundo da linha ou pingo atr\u00e1s do bloqueio).","J1 defende no corredor da paralela subindo a bola na Zona Alvo central para B1 sair da rede e levantar; trocam ap\u00f3s 8 bolas."],"pontosAtencao":["Regra de Ouro do Defensor com Bloqueio: se voc\u00ea n\u00e3o est\u00e1 enxergando os olhos e o ombro do atacante porque o seu bloqueador est\u00e1 na sua frente, VOC\u00ca est\u00e1 no lugar errado!","D\u00ea meio passo para o lado at\u00e9 sair da sombra do bloqueio.","No corredor da paralela, mantenha o seu p\u00e9 de fora (p\u00e9 pr\u00f3ximo \u00e0 linha lateral) levemente \u00e0 frente para rebater a bola para o centro da quadra e n\u00e3o deix\u00e1-la espirrar para a arquibancada.","Fique atento a duas bolas principais na paralela: a pancada no seu peito (aos 5,5m) e o lob por cima do bloqueio l\u00e1 no canto de 8m."],"erroComum":"Ficar muito no meio da quadra desconfiando do bloqueio de B1 e tomar ponto na linha paralela que era sua responsabilidade; corrija desenhando o corredor de 3m da paralela que pertence a J1. Varia\u00e7\u00f5es","variacaoFacil":"A1 s\u00f3 pode atacar na paralela (batida forte ou lob), respeitando 100% o bloqueio de diagonal de B1.","variacaoDificil":"A1 tem liberdade total e J1 precisa ler se a bola passou limpa na linha ou se desviou no dedo de B1.","paraTurma":"Em turmas de 4 a 12 alunos, trabalhe com duplas completas de defesa (B1 + J1) recebendo 5 ataques seguidos na configura\u00e7\u00e3o de Sinal 2 (Bloco Diagonal / Defesa Paralela).","meta":"Defender 7 de 10 bolas atacadas no corredor da paralela colocando-as altas na Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta (seta 1) para A1 na esquerda. Na direita, B1 fecha a sombra da diagonal no meio. J1 posiciona-se a 5,5m da rede no corredor superior da paralela (\u00e1rea azul tracejada), defende o ataque na linha ou lob de A1 (seta 2) e envia para a Zona Alvo central (seta 3).","codigo":"DEF-INT-154"},{"numero":155,"secao":9,"nome":"Defesa na diagonal (com bloqueio fechando a paralela - Sinal 1)","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (B1 bloqueador + J1 defensor contra A1 atacante + L1 levantador)","tempo":"10 minutos","material":"5 bolas, 2 cones e 1 zona alvo SINAL 1: BLOQUEIO FECHA PARALELA \u00c1REA DE DEFESA J1: DIAGONAL (45\u00b0) ALVO 2m A1 L1 B1","objetivo":"Cobrir toda a largura da diagonal aberta quando o bloqueador mostra 1 dedo (fecha a linha), ajustando o \u00e2ngulo corporal para defender cortes fortes e cut shots.","comoMontar":"Na meia-quadra esquerda: A1 na ponta superior e L1 no centro. Na meia-quadra direita: B1 na rede mostrando 1 dedo (fecha a paralela superior) e J1 posicionado na diagonal inferior a 5 metros da rede. Zona Alvo central a 2m da rede.","passoAPasso":["B1 mostra 1 dedo nas costas (fechando a paralela de A1).","Quando o levantamento sobe para A1, B1 fecha a linha junto \u00e0 antena e J1 corre para a posi\u00e7\u00e3o de defesa na diagonal (a 5m da rede e a 2,5m da linha lateral oposta).","Detalhe t\u00e9cnico vital na diagonal: J1 posiciona o corpo VIRADO DE FRENTE PARA O ATACANTE A1 (em diagonal de 45 graus, e n\u00e3o virado reto para a rede!).","Como a diagonal \u00e9 muito larga, J1 fica com o peso na ponta dos p\u00e9s pronto para duas bolas: a pancada cruzada no corpo ou o 'cut shot' curto perto da linha lateral aos 2,5m.","J1 defende o ataque cruzado de A1 mandando a bola alta na Zona Alvo central; rodam a cada 8 bolas."],"pontosAtencao":["Na defesa de diagonal, o seu p\u00e9 mais pr\u00f3ximo da linha lateral (p\u00e9 da frente na diagonal) deve estar meio passo adiantado para fechar a porta e jogar a bola defendida de volta para o meio da quadra.","Nunca fique a 7 metros de dist\u00e2ncia quando estiver defendendo a diagonal: a diagonal j\u00e1 \u00e9 longa por natureza; posicione-se aos 4,5m\u20135m para alcan\u00e7ar tamb\u00e9m o cut shot!","Enxergue o atacante por DENTRO do bloqueio do seu parceiro."],"erroComum":"Ficar com os dois p\u00e9s paralelos virados para a fita da rede ao defender uma bola que vem cruzada em diagonal, fazendo a bola bater num bra\u00e7o s\u00f3 e sair pela lateral; corrija alinhando o umbigo de J1 direto para o ombro de A1. Varia\u00e7\u00f5es","variacaoFacil":"A1 ataca apenas cortadas de meia-for\u00e7a e fortes na diagonal de J1.","variacaoDificil":"A1 alterna livremente entre pancada na diagonal funda e cut shot curto na antena oposta.","paraTurma":"Em turmas de 4 a 12 alunos, alterne as duplas de defesa a cada 5 bolas, praticando na primeira rodada pela entrada esquerda e na segunda rodada pela sa\u00edda direita.","meta":"Defender 7 de 10 ataques cruzados na diagonal (fortes ou curtos) colocando a bola na Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta (seta 1) para A1 na ponta superior esquerda. B1 fecha a sombra da paralela superior na rede direita. J1 posiciona-se na \u00e1rea de cobertura da diagonal inferior (a 5m da rede, virado em 45\u00b0 para A1), defende o ataque cruzado (seta 2) e envia \u00e0 Zona Alvo (seta 3).","codigo":"DEF-INT-155"},{"numero":156,"secao":9,"nome":"Defesa com dois jogadores no fundo (divis\u00e3o 50/50 ap\u00f3s sa\u00edda do bloqueio)","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (J1 e J2 defensores contra A1 + L1)","tempo":"10 minutos","material":"5 bolas, 2 cones e 1 zona alvo METADE INFERIOR: J1 (4x8m) ALVO 2m A1 L1 J2 J1","objetivo":"Coordenar a divis\u00e3o exata da quadra ao meio (4m de largura para cada defensor) quando o bloqueador faz o 'pulling' e recua para defender sem bloqueio.","comoMontar":"A1 e L1 na meia-quadra esquerda. Na meia-quadra direita, J2 come\u00e7a na rede (falso bloqueio) e J1 no fundo; coloque 2 cones a 5 metros da rede marcando o centro de cada metade da quadra (metade superior para J2 e metade inferior para J1). Zona Alvo a 2m da rede.","passoAPasso":["J2 mostra a m\u00e3o fechada atr\u00e1s das costas (sinal de que vai retirar da rede e jogar com 2 defensores no fundo).","Assim que L1 levanta a bola para A1, J1 j\u00e1 ocupa o cone da metade inferior (diagonal) aos 5 metros e grita 'VEM PRA LINHA!'.","J2 retira r\u00e1pido da rede at\u00e9 o cone da metade superior (paralela) e estanca os dois p\u00e9s aos 5 metros simultaneamente com J1.","Com os dois plantados lado a lado cobrindo 4 metros cada um, A1 ataca em qualquer lugar da quadra.","Quem estiver no lado da bola defende alto para a Zona Alvo central e o parceiro que n\u00e3o defendeu j\u00e1 avan\u00e7a imediatamente para levantar!"],"pontosAtencao":["Quando os dois defendem no fundo sem bloqueio, quem manda nas bolas que v\u00eam na 'costura' (no meio entre os dois)?","Regra padr\u00e3o da praia: o defensor que J\u00c1 estava no fundo (J1) tem a prefer\u00eancia de fechar o meio porque est\u00e1 mais equilibrado que o parceiro que acabou de correr da rede!","Se A1 largar uma bola curta na frente da paralelo, \u00e9 responsabilidade de quem retirou da rede (J2) voltar para pegar, pois est\u00e1 no corredor dele.","Ambos precisam estar 100% parados na areia na hora da batida."],"erroComum":"O bloqueador que retira (J2) correr demais para o meio da quadra invadindo o espa\u00e7o de J1 e deixando o corredor da linha totalmente vazio; corrija marcando uma linha divis\u00f3ria na areia no meio da quadra. Varia\u00e7\u00f5es","variacaoFacil":"L1 faz levantamentos altos e afastados (aos 3m da rede) dando bastante tempo para J2 retirar e dividir a quadra com J1.","variacaoDificil":"J2 decide na leitura (se o levantamento for perto ele bloqueia; se for longe ele grita 'SA\u00cd!' e retira), exigindo que J1 adapte sua posi\u00e7\u00e3o no fundo em tempo real.","paraTurma":"Em turmas de 4 a 12 alunos, jogue 2x2 onde a dupla defensora soma 2 pontos toda vez que defender uma bola com os 2 jogadores no fundo e converter a transi\u00e7\u00e3o.","meta":"Defender 7 de 10 ataques no sistema com 2 defensores no fundo sem bater cabe\u00e7a no meio e colocando na Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta (seta 1) para A1 na esquerda. Na direita, J2 retira da rede (seta tracejada 1) para o cone superior aos 5m enquanto J1 ocupa o cone inferior aos 5m, dividindo a quadra em duas \u00e1reas de cobertura iguais (4x8m). O defensor acionado pelo ataque (seta 2) sobe a bola na Zona Alvo (seta 3).","codigo":"DEF-INT-156"},{"numero":157,"secao":9,"nome":"Cobertura do ataque do pr\u00f3prio parceiro (recuperando o bloqueio advers\u00e1rio)","nivel":"Intermedi\u00e1rio","jogadores":"3 ou 4 jogadores (A1 atacante + J1 levantador/cobertura contra B1 bloqueador)","tempo":"9 minutos","material":"5 bolas, 2 cones e 1 zona alvo COBERTURA J1 (2,5m)A1 J1 B1 1 1 2","objetivo":"Criar o h\u00e1bito autom\u00e1tico no levantador de nunca ficar parado olhando o parceiro atacar, aproximando-se em base baixa para salvar a bola que volta do bloqueio.","comoMontar":"Na meia-quadra esquerda: A1 na ponta superior e J1 (levantador que far\u00e1 a cobertura) no centro. Na meia- quadra direita: B1 na rede com a miss\u00e3o de bloquear todas as bolas de A1 para baixo.","passoAPasso":["J1 faz o levantamento para A1 na ponta esquerda.","O que 90% dos amadores fazem ap\u00f3s levantar? Ficam em p\u00e9 com os joelhos esticados olhando A1 bater e levam ponto quando a bola bate no bloqueio de B1 e cai a 2 metros deles!","Movimento obrigat\u00f3rio de J1: assim que a bola sai de suas m\u00e3os no levantamento, J1 d\u00e1 2 passos formando um semic\u00edrculo atr\u00e1s de A1 (posicionando-se a 2,5 metros de dist\u00e2ncia de A1, no centro-curto da quadra) e ABAIXA O QUADRIL quase tocando a areia!","A1 bate propositalmente contra o pared\u00e3o de m\u00e3os de B1 para a bola rebater de volta na quadra esquerda.","J1 reage em mergulho ou manchete baixa salvando a bola do bloqueio (1\u00ba toque) bem alta no centro para A1 levantar (2\u00ba toque) e J1 atacar na segunda chance (3\u00ba toque)!"],"pontosAtencao":["Na praia, cobrir o ataque do parceiro ganha jogos: o advers\u00e1rio comemora achando que fez um 'Monster Block', voc\u00ea salva a bola a 5 cm da areia e vira o ponto!","Posicione-se a 2,5m\u20133m atr\u00e1s e por dentro do seu atacante, exatamente no \u00e2ngulo para onde as m\u00e3os do bloqueador B1 est\u00e3o apontando.","Fique muito baixo (peito quase no joelho), porque a bola que volta do bloqueio desce muito r\u00e1pido."],"erroComum":"Colar demais embaixo dos p\u00e9s do pr\u00f3prio atacante (a 50 cm dele) e levar a bolada do bloqueio no rosto ou nas costas; corrija mantendo um raio de 2,5 metros ao redor do atacante. Varia\u00e7\u00f5es","variacaoFacil":"O professor fica do outro lado da rede segurando um escudo ou bola e rebate o ataque de A1 de forma controlada na dire\u00e7\u00e3o da cobertura de J1.","variacaoDificil":"B1 salta bloqueando pra valer e A1 tenta passar por B1; toda bola que bater em B1 e voltar na quadra esquerda vale 3 pontos se J1 salvar na cobertura!","paraTurma":"Em turmas de 4 a 12 alunos, 2 bloqueadores ficam na rede direita tentando abafar os ataques da esquerda; a dupla da esquerda ganha vida extra na quadra toda vez que o levantador salvar um bloqueio na cobertura.","meta":"Recuperar para o alto pelo menos 6 de 10 bolas que rebateram no bloqueio advers\u00e1rio reconstruindo a jogada.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 levanta para A1 (seta 1) e imediatamente avan\u00e7a em base baixa para a \u00e1rea de cobertura a 2,5m atr\u00e1s de A1 (seta tracejada 1). A1 ataca (seta 2) no bloqueio de B1; a bola rebate de volta (seta 3) e J1 salva na cobertura subindo para o centro (seta 4).","codigo":"DEF-INT-157"},{"numero":158,"secao":9,"nome":"Defesa de bola que desvia na borda do bloqueio (rea\u00e7\u00e3o e mudan\u00e7a de dire\u00e7\u00e3o)","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (B1 + J1 contra A1 + L1)","tempo":"10 minutos","material":"5 bolas e 1 zona alvo REA\u00c7\u00c3O AO DESVIO NO BLOCO ALVO 2\u00ba TOQUE A1 B1 J1 1 2 1","objetivo":"Manter os p\u00e9s destravados para mudar bruscamente de dire\u00e7\u00e3o na areia quando o ataque raspa no dedo do seu bloqueador e perde velocidade ou muda de rota.","comoMontar":"A1 + L1 na meia-quadra esquerda; B1 na rede e J1 no fundo da meia-quadra direita.","passoAPasso":["Uma das bolas mais dif\u00edceis de defender na areia \u00e9 aquela em que voc\u00ea j\u00e1 armou o corpo para defender uma pancada na diagonal, mas a bola raspa na pontinha do dedo do seu bloqueador B1 e cai morta no meio ou sobe para fora da linha!","L1 levanta para A1; B1 salta no bloqueio tentando tocar na bola e J1 faz o destrave no fundo.","A1 bate mirando nas bordas das m\u00e3os de B1 (ou B1 abre as m\u00e3os em 'spread block' para raspar na bola).","Assim que a bola desvia na m\u00e3o de B1 (1\u00ba toque da dupla!), J1 freia o p\u00e9 de apoio na areia, muda de dire\u00e7\u00e3o para perseguir a bola desviada e usa o 2\u00ba contato j\u00e1 como LEVANTAMENTO alto para B1 (que desceu da rede) atacar no 3\u00ba toque!","Lembrete: como tocou no bloqueio de B1, o contato de J1 no fundo j\u00e1 \u00e9 o 2\u00ba toque da dupla!"],"pontosAtencao":["Para conseguir mudar de dire\u00e7\u00e3o quando a bola raspa no bloqueio, voc\u00ea NUNCA pode cravar os calcanhares na areia nem adivinhar o lado correndo antes da batida: fique na ponta dos p\u00e9s em equil\u00edbrio!","Ou\u00e7a o barulho do impacto na rede e o grito 'TOCOU!' do seu bloqueador: se tocou no bloco, a sua defesa j\u00e1 tem que ir direto para a ponta da rede como levantamento.","Se a bola raspou no bloqueio e est\u00e1 indo para fora da quadra na lateral, corra para fora da fita e traga-a alta para os 2 metros da rede."],"erroComum":"Comprometer todo o peso do corpo caindo para um lado antes de a bola passar pelo bloqueio, ficando preso na areia quando a bola desvia; corrija exigindo base equilibrada nos dois p\u00e9s no instante do salto de B1. Varia\u00e7\u00f5es","variacaoFacil":"O treinador fica na rede e desvia manualmente as bolas atacadas por A1 para J1 reagir e levantar no 2\u00ba toque.","variacaoDificil":"A1 mistura bolas que passam limpas sem tocar no bloco (3 toques dispon\u00edveis) e bolas que raspam na m\u00e3o de B1 (apenas 2 toques restantes).","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a baterias de 5 bolas por dupla de defesa: cada bola desviada no bloqueio que J1 busca e transforma em levantamento para ataque de B1 vale 2 pontos.","meta":"Reagir ao desvio no bloqueio e entregar um levantamento atac\u00e1vel no 2\u00ba contato em 6 de 10 bolas desviadas.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 ataca (seta 1) e a bola raspa na borda da m\u00e3o do bloqueador B1, mudando de trajet\u00f3ria e caindo mais curta/aberta (seta 2). J1 que estava na base aos 5,5m muda bruscamente de dire\u00e7\u00e3o na areia (seta tracejada 1), salva no 2\u00ba toque j\u00e1 levantando para a Zona Alvo (seta 3) onde B1 ataca.","codigo":"DEF-INT-158"},{"numero":159,"secao":9,"nome":"Defesa do 'cut shot' extremo (diagonal curt\u00edssima junto \u00e0 antena)","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (B1 + J1 contra A1 + L1)","tempo":"10 minutos","material":"5 bolas, 2 cones e 1 zona alvo BLOQUEIO PARALELA ZONA CUT SHOT (2m) ALVO 2m A1 B1 J1 1","objetivo":"Antecipar o giro de punho do atacante e cruzar a quadra em sprint diagonal m\u00e1ximo para salvar o cut shot a 1,5 metro da rede e da linha lateral.","comoMontar":"A1 na ponta superior esquerda e L1 no centro. Na meia-quadra direita, B1 fecha a paralela superior na rede; J1 come\u00e7a na base de diagonal (a 5m da rede). Coloque 2 cones demarcando a 'Zona Cr\u00edtica de Cut Shot' na lateral inferior direita (a 2m da rede).","passoAPasso":["Quando B1 tranca bem a linha paralela, a jogada favorita dos atacantes avan\u00e7ados na praia \u00e9 o 'cut shot' (cortar a bola fininha cruzando a rede para morrer aos 2 metros perto da antena oposta).","J1 posiciona-se na diagonal a 4,5m\u20135m da rede.","Quando A1 sobe para atacar, J1 observa a velocidade do bra\u00e7o e o giro do polegar de A1: ao perceber que A1 virou o punho para fora cortando o \u00e2ngulo, J1 dispara em diagonal para a frente/direita em velocidade m\u00e1xima.","No \u00faltimo passo dentro da Zona Cr\u00edtica de Cut Shot (aos 2m da rede), J1 mergulha estendendo o bra\u00e7o direito por baixo da bola com o punho/antebra\u00e7o virado para DENTRO da quadra.","A bola sobe alta para a Zona Alvo central onde B1 (saindo do bloqueio) levanta para J1!"],"pontosAtencao":["Detalhe t\u00e9cnico que salva o cut shot: quando voc\u00ea corre em dire\u00e7\u00e3o \u00e0 linha lateral para salvar o cut shot, se voc\u00ea tocar na bola com o bra\u00e7o reto, a bola continua indo para fora da lateral!","Voc\u00ea precisa virar o polegar/antebra\u00e7o para tr\u00e1s (para o centro da sua quadra).","Se voc\u00ea perceber que o atacante tem o v\u00edcio de dar cut shot toda hora, d\u00ea meio passo mais para a frente e para a lateral antes da batida.","Levante da areia imediatamente ap\u00f3s o mergulho porque voc\u00ea j\u00e1 est\u00e1 embaixo da rede pronto para bater o contra- ataque!"],"erroComum":"Correr em linha reta para a frente e depois tentar virar para o lado, fazendo um 'L' lento na areia; corrija correndo em linha reta diagonal diretamente para o ponto onde a bola vai tocar a areia. Varia\u00e7\u00f5es","variacaoFacil":"A1 ataca exclusivamente bolas de cut shot (variando entre 2m e 3,5m da rede) para J1 calibrar o \u00e2ngulo do sprint e do punho.","variacaoDificil":"A1 finta a pancada forte no fundo e solta o cut shot (ou bate forte se J1 sair cedo demais da base de 5m).","paraTurma":"Em turmas de 4 a 12 alunos, duelo de especialistas: os atacantes ganham ponto se o cut shot pingar na areia; os defensores ganham 2 pontos toda vez que buscarem o cut shot no mergulho colocando na Zona Alvo.","meta":"Salvar 6 de 10 bolas de cut shot extremo trazendo-as altas para dentro da Zona Alvo central.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 na ponta superior esquerda corta um 'cut shot' agudo (seta 1) por tr\u00e1s do bloqueio de B1 rumo \u00e0 lateral inferior direita (a 2m da rede). J1 sai da base de 5m em sprint diagonal e mergulho (seta tracejada 1), salva na lateral e levanta a bola (seta 2) para a Zona Alvo central.","codigo":"DEF-AVA-159"},{"numero":160,"secao":9,"nome":"Jogo de 'Gato e Rato': finta de defesa para induzir o erro do atacante","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (B1 + J1 contra A1 + L1)","tempo":"10 minutos","material":"5 bolas e 2 cones BLOQUEIO LINHA POSI\u00c7\u00c3O REAL (DIAGONAL) ALVO 2m FIN TAA1 L1 B1 J1","objetivo":"Enganar a vis\u00e3o perif\u00e9rica do atacante mostrando um corredor aberto enquanto ele olha para a quadra e correr para fechar esse mesmo corredor quando ele olha para a bola.","comoMontar":"Dupla A1 + L1 na esquerda; Dupla B1 (bloqueio) + J1 (defesa) na direita.","passoAPasso":["Como funciona o 'Gato e Rato' no v\u00f4lei de praia? O atacante A1 sempre d\u00e1 uma olhada r\u00e1pida para a sua quadra quando o levantamento sobe e depois precisa voltar os olhos para a bola na hora de bater.","Antes do saque, B1 mostra 1 dedo (vai bloquear a paralela) e J1 sabe que sua responsabilidade real \u00e9 defender a DIAGONAL.","Finta Visual de J1 (O 'Queijo'): enquanto o levantamento de L1 est\u00e1 subindo (e A1 est\u00e1 espiando a defesa), J1 fica parado atr\u00e1s de B1 na PARALELA, deixando toda a diagonal escancarada e vazia de prop\u00f3sito!","A1 v\u00ea a diagonal vazia e decide na cabe\u00e7a dele: 'Vou bater na diagonal!'.","No exato instante em que A1 levanta a cabe\u00e7a para olhar a bola e saltar, J1 d\u00e1 2 passos cruzados explosivos em sil\u00eancio para a DIAGONAL, estanca os dois p\u00e9s e a bola batida por A1 vem direto no peito de J1!"],"pontosAtencao":["Regra de ouro do Gato e Rato: voc\u00ea tem que come\u00e7ar a finta cedo (mostrando o lugar falso) e terminar de correr para o lugar verdadeiro ANTES da m\u00e3o do atacante bater na bola!","Se voc\u00ea ainda estiver correndo na hora da batida, voc\u00ea toma contrap\u00e9.","Voc\u00ea tamb\u00e9m pode fazer a finta de profundidade: mostrar que est\u00e1 colado aos 3,5m (convidando o atacante a dar um lob no fundo) e recuar r\u00e1pido aos 6,5m para pegar o lob na m\u00e3o!","Use o Gato e Rato de forma cir\u00fargica (2 ou 3 vezes por set nos pontos importantes) para confundir a leitura do advers\u00e1rio."],"erroComum":"Sair atrasado da posi\u00e7\u00e3o de finta e passar correndo na hora do ataque sem parar os p\u00e9s; corrija sincronizando a corrida com o pen\u00faltimo passo de salto de A1. Varia\u00e7\u00f5es","variacaoFacil":"Treinar a finta sem bloqueador na rede (J1 mostra a paralela aberta e corre para a diagonal quando A1 salta).","variacaoDificil":"A1 tenta ler no \u00faltimo milissegundo se J1 ficou ou correu, criando um duelo mental real entre atacante e defensor.","paraTurma":"Em turmas de 4 a 12 alunos, jogue s\u00e9ries de 4 bolas: se J1 aplicar a finta de Gato e Rato fazendo A1 bater exatamente onde J1 correu para esperar, a defesa ganha 3 pontos!","meta":"Induzir e defender com sucesso pelo menos 6 de 10 ataques usando a finta visual de posicionamento.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta (seta 1) para A1. Na direita, B1 bloqueia a paralela superior. J1 come\u00e7a mostrando posi\u00e7\u00e3o falsa na paralela (c\u00edrculo tracejado) para atrair o olhar de A1 e, quando A1 sobe para bater, J1 dispara (seta tracejada 1) para a diagonal inferior, interceptando o ataque (seta 2) e subindo na Zona Alvo (seta 3).","codigo":"DEF-AVA-160"},{"numero":161,"secao":9,"nome":"Defesa com vento forte (ajuste de profundidade contra o vento e a favor)","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (B1 + J1 contra A1 + L1)","tempo":"10 minutos","material":"5 bolas e 4 cones BASE ADIANTADA (4,5m) ALVO 2,5m A1 B1 J1 1 1","objetivo":"Reposicionar a base de defesa 1,5m mais \u00e0 frente quando o advers\u00e1rio ataca contra o vento e 1m mais ao fundo quando o advers\u00e1rio ataca a favor do vento.","comoMontar":"Posicione cones de refer\u00eancia de profundidade nos dois lados da quadra: no lado onde o ataque advers\u00e1rio vem CONTRA o vento, coloque cones aos 4,5 metros; no lado onde o ataque advers\u00e1rio vem A FAVOR do vento, coloque cones aos 6,5 metros.","passoAPasso":["O vento muda completamente a geometria da defesa no v\u00f4lei de praia:","Cen\u00e1rio 1 (O advers\u00e1rio A1 est\u00e1 atacando CONTRA o vento \u2014 o vento sopra das costas de J1 para a cara de A1): qualquer bola que A1 bater ou largar vai ser freada pelo vento e cair muito mais curta! Por isso, J1 adianta sua base para os 4,5 metros da rede (quase n\u00e3o existe bola longa no fundo contra o vento forte).","Al\u00e9m disso, na hora de defender no Cen\u00e1rio 1, como o vento sopra das costas de J1 para a rede, J1 amortece a bola para os 2,5m da rede para o vento n\u00e3o jogar a defesa para o outro lado!","Cen\u00e1rio 2 (O advers\u00e1rio A1 est\u00e1 atacando A FAVOR do vento): at\u00e9 um lob fraco de A1 viaja at\u00e9 a linha de 8 metros! J1 recua sua base para os 6,5 metros e deixa sair as bolas fortes na altura do peito (pois o vento vai jog\u00e1-las fora).","Ap\u00f3s 6 bolas no Cen\u00e1rio 1, as duplas trocam de lado da quadra para treinar 6 bolas no Cen\u00e1rio 2."],"pontosAtencao":["Quando o atacante advers\u00e1rio est\u00e1 com vento FORTE nas costas dele, a sua melhor defesa muitas vezes \u00e9 a 'ESQUIVA': se ele bater forte da linha do seu quadril para cima quando voc\u00ea est\u00e1 aos 6,5m, abaixe-se que a bola vai 2 metros fora!","Quando o atacante advers\u00e1rio est\u00e1 com vento na cara dele, esque\u00e7a a linha de fundo: proteja tudo dos 4,5 metros para a frente porque o pingo contra o vento cai feito chumbo.","Ajuste tamb\u00e9m a for\u00e7a da sua manchete de defesa conforme o vento."],"erroComum":"Tentar defender pancadas na altura do ombro quando o atacante est\u00e1 batendo a favor do vento, salvando bolas que iam cair longe fora da quadra; corrija premiando com 2 pontos cada bola fora deixada sair com leitura correta. Varia\u00e7\u00f5es","variacaoFacil":"Treinar 8 bolas seguidas no mesmo lado antes de inverter a quadra.","variacaoDificil":"Trocar de lado da quadra a cada 2 pontos obrigando a dupla a reconfigurar a profundidade da defesa imediatamente.","paraTurma":"Em turmas de 4 a 12 alunos, coloque duas duplas atacando e defendendo nos dois lados simultaneamente e troque o sentido a cada 4 minutos.","meta":"Conseguir 7 de 10 a\u00e7\u00f5es defensivas corretas (defesas na zona ou esquivas certas de bolas fora) nos dois lados do vento.","descricaoDiagrama":"Quadra 16x8m vista de cima com setas de Vento Forte soprando da direita para a esquerda. Na direita (onde A1 ataca contra o vento), J1 posiciona-se adiantado aos 4,5m (seta tracejada 1) para pegar bolas freadas pelo vento (seta 1) e passa contido aos 2,5m (seta 2). Na esquerda (ataque a favor do vento), a base recua aos 6,5m.","codigo":"DEF-AVA-161"},{"numero":162,"secao":9,"nome":"Defesa + Levantamento + Contra-ataque 1: pancada na diagonal e transi\u00e7\u00e3o padr\u00e3o","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (B1 + J1 contra A1 + L1)","tempo":"11 minutos","material":"5 bolas e 2 zonas alvo BLOQUEIO LINHA DEFESA DIAGONAL J1 ZONA 2m A1 B1 J1 1 2","objetivo":"Transformar a defesa de uma cortada potente na diagonal em um contra-ataque mortal, conectando o amortecimento de J1, a sa\u00edda da rede de B1 e a chamada de ataque de J1.","comoMontar":"A1 + L1 na meia-quadra esquerda; B1 na rede (bloqueando a paralela) e J1 na diagonal (a 5,5m) na meia-quadra direita. Zona de Levantamento no centro direito (2m da rede).","passoAPasso":["L1 levanta para A1 na ponta; B1 fecha a linha paralela.","A1 bate uma cortada forte na diagonal contra J1.","1\u00ba Contato (Defesa): J1 planta os p\u00e9s na areia, amortece a pancada recolhendo o abd\u00f4men e faz a bola subir a 4,5 metros de altura no centro da quadra (a 2m da rede).","2\u00ba Contato (Transi\u00e7\u00e3o do Bloqueador): B1 aterrissa do bloqueio j\u00e1 virando o pesco\u00e7o, corre at\u00e9 o centro (2m), para os dois p\u00e9s e levanta na ponta onde J1 j\u00e1 est\u00e1 entrando.","3\u00ba Contato (Contra-ataque): J1, que n\u00e3o ficou admirando a pr\u00f3pria defesa, abre meio passo para ajustar o \u00e2ngulo, acelera na areia e finaliza o contra-ataque vencendo a defesa de A1 e L1!"],"pontosAtencao":["Para o defensor (J1): quanto mais alta voc\u00ea mandar a sua defesa (entre 4m e 5m de altura), mais tempo voc\u00ea d\u00e1 para o seu bloqueador B1 sair da rede e para voc\u00ea mesmo correr para atacar!","Defesa baixa e r\u00e1pida no v\u00f4lei de praia mata o contra-ataque da pr\u00f3pria dupla.","Assim que defender, j\u00e1 grite onde voc\u00ea quer a bola ('Bola aqui na direita!' ou 'Deixa no meio!')."],"erroComum":"O defensor amortecer a bola, cair sentado na areia e demorar 2 segundos para levantar, chegando atrasado no levantamento de B1; corrija usando o pr\u00f3prio impulso de recuo para j\u00e1 quicar de p\u00e9 e abrir para a chamada. Varia\u00e7\u00f5es","variacaoFacil":"A1 bate na diagonal com 75% de for\u00e7a para garantir um alto volume de repeti\u00e7\u00f5es completas de transi\u00e7\u00e3o.","variacaoDificil":"Ponto disputado at\u00e9 cair na areia: ap\u00f3s o contra-ataque de J1, A1 e L1 tentam defender e contra-atacar de volta.","paraTurma":"Em turmas de 4 a 12 alunos, as duplas na direita t\u00eam 4 bolas para defender e contra-atacar: se converterem 3 de 4, continuam na quadra.","meta":"Converter 6 de 10 sequ\u00eancias completas de Defesa de bola forte + Levantamento de B1 + Contra-ataque de J1.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 ataca forte na diagonal (seta 1) fugindo do bloqueio B1. J1 aos 5,5m amortece alto para a Zona Central aos 2m (seta 2). B1 sai da rede at\u00e9 o centro (seta tracejada 1) e levanta na ponta inferior (seta 3), enquanto J1 avan\u00e7a (seta tracejada 2) e crava o contra-ataque (seta 4).","codigo":"DEF-AVA-162"},{"numero":163,"secao":9,"nome":"Defesa + Levantamento + Contra-ataque 2: mergulho na curta, levantar da areia e atacar","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (B1 + J1 contra A1 + L1)","tempo":"11 minutos","material":"5 bolas MERGULHO + RECUO P/ ATACAR A1 B1 J1 1 1 2 2","objetivo":"Treinar a recupera\u00e7\u00e3o f\u00edsica explosiva de salvar uma bola curta de peixinho aos 2 metros da rede, levantar da areia, recuar 1 passo para tomar impulso e atacar.","comoMontar":"A1 + L1 na esquerda; B1 na rede e J1 a 5,5m na direita.","passoAPasso":["L1 levanta para A1; B1 salta no bloqueio.","A1 aplica uma largada curta (poke ou cut shot) que cai aos 2,5 metros da rede na quadra direita.","J1 arranca dos 5,5m e mergulha de peixinho salvando a bola a poucos cent\u00edmetros da areia, mandando-a bem alta (5m de altura) para o meio da quadra.","Enquanto B1 sai da rede para levantar a bola, J1 (que est\u00e1 deitado na areia aos 2 metros da fita!) empurra a areia com os dois bra\u00e7os em uma flex\u00e3o explosiva, fica de p\u00e9 e d\u00e1 1 passo r\u00e1pido para TR\u00c1S/FORA (aos 3,5m) para reconstruir sua dist\u00e2ncia de chamada!","B1 levanta a bola alta e a 1,5m\u20132m da rede, e J1 entra atacando para fechar o ponto!"],"pontosAtencao":["Se voc\u00ea mergulhou na frente aos 2 metros da rede e s\u00f3 levantar em p\u00e9 parado no mesmo lugar, a bola levantada pelo seu parceiro vai cair nas suas costas: levante do ch\u00e3o J\u00c1 dando 1 passo para tr\u00e1s/lado para abrir espa\u00e7o de corrida!","Dica para o levantador (B1): quando o seu parceiro est\u00e1 no ch\u00e3o depois de um peixinho na frente, levante a bola 1 metro mais ALTA e um pouco mais afastada da rede para salv\u00e1-lo!","Caso n\u00e3o d\u00ea tempo de J1 dar 3 passos ap\u00f3s levantar da areia, use o salto de 1 passo e aplique um 'poke' ou 'cut shot' inteligente."],"erroComum":"Salvar a bola de peixinho dando um toquinho baixo de 2 metros de altura, sem dar tempo nem de B1 chegar nem de J1 levantar da areia; corrija exigindo que a bola de peixinho suba acima do topo das antenas. Varia\u00e7\u00f5es","variacaoFacil":"A1 solta a bola curta um pouco mais alta para J1 salvar em afundo profundo sem precisar deitar totalmente o peito.","variacaoDificil":"A1 mistura sem aviso pancada no fundo (exerc\u00edcio 162) e pingo curto na frente (exerc\u00edcio 163).","paraTurma":"Em turmas de 4 a 12 alunos, toda a turma conta em voz alta o tempo que o defensor leva entre bater o peito na areia e saltar para atacar (tem que ser menos de 2,5 segundos!).","meta":"Completar 6 de 10 transi\u00e7\u00f5es de mergulho na bola curta seguidas de recupera\u00e7\u00e3o do solo e ataque v\u00e1lido.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 aplica largada curta atr\u00e1s de B1 aos 2,5m (seta 1). J1 arranca dos 5,5m e mergulha aos 2,5m (seta tracejada 1), subindo a bola alta no centro (seta 2). Enquanto B1 sai da rede para levantar (seta 3), J1 levanta da areia recuando 1 passo para tomar impulso (seta tracejada 2) e ataca (seta 4).","codigo":"DEF-AVA-163"},{"numero":164,"secao":9,"nome":"Defesa + Levantamento + Contra-ataque 3: busca do lob no fundo e invers\u00e3o de atacante","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (B1 + J1 contra A1 + L1)","tempo":"11 minutos","material":"5 bolas BUSCA DO LOB AOS 8m A1 B1 J1 1 1 23 2","objetivo":"Resolver a situa\u00e7\u00e3o extrema em que o lob encobre o bloqueador e o defensor busca a bola l\u00e1 nos 8 metros de fundo, decidindo entre atacar vindo do fundo ou inverter para o bloqueador atacar.","comoMontar":"A1 + L1 na esquerda; B1 na rede (fechando a linha) e J1 na diagonal (a 4,5m) na direita.","passoAPasso":["A1 v\u00ea B1 na rede e J1 aos 4,5m e solta um 'lob' perfeito por cobertura que viaja at\u00e9 o canto de 8 metros da linha de fundo!","J1 abre o quadril e corre em velocidade m\u00e1xima at\u00e9 a linha de fundo (8m) perseguindo a bola.","L\u00e1 na linha de 8 metros, a dupla treina as duas solu\u00e7\u00f5es t\u00e1ticas de alto n\u00edvel:","Solu\u00e7\u00e3o A (Padr\u00e3o): J1 chega atr\u00e1s da bola aos 8m, vira o peito e manda uma defesa alta at\u00e9 os 2,5m da rede; B1 sai do bloqueio, levanta alto e J1 vem correndo os 6,5m para atacar.","Solu\u00e7\u00e3o B (Invers\u00e3o T\u00e1tica 'Voc\u00ea Bate!' quando J1 est\u00e1 caindo fora da quadra no fundo): J1 est\u00e1 t\u00e3o longe l\u00e1 atr\u00e1s que n\u00e3o vai conseguir correr 8 metros na areia para atacar a tempo! Ent\u00e3o J1 grita 'BATE VOC\u00ca!' e j\u00e1 manda o 1\u00ba toque (ou B1 d\u00e1 o 1\u00ba e J1 d\u00e1 o 2\u00ba do fundo) para o pr\u00f3prio bloqueador B1 abrir e atacar na rede!"],"pontosAtencao":["Muitas vezes na praia \u00e9 o pr\u00f3prio BLOQUEADOR (B1) quem corre de volta para buscar o lob que passou por cima da cabe\u00e7a dele!","Se B1 correr do bloqueio e salvar o lob no fundo no 1\u00ba toque, J1 levanta no 2\u00ba toque e B1 (ou J1) ataca!","Comunique-se durante a corrida para o fundo: quem tiver melhor \u00e2ngulo pega o lob e o outro j\u00e1 se prepara na frente para levantar.","Quando a defesa vem l\u00e1 dos 8 metros de fundo, o levantador nunca deve acelerar o levantamento: levante uma bola bem alta!"],"erroComum":"Os dois jogadores desistirem do lob achando que o parceiro vai buscar ou os dois correrem juntos para o canto de fundo deixando a rede vazia para o levantamento; corrija definindo: 'Lob na linha \u00e9 do defensor; se o defensor estiver na diagonal extrema, o bloqueador busca!'. Varia\u00e7\u00f5es","variacaoFacil":"Treinar primeiro apenas a Solu\u00e7\u00e3o A com J1 buscando o lob nos 7,5m e B1 levantando alto no centro.","variacaoDificil":"A1 pode mandar o lob em qualquer um dos dois cantos de 8m da quadra (atr\u00e1s de B1 na paralela ou atr\u00e1s de J1 na diagonal).","paraTurma":"Em turmas de 4 a 12 alunos, cada dupla enfrenta 4 lobs profundos nos cantos de 8m e precisa transformar pelo menos 3 em contra-ataques organizados.","meta":"Salvar e converter em contra-ataque 6 de 10 bolas de lob enviadas nos \u00faltimos 1,5m do fundo da quadra.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 envia um lob por cobertura (seta 1) at\u00e9 o canto de 8m no fundo direito. J1 recua em sprint at\u00e9 os 8m (seta tracejada 1) e salva enviando a bola alta para os 2,5m (seta 2). B1 sai da rede para levantar no centro (seta 3) e J1 atravessa a quadra (seta tracejada 2) para finalizar o contra-ataque (seta 4).","codigo":"DEF-AVA-164"},{"numero":165,"secao":9,"nome":"Defesa + Levantamento + Contra-ataque 4: transi\u00e7\u00e3o a partir de 2 defensores no fundo","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (J1 + J2 na defesa sem bloqueio contra A1 + L1)","tempo":"11 minutos","material":"5 bolas DEFESA J1 (5,5m) A1 J2 J1 1 1","objetivo":"Acelerar a infiltra\u00e7\u00e3o do defensor que N\u00c3O tocou na bola quando os dois est\u00e3o posicionados a 5,5 metros da rede (ap\u00f3s falso bloqueio/retirada).","comoMontar":"A1 + L1 na esquerda; J1 (inferior) e J2 (superior, que acabou de retirar da rede) lado a lado a 5,5 metros da rede na direita.","passoAPasso":["Quando a dupla escolhe jogar sem bloqueio (com J1 e J2 l\u00e1 no fundo aos 5,5m), \u00e9 muito mais f\u00e1cil defender o ataque advers\u00e1rio, MAS o levantamento fica mais dif\u00edcil porque os dois jogadores est\u00e3o longe da rede!","L1 levanta para A1; J2 retira da rede e para aos 5,5m ao lado de J1.","A1 ataca (ex.: bate forte em cima de J1).","No exato milissegundo em que a bola vai na dire\u00e7\u00e3o de J1, J2 (que est\u00e1 aos 5,5m e N\u00c3O vai defender a bola) j\u00e1 dispara em sprint m\u00e1ximo rumo \u00e0 Zona de Levantamento (a 1,5m da rede)!","J1 defende a bola bem alta (5m de altura) no centro para dar tempo de J2 percorrer os 4 metros de areia, frear os dois p\u00e9s, levantar e J1 concluir o contra-ataque!"],"pontosAtencao":["Segredo da transi\u00e7\u00e3o com 2 no fundo: se o parceiro que n\u00e3o defendeu esperar a bola subir da manchete do colega para s\u00f3 ent\u00e3o come\u00e7ar a correr dos 5,5m at\u00e9 a rede, ele nunca vai chegar a tempo!","Ele precisa arrancar no instante em que v\u00ea que a bola foi no parceiro!","Por isso, quem defende com os dois no fundo tem a obriga\u00e7\u00e3o de mandar a defesa 1 metro MAIS ALTA que o normal.","Se a bola defendida ficar curta aos 3,5m da rede, J2 freia aos 3,5m e levanta de dentro para fora."],"erroComum":"Os dois defensores ficarem parados aos 5,5m olhando a defesa subir e s\u00f3 decidirem quem vai correr para levantar quando a bola j\u00e1 est\u00e1 caindo; corrija exigindo o grito 'SUA BOLA, EU LEVANTO!' na sa\u00edda do ataque. Varia\u00e7\u00f5es","variacaoFacil":"A1 avisa antes em qual dos dois defensores vai bater para o outro j\u00e1 treinar o gatilho de arrancada para a rede.","variacaoDificil":"A1 ataca nas costuras e nos cantos tentando dificultar tanto a defesa quanto a corrida de infiltra\u00e7\u00e3o do levantador.","paraTurma":"Em turmas de 4 a 12 alunos, jogue 2x2 onde a dupla defensora \u00e9 obrigada a jogar sem bloqueio (falso bloqueio + retirada) em todas as bolas, pontuando apenas nos contra-ataques convertidos.","meta":"Converter 7 de 10 contra-ataques saindo com os dois jogadores da linha de 5,5 metros sem atraso no levantamento.","descricaoDiagrama":"Quadra 16x8m vista de cima. J2 retira da rede (seta tracejada 1) alinhando-se a J1 aos 5,5m. A1 ataca em J1 (seta 1); J1 defende alto para a rede (seta 2) enquanto J2 dispara imediatamente dos 5,5m at\u00e9 a rede (seta tracejada 2) para levantar (seta 3), e J1 avan\u00e7a (seta tracejada 3) matando o contra-ataque (seta 4).","codigo":"DEF-AVA-165"},{"numero":166,"secao":9,"nome":"Desafio sob press\u00e3o 'Muralha da Areia': s\u00f3 pontua quem defende e vira!","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (2 contra 2 em desafio de alta intensidade)","tempo":"12 minutos","material":"6 bolas BLOQUEIO MURALHA MURALHA DA AREIA: S\u00d3 PONTUA QUEM DEFENDE E VIRA! A1 L1 B1 J1 1","objetivo":"Colocar \u00e0 prova todo o sistema defensivo sob fadiga e press\u00e3o de placar em um jogo onde apenas a dupla que est\u00e1 defendendo pode somar pontos.","comoMontar":"Quadra oficial 16x8m: Dupla da Muralha (B1 + J1) no lado direito sacando e defendendo; Dupla Atacante (A1 + L1) no lado esquerdo recepcionando.","passoAPasso":["Regras do Desafio 'Muralha da Areia': apenas o lado direito (Muralha) marca pontos no placar! Para marcar 1 ponto, a Dupla da Muralha precisa sacar, defender o ataque de A1/L1 e converter o contra-ataque!","B\u00f4nus de Defesa Espetacular: se o contra-ataque vier ap\u00f3s um mergulho de peixinho na areia ou busca de lob na linha de 8m, vale 2 PONTOS!","Se a Dupla da Muralha defender e virar o ponto, o treinador j\u00e1 lan\u00e7a imediatamente uma 'Bola Extra de Press\u00e3o' do meio da quadra esquerda para A1/L1 atacarem de novo sem descanso!","Se a Dupla Atacante (A1 + L1) matar o side-out na quadra da Muralha, eles n\u00e3o ganham ponto, mas ROUBAM o lado da Muralha e passam a sacar para tentar pontuar!","Vence o desafio a primeira dupla a alcan\u00e7ar 10 pontos de defesa + contra-ataque."],"pontosAtencao":["Na praia, a defesa \u00e9 antes de tudo ATITUDE MENTAL: a dupla que decide que 'nenhuma bola cai na nossa areia sem algu\u00e9m estar deitado embaixo dela' intimida qualquer atacante!","Converse antes de CADA saque: mudem os sinais atr\u00e1s das costas (ora fechando linha, ora diagonal, ora falso bloqueio com Gato e Rato).","Quando ganhar o direito \u00e0 Bola Extra de Press\u00e3o sob cansa\u00e7o, levante a bola de transi\u00e7\u00e3o alta e segura no meio."],"erroComum":"Deixar uma bola pingar na areia olhando para o parceiro sem se jogar nela; neste desafio, se uma bola cair na quadra da Muralha sem que nenhum dos dois jogadores toque na bola ou v\u00e1 ao ch\u00e3o tentando, a dupla perde 1 ponto acumulado! Varia\u00e7\u00f5es","variacaoFacil":"Disputar at\u00e9 7 pontos sem a Bola Extra imediata (apenas saques normais).","variacaoDificil":"Exigir 2 defesas convertidas seguidas na mesma passagem pela Muralha para validar os pontos no placar geral.","paraTurma":"Em turmas de 4 a 12 alunos, este \u00e9 o grande fechamento da Se\u00e7\u00e3o 9: formato 'Rei da Muralha' com rod\u00edzio r\u00e1pido das duplas desafiantes no lado esquerdo a cada ponto.","meta":"Alcan\u00e7ar 10 pontos de defesa convertida em contra-ataque mantendo 100% de entrega f\u00edsica (zero bolas caindo sem tentativa).","descricaoDiagrama":"Quadra 16x8m vista de cima no Desafio Muralha da Areia. No lado direito, B1 e J1 combinam bloqueio e cobertura total da quadra (\u00e1reas de defesa em azul). Ap\u00f3s o saque (seta 1) e ataque de A1 (seta 2), a Muralha defende (seta 3), levanta (seta 4) e contra-ataca (seta 5), recebendo em seguida a Bola Extra de press\u00e3o.","codigo":"DEF-AVA-166"},{"numero":167,"secao":10,"nome":"Engrenagem de side-out em ritmo controlado (passe, infiltra\u00e7\u00e3o e ataque)","nivel":"Iniciante","jogadores":"3 ou 4 jogadores (Dupla J1 + J2 no side-out e S1 + D1 do outro lado)","tempo":"8 minutos","material":"4 bolas, 3 cones e 2 zonas alvo ALVO 1 ALVO 2 J1 J2 S1 D1","objetivo":"Sincronizar os tempos de infiltra\u00e7\u00e3o do levantador e de espera do passador na areia em uma sequ\u00eancia completa de tr\u00eas toques.","comoMontar":"Na meia-quadra esquerda, posicione J1 (entrada/superior) e J2 (sa\u00edda/inferior) a 5,5 metros da rede. Coloque 1 cone na Zona de Levantamento (centro a 1,5m da rede). Na meia-quadra direita, S1 fica a 5m da rede com bolas e duas Zonas Alvo nos cantos de fundo.","passoAPasso":["S1 envia uma bola lan\u00e7ada em arco (ou saque por baixo controlado) na dire\u00e7\u00e3o de J1 aos 5,5 metros.","Assim que a bola vai para J1, J1 grita 'MINHA!' e J2 inicia imediatamente a corrida diagonal de infiltra\u00e7\u00e3o rumo ao cone central a 1,5m da rede.","J1 faz a recep\u00e7\u00e3o alta para o centro e, em vez de disparar cego para a rede, faz 1 passo calmo de ajuste esperando a bola chegar nas m\u00e3os de J2.","J2 estanca os dois p\u00e9s no cone central e levanta alto para a entrada (a 1,5m da rede).","J1 acelera os dois \u00faltimos passos ('direita-esquerda'), salta equilibrado e ataca mirando nas Zonas Alvo do fundo direito; fazem 5 bolas em J1 e 5 bolas em J2."],"pontosAtencao":["Sincronia da dupla: quem N\u00c3O vai passar corre na hora em que a bola sai da m\u00e3o do sacador; quem PASSOU espera a bola subir para acelerar!","Mantenha o passe e o levantamento na faixa de 1,5 metro da rede para evitar toques na fita.","Ap\u00f3s o ataque de J1, J2 j\u00e1 faz o passo de cobertura atr\u00e1s do parceiro."],"erroComum":"O passador (J1) correr para a rede junto com o pr\u00f3prio passe e chegar embaixo da rede antes de J2 levantar; corrija exigindo uma pausa de leitura aos 3,5 metros at\u00e9 J2 tocar na bola. Varia\u00e7\u00f5es","variacaoFacil":"J2 j\u00e1 come\u00e7a adiantado a 3 metros da rede para reduzir a dist\u00e2ncia da corrida de infiltra\u00e7\u00e3o.","variacaoDificil":"Exigir que o ataque final alterne obrigatoriamente entre 1 bola na paralela fundo e 1 bola na diagonal.","paraTurma":"Em turmas de 4 a 12 alunos, posicione duas duplas no lado direito enviando bolas e recolhendo nos alvos e o restante em duplas no lado esquerdo fazendo 4 side-outs seguidos antes de rodar.","meta":"Completar 8 de 10 sequ\u00eancias de side-out sem atraso nos p\u00e9s e acertando as Zonas Alvo de fundo.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 na direita envia bola (seta 1) para J1 a 5,5m na esquerda. J1 recepciona para o cone central a 1,5m da rede (seta 2) enquanto J2 infiltra do fundo at\u00e9 o centro (seta tracejada 1). J2 levanta para a entrada (seta 3) e J1 avan\u00e7a no tempo certo (seta tracejada 2) atacando nas Zonas Alvo da direita (seta 4).","codigo":"SDO-INI-167"},{"numero":168,"secao":10,"nome":"Side-out completo em ritmo de jogo a partir de saque real","nivel":"Iniciante","jogadores":"4 jogadores (Dupla J1 + J2 recebendo contra Dupla S1 + B1 sacando)","tempo":"9 minutos","material":"5 bolas, 2 cones e 2 zonas alvo ALVO PARAL ALVO DIAG J1 J2 B1 S1 1 2 1","objetivo":"Executar a rotina completa de side-out na velocidade real do saque vindo da linha de 8 metros, mantendo o equil\u00edbrio na chamada de ataque.","comoMontar":"Dupla J1 e J2 na meia-quadra esquerda a 5,5m da rede. Na meia-quadra direita, S1 atr\u00e1s da linha de fundo (8m) para sacar por cima e B1 na rede marcando posi\u00e7\u00e3o. Duas Zonas Alvo demarcadas na quadra direita.","passoAPasso":["S1 executa um saque por cima oficial da linha de 8 metros buscando qualquer ponto da meia-quadra esquerda.","J1 e J2 definem na chamada verbal ('MINHA!' / 'VAI!') antes da bola cruzar a rede.","O
