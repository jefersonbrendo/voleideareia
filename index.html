 (a bola vem pesada demais de 15m de altura e dobra os dedos, dando dois toques); corrija exigindo 100% de recep\u00e7\u00e3o de manchete com base baixa. Varia\u00e7\u00f5es","variacaoFacil":"S1 fica a 4 metros da rede do outro lado e lan\u00e7a a bola o mais alto poss\u00edvel com as duas m\u00e3os.","variacaoDificil":"O parceiro (J2) fica junto e grita orienta\u00e7\u00f5es de vento ('Vento levando pra linha!', 'T\u00e1 caindo curta!') enquanto J1 olha para o c\u00e9u.","paraTurma":"Em turmas de 4 a 12 alunos, 2 alunos especialistas no saque alto batem do lado direito enquanto duplas no lado esquerdo treinam a leitura contra o sol e o passe na Zona Alvo.","meta":"Colocar 6 de 10 bolas de 'Jornada nas Estrelas' dentro da Zona Alvo sem perder a bola no sol.","descricaoDiagrama":"Quadra 16x8m vista de cima com \u00edcone de Sol e Vento. S1 na linha de fundo direita bate saque alt\u00edssimo (seta de bola 1 em grande arco). Na meia-quadra esquerda, J1 ajusta a posi\u00e7\u00e3o com passos curtos atr\u00e1s do ponto de queda vertical (seta tracejada 1) e passa (seta 2) para a Zona Alvo a 1,5m da rede.","codigo":"REC-INT-067"},{"numero":68,"secao":4,"nome":"Ajuste de profundidade da recep\u00e7\u00e3o: vento contra vs. vento a favor","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (2 sacadores \u2014 um em cada fundo \u2014 e 1 ou 2 receptores que trocam de lado)","tempo":"10 minutos","material":"6 bolas, 4 cones e 2 zonas alvo \u25c4\u25c4\u25c4","objetivo":"Aprender a adiantar ou recuar a linha base de recep\u00e7\u00e3o na areia conforme o saque advers\u00e1rio venha contra o vento ou a favor do vento.","comoMontar":"Considere que o vento sopra da direita para a esquerda. Na meia-quadra esquerda (onde o saque advers\u00e1rio vem A FAVOR do vento, voando longe), coloque o cone de recep\u00e7\u00e3o recuado a 6,5m da rede. Na meia-quadra direita (onde o saque advers\u00e1rio vem CONTRA o vento, caindo curto), coloque o cone de recep\u00e7\u00e3o adiantado a 4,5m da rede.","passoAPasso":["J1 come\u00e7a recebendo na meia-quadra esquerda (o sacador S1 na direita est\u00e1 sacando A FAVOR do vento).","J1 posiciona-se no cone de 6,5 metros da rede (1 metro mais ao fundo que o normal) porque o vento nas costas da bola faz o saque viajar r\u00e1pido e fundo.","No passe, como o vento est\u00e1 soprando pelas costas de J1 em dire\u00e7\u00e3o \u00e0 rede, J1 passa a bola mais contida (a 2 metros da rede) para o vento n\u00e3o jogar o passe para o outro lado.","Ap\u00f3s 5 bolas, J1 corre para a meia-quadra direita (agora S2 saca da esquerda CONTRA o vento).","Na quadra direita, J1 se adianta para o cone de 4,5 metros da rede (pois o vento freia o saque e o derruba curto) e empurra o passe mais forte contra o vento at\u00e9 a Zona Alvo."],"pontosAtencao":["Anote essa regra de ouro da areia: se o vento bate no seu PEITO quando voc\u00ea olha para o sacador, recue para 6-6,5m e segure o passe; se o vento bate nas suas COSTAS, adiante-se para 4,5m e empurre mais o passe.","Com vento batendo nas suas costas, nunca mire o passe a 1 metro da rede porque a rajada joga a bola na m\u00e3o do bloqueador advers\u00e1rio.","Reajuste seu c\u00e9rebro imediatamente a cada troca de lado da quadra."],"erroComum":"Ficar plantado sempre aos 5,5 metros nos dois lados da quadra sem respeitar o vento, tomando ace curto de um lado e ace no peito do outro; corrija marcando os cones em profundidades diferentes. Varia\u00e7\u00f5es","variacaoFacil":"Treinar 8 bolas seguidas de um lado e depois 8 bolas do outro antes de alternar r\u00e1pido.","variacaoDificil":"Trocar de lado da quadra a cada 2 recep\u00e7\u00f5es correndo por fora do poste.","paraTurma":"Em turmas de 4 a 12 alunos, monte as duas quadras funcionando simultaneamente: uma dupla recebe no lado esquerdo (base aos 6,5m) e outra dupla recebe no lado direito (base aos 4,5m), trocando de quadra a cada 4 saques.","meta":"Acertar 7 de 10 passes nas Zonas Alvo somando as recep\u00e7\u00f5es nos dois lados do vento sem deixar nenhum passe passar direto pela rede.","descricaoDiagrama":"Quadra 16x8m vista de cima com setas de Vento da direita para a esquerda. Na esquerda, J1 posiciona-se recuado a 6,5m da rede para receber o saque a favor do vento de S1 (seta 1) e passa contido na Zona Alvo (seta 2). Na direita, J1 posiciona- se adiantado a 4,5m da rede para receber o saque freado pelo vento de S2.","codigo":"REC-INT-068"},{"numero":69,"secao":4,"nome":"Recep\u00e7\u00e3o seguida de transi\u00e7\u00e3o imediata de p\u00e9s para o ataque","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (1 sacador, 1 receptor/atacante e 1 levantador)","tempo":"10 minutos","material":"5 bolas, 3 cones e 2 zonas alvo ZONA 1 ZONA 2 J1 J2 S1 1","objetivo":"Conectar o t\u00e9rmino da manchete de recep\u00e7\u00e3o com o primeiro passo de abertura e aproxima\u00e7\u00e3o para o salto de ataque na areia.","comoMontar":"S1 saca da linha de fundo direita. Na meia-quadra esquerda, J1 fica a 5,5m da rede no lado esquerdo e J2 (levantador) j\u00e1 fica pr\u00f3ximo \u00e0 Zona Alvo 1 (centro da rede a 1,5m). Coloque 1 cone de transi\u00e7\u00e3o perto da linha lateral aos 4m e uma Zona Alvo 2 de chamada de ataque na rede esquerda.","passoAPasso":["S1 saca em dire\u00e7\u00e3o a J1 (a 5,5m da rede).","J1 para os p\u00e9s, realiza a recep\u00e7\u00e3o de manchete alta para a Zona Alvo 1 (onde est\u00e1 J2).","No instante em que a bola sai dos antebra\u00e7os, J1 N\u00c3O fica parado olhando o passe: ele d\u00e1 1 passo de reajuste passando pelo cone lateral de 4m (abrindo espa\u00e7o e mantendo a bola \u00e0 sua frente).","Enquanto J2 agarra ou levanta a bola na Zona Alvo 1, J1 acelera os dois \u00faltimos passos ('esquerda-direita' na areia) entrando na Zona Alvo 2 junto \u00e0 rede e salta em equil\u00edbrio m\u00e1ximo.","No ar, J1 agarra a bola levantada por J2 com os dois bra\u00e7os no ponto mais alto (treinando apenas a transi\u00e7\u00e3o de p\u00e9s antes de bater na bola nos exerc\u00edcios seguintes)."],"pontosAtencao":["Na praia, como a bola \u00e9 levantada de mais longe da rede, voc\u00ea nunca corre para a rede ANTES de o seu parceiro tocar na bola: passe, fa\u00e7a 1 passo lento de leitura ('passo de espera') e s\u00f3 exploda quando a bola sair da m\u00e3o do levantador.","Se voc\u00ea recebeu uma bola perto do meio da quadra, d\u00ea o primeiro passo abrindo para a linha lateral para recuperar o seu \u00e2ngulo de ataque.","Pare os dois p\u00e9s juntos na areia antes de saltar verticalmente na Zona Alvo 2."],"erroComum":"Correr desesperado para debaixo da rede logo ap\u00f3s a manchete, chegando cedo demais e ficando embaixo da bola sem espa\u00e7o para atacar; corrija exigindo o passo lento no cone de 4m at\u00e9 J2 tocar na bola. Varia\u00e7\u00f5es","variacaoFacil":"S1 lan\u00e7a a bola f\u00e1cil para J1 passar e focar 100% no ritmo da passada de aproxima\u00e7\u00e3o at\u00e9 a rede.","variacaoDificil":"S1 saca deslocando J1 para o fundo (7m) ou para a curta (3m), obrigando J1 a adaptar o comprimento da corrida de ataque ap\u00f3s o passe.","paraTurma":"Em turmas de 4 a 12 alunos, forme duas filas de receptores (esquerda e direita) no lado esquerdo da quadra com 1 levantador fixo no centro da rede. Um aluno por vez passa, faz a aproxima\u00e7\u00e3o no cone e salta pegando a bola no ponto mais alto.","meta":"Completar 8 de 10 sequ\u00eancias (passe na Zona 1 + chegada no tempo certo saltando equilibrado na Zona 2).","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 saca da direita (seta de bola 1) para J1 a 5,5m da rede na esquerda. J1 passa a bola (seta 2) para J2 na Zona Alvo 1 (centro da rede), faz a curva pelo cone lateral de 4m e avan\u00e7a (seta tracejada 1) at\u00e9 a Zona Alvo 2 na entrada da rede para receber o levantamento (bola 3).","codigo":"REC-INT-069"},{"numero":70,"secao":4,"nome":"Recep\u00e7\u00e3o de saque viagem forte: 'tirando o peso' da bola","nivel":"Avan\u00e7ado","jogadores":"2 ou 3 jogadores (1 sacador de viagem e 1 ou 2 receptores)","tempo":"10 minutos","material":"6 bolas, 2 cones e 1 zona alvo ALVO 2mJ1 S1 1 1 2 Base recuada a 6,5m: \"Tirar o peso\" do saque viagem Quadra 16x8m vista de cima. S1 na linha de fundo direita faz corrida e salto de saque viagem (seta tracejada 1) enviando bola r\u00e1pida com topspin (seta de bola 1). J1 recuado a 6,5m da rede na esquerda amortece o impacto e coloca a bola (seta 2)","objetivo":"Absorver a pot\u00eancia e o efeito topspin do saque viagem recuando a base na areia e encolhendo levemente os ombros no impacto.","comoMontar":"S1 atr\u00e1s da linha de fundo direita batendo saques viagem fortes (ou batendo em cima de um caixote na linha de 6m do lado direito para simular viagem pesado). Na meia-quadra esquerda, J1 posiciona-se recuado a 6,5 metros da rede em base muito baixa. Zona Alvo a 2m da rede no centro.","passoAPasso":["Quando S1 lan\u00e7a a bola alto para o saque viagem, J1 j\u00e1 recua meio passo para os 6,5m, afasta bem os p\u00e9s na areia e baixa o quadril.","No momento da batida de S1 l\u00e1 no alto, J1 faz o destrave cravando as plantas dos p\u00e9s na areia.","Como a bola do viagem vem r\u00e1pida e girando para frente (topspin, que faz a bola subir e espirrar para tr\u00e1s se bater num bra\u00e7o duro), J1 inclina o tronco mais \u00e0 frente (fechando o \u00e2ngulo da manchete).","No exato milissegundo do impacto, J1 'tira o peso' da bola: recolhe suavemente os ombros ou afunda 3 cm os joelhos para amortecer a pancada.","A bola sobe controlada no centro da quadra (Zona Alvo a 2m da rede); trocam a cada 8 viagens."],"pontosAtencao":["Contra saque viagem com topspin, a rota\u00e7\u00e3o da bola tenta fazer ela subir pelas suas costas ou passar direto pela rede: feche o queixo no peito e incline os ombros para frente.","Contra saque viagem, voc\u00ea n\u00e3o precisa balan\u00e7ar os bra\u00e7os um mil\u00edmetro sequer para cima: a pr\u00f3pria velocidade do saque j\u00e1 faz a bola subir 4 metros.","N\u00e3o tente passar o saque viagem colado na rede (1m); mire a Zona Alvo a 2 ou 2,5 metros da rede para ter margem de seguran\u00e7a."],"erroComum":"Levantar o tronco assustado quando a bola vem forte, abrindo o \u00e2ngulo da manchete e jogando a bola l\u00e1 no alambrado de tr\u00e1s; corrija pedindo para manter o nariz \u00e0 frente da linha dos joelhos. Varia\u00e7\u00f5es","variacaoFacil":"S1 bate o viagem com 75% de for\u00e7a da linha de fundo diretamente na dire\u00e7\u00e3o do corpo de J1.","variacaoDificil":"S1 varia entre o saque viagem forte no fundo (6,5m) e o saque h\u00edbrido largado aos 3 metros.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 batedores de viagem (ou o professor sobre o caixote aos 6m) e duplas de receptores no lado esquerdo. Cada dupla defende/recepciona 6 saques viagem seguidos buscando colocar na Zona Alvo.","meta":"Amortecer e manter em jogo dentro da Zona Alvo pelo menos 6 de 10 saques viagem potentes.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 na linha de fundo direita faz corrida e salto de saque viagem (seta tracejada 1) enviando bola r\u00e1pida com topspin (seta de bola 1). J1 recuado a 6,5m da rede na esquerda amortece o impacto e coloca a bola (seta 2) na Zona Alvo segura a 2m da rede.","codigo":"REC-AVA-070"},{"numero":71,"secao":4,"nome":"Passe de seguran\u00e7a no pr\u00f3prio corredor (quando o saque te joga pra fora)","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (1 sacador t\u00e1tico, 1 receptor e 1 levantador)","tempo":"10 minutos","material":"5 bolas, 2 cones e 2 zonas alvo ZONA A ZONA B (SEG) J1 J2 S1 1","objetivo":"Saber quando abandonar o alvo central e passar a bola reta \u00e0 pr\u00f3pria frente (a 2,5m da rede) quando o saque te tira totalmente da quadra.","comoMontar":"S1 no canto da linha de fundo direita sacando em diagonal curta/lateral extrema para tirar J1 da quadra. Na meia-quadra esquerda, J1 come\u00e7a a 5,5m da rede. Marque a Zona Alvo A (centro da rede a 1,5m) e a Zona Alvo B ('Zona de Seguran\u00e7a' na frente de J1, a 2,5m da rede e 2m da lateral). J2 \u00e9 o levantador.","passoAPasso":["S1 bate um saque agressivo na linha lateral esquerda que obriga J1 a correr para fora da fita lateral para alcan\u00e7ar a bola em desequil\u00edbrio.","Intelig\u00eancia t\u00e1tica de praia: quando J1 chega atrasado e fora da quadra, tentar for\u00e7ar um passe longo at\u00e9 o meio da rede (Zona A) quase sempre faz a bola passar de gra\u00e7a para o bloqueador advers\u00e1rio.","Nesse cen\u00e1rio de sufoco, J1 aplica o 'Passe no Pr\u00f3prio Ombro': joga a bola bem alta (5m de altura) reto \u00e0 sua pr\u00f3pria frente dentro da Zona Alvo B (a 2,5m da rede no seu corredor).","J2 (levantador), vendo que J1 foi jogado para fora da quadra, corre at\u00e9 a Zona B, para os p\u00e9s e levanta na paralela para J1.","Se o saque de S1 vier f\u00e1cil dentro da quadra, J1 passa normalmente na Zona A."],"pontosAtencao":["Na praia, quando voc\u00ea est\u00e1 no sufoco fora da quadra, a \u00fanica proibi\u00e7\u00e3o \u00e9 mandar a bola baixa ou perto da rede: jogue um bal\u00e3o alto na sua pr\u00f3pria frente (Zona B) que d\u00e1 tempo de o seu parceiro chegar e de voc\u00ea levantar da areia.","Chame o parceiro logo ap\u00f3s o passe de sufoco: 'Ajuda aqui na frente!'.","O levantador (J2) nunca deve correr cego para o meio da rede: ele primeiro olha onde o saque pegou o parceiro e s\u00f3 ent\u00e3o vai para a bola."],"erroComum":"Caindo na areia fora da quadra, tentar empurrar a bola para o centro da rede e entregar um 'overpass' (bola de gra\u00e7a) na m\u00e3o do advers\u00e1rio; corrija premiando com 2 pontos o passe alto vertical na Zona B quando o saque for extremo. Varia\u00e7\u00f5es","variacaoFacil":"S1 lan\u00e7a a bola manualmente fora da linha lateral para J1 treinar a escolha da Zona B.","variacaoDificil":"Completar o ponto inteiro com ataque de J1 ap\u00f3s o levantamento de emerg\u00eancia de J2 na Zona B.","paraTurma":"Em turmas de 4 a 12 alunos, trabalhe com duplas completas no lado esquerdo recebendo 4 saques t\u00e1ticos extremos nas duas linhas laterais.","meta":"Salvar 7 de 10 bolas extremas fora da quadra colocando-as altas e jog\u00e1veis na Zona de Seguran\u00e7a B sem dar bola de gra\u00e7a.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 saca da direita abrindo \u00e2ngulo extremo na linha lateral superior esquerda (seta de bola 1). J1 corre para fora da linha lateral (seta tracejada 1) e sobe a bola alta na sua frente na Zona Alvo B (seta de bola 2), para onde J2 corre (seta tracejada 2) para levantar.","codigo":"REC-AVA-071"},{"numero":72,"secao":4,"nome":"Recep\u00e7\u00e3o + Levantamento + Ataque no corredor (Side-out completo 1)","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (1 sacador/defensor do outro lado e 1 dupla fazendo o side-out)","tempo":"11 minutos","material":"5 bolas, 2 cones e 2 zonas alvo PASSE ALVO PARAL ALVO DIAG J1 J2 S1","objetivo":"Encadear a recep\u00e7\u00e3o de saque flutuante agressivo com o levantamento na rede e a finaliza\u00e7\u00e3o de ataque no corredor.","comoMontar":"S1 atr\u00e1s da linha de fundo direita. Na meia-quadra esquerda, J1 (esquerda) e J2 (direita) a 5,5m da rede. Marque a Zona Alvo de Recep\u00e7\u00e3o no centro (a 1,5m da rede) e duas Zonas Alvo de Ataque no fundo da quadra direita (Corredor Paralelo e Diagonal).","passoAPasso":["S1 executa um saque flutuante agressivo em J1 (ou em J2).","J1 grita 'MINHA!', estabiliza a base na areia e passa a bola alta dentro da Zona Alvo central (1,5m da rede).","J2 infiltra em velocidade at\u00e9 a Zona Alvo central, para os dois p\u00e9s e realiza o levantamento (de toque limpo ou manchete) para a entrada da rede de J1.","J1 faz a aproxima\u00e7\u00e3o de p\u00e9s na areia, salta equilibrado e ataca (m\u00e3o cheia ou shot controlado) acertando uma das Zonas Alvo de Ataque no lado de S1.","Cada dupla executa 6 side-outs (3 recebidos por J1 e 3 recebidos por J2) e depois troca com S1."],"pontosAtencao":["A qualidade do ataque come\u00e7a na altura da recep\u00e7\u00e3o: se o passe de J1 for baixo e corrido, J2 vai chegar correndo e o levantamento vai sair impreciso.","Mantenha a bola sempre entre voc\u00ea e o seu levantador (nunca passe a bola para o lado de l\u00e1 do levantador).","Ap\u00f3s o passe, avise ao levantador que tipo de bola voc\u00ea quer ('Bola no ponto!', 'Meia bola!')."],"erroComum":"Apressar a corrida de ataque ap\u00f3s a recep\u00e7\u00e3o e passar por baixo da bola antes de ela cair; corrija obrigando o atacante a esperar a bola tocar na m\u00e3o do levantador para dar os dois \u00faltimos passos. Varia\u00e7\u00f5es","variacaoFacil":"Finalizar o ataque apenas com 'shots' (cortes de punho e largadas de ponta de dedo r\u00edgida) nas zonas alvo.","variacaoDificil":"S1, ap\u00f3s sacar, entra na quadra para defender de verdade o ataque da dupla.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 jogadores no lado direito (sacando e defendendo) e uma fila de duplas no lado esquerdo. Cada dupla tem 4 saques para tentar virar pelo menos 3 side-outs.","meta":"Converter 7 de 10 sequ\u00eancias completas (passe na zona + levantamento limpo + ataque dentro das zonas alvo).","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 saca da linha de fundo direita (seta de bola 1) em J1 na esquerda. J1 passa para a Zona Alvo central (seta 2) onde J2 infiltrou (seta tracejada 1). J2 levanta para a entrada (seta 3) e J1 avan\u00e7a (seta tracejada 2) atacando na Zona Alvo do fundo direito (seta 4).","codigo":"REC-AVA-072"},{"numero":73,"secao":4,"nome":"Recep\u00e7\u00e3o de saque curto + Levantamento e Ataque em tempo curto (Side-out 2)","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (1 sacador e 1 dupla receptora)","tempo":"11 minutos","material":"5 bolas, 2 cones e 2 zonas alvo LEVANTE J1 J2 S1 1 1","objetivo":"Transformar uma recep\u00e7\u00e3o dif\u00edcil de bola curta perto da rede em uma transi\u00e7\u00e3o r\u00e1pida de ataque sem perder o tempo de salto.","comoMontar":"S1 na linha de fundo direita especializado em saques curtos ('pingados' entre 2m e 3m da rede). Na meia- quadra esquerda, J1 e J2 na base normal a 5,5m da rede. Zona Alvo de levantamento a 1,5m da rede.","passoAPasso":["S1 saca curto logo atr\u00e1s da rede no lado de J1 (aos 2,5m da fita).","J1 arranca dos 5,5m at\u00e9 os 2,5m, freia em afundo baixo e levanta a recep\u00e7\u00e3o com pelo menos 4 metros de altura no centro (para dar tempo a si mesmo de recompor a passada).","Como J1 j\u00e1 terminou o passe a apenas 2,5 metros da rede (muito perto da fita), ele N\u00c3O tem espa\u00e7o para uma corrida longa: ele d\u00e1 1 passo r\u00e1pido para tr\u00e1s/fora (abrindo para os 3,5m) para tomar impulso.","J2 chega na bola, levanta na medida e J1 explode em 2 passos atacando sobre a rede.","Realizam 4 bolas curtas em J1 e 4 bolas curtas em J2, depois rodam."],"pontosAtencao":["Detalhe t\u00e9cnico crucial da praia: quando voc\u00ea recebe um saque curto aos 2 metros da rede, voc\u00ea est\u00e1 'colado' demais na fita para atacar.","Se voc\u00ea n\u00e3o passar a bola ALTA e n\u00e3o der 1 passo para tr\u00e1s/lado ap\u00f3s o passe, voc\u00ea vai saltar sem embalo nenhum.","Capriche na altura da recep\u00e7\u00e3o da bola curta: passe baixo na curta mata o pr\u00f3prio atacante.","O levantador (J2) deve deixar a bola 1,5m afastada da rede para ajudar o parceiro que estava no ch\u00e3o."],"erroComum":"Receber a bola curta aos 2 metros da rede e continuar andando para frente at\u00e9 encostar a barriga na fita, ficando impossibilitado de atacar; corrija colocando um cone aos 3,5m onde o passador precisa pisar ap\u00f3s passar a curta. Varia\u00e7\u00f5es","variacaoFacil":"Permitir que J1 comece aos 4,5 metros da rede.","variacaoDificil":"S1 alterna sem aviso entre saque curto (2,5m) e saque fundo no peito (6,5m).","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 sacadores no lado direito e duplas entrando no lado esquerdo a cada 2 bolas curtas convertidas em ataque.","meta":"Virar 6 de 10 bolas curtas com passe alto, passo de reajuste para tr\u00e1s e ataque efetivo dentro da quadra advers\u00e1ria.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 saca curto da direita (seta de bola 1) aos 2,5m da rede esquerda. J1 arranca dos 5,5m at\u00e9 os 2,5m (seta tracejada 1), passa alto para J2 no centro (seta 2), d\u00e1 1 passo de recuo/abertura para tomar dist\u00e2ncia (seta tracejada 2) e ataca o levantamento de J2 (setas 3 e 4).","codigo":"REC-AVA-073"},{"numero":74,"secao":4,"nome":"Recep\u00e7\u00e3o de viagem + Levantamento de dentro para fora + Ataque (Side-out 3)","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Dupla A sacando e bloqueando/defendendo x Dupla B no side-out)","tempo":"12 minutos","material":"5 bolas e 2 cones ZONA 3m J1 J2 B1 S1 1","objetivo":"Executar o side-out completo contra saque viagem ou flutuante pesado quando a recep\u00e7\u00e3o fica no meio da quadra (a 3-4 metros da rede).","comoMontar":"No lado direito: S1 no saque viagem e B1 na rede para bloquear. No lado esquerdo: J1 e J2 a 6 metros da rede. Marque uma Zona de Recep\u00e7\u00e3o Segura no centro da meia-quadra esquerda (entre 2,5m e 3,5m da rede).","passoAPasso":["S1 bate um saque viagem forte (ou flutuante m\u00e1ximo) em J1.","J1 amortece a pancada jogando a bola alta no centro da sua quadra (Zona Segura a 3 metros da rede).","J2 corre at\u00e9 o centro da quadra (a 3m da rede), planta os p\u00e9s de frente para a linha lateral de J1 e executa um levantamento 'de dentro para fora' (empurrando a bola do centro aos 3m em diagonal at\u00e9 a entrada da rede aos 1,5m).","J1 faz a chamada de ataque observando a posi\u00e7\u00e3o do bloqueador B1 e finaliza na paralela ou na diagonal livre.","Ap\u00f3s 6 side-outs, a Dupla A e a Dupla B trocam de fun\u00e7\u00e3o."],"pontosAtencao":["No alto n\u00edvel do v\u00f4lei de praia, contra um saque viagem a 90 km/h, passar a bola aos 3 metros da rede no meio da quadra \u00e9 considerado um EXCELENTE passe.","Quando o passe fica aos 3m da rede, o levantador precisa empurrar a bola em diagonal na dire\u00e7\u00e3o da antena/rede para aproximar a bola para o atacante.","O atacante deve esperar meio segundo a mais porque a bola levantada dos 3m demora mais para chegar na rede."],"erroComum":"O passador tentar cravar o saque viagem a 1 metro da rede e dar a bola de gra\u00e7a no bloqueio de B1; corrija dando ponto extra sempre que a recep\u00e7\u00e3o do viagem subir alta no meio da quadra (aos 3m). Varia\u00e7\u00f5es","variacaoFacil":"B1 apenas apresenta o bloqueio fixo na paralela ou na diagonal para J1 ler e atacar no corredor livre.","variacaoDificil":"Ponto real completo at\u00e9 a bola cair na areia, valendo contra- ataque.","paraTurma":"Em turmas de 4 a 12 alunos, jogue 2 contra 2 com rod\u00edzio de duplas a cada 3 saques viagem: quem est\u00e1 fora aguarda atr\u00e1s da linha de fundo j\u00e1 com bola na m\u00e3o para manter o ritmo alto.","meta":"Converter 6 de 10 side-outs contra saque forte usando o passe seguro no centro e ataque inteligente contra o bloqueio.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 saca viagem da direita (seta de bola 1) em J1 (a 6m na esquerda). J1 amortece no centro aos 3m da rede (seta 2, Zona Segura). J2 chega aos 3m (seta tracejada 1) e levanta em diagonal para a rede (seta 3), onde J1 avan\u00e7a (seta tracejada 2) e ataca fugindo do bloqueio B1 (seta 4).","codigo":"REC-AVA-074"},{"numero":75,"secao":4,"nome":"Desafio sob press\u00e3o: 'Quebra-Passe vs. Virada de Side-out' (Side-out 4)","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (2 contra 2 em desafio pontuado)","tempo":"12 minutos","material":"5 bolas e 4 cones PASSE A J1 J2 B1 S1 1 1","objetivo":"Manter a agressividade da chamada e a qualidade do passe sob press\u00e3o de placar quando um erro na costura ou de comunica\u00e7\u00e3o custa o dobro.","comoMontar":"Quadra oficial 16x8m limpa para jogo 2x2. Dupla A (S1 e B1) no lado direito sacando; Dupla B (J1 e J2) no lado esquerdo recepcionando.","passoAPasso":["A Dupla B (receptora) come\u00e7a com a miss\u00e3o de conquistar 7 pontos de side-out antes que a Dupla A conquiste 7 pontos.","A Dupla A saca livremente buscando a costura, as linhas ou a curta.","Sistema de pontua\u00e7\u00e3o de press\u00e3o na recep\u00e7\u00e3o: se a Dupla B passar na m\u00e3o do levantador e virar o ataque de primeira = +2 pontos para a Dupla B; se virar o ponto mas com passe ruim = +1 ponto.","Penalidade m\u00e1xima de recep\u00e7\u00e3o: se a Dupla B tomar um ace direto sem tocar na bola (indecis\u00e3o na costura) ou mandar a recep\u00e7\u00e3o de gra\u00e7a por cima da rede ('overpass'), a Dupla B ZERA os seus pontos acumulados e volta para 0!","Ao final do set, invertem quem saca e quem recebe."],"pontosAtencao":["A regra de 'zerar o placar se a bola cair sem ningu\u00e9m tocar' obriga os dois jogadores a se comunicarem em 100% dos saques e a mergulharem em qualquer bola duvidosa.","Em momentos de press\u00e3o (5 ou 6 pontos acumulados), priorize o passe alto no meio da quadra em vez de arriscar colar a bola na fita.","Se o sacador advers\u00e1rio engatar uma sequ\u00eancia dif\u00edcil, mude imediatamente a profundidade da base de recep\u00e7\u00e3o ou chame um ajuste com o parceiro."],"erroComum":"Ficar tenso quando est\u00e1 perto de bater a meta e encolher o bra\u00e7o na hora do passe, deixando a bola morrer curta; corrija exigindo respira\u00e7\u00e3o profunda e chamado alto de 'MINHA!' antes da rede. Varia\u00e7\u00f5es","variacaoFacil":"Em vez de zerar o placar no ace/overpass, apenas descontar 2 pontos da dupla receptora.","variacaoDificil":"O mesmo receptor (escolhido pela dupla que saca) precisa receber todos os saques at\u00e9 conseguir virar 2 pontos seguidos na linha paralela.","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a o formato 'Desafio na Arena': uma dupla fica na recep\u00e7\u00e3o tentando chegar aos 7 pontos enquanto as outras duplas se revezam no saque e defesa a cada ponto disputado.","meta":"Atingir os 7 pontos de side-out sem sofrer nenhum 'reset' (nenhum ace sem toque e nenhum passe entregue de gra\u00e7a).","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 na linha de fundo direita saca buscando as zonas cr\u00edticas (setas 1 na costura e laterais) e entra para defender (seta tracejada 1) atr\u00e1s do bloqueador B1. Na esquerda, J1 e J2 comunicam-se, passam para o centro (seta 2), levantam (seta 3) e atacam (seta 4) para fechar o side-out.","codigo":"REC-AVA-075"},{"numero":76,"secao":4,"nome":"Maratona do Receptor: 4 saques diferentes seguidos com finaliza\u00e7\u00e3o","nivel":"Avan\u00e7ado","jogadores":"3 ou 4 jogadores (2 sacadores, 1 levantador e 1 receptor em teste f\u00edsico-t\u00e9cnico)","tempo":"12 minutos","material":"8 bolas, 2 cones e 1 zona alvo ALVO J1 J2 S1 S2 1","objetivo":"Manter a precis\u00e3o da plataforma de manchete e a perna para atacar quando o advers\u00e1rio saca 4 bolas seguidas variando todos os golpes em cima de voc\u00ea.","comoMontar":"No lado direito, S1 e S2 ficam com 4 bolas cada na linha de fundo. No lado esquerdo, J1 \u00e9 o receptor avaliado e J2 \u00e9 o seu levantador. Zona Alvo de passe no centro a 1,5m da rede.","passoAPasso":["J1 vai receber uma bateria ininterrupta de 4 saques diferentes (um ap\u00f3s o outro, assim que finalizar o ataque anterior):","Bola 1: S1 bate um saque flutuante tenso no meio; J1 passa na Zona Alvo, aproxima e ataca.","Bola 2 (imediata): S2 solta um saque curto aos 2,5m da rede; J1 arranca da rede de volta aos 5m e explode na curta, passa alto, reajusta e ataca.","Bola 3 (imediata): S1 manda um saque alto 'Jornada nas Estrelas' no fundo aos 7,5m; J1 recua olhando contra o sol, passa do fundo para a rede, corre 6 metros na areia e ataca.","Bola 4 (final): S2 bate um saque viagem forte no peito; J1 tira o peso da bola colocando no centro e finaliza o 4\u00ba ataque com toda a energia restante.","Ap\u00f3s a maratona de 4 bolas, J1 descansa e o pr\u00f3ximo jogador entra no teste."],"pontosAtencao":["Na 3\u00aa e 4\u00aa bolas, as pernas v\u00e3o queimar por causa da areia fofa: n\u00e3o compense a fadiga das pernas jogando os bra\u00e7os para cima na manchete \u2014 continue baixando o quadril.","Na transi\u00e7\u00e3o entre o ataque da bola anterior e o saque seguinte, volte r\u00e1pido aos 5,5m j\u00e1 olhando para a m\u00e3o do pr\u00f3ximo sacador.","Pe\u00e7a ao seu levantador (J2) bolas um pouco mais altas e seguras nas duas \u00faltimas bolas da s\u00e9rie."],"erroComum":"Desistir de parar os p\u00e9s na 3\u00aa e 4\u00aa recep\u00e7\u00f5es por cansa\u00e7o, tocando na bola em movimento; corrija com o incentivo vocal do parceiro ('Planta os p\u00e9s na \u00faltima!'). Varia\u00e7\u00f5es","variacaoFacil":"Dar 5 segundos de recupera\u00e7\u00e3o entre cada uma das 4 bolas da bateria.","variacaoDificil":"Se J1 errar qualquer um dos 4 passes ou ataques, precisa repetir aquela bola espec\u00edfica imediatamente at\u00e9 acertar para poder sair da quadra.","paraTurma":"Em turmas de 4 a 12 alunos, este \u00e9 o grande desafio final da aula de recep\u00e7\u00e3o: toda a turma incentiva ao redor da quadra enquanto cada aluno enfrenta a sua 'Maratona das 4 Bolas' com o professor e um colega sacando.","meta":"Completar pelo menos 3 das 4 bolas da maratona com passe na Zona Alvo e ataque v\u00e1lido na quadra advers\u00e1ria.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 e S2 na linha de fundo direita enviam a sequ\u00eancia de 4 saques (1: Flutuante, 2: Curta 2,5m, 3: Alta Fundo 7,5m, 4: Viagem). Na esquerda, J1 desloca-se para cada ponto (setas tracejadas), passa para J2 na Zona Alvo central e avan\u00e7a para finalizar os 4 ataques.","codigo":"REC-AVA-076"},{"numero":77,"secao":5,"nome":"Base est\u00e1tica e eleva\u00e7\u00e3o suave de ombros","nivel":"Iniciante","jogadores":"2 jogadores (1 levantador L1 e 1 parceiro lan\u00e7ador A1)","tempo":"7 minutos","material":"2 bolas, 2 cones e 1 zona alvo ALVO 1,5m L1 A1 1 2 L1 a 1,5m da rede: Extens\u00e3o de joelhos + Ombros suaves Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 posicionado no cone a 4m da rede lan\u00e7a a bola (seta 1) para L1 no cone central a 1,5m da rede. L1 usa extens\u00e3o de pernas e envia o levantamento (seta 2) para a Zona Alvo (1,5x1,5m) a","objetivo":"Isolar o impulso das pernas e a leve eleva\u00e7\u00e3o de ombros no levantamento de manchete, eliminando o h\u00e1bito de chicotear os bra\u00e7os.","comoMontar":"Na meia-quadra esquerda, posicione 1 cone para o levantador (L1) no centro, a 1,5 metro da rede. Posicione 1 cone para o parceiro (A1) a 4 metros da rede na entrada esquerda. Demarque uma Zona Alvo de 1,5x1,5m na frente de A1, a 1,5 metro da rede e 1,5 metro da linha lateral.","passoAPasso":["L1 posiciona-se no cone central (a 1,5m da rede) com o p\u00e9 direito ligeiramente \u00e0 frente (virado de frente para a entrada esquerda, de costas diagonais para a rede).","A1 lan\u00e7a a bola com as duas m\u00e3os em arco suave diretamente na linha da cintura de L1.","L1 flexiona os joelhos na areia, monta a plataforma plana e N\u00c3O balan\u00e7a os bra\u00e7os para cima.","No contato com a bola, L1 apenas estende os joelhos empurrando a areia e faz um leve 'encolhimento' dos ombros para cima (em dire\u00e7\u00e3o \u00e0s orelhas), fazendo a bola subir macia.","A bola deve fazer um arco de 4 metros de altura e cair dentro da Zona Alvo a 1,5m da rede; trocam de fun\u00e7\u00e3o a cada 10 bolas."],"pontosAtencao":["O p\u00e9 mais pr\u00f3ximo da rede (p\u00e9 direito quando levanta para a esquerda; p\u00e9 esquerdo quando levanta para a direita) deve estar meio passo \u00e0 frente para impedir que a bola escape para o lado advers\u00e1rio.","O movimento dos antebra\u00e7os \u00e9 de apenas 10 cent\u00edmetros guiado pelos ombros; todo o resto da for\u00e7a vem das coxas empurrando a areia.","Congele a plataforma apontando para o alvo por 1 segundo inteiro ap\u00f3s a bola sair."],"erroComum":"Bater seco na bola subindo os bra\u00e7os at\u00e9 a altura do rosto, fazendo a bola viajar r\u00e1pida demais e sair pela antena; corrija pedindo para manter os pulsos apontados para baixo durante todo o toque. Varia\u00e7\u00f5es","variacaoFacil":"Colocar A1 parado dentro da Zona Alvo a apenas 2 metros de L1 para agarrar a bola acima da cabe\u00e7a.","variacaoDificil":"L1 realiza a mesma sequ\u00eancia do outro lado da quadra (virado para a sa\u00edda de rede direita, com o p\u00e9 esquerdo \u00e0 frente).","paraTurma":"Em turmas de 4 a 12 alunos, monte 2 esta\u00e7\u00f5es por meia-quadra (total de 4 esta\u00e7\u00f5es na quadra toda). As duplas ou trios trabalham em s\u00e9ries de 10 levantamentos cont\u00ednuos antes de rodar.","meta":"Colocar 8 de 10 levantamentos de manchete dentro da Zona Alvo a 1,5m da rede com arco suave e sem balan\u00e7ar os bra\u00e7os.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 posicionado no cone a 4m da rede lan\u00e7a a bola (seta 1) para L1 no cone central a 1,5m da rede. L1 usa extens\u00e3o de pernas e envia o levantamento (seta 2) para a Zona Alvo (1,5x1,5m) a 1,5m da rede na entrada esquerda.","codigo":"LMA-INI-077"},{"numero":78,"secao":5,"nome":"Levantamento parado com arco alto e dist\u00e2ncia segura da rede","nivel":"Iniciante","jogadores":"2 jogadores (1 atacante/passador A1 e 1 levantador L1)","tempo":"8 minutos","material":"3 bolas, 3 cones e 2 zonas alvo ZONA 1 ZONA 2 L1A1 1 2 3","objetivo":"Calibrar a altura m\u00ednima de 4 metros e a dist\u00e2ncia de 1 a 1,5 metro da fita para que o parceiro tenha tempo de aproximar na areia sem tocar na rede.","comoMontar":"Coloque L1 no centro da meia-quadra esquerda, a 2 metros da rede. Marque duas Zonas Alvo (1,5x1,5m) a 1,5 metro de dist\u00e2ncia da rede: Zona 1 na esquerda e Zona 2 na direita. Coloque 2 cones a 50 cm da rede como 'zona proibida' (muito colada na fita). A1 come\u00e7a a 5 metros da rede.","passoAPasso":["A1 envia uma bola controlada de manchete (ou lan\u00e7amento alto) dos 5 metros para as m\u00e3os de L1 aos 2 metros da rede.","L1 enquadra os dois ombros de frente para a Zona Alvo 1 (esquerda), aguarda a bola descer at\u00e9 a linha do quadril e levanta com arco alto (pelo menos 1,5m acima do bordo superior da rede).","A bola deve cair dentro da Zona Alvo 1 (entre 1m e 1,5m da rede), sem nunca invadir a faixa proibida de 50 cm da fita.","Na repeti\u00e7\u00e3o seguinte, L1 gira a base na areia de frente para a direita e levanta na Zona Alvo 2.","Ap\u00f3s 10 bolas alternadas (5 na esquerda e 5 na direita), A1 e L1 invertem as fun\u00e7\u00f5es."],"pontosAtencao":["Na quadra dura levanta-se a 50 cm da rede; na areia isso \u00e9 um erro grave porque o atacante salta para frente e toca na rede ou leva bloqueio fechado: mantenha sempre 1 a 1,5 metro de dist\u00e2ncia da fita.","Sempre vire o peito e a linha dos dois p\u00e9s para o alvo ANTES de tocar na bola.","Um levantamento alto na areia d\u00e1 tempo para o seu parceiro ler a defesa advers\u00e1ria."],"erroComum":"Levantar a bola com trajet\u00f3ria baixa e reta ('bola chutada'), n\u00e3o dando tempo ao atacante de sair do fundo; corrija exigindo que a bola ultrapasse a altura do topo das antenas. Varia\u00e7\u00f5es","variacaoFacil":"Fazer 5 bolas seguidas para o mesmo lado antes de virar a base para o lado oposto.","variacaoDificil":"A1 avan\u00e7a ap\u00f3s o passe e salta dentro da Zona Alvo para agarrar a bola no ponto mais alto com os dois bra\u00e7os estendidos.","paraTurma":"Com 4 a 12 alunos, coloque 1 levantador fixo no centro, 1 fila de passadores na esquerda e 1 fila na direita. O levantador alterna um levantamento para cada fila a cada 5 segundos e troca a cada 10 bolas.","meta":"Acertar 8 de 10 levantamentos dentro das Zonas Alvo (1 a 1,5m da rede) com altura superior \u00e0 antena.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 a 5m da rede passa a bola (seta 1) para L1 a 2m da rede no centro. L1 levanta alternadamente para a Zona Alvo 1 superior (seta 2) e Zona Alvo 2 inferior (seta 3), ambas posicionadas a 1,5m da rede.","codigo":"LMA-INI-078"},{"numero":79,"secao":5,"nome":"Avan\u00e7o do meio da quadra para levantar bola curta","nivel":"Iniciante","jogadores":"2 jogadores","tempo":"8 minutos","material":"4 bolas, 2 cones e 1 zona alvo ALVO 1,5m L1 A1 1 1 2 Avan\u00e7o de 4,5m 1,5m com parada total dos p\u00e9s Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 (a 5,5m da rede) envia a bola 1 para o cone a 1,5m da rede. L1 sai do cone a 4,5m da rede, avan\u00e7a em","objetivo":"Sair em velocidade do meio da quadra (4,5m), estancar os dois p\u00e9s na areia aos 1,5m da rede e levantar sem que a in\u00e9rcia da corrida jogue a bola para o outro lado.","comoMontar":"Na meia-quadra esquerda, coloque 1 cone de sa\u00edda para L1 a 4,5 metros da rede (lado direito) e 1 cone de ponto de levantamento a 1,5 metro da rede no centro. A1 fica a 5,5 metros da rede (lado esquerdo). Zona Alvo na entrada esquerda a 1,5m da rede.","passoAPasso":["L1 e A1 come\u00e7am no fundo/meio da quadra (simulando a posi\u00e7\u00e3o de recep\u00e7\u00e3o).","A1 joga ou passa a bola alta em dire\u00e7\u00e3o ao cone de 1,5 metro da rede.","Assim que a bola sai das m\u00e3os de A1, L1 arranca do cone de 4,5 metros em diagonal at\u00e9 o cone de 1,5 metro da rede.","Um passo antes de chegar na bola, L1 crava os dois p\u00e9s na areia fofa (p\u00e9 direito \u00e0 frente virando o peito para a linha lateral esquerda) anulando totalmente a velocidade da corrida.","Com os p\u00e9s 100% parados, L1 levanta de manchete alta para a Zona Alvo de A1; trocam a cada 8 bolas."],"pontosAtencao":["Se voc\u00ea tocar na bola enquanto ainda est\u00e1 correndo em dire\u00e7\u00e3o \u00e0 rede, a bola vai passar direto por cima da fita ('bola de gra\u00e7a').","Use os dois \u00faltimos passos ('direita-esquerda' ou 'esquerda-direita') como freio na areia e j\u00e1 gire o quadril de frente para o atacante.","Incline a plataforma um pouco mais para tr\u00e1s do que o normal para compensar o seu avan\u00e7o."],"erroComum":"Correr olhando para os p\u00e9s e chegar atrasado, tocando na bola quase ajoelhado em movimento; corrija fazendo L1 sair no exato instante em que a bola sobe da m\u00e3o de A1. Varia\u00e7\u00f5es","variacaoFacil":"L1 come\u00e7a mais perto (a 3 metros da rede) para ter mais tempo de frear os p\u00e9s.","variacaoDificil":"A1 avan\u00e7a ap\u00f3s o passe e realiza um ataque controlado (shot) por cima da rede ap\u00f3s o levantamento de L1.","paraTurma":"Em turmas de 4 a 12 alunos, forme duas filas no fundo (fila A1 na esquerda passa; fila L1 na direita infiltra e levanta). Ap\u00f3s cada sequ\u00eancia, os dois alunos trocam de fila.","meta":"Estancar os p\u00e9s e colocar 7 de 10 levantamentos na Zona Alvo sem deixar nenhuma bola passar direto para o outro lado da rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 (a 5,5m da rede) envia a bola 1 para o cone a 1,5m da rede. L1 sai do cone a 4,5m da rede, avan\u00e7a em diagonal (seta tracejada 1), freia os p\u00e9s no cone de 1,5m e levanta (seta de bola 2) para a Zona Alvo na entrada esquerda.","codigo":"LMA-INI-079"},{"numero":80,"secao":5,"nome":"Recuo r\u00e1pido da rede para levantar passe que ficou curto","nivel":"Iniciante","jogadores":"2 jogadores","tempo":"8 minutos","material":"4 bolas, 2 cones e 1 zona alvo ALVO 1,5m L1 A1 1 1 2 Recuo da rede (1m) at\u00e9 o passe curto (3,5m) Quadra 16x8m vista de cima. Na meia-quadra esquerda, L1 come\u00e7a no cone a 1m da rede. A1 (a 6m) envia um passe curto (seta de bola 1) para o cone a 3,5m da","objetivo":"Corrigir o erro de j\u00e1 ter corrido at\u00e9 a rede quando a recep\u00e7\u00e3o do parceiro fica curta no meio da quadra (aos 3,5m), recuando e levantando na paralela.","comoMontar":"Posicione 1 cone junto \u00e0 rede (a 1m da fita) onde L1 come\u00e7a, e 1 cone a 3,5 metros da rede no centro (onde o passe curto vai cair). A1 fica a 6 metros da rede na esquerda. Demarque a Zona Alvo na entrada esquerda a 1,5m da rede.","passoAPasso":["L1 come\u00e7a adiantado no cone a 1 metro da rede (como quem se antecipou achando que o passe viria perfeito na fita).","A1 envia um passe mais curto e alto que vai cair no cone de 3,5 metros da rede.","L1 abre imediatamente o quadril ficando de lado para a rede (peito virado para A1) e recua em passadas laterais/cruzadas r\u00e1pidas at\u00e9 o cone de 3,5m.","Ao chegar atr\u00e1s da bola aos 3,5m, L1 planta o p\u00e9 esquerdo (p\u00e9 de tr\u00e1s) firme na areia e inclina o tronco e o ombro direito levemente em dire\u00e7\u00e3o \u00e0 rede.","L1 empurra a bola em diagonal de dentro para fora para que ela caia na Zona Alvo a 1,5m da rede; trocam a cada 8 repeti\u00e7\u00f5es."],"pontosAtencao":["Nunca recue de costas olhando para a fita: vire de lado desde o primeiro passo para enxergar a bola e o seu atacante ao mesmo tempo.","Como voc\u00ea est\u00e1 levantando dos 3,5m da rede e quer colocar a bola aos 1,5m da rede, voc\u00ea precisa avan\u00e7ar o peso do p\u00e9 de tr\u00e1s para o p\u00e9 da frente em dire\u00e7\u00e3o \u00e0 Zona Alvo.","Avise o parceiro em voz alta: 'Bola vindo de dentro!'."],"erroComum":"Levantar a bola reto para a linha lateral (deixando a bola longe da rede aos 3,5m); corrija apontando o p\u00e9 da frente de L1 diretamente para o cone da Zona Alvo perto da rede. Varia\u00e7\u00f5es","variacaoFacil":"L1 come\u00e7a a 2 metros da rede e o passe cai a 3 metros (recuo curto de apenas 1 metro).","variacaoDificil":"A1 varia sem avisar entre um passe na rede (1,5m) e um passe curto atr\u00e1s de L1 (3,5m).","paraTurma":"Com 4 a 12 alunos, divida a quadra em duas metades (esquerda e direita funcionando juntas). Em cada metade, um trio trabalha o recuo da rede para os 3,5m e roda a cada 5 bolas.","meta":"Resgatar 7 de 10 bolas que ficaram aos 3,5m colocando-as dentro da Zona Alvo a 1,5m da rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, L1 come\u00e7a no cone a 1m da rede. A1 (a 6m) envia um passe curto (seta de bola 1) para o cone a 3,5m da rede. L1 recua da rede at\u00e9 os 3,5m (seta tracejada 1), firma a base e levanta em diagonal (seta de bola 2) para a Zona Alvo a 1,5m da rede.","codigo":"LMA-INI-080"},{"numero":81,"secao":5,"nome":"Corrida longa do meio para o fundo: resgate na linha de 7 metros","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"4 bolas, 2 cones e 1 zona alvo ALVO 2m L1 A1 1 1 2 Resgate no fundo (7m) empurrando at\u00e9 a Zona de 2m","objetivo":"Perseguir uma recep\u00e7\u00e3o ou defesa que espirrou para o fundo da quadra (7m), girar o corpo e devolver uma bola alta e atac\u00e1vel perto da rede.","comoMontar":"Coloque 1 cone a 2,5m da rede (posi\u00e7\u00e3o inicial de L1) e 1 cone l\u00e1 no fundo a 7 metros da rede. A1 fica a 5,5m da rede na esquerda. Demarque uma Zona Alvo de ataque a 2 metros da rede na entrada esquerda.","passoAPasso":["L1 aguarda aos 2,5m da rede; A1 simula uma recep\u00e7\u00e3o de saque viagem que espirrou alta para tr\u00e1s em dire\u00e7\u00e3o ao cone de 7 metros no fundo da quadra.","L1 abre o quadril e corre de frente em velocidade m\u00e1xima rumo ao fundo da quadra, acompanhando a bola por cima do ombro.","L1 ultrapassa a linha da bola um passo antes de ela cair aos 7 metros, planta o p\u00e9 de tr\u00e1s quase na linha de fundo e vira o peito para a Zona Alvo l\u00e1 na frente.","Usando um empurr\u00e3o potente das pernas na areia e transfer\u00eancia de tronco para frente, L1 lan\u00e7a a bola de manchete por 5 metros at\u00e9 cair na Zona Alvo (a 2m da rede).","Trocam de fun\u00e7\u00e3o a cada 6 resgates de fundo."],"pontosAtencao":["No resgate do fundo da quadra (7m), n\u00e3o tente colocar a bola colada na fita (1m) porque qualquer erro de for\u00e7a faz a bola passar de gra\u00e7a: mire a 2 ou 2,5 metros da rede.","Voc\u00ea precisa chegar ATR\u00c1S da bola e virar o peito para a rede; se tentar levantar de costas l\u00e1 dos 7 metros, a bola n\u00e3o chega na frente.","D\u00ea bastante altura (m\u00ednimo 5 metros) para que o seu parceiro tenha tempo de se posicionar."],"erroComum":"Bater na bola ainda correndo para o fundo sem parar o p\u00e9 de tr\u00e1s, fazendo a bola subir apenas 2 metros para frente; corrija exigindo a parada do p\u00e9 direito atr\u00e1s da bola antes do contato. Varia\u00e7\u00f5es","variacaoFacil":"Posicionar o cone de resgate a 5,5 metros da rede com lan\u00e7amento mais alto de A1.","variacaoDificil":"Ap\u00f3s o levantamento longo de L1 do fundo, A1 precisa atacar a bola de terceira por cima da rede.","paraTurma":"Em turmas de 4 a 12 alunos, o professor lan\u00e7a as bolas espirradas para o fundo (7m) enquanto duplas (L1 + A1) entram em quadra para resgatar e finalizar a jogada, rodando a cada 2 bolas.","meta":"Conseguir 6 de 10 levantamentos longos saindo dos 7m e caindo na Zona Alvo a 2m da rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 (a 5,5m) envia uma bola espirrada para tr\u00e1s (seta de bola 1) at\u00e9 o cone a 7m da rede. L1 sai dos 2,5m e corre at\u00e9 o cone de 7m (seta tracejada 1), vira de frente e envia um levantamento longo (seta de bola 2) at\u00e9 a Zona Alvo a 2m da rede.","codigo":"LMA-INT-081"},{"numero":82,"secao":5,"nome":"Resgate de passe espirrado fora da linha lateral (cuidado com a antena)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"4 bolas, 2 cones e 1 zona alvo ALVO 2x2m L1 A1 1 1 2 Resgate fora da quadra trazendo longe da antena (2m)","objetivo":"Buscar a bola na \u00e1rea livre fora da quadra e levant\u00e1-la de volta para dentro em uma rota segura que n\u00e3o passe por cima nem por fora da antena.","comoMontar":"Coloque 1 cone para L1 no centro da quadra (a 2,5m da rede) e 1 cone a 1,5 metro PARA FORA da linha lateral esquerda (na altura dos 3,5m da rede). Demarque a Zona Alvo dentro da quadra a 2 metros da rede e 2 metros da linha lateral. A1 come\u00e7a a 5,5m da rede.","passoAPasso":["A1 simula um passe que escapou pela lateral esquerda em dire\u00e7\u00e3o ao cone fora da quadra.","L1 arranca do centro (2,5m), cruza a linha lateral e chega ao cone externo.","Ao chegar na bola fora da quadra, L1 planta o p\u00e9 esquerdo por fora da bola e aponta os ombros para dentro da quadra (em \u00e2ngulo diagonal afastado da rede).","L1 executa a manchete alta trazendo a bola para a Zona Alvo (a 2m da rede e 2m da lateral), garantindo que a trajet\u00f3ria da bola passe longe da antena.","A1 ajusta a passada (entrando de dentro para fora) para receber a bola na Zona Alvo; trocam a cada 8 bolas."],"pontosAtencao":["Regra de ouro quando voc\u00ea levanta de fora da quadra: NUNCA levante em dire\u00e7\u00e3o \u00e0 fita da rede (1m), porque a bola vai passar exatamente por cima da antena e o \u00e1rbitro vai apitar bola fora!","Traga a bola sempre para 2 a 2,5 metros da rede (para dentro da quadra).","Levante o ombro externo (ombro esquerdo quando est\u00e1 fora na esquerda) para inclinar a plataforma para o centro da quadra."],"erroComum":"Parar de lado olhando para a antena e jogar a bola colada na rede em cima da antena; corrija pedindo para L1 mirar o levantamento no centro da quadra aos 2,5m. Varia\u00e7\u00f5es","variacaoFacil":"Colocar o cone exatamente em cima da fita da linha lateral.","variacaoDificil":"Fazer o resgate a 3 metros fora da linha lateral e exigir que A1 finalize o ponto atacando na paralela.","paraTurma":"Em turmas de 4 a 12 alunos, utilize os dois corredores externos da quadra (fora da lateral esquerda e fora da lateral direita) com duas duplas trabalhando simultaneamente.","meta":"Trazer 7 de 10 bolas de fora da quadra para dentro da Zona Alvo (2x2m) sem nenhuma bola cruzar a linha da antena.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 (a 5,5m) envia bola espirrada para fora da lateral superior (seta de bola 1) no cone a 1,5m fora da quadra. L1 corre do centro para fora da quadra (seta tracejada 1) e levanta em diagonal segura (seta de bola 2) para a Zona Alvo interna (a 2m da rede e 2m da lateral).","codigo":"LMA-INT-082"},{"numero":83,"secao":5,"nome":"Levantamento lateral de manchete com inclina\u00e7\u00e3o de ombros","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"4 bolas, 2 cones e 1 zona alvo ALVO 1,5m L1 A1 1 1 2 Inclina\u00e7\u00e3o lateral de ombros","objetivo":"Usar a inclina\u00e7\u00e3o lateral da plataforma quando a bola \u00e9 baixa/r\u00e1pida e o levantador s\u00f3 consegue chegar de frente para a linha lateral oposta.","comoMontar":"Coloque L1 no cone na lateral esquerda a 2,5m da rede e o cone de contato no centro a 2m da rede. A1 fica na direita a 5,5m da rede. Demarque a Zona Alvo na direita (sa\u00edda de rede) a 1,5m da fita.","passoAPasso":["A1 envia um passe mais r\u00e1pido e baixo para o cone central (a 2m da rede).","L1 sai da esquerda correndo em dire\u00e7\u00e3o \u00e0 direita (peito apontado para a linha lateral direita).","Como a bola veio baixa, L1 estanca os dois p\u00e9s de frente para a lateral direita (na mesma dire\u00e7\u00e3o da Zona Alvo) ou, se a bola ficou atr\u00e1s no centro, usa a manchete lateral inclinando o ombro esquerdo para baixo e o direito para cima.","Na segunda metade da s\u00e9rie, A1 pede a bola de volta na ESQUERDA (atr\u00e1s da corrida de L1): L1 para os p\u00e9s no centro e inclina os dois bra\u00e7os lateralmente para a esquerda, devolvendo a bola de manchete lateral sem precisar girar todo o corpo.","Trocam de fun\u00e7\u00e3o a cada 10 bolas."],"pontosAtencao":["A manchete lateral na praia \u00e9 feita mudando a altura dos ombros (abaixe o ombro para onde voc\u00ea quer que a bola v\u00e1 e suba o ombro oposto), nunca dobrando os cotovelos.","Mantenha o quadril baixo no \u00faltimo passo na areia para entrar por baixo da bola r\u00e1pida.","Evite balan\u00e7ar os bra\u00e7os para o lado como um taco de beisebol: posicione o \u00e2ngulo e empurre com as pernas."],"erroComum":"Girar o tronco violentamente batendo na bola de lado, perdendo totalmente o controle da dist\u00e2ncia da rede; corrija pedindo para travar o \u00e2ngulo dos ombros antes do toque. Varia\u00e7\u00f5es","variacaoFacil":"Realizar o movimento saindo a apenas 1,5 metro do cone central.","variacaoDificil":"A1 s\u00f3 grita 'FRENTE!' ou 'COSTAS/LADO!' quando L1 j\u00e1 est\u00e1 no meio da corrida at\u00e9 o centro.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 1 levantador no centro trabalhando s\u00e9ries de 6 bolas r\u00e1pidas lan\u00e7adas pelo professor enquanto os atacantes pegam a bola nas duas pontas.","meta":"Acertar 7 de 10 levantamentos laterais de manchete dentro da Zona Alvo a 1,5m da rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 (a 5,5m inferior) passa a bola (seta 1) para o cone central a 2m da rede. L1 corre da lateral superior at\u00e9 o centro (seta tracejada 1), freia e usa a inclina\u00e7\u00e3o lateral de ombros para enviar a bola (seta 2) at\u00e9 a Zona Alvo inferior a 1,5m da rede.","codigo":"LMA-INT-083"},{"numero":84,"secao":5,"nome":"Levantamento de manchete de costas (invers\u00e3o de lado)","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (1 passador/atacante na esquerda, 1 levantador e 1 atacante/alvo na direita)","tempo":"9 minutos","material":"4 bolas, 2 cones e 2 zonas alvo ZONA 1 (FRENTE) ZONA 2 (COSTAS) L1 A1 1 1 2 L1 olha p/ Zona 1 e levanta de costas na Zona 2 Quadra 16x8m vista de cima. Na meia-quadra esquerda, L1 no centro a 1,5m da","objetivo":"Executar o levantamento de manchete para tr\u00e1s da cabe\u00e7a com precis\u00e3o quando o levantador est\u00e1 de costas para o parceiro ou quer enganar o bloqueio.","comoMontar":"Posicione L1 no centro da quadra a 1,5 metro da rede, virado de frente para a entrada esquerda (de costas para a sa\u00edda direita). Marque a Zona Alvo 1 na frente dele (esquerda) e a Zona Alvo 2 atr\u00e1s das costas dele (direita), ambas a 1,5m da rede. A1 fica a 5m da rede.","passoAPasso":["L1 posiciona-se no centro olhando para a linha lateral esquerda; A1 envia o passe alto no centro e corre para atacar na direita (atr\u00e1s das costas de L1) \u2014 ou J2 aguarda na Zona Alvo 2.","L1 deixa a bola cair um pouco mais perto do peito/ombro (n\u00e3o t\u00e3o longe \u00e0 frente quanto no levantamento frontal).","No momento do contato, L1 estende os joelhos, projeta o quadril levemente para frente, arqueia o topo das costas e sobe os ombros apontando os polegares para cima/tr\u00e1s.","A bola sobe limpa por cima da cabe\u00e7a de L1 e cai dentro da Zona Alvo 2 \u00e0s suas costas (a 1,5m da rede).","Alternam levantamentos de frente (Zona 1) e de costas (Zona 2) para manter a mesma leitura corporal; rodam a cada 8 bolas."],"pontosAtencao":["Para levantar de manchete de costas, NUNCA dobre os cotovelos tentando jogar a bola para tr\u00e1s (se dobrar os cotovelos, a bola bate na sua testa ou vai para a rede): mantenha os cotovelos 100% travados e arqueie a coluna tor\u00e1cica jogando o quadril para frente.","Entre meio passo mais para debaixo da bola do que no levantamento normal.","Olhe para a bola no contato e s\u00f3 vire o pesco\u00e7o depois que a bola sair dos bra\u00e7os."],"erroComum":"Jogar a cabe\u00e7a para tr\u00e1s cedo demais antes de tocar na bola, errando o meio do antebra\u00e7o; corrija mantendo o queixo firme at\u00e9 sentir a bola tocar no antebra\u00e7o. Varia\u00e7\u00f5es","variacaoFacil":"L1 recebe a bola lan\u00e7ada a 2 metros de dist\u00e2ncia e foca apenas na mec\u00e2nica de costas para a Zona 2.","variacaoDificil":"A1 passa do meio da quadra e escolhe em sil\u00eancio correr para a Zona 1 ou para a Zona 2; L1 olha de relance antes do toque e levanta onde A1 entrou.","paraTurma":"Em turmas de 4 a 12 alunos, trabalhe em trios (J1 na esquerda, L1 no meio, J2 na direita). J1 passa para L1, que levanta de costas para J2; depois J2 passa para L1, que levanta de frente para J1.","meta":"Colocar 7 de 10 levantamentos de manchete de costas dentro da Zona Alvo 2 sem dobrar os cotovelos.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, L1 no centro a 1,5m da rede virado para cima (Zona Alvo 1). A1 passa a bola (seta 1) para L1 e desloca-se para baixo (seta tracejada 1). L1 executa o levantamento de manchete de costas (seta 2) caindo na Zona Alvo 2 inferior a 1,5m da rede.","codigo":"LMA-INT-084"},{"numero":85,"secao":5,"nome":"Ajuste de altura e dist\u00e2ncia do levantamento conforme o vento","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"10 minutos","material":"5 bolas, 4 cones e 2 zonas alvo ZONA 1 ZONA 2 L1A1 1 2 3 2: Baixo e firme (Contra)","objetivo":"Adaptar a altura do arco e a mira do levantamento de manchete para neutralizar o vento lateral ou o vento que sopra contra/a favor da rede.","comoMontar":"Observe a dire\u00e7\u00e3o real do vento na arena. Monte a esta\u00e7\u00e3o na meia-quadra esquerda com L1 no centro (a 2m da rede) e duas Zonas Alvo nas pontas (Zona Contra o Vento e Zona A Favor do Vento, ou com vento soprando da quadra para a rede).","passoAPasso":["Cen\u00e1rio 1 (Levantando CONTRA o vento lateral): quando A1 passa a bola e pede o levantamento para o lado de onde o vento vem soprando, L1 baixa o arco da bola (3,5m de altura) e empurra com 30% a mais de perna, mirando 1 metro mais para fora porque o vento vai frear e devolver a bola.","Cen\u00e1rio 2 (Levantando A FAVOR do vento lateral): quando o levantamento vai na mesma dire\u00e7\u00e3o do vento, L1 amortece o toque mirando no meio do caminho, pois o vento vai carregar a bola at\u00e9 a antena.","Cen\u00e1rio 3 (Vento soprando das costas para a rede): L1 mira todos os levantamentos a 2 metros da rede para o vento empurr\u00e1-los at\u00e9 os 1,2m ideais sem passar para o bloqueio advers\u00e1rio.","A dupla faz 6 levantamentos para o lado contra o vento e 6 para o lado a favor do vento, seguidos de chamada de ataque de A1.","Invertem os pap\u00e9is ap\u00f3s as 12 bolas."],"pontosAtencao":["Na praia, quanto mais alto voc\u00ea levantar em dia de vendaval, mais a bola vai 'dan\u00e7ar' no ar e tirar o tempo de salto do seu atacante: com vento forte, levante mais baixo e tenso.","O levantador deve sempre deixar a bola 'contra o vento' em rela\u00e7\u00e3o ao atacante (para que a bola venha na dire\u00e7\u00e3o do atacante e n\u00e3o fuja dele).","Olhe para a fita superior da antena antes do rally para lembrar para onde a brisa est\u00e1 puxando."],"erroComum":"Levantar uma bola alt\u00edssima a favor do vento, fazendo a bola passar da antena e sair da quadra; corrija reduzindo a altura do arco para apenas 1 metro acima da rede nos dias de vento forte. Varia\u00e7\u00f5es","variacaoFacil":"Treinar apenas um lado por vez com o professor indicando o ponto de mira compensado no ch\u00e3o.","variacaoDificil":"A cada 3 bolas, a dupla troca para o outro lado da rede (mudando completamente a rela\u00e7\u00e3o com o vento) e precisa acertar de primeira.","paraTurma":"Em turmas de 4 a 12 alunos, posicione duas duplas (uma em cada lado da rede) experimentando simultaneamente os efeitos opostos do vento do dia e trocando de quadra a cada 4 minutos.","meta":"Acertar 7 de 10 levantamentos dentro das Zonas Alvo compensando a deriva do vento sem que a bola saia pela antena.","descricaoDiagrama":"Quadra 16x8m vista de cima com indicador de Vento Forte soprando de cima para baixo e em dire\u00e7\u00e3o \u00e0 rede. A1 passa a bola (seta 1) para L1 no centro. L1 empurra firme contra o vento para a Zona Alvo 1 superior (seta 2) ou toca curto deixando o vento levar at\u00e9 a Zona Alvo 2 inferior (seta 3).","codigo":"LMA-INT-085"},{"numero":86,"secao":5,"nome":"Levantamento alto e descolado (2m da rede) para leitura de golpe do atacante","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (1 levantador L1, 1 atacante A1 e 1 defensor/bloqueador D1 do outro lado)","tempo":"10 minutos","material":"5 bolas, 2 cones e 2 zonas alvo de ataque ZONA 2m CUT SHOT PARALELA L1 A1 D1 1 2","objetivo":"Colocar a bola propositalmente a 2 metros da rede com bom arco para abrir todos os \u00e2ngulos de vis\u00e3o e golpes para o atacante.","comoMontar":"Na meia-quadra esquerda, marque a Zona de Levantamento Ideal um pouco mais afastada da rede (entre 1,8m e 2,2m da fita) na entrada esquerda. No lado direito, D1 atua como bloqueador/defensor e h\u00e1 2 Zonas Alvo de ataque (Diagonal Curta e Fundo Paralela).","passoAPasso":["A1 passa a bola dos 5,5m para L1 no centro da quadra.","L1 estabiliza os p\u00e9s e levanta de manchete com 4,5 metros de altura exatamente para a Zona Descolada (a 2 metros da rede).","Como a bola est\u00e1 a 2 metros da fita (e n\u00e3o colada na rede), A1 consegue saltar enxergando perfeitamente o bloqueador/defensor D1 com a vis\u00e3o perif\u00e9rica sem ficar preso no bloqueio.","Quando A1 est\u00e1 no ar, D1 faz um movimento claro (ex.: fecha a linha paralela ou recua na diagonal).","A1 usa o espa\u00e7o que o levantamento descolado deu e coloca a bola (ataque ou shot de ponta de dedo r\u00edgida) na Zona Alvo que ficou vazia do outro lado."],"pontosAtencao":["Bola colada na fita na praia s\u00f3 permite 1 golpe (bater para baixo em cima do bloqueio); bola a 2 metros da rede permite bater forte, dar cut shot na diagonal curta ou lob por cima do bloqueio!","Para o levantador: pense em deixar a bola 'no ombro de tr\u00e1s' do atacante para ele entrar batendo para frente.","Para o atacante: n\u00e3o reclame de bola a 2 metros da rede \u2014 na areia, essa \u00e9 a bola que mais gera ponto."],"erroComum":"O levantador tentar 'caprichar demais' colando a bola a 30 cm da fita e trancar o pr\u00f3prio atacante no bloqueio de D1; corrija invalidando o ponto se o levantamento cair a menos de 1,5m da rede. Varia\u00e7\u00f5es","variacaoFacil":"D1 escolhe sua posi\u00e7\u00e3o na quadra antes de A1 saltar para facilitar a leitura visual.","variacaoDificil":"Colocar uma dupla completa do outro lado (bloqueador + defensor) reagindo ao levantamento descolado.","paraTurma":"Em turmas de 4 a 12 alunos, jogue com 1 dupla atacando na esquerda e 1 dupla defendendo na direita, rodando a cada 4 ataques convertidos a partir da zona de 2 metros.","meta":"Colocar 8 de 10 levantamentos na zona de 2 metros da rede e converter 6 de 10 ataques nas zonas livres.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na esquerda, A1 passa (seta 1) para L1, que levanta de manchete na Zona Descolada a 2m da rede (seta 2). A1 avan\u00e7a (seta tracejada 1), l\u00ea a posi\u00e7\u00e3o de D1 do outro lado e ataca (setas 3) nas Zonas Alvo livres (Diagonal Curta ou Paralela Longa).","codigo":"LMA-AVA-086"},{"numero":87,"secao":5,"nome":"Sa\u00edda do bloqueio na rede e levantamento de transi\u00e7\u00e3o + Ataque (Transi\u00e7\u00e3o 1)","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (L1 bloqueador/levantador, A1 defensor/atacante e P/T atacando do outro lado)","tempo":"11 minutos","material":"5 bolas, 2 cones e 1 zona alvo ALVO 1,5m L1 A1 P/T 1 2","objetivo":"Treinar a transi\u00e7\u00e3o cl\u00e1ssica do v\u00f4lei de praia: o bloqueador sai da rede depois que a bola passa por ele, vira levantador de manchete no meio da quadra e prepara o contra-ataque do defensor.","comoMontar":"L1 come\u00e7a junto \u00e0 rede (bloqueador); A1 come\u00e7a no fundo a 6 metros da rede (defensor). Do outro lado da rede, P/T (professor ou 3\u00ba jogador) fica com bolas. Marque a Zona Alvo de levantamento na entrada esquerda a 1,5m da rede.","passoAPasso":["L1 salta para bloquear na rede (ou faz finta de bloqueio) enquanto P/T envia uma bola de ataque na diagonal para A1 no fundo.","A1 defende a bola de manchete alta para o meio da sua quadra (por volta dos 3 metros da rede).","Assim que L1 aterrissa do bloqueio na rede, ele vira o pesco\u00e7o, localiza a defesa de A1 subindo, sai da rede em corrida r\u00e1pida at\u00e9 o centro (3m) e para os dois p\u00e9s de frente para A1.","L1 executa o levantamento de manchete de transi\u00e7\u00e3o para a Zona Alvo (a 1,5m da rede).","A1, que defendeu l\u00e1 no fundo, corre em transi\u00e7\u00e3o, salta na Zona Alvo e finaliza o contra-ataque para o outro lado; rodam a cada 6 bolas."],"pontosAtencao":["No v\u00f4lei de praia, quem bloqueia na rede e n\u00e3o toca na bola \u00e9 SEMPRE o levantador do contra-ataque: saia da rede imediatamente assim que a bola cruzar por voc\u00ea.","Como a defesa de A1 nem sempre sobe no lugar perfeito, L1 precisa ser muito r\u00e1pido de pernas para chegar debaixo da bola e parar os p\u00e9s.","Se L1 perceber que a defesa de A1 foi dif\u00edcil e A1 caiu na areia, L1 deve levantar a bola 1 metro mais alta para dar tempo ao parceiro de levantar do ch\u00e3o e atacar!"],"erroComum":"L1 ficar na rede olhando para o advers\u00e1rio ap\u00f3s o bloqueio e demorar para virar para tr\u00e1s, chegando atrasado na defesa do parceiro; corrija exigindo que L1 j\u00e1 aterrisse do salto olhando para o fundo da pr\u00f3pria quadra. Varia\u00e7\u00f5es","variacaoFacil":"L1 apenas faz a amea\u00e7a de bloqueio sem saltar antes de abrir para levantar a defesa.","variacaoDificil":"P/T varia o ataque entre bola forte no fundo e largada curta, obrigando L1 a buscar o levantamento em qualquer parte da quadra.","paraTurma":"Em turmas de 4 a 12 alunos, o professor ataca do lado direito sobre um caixote enquanto duplas se revezam no lado esquerdo fazendo 2 transi\u00e7\u00f5es completas (bloqueio + defesa + levantamento de manchete + contra-ataque).","meta":"Converter 6 de 10 contra-ataques completos com levantamento de manchete preciso ap\u00f3s o salto de bloqueio.","descricaoDiagrama":"Quadra 16x8m vista de cima. P/T na direita ataca (seta 1) para A1 a 6m na esquerda. A1 defende para o centro aos 3m (seta 2). L1 sai da posi\u00e7\u00e3o de bloqueio na rede at\u00e9 os 3m (seta tracejada 1), levanta de manchete para a Zona Alvo (seta 3) e A1 avan\u00e7a (seta tracejada 2) finalizando o ataque (seta 4).","codigo":"LMA-AVA-087"},{"numero":88,"secao":5,"nome":"Defesa dif\u00edcil, levantamento de compensa\u00e7\u00e3o e ataque de largada/corte (Transi\u00e7\u00e3o 2)","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (Dupla A1 + L1 contra 1 lan\u00e7ador/defensor P/T)","tempo":"11 minutos","material":"5 bolas, 2 cones e 2 zonas alvo ALVO 1,8m L1 A1 P/T 1 2","objetivo":"Aprender a 'consertar' uma defesa que subiu longe da rede (aos 4,5m) com um levantamento de manchete que deixe o atacante em condi\u00e7\u00f5es de pontuar.","comoMontar":"Na meia-quadra esquerda, A1 na defesa (6m) e L1 retirando da rede para a paralela (5m). Coloque 1 cone aos 4,5m da rede onde a defesa deve subir. Zona Alvo de levantamento aos 1,8m da rede e Zonas de Ataque do outro lado.","passoAPasso":["L1 faz a retirada da rede para a paralela; P/T ataca uma bola dif\u00edcil que A1 defende caindo na areia, fazendo a bola subir atr\u00e1s da linha de 4,5 metros.","L1 corre at\u00e9 o cone de 4,5m, planta o p\u00e9 de tr\u00e1s e usa o impulso completo de pernas e tronco para empurrar o levantamento de manchete por 3 metros at\u00e9 a Zona Alvo perto da rede (1,8m).","Enquanto a bola viaja alta no ar, A1 se levanta r\u00e1pido da areia e acelera para a rede.","A1 salta equilibrado e finaliza o contra-ataque usando um golpe t\u00e9cnico da areia: 'cut shot' (corte de punho na diagonal curta) ou 'poke' (n\u00f3 dos dedos r\u00edgidos por cima do bloqueio).","Realizam 6 transi\u00e7\u00f5es e invertem quem defende e quem levanta."],"pontosAtencao":["Quando o seu parceiro est\u00e1 ca\u00eddo na areia depois de um peixinho ou defesa dif\u00edcil, a pior coisa que o levantador pode fazer \u00e9 levantar uma bola baixa e r\u00e1pida: d\u00ea ALTURA para o seu parceiro respirar e entrar na bola!","Levantar dos 4,5m at\u00e9 os 1,8m exige que L1 termine o movimento dando um passo \u00e0 frente na dire\u00e7\u00e3o do alvo (depois que a bola saiu do bra\u00e7o).","Lembre-se da regra da praia no ataque final: largada com a ponta dos dedos mole \u00e9 falta; use m\u00e3o cheia, corte de punho ou falanges r\u00edgidas (poke/cobra)."],"erroComum":"O levantador ter medo de empurrar a bola dos 4,5m e deixar o levantamento morrer aos 3,5m da rede, obrigando o parceiro a passar a bola de manchete; corrija premiando com ponto duplo todo levantamento que chegar na faixa de 1,5m a 2m da rede. Varia\u00e7\u00f5es","variacaoFacil":"A1 n\u00e3o precisa ir ao ch\u00e3o na defesa: apenas passa a bola alta para o cone de 4,5 metros.","variacaoDificil":"P/T defende os ataques do outro lado mantendo o rally vivo at\u00e9 a bola cair na areia.","paraTurma":"Em turmas de 4 a 12 alunos, jogue 2x2 de transi\u00e7\u00e3o: o professor lan\u00e7a uma bola dif\u00edcil obrigando um jogador da dupla a defender ajoelhado na areia; o parceiro levanta dos 4,5m e o ponto corre livre contra a dupla do outro lado.","meta":"Conseguir 6 de 10 levantamentos de compensa\u00e7\u00e3o que cheguem na Zona Alvo (1,8m) seguidos de ataque v\u00e1lido.","descricaoDiagrama":"Quadra 16x8m vista de cima. P/T envia bola dif\u00edcil (seta 1) para A1 no fundo esquerdo. A1 defende at\u00e9 o cone de 4,5m (seta 2). L1 desloca-se at\u00e9 os 4,5m (seta tracejada 1), empurra o levantamento longo at\u00e9 a Zona Alvo a 1,8m da rede (seta 3) e A1 levanta da areia avan\u00e7ando (seta tracejada 2) para finalizar na diagonal curta (seta 4).","codigo":"LMA-AVA-088"},{"numero":89,"secao":5,"nome":"Levantamento guiado pelo grito do atacante ('Ponta!' ou 'Meio!') + Ataque","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Dupla A1 + L1 contra Sacador S1 + Bloqueador B1)","tempo":"11 minutos","material":"5 bolas, 2 cones e 2 zonas alvo na rede PONTA MEIO L1 A1 B1 S1","objetivo":"Desenvolver a sintonia auditiva e a capacidade do levantador de mudar a dist\u00e2ncia do levantamento de manchete (na antena ou no meio) conforme o pedido do atacante.","comoMontar":"Na meia-quadra esquerda, marque duas Zonas Alvo de levantamento a 1,5m da rede: Zona 'Ponta' (a 1m da antena esquerda) e Zona 'Meio' (no centro da rede, perto de L1). Do outro lado, S1 saca e B1 bloqueia na rede.","passoAPasso":["S1 saca em dire\u00e7\u00e3o a A1 na meia-quadra esquerda.","A1 recepciona a bola para o centro da quadra onde L1 j\u00e1 infiltrou.","Enquanto a bola da recep\u00e7\u00e3o est\u00e1 subindo (antes de L1 tocar nela), A1 l\u00ea a posi\u00e7\u00e3o do bloqueador B1 na rede e grita em voz alta a sua escolha: 'PONTA!' (bola alongada at\u00e9 a Zona da antena) ou 'MEIO!' (bola curta subindo quase em cima da cabe\u00e7a de L1 no centro).","L1 ouve o comando e ajusta apenas o impulso das pernas na manchete: mais perna para alongar na 'Ponta', ou amortecimento vertical para subir no 'Meio'.","A1 entra no ponto pedido e ataca fugindo do bloqueio de B1."],"pontosAtencao":["A chamada de 'Meio!' (bola chutada/curta no centro perto do levantador) \u00e9 uma arma letal na praia porque deixa o bloqueador advers\u00e1rio sem saber se fecha o meio ou a antena.","Para o levantador: mantenha exatamente a mesma postura at\u00e9 o \u00faltimo instante para n\u00e3o denunciar ao bloqueador B1 onde a bola vai.","Para o atacante: o grito ('Ponta!' ou 'Meio!') precisa sair logo ap\u00f3s a sua manchete de recep\u00e7\u00e3o, nunca quando o levantador j\u00e1 est\u00e1 tocando na bola."],"erroComum":"O levantador empurrar demais a bola quando o atacante pediu 'Meio!', jogando a bola no lugar errado da corrida do parceiro; corrija na bola de 'Meio' apontando a plataforma a 80 graus quase vertical. Varia\u00e7\u00f5es","variacaoFacil":"Combinar antes do saque se a bola ser\u00e1 na Ponta ou no Meio usando sinal visual.","variacaoDificil":"Incluir uma 3\u00aa chamada: 'CHUTADA!' (bola mais r\u00e1pida e baixa na ponta para vencer o bloqueio no tempo).","paraTurma":"Em turmas de 4 a 12 alunos, jogue 2x2 com duplas revezando a cada 4 side-outs. O levantador ganha 1 ponto extra para a dupla toda vez que crava o levantamento exatamente na zona gritada pelo parceiro.","meta":"Acertar 7 de 10 levantamentos na zona pedida ('Ponta' ou 'Meio') com finaliza\u00e7\u00e3o de ataque efetiva.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 saca da direita (seta 1) para A1 na esquerda. A1 passa para L1 no centro (seta 2) e grita 'Ponta!' ou 'Meio!'. L1 levanta de manchete para a Zona Meio (seta 3a) ou para a Zona Ponta (seta 3b), e A1 ajusta a corrida (setas tracejadas) atacando contra o bloqueio B1 (seta 4).","codigo":"LMA-AVA-089"},{"numero":90,"secao":5,"nome":"Desafio do Levantador de Ouro: 3 passes quebrados + Side-out valendo ponto","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (2 contra 2 + lan\u00e7amentos de dificuldade)","tempo":"12 minutos","material":"6 bolas, 4 cones e 1 'Caixa de Ouro' (zona alvo de 1,5x1,5m) CAIXA OURO L1 A1 D1 D21 2 3","objetivo":"Transformar tr\u00eas situa\u00e7\u00f5es cr\u00edticas de recep\u00e7\u00e3o quebrada em levantamentos de manchete perfeitos dentro da 'Caixa de Ouro' para vencer o rally sob press\u00e3o.","comoMontar":"Na meia-quadra esquerda (Dupla A1 + L1), demarque a 'Caixa de Ouro' (1,5x1,5m a 1,5m da rede na entrada) e posicione 3 cones que representam os 3 passes ruins: Cone 1 (colado na rede na direita), Cone 2 (no fundo aos 6,5m) e Cone 3 (aberto fora da lateral). Dupla advers\u00e1ria (D1 + D2) no lado direito.","passoAPasso":["Cada dupla tem uma sequ\u00eancia de 3 bolas lan\u00e7adas (pelo treinador ou por D1) exatamente nos 3 cones de sufoco, simulando passes quebrados de A1:","Bola 1 (No Cone 1 - colada na rede): L1 corre, freia de lado para n\u00e3o tocar na fita e levanta de manchete na Caixa de Ouro para A1 atacar; o rally segue valendo ponto.","Bola 2 (No Cone 2 - l\u00e1 no fundo aos 6,5m): L1 recua r\u00e1pido at\u00e9 o fundo, gira o quadril e coloca a bola de manchete l\u00e1 dos 6,5m dentro da Caixa de Ouro para A1 atacar.","Bola 3 (No Cone 3 - fora da lateral): L1 sai da quadra e resgata de manchete trazendo para a Caixa de Ouro sem passar pela antena, e A1 finaliza o ponto.","Pontua\u00e7\u00e3o: se o levantamento de manchete cair na Caixa de Ouro E a dupla vencer o rally = 2 pontos; vence a dupla que somar 10 pontos primeiro."],"pontosAtencao":["Este \u00e9 o teste definitivo do levantador de areia: transformar uma bola ruim (onde o advers\u00e1rio acha que voc\u00ea s\u00f3 vai passar de gra\u00e7a) em uma bola cravada na m\u00e3o do seu atacante!","Em todas as 3 bolas de sufoco, a prioridade n\u00famero 1 de L1 \u00e9 chegar cedo com as pernas para tocar na bola com a base equilibrada.","O atacante A1 deve aguardar 1 segundo a mais no fundo antes de entrar, dando tempo de a bola longa chegar na Caixa de Ouro."],"erroComum":"Tentar usar toque de dedos desequilibrado nas bolas dos cones 2 e 3 e cometer falta de condu\u00e7\u00e3o; neste desafio \u00e9 OBRIGAT\u00d3RIO usar levantamento de manchete nas 3 bolas. Varia\u00e7\u00f5es","variacaoFacil":"Realizar as 3 bolas sem bloqueio advers\u00e1rio na rede (apenas contra os 2 defensores no fundo).","variacaoDificil":"Se L1 errar o levantamento (n\u00e3o colocar na zona atac\u00e1vel ou tocar na rede), a dupla advers\u00e1ria ganha 2 pontos autom\u00e1ticos.","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a um torneio r\u00e1pido de duplas: cada dupla entra no lado esquerdo para enfrentar a sua s\u00e9rie de '3 Bolas de Sufoco'. A dupla que fizer mais pontos na rodada desafia os campe\u00f5es da quadra.","meta":"Colocar pelo menos 2 das 3 bolas de cada rodada dentro da Caixa de Ouro e converter 60% dos ataques.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, L1 parte do centro para resgatar bolas lan\u00e7adas em 3 cones cr\u00edticos: Cone 1 na rede, Cone 2 no fundo (6,5m) e Cone 3 fora da lateral (setas tracejadas 1, 2 e 3). De cada cone, L1 levanta de manchete para a 'Caixa de Ouro' (1,5x1,5m) onde A1 ataca contra D1 e D2.","codigo":"LMA-AVA-090"},{"numero":91,"secao":6,"nome":"Moldura das m\u00e3os e entrada embaixo da bola","nivel":"Iniciante","jogadores":"2 jogadores (1 levantador L1 e 1 lan\u00e7ador A1)","tempo":"7 minutos","material":"2 bolas e 2 cones L1 A1 1 1 2 Entrada da testa sob a bola + Moldura alta sim\u00e9trica Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 no cone a 4m da rede lan\u00e7a a bola (seta 1) para perto do cone central a 1,5m da rede. L1 faz um ajuste curto na areia (seta tracejada 1) para colocar a testa embaixo da bola e devolve de","objetivo":"Formar a concha sim\u00e9trica dos dedos acima da testa e automatizar a entrada da cabe\u00e7a exatamente embaixo do eixo da bola na areia.","comoMontar":"Na meia-quadra esquerda, posicione 1 cone a 1,5 metro da rede no centro (para L1) e 1 cone a 4 metros da rede na entrada esquerda (para A1).","passoAPasso":["L1 posiciona-se no cone central (a 1,5m da rede) com os p\u00e9s afastados na largura dos ombros e o p\u00e9 direito meio passo \u00e0 frente.","Antes de A1 lan\u00e7ar a bola, L1 j\u00e1 eleva as duas m\u00e3os 15 cm acima da testa, formando um 'tri\u00e2ngulo/diamante' entre os polegares e indicadores, com os dedos abertos e curvos no formato da bola.","A1 lan\u00e7a a bola em arco alto a cerca de 50 cm de dist\u00e2ncia de L1, obrigando L1 a dar 1 passo curto na areia para colocar a testa exatamente embaixo da bola.","Na primeira metade (5 bolas), L1 deixa a bola encaixar na moldura das m\u00e3os acima da testa (sem deixar bater na palma) e congela por 1 segundo para checar se os dois cotovelos e punhos est\u00e3o sim\u00e9tricos.","Na segunda metade (5 bolas), L1 recebe na moldura alta e devolve com extens\u00e3o coordenada de pernas e bra\u00e7os para A1; trocam a cada 10 bolas."],"pontosAtencao":["Na areia, se a bola for tocada na altura do queixo ou do peito, o \u00e1rbitro marca condu\u00e7\u00e3o (carregada) imediatamente: o contato \u00e9 SEMPRE acima da testa.","Os polegares devem apontar um para o outro (e levemente para os olhos), nunca apontados para frente.","Toque na bola com as falanges dos dedos (especialmente polegar, indicador e m\u00e9dio), deixando um espa\u00e7o oco na palma da m\u00e3o."],"erroComum":"Esperar a bola com os bra\u00e7os abaixados e subir as m\u00e3os atrasado enquanto a bola j\u00e1 est\u00e1 caindo no rosto; corrija exigindo que as m\u00e3os subam para a testa assim que a bola atinge o ponto mais alto do lan\u00e7amento. Varia\u00e7\u00f5es","variacaoFacil":"A1 lan\u00e7a a bola diretamente em cima da cabe\u00e7a de L1 sem exigir deslocamento.","variacaoDificil":"L1 come\u00e7a sentado na areia; A1 lan\u00e7a a bola alta, L1 levanta r\u00e1pido, forma a moldura acima da testa e executa o toque.","paraTurma":"Em turmas de 4 a 12 alunos, divida em duplas frente a frente a 3 metros de dist\u00e2ncia ao longo da quadra. O professor passa corrigindo a dist\u00e2ncia entre os polegares e a altura dos cotovelos de cada aluno.","meta":"Realizar 9 de 10 entradas embaixo da bola com a moldura formada acima da testa antes do contato.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 no cone a 4m da rede lan\u00e7a a bola (seta 1) para perto do cone central a 1,5m da rede. L1 faz um ajuste curto na areia (seta tracejada 1) para colocar a testa embaixo da bola e devolve de toque alto (seta 2) para A1.","codigo":"LTO-INI-091"},{"numero":92,"secao":6,"nome":"Toque limpo na regra da areia: zero giro","nivel":"Iniciante","jogadores":"2 jogadores (1 levantador e 1 fiscal/receptor da rota\u00e7\u00e3o)","tempo":"8 minutos","material":"2 bolas coloridas (com gomos vis\u00edveis) e 2 cones L1 J2 1 2 Crit\u00e9rio da Areia: Zero Giro / Sem Condu\u00e7\u00e3o Quadra 16x8m vista de cima. Na meia-quadra esquerda, L1 e J2 posicionados em 2 cones afastados 3,5m a 2m da rede. Seta de bola 1 (lan\u00e7amento de J2 para L1) e seta de bola 2 (toque limpo sem rota\u00e7\u00e3o de L1 para J2).","objetivo":"Dominar a sa\u00edda simult\u00e2nea das duas m\u00e3os para que a bola suba sem rodar no ar, respeitando o crit\u00e9rio de arbitragem do v\u00f4lei de praia.","comoMontar":"Coloque 2 cones frente a frente a 3,5 metros de dist\u00e2ncia no meio da meia-quadra esquerda (paralelos \u00e0 rede). L1 em um cone e J2 no outro.","passoAPasso":["Explica\u00e7\u00e3o pr\u00e1tica na areia: no v\u00f4lei de praia existem duas faltas no toque \u2014 'Dois Toques' (quando uma m\u00e3o toca antes da outra e a bola sai rodando muito) e 'Condu\u00e7\u00e3o' (quando a bola descansa ou \u00e9 empurrada de baixo para cima desde o peito).","J2 lan\u00e7a a bola para o alto na dire\u00e7\u00e3o de L1.","L1 entra embaixo da bola, para os dois p\u00e9s na areia e executa um toque el\u00e1stico e \u00fanico acima da testa, finalizando com as duas palmas viradas para o alvo ('congelando' o acabamento das m\u00e3os no alto).","J2 observa atentamente os gomos da bola no ar: se a bola der no m\u00e1ximo 1 giro at\u00e9 chegar nele, J2 grita 'LIMPA!' (+1 ponto); se a bola vier girando r\u00e1pido ou fizer barulho de tapa, J2 apita 'FALTA!'.","Realizam s\u00e9ries de 10 toques cada um tentando zerar as faltas."],"pontosAtencao":["Para a bola sair sem giro (zero spin), a m\u00e3o direita e a m\u00e3o esquerda precisam aplicar exatamente a mesma press\u00e3o e sair da bola no mesmo milissegundo.","N\u00e3o bata seco nas pontas dos dedos (isso gera dois toques) e n\u00e3o afunde a bola at\u00e9 o nariz (isso gera condu\u00e7\u00e3o): fa\u00e7a um amortecimento el\u00e1stico r\u00e1pido de punhos.","Mantenha o acabamento das m\u00e3os estendidas apontando para o c\u00e9u por 1 segundo ap\u00f3s a bola sair."],"erroComum":"Tirar uma m\u00e3o antes da outra ou girar o punho para o lado no final do toque, fazendo a bola rodar como um pi\u00e3o; corrija pedindo para terminar com os dois indicadores apontando exatamente para a trajet\u00
