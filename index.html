a para a direita. A meia-quadra esquerda \u00e9 o 'Lado Ruim (Vento a Favor)': J1 e J2 passam recuados aos 2,5m (seta 2) e atacam controlado com topspin no meio (seta 4). A meia-quadra direita \u00e9 o 'Lado Bom (Contra o Vento)': A1 e A2 sacam agressivo (seta 1) e atacam forte no fundo sem medo de sair.","codigo":"TAT-INI-190"},{"numero":191,"secao":12,"nome":"Jogar com vento lateral: a t\u00e1tica do 'Corredor que Ajuda' vs. 'Corredor que Expulsa'","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (Dupla J1 + J2 contra Dupla A1 + A2)","tempo":"10 minutos","material":"5 bolas e 4 cones nas laterais VENTO LATERAL (CIMA BAIXO) PARALELA SEGURA (Vento segura) DIAGONAL CONTRA O VENTO PROIBIDO PARALELA AQUI (Vento joga fora!) J1 J2","objetivo":"Usar o vento cruzado (que sopra de uma linha lateral para a outra) para escolher de qual lado da quadra atacar e em qual receptor sacar.","comoMontar":"Considere que o vento lateral sopra de CIMA para BAIXO (da linha lateral esquerda para a linha lateral direita da quadra esquerda). Coloque cones destacando o Corredor Superior ('Vento traz pra dentro') e o Corredor Inferior ('Vento empurra pra fora').","passoAPasso":["\u00c1 Quando o vento sopra forte de uma lateral para a outra, os dois jogadores da dupla t\u00eam experi\u00eancias completamente opostas na rede:","Regra T\u00e1tica 1 (No Levantamento): se J2 levantar uma bola longa para o Corredor Inferior (a favor do vento lateral), o vento joga a bola para fora da antena! Por isso, no corredor para onde o vento sopra, o levantamento deve parar 1,5m ANTES da antena.","Regra T\u00e1tica 2 (Em quem sacar?): a dupla que saca (A1 + A2) deve sacar prioritariamente no receptor que ataca no corredor onde o vento atrapalha a chegada da bola (ou sacar perto da linha para onde o vento est\u00e1 empurrando a bola para fora!).","Regra T\u00e1tica 3 (No Ataque e Bloqueio): o atacante que est\u00e1 no Corredor Superior pode bater na paralela tranquilo porque o vento traz a bola para dentro; j\u00e1 o atacante do Corredor Inferior deve evitar a paralela (o vento joga fora!) e priorizar a DIAGONAL contra o vento!","Joguem 6 bolas explorando essa leitura e troquem de posi\u00e7\u00e3o."],"pontosAtencao":["Dica de mestre para o Bloqueador em dia de vento lateral: quando voc\u00ea for bloquear o atacante que est\u00e1 no corredor onde o vento empurra a bola para FORA da linha lateral, N\u00c3O feche a linha paralela (se ele bater na linha, o vento joga fora sozinho!).","D\u00ea um passo para dentro e feche a DIAGONAL!","O levantador deve sempre tentar se posicionar de forma a levantar CONTRA o vento lateral (onde a bola freia na m\u00e3o do atacante).","Observe a inclina\u00e7\u00e3o das antenas antes de escolher o seu golpe."],"erroComum":"O atacante que est\u00e1 na linha para onde o vento sopra tentar bater uma paralela cravada na linha e mandar a bola 1 metro para fora; corrija proibindo ataques na linha paralela no corredor de sa\u00edda do vento. Varia\u00e7\u00f5es","variacaoFacil":"Treinar primeiro apenas a combina\u00e7\u00e3o de passe + levantamento + ataque nos dois corredores sentindo a diferen\u00e7a do vento lateral.","variacaoDificil":"Jogo valendo ponto onde o bloqueio ganha 2 pontos toda vez que fechar a diagonal no lado onde o vento expulsa a bola pela linha.","paraTurma":"Em turmas de 4 a 12 alunos, posicione as duplas e pe\u00e7a que ap\u00f3s 4 bolas o jogador da esquerda troque de lado com o jogador da direita para que ambos aprendam a jogar no corredor com vento contra e no corredor com vento a favor.","meta":"Acertar 7 de 10 escolhas de levantamento e dire\u00e7\u00e3o de ataque respeitando a deriva do vento lateral.","descricaoDiagrama":"Quadra 16x8m vista de cima com setas azuis de Vento Lateral soprando de cima para baixo. Na esquerda, J1 no corredor superior ataca na linha paralela pois o vento segura a bola dentro (seta 3a); j\u00e1 J2 no corredor inferior recebe levantamento mais curto por dentro (seta 2b) e ataca cruzado na diagonal contra o vento (seta 3b) para a bola n\u00e3o sair pela lateral inferior.","codigo":"TAT-INT-191"},{"numero":192,"secao":12,"nome":"Escolha t\u00e1tica do alvo de saque: sobrecarregar um atacante ('Isolamento') vs. quebrar ritmo","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (Dupla J1 + J2 sacando contra A1 + A2 recebendo)","tempo":"10 minutos","material":"6 bolas e 3 zonas t\u00e1ticas de saque ISOLAMENTO (Saques 1 a 4 em A1) + SURPRESA (5 em A2) ZONA DE DESGASTE F\u00cdSICO DE A1 (4 SAQUES) ALVO 5: A2 'FRIO' J2 J1 A1 A2","objetivo":"Aplicar a t\u00e1tica cl\u00e1ssica de sacar 4 vezes seguidas no mesmo jogador para esgotar o f\u00edsico dele na areia e, no 5\u00ba saque, mudar de surpresa para o parceiro que estava 'frio'.","comoMontar":"Dupla J1 (na rede) e J2 (no saque) no lado esquerdo; Dupla A1 (receptor esquerdo) e A2 (receptor direito) no lado direito.","passoAPasso":["\u00c1 No v\u00f4lei de praia, voc\u00ea nunca saca aleatoriamente 'uma em cada um': se voc\u00ea alternar os saques entre A1 e A2, os dois descansam! A t\u00e1tica profissional \u00e9 o ISOLAMENTO seguido da QUEBRA DE RITMO.","Saques 1, 2, 3 e 4 (Fase de Isolamento e Desgaste): J2 saca 4 bolas seguidas exclusivamente em A1 \u2014 mas mudando o local dentro da metade de A1 (Saque 1 curto na frente de A1; Saque 2 fundo no canto de A1; Saque 3 no meio deslocando A1; Saque 4 no ombro externo de A1).","A1 \u00e9 obrigado a correr na areia fofa, recepcionar e saltar para atacar 4 vezes seguidas sob sol, enquanto A2 apenas levanta sem atacar nenhuma bola (ficando com o bra\u00e7o 'frio').","Saque 5 (A Armadilha da Quebra de Ritmo): quando A1 j\u00e1 est\u00e1 exausto esperando a 5\u00aa bola e A2 est\u00e1 relaxado achando que s\u00f3 vai levantar, J1 pisca o sinal nas costas e J2 crava um saque r\u00e1pido no peito de A2!","Jogam os 5 pontos completos e depois invertem as duplas."],"pontosAtencao":["Sacar 10 vezes seguidas no mesmo jogador, mas sempre paradinho no peito dele, s\u00f3 treina o passe dele!","Para o isolamento funcionar na areia, fa\u00e7a ele correr para a frente, para tr\u00e1s e para os lados antes de atacar.","Depois que um atacante pulou 5 vezes seguidas na areia fofa, ele perde cerca de 15 cm de impuls\u00e3o e come\u00e7a a largar bolas previs\u00edveis para a sua defesa.","O saque de surpresa no jogador 'congelado' (que ficou 10 minutos sem atacar no set) costuma gerar erro imediato na hora decisiva."],"erroComum":"Ter 'pena' de sacar sempre no mesmo jogador ou mudar de alvo logo no 2\u00ba saque sem criar desgaste f\u00edsico nem congelar o outro; corrija exigindo o cumprimento rigoroso do roteiro 4+1. Varia\u00e7\u00f5es","variacaoFacil":"Fazer a sequ\u00eancia 3+1 (3 saques movimentando A1 e o 4\u00ba saque de surpresa em A2).","variacaoDificil":"Se A1 conseguir virar os 4 ataques seguidos mesmo cansado, ele ganha 2 pontos extras para a sua dupla!","paraTurma":"Em turmas de 4 a 12 alunos, cada dupla que entra no saque executa um ciclo completo de 5 saques (4 no alvo de desgaste + 1 no alvo congelado) tentando vencer pelo menos 3 dos 5 ralis.","meta":"Cumprir a estrat\u00e9gia de 4 saques de desgaste em A1 + 1 saque surpresa em A2, conquistando pelo menos 3 pontos na s\u00e9rie de 5 bolas.","descricaoDiagrama":"Quadra 16x8m vista de cima. J2 saca da linha de fundo esquerda aplicando a t\u00e1tica 4+1: as setas de bola 1 (curta), 2 (funda), 3 (costura) e 4 (lateral) sobrecarregam A1 no corredor superior direito, for\u00e7ando-o a correr e atacar repetidamente. Na seta de bola 5 (tracejada vermelha), J2 muda de surpresa sacando no peito de A2 ('frio' no corredor inferior).","codigo":"TAT-INT-192"},{"numero":193,"secao":12,"nome":"Explorar o elo fraco: sacar no pior passador vs. sacar no melhor levantador","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (Dupla J1 + J2 contra Dupla A1 + A2 com perfis simulados)","tempo":"10 minutos","material":"5 bolas e 2 cones T\u00c1TICA: Sacar no Bom Levantador (A2) p/ A1 levantar! ALVO SAQUE: A2 J2 J1 A1 A2","objetivo":"Aprender o dilema t\u00e1tico mais inteligente da praia: quando sacar no jogador que recepciona pior e quando sacar no outro para obrigar o pior levantador a levantar!","comoMontar":"Dupla J1 e J2 sacando/defendendo na esquerda; Dupla A1 e A2 recebendo na direita.","passoAPasso":["\u00c1 Enigma T\u00e1tico do V\u00f4lei de Praia: na dupla advers\u00e1ria, imagine que A1 \u00e9 alto e ataca muito bem, mas levanta muito mal; j\u00e1 A2 \u00e9 baixinho e levanta perfeitamente na m\u00e3o de A1!","Se voc\u00ea sacar em A1 (achando que vai cans\u00e1-lo), A2 vai fazer um levantamento perfeito e A1 vai cravar a bola na sua cabe\u00e7a!","Rodada 1 (5 bolas \u2014 T\u00e1tica 'Tirar o Bom Levantador da Jogada'): J1 e J2 sacam exclusivamente em A2 (o bom levantador baixinho)! Por qu\u00ea? Porque assim OBRIGAM A1 (que levanta mal) a fazer o levantamento, e ainda obrigam A2 (mais baixo) a atacar contra o bloqueio alto de J1!","Rodada 2 (5 bolas \u2014 T\u00e1tica 'Afastar o Passador da Rede'): agora A1 tem dificuldade de deslocamento lateral; J2 saca tirando A1 para fora da linha lateral para que ele n\u00e3o consiga entrar para atacar.","Ao final das 10 bolas, analisam em qual das duas t\u00e1ticas a dupla J1 + J2 marcou mais pontos de bloqueio e defesa!"],"pontosAtencao":["Guarde essa li\u00e7\u00e3o para a vida toda na areia: 'Para parar um grande atacante quando o parceiro dele levanta muito bem, \u00e0s vezes o segredo \u00e9 sacar no PARCEIRO dele!'.","Quando voc\u00ea saca no melhor levantador da dupla advers\u00e1ria, voc\u00ea mata dois coelhos: tira o melhor levantador do 2\u00ba toque e tira o melhor atacante do 3\u00ba toque!","Observe nos primeiros 4 pontos do jogo quem da dupla advers\u00e1ria levanta melhor de manchete e de toque."],"erroComum":"Continuar sacando teimosamente num jogador que est\u00e1 virando todas as bolas porque o parceiro dele p\u00f5e a bola com a m\u00e3o na cabe\u00e7a dele; corrija trocando o alvo do saque imediatamente ap\u00f3s levar 2 side-outs perfeitos seguidos. Varia\u00e7\u00f5es","variacaoFacil":"O treinador define antes da s\u00e9rie qual jogador de A1/A2 s\u00f3 pode levantar de manchete longe da rede, simulando a defici\u00eancia t\u00e9cnica para J1/J2 explorarem.","variacaoDificil":"O treinador d\u00e1 um 'cart\u00e3o de perfil secreto' para A1 e A2 (ex.: A1 n\u00e3o pode atacar na paralela; A2 s\u00f3 pode levantar de manchete), e J1/J2 precisam descobrir a falha nos primeiros 3 pontos e explor\u00e1-la!","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a rod\u00edzio de duplas onde cada dupla que entra na recep\u00e7\u00e3o sorteia uma 'limita\u00e7\u00e3o secreta' que a dupla sacadora precisa diagnosticar na leitura de jogo.","meta":"Diagnosticar corretamente o elo vulner\u00e1vel (passe, levantamento ou estatura de ataque) e vencer pelo menos 6 de 10 ralis.","descricaoDiagrama":"Quadra 16x8m vista de cima. J2 na esquerda aplica a t\u00e1tica 'Tirar o Bom Levantador': em vez de sacar no atacante alto A1, J2 saca em A2 no corredor inferior (seta 1). Isso obriga A1 a correr do corredor superior para fazer um levantamento dif\u00edcil no centro (seta tracejada 1 e seta de bola 2), deixando A2 para atacar contra o bloqueio fechado de J1 (seta 3).","codigo":"TAT-INT-193"},{"numero":194,"secao":12,"nome":"Mapear e trancar o golpe n\u00ba 1 do atacante advers\u00e1rio (tirar o 'golpe de estima\u00e7\u00e3o')","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (Dupla J1 + J2 no bloqueio/defesa contra A1 + A2 no ataque)","tempo":"10 minutos","material":"5 bolas e 2 zonas de tend\u00eancia LEITURA DE PADR\u00c3O: A1 bate 70% Diagonal J1 e J2 trancam o trilho da Diagonal! TRILHO FAVORITO N\u00ba 1 DE A1 (DIAGONAL) TRANSI\u00c7\u00c3O J1 J2 A1","objetivo":"Identificar qual \u00e9 a dire\u00e7\u00e3o favorita de cada atacante advers\u00e1rio (especialmente sob press\u00e3o) e montar o sistema de bloqueio e defesa para trancar essa primeira op\u00e7\u00e3o.","comoMontar":"Dupla J1 (bloqueador) e J2 (defensor) na meia-quadra esquerda; Dupla A1 (atacante da direita) e A2 (atacante da esquerda) na meia-quadra direita.","passoAPasso":["\u00c1 Todo jogador de v\u00f4lei de praia (do iniciante ao ol\u00edmpico) tem um 'Golpe de Seguran\u00e7a / Estima\u00e7\u00e3o' que ele usa em 70% das bolas dif\u00edceis (ex.: a maioria dos destros na entrada adora bater na diagonal forte ou dar cut shot).","Nos primeiros 4 ataques, A1 e A2 atacam usando prioritariamente o seu golpe favorito real, enquanto J1 e J2 fazem a leitura mental do padr\u00e3o.","A partir do 5\u00ba ataque, J1 e J2 ajustam os sinais atr\u00e1s das costas especificamente para TRANCAR o golpe n\u00ba 1 daquele atacante (ex.: se A1 adora bater diagonal forte, J1 mostra 2 dedos fechando a diagonal no bloqueio OU mostra 1 dedo na linha e J2 fica plantado exatamente no trilho da diagonal de A1!).","Regra T\u00e1tica de Ouro: 'N\u00f3s n\u00e3o deixamos o advers\u00e1rio nos vencer com o melhor golpe dele! Se ele quiser fazer ponto na gente, vai ter que usar o golpe que ele N\u00c3O gosta!'.","Contam quantas defesas e bloqueios surgem assim que tiram a op\u00e7\u00e3o n\u00ba 1 do atacante."],"pontosAtencao":["Observe tamb\u00e9m de onde vem o levantamento: muitos atacantes batem na diagonal quando a bola vem de dentro, mas s\u00f3 conseguem bater na linha ou largar quando a bola fica presa na antena.","Quando voc\u00ea defende 2 vezes seguidas o golpe favorito do atacante, ele perde a confian\u00e7a e come\u00e7a a for\u00e7ar bolas para fora tentando fugir de voc\u00ea!","Lembre-se de que cada um dos dois advers\u00e1rios tem um padr\u00e3o diferente: ajuste o sinal conforme quem foi recepcionar."],"erroComum":"Jogar o set inteiro usando sempre o mesmo esquema fixo (ex.: bloquear sempre a linha e defender sempre a diagonal) mesmo contra um advers\u00e1rio que bate 9 de 10 bolas na diagonal; corrija adaptando o bloqueio ao h\u00e1bito do rival. Varia\u00e7\u00f5es","variacaoFacil":"O atacante A1 avisa antes quais s\u00e3o os seus 2 golpes principais (ex.: Diagonal Forte e Lob na Linha) e J1/J2 montam a armadilha para esses dois pontos.","variacaoDificil":"Jogo at\u00e9 11 pontos onde, se o atacante conseguir marcar 3 pontos usando o mesmo golpe no mesmo lugar da quadra, a dupla defensora perde o set por 'falha de leitura'!","paraTurma":"Em turmas de 4 a 12 alunos, os alunos da fila de espera fazem um 'Scout R\u00e1pido na Areia' (anotando com riscos no ch\u00e3o onde cada atacante em quadra bateu as \u00faltimas 4 bolas) e passam o relat\u00f3rio para a pr\u00f3xima dupla que vai entrar.","meta":"Neutralizar o golpe principal do atacante for\u00e7ando o erro ou conquistando a defesa em pelo menos 6 de 10 ataques.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 na direita tem tend\u00eancia n\u00ba 1 de atacar na diagonal cruzada (faixa vermelha tracejada). Lendo esse padr\u00e3o ap\u00f3s o saque (seta 1) e levantamento de A2 (seta 2), J1 fecha a diagonal no bloqueio (ou J2 antecipa na Zona de Tend\u00eancia n\u00ba 1), interceptando o ataque favorito de A1 (seta 3) e armando o contra-ataque (seta 4).","codigo":"TAT-INT-194"},{"numero":195,"secao":12,"nome":"Atacar o defensor mais lento e explorar a retirada do bloqueador","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Dupla J1 + J2 atacando contra A1 bloqueador + A2 defensor)","tempo":"11 minutos","material":"5 bolas e 3 zonas t\u00e1ticas de ataque ATACAR QUEM RETIRA: Explorar o bloqueador A1 em recuo (Curta 2,5m ou nos p\u00e9s 5m) 4a: CURTA 2,5m 4b: P\u00c9S DE A1J1 J2 A1 A2 1","objetivo":"Deixar de olhar apenas para os espa\u00e7os vazios est\u00e1ticos e atacar estrategicamente o defensor advers\u00e1rio que est\u00e1 em movimento, desequilibrado ou que acabou de retirar da rede.","comoMontar":"Dupla J1 e J2 no side-out na meia-quadra esquerda; Dupla A1 (na rede) e A2 (no fundo) na meia-quadra direita.","passoAPasso":["\u00c1 Quando a dupla advers\u00e1ria \u00e9 muito bem posicionada, como abrir buracos na defesa deles? Usando as 3 T\u00e1ticas de Ataque de Leitura:","T\u00e1tica 1 (Atacar o Bloqueador que Retira - 'Pulling'): quando A1 finge o bloqueio na rede e corre de costas/lado para defender na linha, ele quase sempre ainda est\u00e1 em movimento ou ofegante! J2 avisa 'SAIU LINHA!' e J1 ataca uma bola meia-for\u00e7a nos p\u00e9s de A1 (aos 3,5m) ou no contrap\u00e9 da corrida dele!","T\u00e1tica 2 (Pingar atr\u00e1s do Bloqueador Alto): se A1 \u00e9 muito alto e pesado na areia e salta inteiro para bloquear, ningu\u00e9m busca a bola que cai a 1,5m atr\u00e1s do calcanhar dele: J1 usa o 'poke' por cima de A1!","T\u00e1tica 3 (For\u00e7ar o Defensor a Correr para a Frente e depois para Tr\u00e1s): no primeiro rali, J1 solta um cut shot curto obrigando A2 a mergulhar na areia; no rali seguinte, como A2 vai ficar 1 passo adiantado com medo de outro cut shot, J1 solta o lob ou a bomba no fundo nas costas dele!","Disputam 8 ralis aplicando essa constru\u00e7\u00e3o sequencial de ataques."],"pontosAtencao":["Um bloqueador de 1,95m que acabou de correr da rede para o fundo na areia fofa tem metade da agilidade de um defensor de of\u00edcio: ataque na dire\u00e7\u00e3o dele variando curto e fundo!","Sempre pense o ataque em PARES de pontos: a bola curta que voc\u00ea mostra no Ponto 1 \u00e9 a isca que abre a linha de fundo no Ponto 2!","Bater a 70% de for\u00e7a na dire\u00e7\u00e3o do quadril/p\u00e9 de um defensor que ainda est\u00e1 correndo \u00e9 muito mais eficiente do que bater a 100% no peito dele parado."],"erroComum":"Ter medo do bloqueador que retirou da rede e atacar sempre na dire\u00e7\u00e3o do defensor especialista (A2) que j\u00e1 estava plantado e descansado l\u00e1 atr\u00e1s; corrija dando 2 pontos toda vez que o ataque vencer o jogador que retirou da rede (A1). Varia\u00e7\u00f5es","variacaoFacil":"A1 faz a retirada da rede em todas as bolas para J1 e J2 treinarem atacar exclusivamente o corredor do bloqueador que recua (curto aos 2,5m ou no p\u00e9 aos 5m).","variacaoDificil":"A1 e A2 variam livremente entre bloqueio real, falso bloqueio e troca de lados no fundo.","paraTurma":"Em turmas de 4 a 12 alunos, jogue s\u00e9ries de 4 bolas por dupla: o atacante explica rapidamente para o parceiro antes do saque qual das 3 t\u00e1ticas (castigar quem retira, pingar atr\u00e1s do bloco ou sequ\u00eancia curto-fundo) vai aplicar.","meta":"Converter 7 de 10 ataques explorando a movimenta\u00e7\u00e3o do bloqueador/defensor advers\u00e1rio.","descricaoDiagrama":"Quadra 16x8m vista de cima. A2 saca (seta 1), J1 passa (seta 2) e J2 levanta (seta 3). Na direita, o bloqueador A1 retira da rede correndo para a paralela superior (seta tracejada 1). J1 explora A1 em movimento atacando ou curto aos 2,5m onde A1 abandonou a rede (seta 4a) ou nos p\u00e9s de A1 aos 5m (seta 4b), fugindo do defensor especialista A2.","codigo":"TAT-AVA-195"},{"numero":196,"secao":12,"nome":"Mudan\u00e7a de plano t\u00e1tico durante o set ('Plano A para Plano B')","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Jogo t\u00e1tico 2x2 com gatilho de mudan\u00e7a obrigat\u00f3ria)","tempo":"11 minutos","material":"5 bolas e placar GATILHO 3 PTS PLANO B: Saque Curto A2 + Retirada! CURTO A2 J2 J1 A1 J2 J1","objetivo":"Desenvolver a capacidade de perceber rapidamente quando a estrat\u00e9gia inicial n\u00e3o est\u00e1 funcionando (ap\u00f3s sofrer 3 pontos seguidos) e acionar imediatamente um Plano B oposto.","comoMontar":"Quadra oficial 16x8m: Dupla J1 + J2 na esquerda contra Dupla A1 + A2 na direita.","passoAPasso":["\u00c1 Um dos maiores erros de duplas amadoras \u00e9 perder um set de 21x12 fazendo exatamente a mesma coisa do in\u00edcio ao fim sem mudar nada! Neste exerc\u00edcio, antes de come\u00e7ar o set at\u00e9 15 pontos, cada dupla define com o treinador o seu PLANO A e o seu PLANO B:","Exemplo de Plano A (In\u00edcio do Set): sacar em A1 na linha + bloquear a paralela com J1 + atacar bolas altas na ponta.","Exemplo de Plano B (Mudan\u00e7a Radical): sacar na costura ou em A2 curto + J1 fingir bloqueio e retirar ('dois no fundo') + acelerar levantamentos no meio e usar bolas de segunda!","Regra do Gatilho de Mudan\u00e7a: toda vez que uma dupla sofrer 3 pontos seguidos do advers\u00e1rio (ou na virada de lado do 7\u00ba ponto se estiver atr\u00e1s no placar), \u00e9 OBRIGAT\u00d3RIO pedir um 'Tempo T\u00e1tico de 15 segundos' na areia e ativar o PLANO B imediatamente!","A dupla que continuar repetindo o Plano A ap\u00f3s sofrer 3 pontos seguidos perde mais 1 ponto de penalidade t\u00e1tica."],"pontosAtencao":["No v\u00f4lei de praia voc\u00ea tem direito a 1 Pedido de Tempo (Time-out) de 30 segundos por set (al\u00e9m do tempo t\u00e9cnico quando a soma dos pontos chega a 21): nunca termine um set perdendo sem ter usado o seu pedido de tempo para quebrar o ritmo do sacador advers\u00e1rio!","Quando o ataque advers\u00e1rio est\u00e1 virando tudo contra o seu bloqueio de linha, mude no pr\u00f3ximo ponto: mostre o bloqueio e retire para o fundo, ou inverta para fechar a diagonal!","Mudar o alvo do saque por apenas 2 pontos j\u00e1 \u00e9 suficiente para tirar o advers\u00e1rio do piloto autom\u00e1tico."],"erroComum":"Confundir 'mudar de t\u00e1tica' com 'come\u00e7ar a for\u00e7ar bolas malucas': o Plano B deve ser uma mudan\u00e7a clara e organizada de alvo de saque e sistema de bloqueio/defesa. Varia\u00e7\u00f5es","variacaoFacil":"O treinador apita no meio do set gritando 'ACIONA PLANO B!' para acostumar as duplas a virarem a chave instantaneamente.","variacaoDificil":"A dupla advers\u00e1ria ganha 1 ponto extra se descobrir em voz alta qual foi a mudan\u00e7a t\u00e1tica que a outra dupla acabou de ativar ap\u00f3s o pedido de tempo!","paraTurma":"Em turmas de 4 a 12 alunos, dispute sets curtos de 11 pontos (com troca de plano obrigat\u00f3ria aos 5 pontos ou ap\u00f3s sofrer 3 pontos seguidos). As duplas de fora anotam qual plano funcionou melhor.","meta":"Reconhecer o momento de queda no set, acionar o Plano B sem atraso e quebrar a sequ\u00eancia de saques do advers\u00e1rio na primeira tentativa ap\u00f3s o ajuste.","descricaoDiagrama":"Quadra 16x8m vista de cima dividida em dois momentos t\u00e1ticos: no topo (Plano A), J2 saca em A1 (seta 1a) e J1 bloqueia a linha. Ap\u00f3s sofrerem 3 pontos, J1 e J2 re\u00fanem-se no quadro t\u00e1tico central 'ACIONA PLANO B!' e mudam radicalmente (embaixo): J2 saca curto em A2/costura (seta 1b) e J1 faz falso bloqueio retirando para defender com dois no fundo (seta tracejada 2).","codigo":"TAT-AVA-196"},{"numero":197,"secao":12,"nome":"Gest\u00e3o do placar ('Sem\u00e1foro de Risco'): quando arriscar e quando jogar seguro","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Partida 2x2 com cen\u00e1rios de placar comandados)","tempo":"12 minutos","material":"5 bolas e placar vis\u00edvel VERDE (14x9): Arriscar Linhas AMARELO (10x10): Equil\u00edbrio VERMELHO (19x19): Erro Zero! ZONA DE SEGURAN\u00c7A 19x19 (1m das linhas) J1 J2 A1 A2","objetivo":"Calibrar o n\u00edvel de risco do saque e do ataque de acordo com a diferen\u00e7a de pontos no placar e o momento do set (Sem\u00e1foro Verde, Amarelo e Vermelho).","comoMontar":"Quadra oficial 16x8m com Dupla J1 + J2 na esquerda e Dupla A1 + A2 na direita.","passoAPasso":["Jogar v\u00f4lei de praia com intelig\u00eancia significa entender o Sem\u00e1foro de Risco do Placar em 3 cen\u00e1rios que as duplas v\u00e3o jogar em sequ\u00eancia (4 minutos cada cen\u00e1rio):","Cen\u00e1rio 1 \u2014 SINAL VERDE (Placar 14 x 9 a seu favor): voc\u00ea tem 5 pontos de vantagem! Aqui voc\u00ea tem margem para ARRISCAR: for\u00e7ar o saque viagem/flutuante na linha buscando o ace, tentar bola de segunda e soltar o bra\u00e7o para fechar o set r\u00e1pido.","Cen\u00e1rio 2 \u2014 SINAL AMARELO (Placar 10 x 10 empatado no meio do set): equil\u00edbrio total. Jogo t\u00e1tico padr\u00e3o: saque firme mas com margem de 50 cm das linhas, passe alto no centro e ataque mesclando for\u00e7a e coloca\u00e7\u00e3o.","Cen\u00e1rio 3 \u2014 SINAL VERMELHO (Placar 19 x 19 ou 18 x 20 atr\u00e1s no fim do set): PROIBIDO DAR PONTO DE GRA\u00c7A! No Sinal Vermelho, qualquer erro de saque na rede ou ataque para fora custa o DOBRO (-2 pontos)! O saque tem que ser 100% dentro (t\u00e1tico na costura ou no receptor pressionado) e o ataque deve obrigar o advers\u00e1rio a defender!","Vence o exerc\u00edcio a dupla que somar mais vit\u00f3rias nos 3 cen\u00e1rios aplicando a gest\u00e3o correta."],"pontosAtencao":["Estat\u00edstica real do v\u00f4lei de praia: depois do ponto 18 em sets empatados, 75% dos sets s\u00e3o decididos n\u00e3o por uma jogada genial, mas por um ERRO N\u00c3O FOR\u00c7ADO da dupla que tentou dar uma pancada na linha sem necessidade!","Se o seu parceiro acabou de errar o saque anterior, o seu pr\u00f3ximo saque \u00e9 SEMPRE em 'Sinal Vermelho' (proibido dois erros de saque seguidos pela mesma dupla!).","Da mesma forma, se o advers\u00e1rio acabou de errar 2 bolas seguidas, n\u00e3o arrisque nada: coloque a bola dentro da quadra e deixe a press\u00e3o continuar do lado deles!"],"erroComum":"Sacar um viagem a 100% de for\u00e7a na rede quando o placar est\u00e1 19x20 contra voc\u00ea, entregando o jogo sem nem disputar o rali; corrija penalizando severamente erros diretos no Cen\u00e1rio 3. Varia\u00e7\u00f5es","variacaoFacil":"O treinador anuncia antes de cada ponto a cor do sem\u00e1foro ('PONTO VERDE!' ou 'PONTO VERMELHO!') para guiar a decis\u00e3o dos atletas.","variacaoDificil":"Jogar um set come\u00e7ando em 15x15 onde qualquer erro direto (saque fora/rede ou ataque fora/rede sem bloqueio) vale 2 pontos para o advers\u00e1rio.","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a rod\u00edzio de duplas onde cada dupla que entra sorteia um placar no quadro (ex.: 'Voc\u00eas entram vencendo de 16x12' ou 'Voc\u00eas entram perdendo de 17x19') e precisa jogar at\u00e9 21 de acordo com a situa\u00e7\u00e3o. Jogar v\u00f4lei de praia com intelig\u00eancia significa entender o Sem\u00e1foro de Risco do Placar em 3 cen\u00e1rios que as duplas v\u00e3o jogar em sequ\u00eancia (4 minutos cada cen\u00e1rio): 1 Cen\u00e1rio 1 \u2014 SINAL VERDE (Placar 14 x 9 a seu favor): voc\u00ea tem 5 pontos de vantagem! Aqui voc\u00ea tem margem para ARRISCAR: for\u00e7ar o saque viagem/flutuante na linha buscando o ace, tentar bola de segunda e soltar o bra\u00e7o para fechar o set r\u00e1pido. 2 Cen\u00e1rio 2 \u2014 SINAL AMARELO (Placar 10 x 10 empatado no meio do set): equil\u00edbrio total. Jogo t\u00e1tico padr\u00e3o: saque firme mas com margem de 50 cm das linhas, passe alto no centro e ataque mesclando for\u00e7a e coloca\u00e7\u00e3o. 3 Cen\u00e1rio 3 \u2014 SINAL VERMELHO (Placar 19 x 19 ou 18 x 20 atr\u00e1s no fim do set): PROIBIDO DAR PONTO DE GRA\u00c7A! No Sinal Vermelho, qualquer erro de saque na rede ou ataque para fora custa o DOBRO (-2 pontos)! O saque tem que ser 100% dentro (t\u00e1tico na costura ou no receptor pressionado) e o ataque deve obrigar o advers\u00e1rio a defender! 4 Vence o exerc\u00edcio a dupla que somar mais vit\u00f3rias nos 3 cen\u00e1rios aplicando a gest\u00e3o correta. 5 Estat\u00edstica real do v\u00f4lei de praia: depois do ponto 18 em sets empatados, 75% dos sets s\u00e3o decididos n\u00e3o por uma jogada genial, mas por um ERRO N\u00c3O FOR\u00c7ADO da dupla que tentou dar uma pancada na linha sem necessidade! Se o seu parceiro acabou de errar o saque anterior, o seu pr\u00f3ximo saque \u00e9 SEMPRE em 'Sinal Vermelho' (proibido dois erros de saque seguidos pela mesma dupla!). Da mesma forma, se o advers\u00e1rio acabou de errar 2 bolas seguidas, n\u00e3o arrisque nada: coloque a bola dentro da quadra e deixe a press\u00e3o continuar do lado deles! Guia de Treinos \u2022 V\u00f4lei de Praia 216","meta":"","descricaoDiagrama":"Quadra 16x8m vista de cima ilustrando o Sem\u00e1foro de Risco do Placar. No painel superior, os 3 modos: 'VERDE (14x9): Margem p/ for\u00e7ar linhas', 'AMARELO (10x10): T\u00e1tico equilibrado' e 'VERMELHO (19x19): Erro Zero! Margem de 1m das linhas'. Na quadra direita, a Zona Vermelha de Seguran\u00e7a Interna (a 1m das linhas laterais e de fundo) recebe o saque t\u00e1tico na costura (seta 1) e os ataques seguros (setas 4a e 4b).","codigo":"TAT-AVA-197"},{"numero":198,"secao":12,"nome":"Desafio 'Miss\u00e3o T\u00e1tica Secreta': jogo real com execu\u00e7\u00e3o de plano antes do ponto","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Jogo 2x2 oficial + treinador ou fila gerenciando as miss\u00f5es)","tempo":"12 minutos","material":"5 bolas e cart\u00f5es/comandos de miss\u00f5es t\u00e1ticas TCART\u00c3O DE T: [Miss\u00e3o Gato e Rato = 3 PTS] J1 J2 A1 A2 1","objetivo":"Executar sob press\u00e3o de jogo real um plano t\u00e1tico espec\u00edfico sorteado antes do ponto, enquanto a dupla advers\u00e1ria tenta ler e neutralizar a miss\u00e3o.","comoMontar":"Quadra oficial 16x8m em disputa 2x2: Dupla J1 + J2 na esquerda e Dupla A1 + A2 na direita. O treinador (T) fica pr\u00f3ximo ao poste da rede com a lista de Miss\u00f5es T\u00e1ticas.","passoAPasso":["Antes de cada bloco de 2 pontos, a dupla J1 + J2 vai at\u00e9 o treinador (T) na lateral e recebe em segredo uma Miss\u00e3o T\u00e1tica de Jogo Real que vale 3 PONTOS se for cumprida com vit\u00f3ria no rali:","Miss\u00e3o 1 ('Isca Curta + Bomba Fundo'): no 1\u00ba ponto, atacar obrigatoriamente uma bola curta aos 2m para puxar o defensor; no 2\u00ba ponto, atacar no fundo \u00e0s costas dele!","Miss\u00e3o 2 ('Armadilha de Falso Bloqueio'): sacar na linha lateral, mostrar bloqueio pesado na rede com J1, retirar no \u00faltimo segundo e defender a bola no fundo virando o contra-ataque!","Miss\u00e3o 3 ('Congelamento + Ataque de 2\u00aa'): sacar no melhor levantador advers\u00e1rio e, quando a defesa subir na m\u00e3o, finalizar o contra-ataque de segunda bola!","Miss\u00e3o 4 ('Gato e Rato na Diagonal'): J1 fecha a linha no bloqueio, J2 mostra que est\u00e1 escondido atr\u00e1s do bloco e corre no \u00faltimo instante para defender a diagonal!","A cada 2 pontos, \u00e9 a vez da Dupla A1 + A2 receber uma Miss\u00e3o Secreta; vence quem chegar a 15 pontos primeiro!"],"pontosAtencao":["Para cumprir a Miss\u00e3o T\u00e1tica valendo 3 pontos, a dupla precisa primeiro fazer bem o b\u00e1sico (recep\u00e7\u00e3o e levantamento na m\u00e3o): n\u00e3o tente for\u00e7ar a miss\u00e3o se a primeira bola espirrou para longe da quadra!","A dupla que N\u00c3O est\u00e1 com a miss\u00e3o secreta ganha 2 pontos extras se conseguir LER em tempo real o que o advers\u00e1rio est\u00e1 tramando e defender a jogada!","Esse exerc\u00edcio simula exatamente a mente de uma dupla campe\u00e3: entrar em cada ponto sabendo exatamente como quer construir a vit\u00f3ria daquele rali."],"erroComum":"Ficar t\u00e3o ansioso para cumprir a miss\u00e3o que denuncia a jogada olhando fixamente para o alvo 3 segundos antes de bater; corrija exigindo disfarce corporal completo at\u00e9 o salto. Varia\u00e7\u00f5es","variacaoFacil":"As pr\u00f3prias duplas escolhem livremente 1 miss\u00e3o de uma lista de 3 op\u00e7\u00f5es e avisam ao treinador em segredo antes do saque.","variacaoDificil":"Se a dupla tentar executar a Miss\u00e3o T\u00e1tica e cometer erro direto (na rede ou fora), perde 1 ponto no placar!","paraTurma":"Em turmas de 4 a 12 alunos, este \u00e9 o grande jogo de encerramento da Se\u00e7\u00e3o 12: os alunos que aguardam fora da quadra sorteiam a carta de miss\u00e3o para a dupla que vai entrar e apitam se a miss\u00e3o t\u00e1tica foi cumprida com perfei\u00e7\u00e3o.","meta":"Cumprir com \u00eaxito pelo menos 3 Miss\u00f5es T\u00e1ticas completas (conquistando os b\u00f4nus de 3 pontos) ao longo do set.","descricaoDiagrama":"Quadra 16x8m vista de cima com o Treinador (T) junto ao poste entregando o cart\u00e3o '[MISS\u00c3O SECRETA = VALE 3 PTS]' para J1 e J2. Na sequ\u00eancia do ponto: J2 saca t\u00e1tico na linha (seta 1), A1 passa (2) e A2 levanta (3). Cumprindo a miss\u00e3o, J1 aplica a finta de bloqueio na rede e retira (seta tracejada 1) enquanto J2 fecha a diagonal no 'Gato e Rato' (seta tracejada 2), defendendo o ataque (seta 4) e virando o contra-ataque (setas 5 e 6).","codigo":"TAT-AVA-198"},{"numero":199,"secao":13,"nome":"Jogo 2x2 de inicia\u00e7\u00e3o com bola lan\u00e7ada e 1 agarrada permitida no passe","nivel":"Iniciante","jogadores":"4 jogadores (Dupla J1 + J2 contra Dupla A1 + A2)","tempo":"10 minutos","material":"4 bolas e 4 cones para encurtar a linha de fundo aos 6 metros REGRA: Quadra 12x8m (6m de fundo) | In\u00edcio lan\u00e7ado | Manchete direta no 1\u00ba toque = 2 pts FORA (6-8m) FORA (6-8m) J1 J2 A1 A2","objetivo":"Permitir que alunos iniciantes experimentem a din\u00e2mica t\u00e1tica dos 3 toques do v\u00f4lei de praia (receber, levantar no centro e passar com inten\u00e7\u00e3o) sem que o rali morra no primeiro contato.","comoMontar":"Use 4 cones para adiantar a linha de fundo de ambos os lados para 6 metros da rede (quadra reduzida de 12x8m). Posicione J1 e J2 na esquerda e A1 e A2 na direita.","passoAPasso":["O ponto come\u00e7a n\u00e3o com saque batido, mas com A2 lan\u00e7ando a bola com as duas m\u00e3os por cima da rede da linha de 6 metros.","Regra Adaptada do 1\u00ba Toque: quem recebe a bola (ex.: J1) pode fazer manchete direta OU, se a bola vier dif\u00edcil, pode AGARRAR a bola em posi\u00e7\u00e3o baixa de manchete (bra\u00e7os estendidos) e lan\u00e7\u00e1-la imediatamente para o alto no centro da quadra.","O 2\u00ba toque (levantamento de J2) e o 3\u00ba toque (ataque de J1 de toque, manchete ou poke) devem ser executados normalmente batendo na bola sem segurar!","Do outro lado, A1 e A2 t\u00eam a mesma regra (podem segurar e lan\u00e7ar apenas o 1\u00ba contato de defesa, mas o 2\u00ba e 3\u00ba toques s\u00e3o normais).","Disputam sets curtos at\u00e9 11 pontos: todo ponto constru\u00eddo com 3 toques sem precisar agarrar a 1\u00aa bola vale 2 pontos!"],"pontosAtencao":["Mesmo quando o aluno optar por agarrar o 1\u00ba toque, exija que ele chegue atr\u00e1s da bola, abaixe o quadril na areia e grite 'MINHA!' antes de pegar.","Quem n\u00e3o pegou a primeira bola deve correr imediatamente para o centro da rede (a 1,5m da fita) para executar o levantamento real.","Incentive os alunos a olharem para o espa\u00e7o vazio da quadra advers\u00e1ria antes do 3\u00ba toque."],"erroComum":"Agarrar a bola em p\u00e9 com pregui\u00e7a de se deslocar e demorar 3 segundos segurando a bola; corrija permitindo no m\u00e1ximo 1 segundo com a bola na m\u00e3o para autolan\u00e7ar no centro. Varia\u00e7\u00f5es","variacaoFacil":"Permitir agarrar e autolan\u00e7ar tamb\u00e9m o 2\u00ba toque (levantamento) para turmas no primeiro dia de aula na areia.","variacaoDificil":"Proibir agarrar a bola: o 1\u00ba toque deve ser obrigatoriamente uma manchete de controle para o alto para si mesmo seguida de passe ao parceiro (4 toques na dupla).","paraTurma":"Em turmas de 4 a 12 alunos, jogue 'Rei da Quadra' r\u00e1pido de 2 pontos com essa regra adaptada: as duplas que aguardam na fila entram a cada rali mantendo todos em movimento.","meta":"Conseguir pelo menos 6 ralis com mais de 3 trocas de bola sobre a rede e converter 4 pontos sem precisar agarrar o 1\u00ba toque.","descricaoDiagrama":"","codigo":"JOG-INI-199"},{"numero":200,"secao":13,"nome":"Duelo 1x1 em mini-corredor curto (4x4m) com auto- levantamento","nivel":"Iniciante","jogadores":"2 jogadores por corredor (ou 4 jogadores em 2 corredores simult\u00e2neos)","tempo":"8 minutos","material":"4 bolas e 6 cones demarcando os quadrados de 4x4m REGRA: 1x1 em Quadrados Curtos 4x4m | Obrigat\u00f3rio 2 toques individuais (1\u00ba Auto-levante + 2\u00ba Golpe) ZONA INATIVA (4-8m) ZONA INATIVA (4-8m) J1 A1 J2 A2 12 3","objetivo":"Desenvolver o controle fino de bola na areia, a leitura de bolas curtas/longas em espa\u00e7o reduzido e a coordena\u00e7\u00e3o de passar para si mesmo antes de atacar.","comoMontar":"Divida a largura da rede ao meio (4 metros para cada lado) e coloque cones a 4 metros de profundidade da rede, criando duas mini-quadras de 4x4m em cada lado da rede. J1 enfrenta A1 no corredor superior; J2 enfrenta A2 no corredor inferior.","passoAPasso":["O jogo acontece exclusivamente dentro do quadrado de 4x4 metros (da fita da rede at\u00e9 a linha de 4 metros).","Regra de 2 Toques Obrigat\u00f3rios por Jogador: \u00e9 proibido passar a bola de primeira! Todo jogador que recebe a bola precisa dar o 1\u00ba toque (de manchete ou toque limpo) para o alto para si mesmo e usar o 2\u00ba toque para enviar a bola para o quadrado advers\u00e1rio.","O in\u00edcio do ponto \u00e9 feito com um saque de toque ou por baixo atr\u00e1s da linha de 4 metros.","Para passar a bola no 2\u00ba toque, valem apenas golpes controlados da praia: manchete, toque limpo perpendicular aos ombros, 'poke' (n\u00f3 dos dedos) ou 'cobra'.","Jogam sets de 7 pontos e depois os vencedores de cada corredor se enfrentam!"],"pontosAtencao":["Controle o seu 1\u00ba toque para que a bola suba no centro do seu quadrado de 4x4m (a 1,5m da rede), facilitando o seu 2\u00ba toque de ataque.","Enquanto a bola est\u00e1 no ar no seu auto-levantamento, olhe de relance para ver se o advers\u00e1rio est\u00e1 colado na rede ou recuado na linha de 4m.","Mantenha o centro de gravidade baixo na areia: em 4x4m a bola volta muito r\u00e1pido!"],"erroComum":"Dar o 1\u00ba toque muito baixo ou correndo para tr\u00e1s e ser obrigado a passar o 2\u00ba toque de qualquer jeito; corrija exigindo que o auto-levantamento tenha no m\u00ednimo 3 metros de altura. Varia\u00e7\u00f5es","variacaoFacil":"Permitir at\u00e9 3 toques seguidos pelo mesmo jogador (1\u00ba controla, 2\u00ba prepara e 3\u00ba passa a rede).","variacaoDificil":"Reduzir a \u00e1rea para 3x3 metros ou exigir que o 1\u00ba toque seja de manchete e o 2\u00ba toque seja obrigatoriamente de 'poke' (n\u00f3 dos dedos).","paraTurma":"Em turmas de 4 a 12 alunos, os 2 corredores de 4x4m acomodam 4 alunos jogando ao mesmo tempo e 2 filas de espera atr\u00e1s da linha de 4m entrando a cada ponto ('quem faz ponto fica').","meta":"Vencer um mini-set de 7 pontos mantendo precis\u00e3o de 80% no auto-levantamento sem cometer faltas de condu\u00e7\u00e3o.","descricaoDiagrama":"Quadra 16x8m dividida na frente em dois quadrados ativos de 4x4m colados \u00e0 rede (fundo de 4m a 8m hachurado fora de jogo). No corredor superior, J1 recebe o saque curto de A1 (seta 1), faz o auto-levantamento para o alto (seta 2) e ataca no canto de 4m de A1 (seta 3); no corredor inferior, J2 e A2 jogam simultaneamente. Regra: 'Quadra 4x4m | 2 toques obrigat\u00f3rios por jogador'.","codigo":"JOG-INI-200"},{"numero":201,"secao":13,"nome":"1x1 em meia-quadra longitudinal (8x4m) com 2 ou 3 toques individuais","nivel":"Iniciante","jogadores":"2 jogadores por corredor (ou 4 jogadores ocupando os dois corredores de 8x4m)","tempo":"10 minutos","material":"4 bolas e 6 cones dividindo a quadra ao meio de fundo a fundo REGRA: 1x1 em Meia-Quadra Longitudinal (8x4m) | 2 ou 3 toques seguidos do mesmo jogador CURTA FUNDO 8m J1 A1 J2 A2 1 2","objetivo":"Treinar o deslocamento frente-fundo na areia fofa (8 metros de comprimento) e a capacidade de alternar bolas curtas na rede com bolas profundas na linha de 8m.","comoMontar":"Coloque uma linha de cones dividindo a quadra ao meio de uma linha de fundo at\u00e9 a outra, formando dois corredores compridos de 8 metros de fundo por 4 metros de largura (16x4m cada pista). J1 x A1 na pista superior; J2 x A2 na pista inferior.","passoAPasso":["Cada jogador defende sozinho um corredor de 8m de profundidade por 4m de largura.","O saque \u00e9 feito normalmente atr\u00e1s da linha de fundo de 8 metros.","Regra Especial do 1x1 de Praia: o jogador pode usar 2 OU 3 toques seguidos sozinho (ex.: 1\u00ba recepciona de manchete para o meio da quadra, corre atr\u00e1s da pr\u00f3pria bola, 2\u00ba passa a bola ou levanta para si mesmo e 3\u00ba ataca!).","Como a quadra \u00e9 estreita (4m) mas comprida (8m), a estrat\u00e9gia vencedora \u00e9 fazer o advers\u00e1rio correr para a frente (largada aos 2m) e na bola seguinte jogar no fundo (lob aos 8m).","Disputam partidas de 4 minutos por bateria e trocam de advers\u00e1rio."],"pontosAtencao":["Quando voc\u00ea recepciona o saque l\u00e1 nos 6 metros, jogue o seu 1\u00ba toque alto e para a FRENTE (para os 3 metros da rede) para voc\u00ea j\u00e1 avan\u00e7ar atacando a rede!","Nunca fique parado no lugar onde voc\u00ea atacou: atacou na rede, recue imediatamente para o centro da sua pista (aos 4,5 metros da rede).","Respeite a regra de toque limpo caso use os dedos para passar a bola para o outro lado."],"erroComum":"Ficar pregado l\u00e1 na linha de 7 metros com medo da bola funda e levar todos os pontos em largadas curtas perto da rede; corrija marcando um cone central aos 4,5m onde o jogador deve sempre voltar ap\u00f3s passar a bola. Varia\u00e7\u00f5es","variacaoFacil":"Encurtar a profundidade da pista para 6 metros (corredor de 6x4m).","variacaoDificil":"Permitir no m\u00e1ximo 2 toques individuais (1\u00ba recepciona/defende avan\u00e7ando e no 2\u00ba j\u00e1 \u00e9 obrigado a atacar sobre a rede).","paraTurma":"Em turmas de 4 a 12 alunos, duas pistas de 8x4m funcionam ao mesmo tempo. Coloque 2 ou 3 alunos por meia-quadra fazendo rod\u00edzio a cada ponto disputado ('Rei do Corredor').","meta":"Marcar pelo menos 5 pontos por partida alternando bolas nos primeiros 3 metros da rede e nos \u00faltimos 2 metros do fundo.","descricaoDiagrama":"Quadra 16x8m dividida longitudinalmente por cones em dois corredores de 16x4m (8x4m de cada lado da rede). Na pista superior, A1 saca da linha de 8m (seta 1) para J1 aos 6m; J1 recepciona alto para a frente aos 3m (seta 2), corre na areia (seta tracejada) e finaliza no fundo de A1 (seta 3). Na pista inferior, J2 e A2 duelam em paralelo. Regra: 'Corredor 8x4m | 2 ou 3 toques do mesmo jogador'.","codigo":"JOG-INI-201"},{"numero":202,"secao":13,"nome":"Jogo 2x2 na 'Caixa Curta' (zona at\u00e9 5 metros) para dom\u00ednio de jogo curto","nivel":"Iniciante","jogadores":"4 jogadores (Dupla J1 + J2 contra Dupla A1 + A2)","tempo":"10 minutos","material":"4 bolas e 6 cones demarcando a linha de 5 metros REGRA: 2x2 na Caixa Curta (5x8m de cada lado) | Bola al\u00e9m dos 5m \u00e9 FORA! | Jogo curto sutil FORA (5-8m) FORA (5-8m) CUT CURTO J1 J2 A1","objetivo":"Aprimorar a leitura de bolas curtas, a comunica\u00e7\u00e3o r\u00e1pida em espa\u00e7o comprimido e o toque sutil sobre a rede.","comoMontar":"Coloque cones ou uma fita reserva a 5 metros da rede em ambos os lados, excluindo os \u00faltimos 3 metros de fundo (a quadra v\u00e1lida passa a ter 5m de profundidade por 8m de largura de cada lado). J1/J2 na esquerda; A1/A2 na direita.","passoAPasso":["Toda bola que cair al\u00e9m da linha de 5 metros \u00e9 considerada FORA!","O saque deve ser feito obrigatoriamente atr\u00e1s da linha de 5 metros usando saque por baixo ou flutuante curto controlado.","Como a quadra tem apenas 5 metros de fundo (mas mant\u00e9m os 8 metros inteiros de largura!), \u00e9 proibido dar cortada forte para baixo; o jogo exige precis\u00e3o cir\u00fargica nas laterais, nas diagonais curtas e nos pingos logo atr\u00e1s da rede.","A dupla \u00e9 obrigada a usar os 3 toques (recep\u00e7\u00e3o + levantamento + golpe colocado dentro dos 5m).","Jogam sets at\u00e9 11 pontos."],"pontosAtencao":["Com apenas 5 metros de profundidade, a linha de base dos defensores sobe para 3,5 metros da rede!","Explore toda a largura de 8 metros: fa\u00e7a a dupla advers\u00e1ria correr de uma antena at\u00e9 a outra.","No levantamento, mantenha a bola controlada para n\u00e3o empurrar o parceiro para fora da quadra."],"erroComum":"Esquecer que o fundo de 5 a 8 metros est\u00e1 fora de jogo e bater a bola longa demais; corrija exigindo arco curto e giro de punho (topspin/cut) para a bola mergulhar antes dos 5m. Varia\u00e7\u00f5es","variacaoFacil":"Permitir que o saque inicial seja feito a 3 metros da rede para garantir in\u00edcio f\u00e1cil de todos os ralis.","variacaoDificil":"Colocar 1 bloqueador obrigat\u00f3rio na rede em todos os pontos dentro da Caixa Curta de 5 metros!","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a rod\u00edzio de duplas a cada 2 pontos no formato 'Desafiantes da Caixa Curta', com a fila aguardando na zona inativa dos 8 metros.","meta":"Vencer um set de 11 pontos cometendo no m\u00e1ximo 2 erros de bola longa al\u00e9m da linha dos 5 metros.","descricaoDiagrama":"Quadra 16x8m com as faixas de fundo (dos 5m aos 8m de cada lado) hachuradas fora de jogo, restando a 'Caixa Curta' ativa de 5x8m de cada lado da rede. J1 e J2 enfrentam A1 e A2 explorando toda a largura de 8m com saques curtos (seta 1), passes (seta 2), levantamentos (seta 3) e diagonais curtas (seta 4). Regra: 'Quadra 5x8m | Fundo al\u00e9m de 5m \u00e9 FORA!'.","codigo":"JOG-INI-202"},{"numero":203,"secao":13,"nome":"Duelo 1x1 cruzado (s\u00f3 vale diagonal de meia-quadra)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (ou 4 jogadores cruzando em X com bolas alternadas)","tempo":"10 minutos","material":"4 bolas e 6 cones dividindo os quadrantes diagonais REGRA: 1x1 em Meia-Quadra Diagonal (8x4m Cruzado) | Corredores paralelos est\u00e3o FORA DE JOGO! PARALELA ESQ: FORA PARALELA DIR: FORA 3a: CUT 3b: DIAG FUNDA J1 A1 1 2","objetivo":"Treinar os \u00e2ngulos reais de diagonal (curta e longa) do v\u00f4lei de praia e o posicionamento corporal a 45 graus tanto no ataque quanto na defesa.","comoMontar":"Divida cada meia-quadra em 2 corredores (esquerdo e direito, de 8x4m). J1 joga no corredor superior esquerdo (8x4m) enfrentando A1 que est\u00e1 no corredor INFERIOR direito (8x4m) \u2014 formando uma disputa 100% em diagonal! Os outros dois quadrantes ficam fora de jogo (ou s\u00e3o usados pela dupla J2 x A2 alternando o rali).","passoAPasso":["J1 (no corredor superior esquerdo) saca cruzado em diagonal para o corredor inferior direito de A1.","Toda a partida acontece exclusivamente nessa diagonal cruzada: se a bola cair no corredor reto (paralela), \u00e9 considerada FORA!","Cada jogador tem direito a 2 toques individuais (1\u00ba toque defende/recepciona amortecendo na pr\u00f3pria diagonal e no 2\u00ba toque ataca cruzado de volta para o quadrante diagonal advers\u00e1rio).","Como a diagonal \u00e9 mais comprida, o jogador precisa cobrir desde o 'cut shot' curt\u00edssimo perto do centro da rede at\u00e9 a diagonal longa l\u00e1 no canto de 8 metros.","Jogam sets de 9 pontos e depois invertem a diagonal (corredor inferior esquerdo contra corredor superior direito) para treinar os dois \u00e2ngulos do corpo!"],"pontosAtencao":["Posicione os seus dois p\u00e9s e o seu umbigo sempre apontados em diagonal (45 graus) para o quadrante advers\u00e1rio.","No seu 1\u00ba toque de defesa, levante a bola um pouco para dentro da sua meia-quadra (perto da linha divis\u00f3ria central) para ter \u00f3timo \u00e2ngulo de ataque cruzado no 2\u00ba toque.","Use o 'cut shot' rente \u00e0 rede quando vir o advers\u00e1rio recuado no canto fundo."],"erroComum":"No 1\u00ba toque de defesa, deixar a bola espirrar para a linha lateral externa, ficando sem \u00e2ngulo para cruzar a bola no 2\u00ba toque; corrija levantando o ombro de fora na manchete para trazer a bola para o centro. Varia\u00e7\u00f5es","variacaoFacil":"Permitir um 'Levantador Neutro Fixo' (ou um 2\u00ba colega) parado junto ao centro da rede de cada lado para transformar o jogo em 3 toques na diagonal.","variacaoDificil":"Permitir que o jogador ataque de 1\u00aa bola caso o advers\u00e1rio mande uma bola alta demais perto da rede.","paraTurma":"Em turmas de 4 a 12 alunos, coloque um levantador fixo no centro de cada lado da rede e fa\u00e7a filas de duelo 1x1 cruzado nas duas diagonais (sai uma bola na diagonal A, termina o rali e j\u00e1 sai a bola na diagonal B).","meta":"Marcar 9 pontos acertando pelo menos 3 bolas de 'cut shot' curto e 3 bolas no canto fundo da diagonal.","descricaoDiagrama":"Quadra 16x8m dividida em 4 quadrantes: est\u00e3o ativos apenas o quadrante superior esquerdo (J1) e o quadrante inferior direito (A1), com os outros dois quadrantes hachurados fora de jogo. A1 saca em diagonal (seta 1) para J1; J1 controla no 1\u00ba toque (seta 2), avan\u00e7a (seta tracejada) e ataca cruzado na diagonal curta ou longa de A1 (setas 3a e 3b). Regra: 'Jogo 1x1 100% Diagonal | Paralela \u00e9 FORA!'.","codigo":"JOG-INT-203"},{"numero":204,"secao":13,"nome":"Jogo 2x2 em quadra estreita (corredor de 16x5m) para precis\u00e3o linear","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (Dupla J1 + J2 contra Dupla A1 + A2)","tempo":"10 minutos","material":"4 bolas e 6 cones estreitando a largura para 5 metros REGRA: 2x2 em Corredor Estreito (16x5m) | Faixa inferior de 3m est\u00e1 FORA DE JOGO! FAIXA LATERAL DE 3 METROS FORA DE JOGO (QUADRA ESTREITA 16x5m) 4a: CURTA 4b: FUNDO J1 J2","objetivo":"For\u00e7ar a dupla a jogar de forma compacta, refinando o levantamento reto na linha e a coordena\u00e7\u00e3o frente-fundo entre bloqueador e defensor.","comoMontar":"Coloque uma linha de cones a 3 metros de uma das linhas laterais de ponta a ponta, reduzindo a largura da quadra de 8 metros para 5 metros (quadra de 16m de comprimento por 5m de largura). J1 e J2 na esquerda; A1 e A2 na direita.","passoAPasso":["Com apenas 5 metros de largura para dois jogadores, quase n\u00e3o existe espa\u00e7o lateral: o jogo passa a ser um duelo vertical de FRENTE vs. FUNDO e de explora\u00e7\u00e3o do bloqueio!","Na recep\u00e7\u00e3o, J1 e J2 dividem os 5 metros (2,5m para cada um) com alt\u00edssima precis\u00e3o para n\u00e3o baterem cabe\u00e7a na costura.","Na defesa, B1 \u00e9 obrigado a bloquear na rede fechando metade do corredor de 5m, enquanto D1 fica atr\u00e1s cuidando do corredor restante e dos lobs no fundo.","Como a quadra \u00e9 estreita, qualquer levantamento ou ataque que espalhe para os lados vai para fora: exige-se controle absoluto de ombros alinhados com a linha lateral.","Jogam um set at\u00e9 15 pontos."],"pontosAtencao":["Em uma quadra estreita de 5 metros, o bloqueio \u00e9 rei: o atacante n\u00e3o consegue fugir abrindo muito \u00e2ngulo, ent\u00e3o precisa variar entre bater forte no corredor livre, usar o lob alto at\u00e9 os 8m ou explorar as bordas da m\u00e3o do bloqueador!","O levantador deve manter a bola no eixo central dos 5 metros.","Comunique cada passo com o parceiro porque voc\u00eas est\u00e3o muito pr\u00f3ximos na areia."],"erroComum":"Tentar dar cut shot muito angulado esquecendo que a quadra s\u00f3 tem 5 metros de largura e jogar a bola para fora dos cones; corrija trabalhando golpes retos no fundo e curtos na frente. Varia\u00e7\u00f5es","variacaoFacil":"Aumentar a largura do corredor para 6 metros.","variacaoDificil":"Reduzir a largura para apenas 4 metros (2x2 em meia- quadra longitudinal!), exigindo precis\u00e3o cir\u00fargica de passe e ataque.","paraTurma":"Se estreitar para 4 metros cada corredor, a quadra oficial 16x8m comporta DUAS partidas de 2x2 simult\u00e2neas (8 jogadores jogando ao mesmo tempo: 4 na pista superior de 16x4m e 4 na pista inferior de 16x4m!).","meta":"Vencer o set de 15 pontos com menos de 3 erros de ataque para fora das linhas laterais estreitas.","descricaoDiagrama":"Quadra 16x8m com uma faixa lateral de 3m hachurada fora de jogo, restando um corredor ativo estreito de 16x5m. Dentro dos 5m de largura, A2 saca (seta 1) para J1 e J2; J1 recepciona (seta 2), J2 levanta controlado no eixo estreito (seta 3) e J1 ataca contornando o bloqueio de A1 rumo ao fundo ou curta (setas 4a e 4b). Regra: '2x2 em Corredor Estreito 16x5m | Precis\u00e3o Linear'.","codigo":"JOG-INT-204"},{"numero":205,"secao":13,"nome":"Jogo 2x2 condicionado: 'Proibido atacar na paralela' (s\u00f3 vale diagonal)","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (Dupla J1 + J2 contra Dupla A1 + A2)","tempo":"10 minutos","material":"5 bolas e 4 cones marcando a zona proibida da linha REGRA: Proibido atacar na Paralela no 3\u00ba toque! | S\u00f3 vale ponto cruzando na Diagonal ZONA PROIBIDA P/ ATAQUE DA ESQUERDA 4a: CUT SHOT 4b: DIAG LONGA J1 J2","objetivo":"Treinar o atacante a superar um bloqueio e uma defesa que j\u00e1 sabem que a bola vai cruzar na diagonal, variando for\u00e7a, altura e cut shot.","comoMontar":"Quadra oficial 16x8m. Em ambos os lados, coloque 2 cones demarcando um corredor de 2mx4m na linha paralela onde o ataque de 3\u00aa bola \u00e9 PROIBIDO de cair.","passoAPasso":["O saque, a recep\u00e7\u00e3o e o levantamento s\u00e3o normais na quadra inteira.","Regra de Restri\u00e7\u00e3o no Ataque: toda bola de ataque (3\u00ba toque) precisa obrigatoriamente cruzar a quadra em DIAGONAL (caindo na metade oposta ao lado de onde o atacante pulou)!","Se o atacante estiver na esquerda e atacar na paralela esquerda (mesmo que caia na quadra), \u00e9 ponto autom\u00e1tico do advers\u00e1rio!","Desafio Mental: como o bloqueador e o defensor advers\u00e1rio J\u00c1 SABEM que voc\u00ea \u00e9 proibido de atacar na paralela, eles v\u00e3o fechar a diagonal! Como fazer ponto ent\u00e3o? Usando as 3 varia\u00e7\u00f5es da diagonal: 1) Pancada na diagonal longa no fundo; 2) Cut shot curt\u00edssimo perto da antena oposta; 3) Bater alto explorando os dedos do bloqueio na diagonal!","Ap\u00f3s 7 minutos, invertem a regra para 'Proibido atacar na diagonal \u2014 s\u00f3 vale atacar no corredor da paralela!'."],"pontosAtencao":["Quando a defesa j\u00e1 sabe que voc\u00ea vai na diagonal, bater meia-for\u00e7a a 5 metros da rede \u00e9 entregar a bola na m\u00e3o do defensor: ou voc\u00ea bate forte no fundo/costura, ou voc\u00ea corta curto nos 2 metros!","Para o levantador: deixe a bola a 1,5m\u20132m da rede para dar \u00e2ngulo ao atacante de fugir do bloqueio fechado na diagonal.","Para a defesa: aproveitem a regra para treinar a leitura fina entre pancada cruzada e cut shot."],"erroComum":"O atacante saltar muito colado na fita da rede e ficar trancado de frente com o bloqueador que j\u00e1 fechou a diagonal; corrija mantendo o salto afastado da rede para enxergar por onde contornar o bloqueio. Varia\u00e7\u00f5es","variacaoFacil":"Proibir o bloqueador de saltar na rede (jogar contra 2 defensores posicionados na diagonal).","variacaoDificil":"O bloqueador fecha a diagonal m\u00e9dia e o defensor fecha a diagonal funda, deixando apenas o cut shot curto ou o lob diagonal como janelas.","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a rod\u00edzio de duplas a cada 3 pontos: na 1\u00aa volta vale s\u00f3 diagonal; na 2\u00aa volta vale s\u00f3 paralela.","meta":"Converter pelo menos 6 ataques na diagonal mesmo contra o sistema defensivo concentrado nesse setor.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra direita, o corredor superior da paralela est\u00e1 marcado em vermelho 'PROIBIDO ATACAR NA LINHA'. Ap\u00f3s saque (seta 1), passe de J1 (seta 2) e levantamento de J2 (seta 3), J1 ataca da ponta esquerda sendo obrigado a cruzar na diagonal contra A1 e A2: usando Cut Shot curto (seta 4a), Diagonal Forte (seta 4b) ou Diagonal Funda (seta 4c).","codigo":"JOG-INT-205"},{"numero":206,"secao":13,"nome":"Jogo 2x2 de habilidade pura: 'Proibido Cortar Forte' (Festival de Shots)","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (Dupla J1 + J2 contra Dupla A1 + A2)","tempo":"11 minutos","material":"5 bolas REGRA: Proibido Cortar Forte! | S\u00f3 valem Golpes Colocados (Poke, Cobra, Cut Shot e Lob) 3a: POKE 3b: CUT 3c: LOB LINHA 3d: LOB DIAG J1 J2","objetivo":"Desenvolver a vis\u00e3o perif\u00e9rica no ar, o toque refinado dos golpes colocados da areia (poke, cobra, cut shot e lob) e a leitura de defesa.","comoMontar":"Quadra oficial 16x8m completa (8x8m de cada lado) com Dupla J1 + J2 na esquerda e Dupla A1 + A2 na direita.","passoAPasso":["Partida 2x2 em quadra inteira onde \u00e9 TERMINANTEMENTE PROIBIDO dar cortada forte (bater de m\u00e3o cheia com velocidade para baixo)!","Para passar a bola no ataque (2\u00ba ou 3\u00ba toque), s\u00f3 s\u00e3o permitidos os golpes de habilidade regulamentares do v\u00f4lei de praia: 'Cut Shot' (giro de punho suave), 'Lob' (bola alta no canto de 8m), 'Poke' (n\u00f3 dos dedos r\u00edgidos), 'Cobra' (pontas dos dedos unidas e duras) ou toque limpo perpendicular aos ombros.","Aten\u00e7\u00e3o ao disfarce: apesar de ser proibido bater forte, o atacante \u00e9 obrigado a saltar e armar o bra\u00e7o alto olhando para os defensores antes de escolher onde colocar a bola!","Como ningu\u00e9m pode matar o ponto na for\u00e7a bruta, os ralis ficam longos e cheios de peixinhos, exigindo que o atacante olhe onde os dois advers\u00e1rios est\u00e3o parados para jogar a bola exatamente onde a areia est\u00e1 vazia!","Qualquer largada ilegal (m\u00e3o aberta com dedos moles empurrando a bola) ou batida forte d\u00e1 ponto ao advers\u00e1rio."],"pontosAtencao":["Muitos jogadores que dependem s\u00f3 da for\u00e7a do ombro ficam perdidos neste jogo nos primeiros minutos \u2014 e logo descobrem que mirar nos 4 cantos extremos da quadra (2m na frente e 8m no fundo) mata mais pontos do que qualquer pancada!","Na defesa: como n\u00e3o existe pancada no fundo, os dois defensores ficam mais centralizados aos 4 metros prontos para correr!","Use o 'chamado do levantador' (Se\u00e7\u00e3o 11) em 100% das bolas para achar o buraco vazio."],"erroComum":"Passar a bola de manchete para o meio da quadra advers\u00e1ria s\u00f3 para n\u00e3o errar, entregando contra-ataque f\u00e1cil; corrija exigindo que todo 3\u00ba toque seja feito saltando e mirando nos cantos. Varia\u00e7\u00f5es","variacaoFacil":"Permitir o uso da manchete no 3\u00ba toque apenas quando o levantamento ficar atr\u00e1s da linha de 4 metros.","variacaoDificil":"Se a bola colocada cair na areia sem que nenhum dos dois advers\u00e1rios consiga sequer relar o dedo nela ('Shot Perfeito'), vale 2 pontos!","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a um mini-torneio de sets de 7 pontos s\u00f3 de 'Shots': \u00e9 um excelente jogo para misturar alunos fortes com alunos iniciantes/veteranos em p\u00e9 de igualdade t\u00e9cnica!","meta":"Conquistar pelo menos 5 pontos de 'Shot Limpo' (bola tocando a areia vazia nos cantos) sem cometer faltas de largada aberta.","descricaoDiagrama":"Quadra 16x8m inteira ativa com destaque nos 4 cantos alvos da meia-quadra direita (2 zonas curtas a 2m e 2 zonas de lob a 8m). Ap\u00f3s passe de J1 (seta 1) e levantamento de J2 (seta 2), J1 salta lendo a posi\u00e7\u00e3o de A1 e A2 e escolhe entre Poke curto na linha (seta 3a), Cut Shot na antena oposta (seta 3b) ou Lob nos cantos de 8m (setas 3c/3d). Regra: 'Proibido Cortar Forte | S\u00f3 Golpes Colocados'.","codigo":"JOG-INT-206"},{"numero":207,"secao":13,"nome":"Rei da Quadra cl\u00e1ssico ('King of the Court' com fila de duplas desafiantes)","nivel":"Intermedi\u00e1rio","jogadores":"6 a 12 jogadores (3 a 6 duplas em rota\u00e7\u00e3o cont\u00ednua)","tempo":"12 minutos","material":"6 bolas e cesto de bolas na linha de fundo desafiante REI DA QUADRA: S\u00f3 pontua no Lado do Rei (Direita) | Venceu na Esquerda Sobe pro Trono! LADO DO REI / TRONO (VALE PONTO)LADO DESAFIANTE (FILA NO FUNDO) F1 F2 SE DESAFIANTE VENCER CORRE P/ O TRONO E FILA (F1/F2) ENTRA! J1","objetivo":"Treinar a capacidade de virar o side-out na primeira tentativa sob press\u00e3o de elimina\u00e7\u00e3o imediata ('errou, saiu para a fila').","comoMontar":"A meia-quadra DIREITA \u00e9 o 'Lado do Rei/Trono' (onde fica a dupla detentora da coroa, A1 + A2). A meia- quadra ESQUERDA \u00e9 o 'Lado Desafiante' (onde est\u00e1 a dupla J1 + J2). Atr\u00e1s da linha de fundo esquerda ficam as demais duplas na fila de espera (F1 + F2) j\u00e1 com bola na m\u00e3o.","passoAPasso":["Regras Oficiais do Rei da Quadra de Treino: apenas a dupla que est\u00e1 no Lado do Rei (direita) pode somar pontos no placar geral!","O rali sempre come\u00e7a com a dupla que est\u00e1 na fila de espera (ou a dupla Desafiante que acabou de entrar na esquerda) sacando para o Lado do Rei, OU com o treinador sacando na dupla Desafiante.","Formato mais din\u00e2mico (Saque no Desafiante): um jogador do Lado do Rei (A2) saca contra a dupla Desafiante (J1 + J2).","Se a dupla Desafiante (J1 + J2) vencer o rali: eles N\u00c3O ganham ponto ainda, mas DERRUBAM o Rei! A1 e A2 saem para o fim da fila, J1 e J2 correm por baixo da rede assumindo o Lado do Rei (direita), e a dupla da fila (F1 + F2) j\u00e1 entra na esquerda!","Se a dupla do Rei (A1 + A2) defender o ataque desafiante e vencer o rali: o Rei marca +1 PONTO, continua no Trono e enfrenta imediatamente a pr\u00f3xima dupla da fila (F1 + F2)!"],"pontosAtencao":["Velocidade de transi\u00e7\u00e3o entre ralis: assim que a bola cai no ch\u00e3o definindo o vencedor do rali, a dupla que perdeu tem 3 segundos para sair da quadra pelas laterais e o pr\u00f3ximo saque j\u00e1 \u00e9 autorizado!","Quando voc\u00ea est\u00e1 no Lado Desafiante (esquerda), a sua \u00fanica miss\u00e3o \u00e9 virar o side-out sem errar de gra\u00e7a para conquistar o direito de ir para o Trono.","Quando voc\u00ea chega no Lado do Rei (direita), capriche no saque e no bloqueio porque s\u00f3 ali voc\u00ea pontua!"],"erroComum":"A dupla da fila (F1 + F2) ficar conversando distra\u00edda fora da quadra e demorar para entrar quando o ponto acaba; corrija descontando 1 ponto da dupla da fila se ela n\u00e3o estiver pisando na linha de fundo em 3 segundos. Varia\u00e7\u00f5es","variacaoFacil":"Se a dupla do Rei cometer erro de saque (na rede ou fora), eles n\u00e3o perdem o trono de primeira: t\u00eam direito a um '2\u00ba saque de vida extra', mas sem valer ponto se vencerem.","variacaoDificil":"Falta de saque do Lado do Rei derruba o Rei na hora!","paraTurma":"Este \u00e9 o formato n\u00famero 1 do mundo para turmas de 6, 8, 10 ou 12 alunos em uma \u00fanica quadra de areia: giro alt\u00edssimo, zero fila parada e competitividade m\u00e1xima!","meta":"Ser a primeira dupla a acumular 7 pontos no Lado do Rei (ou somar pelo menos 3 coroas de defesa no Trono).","descricaoDiagrama":"Quadra 16x8m vista de cima. A meia-quadra direita \u00e9 o 'LADO DO REI (Trono)' com A1 e A2. A meia-quadra esquerda \u00e9 o 'LADO DESAFIANTE' com J1 e J2, e atr\u00e1s da linha de fundo esquerda aguarda a fila F1 e F2. A2 saca (seta 1) para J1/J2; se J1/J2 vencerem o rali (setas 2, 3 e 4), J1/J2 avan\u00e7am por baixo da rede assumindo o Trono (seta tracejada longa) e F1/F2 entram na quadra.","codigo":"JOG-INT-207"},{"numero":208,"secao":13,"nome":"Giro r\u00e1pido de 4 a 6 duplas: 'Para subir ao Trono precisa confirmar 2 bolas'","nivel":"Intermedi\u00e1rio","jogadores":"8 a 12 jogadores (4 a 6 duplas em rod\u00edzio de alta intensidade)","tempo":"12 minutos","material":"8 bolas e cesto com o treinador na lateral GIRO DE 4\u20136 DUPLAS: Desafiante precisa virar Side-out (1-4) + Defender Bola 2 de T (5-6) p/ subir! F1 F2 F3 T J1","objetivo":"Aumentar o tempo de cada dupla em quadra em turmas grandes exigindo que a dupla desafiante ven\u00e7a o side-out E uma bola de transi\u00e7\u00e3o antes de assumir o trono.","comoMontar":"Mesma estrutura de Trono (direita, A1 + A2) e Desafiantes (esquerda, J1 + J2), com as duplas F1/F2 aguardando no fundo esquerdo e o Treinador (T) no poste da rede com cesto de bolas.","passoAPasso":["Quando a turma \u00e9 grande (4 a 6 duplas), o Rei da Quadra de 1 bola s\u00f3 \u00e0s vezes passa r\u00e1pido demais. Neste formato de 'Confirma\u00e7\u00e3o Dupla', cada desafiante joga 2 bolas encadeadas:","Bola 1: A2 (do Trono) saca em J1 + J2 (Desafiantes). Se o Trono vencer a Bola 1, o Trono j\u00e1 ganha +1 ponto e entra a pr\u00f3xima dupla da fila (F1 + F2).","Por\u00e9m, se os Desafiantes (J1 + J2) vencerem a Bola 1 (virarem o side-out), eles ainda N\u00c3O derrubaram o Rei: no mesmo segundo, o Treinador (T) lan\u00e7a uma Bola 2 de Confirma\u00e7\u00e3o para o Lado do Rei (A1 + A2) atacar!","J1 e J2 precisam defender o ataque do Rei na Bola 2 e matar o contra-ataque para confirmar a queda do Rei e subir ao Trono j\u00e1 com +1 ponto b\u00f4nus!","Se o Rei vencer a Bola 2, o Rei salva a sua coroa ('defendeu o trono') e continua l\u00e1 contra a pr\u00f3xima dupla da fila!"],"pontosAtencao":["Esse formato cria ralis espetaculares porque a dupla que est\u00e1 no Trono luta pela vida na Bola 2 mesmo depois de levar o side-out na Bola 1!","Para os Desafiantes (J1 + J2): assim que matarem a Bola 1, j\u00e1 montem bloqueio e defesa imediatamente porque a Bola 2 do treinador j\u00e1 est\u00e1 subindo!","As duplas da fila fora da quadra t\u00eam a fun\u00e7\u00e3o de buscar as bolas espalhadas e alimentar o cesto do treinador sem parar."],"erroComum":"A dupla Desafiante comemorar a Bola 1 achando que j\u00e1 subiu para o Trono e levar a Bola 2 desprevenida; corrija lan\u00e7ando a Bola 2 sem esperar comemora\u00e7\u00e3o. Varia\u00e7\u00f5es","variacaoFacil":"A Bola 2 do treinador \u00e9 lan\u00e7ada no lado dos pr\u00f3prios Desafiantes (J1 + J2) para eles apenas confirmarem um segundo ataque seguido.","variacaoDificil":"Se a dupla do Trono vencer 3 duplas desafiantes seguidas, ganha um 'Super B\u00f4nus' de +2 pontos e tem direito a descansar 1 rodada sem perder a coroa.","paraTurma":"Ideal para turmas cheias de 8 a 12 alunos: mant\u00e9m o ritmo card\u00edaco l\u00e1 no alto e garante que toda dupla toque bastante na bola.","meta":"Conquistar o Trono vencendo as duas bolas seguidas (Side-out + Defesa de Confirma\u00e7\u00e3o) e somar 6 pontos no placar.","descricaoDiagrama":"Quadra 16x8m com Treinador (T) junto ao poste central. Na Bola 1: A2 saca do Trono (seta 1) e J1/J2 viram o side-out (setas 2, 3, 4). Para confirmar a subida ao Trono, T lan\u00e7a imediatamente a Bola 2 para o lado do Rei (seta 5); A1 ataca (seta 6) e J1/J2 precisam defender e contra-atacar para derrubar o Rei. Fila F1/F2 aguarda no fundo esquerdo.","codigo":"JOG-INT-208"},{"numero":209,"secao":13,"nome":"Jogo situado: rali iniciado a partir de 'Recep\u00e7\u00e3o Quebrada' (Sufoco Inicial)","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Dupla J1 + J2 contra Dupla A1 + A2 + lan\u00e7ador/treinador)","tempo":"11 minutos","material":"6 bolas e 3 cones marcando os pontos de sufoco JOGO SITUADO: Rali come\u00e7a no 2\u00ba toque em um dos 3 Cones de Passe Quebrado (Fundo, Fora ou Antena) CONE A (6,5m) CONE B (FORA) CONE C RESGATE 2m J1","objetivo":"Treinar a resili\u00eancia t\u00e1tica da dupla para vencer pontos que come\u00e7am em desvantagem extrema (passe colado na antena, passe aos 6,5m no fundo ou fora da quadra).","comoMontar":"Na meia-quadra esquerda (J1 + J2), coloque 3 cones de 'Recep\u00e7\u00e3o Quebrada': Cone A (aos 6,5m no fundo), Cone B (a 1,5m fora da linha lateral) e Cone C (colado na fita perto da antena). Dupla A1 + A2 na direita pronta para bloquear e defender.","passoAPasso":["Em vez de come\u00e7ar o ponto com saque normal, J1 e J2 come\u00e7am na base de recep\u00e7\u00e3o aos 5,5m e o treinador (ou A2) lan\u00e7a a 1\u00aa bola diretamente em um dos 3 Cones de Sufoco (simulando que o 1\u00ba toque j\u00e1 aconteceu e espirrou para l\u00e1!).","Portanto, a bola que est\u00e1 caindo no Cone A, B ou C j\u00e1 \u00e9 o 2\u00ba TOQUE (Levantamento de Emerg\u00eancia) da dupla J1 + J2!","J2 corre em velocidade m\u00e1xima at\u00e9 o cone onde a bola foi lan\u00e7ada, resgata de manchete alta trazendo para uma zona segura a 2m da rede, e J1 precisa atacar esse levantamento de sufoco contra o bloqueio e defesa montados de A1 + A2!","A partir da\u00ed o rali corre livre at\u00e9 a bola cair na areia!","Se J1 e J2 vencerem o ponto mesmo saindo do sufoco = 2 pontos; se A1 e A2 aproveitarem a vantagem e contra- atacarem = 1 ponto. Trocam a cada 6 bolas."],"pontosAtencao":["Para a dupla no sufoco (J1 + J2): voc\u00ea N\u00c3O precisa cravar a bola de 3 metros quando est\u00e1 saindo do sufoco!","Se o levantamento veio l\u00e1 de fora da quadra, coloque uma bola alta e funda no canto de 8m de A1/A2, organize o seu bloqueio/defesa e ven\u00e7a o ponto na transi\u00e7\u00e3o!","Para a dupla na defesa (A1 + A2): quando o advers\u00e1rio est\u00e1 levantando l\u00e1 do Cone A (6,5m no fundo) ou fora da quadra, o bloqueador A1 faz o 'pulling' (retira da rede) e os dois fecham os espa\u00e7os esperando a bola colocada!","Nunca entregue erro na rede numa bola de sufoco."],"erroComum":"O atacante J1 tentar dar uma pancada para baixo numa bola que veio levantada l\u00e1 de fora da quadra e carimbar a fita da rede; corrija premiando o uso de lob/cut shot na primeira bola para continuar vivo no rali. Varia\u00e7\u00f5es","variacaoFacil":"A bola lan\u00e7ada no cone conta como o 1\u00ba toque (a dupla ainda tem direito ao 2\u00ba toque de levantamento e ao 3\u00ba de ataque).","variacaoDificil":"O treinador lan\u00e7a a bola baixa e r\u00e1pida nos cones de sufoco, exigindo peixinho do levantador para salvar o 2\u00ba toque!","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a rod\u00edzio de 3 bolas de sufoco por dupla (1 bola no Cone A, 1 no Cone B e 1 no Cone C). A dupla que somar mais vit\u00f3rias saindo do buraco vence a rodada.","meta":"Manter 9 de 10 bolas de sufoco vivas em jogo (zero erros diretos na rede) e vencer pelo menos 5 dos 10 ralis completos.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda h\u00e1 3 Cones de Sufoco (Cone A no fundo a 6,5m, Cone B fora da lateral e Cone C na antena). O ponto inicia com bola enviada direto a um dos cones (setas 1a, 1b); J2 corre para resgatar no 2\u00ba toque trazendo para dentro aos 2m (seta 2) e J1 ataca estrategicamente no 3\u00ba toque (seta 3) contra A1 e A2. Regra: 'In\u00edcio em Passe Quebrado (2\u00ba toque)'.","codigo":"JOG-AVA-209"},{"numero":210,"secao":13,"nome":"Jogo iniciado em 'Defesa de Guerra': s\u00f3 entra no rali quem salvar a 1\u00aa pancada","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Dupla J1 + J2 contra Dupla A1 + A2 + Treinador atacando)","tempo":"11 minutos","material":"8 bolas e caixote para o treinador na lateral da rede DEFESA DE GUERRA: Treinador (T) inicia batendo forte na defesa | S\u00f3 joga o rali quem salvar a 1\u00aa! T ZONA 2m J1 J2 A1 A2","objetivo":"Condicionar a transi\u00e7\u00e3o imediata da defesa dif\u00edcil na areia para o contra-ataque sob press\u00e3o competitiva real.","comoMontar":"Dupla J1 (bloqueio) e J2 (defesa) na meia-quadra esquerda; Dupla A1 (bloqueio) e A2 (defesa) na meia- quadra direita. O Treinador (T) fica junto ao poste da rede com um cesto de bolas.","passoAPasso":["Nenhum ponto come\u00e7a com saque: todo ponto come\u00e7a com o Treinador (T) batendo uma bola dif\u00edcil (cortada forte, cut shot ou lob) contra a defesa da Dupla J1 + J2!","J1 e J2 precisam defender essa 1\u00aa bola de guerra (1\u00ba toque), fazer o levantamento de transi\u00e7\u00e3o (2\u00ba toque) e atacar (3\u00ba toque) contra A1 e A2!","A partir do ataque de J1/J2, o rali segue valendo ponto normal entre as duas duplas!","Regra do Gatilho de Ouro: se J1 e J2 deixarem a 1\u00aa bola batida pelo treinador cair no ch\u00e3o sem conseguir passar os 3 toques para o outro lado, o treinador bate IMEDIATAMENTE a bola para o lado de A1 e A2 (que ganham a chance de contra-atacar e pontuar)!","A cada 5 bolas iniciadas na esquerda, o treinador passa a iniciar 5 bolas batendo na direita."],"pontosAtencao":["Esse jogo elimina a pregui\u00e7a defensiva: se voc\u00ea n\u00e3o defender a primeira pancada do treinador e n\u00e3o passar a bola para o outro lado, voc\u00ea nem participa do ponto!","Para o bloqueador (J1): assim que o treinador bater a bola no seu defensor (J2), saia da rede como um raio para levantar na medida!","A dupla que est\u00e1 do outro lado esperando o contra-ataque (A1 + A2) j\u00e1 fica com o bloqueio armado na rede e a defesa pronta no fundo."],"erroComum":"Defender a pancada do treinador e comemorar que a bola subiu, esquecendo de abrir r\u00e1pido para atacar contra o bloqueio de A1; corrija mantendo o ritmo acelerado at\u00e9 o ponto terminar. Varia\u00e7\u00f5es","variacaoFacil":"O treinador envia a primeira bola com 70% de for\u00e7a avisando antes se vai bater em J1 ou em J2.","variacaoDificil":"Se a dupla que recebeu a pancada inicial do treinador defender, levantar e matar o ponto de primeira contra A1/A2, vale 2 pontos !","paraTurma":"Em turmas de 4 a 12 alunos, coloque uma fila de duplas desafiantes no fundo esquerdo: o treinador bate a bola de guerra na dupla que entrou; se ela defender e vencer o rali contra o Rei (direita), ela sobe para o Trono!","meta":"Defender e construir o contra-ataque em pelo menos 7 de 10 bolas de guerra enviadas pelo treinador, vencendo 50% dos ralis.","descricaoDiagrama":"Quadra 16x8m com o Treinador (T) junto ao poste central. T inicia o rali batendo uma bola dif\u00edcil de ataque (seta 1) contra J2 no fundo esquerdo; J2 defende para o centro (seta 2), J1 sai da rede para levantar (seta 3) e J2 avan\u00e7a (seta tracejada) contra-atacando (seta 4) contra o bloqueio de A1 e a defesa de A2, abrindo o rali valendo ponto. Regra: 'In\u00edcio em Defesa Dif\u00edcil batida por T'.","codigo":"JOG-AVA-210"},{"numero":211,"secao":13,"nome":"Jogo de pontua\u00e7\u00e3o agressiva: 'Ace, Bloqueio e Bola de 2\u00aa valem 3 Pontos!'","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Partida 2x2 oficial com placar bonificado)","tempo":"12 minutos","material":"5 bolas e placar PONTUA\u00c7\u00c3O ESPECIAL: Ace, Bloqueio Direto ou Bola de 2\u00aa = 3 PONTOS! | Erro de Saque = -2 pts BLOQUEIO = 3 PTS ACE COSTURA = 3 PTS BOLA DE 2\u00aa = 3 PTS J1 J1","objetivo":"Estimular a agressividade consciente no saque t\u00e1tico, na invas\u00e3o de bloqueio na rede e na leitura de ataque de segunda bola.","comoMontar":"Quadra oficial 16x8m com Dupla J1 + J2 na esquerda e Dupla A1 + A2 na direita.","passoAPasso":["Partida de 1 set at\u00e9 21 pontos onde os pontos normais de ataque de 3\u00aa bola ou erro advers\u00e1rio valem 1 ponto, mas existem 3 jogadas especiais que valem 3 PONTOS IMEDIATOS:","B\u00f4nus 1 (Saque Ace = 3 pts): se o saque cair na areia advers\u00e1ria sem toque ou ap\u00f3s tocar apenas em 1 receptor sem que o parceiro consiga dar o 2\u00ba toque.","B\u00f4nus 2 (Ponto Direto de Bloqueio = 3 pts): quando o bloqueador abafa o ataque advers\u00e1rio fazendo a bola cair na quadra oponente.","B\u00f4nus 3 (Ponto em Ataque de Segunda Bola = 3 pts): quando a recep\u00e7\u00e3o ou a defesa sobe boa e o levantador ataca (ou passa de toque limpo perpendicular/poke) matando o ponto no 2\u00ba contato da dupla!","Equil\u00edbrio de Risco (A Trava T\u00e1tica): para evitar que os jogadores saquem tudo na rede tentando ganhar 3 pontos, cada erro de saque direto d\u00e1 +2 pontos para o advers\u00e1rio!"],"pontosAtencao":["Como a Bola de Segunda vale 3 pontos neste jogo, o recebedor/defensor se esfor\u00e7a ao m\u00e1ximo para colocar o 1\u00ba toque alto e a 1,5m da rede na m\u00e3o do parceiro!","Da mesma forma, o bloqueador advers\u00e1rio fica muito mais atento no meio da rede respeitando a amea\u00e7a da segunda bola antes de abrir para a ponta.","No saque: como o erro custa 2 pontos e o ace vale 3, o segredo n\u00e3o \u00e9 sacar de olhos fechados, mas sacar t\u00e1tico na costura e nas linhas curtas!"],"erroComum":"Tentar atacar de segunda bola at\u00e9 passes que ficaram l\u00e1 nos 4 metros da rede, entregando bolas f\u00e1ceis na m\u00e3o da defesa advers\u00e1ria; corrija acionando a segunda bola apenas quando o passe subir dentro da zona de 1,5m da fita. Varia\u00e7\u00f5es","variacaoFacil":"Retirar a penalidade de -2 pontos no erro de saque nos primeiros 4 minutos para soltar o bra\u00e7o dos alunos.","variacaoDificil":"Incluir um 4\u00ba b\u00f4nus: 'Cut Shot que cai na areia sem ningu\u00e9m tocar tamb\u00e9m vale 3 pontos!'.","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a sets rel\u00e2mpago at\u00e9 12 pontos: como um \u00fanico bloqueio ou bola de segunda vale 3 pontos, um set pode virar em duas bolas, mantendo todas as duplas da fila super ligadas!","meta":"Conquistar pelo menos 3 jogadas bonificadas de 3 pontos (Ace, Bloqueio ou Bola de 2\u00aa) ao longo do set.","descricaoDiagrama":"Quadra 16x8m vista de cima destacando as 3 zonas de Super B\u00f4nus (3 PTS): '1. ACE NA COSTURA/CURTA = 3 PTS', '2. BOLA DE 2\u00aa DO LEVANTADOR J2 = 3 PTS' e '3. MONSTER BLOCK DE J1 NA REDE = 3 PTS'. Setas numeradas ilustram o passe de J1 (1) para o ataque surpresa de 2\u00aa bola de J2 (2), al\u00e9m do bloqueio de J1 (3). Regra: 'Ace, Bloqueio ou 2\u00aa Bola = 3 pts | Erro de Saque = -2 pts'.","codigo":"JOG-AVA-211"},{"numero":212,"secao":13,"nome":"Duelo 1x1 em quadra inteira (8x8m) com 'Levantador Fixo Neutro' na rede","nivel":"Avan\u00e7ado","jogadores":"4 jogadores em quadra (J1 duelando 1x1 contra A1, com L1 e L2 como levantadores fixos)","tempo":"10 minutos","material":"5 bolas 1x1 EM QUADRA INTEIRA (8x8m): L1 e L2 s\u00e3o Levantadores Fixos na rede (n\u00e3o defendem nem atacam) 4a: CURTA 4b: LINHA 8m 4c: DIAG 8m J1 L1 L2 A1 1 2","objetivo":"Exigir leitura m\u00e1xima de espa\u00e7os vazios, cobertura de 64m\u00b2 na areia e condicionamento espec\u00edfico de transi\u00e7\u00e3o em quadra oficial completa.","comoMontar":"Quadra oficial 16x8m inteira (8x8m de cada lado). Na esquerda: J1 \u00e9 o \u00fanico jogador de linha e L1 fica fixo junto ao centro da rede apenas para levantar. Na direita: A1 \u00e9 o \u00fanico jogador de linha e L2 fica fixo junto ao centro da rede apenas para levantar.","passoAPasso":["Este \u00e9 o cl\u00e1ssico treino dos atletas profissionais de v\u00f4lei de praia para leitura de quadra: J1 enfrenta A1 no 1 contra 1 valendo toda a quadra de 8x8 metros!","Qual \u00e9 a fun\u00e7\u00e3o de L1 e L2 na rede? Eles s\u00e3o 'Levantadores Fixos': eles N\u00c3O podem bloquear, N\u00c3O podem defender o 1\u00ba toque e N\u00c3O podem atacar! Eles s\u00f3 podem sair do centro da rede para dar o 2\u00ba toque (levantamento) ap\u00f3s J1 ou A1 recepcionar/defender!","Portanto, J1 precisa sozinho: 1) Recepcionar o saque na quadra 8x8m; 2) Correr para atacar o levantamento de L1; 3) Voltar imediatamente para o centro da quadra para defender o ataque de A1 nos 64m\u00b2!","Como s\u00f3 h\u00e1 1 defensor do outro lado cobrindo 8x8 metros, se o atacante apenas olhar para onde o advers\u00e1rio est\u00e1 correndo e colocar a bola no canto oposto, \u00e9 ponto certo!","Jogam mini-sets intensos de 5 pontos (para n\u00e3o exaurir) e trocam os pap\u00e9is: L1 vira o jogador de 1x1 e J1 passa a ser o levantador fixo!"],"pontosAtencao":["Neste jogo, quem bate forte em cima do advers\u00e1rio perde o f\u00f4lego e perde o jogo: o objetivo \u00e9 levantar a cabe\u00e7a antes de bater e jogar a bola onde o advers\u00e1rio N\u00c3O est\u00e1!","Para o defensor sozinho nos 8x8m: posicione-se no centro exato da quadra (a 4,5m da rede e 4m das laterais) e use a leitura de ombro/cotovelo (Se\u00e7\u00e3o 9) para antecipar o canto.","Sempre mande a sua recep\u00e7\u00e3o e a sua defesa bem altas para o centro da rede onde o seu levantador fixo aguarda."],"erroComum":"Atacar uma bola curta na frente, admirar o pr\u00f3prio golpe e ficar colado na rede levando um lob nas costas l\u00e1 nos 8 metros; corrija recuando ao centro da quadra (4,5m) assim que os p\u00e9s tocarem a areia ap\u00f3s o ataque. Varia\u00e7\u00f5es","variacaoFacil":"Reduzir a largura da quadra para 6 metros (6x8m) mantendo o levantador fixo na rede.","variacaoDificil":"O levantador fixo (L1/L2) s\u00f3 pode levantar do lugar onde estiver parado (proibido correr mais de 1 passo), obrigando J1 e A1 a colocarem a defesa cravada na m\u00e3o dele!","paraTurma":"Em turmas de 4 a 12 alunos, mantenha 2 levantadores fixos na rede (que descansam levantando) enquanto um
