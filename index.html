as alvo ZONA 1 (PARAL) ZONA 2 (DIAG) A1 L1 B1 1","objetivo":"Olhar de relance para o bloqueador durante os dois \u00faltimos passos na areia e atacar exatamente no corredor que o bloqueio deixou aberto.","comoMontar":"Na meia-quadra esquerda: A1 na entrada (5m) e L1 no centro (1,5m). Na meia-quadra direita: B1 junto \u00e0 rede (em frente a A1) e duas Zonas Alvo demarcadas \u2014 Zona 1 na Paralela e Zona 2 na Diagonal.","passoAPasso":["A1 passa a bola para L1; L1 levanta alto e a 1,5m\u20132m da rede.","Quando a bola sai da m\u00e3o de L1 (enquanto A1 est\u00e1 fazendo a chamada de p\u00e9s na areia), B1 d\u00e1 um passo claro na rede:","Op\u00e7\u00e3o A: B1 d\u00e1 um passo para a linha lateral fechando a PARALELA -> A1 enxerga o movimento de B1 com a vis\u00e3o perif\u00e9rica e ataca (cortada ou cut shot) na Zona 2 (DIAGONAL).","Op\u00e7\u00e3o B: B1 d\u00e1 um passo para o meio da rede fechando a DIAGONAL -> A1 l\u00ea o corredor livre na linha e ataca (cortada ou lob na linha) na Zona 1 (PARALELA).","Se A1 bater em cima das m\u00e3os de B1, o ponto \u00e9 do bloqueador; se atacar no corredor aberto e cair na Zona Alvo, ponto de A1. Rodam a cada 8 bolas."],"pontosAtencao":["Como enxergar a bola e o bloqueador ao mesmo tempo na praia?","Voc\u00ea olha para a bola at\u00e9 ela atingir o ponto mais alto do levantamento, baixa o olhar por 0,2 segundo para o peito de B1 enquanto salta e volta o olho para a bola na batida!","Por isso o levantamento a 1,5m\u20132m da rede \u00e9 t\u00e3o importante: ele coloca a bola e o bloqueador na mesma linha de vis\u00e3o do atacante.","Mantenha o corpo apontado em diagonal para poder bater nos dois lados sem denunciar."],"erroComum":"Decidir onde vai bater antes de sair do ch\u00e3o (olhando s\u00f3 para a bola no c\u00e9u) e carimbar o peito do bloqueador; corrija fazendo B1 levantar um cart\u00e3o colorido ou mostrar 1/2 dedos no salto para provar que A1 olhou para ele. Varia\u00e7\u00f5es","variacaoFacil":"B1 escolhe a posi\u00e7\u00e3o (Paralela ou Diagonal) um pouco mais cedo, assim que A1 faz a recep\u00e7\u00e3o.","variacaoDificil":"B1 finge que vai fechar a paralela e d\u00e1 um passo r\u00e1pido para a diagonal no \u00faltimo segundo ('finta de bloqueio').","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 bloqueadores na rede direita (um para a entrada e outro para a sa\u00edda) e duas filas de atacantes na esquerda. A cada 6 bolas, os atacantes passam a ser bloqueadores.","meta":"Ler corretamente a posi\u00e7\u00e3o de B1 e acertar o corredor livre em pelo menos 7 de 10 ataques.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta (seta 1) para A1 que avan\u00e7a na esquerda (seta tracejada 1). Na rede direita, B1 desloca-se para fechar a paralela ou a diagonal (setas tracejadas curtas). A1 l\u00ea o posicionamento de B1 no salto e ataca no corredor oposto livre: Zona 1 Paralela (seta 2a) ou Zona 2 Diagonal (seta 2b).","codigo":"ATQ-INT-118"},{"numero":119,"secao":7,"nome":"Ataque guiado pelo chamado verbal do parceiro ('Linha!' ou 'Cruzado!')","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (A1 atacante, L1 levantador/chamador e B1 bloqueador)","tempo":"10 minutos","material":"5 bolas, 2 cones e 2 zonas alvo CRUZADO! A1 L1 B1 1","objetivo":"Obedecer em pleno ar ao grito t\u00e1tico do levantador (que est\u00e1 olhando de frente para o bloqueio e defesa advers\u00e1ria) e mudar a dire\u00e7\u00e3o do golpe.","comoMontar":"Mesma estrutura na rede: A1 e L1 na meia-quadra esquerda; B1 (bloqueador/defensor) na meia-quadra direita com a Zona Alvo 'Linha' (paralela) e a Zona Alvo 'Cruzado' (diagonal).","passoAPasso":["No v\u00f4lei de praia, enquanto o atacante est\u00e1 olhando para a bola l\u00e1 no c\u00e9u (muitas vezes contra o sol), quem tem a vis\u00e3o limpa da movimenta\u00e7\u00e3o advers\u00e1ria \u00e9 o LEVANTADOR (L1)!","A1 passa a bola para L1; L1 levanta alto para a entrada.","Assim que a bola sai de suas m\u00e3os, L1 olha imediatamente para B1 do outro lado da rede.","Quando B1 se move para fechar um dos lados, L1 grita alto e claro para A1 antes da batida: 'LINHA!' (se a paralela estiver livre) ou 'CRUZADO!' (se a diagonal estiver livre).","A1 confia 100% na voz do parceiro, ajusta o punho/ombro no ar e coloca a bola na zona chamada por L1."],"pontosAtencao":["A chamada do levantador precisa ser curta, \u00fanica e acontecer enquanto o atacante est\u00e1 subindo no salto (se gritar quando o atacante j\u00e1 est\u00e1 batendo na bola, \u00e9 tarde demais).","Padronize o c\u00f3digo da dupla: use sempre as mesmas palavras curtas ('Linha!', 'Diago!', 'Chuta no fundo!').","Para o atacante: suba com o cotovelo alto e pronto para girar o punho para qualquer um dos dois lados no \u00faltimo instante."],"erroComum":"O levantador levantar a bola e ficar admirando o pr\u00f3prio levantamento em vez de olhar para o bloqueador advers\u00e1rio para cantar a jogada; corrija tirando 1 ponto da dupla se L1 n\u00e3o gritar antes de A1 atingir o topo do salto. Varia\u00e7\u00f5es","variacaoFacil":"B1 se move cedo logo ap\u00f3s o levantamento de L1, dando tempo tranquilo para L1 ler e gritar.","variacaoDificil":"Incluir uma 3\u00aa chamada de L1: 'POR CIMA!' (quando B1 fica parado e baixo, pedindo o lob no fundo).","paraTurma":"Em turmas de 4 a 12 alunos, trabalhe em duplas reais no lado esquerdo contra 2 bloqueadores no lado direito. Cada dupla faz 6 ataques guiados pela voz do levantador e depois troca.","meta":"Executar 8 de 10 ataques exatamente na dire\u00e7\u00e3o gritada pelo parceiro acertando as Zonas Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta para A1 (seta 1), olha para o movimento de B1 na rede direita e grita 'Linha!' ou 'Cruzado!'. A1 salta na esquerda (seta tracejada 1) e obedece ao comando verbal atacando na Zona Linha (seta 2a) ou na Zona Cruzado (seta 2b).","codigo":"ATQ-INT-119"},{"numero":120,"secao":7,"nome":"Leitura perif\u00e9rica do defensor no fundo (cortada forte vs. bola curta)","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (A1 atacante, L1 levantador e D1 defensor m\u00f3vel)","tempo":"10 minutos","material":"5 bolas, 3 cones e 3 zonas alvo CURTA 2m LATERAL A1 L1 D1 1","objetivo":"Enxergar a profundidade do defensor advers\u00e1rio (sem bloqueio ou no corredor livre) para escolher entre soltar o bra\u00e7o, largar curto ou encobrir.","comoMontar":"Na meia-quadra esquerda: A1 e L1. Na meia-quadra direita: D1 come\u00e7a no cone central a 5 metros da rede. Demarque 3 Zonas Alvo na direita: Zona Curta (aos 2m da rede), Zona Fundo (aos 7,5m) e Zona Lateral Oposta.","passoAPasso":["A1 passa para L1 e faz a aproxima\u00e7\u00e3o de ataque olhando pelo canto do olho para D1 no outro lado da quadra.","Quando A1 inicia a chamada de salto, D1 faz uma das tr\u00eas movimenta\u00e7\u00f5es claras na areia:","Movimento 1: D1 recua para os 7 metros esperando pancada -> A1 freia o bra\u00e7o no ar e aplica um 'poke' ou 'cut shot' na Zona Curta (aos 2m).","Movimento 2: D1 corre para a frente (aos 3m) tentando adivinhar a largada -> A1 aplica um 'lob/cobra' alto ou cortada longa na Zona Fundo (aos 7,5m, nas costas de D1).","Movimento 3: D1 fica plantado no meio -> A1 solta a cortada potente na Zona Lateral longe do alcance dele."],"pontosAtencao":["Quando o advers\u00e1rio retira da rede e joga com 2 defensores l\u00e1 atr\u00e1s (sem bloqueio), voc\u00ea tem todo o tempo do mundo para olhar para onde eles est\u00e3o correndo antes de bater na bola!","Nunca bata a 100% de for\u00e7a no peito de um defensor que j\u00e1 est\u00e1 plantado esperando sua bola: na praia, 'bola onde n\u00e3o tem ningu\u00e9m' sempre vence 'bola forte em cima do defensor'.","Arme o bra\u00e7o sempre igual para D1 n\u00e3o ler a sua inten\u00e7\u00e3o."],"erroComum":"Bater forte de olhos fechados exatamente para onde D1 acabou de correr; corrija dando 2 pontos para D1 toda vez que o ataque de A1 for na dire\u00e7\u00e3o dele. Varia\u00e7\u00f5es","variacaoFacil":"Usar apenas 2 op\u00e7\u00f5es para D1 (ou recua tudo para os 7m, ou avan\u00e7a tudo para os 2,5m).","variacaoDificil":"Colocar 2 defensores reais no fundo (D1 na paralela e D2 na diagonal): um deles avan\u00e7a na curta e o outro fica no fundo, exigindo que A1 ache o buraco vazio.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 defensores revezando no lado direito e duplas atacando no lado esquerdo. Se o defensor tocar na bola com os p\u00e9s parados (porque o atacante bateu em cima dele), o atacante sai da fila.","meta":"Colocar 7 de 10 bolas na zona vazia oposta ao movimento do defensor D1.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta (seta 1) para A1 na esquerda. Na meia- quadra direita, D1 parte do cone central (5m) avan\u00e7ando para a curta ou recuando para o fundo (setas tracejadas). A1 l\u00ea D1 e ataca no espa\u00e7o oposto: Zona Curta 2m (seta 2a), Zona Fundo 7,5m (seta 2b) ou Lateral (seta 2c).","codigo":"ATQ-INT-120"},{"numero":121,"secao":7,"nome":"Ataque com vento contra (cortada chapada para baixo e bola curta de poke ou cut)","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (A1, L1 e D1 defensor)","tempo":"10 minutos","material":"5 bolas, 2 cones e 2 zonas alvo ZONA 1 (FOR\u00c7A) ZONA 2 (CURTA) A1 L1 D11 2a 2b","objetivo":"Aproveitar o vento que sopra de frente para o atacante para bater a cortada com for\u00e7a m\u00e1xima (que o vento segura na quadra) ou matar o ponto na bola curta que cai como pedra.","comoMontar":"Posicione A1 e L1 no lado da quadra que ataca CONTRA o vento (o vento bate no rosto do atacante). Na quadra oposta, D1 defende e h\u00e1 duas Zonas Alvo: Zona 1 (Fundo com for\u00e7a total) e Zona 2 (Curta a 2m da rede).","passoAPasso":["Quando voc\u00ea ataca CONTRA o vento na praia, o vento \u00e9 o maior aliado do seu ataque por dois motivos:","Vantagem 1 (Soltar o bra\u00e7o sem medo): como o vento freia a bola e a empurra para baixo, uma cortada que iria 1 metro fora em dia sem vento vai cair dentro da linha de fundo! Nos primeiros 5 ataques, A1 bate a cortada a 100% de pot\u00eancia com trajet\u00f3ria tensa mirando na Zona 1.","Vantagem 2 (A bola curta mortal): quando voc\u00ea d\u00e1 um 'poke' ou 'cut shot' contra o vento, assim que a bola perde velocidade sobre a rede, o vento a derruba verticalmente na areia aos 2 metros! Nos 5 ataques seguintes, A1 usa a bola curta (poke ou cut) na Zona 2.","Observa\u00e7\u00e3o importante na subida: como o vento est\u00e1 soprando a bola do levantamento para tr\u00e1s (para longe da rede), A1 n\u00e3o pode invadir demais a rede; ele espera meio passo atr\u00e1s para a bola n\u00e3o passar da sua cabe\u00e7a.","Trocam ap\u00f3s 10 ataques."],"pontosAtencao":["Contra o vento, NUNCA d\u00ea um 'lob' alto e mole para o fundo da quadra: o vento vai segurar a bola no meio do ar e o defensor advers\u00e1rio vai chegar caminhando para pegar!","Se quiser atacar no fundo contra o vento, tem que ser batida forte e tensa; se quiser usar jeito, use a bola curta na frente.","Ajuste a passada porque o vento empurra o levantamento na dire\u00e7\u00e3o do seu peito."],"erroComum":"Tentar dar um lob alto e lento no fundo contra o vento forte, entregando uma bola parada no meio da quadra para D1; corrija proibindo bolas altas lentas no lado contra o vento. Varia\u00e7\u00f5es","variacaoFacil":"Treinar separadamente 5 cortadas fortes contra o vento e 5 pokes curtos contra o vento.","variacaoDificil":"D1 defende pra valer no outro lado tentando ler se A1 vai soltar a bomba presa pelo vento ou o pingo curto.","paraTurma":"Em turmas de 4 a 12 alunos, todos os atacantes passam pelo lado que ataca contra o vento em s\u00e9ries de 4 bolas (2 bombas de bra\u00e7o solto e 2 bolas curtas de poke ou cut).","meta":"Converter 7 de 10 ataques contra o vento (combinando cortadas potentes que caem dentro e bolas curtas a 2m).","descricaoDiagrama":"Quadra 16x8m vista de cima com setas de Vento Forte soprando da direita para a esquerda (contra o ataque). Na esquerda, L1 levanta (seta 1) e A1 ataca contra o vento: ou cortada a 100% de pot\u00eancia que o vento segura na Zona 1 de fundo (seta 2a), ou poke curto que o vento derruba na Zona 2 a 2m (seta 2b).","codigo":"ATQ-AVA-121"},{"numero":122,"secao":7,"nome":"Ataque com vento a favor e lateral (topspin m\u00e1ximo e margem de seguran\u00e7a)","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (A1, L1 e D1)","tempo":"10 minutos","material":"5 bolas, 4 cones e 2 zonas alvo recuadas das linhas ZONA SEGURA INTERNA A1 L1 D1 1 2a","objetivo":"Controlar o ataque quando o vento sopra pelas costas (empurrando a bola para fora), exagerando na quebrada de punho topspin e mirando 1 metro antes das linhas.","comoMontar":"Agora posicione A1 e L1 no lado da quadra que ataca A FAVOR do vento (o vento sopra nas costas do atacante em dire\u00e7\u00e3o \u00e0 quadra advers\u00e1ria). Na quadra advers\u00e1ria, coloque cones a 1,5 metro de dist\u00e2ncia das linhas de fundo e lateral, demarcando uma 'Zona Segura Interna'.","passoAPasso":["Atacar A FAVOR do vento \u00e9 o momento em que mais se comete erros de ataque para fora no v\u00f4lei de praia, porque a brisa nas costas faz a bola 'planar' e passar das linhas.","Ajuste 1 (Na corrida): como o vento empurra o levantamento para cima da rede, A1 acelera a entrada para pegar a bola antes que ela passe para o outro lado.","Ajuste 2 (Na batida): \u00e9 proibido bater chapado no meio da bola; A1 precisa entrar com a m\u00e3o por CIMA da bola e exagerar no chicote de punho (topspin m\u00e1ximo) para for\u00e7ar a bola a mergulhar na areia.","Ajuste 3 (Nos golpes colocados): se usar o lob ou cobra a favor do vento, A1 mira no MEIO da quadra advers\u00e1ria (aos 4,5 metros), pois o vento vai carregar a bola at\u00e9 os 7,5 metros na linha de fundo!","Qualquer bola que passar para fora das linhas desconta 2 pontos; acertar a Zona Segura vale 1 ponto."],"pontosAtencao":["Regra mental com vento nas costas: 'Tire 20% da for\u00e7a bruta e coloque 100% de giro de munheca (topspin) para baixo!'.","Se houver vento lateral soprando para fora de uma das linhas laterais, nunca mire colado naquela linha: mire a 1,5 metro para dentro.","Com vento a favor, o lob curto que voc\u00ea toca no meio da quadra viaja r\u00e1pido pelo alto e encobre o defensor no fundo."],"erroComum":"Bater reto e forte com o bra\u00e7o duro a favor do vento, mandando 3 bolas seguidas no alambrado de fundo; corrija obrigando o atacante a mirar na linha de 5 metros da quadra advers\u00e1ria. Varia\u00e7\u00f5es","variacaoFacil":"Atacar apenas de levantamentos mais altos a 1,5m da rede focando na quebrada de punho para baixo.","variacaoDificil":"A dupla faz 2 ataques no lado contra o vento (exerc\u00edcio 121) e imediatamente corre para o outro lado da rede para fazer 2 ataques a favor do vento (exerc\u00edcio 122).","paraTurma":"Em turmas de 4 a 12 alunos, coloque uma dupla atacando no lado esquerdo e outra no lado direito: ao apito do professor a cada 3 minutos, as duas turmas trocam de lado da rede para adaptar o bra\u00e7o ao vento oposto.","meta":"Manter 8 de 10 ataques a favor do vento dentro da quadra (Zona Segura) sem cometer erros de bola fora no fundo.","descricaoDiagrama":"Quadra 16x8m vista de cima com setas de Vento Forte soprando da esquerda para a direita (pelas costas de A1). L1 levanta (seta 1) e A1 acelera (seta tracejada 1) batendo com topspin acentuado para baixo ou mirando antes na Zona Segura Interna (setas 2a e 2b, com margem de 1,5m das linhas finais).","codigo":"ATQ-AVA-122"},{"numero":123,"secao":7,"nome":"Explorando as m\u00e3os altas e laterais do bloqueio ('block-out' t\u00e9cnico)","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (A1 atacante, L1 levantador e B1 bloqueador ativo)","tempo":"10 minutos","material":"5 bolas e 2 cones A1 L1 B1 1 1 2a","objetivo":"Usar o bloqueio advers\u00e1rio como alvo quando a bola est\u00e1 colada na rede ou o bloqueador salta muito perto, tirando da m\u00e3o dele para fora da quadra.","comoMontar":"Na meia-quadra esquerda, A1 na entrada e L1 no centro. Na meia-quadra direita, B1 posicionado na rede para bloquear agressivamente.","passoAPasso":["Quando o levantamento vem mais perto da rede (a 80 cm\u2013 1m) e o bloqueador B1 chega inteiro fechando os espa\u00e7os, tentar passar a bola por baixo dele d\u00e1 ponto de bloqueio.","A1 sobe equilibrado, mant\u00e9m o olhar nas m\u00e3os de B1 e aplica uma das duas t\u00e9cnicas de 'Explorar o Bloqueio':","T\u00e9cnica 1 (Pontas dos dedos altas): A1 mira nos \u00faltimos 5 cent\u00edmetros da ponta dos dedos de B1 com uma batida firme e alta para o fundo, fazendo a bola raspar na m\u00e3o de B1 e viajar para fora da linha de fundo.","T\u00e9cnica 2 (M\u00e3o externa para a antena): A1 gira o punho para fora batendo contra a borda externa da m\u00e3o esquerda de B1, fazendo a bola ricochetear para fora da linha lateral.","S\u00f3 vale ponto se a bola tocar em B1 e cair fora da quadra (ou se B1 encolher a m\u00e3o e a bola cair na linha)."],"pontosAtencao":["Para explorar o bloqueio na praia, voc\u00ea precisa estar com os olhos ABERTOS olhando exatamente para a m\u00e3o do bloqueador no momento do impacto!","Nunca bata no meio da palma da m\u00e3o do bloqueador (sen\u00e3o a bola volta na sua cabe\u00e7a): mire nas BORDAS (ponta superior dos dedos ou lateral do dedo m\u00ednimo externo).","Esse recurso salva o atacante quando o levantamento veio colado demais na fita."],"erroComum":"Tentar tirar do bloqueio dando um toquinho fraco na m\u00e3o de B1, fazendo a bola subir amortecida e f\u00e1cil para o defensor advers\u00e1rio pegar; corrija exigindo batida firme e r\u00e1pida nas bordas da m\u00e3o. Varia\u00e7\u00f5es","variacaoFacil":"L1 levanta a bola controlada a 1m da rede e B1 salta sem mexer as m\u00e3os lateralmente no ar.","variacaoDificil":"B1 pode tentar 'puxar as m\u00e3os' no \u00faltimo segundo quando percebe que A1 vai explorar o bloqueio, exigindo que A1 mire na borda da m\u00e3o mas dentro da dire\u00e7\u00e3o da linha de fundo.","paraTurma":"Em turmas de 4 a 12 alunos, duelo direto na rede entre fila de atacantes e fila de bloqueadores: +2 pontos para o atacante que conseguir o block-out; +2 pontos para o bloqueador que bloquear para o ch\u00e3o.","meta":"Conseguir 6 de 10 pontos explorando as extremidades do bloqueio (ou for\u00e7ando o bloqueador a tirar a m\u00e3o na linha).","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta perto da rede (seta 1) para A1 que salta frente a frente com o bloqueador B1. A1 mira nas extremidades das m\u00e3os de B1: seta 2a toca na m\u00e3o externa de B1 saindo pela lateral, e seta 2b toca na ponta alta dos dedos de B1 saindo al\u00e9m da linha de fundo.","codigo":"ATQ-AVA-123"},{"numero":124,"secao":7,"nome":"Finta de cortada m\u00e1xima (bra\u00e7o r\u00e1pido) mudando para 'cut' ou 'poke' no ar","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (A1 + L1 contra Bloqueador B1 + Defensor D1)","tempo":"10 minutos","material":"5 bolas e 2 zonas alvo curtas POKE CURTO CUT SHOT A1 L1 B1 D1","objetivo":"Congelar o defensor advers\u00e1rio no fundo da quadra atrav\u00e9s de uma armada de bra\u00e7o agressiva e soltar uma bola curta mortal no \u00faltimo milissegundo.","comoMontar":"Dupla A1 + L1 na esquerda; Dupla B1 (bloqueio) + D1 (defesa no fundo aos 6m) na direita. Marque duas Zonas Alvo curtas (Zona de Cut Shot e Zona de Poke atr\u00e1s do bloqueio).","passoAPasso":["No alto n\u00edvel do v\u00f4lei de praia, o grande defensor l\u00ea a velocidade do seu cotovelo: se voc\u00ea subir com o bra\u00e7o mole, D1 j\u00e1 dispara para a frente antes de voc\u00ea tocar na bola.","A1 recebe o levantamento de L1, faz uma corrida explosiva na areia, salta alto e abre o peito ('arco e flecha') com express\u00e3o e velocidade de quem vai dar uma pancada de 100 km/h.","Vendo o bra\u00e7o armado para a porrada, D1 crava os calcanhares na areia l\u00e1 nos 6 metros para defender o tiro.","A apenas 20 cent\u00edmetros da bola, A1 freia o ombro e transforma a batida em um 'cut shot' curto na diagonal ou um 'poke' por cima de B1 na paralela curta.","Se D1 conseguir correr e alcan\u00e7ar a bola curta porque leu que A1 ia largar, o ponto \u00e9 da defesa!"],"pontosAtencao":["O disfarce perfeito est\u00e1 na corrida e na abertura do cotovelo: 90% do movimento \u00e9 id\u00eantico \u00e0 cortada forte; s\u00f3 os \u00faltimos 10% mudam na m\u00e3o.","Para enganar de verdade, a cada 3 ou 4 bolas voc\u00ea DEVE soltar o bra\u00e7o forte l\u00e1 no fundo onde D1 est\u00e1 para mant\u00ea-lo honesto e recuado.","Mantenha o olhar apontado para o fundo da quadra mesmo quando for cortar curto na frente."],"erroComum":"Desacelerar a corrida na areia e subir com o bra\u00e7o j\u00e1 dobrado na frente da testa, avisando o est\u00e1dio inteiro que vai largar; corrija invalidando o ponto se o cotovelo n\u00e3o passar para tr\u00e1s da linha da orelha na subida. Varia\u00e7\u00f5es","variacaoFacil":"Treinar sem o bloqueador B1 (apenas enganando o defensor D1 no fundo).","variacaoDificil":"D1 tem liberdade total para dar 'finta de defesa' (fingir que vai correr para a frente e voltar para tr\u00e1s).","paraTurma":"Em turmas de 4 a 12 alunos, jogue duplas no ataque contra duplas na defesa: cada golpe curto que cair na areia sem que o defensor D1 consiga sequer tocar na bola vale 2 pontos ('ponto de finta perfeita').","meta":"Conseguir 6 de 10 bolas curtas disfar\u00e7adas que caiam na areia deixando o defensor D1 preso no fundo.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta (seta 1) e A1 entra explosivo armando cortada forte (olhar/amea\u00e7a tracejada para o fundo onde D1 trava aos 6m). No \u00faltimo instante no ar, A1 muda o golpe para a Zona de Poke atr\u00e1s de B1 (seta 2a) ou Zona de Cut Shot curta (seta 2b).","codigo":"ATQ-AVA-124"},{"numero":125,"secao":7,"nome":"Ataque ap\u00f3s recep\u00e7\u00e3o na 'costura' com cruzamento ou abertura r\u00e1pida","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Dupla A1 + L1 contra S1 + B1)","tempo":"11 minutos","material":"5 bolas e 2 cones A1 L1 B1 S1 1 1 2","objetivo":"Reorganizar os p\u00e9s para o ataque quando o sacador advers\u00e1rio joga a bola no meio da dupla, escolhendo entre abrir de volta para a ponta ou atacar pelo meio/cruzando.","comoMontar":"S1 saca da direita mirando exclusivamente na costura central entre A1 (esquerda) e L1 (direita). B1 bloqueia na rede direita.","passoAPasso":["Quando S1 saca na costura central e A1 (jogador da esquerda) fecha para o meio da quadra para recepcionar, A1 termina o passe exatamente no centro da quadra (fora da sua posi\u00e7\u00e3o normal de ponta).","A partir da\u00ed, A1 e L1 treinam duas chamadas t\u00e1ticas de ataque para confundir o bloqueador B1:","Jogada 1 ('Abre!'): A1 passa no meio e d\u00e1 2 passos r\u00e1pidos em diagonal para tr\u00e1s/fora voltando para a antena esquerda, enquanto L1 levanta a bola de dentro para fora na ponta.","Jogada 2 ('Cruza!' ou 'Meio!'): A1 passa no meio e continua a corrida reto pelo centro (ou cruzando por tr\u00e1s de L1 para a direita), e L1 levanta uma bola curta no meio ou de costas, deixando o bloqueador B1 totalmente perdido na rede!","Executam 4 bolas abrindo para a ponta e 4 bolas atacando no meio/cruzando; depois trocam."],"pontosAtencao":["Por que os advers\u00e1rios sacam tanto no meio da quadra na praia?","Porque o atacante que recebe no meio perde a refer\u00eancia da linha lateral e costuma correr torto.","Se voc\u00ea escolheu 'Abrir' de volta para a sua ponta ap\u00f3s passar no meio, passe a bola um pouco mais ALTA para dar tempo de voc\u00ea voltar at\u00e9 a linha lateral e entrar de frente.","Se o passe ficou mais baixo no meio, n\u00e3o tente correr at\u00e9 a antena: grite 'MEIO!' e bata a bola pelo centro mesmo!"],"erroComum":"Receber no meio da quadra e correr de lado ('caranguejo') olhando para a bola at\u00e9 a antena, saltando desequilibrado; corrija dando 1 passo r\u00e1pido de abertura para fora antes de virar de frente para a rede. Varia\u00e7\u00f5es","variacaoFacil":"S1 envia um saque f\u00e1cil no centro e a dupla combina antes se vai 'Abrir' ou 'Cruzar'.","variacaoDificil":"B1 tenta perseguir A1 na rede e S1 defende no fundo em ponto real.","paraTurma":"Em turmas de 4 a 12 alunos, duplas no side-out recebem 4 saques seguidos na costura central e precisam variar pelo menos 1 bola pelo meio/cruzada e 2 bolas abrindo na ponta.","meta":"Converter 7 de 10 ataques originados de recep\u00e7\u00f5es na costura central sem perder o equil\u00edbrio do salto.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 saca da direita na costura central (seta 1). A1 fecha no meio para passar (seta tracejada 1) enviando a bola para L1 (seta 2). Em seguida, A1 ou abre de volta para a ponta superior (seta tracejada 2a) ou cruza pelo meio/direita (seta tracejada 2b) recebendo o levantamento de L1 para atacar contra B1.","codigo":"ATQ-AVA-125"},{"numero":126,"secao":7,"nome":"Desafio valendo ponto: 'S\u00f3 Golpes de Jeito' vs. 'S\u00f3 Pancada' contra defesa real","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (2 contra 2 em quadra completa)","tempo":"11 minutos","material":"5 bolas A1 L1 B1 D1","objetivo":"Treinar o dom\u00ednio extremo tanto dos golpes colocados quanto da cortada potente sob restri\u00e7\u00e3o t\u00e1tica, aprendendo como um prepara o outro.","comoMontar":"Dupla A (A1 + L1) no lado esquerdo atacando; Dupla B (B1 bloqueando + D1 defendendo) no lado direito.","passoAPasso":["A Dupla A vai atacar uma s\u00e9rie de 9 bolas divididas em 3 blocos de 3 bolas, valendo ponto real contra B1 e D1:","Bloco 1 (Bolas 1 a 3 \u2014 'Proibido Bater Forte'): A1 s\u00f3 pode pontuar usando golpes colocados regulamentares (cut shot, lob no fundo, poke ou cobra). A defesa (B1 + D1) SABE disso, mas ainda assim precisa cobrir toda a quadra 8x8m.","Bloco 2 (Bolas 4 a 6 \u2014 'Proibido Largar'): A1 \u00e9 obrigado a bater cortada potente de m\u00e3o aberta a mais de 80% de for\u00e7a (buscando as linhas, a costura da defesa ou as m\u00e3os altas do bloqueio).","Bloco 3 (Bolas 7 a 9 \u2014 'Arsenal Livre'): A1 pode misturar tudo livremente aplicando o que aprendeu nos dois blocos anteriores para enganar B1 e D1.","Ao final das 9 bolas, contam-se os pontos e as duplas invertem de lado."],"pontosAtencao":["No Bloco 1 (s\u00f3 colocadas), mesmo que o defensor saiba que voc\u00ea n\u00e3o pode bater forte, se voc\u00ea esperar ele dar o primeiro passo e colocar no canto oposto, a bola cai!","No Bloco 2 (s\u00f3 pancada), n\u00e3o bata cego no peito do defensor: bata forte na altura do tornozelo dele, na linha paralela ou explore o bloqueio alto.","No Bloco 3, use a mesma armada de bra\u00e7o do Bloco 2 para aplicar as largadas do Bloco 1."],"erroComum":"No bloco de pancada, achar que 'bater forte' significa bater para baixo na rede; corrija lembrando que a pancada inteligente na praia \u00e9 batida longa nos \u00faltimos 2 metros da quadra. Varia\u00e7\u00f5es","variacaoFacil":"Jogar contra apenas 1 defensor no fundo (sem bloqueador na rede) nos dois primeiros blocos.","variacaoDificil":"Se a defesa (B1 + D1) defender a bola e virar o contra- ataque, ela rouba 1 ponto do placar dos atacantes.","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a rod\u00edzio a cada bloco de 3 bolas: a dupla entra, joga o Bloco 1 (3 colocadas), na volta seguinte joga o Bloco 2 (3 pancadas) e na terceira volta joga o Bloco 3 (Livre).","meta":"Marcar pelo menos 6 pontos nas 9 bolas da s\u00e9rie (m\u00ednimo de 2 pontos em cada um dos tr\u00eas blocos).","descricaoDiagrama":"Quadra 16x8m vista de cima. Dupla A1 e L1 na esquerda contra B1 (rede) e D1 (fundo) na direita. O diagrama destaca o leque completo de finaliza\u00e7\u00f5es de A1 ap\u00f3s o levantamento (seta 1): Cut Shot curto (seta 2a), Cortada potente no meio/diagonal (seta 2b) e Lob/Paralela no fundo (seta 2c).","codigo":"ATQ-AVA-126"},{"numero":127,"secao":7,"nome":"Sequ\u00eancia valendo ponto: Side-out completo contra bloqueio e defesa agressiva","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Jogo 2x2 focado na efici\u00eancia de ataque do side-out)","tempo":"12 minutos","material":"5 bolas A1 L1 B1 S1 1 1","objetivo":"Manter mais de 70% de virada de bola (side-out) sob press\u00e3o real de saque, combinando leitura individual e chamada do parceiro.","comoMontar":"Quadra 16x8m com Dupla A (receptora/atacante) no lado esquerdo e Dupla B (sacadora/bloqueio/defesa) no lado direito.","passoAPasso":["A Dupla B tem 8 saques seguidos contra a Dupla A.","A Dupla B combina antes de cada saque o seu sistema defensivo (bloqueio na paralela + defesa na diagonal, bloqueio na diagonal + defesa na paralela, ou finta de retirada com 2 defensores no fundo).","A Dupla A recebe o saque, constr\u00f3i o levantamento e precisa ler o esquema da Dupla B para matar o ponto no primeiro ataque.","Sistema de placar do exerc\u00edcio: se a Dupla A matar o ponto de primeira no ataque = +2 pontos; se precisar de uma segunda tentativa no mesmo rally = +1 ponto; se tomar bloqueio ou errar o ataque para fora/rede = 0 ponto (e +2 pontos para a Dupla B).","Ap\u00f3s os 8 saques, as duplas invertem de papel e vence quem somar mais pontos ao final."],"pontosAtencao":["No v\u00f4lei de praia, a dupla que vira o seu ataque de side-out sem precisar de segunda tentativa economiza metade da energia f\u00edsica debaixo do sol!","Se o saque advers\u00e1rio foi muito bom e te deixou longe da rede, jogue uma bola alta no canto fundo para se reorganizar em vez de dar o ponto de gra\u00e7a errando na rede.","A dupla atacante precisa conversar a cada ponto sobre o que o bloqueador advers\u00e1rio est\u00e1 fazendo."],"erroComum":"Repetir o mesmo golpe 3 vezes seguidas no mesmo lugar onde o defensor advers\u00e1rio j\u00e1 est\u00e1 esperando; corrija obrigando o atacante a alternar entre bola forte e bola colocada. Varia\u00e7\u00f5es","variacaoFacil":"O sacador da Dupla B saca com 75% de pot\u00eancia para garantir que todas as 8 bolas tenham ataque.","variacaoDificil":"O sacador saca sempre no jogador que acabou de errar o ataque anterior, aumentando a press\u00e3o psicol\u00f3gica.","paraTurma":"Em turmas de 4 a 12 alunos, jogue s\u00e9ries de 4 saques por dupla: se a dupla receptora virar pelo menos 3 dos 4 ataques, ela continua na quadra e soma 1 'coroa'; se virar menos de 3, sai para a fila.","meta":"Virar pelo menos 6 dos 8 side-outs da s\u00e9rie (sendo no m\u00ednimo 4 de primeira batida).","descricaoDiagrama":"Quadra 16x8m vista de cima em disputa 2x2. S1 saca da direita (seta 1) e corre para defender (seta tracejada 1) enquanto B1 fecha o bloqueio na rede. Na esquerda, A1 recepciona (seta 2), L1 levanta (seta 3) e A1 avan\u00e7a (seta tracejada 2) atacando nos espa\u00e7os vazios (setas 4a e 4b).","codigo":"ATQ-AVA-127"},{"numero":128,"secao":7,"nome":"Desafio final 'Tr\u00edplice Coroa do Ataque': 3 bolas seguidas valendo o trono","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (2 contra 2 + professor/lan\u00e7ador de transi\u00e7\u00e3o)","tempo":"12 minutos","material":"6 bolas A1 L1 B1 D1 1 2 3","objetivo":"Vencer tr\u00eas cen\u00e1rios seguidos de ataque (1 side-out, 1 bola de sufoco afastada e 1 contra-ataque sob fadiga) contra defesa m\u00e1xima.","comoMontar":"Dupla Desafiante (A1 + L1) no lado esquerdo; Dupla Defensora do Trono (B1 + D1) no lado direito. O professor (ou pr\u00f3ximo da fila) fica na lateral com 2 bolas extras na m\u00e3o.","passoAPasso":["Para conquistar o 'Trono do Ataque', a dupla A1 + L1 precisa vencer a sequ\u00eancia ininterrupta de 3 bolas de ataque:","Bola 1 (Side-out Real): D1 saca da linha de fundo direita; A1 recepciona, L1 levanta e A1 ataca para pontuar.","Bola 2 (Bola de Sufoco Imediata): assim que a Bola 1 termina, o professor lan\u00e7a uma bola dif\u00edcil aos 4 metros da rede na quadra esquerda; L1 levanta do fundo e A1 precisa atacar essa bola afastada com intelig\u00eancia sem errar.","Bola 3 (Contra-ataque sob Fadiga): imediatamente ap\u00f3s a Bola 2, o professor bate uma bola em cima de A1 no fundo; A1 defende na areia, L1 sai da rede para levantar e A1 arranca com a perna queimando para fechar a 3\u00aa bola!","A dupla que converter pelo menos 2 das 3 bolas assume o lado do Trono e defende contra a pr\u00f3xima dupla."],"pontosAtencao":["Na Bola 1 (Side-out), voc\u00ea est\u00e1 descansado: use salto m\u00e1ximo e agressividade.","Na Bola 2 (Afastada aos 4m), use a cabe\u00e7a: n\u00e3o force para baixo; use topspin longo nos cantos ou cut shot.","Na Bola 3 (Sob fadiga ap\u00f3s defender), quando a perna pesa na areia, confie no chamado do seu levantador e use o golpe mais seguro do seu repert\u00f3rio (cobra/cut na diagonal ou pancada cruzada)."],"erroComum":"Perder a lucidez na 3\u00aa bola por causa do cansa\u00e7o e tentar fechar os olhos e bater de qualquer jeito; corrija exigindo que L1 grite 'CALMA, OLHA O BURACO!' enquanto levanta a \u00faltima bola. Varia\u00e7\u00f5es","variacaoFacil":"Dar 5 segundos de respiro entre a Bola 1, a Bola 2 e a Bola 3.","variacaoDificil":"Exigir que o MESMO jogador (A1) finalize as 3 bolas seguidas e que s\u00f3 conquiste o trono se acertar 3 de 3!","paraTurma":"Em turmas de 4 a 12 alunos, este \u00e9 o exerc\u00edcio mais vibrante para encerrar o treino de ataque: giro r\u00e1pido de todas as duplas tentando conquistar a 'Tr\u00edplice Coroa' em clima de competi\u00e7\u00e3o.","meta":"Converter pelo menos 2 das 3 bolas da Tr\u00edplice Coroa em 70% das entradas na quadra.","descricaoDiagrama":"Quadra 16x8m vista de cima. Sequ\u00eancia das 3 bolas de A1 e L1 na esquerda contra B1 e D1 na direita: Bola 1 vem do saque de D1 (seta 1); Bola 2 \u00e9 lan\u00e7ada afastada aos 4m da rede (seta 2); Bola 3 \u00e9 batida no fundo para defesa e transi\u00e7\u00e3o r\u00e1pida (seta 3), todas conclu\u00eddas com ataques de A1 (setas 4).","codigo":"ATQ-AVA-128"},{"numero":129,"secao":8,"nome":"Posi\u00e7\u00e3o de base na rede, m\u00e3os altas e tempo de salto vertical","nivel":"Iniciante","jogadores":"2 jogadores (1 bloqueador B1 e 1 atacante/lan\u00e7ador A1 do outro lado)","tempo":"7 minutos","material":"2 bolas e 2 cones SOMBRA CENTRALA1 B1 1 Base a 40cm da rede + M\u00e3os altas + Salto ap\u00f3s A1 Quadra 16x8m vista de cima. Na meia-quadra direita, B1 posicionado a 0,4m da rede entre 2 cones. Na meia-quadra esquerda, A1 a 1,5m da rede. Seta 1 indica o autolan\u00e7amento e salto de A1; B1 salta verticalmente projetando o cone de sombra","objetivo":"Automatizar a postura pronta junto \u00e0 rede (m\u00e3os na altura dos ombros e joelhos carregados na areia) e o atraso de meio segundo no salto.","comoMontar":"Posicione B1 na meia-quadra direita a 40 cent\u00edmetros da fita da rede, entre 2 cones. Do outro lado da rede (meia-quadra esquerda), A1 fica a 1,5 metro da fita com uma bola nas m\u00e3os.","passoAPasso":["B1 assume a posi\u00e7\u00e3o de base na rede: p\u00e9s paralelos na largura dos ombros a 40 cm da linha central, joelhos flexionados na areia e as duas m\u00e3os abertas j\u00e1 erguidas na altura das orelhas/ombros.","A1 lan\u00e7a a bola 1 metro para o alto e salta como se fosse atacar.","Regra de Ouro do Tempo na Areia: como na areia fofa o atacante demora mais para subir, B1 N\u00c3O salta junto com o in\u00edcio do salto de A1; B1 espera os p\u00e9s de A1 sa\u00edrem da areia para ent\u00e3o explodir verticalmente.","B1 sobe reto sem jogar os cotovelos para tr\u00e1s (evitando tocar na rede) e toca as duas m\u00e3os firmes na bola que A1 segura no ponto mais alto acima da fita.","Realizam 10 repeti\u00e7\u00f5es e invertem os pap\u00e9is."],"pontosAtencao":["Na praia, nunca abaixe as m\u00e3os at\u00e9 a coxa para tomar impulso no bloqueio: al\u00e9m de ser lento, o seu cotovelo vai bater na fita inferior da rede ao subir.","Impulsione a areia com as duas plantas dos p\u00e9s inteiras para n\u00e3o afundar apenas a ponta do p\u00e9.","Contraia o abd\u00f4men no ar para n\u00e3o ser projetado para frente contra a rede."],"erroComum":"Saltar cedo demais (junto com a corrida do atacante) e j\u00e1 estar descendo quando o atacante bate na bola; corrija com o comando verbal 'Ele sobe... EU SUBO!'. Varia\u00e7\u00f5es","variacaoFacil":"A1 n\u00e3o salta: apenas fica na ponta dos p\u00e9s erguendo a bola sobre a fita no sinal combinado.","variacaoDificil":"A1 faz uma finta r\u00e1pida de joelhos antes de saltar de verdade, testando se B1 mant\u00e9m a calma na areia.","paraTurma":"Em turmas de 4 a 12 alunos, posicione 4 duplas frente a frente ao longo dos 8 metros de largura da rede. Todos executam a sincronia de salto simultaneamente sob contagem do professor e trocam de lado a cada 8 saltos.","meta":"Completar 9 de 10 saltos verticais tocando a bola no ponto mais alto sem encostar um fio de cabelo na rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra direita, B1 posicionado a 0,4m da rede entre 2 cones. Na meia-quadra esquerda, A1 a 1,5m da rede. Seta 1 indica o autolan\u00e7amento e salto de A1; B1 salta verticalmente projetando o cone de sombra do bloqueio no centro da quadra direita.","codigo":"BLQ-INI-129"},{"numero":130,"secao":8,"nome":"Deslocamento lateral na rede (passo lateral e passo cruzado) antes do salto","nivel":"Iniciante","jogadores":"2 jogadores (B1 bloqueador e L1/A1 refer\u00eancia do outro lado)","tempo":"8 minutos","material":"2 bolas e 3 cones SOMBRA PONTA 1 SOMBRA PONTA 2 B1 A1 L1 1","objetivo":"Sair do centro da rede at\u00e9 a ponta da antena usando passo lateral (curto) ou passo cruzado (longo) e estancar os dois p\u00e9s na areia antes de subir.","comoMontar":"Na meia-quadra direita, coloque 1 cone central a 50 cm da rede (sa\u00edda de B1) e 2 cones nas extremidades (a 1,5m de cada antena). Do outro lado (esquerda), A1 e L1 ficam posicionados nas duas pontas com bolas.","passoAPasso":["B1 come\u00e7a sempre no cone central da rede (onde o bloqueador aguarda para ler o levantamento).","Nos primeiros 5 saltos (Deslocamento Curto de 1,5m): B1 usa 2 passadas laterais r\u00e1pidas sem cruzar os p\u00e9s, planta o p\u00e9 de fora na areia e salta verticalmente em frente a A1.","Nos 5 saltos seguintes (Deslocamento Longo de 3m at\u00e9 a antena): B1 gira o quadril, d\u00e1 1 passo cruzado amplo correndo paralelo \u00e0 rede, enquadra os dois p\u00e9s de volta para a fita no cone da ponta e salta.","No topo do salto, B1 deve estar 100% equilibrado (sem continuar voando de lado para fora da antena) e tocar na bola erguida por A1.","Volta ao cone central e repete para a ponta oposta; trocam a cada 10 saltos."],"pontosAtencao":["No v\u00f4lei de praia, voc\u00ea come\u00e7a no meio da rede para amea\u00e7ar a bola de segunda e s\u00f3 abre para a ponta quando a bola sai da m\u00e3o do levantador!","Use o p\u00e9 de fora (mais pr\u00f3ximo da antena) como um 'freio de m\u00e3o' na areia fofa para transformar a velocidade horizontal em salto vertical.","Mantenha as m\u00e3os acima da linha do peito durante toda a corrida lateral."],"erroComum":"Saltar ainda correndo de lado ('flutuando' no ar), abrindo um buraco entre o bloqueio e a bola; corrija exigindo que os dois p\u00e9s parem na areia por uma fra\u00e7\u00e3o de segundo antes da decolagem. Varia\u00e7\u00f5es","variacaoFacil":"Fazer o deslocamento em ritmo moderado focando apenas na frenagem dos dois p\u00e9s no cone da ponta.","variacaoDificil":"L1 fica no meio do outro lado com uma bola e aponta de surpresa para a esquerda ou para a direita, exigindo rea\u00e7\u00e3o imediata de B1.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 alvos humanos erguendo bolas nas duas pontas da quadra esquerda. Os bloqueadores saem em fila do cone central da direita: saltam na esquerda, voltam ao meio, saltam na direita e d\u00e3o lugar ao pr\u00f3ximo.","meta":"Realizar 8 de 10 deslocamentos (4 para a esquerda e 4 para a direita) saltando 100% equilibrado sem derivar no ar.","descricaoDiagrama":"Quadra 16x8m vista de cima. B1 inicia no cone central da rede direita (0,5m da fita). Setas tracejadas 1 e 2 mostram o deslocamento lateral/cruzado de B1 at\u00e9 os cones nas pontas (a 1,5m das antenas), onde salta frente a frente com A1 e L1 fechando o cone de bloqueio.","codigo":"BLQ-INI-130"},{"numero":131,"secao":8,"nome":"Penetra\u00e7\u00e3o agressiva das m\u00e3os sobre a rede ('invadir o telhado')","nivel":"Iniciante","jogadores":"2 jogadores (1 atacante/lan\u00e7ador A1 e 1 bloqueador B1)","tempo":"8 minutos","material":"4 bolas, 2 cones e 1 zona alvo na quadra do atacante ZONA ABAFADA A1 B1 1 2 Invas\u00e3o (\"Telhado\" 45\u00b0) cravando aos p\u00e9s de A1","objetivo":"Passar os punhos e antebra\u00e7os por cima da fita invadindo o espa\u00e7o a\u00e9reo advers\u00e1rio com os dedos abertos e r\u00edgidos apontados para a areia.","comoMontar":"B1 junto \u00e0 rede na meia-quadra direita. Na meia- quadra esquerda, A1 fica a 1,5 metro da rede com 4 bolas e uma Zona Alvo desenhada no ch\u00e3o aos p\u00e9s de A1 (entre 1m e 3m da rede).","passoAPasso":["Explica\u00e7\u00e3o da regra da praia: o bloqueador pode invadir as m\u00e3os por cima da rede para o lado advers\u00e1rio desde que N\u00c3O toque na bola antes de o atacante executar o seu golpe de ataque (ou quando a bola j\u00e1 est\u00e1 viajando em dire\u00e7\u00e3o \u00e0 rede).","A1 lan\u00e7a uma bola alta a 40\u201350 cm da fita do seu lado e d\u00e1 um tapa controlado em dire\u00e7\u00e3o ao topo da rede.","B1 salta verticalmente, sobe os ombros at\u00e9 as orelhas e, assim que as m\u00e3os passam da fita branca, projeta os bra\u00e7os para a frente/baixo ('fazendo um telhado' de 45 graus para dentro da quadra de A1).","Com os 10 dedos bem abertos, duros e polegares apontados para cima (separados por apenas 5 cm para a bola n\u00e3o passar no meio), B1 abafa a bola fazendo-a cair dentro da Zona Alvo aos p\u00e9s de A1.","Trocam de fun\u00e7\u00e3o a cada 8 bolas abafadas."],"pontosAtencao":["N\u00e3o bata na bola com as m\u00e3os no bloqueio (dar tapa na bola \u00e9 falta ou joga a bola para fora): apenas invada firme, trave os punhos para baixo e deixe a bola bater no seu pared\u00e3o.","Os polegares devem ficar alinhados e apontados para o c\u00e9u, com os dedos m\u00ednimos virados levemente para dentro ('m\u00e3os em concha') para a bola n\u00e3o escapar pelas laterais.","Tire as m\u00e3os de volta pelo alto na descida para n\u00e3o raspar o antebra\u00e7o na fita."],"erroComum":"Subir com as m\u00e3os retas apontadas para o c\u00e9u ('m\u00e3o de parede'), fazendo a bola bater e espirrar para fora da linha lateral; corrija pedindo para apontar a palma das m\u00e3os para os p\u00e9s do atacante advers\u00e1rio. Varia\u00e7\u00f5es","variacaoFacil":"A1 segura a bola parada a 20 cm acima e \u00e0 frente da fita para B1 saltar e empurrar a bola para baixo na quadra de A1.","variacaoDificil":"A1 varia a dist\u00e2ncia da bola (30 cm a 80 cm da rede) e bate firme de cortada contra as m\u00e3os de B1.","paraTurma":"Em turmas de 4 a 12 alunos, forme 2 ou 3 esta\u00e7\u00f5es ao longo da rede. Em cada esta\u00e7\u00e3o, 1 lan\u00e7ador alimenta 2 bloqueadores que se revezam tentando cravar a bola na Zona Alvo aos p\u00e9s do lan\u00e7ador.","meta":"Abafar 7 de 10 bolas fazendo-as cair diretamente no ch\u00e3o da quadra advers\u00e1ria (Zona Alvo de 1m a 3m).","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 a 1,5m da rede esquerda lan\u00e7a e ataca a bola pr\u00f3ximo \u00e0 fita (seta 1). B1 na rede direita salta e invade os bra\u00e7os al\u00e9m da linha central, abafando a bola de volta (seta 2) para a Zona Alvo aos p\u00e9s de A1 na quadra esquerda.","codigo":"BLQ-INI-131"},{"numero":132,"secao":8,"nome":"Bloqueio direcional: fechar o corredor da paralela","nivel":"Iniciante","jogadores":"3 jogadores (A1 atacante, L1 levantador e B1 bloqueador)","tempo":"9 minutos","material":"5 bolas, 3 cones e 1 zona protegida ZONA PROTEGIDA PARALELA (2m)A1 L1 B1 D1 1 1 2 Quadra 16x8m vista de cima. L1 levanta (seta 1) para A1 na ponta superior","objetivo":"Alinhar o corpo na rede para trancar 100% do ataque reto na linha paralela, protegendo toda a faixa lateral de 2 metros da sua quadra.","comoMontar":"Na meia-quadra esquerda: A1 na entrada (ponta superior) e L1 no centro. Na meia-quadra direita: B1 na rede e 2 cones demarcando a 'Zona Protegida da Paralela' (um corredor de 2 metros de largura ao longo da linha lateral superior direita).","passoAPasso":["A1 passa a bola para L1 e se prepara para atacar na ponta esquerda; L1 levanta a 1,5m da rede.","B1 desloca-se na rede at\u00e9 posicionar o seu OMBRO DE FORA (ombro direito, mais pr\u00f3ximo da antena) exatamente na linha da bola e do bra\u00e7o de ataque de A1.","B1 salta e vira a palma da m\u00e3o direita (m\u00e3o externa) 30 graus para dentro da quadra, para que, se a bola bater na borda da m\u00e3o, ela rebata para o centro da quadra advers\u00e1ria e n\u00e3o saia em block-out!","A1 tenta atacar exclusivamente no corredor da paralela: se a bola passar por B1 e cair dentro da Zona Protegida da Paralela, ponto de A1; se B1 bloquear ou obrigar A1 a jogar fora na antena, ponto de B1.","Realizam 8 ataques na paralela e rodam as posi\u00e7\u00f5es."],"pontosAtencao":["Quando voc\u00ea promete ao seu defensor que vai fechar a paralela, nenhuma bola batida forte pode passar entre voc\u00ea e a antena: deixe apenas 40 cm entre a sua m\u00e3o de fora e a antena (espa\u00e7o onde a bola forte sairia fora).","A m\u00e3o de fora SEMPRE vira levemente para dentro como a porta de um arm\u00e1rio fechando o \u00e2ngulo.","Olhe para a bola no momento da batida de A1 at\u00e9 ela tocar nos seus punhos."],"erroComum":"Parar muito aberto perto demais da antena (deixando o buraco por dentro) ou deixar a m\u00e3o externa reta tomando block-out; corrija alinhando o nariz de B1 com o ombro de ataque de A1. Varia\u00e7\u00f5es","variacaoFacil":"L1 lan\u00e7a a bola em um ponto fixo marcado por um cone a 1m da antena para B1 j\u00e1 saber exatamente onde parar.","variacaoDificil":"L1 varia a dist\u00e2ncia da bola em rela\u00e7\u00e3o \u00e0 antena (ora bem na ponta, ora 2 metros para dentro), exigindo que B1 ajuste a posi\u00e7\u00e3o da paralela a cada bola.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 1 levantador fixo na esquerda, 1 fila de atacantes na ponta e 1 fila de bloqueadores na direita. Quem sofre ponto na sua paralela sai da fila de bloqueio e vai para o ataque.","meta":"Impedir que o atacante acerte a Zona Protegida da Paralela em pelo menos 7 de 10 ataques.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta (seta 1) para A1 na ponta superior esquerda. B1 na rede direita desloca-se para a linha (seta tracejada 1) e projeta a sombra do bloqueio cobrindo toda a Zona Protegida da Paralela (2m de largura superior), deixando apenas a diagonal aberta para D1.","codigo":"BLQ-INI-132"},{"numero":133,"secao":8,"nome":"Bloqueio direcional: fechar a diagonal e proteger o meio de quadra","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (A1 atacante, L1 levantador e B1 bloqueador)","tempo":"9 minutos","material":"5 bolas, 3 cones e 1 zona protegida na diagonal ZONA PROTEGIDA DIAGONAL A1 L1 B1 D1 1","objetivo":"Posicionar-se um passo mais por dentro na rede para trancar o ataque cruzado forte na diagonal, deixando apenas o corredor estreito da linha para o defensor.","comoMontar":"Na meia-quadra esquerda: A1 na ponta superior e L1 no centro. Na meia-quadra direita: B1 na rede e cones demarcando a 'Zona Protegida da Diagonal' (do centro da quadra at\u00e9 a lateral inferior).","passoAPasso":["Quando a t\u00e1tica da dupla \u00e9 fechar a diagonal (o golpe favorito da maioria dos atacantes), B1 se posiciona 1 passo mais para o CENTRO da rede em rela\u00e7\u00e3o \u00e0 bola.","A1 passa para L1 e entra para atacar na ponta com \u00e2ngulo de 45 graus.","B1 l\u00ea a linha do peito e do ombro de A1 apontando para a diagonal e alinha as suas duas m\u00e3os exatamente na frente do ombro de ataque de A1.","No salto, B1 invade os bra\u00e7os em diagonal na dire\u00e7\u00e3o de A1 (n\u00e3o invade reto para a linha de fundo, mas apontando os dois bra\u00e7os para o ombro do atacante!).","A1 tenta bater forte na diagonal: se B1 tocar na bola ou se A1 for obrigado a tirar tanto do bloqueio que mande a bola fora na lateral, ponto de B1."],"pontosAtencao":["Segredo biomec\u00e2nico do bloqueio de diagonal na praia: gire levemente os seus ombros no ar de frente para o atacante e invada as duas m\u00e3os na dire\u00e7\u00e3o do bra\u00e7o dele!","A m\u00e3o interna (mais pr\u00f3xima do meio da rede) deve ficar firme para a bola n\u00e3o vazar pelo centro.","N\u00e3o tente adivinhar a paralela no \u00faltimo segundo: confie que o seu defensor est\u00e1 l\u00e1 atr\u00e1s cuidando da linha."],"erroComum":"Parar na frente do corpo do atacante em vez de parar na linha cruzada do bra\u00e7o dele, deixando a diagonal passar ao lado da m\u00e3o esquerda; corrija dando meio passo a mais para dentro da quadra. Varia\u00e7\u00f5es","variacaoFacil":"A1 s\u00f3 tem permiss\u00e3o para bater cortada forte na diagonal (proibido largar curto), focando 100% no encaixe das m\u00e3os de B1.","variacaoDificil":"Colocar D1 defendendo no corredor da paralela: A1 pode bater na diagonal (contra B1) ou na paralela (contra D1).","paraTurma":"Em turmas de 4 a 12 alunos, monte duas esta\u00e7\u00f5es de ataque-bloqueio (uma na entrada esquerda e outra na sa\u00edda direita) treinando o fechamento de diagonal dos dois lados da rede.","meta":"Bloquear, amortecer ou for\u00e7ar o erro do atacante em 7 de 10 ataques fortes direcionados para a diagonal.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta (seta 1) para A1 que entra em 45 graus na ponta esquerda (seta tracejada 1). B1 posiciona-se por dentro na rede direita e invade em \u00e2ngulo projetando o cone de sombra do bloqueio sobre a Zona Protegida da Diagonal, enquanto o corredor superior fica para D1.","codigo":"BLQ-INT-133"},{"numero":134,"secao":8,"nome":"Sinais de bloqueio atr\u00e1s das costas e combina\u00e7\u00e3o com o defensor","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (B1 bloqueador + D1 sacador/defensor contra A1 + L1)","tempo":"10 minutos","material":"5 bolas e 4 cones SINAL 1 DEDO: FECHA LINHA A1 L1 B1 D1 11 2","objetivo":"Praticar o c\u00f3digo oficial de sinais de dedos atr\u00e1s do quadril antes do saque e cumprir fielmente na rede o corredor prometido ao parceiro.","comoMontar":"No lado direito: B1 na rede (de costas para o seu sacador D1) e D1 na linha de fundo para sacar. No lado esquerdo: A1 (na esquerda) e L1 (na direita) em posi\u00e7\u00e3o de recep\u00e7\u00e3o.","passoAPasso":["Antes de cada saque de D1, B1 coloca as DUAS m\u00e3os atr\u00e1s da lombar/quadril (fora da vis\u00e3o de A1 e L1) para mostrar o plano t\u00e1tico:","C\u00f3digo Universal do V\u00f4lei de Praia: a m\u00e3o ESQUERDA de B1 indica o que B1 far\u00e1 contra o atacante da esquerda (A1); a m\u00e3o DIREITA indica o que B1 far\u00e1 contra o atacante da direita (L1). 1 dedo = fecho a Paralela (Linha); 2 dedos = fecho a Diagonal; M\u00e3o fechada (punho) = n\u00e3o bloqueio / retiro; M\u00e3o aberta = bloqueio na bola.","Exemplo da rodada: B1 mostra '1 dedo na m\u00e3o esquerda e 2 dedos na m\u00e3o direita'.","D1 l\u00ea o sinal, saca em A1 (na esquerda) e j\u00e1 corre diretamente para defender a DIAGONAL (pois sabe que B1 mostrou 1 dedo para A1 e vai trancar a paralela!).","B1 cumpre 100% o sinal fechando a paralela de A1; a cada 6 saques as duplas trocam de fun\u00e7\u00e3o."],"pontosAtencao":["Regra de honra da dupla de praia: o bloqueador NUNCA muda de ideia na rede sem avisar!","Se voc\u00ea mostrou 1 dedo (paralela) no sinal e resolver pular na diagonal na hora H, voc\u00ea deixa o seu defensor correndo para o lugar errado e destr\u00f3i a confian\u00e7a da dupla.","Mantenha os sinais baixos na linha do cal\u00e7\u00e3o para a sombra na areia n\u00e3o entregar o sinal para o advers\u00e1rio!","Se quiser pedir que o seu parceiro saque em um jogador espec\u00edfico, 'pisque/mexa' o dedo daquela m\u00e3o."],"erroComum":"Confundir qual m\u00e3o representa qual atacante ou esquecer o sinal que acabou de mostrar quando a bola sobe; corrija obrigando D1 a confirmar verbalmente baixo antes de sacar ('Um na esquerda, dois na direita!'). Varia\u00e7\u00f5es","variacaoFacil":"Usar apenas uma m\u00e3o no sinal porque o saque ser\u00e1 sempre direcionado para o mesmo atacante (A1).","variacaoDificil":"B1 pode gritar 'TROCA!' durante o levantamento caso o passe advers\u00e1rio saia muito longe da rede, mudando em voz alta o plano para retirada.","paraTurma":"Em turmas de 4 a 12 alunos, jogue 2x2 com duplas rodando a cada 3 saques. O professor fica atr\u00e1s da linha de fundo olhando o sinal de B1: se B1 bloquear um corredor diferente do que mostrou nos dedos, a dupla perde 2 pontos na hora!","meta":"Executar 10 de 10 pontos com 100% de fidelidade entre o sinal mostrado nas costas, o posicionamento de B1 e a corrida de D1.","descricaoDiagrama":"Quadra 16x8m vista de cima. B1 na rede direita mostra sinais com as m\u00e3os nas costas para D1 na linha de fundo. D1 saca em A1 na esquerda (seta 1) e corre para defender a diagonal inferior (seta tracejada 2), enquanto B1 desloca-se (seta tracejada 1) fechando a sombra da paralela superior.","codigo":"BLQ-INT-134"},{"numero":135,"secao":8,"nome":"Falso bloqueio (finta na rede e retirada para defender com 2 no fundo)","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (B1 + D1 contra A1 + L1)","tempo":"10 minutos","material":"5 bolas e 2 cones de base no fundo A1 L1 B1 D1 1 1","objetivo":"Enganar o atacante advers\u00e1rio fazendo- o acreditar que haver\u00e1 bloqueio na rede e recuar no \u00faltimo instante para fechar a quadra com dois defensores.","comoMontar":"Na meia-quadra direita, B1 na rede e D1 no fundo; coloque 2 cones a 5,5 metros da rede (um na metade superior e outro na metade inferior) marcando onde B1 e D1 devem terminar posicionados. Na esquerda, A1 e L1.","passoAPasso":["No sinal atr\u00e1s das costas, B1 mostra o 'Punho Fechado' (sinal de Falso Bloqueio / Retirada).","D1 saca em A1 e j\u00e1 se posiciona no cone de 5,5m da diagonal.","Enquanto A1 recepciona e L1 se prepara para levantar, B1 faz toda a encena\u00e7\u00e3o de quem vai bloquear pesado: fica colado na fita com as m\u00e3os altas, acompanha a bola e d\u00e1 um pequeno passo amea\u00e7ador para a frente.","No exato instante em que a bola sai das m\u00e3os de L1 (quando A1 j\u00e1 baixou o olhar na rede e achou que B1 ia pular), B1 abre o quadril em sil\u00eancio e dispara em velocidade at\u00e9 o cone de 5,5m da paralela!","B1 estanca os dois p\u00e9s na areia aos 5,5m antes da batida de A1, defendendo o lob ou o tiro na linha com os dois jogadores no fundo."],"pontosAtencao":["Se voc\u00ea sair correndo da rede cedo demais (antes de o levantador tocar na bola), o atacante v\u00ea que n\u00e3o tem bloqueio e senta o bra\u00e7o livre: espere a bola sair da m\u00e3o do levantador para iniciar a retirada!","Mais importante do que chegar aos 6 metros de profundidade \u00e9 PARAR OS DOIS P\u00c9S na areia no momento em que o atacante bate na bola.","O falso bloqueio funciona perfeitamente contra atacantes que adoram dar 'lob' por cima do bloqueio: eles jogam o lob direto nas suas m\u00e3os!"],"erroComum":"Virar de costas para a rede ao correr para o fundo, perdendo totalmente a vis\u00e3o do atacante; corrija exigindo corrida lateral/cruzada olhando por cima do ombro interno. Varia\u00e7\u00f5es","variacaoFacil":"L1 faz um levantamento bem alto (4,5m de altura) para dar tempo confort\u00e1vel de B1 encenar na rede e chegar ao cone de 5,5m.","variacaoDificil":"B1 alterna no sinal entre Bloqueio Real e Falso Bloqueio, proibindo A1 de adivinhar antes da subida.","paraTurma":"Em turmas de 4 a 12 alunos, as duplas de defesa ganham 2 pontos toda vez que B1 aplicar o falso bloqueio e defender limpa uma bola que A1 tentou largar ou encobrir achando que havia bloqueio.","meta":"Completar 8 de 10 retiradas de falso bloqueio estando com os dois p\u00e9s 100% plantados no cone de 5,5m no momento da batida.","descricaoDiagrama":"Quadra 16x8m vista de cima. D1 saca da direita (seta 1) e ocupa o cone inferior a 5,5m (seta tracejada 1). A1 passa para L1 (seta 2) que levanta (seta 3). B1 finta o bloqueio na rede e retira em velocidade (seta tracejada 2) at\u00e9 o cone superior a 5,5m para defender o ataque de A1 (seta 4).","codigo":"BLQ-INT-135"},{"numero":136,"secao":8,"nome":"Sair do bloqueio ('Pulling') ao ler levantamento longe da rede","nivel":"Intermedi\u00e1rio","jogadores":"3 ou 4 jogadores (B1 bloqueador, D1 defensor e A1 + L1)","tempo":"10 minutos","material":"5 bolas e 3 cones A1 L1 B1 D1 1 1","objetivo":"Reconhecer em uma fra\u00e7\u00e3o de segundo que o levantamento advers\u00e1rio ficou afastado da rede (a 3m ou mais) e abortar o salto de bloqueio para defender no fundo.","comoMontar":"Na meia-quadra esquerda, L1 no centro e 1 cone a 3,5m da rede. Na meia-quadra direita, B1 na rede (com ordem inicial de bloquear) e D1 no fundo.","passoAPasso":["Regra T\u00e1tica de Ouro da Praia: NUNCA salte para bloquear na rede se a bola foi levantada a mais de 2,5 ou 3 metros de dist\u00e2ncia da fita! De longe da rede o atacante n\u00e3o consegue bater para baixo e vai apenas te usar ou largar nos buracos.","A1 passa a bola para L1; L1 varia a qualidade do levantamento: ora levanta na rede (1,2m), ora deixa a bola afastada aos 3,5 metros.","Se a bola for na rede (1,2m), B1 mant\u00e9m a decis\u00e3o, salta e bloqueia firme.","Se B1 ler que a bola saiu da m\u00e3o de L1 para tr\u00e1s (caindo aos 3,5m da rede), B1 grita 'SA\u00cd! LIVRE!' para avisar D1, aborta o salto e faz o 'pulling' (retirada r\u00e1pida em diagonal) para defender a quadra junto com D1.","Ap\u00f3s a defesa de B1 ou D1, a dupla constr\u00f3i o contra- ataque."],"pontosAtencao":["Pular na rede quando o atacante est\u00e1 batendo l\u00e1 dos 3,5 metros \u00e9 o chamado 'bloqueio fantasma': voc\u00ea n\u00e3o bloqueia nada e ainda deixa o seu parceiro sozinho para cobrir 64m\u00b2!","O grito 'SA\u00cd!' ou 'SEM BLOCO!' precisa ser imediato para que o seu defensor ajuste a posi\u00e7\u00e3o dele no fundo.","Quando voc\u00ea retira numa bola afastada de 3,5m, pare por volta dos 4,5 metros da rede (pronto para pegar o cut shot ou o tiro meia-for\u00e7a)."],"erroComum":"Ficar na d\u00favida no meio do caminho (n\u00e3o pula na rede e tamb\u00e9m n\u00e3o recua, ficando parado aos 2 metros levando bolada no p\u00e9); corrija exigindo decis\u00e3o explosiva assim que a bola sai da m\u00e3o de L1. Varia\u00e7\u00f5es","variacaoFacil":"L1 faz apenas levantamentos afastados (aos 3,5m e 4m) para B1 automatizar o gatilho visual de retirada.","variacaoDificil":"A1 tamb\u00e9m pode tentar um 'poke' curto na frente quando v\u00ea B1 retirando, exigindo que B1 pare equilibrado aos 4m pronto para avan\u00e7ar de volta.","paraTurma":"Em turmas de 4 a 12 alunos, o professor ou levantador varia bolas coladas e bolas afastadas: se o bloqueador pular na rede numa bola que estava atr\u00e1s da linha de 3m, ele paga 3 burpees e d\u00e1 lugar ao pr\u00f3ximo da fila.","meta":"Tomar a decis\u00e3o correta (bloquear na bola perto / retirar na bola longe) em 9 de 10 lances.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 na esquerda envia levantamento afastado para o cone a 3,5m da rede (seta 1). B1 na rede direita l\u00ea que a bola ficou longe, grita 'Sa\u00ed!' e executa o 'pulling' recuando at\u00e9 os 4,5m (seta tracejada 1) ao lado de D1 para defender o ataque de A1 (seta 2).","codigo":"BLQ-INT-136"},{"numero":137,"secao":8,"nome":"Leitura do atacante: observar a passada de aproxima\u00e7\u00e3o e a linha do ombro","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (A1 atacante, L1 levantador e B1 bloqueador de leitura)","tempo":"10 minutos","material":"5 bolas e 2 cones SE ENTRAR RETO (1a) SE ENTRAR ABERTO 45\u00b0 (1b) A1 A1 L1 B1","objetivo":"Deixar de olhar para a bola durante toda a queda e focar os olhos no \u00e2ngulo de corrida e no ombro do atacante para antecipar onde ele vai bater.","comoMontar":"Na meia-quadra esquerda: A1 e L1. Na meia-quadra direita: B1 sozinho na rede (sem combina\u00e7\u00e3o pr\u00e9via de sinal \u2014 B1 vai bloquear 'na leitura pura').","passoAPasso":["Sequ\u00eancia Visual de 3 Etapas do Grande Bloqueador de Praia: 1\u00ba Olhe para o recebedor; 2\u00ba Olhe para as m\u00e3os do levantador para ver onde a bola vai cair; 3\u00ba Tire o olho da bola e CRAVE O OLHAR NO ATACANTE (p\u00e9s, quadril e ombro)!","A1 passa para L1 e escolhe um de dois padr\u00f5es claros de corrida na areia:","Padr\u00e3o A: A1 abre fora da quadra e corre em \u00e2ngulo fechado apontando os dois p\u00e9s e o peito para a DIAGONAL -> B1 l\u00ea os p\u00e9s/ombro de A1 e fecha a diagonal.","Padr\u00e3o B: A1 corre reto paralelo \u00e0 linha lateral com o ombro apontado para a PARALELA -> B1 l\u00ea o alinhamento reto de A1 e fecha a linha.","No \u00faltimo milissegundo no ar, se A1 baixar o cotovelo para largar, B1 abre as m\u00e3os altas para abafar o lob/poke."],"pontosAtencao":["A bola n\u00e3o mente, mas a bola tamb\u00e9m n\u00e3o bate sozinha: quem decide a dire\u00e7\u00e3o do ataque \u00e9 o OMBRO e o PUNHO do atacante!","Se voc\u00ea ficar olhando s\u00f3 para a bola no c\u00e9u, voc\u00ea salta cego. 90% dos jogadores amadores e intermedi\u00e1rios batem exatamente na dire\u00e7\u00e3o para onde a ponta dos p\u00e9s deles aponta no \u00faltimo passo na areia.","Enquadre as suas duas m\u00e3os sempre na frente do ombro do bra\u00e7o que bate (cuidado com atacantes canhotos!)."],"erroComum":"Acompanhar a bola com a cabe\u00e7a levantada at\u00e9 o topo e s\u00f3 olhar para o atacante depois que j\u00e1 pulou; corrija obrigando B1 a gritar no ch\u00e3o 'ABERTO!' ou 'RETO!' conforme a corrida de A1. Varia\u00e7\u00f5es","variacaoFacil":"A1 \u00e9 proibido de girar o punho no ar: ele deve bater exatamente para onde a sua corrida apontou.","variacaoDificil":"A1 pode tentar correr apontando para a diagonal e girar o ombro no ar para a paralela, exigindo que B1 leia o giro do ombro no salto.","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a um duelo 1x1 na rede (com L1 levantando): o bloqueador ganha 2 pontos a cada toque de leitura no ataque de A1; trocam a cada 5 bolas.","meta":"Acertar a leitura da dire\u00e7\u00e3o do ataque (tocando ou abafando a bola) em pelo menos 6 de 10 ataques sem sinal pr\u00e9vio.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta (seta 1) para A1. A1 varia o \u00e2ngulo de entrada: ou corrida reta na linha (seta tracejada 1a) ou corrida aberta em 45\u00b0 para a diagonal (seta tracejada 1b). B1 na rede direita foca o olhar nos p\u00e9s/ombro de A1 e ajusta o bloqueio fechando o \u00e2ngulo correspondente.","codigo":"BLQ-INT-137"},{"numero":138,"secao":8,"nome":"Leitura do levantamento: bola colada na fita ('bola 50/50') vs. bola passada na antena","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (A1, L1 e B1)","tempo":"10 minutos","material":"5 bolas e 2 cones BOLA PASSADA NA ANTENA FECHA DIAG A1 A1 L1 B1 B1 1a","objetivo":"Mudar a postura de invas\u00e3o e o posicionamento das m\u00e3os quando o levantamento advers\u00e1rio cola na fita ou foge demais para a antena.","comoMontar":"A1 e L1 na meia-quadra esquerda; B1 na rede da meia- quadra direita.","passoAPasso":["L1 envia dois tipos espec\u00edficos de levantamento que d\u00e3o total vantagem ao bloqueador se ele souber ler:","Situa\u00e7\u00e3o 1 (Bola Colada na Fita / 'Bola de Dividida'): o levantamento sobe a apenas 20 cm da rede. B1 N\u00c3O salta longe da fita nem espera: B1 se aproxima a 20 cm da rede, salta no mesmo tempo de A1 e envolve a bola com as duas m\u00e3os abertas e duras ('encapsulando' a bola), vencendo a dividida para baixo.","Situa\u00e7\u00e3o 2 (Bola Passada para Fora da Antena): o levantamento corre demais para a lateral. Como A1 \u00e9 obrigado pelas leis da f\u00edsica a cruzar a bola de volta por dentro da antena (n\u00e3o tem como bater na paralela porque a antena est\u00e1 no meio!), B1 abandona a linha e fecha 100% a DIAGONAL a 1,5m da antena!","Executam 5 bolas coladas na fita e 5 bolas passadas na antena; depois rodam."],"pontosAtencao":["Quando a bola est\u00e1 colada em cima da fita (50/50), n\u00e3o d\u00ea um tapa nela: coloque as duas m\u00e3os abertas e r\u00edgidas como uma parede a 2 cm da bola e empurre apenas os punhos quando o atacante tocar nela.","Quando o levantamento passa para fora da antena advers\u00e1ria, qualquer bloqueador que continua fechando a paralela est\u00e1 bloqueando o vento (a bola nunca poder\u00e1 passar por fora da antena!).","D\u00ea um passo para dentro e tranque a diagonal.","Cuidado redobrado com os p\u00e9s e a barriga nas bolas coladas para n\u00e3o cometer toque na rede."],"erroComum":"Na bola passada para fora da antena, continuar colado na antena tentando bloquear a linha e deixar toda a diagonal aberta para o atacante salvar a bola; corrija colocando um cone a 1,5m da antena onde B1 deve parar nessa bola. Varia\u00e7\u00f5es","variacaoFacil":"Treinar separadamente: 5 bolas de dividida em cima da fita e depois 5 bolas abertas na antena.","variacaoDificil":"L1 mistura livremente bola normal (1,5m), bola colada na fita e bola passada na antena.","paraTurma":"Em turmas de 4 a 12 alunos, duas esta\u00e7\u00f5es na rede trabalham as duas leituras de levantamento com rod\u00edzio a cada 6 bolas.","meta":"Vencer ou bloquear 7 de 10 lances aproveitando o erro de levantamento (colado na fita ou passado na antena).","descricaoDiagrama":"Quadra 16x8m vista de cima. Duas situa\u00e7\u00f5es na rede: no topo (Situa\u00e7\u00e3o 2), L1 levanta passado na antena (seta 1a) e B1 d\u00e1 um passo para dentro fechando toda a diagonal (sombra superior). Embaixo (Situa\u00e7\u00e3o 1), L1 levanta colado na fita (seta 1b) e B1 invade encapsulando a dividida na rede.","codigo":"BLQ-INT-138"},{"numero":139,"secao":8,"nome":"Bloqueio de bola de segunda e rea\u00e7\u00e3o a ataque r\u00e1pido do levantador","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (B1 + D1 contra A1 + L1)","tempo":"10 minutos","material":"5 bolas RESPEITA 2\u00aa BOLA ABRE AP\u00d3S LEVANTE A1 L1 B1 D1 1 2","objetivo":"Manter a disciplina de posicionamento central na rede para desencorajar ou cravar a bola de segunda do levantador antes de abrir para o atacante.","comoMontar":"Dupla A1 + L1 na meia-quadra esquerda; B1 na rede e D1 no fundo da meia-quadra direita.","passoAPasso":["Por que tantos jogadores levam bola de segunda na cabe\u00e7a na praia? Porque o bloqueador corre desesperado para a frente do atacante assim que a recep\u00e7\u00e3o sobe, deixando o meio da rede escancarado para o levantador passar de segunda!","D1 saca em A1; A1 faz uma recep\u00e7\u00e3o alta que sobe no centro da rede (a 1m\u20131,5m da fita).","Regra de Posicionamento de B1: enquanto L1 est\u00e1 entrando embaixo da bola, B1 fica plantado exatamente EM FRENTE a L1 no meio da rede com as m\u00e3os altas ('respeitando a segunda bola').","L1 tem liberdade para: ou tentar atacar/passar de segunda bola (e B1 salta na cara dele para bloquear!), ou levantar para A1 na ponta (e s\u00f3 ent\u00e3o B1 usa o passo cruzado explosivo para fechar A1).","Se L1 fizer ponto de segunda bola porque B1 saiu cedo demais do meio, conta 2 pontos para o ataque; se B1 bloquear a bola de segunda, conta 2 pontos para a defesa!"],"pontosAtencao":["Na praia, a presen\u00e7a f\u00edsica de um bloqueador alto parado na frente do levantador j\u00e1 elimina 80% das bolas de segunda sem voc\u00ea precisar nem pular.","Olhe para os p\u00e9s e para a linha dos ombros do levantador (L1): se ele pular ou virar os ombros para a rede, suba imediatamente bloqueando o meio.","Assim que a bola sair da m\u00e3o de L1 para o atacante A1, solte os quadris e d\u00ea o sprint lateral na rede."],"erroComum":"Adivinhar o levantamento e correr para a antena antes de L1 tocar na bola, tomando bola de segunda f\u00e1cil no meio da quadra; corrija desenhando uma caixa no centro da rede de onde B1 s\u00f3 pode sair ap\u00f3s o toque de L1. Varia\u00e7\u00f5es","variacaoFacil":"A1 avisa quando o passe subiu 'Na m\u00e3o!' (perigo de bola de segunda) para alertar B1.","variacaoDificil":"L1 tamb\u00e9m pode levantar uma bola r\u00e1pida no meio ('bola chutada') para A1, exigindo leitura r\u00e1pida de B1 no centro.","paraTurma":"Em turmas de 4 a 12 alunos, jogue s\u00e9ries de 5 bolas em duplas: o levantador \u00e9 incentivado a testar a disciplina de B1 tentando pelo menos 2 bolas de segunda por s\u00e9rie.","meta":"Neutralizar 8 de 10 tentativas de bola de segunda no centro e ainda chegar a tempo no bloqueio de ponta nas bolas levantadas.","descricaoDiagrama":"Quadra 16x8m vista de cima. D1 saca em A1 (seta 1), que passa alto para o centro da rede (seta 2). B1 aguarda postado em frente a L1 no meio da rede: se L1 atacar de 2\u00aa (seta 3a), B1 bloqueia no centro; se L1 levantar na ponta para A1 (seta 3b), B1 desloca-se r\u00e1pido (seta tracejada 1) para bloquear na ponta.","codigo":"BLQ-AVA-139"},{"numero":140,"secao":8,"nome":"Bloqueio de op\u00e7\u00e3o ('Spread block' / 'Toquinho no bloco'): amortecer para contra-atacar","nivel":"Avan\u00e7ado","jogadores":"3 ou 4 jogadores (B1 bloqueador, D1 defensor/levantador e A1 + L1)","tempo":"10 minutos","material":"5 bolas e 1 zona de amortecimento AMORTECIDA A1 L1 B1 D1 1","objetivo":"Usar o bloqueio n\u00e3o apenas para fechar um corredor, mas abrindo os bra\u00e7os no \u00faltimo instante ou suavizando os punhos para amortecer a bola para o alto na pr\u00f3pria quadra.","comoMontar":"A1 + L1 na meia-quadra esquerda; B1 na rede e D1 no fundo da meia-quadra direita.","passoAPasso":["Lembrete essencial da Regra da Praia: o toque da bola no bloqueio CONTA como o 1\u00ba contato da dupla! Ap\u00f3s o toque no bloqueio, restam apenas mais 2 contatos (qualquer um dos dois jogadores pode dar o 2\u00ba contato).","Quando o levantamento para A1 fica a 2 metros da rede (onde \u00e9 dif\u00edcil cravar um bloqueio direto para o ch\u00e3o), B1 usa duas t\u00e9cnicas avan\u00e7adas:","T\u00e9cnica A ('Spread Block' / Abrir asas): B1 sobe com as m\u00e3os juntas e, no momento exato da batida de A1, abre os dois bra\u00e7os lateralmente em 'V' para cobrir mais largura e tocar na bola.","T\u00e9cnica B ('Soft Block' / Amortecer para cima): quando B1 v\u00ea que A1 vai bater um tiro alto ou que B1 pulou um pouco mais baixo, B1 inclina as palmas das m\u00e3os 20 graus para CIMA/TR\u00c1S, fazendo a bola bater no bloqueio e subir mansa no meio da pr\u00f3pria quadra!","Assim que a bola sobe do bloqueio (1\u00ba toque), D1 (ou o pr\u00f3prio B1) faz o levantamento (2\u00ba toque) e o parceiro ataca (3\u00ba toque)."],"pontosAtencao":["No v\u00f4lei de praia, um bloqueio que amortece a bola 4 metros para o alto na sua pr\u00f3pria quadra vale quase tanto quanto um bloqueio direto para o ch\u00e3o, porque gera um contra-ataque f\u00e1cil!","Assim que a bola raspar no seu dedo no bloqueio, grite imediatamente 'TOCOU!","\u00c9 DOIS!' para o seu defensor saber que aquele j\u00e1 foi o primeiro contato e que o pr\u00f3ximo toque j\u00e1 \u00e9 o levantamento!","Na regola da praia, o pr\u00f3prio bloqueador que tocou na bola no bloqueio PODE dar o segundo toque seguido se a bola cair perto dele na rede."],"erroComum":"A bola raspar no bloqueio e o defensor no fundo dar uma manchete achando que ainda tem 3 toques, obrigando o bloqueador a passar a bola de gra\u00e7a; corrija exigindo o grito 'TOCOU! LEVANTA!' no ato. Varia\u00e7\u00f5es","variacaoFacil":"A1 bate bolas a 70% de for\u00e7a na dire\u00e7\u00e3o das m\u00e3os de B1 para B1 treinar o amortecimento para o alto e ele mesmo (ou D1) levantar.","variacaoDificil":"Se a bola tocar no bloqueio de B1 e a dupla converter o contra-ataque nos 2 toques seguintes, vale 3 pontos no placar!","paraTurma":"Em turmas de 4 a 12 alunos, jogue 2x2 premiando com pontua\u00e7\u00e3o extra todo ponto constru\u00eddo ap\u00f3s um amortecimento de bloqueio ('Soft Block') bem comunicado.","meta":"Conseguir pelo menos 5 amortecimentos de bloqueio na s\u00e9rie seguidos de levantamento no 2\u00ba toque e ataque no 3\u00ba toque.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta (seta 1) e A1 ataca (seta 2). B1 na rede direita usa o 'Soft/Spread Block' amortecendo a bola para o alto dentro da pr\u00f3pria quadra (seta 3 - 1\u00ba toque). D1 avan\u00e7a do fundo (seta tracejada 1) para levantar no 2\u00ba toque (seta 4) e B1 abre para finalizar no 3\u00ba toque (seta 5).","codigo":"BLQ-AVA-140"},{"numero":141,"secao":8,"nome":"Bloqueio com vento forte (ajuste de tempo, invas\u00e3o e 'lob trap')","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (B1 + D1 contra A1 + L1)","tempo":"10 minutos","material":"5 bolas BAIXO: \u25c4","objetivo":"Adaptar a agressividade do salto e a inclina\u00e7\u00e3o das m\u00e3os quando o vento sopra contra o atacante ou a favor do atacante.","comoMontar":"Treine 5 minutos com o vento soprando das costas de B1 contra o atacante (Vento a favor do bloqueio) e 5 minutos no lado oposto (Vento contra o bloqueio).","passoAPasso":["Situa\u00e7\u00e3o 1 (Vento soprando das costas de B1 CONTRA a cara do atacante A1): o vento empurra o levantamento de A1 para longe da rede, mas freia qualquer bola que A1 tentar jogar por cima do bloqueio! Nesse lado, B1 atrasa um instante o salto, sobe com os bra\u00e7os mais altos (menos invadidos e mais verticais) para 'ca\u00e7ar' os lobs e pokes que o vento segura em cima da rede!","Situa\u00e7\u00e3o 2 (Vento soprando das costas do atacante A1 A FAVOR do ataque dele): o vento joga o levantamento de A1 para cima da fita da rede! Nesse lado, B1 fica colado na rede e invade o m\u00e1ximo poss\u00edvel ('telhado fechado') porque a bola vai cair no colo da rede e A1 vai tentar bater para baixo.","Al\u00e9m disso, se houver vento lateral forte soprando para uma antena, B1 d\u00e1 meio passo a mais para o lado para onde o vento carrega a bola.","Executam 6 bolas de cada lado da quadra sentindo a diferen\u00e7a brutal do vento no bloqueio."],"pontosAtencao":["Quando o atacante est\u00e1 contra o vento e tenta dar um lob ou coquinho por cima de voc\u00ea, o vento para a bola em cima da fita: se voc\u00ea mantiver os bra\u00e7os altos na descida do salto, voc\u00ea pega a bola de segunda no ar!","Quando o vento empurra o levantamento advers\u00e1rio para cima da fita, prepare-se para a bola de dividida (exerc\u00edcio 138).","Com vento forte mexendo a fita superior da rede, deixe 5 cm a mais de margem nos cotovelos para a rede n\u00e3o bater no seu bra\u00e7o trazida pela rajada!"],"erroComum":"Saltar muito colado na fita quando o vento est\u00e1 soprando a rede na dire\u00e7\u00e3o do seu peito, cometendo falta de toque na rede trazida pelo vento; corrija mantendo 45 cm de dist\u00e2ncia da linha central. Varia\u00e7\u00f5es","variacaoFacil":"Manter a dupla no mesmo lado do vento por 8 bolas seguidas at\u00e9 dominar o tempo da bola no ar.","variacaoDificil":"Trocar de lado da quadra a cada 3 pontos ajustando imediatamente a t\u00e1tica de bloqueio no vento.","paraTurma":"Em turmas de 4 a 12 alunos, posicione duplas dos dois lados da rede simultaneamente: um lado treina o bloqueio de invas\u00e3o (bola trazida pelo vento) e o outro treina o bloqueio alto ca\u00e7ador de lobs.","meta":"Conseguir 6 de 10 a\u00e7\u00f5es positivas de bloqueio (bloqueio direto ou amortecimento) nos dois lados do vento sem tocar na rede.","descricaoDiagrama":"Quadra 16x8m vista de cima com indicador de Vento Forte. No topo, vento sopra das costas de A1 jogando o levantamento na fita (seta 1a) e B1 invade fundo ('telhado'). Embaixo, vento sopra contra A1 freando o lob (seta 1b) e B1 sobe alto ca\u00e7ando a bola parada no vento sobre a rede.","codigo":"BLQ-AVA-141"},{"numero":142,"secao":8,"nome":"Bloqueio + Defesa + Contra-ataque: fechando a paralela com transi\u00e7\u00e3o imediata","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (B1 + D1 contra A1 + L1)","tempo":"11 minutos","material":"5 bolas e 1 zona alvo de levantamento BLOQUEIO LINHA ZONA 2m A1 B1 D1 1 2","objetivo":"Encadear o salto de bloqueio na paralela com a defesa do parceiro na diagonal e a sa\u00edda imediata do bloqueador da rede para levantar e virar o contra-ataque.","comoMontar":"Dupla A1 + L1 na meia-quadra esquerda; B1 na rede direita (fechando a paralela) e D1 no fundo da diagonal direita. Zona Alvo de levantamento de transi\u00e7\u00e3o no centro da quadra direita (a 2m da rede).","passoAPasso":["D1 saca em A1; B1 mostra 1 dedo no sinal (fechando a paralela) e D1 fecha a diagonal.","L1 levanta na ponta para A1; B1 desloca-se, estanca os p\u00e9s e salta trancando 100% do corredor da paralela.","Como a paralela est\u00e1 fechada por B1, A1 \u00e9 for\u00e7ado a atacar na diagonal onde D1 j\u00e1 est\u00e1 plantado esperando.","D1 defende o ataque de A1 subindo a bola alta no centro da quadra (Zona Alvo a 2m da rede).","Transi\u00e7\u00e3o imediata de B1: no exato milissegundo em que os p\u00e9s de B1 tocam a areia na descida do bloqueio, B1 gira o pesco\u00e7o para dentro da sua quadra, sai da rede em 2 passos at\u00e9 a Zona Alvo, para os p\u00e9s e levanta (de toque ou manchete) para D1 entrar e cravar o contra-ataque!"],"pontosAtencao":["O trabalho do bloqueador na praia N\u00c3O termina quando a bola passa por ele: se a bola passou pelo seu bloqueio para o seu defensor, voc\u00ea acaba de virar o LEVANTADOR da dupla!","Nunca caia do bloqueio olhando para o atacante advers\u00e1rio e reclamando que quase pegou a bola: aterrisse j\u00e1 girando os ombros para o centro da sua quadra.","Levante a bola de transi\u00e7\u00e3o na ponta de onde o seu defensor D1 j\u00e1 est\u00e1 vindo (n\u00e3o cruze a bola para o lado oposto fazendo D1 correr o dobro na areia)."],"erroComum":"B1 continuar colado na fita da rede ap\u00f3s o salto de bloqueio e ter que levantar a bola de costas/correndo quando a defesa de D1 sobe aos 3 metros; corrija obrigando B1 a dar 2 passos para dentro da quadra assim que aterrissar. Varia\u00e7\u00f5es","variacaoFacil":"A1 ataca com 75% de pot\u00eancia na diagonal de D1 para garantir a defesa e treinar a transi\u00e7\u00e3o de B1.","variacaoDificil":"A1 pode tentar explorar a paralela de B1, largar curto atr\u00e1s de B1 ou bater na diagonal de D1 em ritmo real de jogo.","paraTurma":"Em turmas de 4 a 12 alunos, jogue s\u00e9ries de 4 bolas por dupla: a dupla de defesa soma 1 ponto pelo bloqueio direto e 2 pontos quando B1 fecha a linha, D1 defende na diagonal, B1 levanta e D1 mata o contra-ataque.","meta":"Completar 6 de 10 sequ\u00eancias completas de Bloqueio de linha + Defesa de diagonal + Levantamento de B1 + Contra-ataque de D1.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 ataca da esquerda na diagonal (seta 1) fugindo da sombra de bloqueio de B1 na paralela. D1 defende na diagonal enviando a bola para a Zona Alvo central aos 2m (seta 2). B1 aterrissa do bloqueio e sai da rede at\u00e9 o centro (seta tracejada 1), levanta para a direita (seta 3) e D1 avan\u00e7a (seta tracejada 2) finalizando o contra-ataque (seta 4).","codigo":"BLQ-AVA-142"},{"numero":143,"secao":8,"nome":"Bloqueio + Defesa + Contra-ataque: reconstru\u00e7\u00e3o ap\u00f3s toque no bloco ('\u00c9 dois!')","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (B1 + D1 contra A1 + L1)","tempo":"11 minutos","material":"5 bolas A1 B1 D1 1 2 1 3 2","objetivo":"Dominar as duas formas de reconstruir o contra-ataque quando a bola raspa no bloqueio (1\u00ba toque): ou o defensor levanta no 2\u00ba toque para o bloqueador atacar, ou o bloqueador levanta no 2\u00ba toque para o defensor atacar.","comoMontar":"Dupla A1 + L1 na esquerda; B1 na r
