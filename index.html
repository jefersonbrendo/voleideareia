 receptor escolhido desloca-se na areia, planta os p\u00e9s e envia a recep\u00e7\u00e3o alta para a zona central (entre 1,5m e 2m da rede).","O parceiro chega no centro, estabiliza a base e levanta na medida para o receptor fazer a aproxima\u00e7\u00e3o e finalizar o ataque fugindo de B1 rumo \u00e0s Zonas Alvo.","Ap\u00f3s 6 saques (3 em J1 e 3 em J2), as duas duplas invertem de fun\u00e7\u00e3o."],"pontosAtencao":["Como o saque agora vem com velocidade real da linha de 8m, o receptor precisa amortecer a bola para que o passe suba pelo menos 4 metros de altura.","O atacante deve manter a bola sempre entre ele e o levantador durante a corrida.","N\u00e3o tente matar todas as bolas para baixo: use o fundo da quadra e os cantos."],"erroComum":"Passar o saque r\u00e1pido e baixo demais ('passe chutado'), impedindo que o parceiro chegue a tempo na areia fofa; corrija validando o ponto apenas se a recep\u00e7\u00e3o subir acima do topo da antena. Varia\u00e7\u00f5es","variacaoFacil":"S1 saca avisando previamente em qual dos dois receptores vai direcionar a bola.","variacaoDificil":"S1 saca buscando a costura central ou as linhas laterais e entra r\u00e1pido para tentar defender o ataque.","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a rod\u00edzio de duplas a cada 4 saques recebidos: quem est\u00e1 fora aguarda atr\u00e1s da linha de saque j\u00e1 com bola na m\u00e3o para manter o treino sem pausas.","meta":"Virar 7 de 10 side-outs a partir de saque real acertando o ataque dentro das Zonas Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 saca da linha de fundo direita (8m, seta 1) para J2 na esquerda. J2 recepciona alto no centro (seta 2) enquanto J1 infiltra at\u00e9 a rede (seta tracejada 1). J1 levanta para a sa\u00edda direita (seta 3) e J2 avan\u00e7a (seta tracejada 2) atacando ao lado de B1 nas Zonas Alvo (seta 4).","codigo":"SDO-INI-168"},{"numero":169,"secao":10,"nome":"Side-out com recep\u00e7\u00e3o fora da zona (passe preso aos 4 e 5 metros)","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (Dupla J1 + J2 contra S1 + B1)","tempo":"10 minutos","material":"5 bolas, 2 cones e 2 zonas alvo no fundo J1 J2 B1 S1","objetivo":"Adaptar a corrida do levantador e o freio do atacante quando o saque advers\u00e1rio quebra o passe e a bola sobe longe da rede (aos 4,5 metros).","comoMontar":"Na meia-quadra esquerda, coloque 1 cone central a 4,5 metros da rede (onde a recep\u00e7\u00e3o dever\u00e1 subir). J1 e J2 a 6m da rede. No lado direito, S1 saca e B1 fica na rede com duas Zonas Alvo nos \u00faltimos 3 metros do fundo.","passoAPasso":["S1 saca forte em J1; J1 amortece a bola fazendo-a subir alta no cone de 4,5 metros da rede (simulando um passe que ficou preso no meio-fundo da quadra).","Ajuste do Levantador (J2): J2 N\u00c3O corre para a fita da rede! Ele l\u00ea o passe curto, corre direto para o cone de 4,5m, planta o p\u00e9 de tr\u00e1s e levanta em diagonal de dentro para fora tentando aproximar a bola at\u00e9 os 2m\u20132,5m da rede.","Ajuste do Atacante (J1): vendo que J2 vai levantar l\u00e1 dos 4,5m, J1 espera no fundo e freia a chamada mais longe da rede para n\u00e3o deixar a bola cair nas suas costas!","J1 salta aos 2,5m da rede e ataca com arco alto e topspin (ou lob/cut) mirando nas Zonas Alvo do fundo direito (enquanto B1 faz o 'pulling' saindo da rede).","Realizam 8 bolas e trocam de lado."],"pontosAtencao":["No v\u00f4lei de praia real, metade dos passes contra saques dif\u00edceis ficam a 3 ou 4 metros da rede: a dupla que n\u00e3o se desespera nessa bola vence o jogo!","O atacante nunca deve passar da linha onde est\u00e1 o levantador antes da bola sair da m\u00e3o dele.","Quando atacar uma bola que veio de tr\u00e1s (dos 4,5m), olhe para a bola um instante a mais e bata para a frente/alto com giro de punho."],"erroComum":"O atacante correr at\u00e9 a fita de 1 metro enquanto o parceiro est\u00e1 levantando l\u00e1 nos 4,5 metros, tendo que voltar de costas sem saltar; corrija gritando 'ESPERA ATR\u00c1S!' assim que o passe ficar curto. Varia\u00e7\u00f5es","variacaoFacil":"O professor lan\u00e7a a primeira bola direto no cone de 4,5m para J2 levantar e J1 ajustar a passada.","variacaoDificil":"Ponto disputado at\u00e9 o fim: B1 l\u00ea que o passe ficou aos 4,5m, retira da rede e defende junto com S1.","paraTurma":"Em turmas de 4 a 12 alunos, se o atacante conseguir transformar o passe dos 4,5m em ponto direto nas zonas de fundo, a dupla ganha 2 pontos; rod\u00edzio a cada 4 bolas.","meta":"Converter 6 de 10 side-outs com recep\u00e7\u00e3o aos 4,5 metros sem bater nenhuma bola na rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 saca forte (seta 1) em J1 (a 6m na esquerda). A recep\u00e7\u00e3o de J1 sobe presa no cone a 4,5m da rede (seta 2). J2 ajusta a corrida at\u00e9 os 4,5m (seta tracejada 1) e levanta em diagonal para os 2m (seta 3). J1 controla o avan\u00e7o (seta tracejada 2) e ataca no fundo direito (seta 4) enquanto B1 retira.","codigo":"SDO-INT-169"},{"numero":170,"secao":10,"nome":"Side-out com recep\u00e7\u00e3o espirrada na lateral (levantamento de ponta a ponta)","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (Dupla J1 + J2 contra S1 + D1)","tempo":"10 minutos","material":"5 bolas, 2 cones e 2 zonas alvo ZONA DIAGONAL J1 J2 D1 S1 1","objetivo":"Reorganizar o \u00e2ngulo de entrada do atacante quando o passe espirra para fora da linha lateral e o levantamento vem cruzando a quadra.","comoMontar":"Na meia-quadra esquerda, coloque 1 cone a 1 metro fora da linha lateral superior (aos 4m da rede). J1 (superior) e J2 (inferior) na recep\u00e7\u00e3o. No lado direito, S1 saca e D1 defende.","passoAPasso":["S1 saca aberto na linha lateral de J1; a recep\u00e7\u00e3o de J1 espirra para fora da quadra na dire\u00e7\u00e3o do cone lateral externo (ou J1 foi jogado l\u00e1 fora para passar).","J2 dispara do outro lado da quadra at\u00e9 o cone fora da linha lateral, planta o p\u00e9 externo e levanta alto de volta para dentro da quadra (a 2m da rede e 2m da lateral).","Reajuste do Atacante (J1): como J2 est\u00e1 levantando l\u00e1 da linha lateral ao lado dele, J1 d\u00e1 2 passos para DENTRO da quadra antes de virar para atacar (entrando de dentro para fora) ou pede uma bola longa cruzando para o outro lado!","J1 salta equilibrado longe da antena e ataca na diagonal ou paralela dentro da quadra direita.","Fazem 4 bolas espirradas na esquerda e 4 na direita; depois invertem as duplas."],"pontosAtencao":["Quando o seu parceiro vai levantar uma bola fora da linha lateral do SEU lado, saia da frente dele abrindo para o meio da quadra para ter espa\u00e7o de corrida!","O levantador nunca deve mandar essa bola colada na rede (1m) para ela n\u00e3o cruzar por cima da antena.","Ataque com seguran\u00e7a mirando do meio da quadra advers\u00e1ria para a diagonal."],"erroComum":"J1 e J2 ficarem amontoados no mesmo metro quadrado fora da linha lateral sem espa\u00e7o para levantar nem para saltar; corrija fazendo J1 correr para o centro da quadra assim que v\u00ea que seu passe fugiu para a lateral. Varia\u00e7\u00f5es","variacaoFacil":"O professor lan\u00e7a a bola no cone lateral externo enquanto J1 e J2 partem da base normal.","variacaoDificil":"J2 levanta do cone lateral externo atravessando 6 metros de largura at\u00e9 a antena oposta para J1 cruzar toda a quadra e bater.","paraTurma":"Em turmas de 4 a 12 alunos, coloque duas duplas trabalhando alternadamente no lado esquerdo contra a defesa do lado direito.","meta":"Salvar e converter em ataque v\u00e1lido pelo menos 6 de 10 recep\u00e7\u00f5es espirradas na lateral sem tocar na antena.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 saca aberto na lateral superior (seta 1); o passe de J1 escapa para o cone fora da quadra (seta 2). J2 corre at\u00e9 fora da lateral (seta tracejada 1) para levantar para dentro aos 2m (seta 3), enquanto J1 contorna pelo centro da quadra (seta tracejada 2) e ataca na direita (seta 4).","codigo":"SDO-INT-170"},{"numero":171,"secao":10,"nome":"Side-out contra bloqueio e defesa viva (leitura + chamada do levantador)","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (Dupla J1 + J2 contra Bloqueador B1 + Defensor D1)","tempo":"10 minutos","material":"5 bolas B1 FECHA LINHA J1 J2 B1 D1 1","objetivo":"Integrar a qualidade da recep\u00e7\u00e3o e do levantamento com a comunica\u00e7\u00e3o em tempo real ('Linha!', 'Diago!', 'Por cima!') contra um sistema defensivo real.","comoMontar":"Quadra oficial 16x8m em 2x2: J1 e J2 recebendo na esquerda; B1 na rede e D1 sacando/defendendo na direita.","passoAPasso":["Antes do saque de D1, B1 faz o sinal secreto nas costas (fechar linha, fechar diagonal ou retirar em falso bloqueio).","D1 saca firme; J1 (ou J2) recepciona no centro da quadra a 1,5m da rede.","Enquanto o parceiro levanta a bola, ele j\u00e1 levanta os olhos para ler o que B1 e D1 est\u00e3o fazendo do outro lado da rede.","Assim que a bola sobe no levantamento, o levantador grita a chamada t\u00e1tica clara para o seu atacante ('LINHA LIVRE!', 'CRUZADO CURTO!', 'SEM BLOCO, DOIS ATR\u00c1S!').","O atacante combina sua vis\u00e3o perif\u00e9rica com o grito do parceiro e finaliza o side-out; trocam a cada 6 saques."],"pontosAtencao":["No side-out de praia, o levantador \u00e9 os 'olhos' do atacante: uma chamada r\u00e1pida e certeira do levantador aumenta em 50% a chance de a bola cair no ch\u00e3o!","Se B1 retirou da rede ('Dois atr\u00e1s!'), avise imediatamente para o atacante n\u00e3o dar um lob inocente na m\u00e3o de quem retirou.","Varie o ritmo do levantamento (mais alto quando o passe foi longe, mais no ponto quando o passe veio na m\u00e3o)."],"erroComum":"O levantador ficar mudo ap\u00f3s levantar e o atacante bater exatamente onde o bloqueador B1 e o defensor D1 armaram a armadilha; corrija anulando o ponto de ataque se o levantador n\u00e3o cantar a leitura em voz alta. Varia\u00e7\u00f5es","variacaoFacil":"B1 e D1 assumem suas posi\u00e7\u00f5es finais cedo (logo ap\u00f3s o passe de J1) para facilitar a leitura visual e o grito.","variacaoDificil":"D1 aplica finta de 'Gato e Rato' no fundo, exigindo que o levantador fa\u00e7a duas chamadas ('Mostrou linha... FICOU NA LINHA, VAI DIAGO!').","paraTurma":"Em turmas de 4 a 12 alunos, jogue s\u00e9ries de 4 side-outs por dupla: se a dupla virar 3 de 4 com chamada verbal aud\u00edvel, permanece na quadra.","meta":"Virar 7 de 10 side-outs contra bloqueio e defesa viva com chamada t\u00e1tica em 100% das bolas.","descricaoDiagrama":"Quadra 16x8m vista de cima. D1 saca da direita (seta 1) e corre para a diagonal (seta tracejada 1) enquanto B1 fecha a paralela na rede. Na esquerda, J1 passa para o centro (seta 2), J2 infiltra e levanta (seta 3) gritando a leitura da quadra advers\u00e1ria, e J1 avan\u00e7a (seta tracejada 2) atacando no espa\u00e7o vazio (seta 4).","codigo":"SDO-INT-171"},{"numero":172,"secao":10,"nome":"Transi\u00e7\u00e3o b\u00e1sica da defesa para o contra-ataque (defender, abrir e atacar)","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (B1 + J1 na transi\u00e7\u00e3o de defesa contra A1 + L1)","tempo":"10 minutos","material":"5 bolas e 1 zona alvo de levantamento ZONA 2m A1 L1 B1 J1 1","objetivo":"Automatizar a regra n\u00famero 1 do contra-ataque na praia: quem defende a bola no fundo \u00e9 quem se recomp\u00f5e e corre para atacar!","comoMontar":"Na meia-quadra direita: B1 na rede (bloqueador) e J1 no fundo a 5,5m (defensor), com uma Zona Alvo de levantamento marcada no centro a 2m da rede. Na meia-quadra esquerda: A1 e L1 atacando.","passoAPasso":["L1 levanta para A1 na esquerda; B1 salta no bloqueio na rede direita.","A1 ataca na dire\u00e7\u00e3o de J1 aos 5,5 metros da rede.","Passo 1 (A Defesa Alta): J1 defende a bola subindo um arco alto (4,5m de altura) para a Zona Alvo central (aos 2m da rede) e grita 'SUBIU!'.","Passo 2 (Sa\u00edda da Rede do Bloqueador): B1 aterrissa do bloqueio, gira os ombros para dentro da quadra, corre at\u00e9 a Zona Alvo aos 2m e para os p\u00e9s para levantar.","Passo 3 (Abertura e Ataque do Defensor): imediatamente ap\u00f3s defender, J1 d\u00e1 1 passo abrindo em dire\u00e7\u00e3o \u00e0 linha lateral (para ganhar \u00e2ngulo de corrida), chama a bola ('AQUI NA PONTA!') e acelera para cravar o contra-ataque!"],"pontosAtencao":["Por que quem defendeu n\u00e3o corre em linha reta atr\u00e1s da pr\u00f3pria defesa?","Porque se voc\u00ea correr reto atr\u00e1s da bola que voc\u00ea mesmo subiu para o meio, voc\u00ea bate nas costas do seu levantador e fica sem \u00e2ngulo para ver a quadra!","D\u00ea 1 passo para FORA (para a linha lateral) e depois entre!","A altura da defesa \u00e9 o que garante o tempo da transi\u00e7\u00e3o: defesa baixa gera levantamento apressado.","B1 deve levantar para o corredor de onde J1 j\u00e1 est\u00e1 vindo."],"erroComum":"J1 defender a bola e ficar parado aos 5,5m esperando ver se B1 vai conseguir levantar para s\u00f3 depois come\u00e7ar a correr; corrija exigindo que o impulso p\u00f3s-defesa j\u00e1 seja o primeiro passo de transi\u00e7\u00e3o. Varia\u00e7\u00f5es","variacaoFacil":"A1 bate um ataque controlado na m\u00e3o de J1 para treinar o desenho perfeito da corrida de abertura e chamada.","variacaoDificil":"A1 ataca forte obrigando J1 a cair na areia na defesa, levantar r\u00e1pido e ainda chegar a tempo de atacar.","paraTurma":"Em turmas de 4 a 12 alunos, uma dupla ataca na esquerda e uma fila de duplas faz a transi\u00e7\u00e3o na direita (cada dupla faz 3 transi\u00e7\u00f5es completas e roda).","meta":"Completar 7 de 10 transi\u00e7\u00f5es de defesa para contra-ataque com chegada equilibrada do atacante na rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 ataca da esquerda (seta 1) para J1 a 5,5m na direita. J1 defende alto para a Zona Alvo aos 2m (seta 2). B1 sai do bloqueio na rede at\u00e9 os 2m (seta tracejada 1) e levanta na ponta (seta 3), enquanto J1 abre pela lateral e acelera (seta tracejada 2) finalizando o contra-ataque (seta 4).","codigo":"SDO-INT-172"},{"numero":173,"secao":10,"nome":"Transi\u00e7\u00e3o do bloqueador que sai da rede para atacar (ap\u00f3s toque no bloco ou defesa do parceiro)","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (B1 bloqueador/atacante + J1 defensor/levantador contra A1 + L1)","tempo":"10 minutos","material":"5 bolas e 1 cone de recuo na antena A1 B1 J1 1 2 1 3","objetivo":"Treinar a mec\u00e2nica de p\u00e9s do bloqueador quando ele precisa sair da fita da rede, recuar 2,5m at\u00e9 a antena e voltar saltando para atacar o contra-ataque.","comoMontar":"Na meia-quadra direita, B1 junto \u00e0 rede, J1 no fundo e 1 cone de transi\u00e7\u00e3o posicionado a 2,5 metros da rede junto \u00e0 linha lateral superior. A1 e L1 na meia-quadra esquerda.","passoAPasso":["Quando \u00e9 o BLOQUEADOR (B1) quem tem que atacar o contra-ataque na praia? Em duas situa\u00e7\u00f5es cl\u00e1ssicas: 1) Quando a bola tocou no bloqueio de B1 e sobrou para J1 levantar no 2\u00ba toque; ou 2) Quando J1 mergulhou t\u00e3o longe l\u00e1 fora da quadra no 1\u00ba toque que n\u00e3o consegue voltar para atacar e grita 'BATE VOC\u00ca!'!","A1 ataca e a bola raspa no bloqueio de B1 (ou J1 salva caindo longe no fundo).","Assim que B1 toca o ch\u00e3o ap\u00f3s o salto de bloqueio, J1 grita 'ABRE QUE EU LEVANTO!'.","B1 N\u00c3O fica colado na fita: ele abre o quadril e faz um recuo explosivo de 2 passadas em diagonal para tr\u00e1s at\u00e9 pisar no cone de 2,5 metros na linha lateral!","Do cone de 2,5m, B1 vira de frente e faz a chamada de 2 passos atacando o levantamento vindo de J1 l\u00e1 do fundo!"],"pontosAtencao":["Se o bloqueador n\u00e3o recuar pelo menos at\u00e9 os 2,5 metros da rede antes de tentar atacar, ele n\u00e3o tem dist\u00e2ncia para saltar e a bola levantada do fundo passa por cima da cabe\u00e7a dele!","Essa transi\u00e7\u00e3o 'Salta no bloco -> Recua em V at\u00e9 a antena -> Avan\u00e7a para bater' exige pernas r\u00e1pidas na areia.","Como o levantamento de J1 vem l\u00e1 do fundo da quadra, B1 deve esperar a bola cruzar a frente do seu ombro antes de bater."],"erroComum":"B1 descer do bloqueio e ficar parado a 50 cm da rede pedindo bola, conseguindo apenas empurrar a bola de ponta de dedo sem embalo; corrija obrigando B1 a tocar o p\u00e9 no cone de 2,5m antes de saltar para atacar. Varia\u00e7\u00f5es","variacaoFacil":"O professor lan\u00e7a a bola alta no fundo para J1 levantar enquanto B1 salta no bloqueio, recua ao cone de 2,5m e ataca.","variacaoDificil":"A1 varia entre uma bola que B1 amortece no bloco (B1 recua e ataca) e uma bola que passa limpa em J1 (B1 sai para levantar e J1 ataca).","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a 4 repeti\u00e7\u00f5es por dupla no lado direito: toda bola finalizada por B1 ap\u00f3s pisar no cone de recuo de 2,5m vale 2 pontos.","meta":"Executar 7 de 10 transi\u00e7\u00f5es de recuo do bloqueador at\u00e9 os 2,5m seguidas de ataque potente sobre a rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 ataca (seta 1) e a bola amortece no bloqueio de B1 indo para J1 no fundo direito (seta 2). B1 aterrissa na rede e recua r\u00e1pido at\u00e9 o cone lateral a 2,5m da rede (seta tracejada 1). J1 levanta do fundo no 2\u00ba toque (seta 3) e B1 avan\u00e7a do cone (seta tracejada 2) atacando no 3\u00ba toque (seta 4).","codigo":"SDO-INT-173"},{"numero":174,"secao":10,"nome":"Quebra de padr\u00e3o: invers\u00e3o de pap\u00e9is quando o bloqueador defende a 1\u00aa bola na rede","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (B1 + J1 contra A1 + L1)","tempo":"10 minutos","material":"5 bolas A1 B1 J1 1 2 1 2","objetivo":"Reagir instantaneamente quando o bloqueador retira ou amortece o 1\u00ba toque perto da rede, fazendo o jogador de fundo correr para levantar no 2\u00ba toque.","comoMontar":"A1 + L1 na meia-quadra esquerda; B1 na rede e J1 no fundo (a 5,5m) na meia-quadra direita.","passoAPasso":["No padr\u00e3o normal, J1 defende e B1 levanta. Mas o que acontece quando A1 larga uma bola curta ou bate em cima de B1 que estava retirando, e o PR\u00d3PRIO B1 d\u00e1 o 1\u00ba toque de defesa?!","A1 v\u00ea B1 iniciando a retirada (ou v\u00ea um buraco curto) e joga a bola em cima de B1 aos 2,5 metros da rede.","B1 reage no reflexo, defende a bola para o alto no centro da quadra (1\u00ba toque) e grita imediatamente: 'AJUDA! LEVANTA!'.","Gatilho de Invers\u00e3o: J1 (que estava l\u00e1 nos 5,5m esperando defender) v\u00ea que B1 deu o 1\u00ba toque e dispara em sprint m\u00e1ximo do fundo at\u00e9 a rede para fazer o LEVANTAMENTO (2\u00ba toque)!","Enquanto J1 corre para levantar, B1 se levanta da areia, abre 2 passos para a lateral e ATACA a bola no 3\u00ba toque!"],"pontosAtencao":["Essa 'quebra de padr\u00e3o' pega muitas duplas de surpresa: se J1 ficar congelado no fundo olhando B1 defender a primeira bola na frente, ningu\u00e9m chega para dar o segundo toque e a bola cai!","Para B1: quando voc\u00ea der o 1\u00ba toque de defesa perto da rede, jogue a bola BEM ALTA (5 metros) porque o seu parceiro J1 vem correndo l\u00e1 dos 5,5 metros!","Lembrete da regra: se a bola bateu em B1 dentro da a\u00e7\u00e3o de bloqueio no alto da rede, o pr\u00f3prio B1 pode dar o 2\u00ba toque; mas se B1 j\u00e1 tinha sa\u00eddo do bloqueio e defendeu a bola aos 2,5m, ele N\u00c3O pode tocar duas vezes seguidas \u2014 J1 tem que vir levantar!"],"erroComum":"B1 defender a bola aos 2,5m fora da a\u00e7\u00e3o de bloqueio e dar um segundo toque seguido por instinto (cometendo falta de dois toques), ou a bola cair porque J1 n\u00e3o correu; corrija treinando o grito instant\u00e2neo 'LEVANTA VOC\u00ca!'. Varia\u00e7\u00f5es","variacaoFacil":"A1 joga todas as bolas curtas aos 2,5m na dire\u00e7\u00e3o de B1 para automatizar a corrida de J1 do fundo para levantar.","variacaoDificil":"A1 escolhe livremente entre bater em J1 no fundo (padr\u00e3o normal) ou jogar em B1 aos 2,5m (quebra de padr\u00e3o com invers\u00e3o).","paraTurma":"Em turmas de 4 a 12 alunos, jogue baterias de 5 bolas: a dupla defensora precisa identificar na hora quem deu o 1\u00ba contato e organizar o contra-ataque sem hesita\u00e7\u00e3o.","meta":"Resolver 7 de 10 quebras de padr\u00e3o com infiltra\u00e7\u00e3o r\u00e1pida de J1 e finaliza\u00e7\u00e3o de ataque de B1.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 envia bola curta/meia-altura em cima de B1 que retirava aos 2,5m (seta 1). B1 defende no 1\u00ba toque subindo a bola alta no centro (seta 2) e abre para a ponta (seta tracejada 2), enquanto J1 dispara do fundo aos 5,5m at\u00e9 a rede (seta tracejada 1) para levantar no 2\u00ba toque (seta 3) e B1 atacar (seta 4).","codigo":"SDO-AVA-174"},{"numero":175,"secao":10,"nome":"Transi\u00e7\u00e3o rel\u00e2mpago ap\u00f3s defesa de bola curta (com op\u00e7\u00e3o de ataque de 2\u00aa bola)","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (B1 + J1 contra A1 + L1)","tempo":"10 minutos","material":"5 bolas A1 B1 J1 1 1 2 3a 3b","objetivo":"Transformar uma largada curta advers\u00e1ria que obrigou o defensor a correr at\u00e9 a rede em um contra-ataque r\u00e1pido de segunda bola ou levantamento curto.","comoMontar":"A1 + L1 na meia-quadra esquerda; B1 na rede e J1 a 5m na meia-quadra direita.","passoAPasso":["Quando A1 aplica um 'poke' ou 'cut shot' curto e J1 corre at\u00e9 a frente para salvar a bola a 1,5 metro da rede, os dois jogadores (B1 e J1) terminam juntos colados na rede!","Se a defesa de J1 na bola curta subir alta e pr\u00f3xima \u00e0 fita (entre 1m e 1,5m da rede), B1 (que acabou de descer do bloqueio ao lado da bola) tem duas op\u00e7\u00f5es letais:","Op\u00e7\u00e3o 1 (Ataque de Segunda Bola de Transi\u00e7\u00e3o): como A1 e L1 ainda est\u00e3o saindo do salto de ataque l\u00e1 do outro lado, B1 grita 'DEIXA!' e j\u00e1 ataca a bola de segunda no espa\u00e7o vazio!","Op\u00e7\u00e3o 2 (Levantamento Curto / Chutado): se a defesa advers\u00e1ria j\u00e1 recuou esperando a bola de segunda, B1 levanta uma bola curta a 1 metro de dist\u00e2ncia para J1 (que j\u00e1 est\u00e1 na rede) saltar em 1 passo e cravar!","Executam 8 bolas curtas alternando entre o ataque de segunda de B1 e a bola r\u00e1pida para J1."],"pontosAtencao":["O contra-ataque de segunda bola ap\u00f3s uma defesa perto da rede \u00e9 devastador na praia porque o atacante advers\u00e1rio que largou a bola curta ainda est\u00e1 no ch\u00e3o junto \u00e0 rede!","Para permitir o ataque de segunda de B1, J1 precisa controlar o toque na defesa da bola curta para que ela suba limpa a 1,5m da fita.","Se J1 continuar correndo depois de salvar a curta, cuidado para n\u00e3o esbarrar em B1 nem pisar na linha/rede."],"erroComum":"Desperdi\u00e7ar uma defesa que subiu perfeita na m\u00e3o de B1 junto \u00e0 rede fazendo um levantamento lento l\u00e1 para a antena enquanto J1 j\u00e1 estava no meio da rede; corrija mantendo o jogo curto e r\u00e1pido quando ambos est\u00e3o na frente. Varia\u00e7\u00f5es","variacaoFacil":"A1 lan\u00e7a a bola curta aos 2m para J1 defender na m\u00e3o de B1 e B1 atacar de segunda.","variacaoDificil":"A1, ap\u00f3s largar a bola curta, tenta bloquear B1 na rede caso B1 tente passar de segunda!","paraTurma":"Em turmas de 4 a 12 alunos, d\u00ea 2 pontos para o contra-ataque normal de 3 toques na bola curta e 3 pontos quando B1 matar de segunda bola pegando o advers\u00e1rio no contrap\u00e9.","meta":"Converter 7 de 10 transi\u00e7\u00f5es de bola curta (usando 2\u00aa bola de B1 ou ataque curto de J1).","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 larga curto aos 2m da rede direita (seta 1). J1 avan\u00e7a r\u00e1pido dos 5m at\u00e9 os 2m (seta tracejada 1) e sobe a defesa perto da rede (seta 2). B1 na rede aproveita a bola na m\u00e3o para: ou atacar de 2\u00aa bola direto no fundo (seta 3a), ou levantar curto (seta 3b) para J1 finalizar ao lado (seta 4).","codigo":"SDO-AVA-175"},{"numero":176,"secao":10,"nome":"Desafio dos '5 Side-outs em Linha' (consist\u00eancia m\u00e1xima sob press\u00e3o)","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Dupla J1 + J2 no side-out contra S1 + B1)","tempo":"11 minutos","material":"6 bolas J1 J2 B1 S1 1a 1b 1c","objetivo":"Treinar a regularidade mental e t\u00e9cnica para virar 5 bolas seguidas sem cometer erros n\u00e3o for\u00e7ados, mesmo quando o sacador muda de estrat\u00e9gia.","comoMontar":"Dupla J1 e J2 na meia-quadra esquerda (recebendo todos os saques); Dupla S1 e B1 na meia-quadra direita (sacando, bloqueando e defendendo).","passoAPasso":["Objetivo: Treinar a regularidade mental e t\u00e9cnica para virar 5 bolas seguidas sem cometer erros n\u00e3o for\u00e7ados, mesmo quando o sacador muda de estrat\u00e9gia. Como montar na areia Dupla J1 e J2 na meia-quadra esquerda (recebendo todos os saques); Dupla S1 e B1 na meia-quadra direita (sacando, bloqueando e defendendo). Passo a passo Pontos de aten\u00e7\u00e3o Erro comum e corre\u00e7\u00e3o: No 4\u00ba side-out seguido, ficar ansioso para acabar logo, acelerar a corrida de ataque antes do levantamento e bater na fita; corrija exigindo um 'toque de m\u00e3os' e 3 segundos de conversa da dupla antes da 4\u00aa e 5\u00aa bolas. Varia\u00e7\u00f5es MAIS F\u00c1CIL Meta reduzida para 3 side-outs seguidos (ou permitir '1 vida extra' onde o primeiro erro apenas congela a contagem sem zerar). MAIS DIF\u00cdCIL Para fechar o 5\u00ba e \u00faltimo side-out da sequ\u00eancia, o ponto S\u00d3 vale se for finalizado com um golpe colocado (cut shot, lob ou poke) na areia! Para aplicar em turma Em turmas de 4 a 12 alunos, coloque 2 duplas revezando no saque/defesa (lado direito) para manter a intensidade m\u00e1xima tentando quebrar a sequ\u00eancia da dupla que est\u00e1 buscando os 5 em linha no lado esquerdo. Meta: Completar a sequ\u00eancia de 5 side-outs consecutivos em no m\u00e1ximo 2 s\u00e9ries de tentativa. Miss\u00e3o da Dupla J1 + J2: eles precisam conquistar 5 side- outs SEGUIDOS (5 pontos virados em sequ\u00eancia) para vencer a s\u00e9rie!","Regra de Press\u00e3o: se J1 e J2 estiverem com 3 ou 4 side- outs seguidos acumulados e errarem 1 ataque ou sofrerem 1 ponto de contra-ataque de S1/B1, o contador ZERA e eles voltam para o 0!","Restri\u00e7\u00e3o de distribui\u00e7\u00e3o: nos 5 saques da sequ\u00eancia, S1 \u00e9 obrigado a sacar pelo menos 2 vezes em J1, 2 vezes em J2 e 1 vez na costura central.","Se J1 e J2 precisarem de uma segunda tentativa no mesmo rally (porque S1 defendeu o primeiro ataque) e mesmo assim vencerem o ponto, a sequ\u00eancia continua viva!","Assim que batem os 5 seguidos (ou ap\u00f3s 8 minutos), invertem os lados."],"pontosAtencao":["O que essa press\u00e3o de 'zerar no 4\u00ba ponto' ensina na quadra?","Ensina que quando voc\u00ea precisa fechar uma sequ\u00eancia na praia, voc\u00ea N\u00c3O arrisca uma bola na linha a 100 km/h: voc\u00ea passa alto no meio e usa o seu golpe de maior porcentagem de acerto!","Se o primeiro ataque for defendido por S1, n\u00e3o entre em p\u00e2nico: fa\u00e7am a transi\u00e7\u00e3o de bloqueio e defesa e matem na segunda bola.","Respirem juntos antes do 4\u00ba e do 5\u00ba saque."],"erroComum":"No 4\u00ba side-out seguido, ficar ansioso para acabar logo, acelerar a corrida de ataque antes do levantamento e bater na fita; corrija exigindo um 'toque de m\u00e3os' e 3 segundos de conversa da dupla antes da 4\u00aa e 5\u00aa bolas. Varia\u00e7\u00f5es","variacaoFacil":"Meta reduzida para 3 side-outs seguidos (ou permitir '1 vida extra' onde o primeiro erro apenas congela a contagem sem zerar).","variacaoDificil":"Para fechar o 5\u00ba e \u00faltimo side-out da sequ\u00eancia, o ponto S\u00d3 vale se for finalizado com um golpe colocado (cut shot, lob ou poke) na areia!","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 duplas revezando no saque/defesa (lado direito) para manter a intensidade m\u00e1xima tentando quebrar a sequ\u00eancia da dupla que est\u00e1 buscando os 5 em linha no lado esquerdo. Meta: Completar a sequ\u00eancia de 5 side-outs consecutivos em no m\u00e1ximo 2 s\u00e9ries de tentativa. Miss\u00e3o da Dupla J1 + J2: eles precisam conquistar 5 side- outs SEGUIDOS (5 pontos virados em sequ\u00eancia) para vencer a s\u00e9rie! 1 Regra de Press\u00e3o: se J1 e J2 estiverem com 3 ou 4 side- outs seguidos acumulados e errarem 1 ataque ou sofrerem 1 ponto de contra-ataque de S1/B1, o contador ZERA e eles voltam para o 0! 2 Restri\u00e7\u00e3o de distribui\u00e7\u00e3o: nos 5 saques da sequ\u00eancia, S1 \u00e9 obrigado a sacar pelo menos 2 vezes em J1, 2 vezes em J2 e 1 vez na costura central. 3 Se J1 e J2 precisarem de uma segunda tentativa no mesmo rally (porque S1 defendeu o primeiro ataque) e mesmo assim vencerem o ponto, a sequ\u00eancia continua viva! 4 Assim que batem os 5 seguidos (ou ap\u00f3s 8 minutos), invertem os lados. 5 O que essa press\u00e3o de 'zerar no 4\u00ba ponto' ensina na quadra? Ensina que quando voc\u00ea precisa fechar uma sequ\u00eancia na praia, voc\u00ea N\u00c3O arrisca uma bola na linha a 100 km/h: voc\u00ea passa alto no meio e usa o seu golpe de maior porcentagem de acerto! Se o primeiro ataque for defendido por S1, n\u00e3o entre em p\u00e2nico: fa\u00e7am a transi\u00e7\u00e3o de bloqueio e defesa e matem na segunda bola. Respirem juntos antes do 4\u00ba e do 5\u00ba saque. Guia de Treinos \u2022 V\u00f4lei de Praia 193","meta":"Virar 5 Side-outs seguidos (Erro zera a contagem!) Quadra 16x8m vista de cima. S1 e B1 na direita enviam bateria de 5 saques variados (setas 1a em J1, 1b na costura e 1c em J2). Na esquerda, J1 e J2 mant\u00eam o padr\u00e3o de passe no centro (seta 2), levantamento preciso (seta 3) e ataques de alta seguran\u00e7a (setas 4) para fechar 5/5 sem zerar o placar.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 e B1 na direita enviam bateria de 5 saques variados (setas 1a em J1, 1b na costura e 1c em J2). Na esquerda, J1 e J2 mant\u00eam o padr\u00e3o de passe no centro (seta 2), levantamento preciso (seta 3) e ataques de alta seguran\u00e7a (setas 4) para fechar 5/5 sem zerar o placar.","codigo":"SDO-AVA-176"},{"numero":177,"secao":10,"nome":"Side-out e transi\u00e7\u00e3o com 'Bingo de Zonas' (vencer nos 3 setores da quadra)","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (2 contra 2 em quadra completa)","tempo":"11 minutos","material":"5 bolas e 6 cones demarcando 3 setores SETOR 1 (0-3m) SETOR 2 (3-6m) SETOR 3 (6-8m) J1 J2 B1 D1 1","objetivo":"For\u00e7ar a dupla a variar o repert\u00f3rio de ataque tanto no side-out quanto na transi\u00e7\u00e3o, proibindo o atacante de repetir o mesmo golpe toda hora.","comoMontar":"Divida a meia-quadra direita em 3 Setores com cones nas laterais: Setor 1 (Curto: da rede at\u00e9 3m), Setor 2 (Diagonal M\u00e9dia/Lateral: dos 3m aos 6m) e Setor 3 (Fundo: dos 6m aos 8m). J1 e J2 na esquerda; B1 e D1 na direita.","passoAPasso":["Para vencer uma rodada do 'Bingo da Areia', a dupla J1 + J2 precisa marcar pelo menos 1 ponto fazendo a bola cair na areia em CADA UM dos 3 setores (Setor 1 Curto + Setor 2 Diagonal/Meio + Setor 3 Fundo) E ainda marcar 1 ponto de Contra-ataque ap\u00f3s defender!","D1 saca e o rally corre livre valendo tudo.","Se J1 matar o primeiro side-out com um cut shot no Setor 1 (Curto), o Setor 1 j\u00e1 est\u00e1 'ticado/completo': se ele matar outra bola no Setor 1 depois, vale a posse mas n\u00e3o preenche os Setores 2 e 3 que faltam!","Nos \u00faltimos pontos, B1 e D1 j\u00e1 sabem qual \u00e9 o \u00fanico setor que falta para J1 e J2 fecharem o Bingo e v\u00e3o tentar proteger aquela zona com tudo, exigindo execu\u00e7\u00e3o perfeita de J1/J2!","Quem completar os 3 setores + 1 transi\u00e7\u00e3o primeiro vence o set."],"pontosAtencao":["Esse exerc\u00edcio cura o v\u00edcio de jogadores que s\u00f3 sabem bater diagonal forte ou s\u00f3 sabem largar curto: voc\u00ea \u00e9 obrigado a ler a defesa e usar os 8 metros inteiros de profundidade da quadra!","Quando faltar apenas o Setor 3 (Fundo) e o defensor D1 j\u00e1 estiver recuado l\u00e1 atr\u00e1s esperando, use a velocidade da batida na linha ou explore a m\u00e3o alta do bloqueio para o fundo.","Para conquistar o ponto obrigat\u00f3rio de transi\u00e7\u00e3o, caprichem no bloqueio e na defesa quando virarem o saque."],"erroComum":"Tentar for\u00e7ar o setor que falta a partir de um levantamento horr\u00edvel longe da rede; corrija ensinando a manter a bola viva em seguran\u00e7a primeiro e atacar o setor alvo na bola boa seguinte. Varia\u00e7\u00f5es","variacaoFacil":"Contar apenas o toque da bola no setor mesmo que o defensor D1 consiga tocar nela com dificuldade.","variacaoDificil":"Exigir que TANTO J1 QUANTO J2 preencham individualmente os 3 setores cada um (total de 6 zonas carimbadas pela dupla).","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a um painel na areia (risco para cada dupla): as duplas entram a cada 2 pontos e v\u00e3o riscando na areia seus setores conquistados at\u00e9 uma dupla gritar 'BINGO!'.","meta":"Completar os 4 requisitos (Setor 1 + Setor 2 + Setor 3 + 1 Ponto de Transi\u00e7\u00e3o) em menos de 10 saques.","descricaoDiagrama":"Quadra 16x8m vista de cima. A meia-quadra direita est\u00e1 dividida em 3 faixas alvo: Setor 1 Curto (0\u20133m), Setor 2 M\u00e9dio/Diagonal (3\u20136m) e Setor 3 Fundo (6\u20138m), defendidos por B1 e D1. Na esquerda, J1 e J2 constroem o side-out (setas 1, 2 e 3) e atacam buscando carimbar cada um dos 3 setores (setas 4a, 4b e 4c).","codigo":"SDO-AVA-177"},{"numero":178,"secao":10,"nome":"Jogo de 'Wash' cl\u00e1ssico (Side-out + Bola de Transi\u00e7\u00e3o para validar o ponto)","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (2 contra 2 + professor ou fila lan\u00e7ando a 2\u00aa bola)","tempo":"12 minutos","material":"8 bolas J1 J1 J2 B1 D1 1","objetivo":"Condicionar a dupla a nunca relaxar ap\u00f3s virar o side-out, encadeando imediatamente uma defesa e um contra-ataque para conquistar 1 ponto real no placar.","comoMontar":"Quadra oficial 16x8m: Dupla A (J1 + J2) na esquerda recebendo; Dupla B (B1 + D1) na direita sacando. Cesto de bolas ao lado do poste da rede.","passoAPasso":["Como funciona o famoso sistema 'WASH' do treinamento de elite do v\u00f4lei de praia? Nenhum ponto vale sozinho! Para ganhar 1 PONTO GRANDE no placar, a dupla precisa vencer DUAS bolas seguidas (o Side-out + a Transi\u00e7\u00e3o)!","Bola 1 (Side-out): D1 saca na Dupla A (J1 + J2). Eles jogam o ponto at\u00e9 o fim.","Se a Dupla B (que sacou) vencer o rally da Bola 1, a Dupla B j\u00e1 recebe uma bola lan\u00e7ada na sua quadra para atacar e, se vencer de novo, ganha 1 Ponto Grande!","Se a Dupla A (que recebeu) virar o Side-out na Bola 1, eles ainda N\u00c3O ganharam o ponto: no mesmo segundo, o treinador (ou o pr\u00f3prio D1) bate/lan\u00e7a uma Bola 2 de ataque contra a defesa de J1 e J2!","J1 e J2 precisam se posicionar r\u00e1pido em bloqueio/defesa, defender a Bola 2, levantar e matar o contra-ataque para confirmar o seu 1 Ponto Grande (se perderem a Bola 2, d\u00e1 'Wash' = empate, 0 ponto para ningu\u00e9m, e troca o saque!)."],"pontosAtencao":["Por que o treino de 'Wash' \u00e9 o favorito dos treinadores de praia?","Porque no jogo real, s\u00f3 virar side-out empata o jogo at\u00e9 21x21; quem ganha campeonatos \u00e9 quem vira o side-out E logo em seguida defende uma bola na transi\u00e7\u00e3o!","Assim que a Bola 1 cair no ch\u00e3o dando o side-out para voc\u00ea, N\u00c3O comemore parado: um jogador j\u00e1 cola na rede para bloquear e o outro j\u00e1 recua aos 5,5m esperando a Bola 2!","Se der 'Wash' (um ganhou a Bola 1 e o outro ganhou a Bola 2), ningu\u00e9m pontua e a press\u00e3o sobe."],"erroComum":"Virar um side-out lindo na Bola 1, relaxar a postura respirando fundo e levar a Bola 2 nas costas perdendo o ponto; corrija lan\u00e7ando a Bola 2 exatamente 2 segundos ap\u00f3s a Bola 1 tocar a areia. Varia\u00e7\u00f5es","variacaoFacil":"A Bola 2 \u00e9 enviada como uma 'bola de gra\u00e7a' alta por cima da rede para J1 e J2 organizarem a transi\u00e7\u00e3o com mais facilidade.","variacaoDificil":"A Bola 2 \u00e9 batida forte sobre um caixote pelo treinador nos cantos da quadra de quem acabou de virar o side-out.","paraTurma":"Em turmas de 4 a 12 alunos, jogue at\u00e9 5 Pontos Grandes (o que equivale a pelo menos 10 a 15 rallies intensos). Os alunos da fila de fora s\u00e3o respons\u00e1veis por bater a Bola 2 imediatamente ap\u00f3s a Bola 1.","meta":"Confirmar pelo menos 4 'Pontos Grandes' (vencendo Bola 1 de Side-out + Bola 2 de Transi\u00e7\u00e3o seguidas).","descricaoDiagrama":"Quadra 16x8m vista de cima no sistema Wash. Na Bola 1: D1 saca (seta 1), J1 passa (2), J2 levanta (3) e J1 mata o side-out (4). Imediatamente entra a Bola 2 de Transi\u00e7\u00e3o batida do outro lado (seta 5): J2 j\u00e1 subiu no bloqueio, J1 defende no fundo (seta 6), J2 sai da rede para levantar (7) e J1 fecha o Ponto Grande (8).","codigo":"SDO-AVA-178"},{"numero":179,"secao":10,"nome":"Maratona de Pontua\u00e7\u00e3o Tripla (Side-out + Defesa de Forte + Defesa de Curta/Lob)","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (2 contra 2 + lan\u00e7ador/treinador com cesto de bolas)","tempo":"12 minutos","material":"10 bolas J1 J2 J1/J2 B1 D1 1","objetivo":"Suportar um rally triplo de alt\u00edssima exig\u00eancia f\u00edsica na areia fofa, mantendo a qualidade t\u00e9cnica do levantamento e do ataque at\u00e9 a 3\u00aa bola.","comoMontar":"Dupla A (J1 + J2) na meia-quadra esquerda; Dupla B (B1 + D1) na meia-quadra direita. Treinador (ou 3\u00aa dupla) na lateral direita com bolas.","passoAPasso":["Cada entrada da Dupla A consiste em uma sequ\u00eancia ininterrupta de 3 bolas valendo at\u00e9 3 pontos:","Bola 1 (Side-out Oficial - vale 1 pt): D1 saca da linha de 8m; J1 e J2 precisam recepcionar, levantar e virar o ataque contra B1 e D1.","Bola 2 (Transi\u00e7\u00e3o de Pancada - vale 1 pt): no instante em que a Bola 1 termina, o treinador bate uma cortada forte no fundo da quadra esquerda; J1 (ou J2) amortece na defesa, o parceiro sai da rede para levantar e eles atacam contra B1 e D1!","Bola 3 (Transi\u00e7\u00e3o de Bola Curta ou Lob - vale 1 pt): assim que a Bola 2 termina, o treinador solta um pingo curto aos 2m da rede (ou um lob aos 8m); a dupla d\u00e1 o \u00faltimo g\u00e1s na areia, salva no peixinho, levanta alto e finaliza o 3\u00ba ataque!","Se a Dupla A vencer as 3 bolas da s\u00e9rie ('3 de 3'), ganha +1 ponto b\u00f4nus (total 4 pontos); depois invertem os lados."],"pontosAtencao":["Entre a Bola 1 e a Bola 2, quem atacou na rede (ex.: J1) J\u00c1 FICA NA REDE como bloqueador, e quem levantou (J2) j\u00e1 recua para defender no fundo!","N\u00e3o troquem de lugar \u00e0 toa gastando perna na areia!","Na Bola 3, com o pulm\u00e3o queimando, a regra \u00e9: defesa a 5 metros de altura no centro da quadra para dar tempo ao parceiro.","Na \u00faltima batida sob fadiga, priorize o golpe de t\u00e9cnica (cut shot na diagonal ou cobra no fundo) em vez de pular baixo e bater na fita."],"erroComum":"Quem acabou de atacar a Bola 1 na rede querer voltar correndo para o fundo mientras o parceiro que estava no meio corre para a rede, cruzando no caminho e levando a Bola 2 sem ningu\u00e9m no fundo; corrija com a regra: 'Atacou na rede, vira bloqueador na hora!'. Varia\u00e7\u00f5es","variacaoFacil":"Dar 4 segundos entre cada bola da trinca para a dupla se reposicionar na base.","variacaoDificil":"A Dupla A S\u00d3 marca os pontos da rodada se vencer pelo menos 2 das 3 bolas (se fizer apenas 1 de 3, zera a rodada).","paraTurma":"Em turmas de 4 a 12 alunos, rod\u00edzio de duplas a cada trinca completa: enquanto uma dupla faz as 3 bolas na esquerda, a dupla seguinte j\u00e1 descansa na linha de fundo pronta para entrar.","meta":"Conquistar pelo menos 2 pontos por trinca em 80% das s\u00e9ries e alcan\u00e7ar pelo menos um '3 de 3' perfeito.","descricaoDiagrama":"Quadra 16x8m vista de cima. Trinca cont\u00ednua sobre J1 e J2 na esquerda contra B1 e D1 na direita: Bola 1 \u00e9 o saque real de D1 (seta 1); Bola 2 \u00e9 a pancada enviada no fundo (seta 2); Bola 3 \u00e9 a largada curta aos 2m (seta 3). Em cada uma, J1 e J2 defendem, levantam no centro e contra-atacam (setas 4).","codigo":"SDO-AVA-179"},{"numero":180,"secao":10,"nome":"Cen\u00e1rio de Fim de Set (19x20): Side-out de sobreviv\u00eancia e contra-ataque do t\u00edtulo","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Jogo 2x2 com placar simulado de press\u00e3o)","tempo":"12 minutos","material":"5 bolas J1 J1 J2 B1 D1 1 2","objetivo":"Treinar a tomada de decis\u00e3o emocional e t\u00e1tica nos dois momentos mais tensos de uma partida: salvar um Set Point no side-out e virar o jogo na transi\u00e7\u00e3o.","comoMontar":"Quadra oficial 16x8m: Dupla A (J1 + J2) come\u00e7a no lado esquerdo perdendo o set por 19 x 20 (recebendo o saque); Dupla B (B1 + D1) come\u00e7a no lado direito vencendo por 20 x 19 (com o saque na m\u00e3o para fechar o jogo).","passoAPasso":["O placar come\u00e7a sempre em 19 x 20 contra a dupla receptora (Dupla A).","Momento 1 (Side-out de Sobreviv\u00eancia no 19x20): a Dupla B saca com tudo para fechar o set; a Dupla A tem a obriga\u00e7\u00e3o de manter a cabe\u00e7a fria, passar na zona de seguran\u00e7a e virar o side-out para empatar em 20 x 20!","Momento 2 (A Transi\u00e7\u00e3o da Virada no 20x20): se a Dupla A empatou em 20x20, agora o saque passa para a m\u00e3o da Dupla A! A Dupla A precisa combinar o sinal de bloqueio, sacar taticamente, defender o ataque da Dupla B e matar o contra-ataque para fazer 21 x 20!","Momento 3 (Fechando na Diferen\u00e7a de 2 Pontos): o mini- set continua com a regra oficial (precisa abrir 2 pontos de vantagem: 22x20, 23x21...) at\u00e9 uma das duplas fechar.","Ao terminar cada mini-set dram\u00e1tico, invertem quem come\u00e7a no 19x20 e quem come\u00e7a no 20x19."],"pontosAtencao":["Li\u00e7\u00e3o de ouro para o 19x20 (quando voc\u00ea est\u00e1 atr\u00e1s no placar recebendo o saque): qual \u00e9 o \u00fanico pecado mortal no 19x20?","Errar o ataque na rede ou para fora de gra\u00e7a!","Obrigue o advers\u00e1rio a jogar e escolha o seu golpe mais confi\u00e1vel!","Quando empatar em 20x20 e for sacar, cumpra 100% o sinal mostrado pelo bloqueador nas costas.","Gerencie o tempo entre os pontos: use os 12 segundos permitidos para caminhar na areia, baixar a frequ\u00eancia card\u00edaca e combinar a jogada com o parceiro."],"erroComum":"No 19x20, querer inventar um golpe que nunca treinou na vida (tentar um cut shot imposs\u00edvel caindo para tr\u00e1s) em vez de usar o 'feij\u00e3o com arroz' bem feito na diagonal; corrija fazendo um breve feedback t\u00e1tico ap\u00f3s cada mini-set. Varia\u00e7\u00f5es","variacaoFacil":"Come\u00e7ar o placar empatado em 19 x 19 (sem a desvantagem inicial de 1 ponto).","variacaoDificil":"Come\u00e7ar em 18 x 20 (a Dupla A precisa salvar DOIS Set Points seguidos \u2014 1 side-out + 1 transi\u00e7\u00e3o de bloqueio/defesa \u2014 apenas para chegar ao 20x20!).","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a o 'Torneio 19x20': a dupla que conseguir virar o jogo saindo do 19x20 ganha 1 t\u00edtulo e passa para o lado do 20x19 desafiando a pr\u00f3xima dupla da fila!","meta":"Conseguir salvar o Set Point e vencer o mini-set de virada (saindo de 19x20 para 22x20 ou mais) em pelo menos 2 de 4 tentativas.","descricaoDiagrama":"Quadra 16x8m vista de cima no cen\u00e1rio decisivo 19x20. No lance 1 (Side-out de sobreviv\u00eancia): D1 saca da direita (seta 1), J1 passa (2), J2 levanta (3) e J1 empata em 20x20 (seta 4). No lance seguinte (Transi\u00e7\u00e3o da virada): J1 saca, J2 bloqueia na rede, J1 defende o ataque advers\u00e1rio no fundo (seta 5), J2 levanta (6) e J1 vira o jogo no contra-ataque (seta 7).","codigo":"SDO-AVA-180"},{"numero":181,"secao":11,"nome":"Chamada na costura e regra de prioridade ('Minha!' / 'Sua!')","nivel":"Iniciante","jogadores":"3 jogadores (Dupla J1 + J2 recebendo/defendendo e 1 sacador/lan\u00e7ador S1)","tempo":"8 minutos","material":"5 bolas, 4 cones e 1 zona alvo na rede COSTURA CENTRAL (2m) ALVO 1,5m J1 J2 S1 J1: 'MINHA!' J2: 'SUA! VAI!' 1","objetivo":"Eliminar a hesita\u00e7\u00e3o nas bolas enviadas entre os dois jogadores aplicando o protocolo de chamada dupla ('Minha!' + resposta 'Vai/Sua!') e a regra de prioridade do ombro interno.","comoMontar":"Na meia-quadra esquerda, posicione J1 (entrada/superior) e J2 (sa\u00edda/inferior) a 5,5 metros da rede. Coloque 2 cones delimitando um corredor central de 2 metros de largura ('A Costura') exatamente entre eles, e demarque uma Zona Alvo a 1,5m da rede. S1 fica na linha de fundo direita (8m).","passoAPasso":["Antes de come\u00e7ar, a dupla estabelece a Regra de Prioridade da Costura: para dois jogadores destros, J1 (lado esquerdo) tem a prioridade nas bolas de d\u00favida no meio porque recebe de frente com o seu lado dominante; ou a prioridade \u00e9 de quem estiver meio passo \u00e0 frente.","S1 saca ou lan\u00e7a todas as bolas buscando o corredor central de 2 metros entre J1 e J2.","Protocolo de Dupla Voz Obrigat\u00f3rio: antes de a bola cruzar a fita da rede, quem vai tocar na bola grita alto 'MINHA!' e o parceiro \u00e9 OBRIGADO a responder no mesmo segundo 'VAI!' ou 'SUA!' enquanto j\u00e1 dispara para a rede.","Quem gritou 'MINHA!' fecha o passo em diagonal para frente cortando a trajet\u00f3ria da bola e passa para a Zona Alvo a 1,5m da rede.","Quem respondeu 'VAI!' chega na Zona Alvo, estanca os p\u00e9s e agarra/levanta a bola; a cada 6 bolas, invertem os lados de J1 e J2."],"pontosAtencao":["N\u00e3o basta apenas um jogador gritar 'Minha!': a resposta 'Vai/Sua!' do parceiro destrava o c\u00e9rebro do passador e garante que os dois n\u00e3o v\u00e3o encolher o bra\u00e7o achando que o outro tamb\u00e9m falou.","A chamada deve acontecer no primeiro ter\u00e7o do voo da bola (antes de ela passar por cima da fita da rede).","Nas bolas altas de defesa no meio da quadra, quem vem correndo de FRENTE para a bola sempre tem prioridade sobre quem est\u00e1 recuando de costas."],"erroComum":"Os dois gritarem 'Minha!' ao mesmo tempo e pararem no \u00faltimo metro olhando um para a cara do outro; corrija definindo antes do saque quem \u00e9 o 'dono da costura' naquela rota\u00e7\u00e3o. Varia\u00e7\u00f5es","variacaoFacil":"S1 lan\u00e7a a bola em arco alto a partir de 4 metros da rede do outro lado, dando mais tempo para o di\u00e1logo 'Minha! - Vai!'.","variacaoDificil":"S1 mistura bolas na costura curta (3m da rede) e na costura funda (7,5m), exigindo que quem est\u00e1 mais adiantado chame a curta e quem est\u00e1 mais recuado chame a funda.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 sacadores na direita e rode as duplas na esquerda a cada 4 bolas. Se uma bola cair na costura ou se faltar a resposta 'Vai!' do parceiro, a dupla sai imediatamente para o fim da fila.","meta":"Executar 9 de 10 recep\u00e7\u00f5es na costura com di\u00e1logo completo ('Minha!' + 'Vai!') antes da rede e passe na Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 na linha de fundo direita (8m) envia a bola (seta 1) no corredor central da costura entre J1 e J2 (a 5,5m da rede esquerda). Bal\u00e3o roxo em J1 grita 'MINHA!' e bal\u00e3o em J2 responde 'SUA! VAI!' (seta roxa de comunica\u00e7\u00e3o). J1 fecha no centro (seta tracejada 1) passando para a Zona Alvo a 1,5m da rede (seta 2), para onde J2 infiltrou (seta tracejada 2).","codigo":"COM-INI-181"},{"numero":182,"secao":11,"nome":"Dicion\u00e1rio pr\u00e1tico de sinais de bloqueio atr\u00e1s das costas (2 m\u00e3os)","nivel":"Iniciante","jogadores":"4 jogadores (B1 bloqueador + D1 sacador/defensor contra A1 + A2)","tempo":"9 minutos","material":"5 bolas e 4 cones 1 DEDO = FECHA PARALELA A1 A2 B1 D1 SINAL COSTAS: [1=PAR | 2=DIAG]","objetivo":"Dominar a sinaliza\u00e7\u00e3o com as duas m\u00e3os atr\u00e1s do quadril antes do saque (1 dedo, 2 dedos, m\u00e3o fechada e m\u00e3o aberta) e a confirma\u00e7\u00e3o visual/verbal do parceiro.","comoMontar":"No lado direito: B1 junto \u00e0 rede (a 0,5m da fita) de costas para D1 (que est\u00e1 na linha de fundo de 8m para sacar). No lado esquerdo: A1 (na esquerda) e A2 (na direita) a 5,5m da rede.","passoAPasso":["Antes do apito para o saque, B1 posiciona as duas m\u00e3os atr\u00e1s do quadril: a m\u00e3o ESQUERDA sinaliza o bloqueio contra A1 (receptor da esquerda) e a m\u00e3o DIREITA sinaliza o bloqueio contra A2 (receptor da direita).","A dupla treina os 4 sinais oficiais da praia em sequ\u00eancia: 1 Dedo = bloqueio fecha a Paralela (defensor vai na diagonal); 2 Dedos = bloqueio fecha a Diagonal (defensor vai na paralela); M\u00e3o Fechada (Punho) = bloqueio vai direto na Bola; M\u00e3o Aberta (5 dedos) = Falso bloqueio / Retirada ('Saio da rede').","D1 l\u00ea as duas m\u00e3os de B1 e d\u00e1 o sinal de confirma\u00e7\u00e3o dizendo baixinho ou acenando com a cabe\u00e7a antes de sacar (ex.: B1 mostra `[1 | 2]` -> se D1 sacar em A1, B1 fecha a linha e D1 corre para a diagonal).","Para indicar em QUEM D1 deve sacar, B1 'pisca' (dobra e estica repetidamente) os dedos da m\u00e3o correspondente \u00e0quele receptor!","Executam 8 saques passando por todos os 4 c\u00f3digos e depois trocam com A1 e A2."],"pontosAtencao":["Mantenha as m\u00e3os coladas no cal\u00e7\u00e3o/lombar e longe da luz lateral para que a sombra na areia n\u00e3o mostre o seu sinal para os advers\u00e1rios!","Nunca tire as m\u00e3os das costas antes de ter certeza de que o seu sacador olhou e entendeu o sinal.","Se durante o rali a bola mudar de atacante (ex.: A1 passou mal e A2 vai atacar de segunda), vale o sinal que estava na m\u00e3o DIREITA!"],"erroComum":"O bloqueador mostrar 1 dedo com a m\u00e3o direita achando que est\u00e1 falando do atacante que est\u00e1 \u00e0 esquerda dele; corrija lembrando a regra espacial: 'M\u00e3o do lado esquerdo do corpo = advers\u00e1rio daquele lado; m\u00e3o do lado direito = advers\u00e1rio do outro lado'. Varia\u00e7\u00f5es","variacaoFacil":"Usar apenas os sinais de 1 dedo (Paralela) e 2 dedos (Diagonal) mantendo a mesma combina\u00e7\u00e3o para os dois lados (`[1 | 1]` ou `[2 | 2]`).","variacaoDificil":"D1 tem direito de 'recusar/alterar' o sinal dando um assobio curto antes do saque caso prefira defender outro corredor, obrigando B1 a trocar o sinal nas costas na hora.","paraTurma":"Em turmas de 4 a 12 alunos, o professor fica atr\u00e1s do sacador D1 e mostra uma placa (ou fala no ouvido de B1 qual c\u00f3digo mostrar). Se D1 correr para o corredor errado ap\u00f3s o saque, a dupla paga 3 saltos na areia.","meta":"Acertar 10 de 10 leituras e execu\u00e7\u00f5es dos sinais duplos atr\u00e1s das costas sem nenhuma confus\u00e3o entre B1 e D1.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na direita, B1 junto \u00e0 rede exibe o painel de sinais atr\u00e1s das costas '[M\u00e3o Esq: 1 Dedo | M\u00e3o Dir: 2 Dedos]' conectado por seta roxa de vis\u00e3o at\u00e9 D1 na linha de fundo (8m). D1 saca em A1 na esquerda (seta 1) e desloca-se para cobrir a diagonal inferior (seta tracejada 2), enquanto B1 fecha a paralela superior (seta tracejada 1).","codigo":"COM-INI-182"},{"numero":183,"secao":11,"nome":"O levantador como 'olhos' do atacante: chamada precoce do espa\u00e7o vazio","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (J1 atacante + J2 levantador contra B1 bloqueador + D1 defensor)","tempo":"10 minutos","material":"5 bolas e 3 zonas alvo CRUZADO CURTO! J1 J2 B1 D1","objetivo":"Treinar o levantador para tirar o olho da bola assim que ela sai das suas m\u00e3os, escanear a defesa advers\u00e1ria e gritar o golpe exato antes de o parceiro bater.","comoMontar":"Na meia-quadra esquerda: J1 (atacante na entrada) e J2 (levantador no centro a 1,5m da rede). Na meia-quadra direita: B1 na rede e D1 no fundo, com 3 Zonas Alvo demarcadas (Linha Paralela, Diagonal Cruzada e Curta/Lob).","passoAPasso":["J1 faz a recep\u00e7\u00e3o para o centro da quadra (1,5m da rede) e inicia a corrida de ataque mantendo os olhos focados na bola no alto.","J2 executa o levantamento limpo e, no exato instante em que a bola deixa as suas m\u00e3os, J2 vira o rosto para a quadra direita (olhando para B1 e D1).","Enquanto J1 est\u00e1 nos dois \u00faltimos passos na areia, B1 e D1 se movimentam para fechar uma parte da quadra e deixar outra aberta de prop\u00f3sito.","J2 precisa gritar UMA das 4 palavras-c\u00f3digo em alto e bom som antes de J1 atingir o topo do salto: 'LINHA!' (paralela aberta), 'CRUZADO!' (diagonal aberta), 'CURTA!' (defensor recuado aos 7m) ou 'ALTA NO FUNDO!' (ambos adiantados).","J1 ataca obedecendo cegamente ao comando de voz de J2; a cada 8 ataques, J1 e J2 trocam de fun\u00e7\u00e3o."],"pontosAtencao":["O erro cl\u00e1ssico \u00e9 gritar tarde demais (quando a m\u00e3o do atacante j\u00e1 est\u00e1 batendo na bola): o grito tem que sair enquanto o atacante est\u00e1 SUBINDO do ch\u00e3o!","Seja espec\u00edfico e use uma palavra s\u00f3: n\u00e3o grite frases longas como 'Olha que ele abriu na diagonal!'; grite 'CRUZADO!' ou 'PINGA!'.","Se os dois advers\u00e1rios deixarem o meio aberto ou se o levantamento ficou ruim, o comando de seguran\u00e7a \u00e9 'ALTA NO FUNDO!'."],"erroComum":"O levantador J2 continuar olhando para cima acompanhando a pr\u00f3pria bola levantada at\u00e9 a m\u00e3o de J1, sem olhar para o bloqueio/defesa advers\u00e1ria; corrija obrigando J2 a falar quantos dedos D1 mostrou l\u00e1 do outro lado ap\u00f3s o levantamento. Varia\u00e7\u00f5es","variacaoFacil":"Trabalhar apenas com 2 comandos ('LINHA!' ou 'CRUZADO!') contra 1 bloqueador na rede.","variacaoDificil":"D1 faz finta na defesa (finge que vai para a linha e volta para a diagonal), obrigando J2 a cantar a confirma\u00e7\u00e3o em duas etapas: 'Linha... FICOU LINHA!'.","paraTurma":"Em turmas de 4 a 12 alunos, a dupla atacante s\u00f3 marca ponto se o grito de J2 for aud\u00edvel para toda a quadra E se J1 atacar exatamente na zona cantada por J2.","meta":"Cantar a zona livre no tempo certo e acertar o ataque guiado pela voz em 7 de 10 repeti\u00e7\u00f5es.","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 passa para J2 no centro (seta 1) e corre para atacar na esquerda (seta tracejada 1). J2 levanta (seta 2), olha para B1 e D1 na direita (seta roxa de leitura visual) e grita no bal\u00e3o 'CRUZADO CURTO!' para J1, que ataca na Zona Alvo aberta (seta 3).","codigo":"COM-INT-183"},{"numero":184,"secao":11,"nome":"Radar na rede: avisando a movimenta\u00e7\u00e3o do bloqueador ('Subiu!', 'Saiu!', 'Dois atr\u00e1s!')","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (J1 + J2 no ataque contra B1 + D1 variando bloqueio e retirada)","tempo":"10 minutos","material":"5 bolas e 2 cones CURTA 2mJ1 J2 B1 D1J2: 'SAIU! DOIS ATR\u00c1S! PINGA!' 1 2","objetivo":"Alertar imediatamente o atacante quando o bloqueador advers\u00e1rio finge o bloqueio e retira da rede, evitando que o atacante d\u00ea um lob f\u00e1cil nas m\u00e3os dele.","comoMontar":"Dupla J1 e J2 na meia-quadra esquerda; B1 na rede direita e D1 no fundo direito (a 5,5m).","passoAPasso":["Muitas vezes o atacante salta achando que B1 est\u00e1 bloqueando na sua frente e d\u00e1 um 'lob' ou 'poke' por cima do bloqueio \u2014 sem perceber que B1 recuou ('pulling') e est\u00e1 parado esperando essa bola f\u00e1cil!","D1 saca em J1; J1 recepciona e J2 vai levantar.","Assim que a bola sai da m\u00e3o de J2, B1 faz uma de tr\u00eas a\u00e7\u00f5es na rede: 1) Fica e salta no bloqueio; 2) Retira r\u00e1pido para a paralela; 3) Retira r\u00e1pido para a diagonal.","J2 acompanha B1 e grita imediatamente o status do bloqueio para J1: 'SUBIU BLOCO!' (h\u00e1 bloqueio real na frente), 'SAIU LINHA!' (bloqueador recuou para a paralela, pinga na frente dele!) ou 'DOIS ATR\u00c1S!' (quadra sem bloqueio, pode sentar o bra\u00e7o ou pingar curto!).","Quando J1 ouve 'SAIU LINHA!' ou 'DOIS ATR\u00c1S!', \u00e9 proibido dar lob no fundo: J1 ou bate forte nos 5 metros ou solta a largada curta aos 2 metros onde B1 abandonou a rede!"],"pontosAtencao":["O aviso 'SAIU!' ou 'SEM BLOCO!' vale ouro no v\u00f4lei de praia: ele libera o atacante para bater para baixo sem medo de pared\u00e3o ou jogar um pingo curto na frente.","Se o bloqueador advers\u00e1rio (B1) saiu da rede atrasado e ainda est\u00e1 correndo de costas aos 3 metros, o melhor aviso de J2 \u00e9: 'NO P\u00c9 DELE!'.","Mantenha o tom de voz firme e calmo para n\u00e3o assustar o atacante no ar."],"erroComum":"Gritar apenas 'Olha o bloco!' sem dizer se o bloqueador FICOU na rede ou se SAIU para o fundo; corrija padronizando os dois termos opostos: 'FICOU!' vs. 'SAIU!'. Varia\u00e7\u00f5es","variacaoFacil":"B1 decide se fica ou se sai logo que a recep\u00e7\u00e3o de J1 sobe, dando 2 segundos inteiros para J2 avisar.","variacaoDificil":"B1 faz o falso bloqueio at\u00e9 o \u00faltimo instante e s\u00f3 retira quando J2 toca na bola, exigindo reflexo vocal instant\u00e2neo de J2.","paraTurma":"Em turmas de 4 a 12 alunos, d\u00ea 2 pontos para a defesa toda vez que B1 retirar da rede e J1 (por falta de aviso de J2) mandar um lob na m\u00e3o de B1; d\u00ea 2 pontos para o ataque toda vez que J2 avisar 'SAIU!' e J1 matar na curta.","meta":"Identificar 8 de 10 retiradas/perman\u00eancias do bloqueio com aviso vocal preciso e escolha correta do golpe por J1.","descricaoDiagrama":"Quadra 16x8m vista de cima. J2 levanta para J1 na esquerda (seta 1). Na direita, B1 finta na rede e retira para o fundo (seta tracejada 1) juntando-se a D1. J2 v\u00ea a retirada (seta roxa) e grita no bal\u00e3o 'SAIU! DOIS ATR\u00c1S! PINGA!'. J1 aborta o lob e larga curto aos 2m onde B1 saiu (seta 2).","codigo":"COM-INT-184"},{"numero":185,"secao":11,"nome":"Comunica\u00e7\u00e3o ativa de saque e chamada de 'Pulling' na transi\u00e7\u00e3o defensiva","nivel":"Intermedi\u00e1rio","jogadores":"4 jogadores (B1 + D1 sacando e comunicando na defesa contra A1 + A2)","tempo":"10 minutos","material":"5 bolas e 2 cones A1 A2 B1 D1 B1: 'SA\u00cd! LIVRE!' (Passe longe) D1: 'VEM LINHA, T\u00d4 NA DIAGO!'","objetivo":"Conectar o pedido de alvo de saque antes do ponto com a comunica\u00e7\u00e3o vocal durante o rali caso o bloqueador precise abortar o bloqueio ('Sa\u00ed! Livre!').","comoMontar":"B1 na rede direita e D1 na linha de saque direita (8m). A1 e A2 na recep\u00e7\u00e3o esquerda (5,5m).","passoAPasso":["Fase 1 (Comunica\u00e7\u00e3o Pr\u00e9-Saque): B1 coloca as m\u00e3os atr\u00e1s das costas mostrando o sinal e 'pisca' os dedos indicando exatamente onde quer que D1 saque (ex.: pisca o dedo da m\u00e3o esquerda = sacar em A1 na linha; ou fecha e abre o polegar = sacar na costura central).","D1 confirma e executa o saque t\u00e1tico combinado.","Fase 2 (Comunica\u00e7\u00e3o em Movimento P\u00f3s-Recep\u00e7\u00e3o): se o passe de A1 foi perfeito na rede, B1 grita 'MEU BLOCO!' confirmando para D1 que vai saltar e fechar o corredor prometido.","Por\u00e9m, se o saque de D1 quebrou o passe de A1 para longe da rede (3,5m ou mais), B1 tem a obriga\u00e7\u00e3o de cancelar o sinal gritando alto 'SA\u00cd! LIVRE!' enquanto recua.","Ao ouvir 'SA\u00cd! LIVRE!', D1 responde 'VEM PRA LINHA, T\u00d4 NA DIAGO!' coordenando a divis\u00e3o do fundo sem baterem cabe\u00e7a!"],"pontosAtencao":["A comunica\u00e7\u00e3o da defesa tem duas metades: antes do saque ela \u00e9 100% silenciosa (sinais nas costas); depois que o advers\u00e1rio recepciona, ela \u00e9 100% VERBAL e alta!","Quando o bloqueador grita 'SA\u00cd!', o defensor de fundo deve responder para qual lado est\u00e1 indo ('T\u00f4 na direita!') para o bloqueador saber qual metade da quadra sobrou para ele.","Se a bola bater na fita ou passar de segunda, o grito imediato \u00e9 'CURTA!'."],"erroComum":"O bloqueador abortar o bloqueio em sil\u00eancio absoluto e recuar justamente para o mesmo canto onde o defensor j\u00e1 estava esperando; corrija exigindo o di\u00e1logo duplo: 'SA\u00cd! \u2014 VEM LINHA!'. Varia\u00e7\u00f5es","variacaoFacil":"A1 e A2 avisam antes se v\u00e3o passar a bola perto da rede (B1 grita 'Fico!') ou longe da rede (B1 grita 'Sa\u00ed!').","variacaoDificil":"A1 e A2 podem tentar passar a bola de segunda no fundo quando ouvem B1 e D1 conversando, testando a prontid\u00e3o da dupla.","paraTurma":"Em turmas de 4 a 12 alunos, jogue s\u00e9ries de 4 saques por dupla: o professor avalia tanto a precis\u00e3o do saque no alvo piscado nos dedos quanto o di\u00e1logo verbal de transi\u00e7\u00e3o na defesa.","meta":"Cumprir 8 de 10 sequ\u00eancias com saque no alvo pedido no sinal e comunica\u00e7\u00e3o verbal clara ('Meu bloco!' ou 'Sa\u00ed! Vem linha!') na defesa.","descricaoDiagrama":"Quadra 16x8m vista de cima. Fase 1: B1 na rede direita pisca o sinal nas costas pedindo saque em A1 (seta roxa 1) e D1 saca em A1 (seta de bola 1). Fase 2: o passe de A1 fica longe aos 4m (seta 2); B1 cancela o bloqueio gritando 'SA\u00cd! LIVRE!' e D1 responde 'VEM LINHA, T\u00d4 DIAGO!' (bal\u00f5es roxos), dividindo o fundo (setas tracejadas).","codigo":"COM-INT-185"},{"numero":186,"secao":11,"nome":"C\u00f3digo visual silencioso para dias de vento forte e barulho na arena","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (2 contra 2 em quadra completa)","tempo":"10 minutos","material":"5 bolas MEIO J1 J2 A1 A2GESTO J1: [M\u00e3o no Peito = Meio] 1 2 3","objetivo":"Combinar toda a t\u00e1tica de levantamento (ponta, meio, chutada ou segunda bola) e de cobertura atrav\u00e9s de toques corporais e sinais visuais quando o vento ou a torcida impedem ouvir a voz.","comoMontar":"Quadra 16x8m com Dupla J1 + J2 na esquerda e Dupla A1 + A2 na direita.","passoAPasso":["Em praias com vento acima de 30 km/h ou arenas com m\u00fasica/torcida alta, o seu parceiro a 5 metros de dist\u00e2ncia N\u00c3O escuta o que voc\u00ea fala. As duplas profissionais usam c\u00f3digos visuais r\u00e1pidos antes de virar para receber o saque:","C\u00f3digo Visual de Ataque (feito pelo receptor tocando no pr\u00f3prio corpo antes do saque): 1) Tocar no OMBRO = quero bola alta normal na antena; 2) Tocar no PEITO = quero bola r\u00e1pida no MEIO junto de voc\u00ea; 3) Tocar na COXA/CAL\u00c7\u00c3O = vou cruzar por tr\u00e1s de voc\u00ea ap\u00f3s passar; 4) Mostrar 2 dedos na barriga = se o passe for na m\u00e3o, bata voc\u00ea de SEGUNDA bola!","Durante os primeiros 5 minutos do exerc\u00edcio, \u00e9 PROIBIDO FALAR antes do saque e durante o levantamento: toda a combina\u00e7\u00e3o de side-out deve ser feita pelos toques no ombro/peito/coxa e pelos sinais de dedos nas costas!","Nos 5 minutos finais, libera-se apenas 1 grito curto de dire\u00e7\u00e3o no ar ('LINHA!' / 'DIAGO!') somado ao c\u00f3digo gestual pr\u00e9vio."],"pontosAtencao":["Fa\u00e7a o gesto de toque no peito ou no ombro olhando para o seu parceiro ANTES de o advers\u00e1rio sacar, de forma discreta (parecendo que est\u00e1 apenas limpando a areia da camiseta!).","Para o levantador: mesmo sob barulho extremo, ap\u00f3s levantar voc\u00ea pode apontar com o bra\u00e7o para a linha ou para a diagonal caso o atacante olhe de relance para voc\u00ea na descida.","Combine no m\u00e1ximo 3 ou 4 sinais visuais simples que a dupla nunca esque\u00e7a sob cansa\u00e7o."],"erroComum":"Fazer o sinal visual r\u00e1pido demais enquanto o parceiro est\u00e1 olhando para o ch\u00e3o limpando os \u00f3culos; corrija exigindo contato visual ('olho no olho') + aceno de cabe\u00e7a confirmando o gesto antes de abrir para a base. Varia\u00e7\u00f5es","variacaoFacil":"Usar apenas 2 sinais corporais no side-out: toque no ombro (bola na ponta) e toque no peito (bola no meio).","variacaoDificil":"Colocar m\u00fasica alta na caixa de som da arena (ou proibi\u00e7\u00e3o total de voz com penalidade de -1 ponto para quem falar antes da batida de ataque) durante um mini-set at\u00e9 11 pontos.","paraTurma":"Em turmas de 4 a 12 alunos, cada dupla cria e apresenta para o professor o seu 'c\u00f3digo secreto de 3 gestos' e entra na quadra tentando vencer 3 pontos usando exclusivamente os sinais combinados.","meta":"Executar 7 de 10 jogadas combinadas por gestos silenciosos (ponta, meio, cruzamento ou 2\u00aa bola) em perfeita sincronia entre passador e levantador.","descricaoDiagrama":"Quadra 16x8m vista de cima sob \u00edcone de Vento/Barulho. Na esquerda, antes do saque de A2, J1 faz contato visual com J2 (seta roxa) e toca no pr\u00f3prio peito '[Sinal: Toque no Peito = Bola no Meio]'. Ap\u00f3s o saque (seta 1), J1 passa para o centro (seta 2), J2 levanta curto no meio conforme o gesto silencioso (seta 3) e J1 entra pelo centro atacando (seta 4).","codigo":"COM-AVA-186"},{"numero":187,"secao":11,"nome":"Ritual dos 12 segundos entre os pontos: leitura, ajuste t\u00e1tico e reset mental","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Jogo 2x2 com paradas estruturadas de 12 segundos)","tempo":"11 minutos","material":"5 bolas e 1 cron\u00f4metro/apito com o treinador J1 J2 A1 A2 RITUAL 12s: 1. Toque M\u00e3os | 2. Leitura | 3. Plano 'Vento aumentou! Saca no A1 e fecha linha!'","objetivo":"Transformar o intervalo oficial de 12 segundos entre um rali e outro em uma reuni\u00e3o t\u00e1tica estruturada de 3 passos para ajustar a estrat\u00e9gia do set sem brigas nem sil\u00eancio.","comoMontar":"Quadra oficial 16x8m com duas duplas disputando um set. Marque um 'Ponto de Encontro da Dupla' no centro de cada meia-quadra (a 4 metros da rede).","passoAPasso":["No v\u00f4lei de praia, quando uma dupla perde 2 pontos seguidos, o comum \u00e9 cada um virar para um canto de cara fechada em sil\u00eancio (ou reclamar do erro do parceiro). Neste exerc\u00edcio, entre TODOS os pontos, as duas duplas t\u00eam exatamente 12 segundos para se encontrar no centro da quadra (a 4m da rede) e cumprir o Ritual de 3 Passos:","Segundos 1 a 4 (O Toque F\u00edsico + Reset): bater as m\u00e3os (high-five) olhando nos olhos, mesmo que o parceiro tenha acabado de errar na rede, soltando o ar.","Segundos 5 a 8 (1 Frase de Leitura do que aconteceu): falar apenas dados objetivos, sem culpa (ex.: 'Ele est\u00e1 largando toda bola na diagonal curta' ou 'O vento aumentou contra n\u00f3s').","Segundos 9 a 12 (A Decis\u00e3o para o Pr\u00f3ximo Ponto): definir a a\u00e7\u00e3o exata da pr\u00f3xima bola (ex.: 'Saca no 2 na linha e eu fecho a diagonal dele!' ou 'Passa mais alto no meio que eu vou chutar no fundo').","No segundo 12 o professor apita autorizando o saque; se a dupla n\u00e3o tiver batido as m\u00e3os e combinado a jogada no centro, perde 1 ponto!"],"pontosAtencao":["Regra de comunica\u00e7\u00e3o emocional na praia: \u00e9 proibido falar do PASSADO com tom de cobran\u00e7a ('Por que voc\u00ea n\u00e3o pegou aquela bola?'); fale sempre do FUTURO ('Na pr\u00f3xima bola curta, deixa que eu entro na frente!').","Na troca de lado a cada 7 pontos, a primeira frase obrigat\u00f3ria da dupla \u00e9 sobre o VENTO e o SOL do lado novo ('Aqui estamos contra o vento, saca forte e passa perto da rede!').","Fale baixo no encontro aos 4 metros para a dupla advers\u00e1ria n\u00e3o ouvir a mudan\u00e7a de t\u00e1tica de voc\u00eas."],"erroComum":"Gastar os 12 segundos caminhando cabisbaixo l\u00e1 na linha de fundo longe do parceiro sem trocar uma palavra; corrija desenhando um c\u00edrculo no centro da quadra onde os dois precisam pisar juntos ap\u00f3s cada apito final de rali. Varia\u00e7\u00f5es","variacaoFacil":"O professor faz perguntas r\u00e1pidas entre os pontos ('Quem est\u00e1 atacando mais deles? Onde voc\u00eas v\u00e3o sacar agora?') para guiar o racioc\u00ednio da dupla.","variacaoDificil":"A dupla advers\u00e1ria recebe uma 'miss\u00e3o secreta' do professor a cada 3 pontos (ex.: passar a atacar s\u00f3 lob ou s\u00f3 de segunda bola), e a dupla precisa descobrir o padr\u00e3o e combinar o ant\u00eddoto no ritual de 12 segundos!","paraTurma":"Em turmas de 4 a 12 alunos, jogue mini-sets de 7 pontos: as duplas que est\u00e3o esperando fora da quadra observam o ritual de 12 segundos das duplas em jogo e avaliam qual dupla manteve melhor linguagem corporal e clareza t\u00e1tica.","meta":"Cumprir 100% dos intervalos entre pontos com o ritual completo (Toque de m\u00e3os + Leitura + Plano da pr\u00f3xima bola) dentro dos 12 segundos.","descricaoDiagrama":"Quadra 16x8m vista de cima no intervalo entre pontos. No centro da meia-quadra esquerda (a 4m da rede), J1 e J2 convergem para o C\u00edrculo de Encontro (setas tracejadas 1). Bal\u00e3o roxo central destaca os 3 passos dos 12s: '1. Toque de m\u00e3os | 2. Leitura: Ele est\u00e1 largando curto | 3. Plano: Saca no A1 e fecha diagonal!'. Em seguida, abrem para suas posi\u00e7\u00f5es de jogo (setas tracejadas 2).","codigo":"COM-AVA-187"},{"numero":188,"secao":11,"nome":"Desafio 'Ponto Mudo N\u00e3o Vale': jogo real onde a comunica\u00e7\u00e3o decide o placar","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Disputa 2x2 oficial valendo pontua\u00e7\u00e3o especial de comunica\u00e7\u00e3o)","tempo":"12 minutos","material":"5 bolas e placar manual VALE 2 PTS! J1 J2 A1 A2 ELO 1: Sinal nas Costas","objetivo":"Encadear todos os elos de comunica\u00e7\u00e3o da se\u00e7\u00e3o (sinal pr\u00e9-saque, chamada do 1\u00ba toque, canto do levantador e aviso de bloqueio) sob press\u00e3o competitiva de jogo.","comoMontar":"Quadra oficial 16x8m pronta para partida 2x2 entre Dupla A (J1 + J2) na esquerda e Dupla B (A1 + A2) na direita.","passoAPasso":["Disputa de um set at\u00e9 15 pontos onde a qualidade da comunica\u00e7\u00e3o da dupla multiplica ou anula os pontos conquistados na bola:","Checklist dos 3 Elos Obrigat\u00f3rios em cada rali: Elo 1 = Sinal de bloqueio atr\u00e1s das costas antes do saque; Elo 2 = Grito 'MINHA! \u2014 VAI!' antes do 1\u00ba contato (recep\u00e7\u00e3o ou defesa); Elo 3 = Chamada alta do levantador ('LINHA!', 'CRUZADO!', 'CURTA!', 'SEM BLOCO!') antes do ataque do parceiro.","Regra do 'Ponto Mudo Anulado': se uma dupla vencer o rali com um ataque lindo, mas tiver esquecido QUALQUER UM dos 3 elos de comunica\u00e7\u00e3o (ex.: passou calado ou o levantador n\u00e3o cantou o ataque), o ponto \u00e9 ANULADO (0 ponto) e o saque vai para o advers\u00e1rio!","Regra do 'B\u00f4nus de Sintonia Perfeita' (+2 pontos): se a dupla cumprir os 3 elos em voz alta e vencer o rali atacando exatamente na zona que o levantador cantou, o ponto vale 2 PONTOS no placar!","Em caso de bola que toca no bloqueio, o grito imediato 'TOCOU! \u00c9 DOIS!' tamb\u00e9m \u00e9 obrigat\u00f3rio para validar o contra-ataque."],"pontosAtencao":["No come\u00e7o do jogo, os jogadores percebem o quanto costumam ficar mudos quando est\u00e3o cansados ou tensos; ap\u00f3s 3 minutos, a quadra inteira ganha vida e energia de torneio profissional!","Gritar alto tamb\u00e9m exerce press\u00e3o psicol\u00f3gica sobre a dupla advers\u00e1ria, mostrando confian\u00e7a e dom\u00ednio da quadra.","N\u00e3o grite apenas por gritar para cumprir a regra: olhe de verdade para o defensor advers\u00e1rio antes de cantar 'Linha!' ou 'Cruzado!'."],"erroComum":"O levantador gritar 'LINHA!' e o atacante, por teimosia, bater no 'CRUZADO!' em cima do defensor; neste desafio, para ganhar o b\u00f4nus de 2 pontos, o atacante \u00e9 obrigado a obedecer \u00e0 chamada do seu levantador! Varia\u00e7\u00f5es","variacaoFacil":"Validar o ponto normal (1 pt) se cumprirem pelo menos 2 dos 3 elos, e dar 2 pontos quando cumprirem os 3 elos completos.","variacaoDificil":"Se duas bolas ca\u00edrem na quadra de uma dupla por erro de comunica\u00e7\u00e3o (os dois pararem olhando na costura), a dupla perde todos os pontos acumulados no set!","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a o torneio 'Rei da Comunica\u00e7\u00e3o' em sets curtos at\u00e9 7 pontos: os alunos da fila de espera s\u00e3o os ju\u00edzes dos 3 Elos (1 juiz fiscaliza o lado esquerdo e outro fiscaliza o lado direito, apitando na hora se houver sil\u00eancio!).","meta":"Vencer o set conquistando pelo menos 4 pontos de 'B\u00f4nus de Sintonia Perfeita' (2 pts) e tendo zero pontos anulados por sil\u00eancio.","descricaoDiagrama":"Quadra 16x8m vista de cima mostrando os 3 Elos de Comunica\u00e7\u00e3o em jogo 2x2: na direita, A1 mostra o Elo 1 '[Sinal nas costas]' para A2 sacar (seta 1). Na esquerda, J1 e J2 cumprem o Elo 2 gritando 'MINHA! / VAI!' na recep\u00e7\u00e3o (seta 2); no levantamento (seta 3), J2 cumpre o Elo 3 olhando a quadra e gritando 'LINHA LIVRE!' para J1 cravar o ataque na paralela valendo 2 pontos (seta 4).","codigo":"COM-AVA-188"},{"numero":189,"secao":12,"nome":"Sorteio de quadra, sol de frente e escolha t\u00e1tica de lado e fun\u00e7\u00e3o","nivel":"Iniciante","jogadores":"4 jogadores (Dupla J1 + J2 contra Dupla A1 + A2)","tempo":"10 minutos","material":"4 bolas, 2 cones e moeda para sorteio LADO C/ SOL DE FRENTE: Passe mais baixo LADO C/ SOL NAS COSTAS: Saque Alto! ZONA 2m ALVO ATAQUE J1 J2","objetivo":"Compreender na pr\u00e1tica a vantagem de cada lado da quadra em rela\u00e7\u00e3o ao sol e ao vento para tomar a decis\u00e3o certa no sorteio e ajustar o levantamento sob sol frontal.","comoMontar":"Identifique a posi\u00e7\u00e3o do sol na arena. Posicione a Dupla J1 + J2 na meia-quadra que olha DIRETAMENTE CONTRA O SOL ao olhar para a rede (lado esquerdo do diagrama) e a Dupla A1 + A2 na meia-quadra com o sol pelas costas (lado direito). Marque uma Zona Alvo de levantamento a 2m da rede na esquerda.","passoAPasso":["\u00c1 O treinador re\u00fane as duas duplas no centro da rede e explica a Regra de Ouro do Sorteio na Praia: 'Lado Bom' \u00e9 quase sempre o lado que joga CONTRA o vento (facilita atacar forte) e com o SOL PELAS COSTAS (n\u00e3o cega o passador/atacante).","A2 saca do lado direito; J1 e J2 (que est\u00e3o no lado ruim, com o sol forte no rosto) aplicam as 3 adapta\u00e7\u00f5es t\u00e1ticas obrigat\u00f3rias contra o sol:","Adapta\u00e7\u00e3o 1 (Na Recep\u00e7\u00e3o): J1 passa a bola mais baixa/m\u00e9dia (3m de altura) e 1 metro \u00e0 frente de J2, para que J2 n\u00e3o precise olhar verticalmente para o disco solar.","Adapta\u00e7\u00e3o 2 (No Levantamento): J2 vira os ombros em diagonal (de costas para o sol) e levanta a bola um pouco mais esticada para a ponta, tirando a bola da linha entre os olhos de J1 e o sol.","Adapta\u00e7\u00e3o 3 (No Ataque): se a bola cruzar exatamente na frente do sol cegando J1 por meio segundo, J1 usa a m\u00e3o guia como viseira at\u00e9 o salto e aplica um golpe de seguran\u00e7a (cobra ou cut shot) na quadra advers\u00e1ria; a cada 5 saques, trocam de lado."],"pontosAtencao":["No sorteio de in\u00edcio de jogo, se voc\u00ea vencer a moeda em dia de sol baixo ou vento forte, muitas vezes vale mais a pena escolher o LADO da quadra (para come\u00e7ar no lado bom ou terminar o tie-break no lado bom) do que escolher sacar!","Quando voc\u00ea est\u00e1 no lado que tem o sol nas suas COSTAS (como A1 e A2), use o saque alto ('Jornada nas Estrelas') para for\u00e7ar o advers\u00e1rio a olhar direto para o sol!","Nunca levante uma bola vertical em cima da cabe\u00e7a do seu parceiro quando ele est\u00e1 de frente para o sol."],"erroComum":"No lado com sol de frente, passar e levantar bolas alt\u00edssimas de 6 metros de altura que passam exatamente na frente do sol, cegando o atacante; corrija limitando o arco a 3,5 metros e deslocando o levantamento em diagonal. Varia\u00e7\u00f5es","variacaoFacil":"A2 envia saques normais por baixo para J1 e J2 treinarem o \u00e2ngulo de passe e levantamento fugindo da linha do sol.","variacaoDificil":"A2 \u00e9 obrigado a sacar apenas 'Jornada nas Estrelas' (saque alt\u00edssimo na linha do sol) contra J1 e J2.","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a rod\u00edzio de duplas a cada 4 pontos no 'Lado do Sol'. Os alunos que aguardam fora observam de qual \u00e2ngulo o sol mais atrapalha e sugerem para onde o levantador deve puxar a bola.","meta":"Converter 7 de 10 side-outs jogando no lado com sol de frente sem perder nenhuma bola por cegueira solar.","descricaoDiagrama":"Quadra 16x8m vista de cima com \u00edcone do Sol forte brilhando do lado direito para o esquerdo. A2 saca da direita (seta 1) usando o sol a seu favor. Na esquerda, J1 recepciona com arco controlado para a Zona a 2m da rede (seta 2), J2 vira de costas para os raios solares levantando em diagonal (seta 3) e J1 avan\u00e7a (seta tracejada) finalizando na quadra direita (seta 4).","codigo":"TAT-INI-189"},{"numero":190,"secao":12,"nome":"T\u00e1tica do 'Lado Bom' vs. 'Lado Ruim' do vento (vento contra e a favor)","nivel":"Iniciante","jogadores":"4 jogadores (Dupla J1 + J2 contra Dupla A1 + A2)","tempo":"10 minutos","material":"5 bolas e 4 cones demarcando zonas de seguran\u00e7a VENTO FORTE SOPRANDO DA ESQUERDA PARA A DIREITA LADO RUIM (A Favor): Passe a 2,5m + Topspin LADO BOM (Contra): Soltar o bra\u00e7o e Curta! PASSE 2,5m ZONA MEIO (TOPSPIN) J1 J2 A1","objetivo":"Mudar completamente o estilo de saque, passe e ataque a cada troca de quadra de 7 pontos, sabendo que na praia o lado CONTRA o vento \u00e9 o 'Lado Bom' para atacar.","comoMontar":"Identifique o sentido do vento longitudinal. Na meia- quadra esquerda (que joga A FAVOR do vento = 'Lado Ruim' porque a bola voa para fora), marque uma Zona de Passe recuada aos 2,5m da rede. Na meia-quadra direita (que joga CONTRA o vento = 'Lado Bom' porque o vento segura a bola dentro), marque a Zona de Passe a 1m da rede.","passoAPasso":["\u00c1 Explica\u00e7\u00e3o T\u00e1tica Essencial: ao contr\u00e1rio do que os iniciantes pensam, no v\u00f4lei de praia jogar CONTRA o vento \u00e9 o 'LADO BOM' (porque voc\u00ea pode sacar forte e atacar com for\u00e7a total sem a bola sair!), enquanto jogar A FAVOR do vento \u00e9 o 'LADO RUIM' (qualquer toque forte vai parar fora da quadra!).","Disputa de um mini-set at\u00e9 14 pontos com troca de lado obrigat\u00f3ria a cada 7 pontos somados (ex.: 4x3, 5x2).","Quem est\u00e1 na Esquerda ('Lado Ruim' - vento nas costas): \u00e9 obrigado a sacar mais curto ou com topspin suave, passar a bola segura a 2,5m da rede (para o vento n\u00e3o jogar o passe no bloqueio) e atacar usando topspin m\u00e1ximo ou largadas curtas!","Quem est\u00e1 na Direita ('Lado Bom' - vento na cara): tem sinal verde para sacar flutuante agressivo/viagem forte, passar perto da rede (1m) e soltar o bra\u00e7o na cortada ou no pingo curto contra o vento!","A dupla que errar saque ou ataque para fora no fundo quando estiver no 'Lado Ruim' (a favor do vento) perde 2 pontos!"],"pontosAtencao":["Mentalidade t\u00e1tica de campeonato: no 'Lado Bom' (contra o vento) voc\u00ea pontua no saque e no bloqueio abrindo vantagem; no 'Lado Ruim' (a favor do vento) voc\u00ea joga com paci\u00eancia e erro zero apenas virando o seu side-out!","A cada 7 pontos somados no placar (7, 14, 21...), na hora em que cruzarem pelo poste para trocar de lado, conversem: 'Agora estamos no lado bom, vamos for\u00e7ar o saque!' ou 'Agora estamos a favor do vento, segura o bra\u00e7o!'.","No lado a favor do vento, mire sempre no meio da quadra advers\u00e1ria."],"erroComum":"Esquecer que acabou de trocar de lado aos 7 pontos e dar uma pancada de saque ou ataque a favor do vento, jogando a bola 3 metros fora; corrija com um aviso obrigat\u00f3rio do professor a cada troca de lado. Varia\u00e7\u00f5es","variacaoFacil":"Jogar 5 pontos seguidos sem contar erros e depois trocar de lado para sentir a diferen\u00e7a f\u00edsica da bola.","variacaoDificil":"Partida r\u00e1pida de Tie-break at\u00e9 15 pontos com troca de lado a cada 5 pontos somados (5, 10, 15...).","paraTurma":"Em turmas de 4 a 12 alunos, jogue mini-jogos de 7 pontos (soma dos dois lados = 7 pontos totais): ao somar 7 pontos, as duas duplas em quadra trocam de lado e jogam mais 7 pontos antes de dar lugar \u00e0s duplas da fila.","meta":"Completar o set de 14 pontos com no m\u00e1ximo 1 erro de bola fora no fundo quando estiver jogando no lado a favor do vento.","descricaoDiagrama":"Quadra 16x8m vista de cima com setas azuis de Vento soprando da esquerd
