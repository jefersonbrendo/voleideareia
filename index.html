a fila de jogadores disputa 'Rei da Quadra 1x1 em 8x8m' de 1 ponto por vez!","meta":"Vencer um mini-set de 5 pontos no 1x1 de quadra inteira convertendo pelo menos 4 bolas em espa\u00e7os vazios sem que o oponente toque na bola.","descricaoDiagrama":"Quadra 16x8m inteira (8x8m de cada lado). L1 (na esquerda) e L2 (na direita) ficam fixos no centro da rede apenas como levantadores. A1 saca (seta 1) para J1 que cobre sozinho toda a quadra esquerda; J1 passa para L1 (seta 2), L1 levanta (seta 3) e J1 avan\u00e7a (seta tracejada) atacando nos cantos vazios dos 8x8m onde A1 est\u00e1 sozinho (setas 4a, 4b, 4c). Regra: '1x1 em 8x8m c/ Levantador Fixo na Rede'.","codigo":"JOG-AVA-212"},{"numero":213,"secao":13,"nome":"Simula\u00e7\u00e3o de Fim de Set no Limite: placar come\u00e7a em 18x18 (com 1 Time-out)","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Partida 2x2 oficial sob press\u00e3o de fechamento de set)","tempo":"12 minutos","material":"5 bolas, placar e apito SIMULA\u00c7\u00c3O DE FIM DE SET: Placar inicia em 18 x 18 (vai a 21, dif. de 2) | 1 Time-out Obrigat\u00f3rio \u23f1","objetivo":"Treinar a execu\u00e7\u00e3o t\u00e9cnica e emocional nos \u00faltimos 3 pontos de um set oficial (18x18 at\u00e9 21, com diferen\u00e7a de 2 pontos), incluindo o uso estrat\u00e9gico do pedido de tempo.","comoMontar":"Quadra oficial 16x8m pronta para partida 2x2: Dupla J1 + J2 na esquerda e Dupla A1 + A2 na direita. Placar vis\u00edvel marcando 18 x 18.","passoAPasso":["Por que muitas duplas jogam super bem at\u00e9 o ponto 15 e travam na hora de fechar o set aos 18x18? Porque n\u00e3o treinam a press\u00e3o do fim de set todos os dias!","Toda partida come\u00e7a empatada em 18 x 18 (vai at\u00e9 21 pontos, precisando abrir 2 pontos de vantagem: 21x19, 22x20...).","Ferramenta T\u00e1tica Obrigat\u00f3ria: cada dupla tem direito a 1 Pedido de Tempo (Time-out de 20 segundos) durante esses pontos finais \u2014 e \u00e9 OBRIGAT\u00d3RIO usar esse pedido de tempo antes do jogo acabar (por exemplo: quando o advers\u00e1rio chegar a 20x19 ou antes de um saque decisivo)!","Lembrete da Regra Oficial: como a soma dos pontos \u00e9 m\u00faltiplo de 7 (no 18x18 a soma \u00e9 36; quando chegar a 21x20 a soma \u00e9 41; no 21x21 a soma \u00e9 42, m\u00faltiplo de 7!), no 21x21 as duplas trocam de lado na quadra!","Cada dupla joga 3 finais de set seguidos (um come\u00e7ando com o saque, outro recebendo e o terceiro no sorteio)."],"pontosAtencao":["No 18x18, aplique o ritual dos 12 segundos (Se\u00e7\u00e3o 11) antes de cada bola: definam exatamente quem recebe a costura, qual \u00e9 o sinal de bloqueio e qual golpe de seguran\u00e7a v\u00e3o usar.","Quando pedir o Time-out aos 19x20 contra voc\u00ea, use os 20 segundos para mudar o sinal de bloqueio ou mudar o receptor alvo do seu pr\u00f3ximo saque.","Proibido perder o set errando saque na rede no Set Point advers\u00e1rio!"],"erroComum":"Guardar o pedido de tempo e perder o jogo de 21x19 sem ter parado a partida quando o advers\u00e1rio fez 20x19; corrija penalizando a dupla que terminar o mini-set sem ter usado o seu Time-out t\u00e1tico. Varia\u00e7\u00f5es","variacaoFacil":"Come\u00e7ar o placar em 19x19 sem obriga\u00e7\u00e3o do pedido de tempo.","variacaoDificil":"A dupla principal (J1 + J2) come\u00e7a todas as simula\u00e7\u00f5es perdendo por 17 x 19 (precisa buscar 1 ponto de bloqueio/defesa no saque al\u00e9m de virar todos os seus side-outs!).","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a um campeonato de 'Finais de Set 18x18': como cada jogo dura apenas 5 a 8 ralis, as duplas da fila entram a cada 3 minutos j\u00e1 no clima de final de campeonato!","meta":"Vencer pelo menos 2 de 3 simula\u00e7\u00f5es de fim de set (18x18 a 21) utilizando o Time-out estrategicamente e sem cometer erros de saque.","descricaoDiagrama":"Quadra 16x8m oficial com placar central marcando 'FIM DE SET: 18 x 18 (VAI A 21)' e selo de '[1 TIME-OUT OBRIGAT\u00d3RIO]'. Na direita, A1 mostra sinal de bloqueio e A2 saca t\u00e1tico na costura (seta 1). Na esquerda, J1 e J2 executam recep\u00e7\u00e3o segura no centro (seta 2), levantamento (seta 3) e ataque de alta porcentagem (setas 4a/4b) para abrir 2 pontos de vantagem.","codigo":"JOG-AVA-213"},{"numero":214,"secao":13,"nome":"Desafio Supremo de Tie-Break (12x12 at\u00e9 15 pts com confirma\u00e7\u00e3o no Match Point)","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Disputa 2x2 decisiva de encerramento da se\u00e7\u00e3o)","tempo":"12 minutos","material":"6 bolas e placar TIE-BREAK 12x12 (VAI A 15): Troca de lado no 13x12 (Soma 25) + Bola de Confirma\u00e7\u00e3o no Match Point! 13x12 (SOMA 25) = TROCA DE LADO! T J1 J2 A1","objetivo":"Coroar o dom\u00ednio t\u00e9cnico, t\u00e1tico e emocional em situa\u00e7\u00f5es de jogo vencendo um final de Tie-Break com troca de lado a cada 5 pontos e confirma\u00e7\u00e3o de Match Point.","comoMontar":"Quadra oficial 16x8m com Dupla J1 + J2 na esquerda e Dupla A1 + A2 na direita. Placar inicial cravado em 12 x 12 (3\u00ba set / Tie-break at\u00e9 15 pontos).","passoAPasso":["No v\u00f4lei de praia, o 3\u00ba set (Tie-Break) vai at\u00e9 15 pontos com troca de lado a cada 5 pontos somados (soma 5, 10, 15, 20, 25, 30...).","O jogo come\u00e7a em 12 x 12 (soma = 24 pontos): portanto, logo ap\u00f3s o 1\u00ba ponto disputado (quando o placar for a 13 x 12, soma = 25, m\u00faltiplo de 5!), as duplas j\u00e1 precisam TROCAR DE LADO NA QUADRA adaptando-se imediatamente ao vento e ao sol do novo lado!","Regra Especial do Match Point Confirmado: quando uma dupla chegar ao Match Point (ex.: 14 x 12 ou 14 x 13) e vencer o rali do 15\u00ba ponto, o treinador lan\u00e7a imediatamente uma Bola Final do Campeonato na quadra deles para eles confirmarem o \u00faltimo ataque (se errarem a bola de confirma\u00e7\u00e3o, o jogo volta para 14x13!).","\u00c9 obrigat\u00f3rio abrir 2 pontos de diferen\u00e7a E confirmar a Bola Final para ser proclamado campe\u00e3o do desafio!"],"pontosAtencao":["Fique ligado na matem\u00e1tica da troca de lado do Tie-break: 13x12 (soma 25 = TROCA!), 15x15 (soma 30 = TROCA!).","Essa troca constante exige adapta\u00e7\u00e3o instant\u00e2nea ao vento!","No Match Point (14x13), mantenha a agressividade nos p\u00e9s (deslocamento e salto m\u00e1ximo) e a frieza na m\u00e3o (escolha o golpe que o advers\u00e1rio deixou aberto).","Na Bola Final de Confirma\u00e7\u00e3o lan\u00e7ada pelo treinador, comuniquem alto ('Minha! \u2014 Levanta na ponta!') para fechar com chave de ouro."],"erroComum":"Esquecer de trocar de lado quando o placar chega a 13x12 (soma 25) ou relaxar antes de converter a Bola Final de Confirma\u00e7\u00e3o; corrija anunciando em voz alta a contagem da soma dos pontos. Varia\u00e7\u00f5es","variacaoFacil":"Tie-break normal de 12x12 at\u00e9 15 pontos sem a necessidade da bola extra de confirma\u00e7\u00e3o no final.","variacaoDificil":"Se a dupla tiver o Match Point na m\u00e3o e errar o ataque para fora ou na rede, o advers\u00e1rio ganha 2 pontos autom\u00e1ticos virando o Match Point a favor dele!","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a a 'Grande Final da Aula' em chave eliminat\u00f3ria r\u00e1pida de Tie-breaks come\u00e7ando em 12x12: todas as duplas jogam semifinais e final de 3 minutos em clima de est\u00e1dio lotado!","meta":"Vencer o Tie-break saindo de 12x12, adaptando-se perfeitamente \u00e0 troca de lado do 25\u00ba ponto (13x12) e convertendo a Bola Final do Campeonato.","descricaoDiagrama":"Quadra 16x8m vista de cima no Tie-Break 12x12 (vai a 15 pts). Setas tracejadas circulares ao redor dos postes indicam a 'TROCA DE LADO OBRIGAT\u00d3RIA NO 13x12 (SOMA 25)'. No ponto do Match Point: A2 saca (seta 1), J1 passa (2), J2 levanta (3) e J1 mata o ponto (4), recebendo em seguida a Bola Final de Confirma\u00e7\u00e3o do Treinador (T, seta 5) para fechar o jogo.","codigo":"JOG-AVA-214"},{"numero":215,"secao":14,"nome":"Circuito de for\u00e7a de base para pernas (agachamento, afundo e ponte)","nivel":"Iniciante","jogadores":"2 a 3 jogadores (1 em cada esta\u00e7\u00e3o ou dupla sincronizada)","tempo":"10 minutos (3 s\u00e9ries de 40s de execu\u00e7\u00e3o por 30s de descanso)","material":"3 cones demarcando as 3 esta\u00e7\u00f5es na areia FOR\u00c7A BASE SEM EQUIPAMENTO: 3 S\u00e9ries x 40s por Esta\u00e7\u00e3o | Descanso: 30s na troca ESTA\u00c7\u00c3O 1: AGACHAMENTO ESTA\u00c7\u00c3O 2: AFUNDO ESTA\u00c7\u00c3O 3: PONTE GL\u00daTEO J1 J2","objetivo":"Construir resist\u00eancia muscular localizada em quadr\u00edceps, gl\u00fateos e posteriores de coxa usando a instabilidade natural da areia sem equipamentos.","comoMontar":"Na meia-quadra esquerda, posicione 3 cones alinhados a 4 metros da rede, separados por 2,5 metros entre si: Esta\u00e7\u00e3o 1 (Agachamento Isom\u00e9trico + Din\u00e2mico) no topo, Esta\u00e7\u00e3o 2 (Afundo Est\u00e1tico Alternado) no centro e Esta\u00e7\u00e3o 3 (Ponte de Gl\u00fateo na Areia) na parte inferior.","passoAPasso":["\u00cd Os jogadores posicionam-se nas esta\u00e7\u00f5es demarcadas pelos cones.","Esta\u00e7\u00e3o 1 (Agachamento): afaste os p\u00e9s na largura dos ombros, des\u00e7a controlando o movimento at\u00e9 90 graus de flex\u00e3o dos joelhos, segure 2 segundos l\u00e1 embaixo na base de defesa e suba empurrando a areia com o p\u00e9 inteiro.","Esta\u00e7\u00e3o 2 (Afundo Est\u00e1tico): d\u00ea um passo \u00e0 frente na areia, des\u00e7a o joelho de tr\u00e1s em dire\u00e7\u00e3o ao ch\u00e3o mantendo o tronco ereto, suba e troque a perna da frente a cada repeti\u00e7\u00e3o.","Esta\u00e7\u00e3o 3 (Ponte de Gl\u00fateo): deite de barriga para cima na areia com os joelhos dobrados e os calcanhares fincados no ch\u00e3o; eleve o quadril contraindo os gl\u00fateos at\u00e9 alinhar joelhos, quadril e ombros, segure 2 segundos no alto e des\u00e7a devagar.","Volume e Pausa: execute 3 voltas completas nas 3 esta\u00e7\u00f5es, com 40 segundos de atividade em cada cone e 30 segundos de descanso caminhando durante a troca de esta\u00e7\u00e3o. Reduza a amplitude do movimento caso sinta desconforto articular nos joelhos."],"pontosAtencao":["No agachamento e no afundo, mantenha os joelhos alinhados com a ponta do segundo dedo do p\u00e9, evitando que caiam para dentro (valgo din\u00e2mico).","Distribua o peso na planta inteira do p\u00e9 na areia para n\u00e3o sobrecarregar o tend\u00e3o patelar.","Na ponte de gl\u00fateo, suba usando a for\u00e7a do quadril e n\u00e3o arqueando excessivamente a coluna lombar."],"erroComum":"Descer r\u00e1pido demais no agachamento perdendo o alinhamento da coluna; corrija mantendo o peito aberto mirando a fita superior da rede. Varia\u00e7\u00f5es","variacaoFacil":"Reduzir o tempo de est\u00edmulo para 25 segundos por esta\u00e7\u00e3o com 35 segundos de pausa e fazer meia amplitude nos agachamentos.","variacaoDificil":"Na Esta\u00e7\u00e3o 3, executar a ponte de gl\u00fateo de forma unilateral (uma perna estendida no ar, trocando a cada 20 segundos).","paraTurma":"Em turmas de 4 a 12 alunos, coloque de 2 a 4 alunos por esta\u00e7\u00e3o (alinhados lateralmente a 1,5m um do outro). Ao apito do professor a cada 40 segundos, o grupo todo avan\u00e7a para o pr\u00f3ximo cone em sentido hor\u00e1rio.","meta":"Completar as 3 s\u00e9ries mantendo o controle postural e a cad\u00eancia constante de execu\u00e7\u00e3o durante todos os blocos de 40 segundos.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda (a 4m da rede), 3 cones formam 3 esta\u00e7\u00f5es separadas por 2,5m: Esta\u00e7\u00e3o 1 no topo (Agachamento com J1), Esta\u00e7\u00e3o 2 no meio (Afundo com J2) e Esta\u00e7\u00e3o 3 embaixo (Ponte de Gl\u00fateo com J3). Setas tracejadas numeradas 1, 2 e 3 indicam o rod\u00edzio entre as esta\u00e7\u00f5es a cada 40s.","codigo":"FIS-INI-215"},{"numero":216,"secao":14,"nome":"Estabilidade de core e cintura escapular (circuito de pranchas)","nivel":"Iniciante","jogadores":"2 jogadores (lado a lado)","tempo":"9 minutos (3 s\u00e9ries de 30s de est\u00edmulo por 30s de descanso)","material":"4 cones demarcando os postos na areia CORE E ESC\u00c1PULAS NA AREIA: 3 S\u00e9ries x 30s Est\u00edmulo / 30s Pausa (Frontal + Lateral + Toque Ombro) ZONA J1: PRANCHAS 1-2-3 ZONA J2: PRANCHAS 1-2-3 J1 J2 1 2 3","objetivo":"Fortalecer a musculatura profunda do abd\u00f4men, lombar e estabilizadores da esc\u00e1pula para proteger a coluna nos giros de ataque e quedas na areia.","comoMontar":"Na meia-quadra esquerda, posicione 2 cones a 3 metros da rede e 2 cones a 6 metros da rede, criando duas zonas de solo confort\u00e1veis para J1 e J2 trabalharem de frente para a rede.","passoAPasso":["\u00cd S\u00e9rie 1 (Prancha Frontal Baixa): apoie os antebra\u00e7os e as pontas dos p\u00e9s na areia, mantendo o corpo em linha reta da cabe\u00e7a aos calcanhares, contraindo abd\u00f4men e gl\u00fateos.","S\u00e9rie 2 (Prancha Lateral): apoie um antebra\u00e7o na areia e mantenha o quadril elevado lateralmente por 15 segundos de um lado e 15 segundos do outro lado.","S\u00e9rie 3 (Prancha Alta com Toque no Ombro): em posi\u00e7\u00e3o de flex\u00e3o de bra\u00e7os com os p\u00e9s um pouco mais afastados na areia, tire uma m\u00e3o do ch\u00e3o e toque lentamente o ombro oposto sem deixar o quadril balan\u00e7ar para os lados.","Volume e Pausa: realize 3 s\u00e9ries de 30 segundos de execu\u00e7\u00e3o por 30 segundos de descanso para cada varia\u00e7\u00e3o (total de 9 est\u00edmulos curtos). Se o quadril come\u00e7ar a desabar ou a lombar doer, apoie os joelhos na areia imediatamente para reduzir a alavanca."],"pontosAtencao":["Empurre a areia ativamente com os antebra\u00e7os ou m\u00e3os para manter as esc\u00e1pulas firmes e longe das orelhas.","Mantenha a respira\u00e7\u00e3o fluida e cont\u00ednua durante a isometria (n\u00e3o prenda o ar).","Na prancha alta com toque no ombro, afaste os p\u00e9s a 60 cm um do outro para criar uma base antirotacional s\u00f3lida na areia."],"erroComum":"Deixar a regi\u00e3o lombar afundar em dire\u00e7\u00e3o \u00e0 areia por fadiga abdominal; corrija encaixando levemente a pelve para dentro e ativando os gl\u00fateos. Varia\u00e7\u00f5es","variacaoFacil":"Realizar todas as pranchas com os joelhos apoiados na areia fofa e tempo de 20 segundos.","variacaoDificil":"Na prancha frontal, alternar a eleva\u00e7\u00e3o suave de um p\u00e9 de cada vez a 10 cm da areia mantendo o tronco im\u00f3vel.","paraTurma":"Em turmas de 4 a 12 alunos, disponha os alunos em semic\u00edrculo na meia-quadra olhando para o professor no centro. Todos executam os blocos de 30s juntos ao comando do cron\u00f4metro.","meta":"Sustentar os blocos de 30 segundos mantendo o alinhamento neutro da coluna e o quadril est\u00e1vel sem oscila\u00e7\u00f5es laterais.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, duas zonas retangulares demarcadas por cones (aos 3m e aos 6m da rede) com J1 e J2 executando as 3 progress\u00f5es: 1. Prancha Frontal, 2. Prancha Lateral e 3. Prancha Alta com toque no ombro.","codigo":"FIS-INI-216"},{"numero":217,"secao":14,"nome":"Preven\u00e7\u00e3o de tornozelo e joelho: equil\u00edbrio unipodal e alcance em Y","nivel":"Iniciante","jogadores":"2 jogadores","tempo":"9 minutos (3 s\u00e9ries de 8 repeti\u00e7\u00f5es por perna com 40s de descanso)","material":"6 cones pequenos (3 para cada jogador) PREVEN\u00c7\u00c3O TORNOZELO E JOELHO: Apoio Unipodal + Alcance em 'Y' (3 S\u00e9ries x 8 reps/perna | 40s Pausa) J1 1 2 3 J2 Raio de 0,7m nos 3 cones em 1 p\u00e9 s\u00f3","objetivo":"Treinar a propriocep\u00e7\u00e3o do tornozelo e o controle de alinhamento do joelho em apoio de um p\u00e9 s\u00f3 na areia fofa para prevenir entorses nas aterrissagens.","comoMontar":"Para cada jogador (J1 e J2) na meia-quadra esquerda, posicione 3 cones ao redor de um ponto central formando a letra 'Y' a 70 cent\u00edmetros de dist\u00e2ncia: Cone 1 \u00e0 frente, Cone 2 na diagonal traseira direita e Cone 3 na diagonal traseira esquerda.","passoAPasso":["\u00cd J1 e J2 apoiam apenas o p\u00e9 direito no centro do 'Y' na parte de areia fofa, mantendo o joelho de apoio destravado (levemente flexionado) e as m\u00e3os na cintura.","Com a perna esquerda suspensa no ar, o jogador flexiona o joelho de apoio e estende suavemente a ponta do p\u00e9 livre para tocar de leve no Cone 1 (\u00e0 frente), voltando ao centro sem apoiar o p\u00e9 livre no ch\u00e3o.","Em seguida, leva o p\u00e9 livre para tocar no Cone 2 (diagonal traseira externa) e depois no Cone 3 (diagonal traseira cruzando por tr\u00e1s da perna de apoio), voltando sempre \u00e0 postura ereta em 1 p\u00e9 s\u00f3.","Volume e Pausa: fa\u00e7a 3 s\u00e9ries de 8 giros completos no Y (4 para a perna direita e 4 para a perna esquerda), com 40 segundos de descanso entre as s\u00e9ries. Caso perca o equil\u00edbrio constantemente, alise a areia para deix\u00e1-la mais plana e reduza a dist\u00e2ncia dos cones."],"pontosAtencao":["Os dedos do p\u00e9 que est\u00e1 na areia devem 'agarrar' o ch\u00e3o ativamente, trabalhando a musculatura intr\u00ednseca do p\u00e9.","Mantenha a patela do joelho de apoio apontando sempre para o Cone 1 da frente, sem deixar o joelho tremer para dentro.","Fa\u00e7a o movimento em c\u00e2mera lenta (3 segundos para ir e 3 segundos para voltar): a qualidade do equil\u00edbrio vale mais que a velocidade."],"erroComum":"Travar o joelho de apoio totalmente esticado e inclinar apenas as costas para frente; corrija exigindo que o alcance venha da flex\u00e3o do quadril e do joelho da perna de base. Varia\u00e7\u00f5es","variacaoFacil":"Aproximar os cones para 40 cm do p\u00e9 central e permitir tocar a ponta do p\u00e9 na areia entre uma dire\u00e7\u00e3o e outra.","variacaoDificil":"Segurar uma bola de v\u00f4lei nas m\u00e3os e pass\u00e1-la ao redor da cintura enquanto executa o alcance nos 3 cones em um p\u00e9 s\u00f3.","paraTurma":"Em turmas de 4 a 12 alunos, cada aluno desenha 3 riscos na areia ao seu redor formando o 'Y' (n\u00e3o precisa de cones para todos) e trabalha simultaneamente ao comando do professor.","meta":"Completar 4 ciclos seguidos nos 3 pontos do Y com cada perna sem precisar apoiar o p\u00e9 livre na areia para se salvar.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 (no topo) e J2 (embaixo) posicionados em apoio unipodal no centro de um tri\u00e2ngulo/Y de 3 cones a 0,7m de raio: Cone 1 frontal, Cone 2 diagonal externa e Cone 3 diagonal cruzada. Setas curtas 1, 2 e 3 indicam o alcance da perna livre.","codigo":"FIS-INI-217"},{"numero":218,"secao":14,"nome":"Sa\u00fade do ombro e lombar: circuito postural Y-T-W e extens\u00e3o na areia","nivel":"Iniciante","jogadores":"2 jogadores","tempo":"8 minutos (3 s\u00e9ries de 10 repeti\u00e7\u00f5es controladas por 30s de descanso)","material":"2 cones para marcar o alinhamento SA\u00daDE DO OMBRO E LOMBAR: Circuito Y - T - W na Areia (3 S\u00e9ries x 10 reps lentas | 30s Pausa) J1 J2 Y T W","objetivo":"Ativar e fortalecer os retratores da esc\u00e1pula, manguito rotador posterior e paravertebrais lombares, prevenindo sobrecarga no ombro de ataque e saque.","comoMontar":"Na meia-quadra esquerda, J1 e J2 deitam-se de barriga para baixo (dec\u00fabito ventral) sobre a areia nivelada, a 4 metros da rede, com espa\u00e7o livre de 2 metros ao redor dos bra\u00e7os.","passoAPasso":["\u00cd Deitado de peito na areia com a testa quase tocando o solo (olhar para baixo mantendo a cervical neutra) e gl\u00fateos levemente contra\u00eddos:","Posi\u00e7\u00e3o 'Y' (3 repeti\u00e7\u00f5es): estenda os dois bra\u00e7os acima da cabe\u00e7a formando a letra Y com os polegares apontados para o c\u00e9u; tire os bra\u00e7os 10 cm da areia unindo as esc\u00e1pulas, segure 2 segundos e des\u00e7a.","Posi\u00e7\u00e3o 'T' (3 repeti\u00e7\u00f5es): abra os bra\u00e7os lateralmente na linha dos ombros formando a letra T (polegares para cima); eleve os bra\u00e7os 10 cm da areia apertando o meio das costas por 2 segundos e des\u00e7a.","Posi\u00e7\u00e3o 'W' + Extens\u00e3o Alternada (4 repeti\u00e7\u00f5es): dobre os cotovelos a 90 graus ao lado das costelas formando um W, gire os punhos para cima e finalize elevando bra\u00e7o direito junto com perna esquerda (e vice-versa).","Volume e Pausa: execute 3 s\u00e9ries de 10 repeti\u00e7\u00f5es totais (3 em Y + 3 em T + 4 em W/Alternado) com 30 segundos de descanso entre as s\u00e9ries. Se sentir pin\u00e7amento na parte frontal do ombro, diminua a altura de eleva\u00e7\u00e3o dos bra\u00e7os."],"pontosAtencao":["Mantenha os polegares sempre apontados para o alto: isso gira o ombro externamente e cria espa\u00e7o livre na articula\u00e7\u00e3o.","N\u00e3o puxe os ombros na dire\u00e7\u00e3o das orelhas (trap\u00e9zio superior); puxe as esc\u00e1pulas para baixo em dire\u00e7\u00e3o ao bolso do cal\u00e7\u00e3o.","Mantenha o umbigo levemente recolhido para proteger a lombar."],"erroComum":"Levantar o queixo olhando para frente e for\u00e7ar o pesco\u00e7o em vez de usar os m\u00fasculos das costas; corrija mantendo o nariz apontado para a areia durante toda a s\u00e9rie. Varia\u00e7\u00f5es","variacaoFacil":"Realizar o movimento Y-T-W em p\u00e9 com o tronco inclinado a 45 graus \u00e0 frente e joelhos semiflexionados.","variacaoDificil":"Segurar 3 segundos de isometria no ponto mais alto de cada letra (Y, T e W) antes de trocar a posi\u00e7\u00e3o.","paraTurma":"Em turmas de 4 a 12 alunos, todos se alinham deitados sobre a linha lateral ou central a 2 metros de dist\u00e2ncia uns dos outros, seguindo a contagem cadenciada do professor.","meta":"Executar as 3 s\u00e9ries de 10 repeti\u00e7\u00f5es lentas sentindo a ativa\u00e7\u00e3o entre as esc\u00e1pulas e sem compensar com o pesco\u00e7o.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda (a 4m da rede), J1 e J2 posicionados no solo executando a sequ\u00eancia de estabilidade escapular e lombar: 1. Bra\u00e7os em diagonal (Y), 2. Bra\u00e7os abertos a 90\u00b0 (T) e 3. Cotovelos flexionados (W) com extens\u00e3o alternada.","codigo":"FIS-INI-218"},{"numero":219,"secao":14,"nome":"Pliometria b\u00e1sica com aterrissagem amortecida (salto vertical + horizontal)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"10 minutos (4 s\u00e9ries de 6 saltos combinados com 60s de descanso)","material":"4 cones demarcando corredores de 4,5 metros PLIOMETRIA E ATERRISSAGEM: 4 S\u00e9ries x 6 Saltos (Vertical + Horizontal 1,5m c/ pausa 2s) | 60s Pausa J1 J2 1 2 3 Congelar 2s na base baixa em cada queda (4,5m totais) Quadra 16x8m vista de cima. Na meia-quadra esquerda, dois corredores de 4,5m","objetivo":"Aprender a gerar pot\u00eancia el\u00e1stica na areia fofa e absorver o impacto da queda com tornozelos, joelhos e quadril alinhados.","comoMontar":"Na meia-quadra esquerda, monte dois corredores paralelos da linha de fundo (8m) at\u00e9 os 3,5m da rede. J1 e J2 come\u00e7am nos cones da linha de fundo.","passoAPasso":["\u00cd J1 e J2 iniciam em base atl\u00e9tica nos cones de sa\u00edda.","Salto 1 (Vertical): lance os bra\u00e7os para cima e execute um salto vertical m\u00e1ximo no lugar, aterrissando na areia com os dois p\u00e9s simultaneamente em meio-agachamento e segurando a posi\u00e7\u00e3o congelada por 2 segundos.","Salto 2 (Horizontal Curto): a partir dessa base congelada, impulsione a areia saltando 1,5 metro para a frente, aterrissando novamente de forma suave e silenciosa com os joelhos flexionados por mais 2 segundos.","Repita a combina\u00e7\u00e3o (1 Salto Vertical + 1 Salto Horizontal de 1,5m) por 3 vezes at\u00e9 completar os 4,5 metros do corredor (totalizando 6 saltos por passagem).","Volume e Pausa: cumpra 4 s\u00e9ries de 6 saltos (3 verticais + 3 horizontais), retornando em caminhada lenta durante os 60 segundos de descanso completo entre as s\u00e9ries. Reduza a altura do salto caso perceba que os joelhos est\u00e3o tremendo na queda."],"pontosAtencao":["O foco principal est\u00e1 na ATERRISSAGEM: amorte\u00e7a a queda tocando primeiro o antep\u00e9 e logo em seguida o calcanhar na areia, flexionando quadril e joelhos juntos.","Nunca pule de novo imediatamente se voc\u00ea caiu desequilibrado: estabilize os 2 segundos na base antes do pr\u00f3ximo salto.","Use o balan\u00e7o vigoroso dos dois bra\u00e7os para ajudar a sair da areia fofa."],"erroComum":"Aterrissar com as pernas duras e retas ou deixar os dois joelhos se baterem no meio; corrija pedindo uma 'queda macia' com o quadril recuado para tr\u00e1s. Varia\u00e7\u00f5es","variacaoFacil":"Fazer apenas 4 saltos verticais no lugar por s\u00e9rie focando exclusivamente na mec\u00e2nica de amortecimento da queda.","variacaoDificil":"Eliminar a pausa de 2 segundos entre o salto vertical e o salto horizontal (assim que tocar a areia do salto vertical, j\u00e1 explodir para a frente de forma reativa).","paraTurma":"Em turmas de 4 a 12 alunos, forme 3 ou 4 colunas na linha de fundo. A primeira onda executa os 6 saltos at\u00e9 o meio da quadra e volta caminhando pelas laterais externas enquanto a segunda onda inicia.","meta":"Realizar as 4 s\u00e9ries de 6 saltos mantendo 100% das aterrissagens equilibradas por 2 segundos sem passos extras de desequil\u00edbrio.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, dois corredores de 4,5m saem da linha de fundo (8m) at\u00e9 os 3,5m da rede. J1 e J2 executam a sequ\u00eancia alternada ao longo do corredor: Salto Vertical no lugar (1), avan\u00e7o em Salto Horizontal de 1,5m (2), novo Salto Vertical (3) e avan\u00e7o final (4), retornando pelas laterais no descanso de 60s.","codigo":"FIS-INT-219"},{"numero":220,"secao":14,"nome":"Pliometria lateral sobre linha de cones (pot\u00eancia frontal e estabiliza\u00e7\u00e3o)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"10 minutos (4 s\u00e9ries de 8 saltos laterais com 60s de descanso)","material":"8 cones baixos formando duas linhas de 4 cones PLIOMETRIA LATERAL SOBRE CONES: 4 S\u00e9ries x 8 Saltos (4 Ida + 4 Volta) | 60s Descanso J1J2 1 4 8 Quadra 16x8m vista de cima. Na meia-quadra esquerda, duas linhas de 4 cones","objetivo":"Desenvolver pot\u00eancia de impuls\u00e3o lateral na areia e estabilidade de tornozelo para sa\u00eddas explosivas de bloqueio e defesa.","comoMontar":"Na meia-quadra esquerda, monte duas fileiras de 4 cones baixos (uma fileira aos 3m da rede para J1 e outra aos 6m da rede para J2), com 1,2 metro de dist\u00e2ncia entre cada cone na mesma fileira.","passoAPasso":["\u00cd J1 e J2 posicionam-se de lado para o primeiro cone da sua fileira (p\u00e9s paralelos na largura dos quadris).","Impulsionam a areia com os dois p\u00e9s juntos saltando lateralmente por cima do 1\u00ba cone, aterrissam amortecendo no espa\u00e7o entre os cones e prosseguem saltando sobre os 4 cones (ida = 4 saltos laterais para a direita).","Ao passar pelo 4\u00ba cone, estabilizam por 1 segundo e retornam imediatamente fazendo 4 saltos laterais para a esquerda at\u00e9 a origem (total de 8 saltos laterais cont\u00ednuos).","Volume e Pausa: realize 4 s\u00e9ries de 8 saltos laterais (4 de ida + 4 de volta) com 60 segundos de descanso entre cada s\u00e9rie. Se sentir fadiga nas panturrilhas, fa\u00e7a uma pausa de 1 segundo entre cada cone em vez de saltar direto."],"pontosAtencao":["Puxe os joelhos levemente em dire\u00e7\u00e3o ao peito na fase a\u00e9rea para limpar a altura do cone sem entortar os p\u00e9s para o lado.","Empurre a areia com a borda interna do p\u00e9 de tr\u00e1s para gerar impulso lateral verdadeiro.","Mantenha o tronco e o olhar voltados para a rede durante toda a s\u00e9rie."],"erroComum":"Saltar girando o quadril de frente para os cones (transformando em salto frontal) ou bater um p\u00e9 no outro na queda; corrija mantendo uma dist\u00e2ncia de um palmo entre os dois p\u00e9s durante todo o voo e aterrissagem. Varia\u00e7\u00f5es","variacaoFacil":"Passar pelos cones com saltos laterais baixos sem obst\u00e1culo (usando apenas riscos desenhados na areia).","variacaoDificil":"Nas 2 \u00faltimas s\u00e9ries, realizar a ida (4 saltos) em apoio unipodal (um p\u00e9 s\u00f3) com a perna direita e a volta com a perna esquerda, pausando 2 segundos em cada queda.","paraTurma":"Em turmas de 4 a 12 alunos, monte 3 fileiras de 4 cones na quadra. Tr\u00eas alunos saltam simultaneamente e d\u00e3o lugar ao pr\u00f3ximo trio da fila durante o seu minuto de recupera\u00e7\u00e3o.","meta":"Completar as 4 s\u00e9ries de 8 saltos laterais sem derrubar nenhum cone e mantendo o alinhamento frontal do peito para a rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, duas linhas de 4 cones dispostas aos 3m (J1) e aos 6m da rede (J2). Setas curvas tracejadas numeradas de 1 a 4 (ida) e 5 a 8 (volta) mostram os saltos pliom\u00e9tricos laterais por cima dos cones.","codigo":"FIS-INT-220"},{"numero":221,"secao":14,"nome":"Sprints curtos de 3m, 5m e 8m (vai-e-vem de acelera\u00e7\u00e3o e frenagem)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"10 minutos (4 s\u00e9ries de 1 vai-e-vem completo por 60s de descanso)","material":"8 cones demarcando as marcas de 0m, 3m, 5m e 8m SPRINTS CURTOS VAI-E-VEM (3m, 5m e 8m): 4 S\u00e9ries x 1 Percurso Completo | 60s\u201375s Descanso J1 J2 1 2 3 3m 5m 8m (Rede) Quadra 16x8m vista de cima. Na meia-quadra esquerda, cones marcam a sa\u00edda na","objetivo":"Treinar a pot\u00eancia de arrancada nos primeiros 3 passos na areia fofa e a capacidade de desacelerar baixando o centro de gravidade.","comoMontar":"Na meia-quadra esquerda, monte duas raias paralelas da linha de fundo at\u00e9 a rede colocando cones na linha de fundo (0m), aos 3 metros, aos 5 metros e junto \u00e0 rede (8 metros).","passoAPasso":["\u00cd J1 e J2 partem da linha de fundo (0m) em posi\u00e7\u00e3o baixa de largada (um p\u00e9 \u00e0 frente do outro).","Arrancada 1 (3 metros): ao sinal, explodem at\u00e9 o cone de 3m, freiam afundando o quadril, tocam a areia com a m\u00e3o direita e voltam de frente/diagonal at\u00e9 tocar a linha de fundo (0m).","Arrancada 2 (5 metros): sem parar, viram e explodem at\u00e9 o cone de 5m, tocam a areia com a m\u00e3o esquerda e voltam at\u00e9 a linha de fundo (0m).","Arrancada 3 (8 metros): partem para o sprint final at\u00e9 a linha da rede (8m), simulam um salto curto de bloqueio na fita e encerram a passagem na rede.","Volume e Pausa: execute 4 s\u00e9ries de 1 percurso completo (3m + 5m + 8m = 24 metros de acelera\u00e7\u00e3o/frenagem) com 60 a 75 segundos de descanso caminhando de volta ao fundo. Reduza para apenas as dist\u00e2ncias de 3m e 5m caso a t\u00e9cnica de corrida se degrade no final."],"pontosAtencao":["Nos primeiros 3 passos de cada sa\u00edda, mantenha o tronco inclinado a 45 graus para frente e passos curtos e r\u00e1pidos tracionando a areia.","Para frear em cada cone sem escorregar na areia, baixe o quadril no pen\u00faltimo passo e crave o p\u00e9 de fora virando de lado.","Alterne a m\u00e3o que toca a areia em cada cone para distribuir o esfor\u00e7o de rota\u00e7\u00e3o do tronco."],"erroComum":"Tentar frear em p\u00e9 com os joelhos esticados em cima do cone, escorregando meio metro al\u00e9m da marca; corrija pedindo para afundar o centro de gravidade 2 passos antes do cone. Varia\u00e7\u00f5es","variacaoFacil":"Fazer apenas o vai-e-vem de 3m e 5m (poupando o sprint final de 8m).","variacaoDificil":"Fazer os retornos dos cones de 3m e 5m at\u00e9 a linha de fundo em deslocamento defensivo de costas/diagonal mantendo o olhar na rede.","paraTurma":"Em turmas de 4 a 12 alunos, posicione at\u00e9 4 colunas sobre a linha de fundo. As ondas de 4 alunos saem a cada 25 segundos e retornam caminhando por fora das linhas laterais.","meta":"Completar cada passagem do vai-e-vem (3m-5m-8m) abaixo de 12 segundos mantendo frenagens limpas em todas as linhas.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, cones marcam a sa\u00edda na linha de fundo (0m) e as dist\u00e2ncias de 3m, 5m e 8m (rede). Setas tracejadas numeradas mostram o percurso de J1 e J2: 1 (ida aos 3m e volta ao 0m), 2 (ida aos 5m e volta ao 0m) e 3 (sprint final at\u00e9 os 8m na rede).","codigo":"FIS-INT-221"},{"numero":222,"secao":14,"nome":"Agilidade multidirecional no padr\u00e3o em 'T' na areia","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (revezando no circuito)","tempo":"10 minutos (4 s\u00e9ries de 2 repeti\u00e7\u00f5es por 45s de descanso)","material":"4 cones montados em formato de T AGILIDADE NO PADR\u00c3O EM 'T': 4 S\u00e9ries x 2 Passagens (5m Frente + 3m/6m Lateral + 5m Recuo) | 45s Pausa J1 J2 1 2 3 4 5","objetivo":"Combinar num mesmo est\u00edmulo os tr\u00eas deslocamentos fundamentais do v\u00f4lei de praia: arrancada frontal, passada lateral e recuo controlado.","comoMontar":"Na meia-quadra esquerda, monte um 'T' com 4 cones: Cone A na linha de fundo central (sa\u00edda), Cone B 5 metros \u00e0 frente (a 3m da rede, centro do T), Cone C 3 metros \u00e0 esquerda de B e Cone D 3 metros \u00e0 direita de B.","passoAPasso":["\u00cd J1 inicia no Cone A (base do T na linha de fundo).","Trecho 1: corre de frente em velocidade por 5 metros at\u00e9 o Cone B (centro) e toca sua ponta.","Trecho 2: olhando sempre para a rede, desloca-se em passada lateral r\u00e1pida por 3 metros para a esquerda at\u00e9 tocar o Cone C.","Trecho 3: inverte a dire\u00e7\u00e3o e atravessa os 6 metros de largura em passada lateral/cruzada at\u00e9 tocar o Cone D na direita.","Trecho 4: volta lateralmente 3 metros at\u00e9 o Cone B (centro) e finaliza recuando de costas/diagonal por 5 metros at\u00e9 cruzar o Cone A inicial.","Volume e Pausa: cada jogador realiza 4 s\u00e9ries de 2 passagens pelo T (na 1\u00aa vai primeiro para a esquerda C; na 2\u00aa vai primeiro para a direita D), descansando 45 segundos enquanto o parceiro J2 executa a sua vez."],"pontosAtencao":["Mantenha o peito e os olhos voltados para a rede durante toda a barra superior do T (trechos 2, 3 e 4).","N\u00e3o cruze os p\u00e9s na sa\u00edda lateral curta do Cone B para o Cone C: mantenha o quadril baixo empurrando a areia.","No recuo final do Cone B para o Cone A, mantenha o peso no antep\u00e9 para n\u00e3o cair sentado."],"erroComum":"Levantar o tronco nos trechos laterais e bater um tornozelo no outro; corrija mantendo os joelhos flexionados na mesma linha horizontal do in\u00edcio ao fim. Varia\u00e7\u00f5es","variacaoFacil":"Reduzir a haste frontal para 4 metros e as laterais para 2 metros de cada lado.","variacaoDificil":"No Cone B (centro), o parceiro J2 fica na rede e grita apenas quando J1 chega l\u00e1 se ele deve ir primeiro para a 'ESQUERDA!' ou 'DIREITA!'.","paraTurma":"Em turmas de 4 a 12 alunos, monte dois circuitos em 'T' (um na meia-quadra esquerda e outro na meia-quadra direita), dividindo at\u00e9 6 alunos por circuito em fila fluida.","meta":"Completar cada passagem no circuito em 'T' em menos de 11 segundos sem cruzar os p\u00e9s nas trocas de dire\u00e7\u00e3o.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 4 cones formam um 'T': Cone A no fundo, Cone B 5m \u00e0 frente no centro, Cone C 3m acima e Cone D 3m abaixo. Setas tracejadas numeradas mostram a rota de J1: 1 (sprint frontal AB), 2 (lateral BC), 3 (travessia CD), 4 (retorno DB) e 5 (recuo BA).","codigo":"FIS-INT-222"},{"numero":223,"secao":14,"nome":"Agilidade no padr\u00e3o em 'X' (cortes em diagonais curtas e longas)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"10 minutos (4 s\u00e9ries de 1 volta completa no X por 60s de descanso)","material":"4 cones formando um quadrado de 6x6 metros AGILIDADE EM 'X' (QUADRADOS 6x6m): 4 S\u00e9ries x 1 Volta Completa (Diagonais 8,5m + Rede 6m) | 60s Pausa J1 J2 1 2 3","objetivo":"Treinar as mudan\u00e7as de dire\u00e7\u00e3o em \u00e2ngulo agudo (45 graus) que simulam a transi\u00e7\u00e3o entre buscar uma bola de lob no fundo e uma largada na diagonal oposta.","comoMontar":"Na meia-quadra esquerda, posicione 4 cones formando um quadrado de 6 x 6 metros: Cone 1 (fundo superior), Cone 2 (rede inferior - diagonal oposta), Cone 3 (rede superior) e Cone 4 (fundo inferior).","passoAPasso":["\u00cd J1 come\u00e7a no Cone 1 (fundo superior).","Perna 1 (Diagonal de 8,5m): corre em sprint diagonal cruzando toda a quadra at\u00e9 o Cone 2 (perto da rede no lado inferior) e freia com o p\u00e9 externo.","Perna 2 (Lateral na Rede de 6m): desloca-se paralelo \u00e0 rede em passada lateral/cruzada do Cone 2 at\u00e9 o Cone 3 (rede superior), onde realiza 1 salto vertical de bloqueio.","Perna 3 (Diagonal de Recuo de 8,5m): ao aterrissar no Cone 3, abre o quadril e corre em diagonal de recuo (como se buscasse um lob) at\u00e9 o Cone 4 (fundo inferior).","Perna 4 (Fundo de 6m): desloca-se lateralmente na linha de fundo do Cone 4 de volta ao Cone 1 inicial, fechando a ampulheta/X.","Volume e Pausa: cumpra 4 s\u00e9ries de 1 volta completa no X (invertendo o lado de sa\u00edda nas s\u00e9ries pares) com 60 segundos de descanso enquanto J2 realiza o circuito."],"pontosAtencao":["Nos v\u00e9rtices do X (Cones 2, 3 e 4), plante o p\u00e9 de fora com firmeza na areia para cortar o \u00e2ngulo de 45 graus sem derrapar.","Na Perna 3 (recuo diagonal do Cone 3 para o Cone 4), corra de frente olhando por cima do ombro para o centro da rede.","Controle o ritmo respirat\u00f3rio para manter a explos\u00e3o at\u00e9 a \u00faltima perna do X."],"erroComum":"Fazer curvas abertas e redondas ao redor dos cones por n\u00e3o baixar o quadril na frenagem; corrija passando por dentro dos cones e cravando a borda interna do p\u00e9. Varia\u00e7\u00f5es","variacaoFacil":"Montar o quadrado menor (4 x 4 metros) e realizar sem o salto de bloqueio no Cone 3.","variacaoDificil":"Incluir 1 salto de bloqueio no Cone 2 e outro no Cone 3, al\u00e9m de tocar o peito na areia (meio burpee) no Cone 4.","paraTurma":"Em turmas de 4 a 12 alunos, o pr\u00f3ximo aluno da fila j\u00e1 pode iniciar no Cone 1 assim que o colega da frente chegar ao Cone 3, mantendo 2 alunos no circuito sem risco de colis\u00e3o.","meta":"Concluir a volta completa no circuito em 'X' abaixo de 14 segundos mantendo cortes precisos nos 4 cones.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 4 cones formam um quadrado de 6x6m. Setas tracejadas desenham o 'X': 1 (diagonal de avan\u00e7o do Cone 1 ao Cone 2), 2 (subida pela rede do Cone 2 ao Cone 3 com salto), 3 (diagonal de recuo do Cone 3 ao Cone 4) e 4 (fechamento no fundo do Cone 4 ao Cone 1).","codigo":"FIS-INT-223"},{"numero":224,"secao":14,"nome":"Impuls\u00e3o de bloqueio em sequ\u00eancia (3 pontos da rede)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"10 minutos (4 s\u00e9ries de 6 saltos m\u00e1ximos por 60s de descanso)","material":"3 cones posicionados junto \u00e0 rede IMPULS\u00c3O DE BLOQUEIO EM SEQU\u00caNCIA: 4 S\u00e9ries x 6 Saltos Verticais na Rede | 60s Descanso SALTO 1/6 SALTO 2/5 SALTO 3/4 J1 J2 1 2","objetivo":"Desenvolver pot\u00eancia repetida de salto vertical na areia fofa ap\u00f3s deslocamento lateral curto junto \u00e0 rede.","comoMontar":"Junto \u00e0 rede da meia-quadra esquerda (a 40 cm da fita), posicione 3 cones: Cone 1 na entrada esquerda (a 1,5m da antena), Cone 2 no centro da rede e Cone 3 na sa\u00edda direita (a 1,5m da outra antena).","passoAPasso":["\u00cd J1 come\u00e7a no Cone 1 (esquerda) em postura pronta de bloqueio (joelhos flexionados e m\u00e3os na altura dos ombros).","Executa o 1\u00ba salto vertical m\u00e1ximo invadindo os bra\u00e7os por cima da fita da rede.","Assim que aterrissa na areia de forma amortecida, usa o passo lateral/cruzado r\u00e1pido por 2,5 metros at\u00e9 o Cone 2 (centro), para os dois p\u00e9s e executa o 2\u00ba salto m\u00e1ximo.","Desloca-se at\u00e9 o Cone 3 (direita) para o 3\u00ba salto; em seguida faz o caminho inverso (4\u00ba salto no Cone 3, 5\u00ba salto no Cone 2 e 6\u00ba salto final no Cone 1).","Volume e Pausa: realize 4 s\u00e9ries de 6 saltos de bloqueio m\u00e1ximos com 60 segundos de descanso completo (revezando com J2). Caso o atleta comece a tocar na rede por fadiga nas pernas, reduza para 4 saltos por s\u00e9rie."],"pontosAtencao":["N\u00e3o sacrifique a altura do salto pela pressa: pare os dois p\u00e9s paralelos na areia em cada cone e salte o mais alto poss\u00edvel.","Mantenha as m\u00e3os sempre acima da linha do peito durante a transi\u00e7\u00e3o entre um cone e outro.","Amorte\u00e7a cada descida antes de iniciar o passo lateral para proteger o tend\u00e3o calc\u00e2neo (Aquiles)."],"erroComum":"Pular ainda deslizando de lado na areia e cair desequilibrado em um p\u00e9 s\u00f3; corrija exigindo parada total dos dois p\u00e9s antes de cada um dos 6 saltos. Varia\u00e7\u00f5es","variacaoFacil":"Realizar apenas 1 passagem de ida (3 saltos totais por s\u00e9rie: Esquerda -> Meio -> Direita).","variacaoDificil":"J2 fica do outro lado da rede segurando duas bolas no alto nos Cones 1 e 3, exigindo que J1 toque com as duas m\u00e3os nas bolas em cada salto.","paraTurma":"Em turmas de 4 a 12 alunos, utilize os dois lados da rede (2 alunos saltando ao mesmo tempo \u2014 um no lado esquerdo da rede e outro no lado direito, frente a frente em espelho).","meta":"Completar as 4 s\u00e9ries de 6 saltos alcan\u00e7ando com os punhos acima da fita superior em todos os 24 saltos, com zero toques na rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. Junto \u00e0 rede da meia-quadra esquerda, 3 cones marcam os postos de salto (1: Ponta Superior, 2: Centro, 3: Ponta Inferior). Setas tracejadas de ida e volta mostram o deslocamento lateral de J1 ao longo da rede executando os 6 saltos verticais de bloqueio.","codigo":"FIS-INT-224"},{"numero":225,"secao":14,"nome":"Impuls\u00e3o de ataque ap\u00f3s recuo em V e chamada de 3 passos","nivel":"Avan\u00e7ado","jogadores":"2 jogadores","tempo":"11 minutos (4 s\u00e9ries de 6 sequ\u00eancias de recuo + salto com 75s de descanso)","material":"4 cones demarcando os pontos de recuo e de salto IMPULS\u00c3O DE ATAQUE AP\u00d3S RECUO: 4 S\u00e9ries x 6 Saltos (Recuo aos 4,5m + Chamada 3 Passos) | 75s Pausa SALTO 1-3 SALTO 4-6 J1 J2 1 2 3","objetivo":"Treinar a pot\u00eancia espec\u00edfica das pernas para recuar na areia, frear e imediatamente explodir na passada de 3 apoios para o salto m\u00e1ximo de ataque.","comoMontar":"Na meia-quadra esquerda, posicione 2 cones de salto a 1,5m da rede (Ponta Esquerda e Ponta Direita) e 2 cones de transi\u00e7\u00e3o recuados a 4,5m da rede. J1 come\u00e7a na rede.","passoAPasso":["\u00cd J1 come\u00e7a no cone de 1,5m da rede na ponta esquerda.","Abre o quadril e recua r\u00e1pido na areia at\u00e9 o cone de 4,5 metros, onde planta o p\u00e9 de tr\u00e1s.","Sem pausa no cone de 4,5m, acelera a chamada de 3 passos ('esquerda-direita-esquerda'), lan\u00e7a os dois bra\u00e7os para cima e executa um salto m\u00e1ximo de ataque a 1,5m da rede simulando a batida no ponto mais alto.","Ao aterrissar equilibrado, repete o recuo e o salto mais 2 vezes na ponta esquerda (3 saltos) e atravessa trotando para fazer mais 3 recuos + saltos na ponta direita (total de 6 saltos de ataque na s\u00e9rie).","Volume e Pausa: cumpra 4 s\u00e9ries de 6 saltos de ataque ap\u00f3s recuo, com 75 segundos de descanso entre as s\u00e9ries (enquanto J2 trabalha). Se a altura do salto cair visivelmente no 5\u00ba e 6\u00ba saltos, encerre a s\u00e9rie no 4\u00ba salto para preservar a qualidade."],"pontosAtencao":["A transi\u00e7\u00e3o entre o \u00faltimo passo de recuo nos 4,5m e o primeiro passo para frente deve ser el\u00e1stica, empurrando a areia com o antep\u00e9.","Nos dois \u00faltimos passos antes do salto, plante os dois p\u00e9s quase juntos na areia fofa e use a alavanca m\u00e1xima dos dois bra\u00e7os.","Caia sobre os dois p\u00e9s no mesmo ponto de onde decolou (a 1,5m da rede)."],"erroComum":"Correr devagar na chamada e pular para a frente ('salto em dist\u00e2ncia') em vez de converter a velocidade em altura vertical; corrija marcando um quadrado na areia de onde o jogador deve saltar e onde deve pousar. Varia\u00e7\u00f5es","variacaoFacil":"Reduzir para 4 saltos por s\u00e9rie (2 na esquerda e 2 na direita) com 5 segundos de caminhada no meio.","variacaoDificil":"Incluir 1 salto de bloqueio na rede antes de iniciar cada recuo para os 4,5m (Salta Bloco -> Recua 4,5m -> Entra e Salta Ataque).","paraTurma":"Em turmas de 4 a 12 alunos, trabalhe com duas filas simult\u00e2neas (uma na entrada esquerda e outra na sa\u00edda direita). Os alunos fazem 3 saltos seguidos em um lado e trocam de fila durante o descanso.","meta":"Sustentar a pot\u00eancia m\u00e1xima de impuls\u00e3o e coordena\u00e7\u00e3o de bra\u00e7os durante os 6 saltos de cada uma das 4 s\u00e9ries.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, cones a 4,5m da rede (base de recuo) e cones a 1,5m da rede (zona de decolagem) nas duas pontas. Setas tracejadas mostram J1 recuando da rede at\u00e9 os 4,5m (seta 1) e explodindo na passada de ataque at\u00e9 os 1,5m (seta 2), repetindo 3x no topo e 3x embaixo.","codigo":"FIS-AVA-225"},{"numero":226,"secao":14,"nome":"Agilidade reativa em Estrela (5 pontas de velocidade e rea\u00e7\u00e3o)","nivel":"Avan\u00e7ado","jogadores":"2 jogadores (1 no centro da estrela e 1 comandante na rede)","tempo":"10 minutos (4 s\u00e9ries de 20s de est\u00edmulo m\u00e1ximo por 40s de descanso)","material":"6 cones (1 central e 5 nas pontas da estrela) AGILIDADE REATIVA EM ESTRELA (5 PONTAS): 4 S\u00e9ries x 20s Est\u00edmulo M\u00e1ximo / 40s Pausa J1 J2 1 2 3","objetivo":"Aprimorar a velocidade de rea\u00e7\u00e3o neuromuscular e a capacidade de acelerar e retornar \u00e0 base em todos os \u00e2ngulos da quadra.","comoMontar":"Na meia-quadra esquerda, coloque 1 Cone Base no centro (a 4,5m da rede) e 5 Cones ao redor a 3 metros de dist\u00e2ncia formando uma Estrela de 5 pontas numeradas: 1 (Curta Esquerda), 2 (Centro Rede), 3 (Curta Direita), 4 (Fundo Direito) e 5 (Fundo Esquerdo).","passoAPasso":["\u00cd J1 posiciona-se no Cone Base central em skipping baixo (mexendo rapidamente a ponta dos p\u00e9s na areia); J2 fica na rede de frente para J1 controlando o tempo.","Ao iniciar o cron\u00f4metro de 20 segundos, J2 grita aleatoriamente um n\u00famero de 1 a 5 (ex.: '4!').","J1 explode do centro at\u00e9 o Cone 4 usando a passada t\u00e9cnica daquele \u00e2ngulo, toca o cone com a m\u00e3o e retorna em velocidade m\u00e1xima ao Cone Base central.","No exato instante em que J1 pisa no Cone Base, J2 j\u00e1 chama o pr\u00f3ximo n\u00famero ('2!', '5!', '1!') sem deixar J1 parar, mantendo a intensidade m\u00e1xima durante os 20 segundos.","Volume e Pausa: realize 4 s\u00e9ries de 20 segundos de est\u00edmulo al\u00e1tico m\u00e1ximo por 40 segundos de recupera\u00e7\u00e3o completa (revezando com J2). Respeite rigorosamente os 40s de pausa para recuperar o sistema fosfag\u00eanio."],"pontosAtencao":["Sempre retorne ao Cone Base olhando para J2 na rede: nunca d\u00ea as costas para a rede ao voltar dos cones 1, 2 e 3.","Para os cones traseiros (4 e 5), abra o quadril imediatamente e corra de frente.","Toque os cones flexionando os joelhos e o quadril, mantendo as costas retas."],"erroComum":"Come\u00e7ar a andar de volta para o Cone Base depois do 3\u00ba cone por cansa\u00e7o; corrija mantendo o tempo curto de 20 segundos por\u00e9m exigindo sprint tanto na ida quanto na volta. Varia\u00e7\u00f5es","variacaoFacil":"Reduzir o tempo de est\u00edmulo para 15 segundos ou seguir a ordem sequencial fixa (1, 2, 3, 4 e 5).","variacaoDificil":"Em vez de gritar o n\u00famero, J2 apenas aponta silenciosamente com a m\u00e3o para a dire\u00e7\u00e3o, exigindo foco visual ininterrupto de J1.","paraTurma":"Em turmas de 4 a 12 alunos, monte uma estrela de 6 cones em cada meia-quadra. O professor na rede aponta ou grita os n\u00fameros para 2 alunos simultaneamente (um de cada lado da rede) a cada 20 segundos.","meta":"Alcan\u00e7ar e retornar de pelo menos 5 a 6 pontas da estrela dentro de cada janela de 20 segundos.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 no Cone Base central (a 4,5m da rede) cercado por 5 cones numerados de 1 a 5 em formato de estrela (raio de 3m). J2 junto \u00e0 rede comanda os n\u00fameros; setas tracejadas duplas indicam a ida e volta explosiva do centro para cada uma das 5 pontas.","codigo":"FIS-AVA-226"},{"numero":227,"secao":14,"nome":"Intervalado espec\u00edfico de rali (15s de alta intensidade por 20s de pausa)","nivel":"Avan\u00e7ado","jogadores":"2 a 4 jogadores","tempo":"12 minutos (2 blocos de 6 repeti\u00e7\u00f5es de 15s:20s, com 2 min entre blocos)","material":"4 cones e 1 apito/cron\u00f4metro INTERVALADO ESPEC\u00cdFICO DE RALI: 2 Blocos x 6 tiros (15s Alta Intensidade / 20s Pausa Caminhando) PAUSA 20s J1 J2 1 2","objetivo":"Condicionar o sistema cardiorrespirat\u00f3rio exatamente na rela\u00e7\u00e3o esfor\u00e7o-pausa de um set longo de v\u00f4lei de praia (7 a 15 segundos de rali intenso por 15 a 20 segundos de intervalo).","comoMontar":"Na meia-quadra esquerda, posicione cones marcando 4 a\u00e7\u00f5es de um rali real: Ponto 1 na rede (Salto de Bloqueio), Ponto 2 na diagonal aos 5,5m (Retirada), Ponto 3 na frente aos 2m (Peixinho Controlado) e Ponto 4 na ponta aos 1,5m (Salto de Ataque).","passoAPasso":["Ao apito inicial (in\u00edcio dos 15 segundos de esfor\u00e7o m\u00e1ximo), J1 e J2 executam encadeadamente a simula\u00e7\u00e3o f\u00edsica de um rali pesado:","Segundos 0 a 4: fazem 1 salto m\u00e1ximo de bloqueio no Ponto 1 da rede e abrem o quadril retirando em sprint at\u00e9 o Ponto 2 (aos 5,5m).","Segundos 5 a 9: do Ponto 2, arrancam para a frente at\u00e9 o Ponto 3 (aos 2m) e executam 1 descida r\u00e1pida de peito/m\u00e3os na areia (peixinho controlado).","Segundos 10 a 15: levantam da areia, recuam 2 passos, fazem a chamada e encerram os 15s com 1 salto m\u00e1ximo de ataque no Ponto 4 (repetindo se sobrar tempo dentro dos 15s!).","Pausa Ativa de Jogo (20 segundos): ao apito de 15s, os atletas t\u00eam exatamente 20 segundos para caminhar at\u00e9 a linha de fundo, controlar a respira\u00e7\u00e3o pelo nariz/boca e voltar ao Ponto 1 para o pr\u00f3ximo apito!","Volume e Pausa: cumpra 2 blocos de 6 repeti\u00e7\u00f5es (15s de est\u00edmulo por 20s de pausa), com 2 minutos de intervalo completo (hidrata\u00e7\u00e3o na sombra) entre o 1\u00ba e o 2\u00ba bloco. Sob calor forte, reduza para 4 repeti\u00e7\u00f5es por bloco."],"pontosAtencao":["Por que esse treino funciona t\u00e3o bem na areia?","Porque em vez de correr em volta da quadra em trote lento (que n\u00e3o existe no jogo), voc\u00ea ensina o corpo a explodir por 15 segundos e baixar os batimentos card\u00edacos em 20 segundos!","Use os 20 segundos de pausa para treinar a respira\u00e7\u00e3o de recupera\u00e7\u00e3o (puxar o ar em 3s e soltar longo pela boca em 5s).","Mantenha a t\u00e9cnica limpa no salto final de cada tiro de 15 segundos."],"erroComum":"Sair a 100% nas duas primeiras repeti\u00e7\u00f5es, hiperventilar na pausa e n\u00e3o conseguir sair do ch\u00e3o na 5\u00aa e 6\u00aa repeti\u00e7\u00f5es; corrija mantendo intensidade alta e constante de 85\u201390% em todos os 6 tiros. Varia\u00e7\u00f5es","variacaoFacil":"Aumentar o tempo de recupera\u00e7\u00e3o entre os tiros para 30 segundos (rela\u00e7\u00e3o 15s de est\u00edmulo por 30s de pausa) e retirar o peixinho no ch\u00e3o.","variacaoDificil":"Reduzir a pausa para 15 segundos (rela\u00e7\u00e3o 1:1 de 15s por 15s) simulando finais de set sob press\u00e3o.","paraTurma":"Em turmas de 4 a 12 alunos, divida a turma em Grupo A e Grupo B usando as duas meias-quadras simultaneamente ao som do apito do professor (15s apito de in\u00edcio / 20s apito de pausa). Ao apito inicial (in\u00edcio dos 15 segundos de esfor\u00e7o m\u00e1ximo), J1 e J2 executam encadeadamente a simula\u00e7\u00e3o f\u00edsica de um rali pesado: 1 Segundos 0 a 4: fazem 1 salto m\u00e1ximo de bloqueio no Ponto 1 da rede e abrem o quadril retirando em sprint at\u00e9 o Ponto 2 (aos 5,5m). 2 Segundos 5 a 9: do Ponto 2, arrancam para a frente at\u00e9 o Ponto 3 (aos 2m) e executam 1 descida r\u00e1pida de peito/m\u00e3os na areia (peixinho controlado). 3 Segundos 10 a 15: levantam da areia, recuam 2 passos, fazem a chamada e encerram os 15s com 1 salto m\u00e1ximo de ataque no Ponto 4 (repetindo se sobrar tempo dentro dos 15s!). 4 Pausa Ativa de Jogo (20 segundos): ao apito de 15s, os atletas t\u00eam exatamente 20 segundos para caminhar at\u00e9 a linha de fundo, controlar a respira\u00e7\u00e3o pelo nariz/boca e voltar ao Ponto 1 para o pr\u00f3ximo apito! 5 Volume e Pausa: cumpra 2 blocos de 6 repeti\u00e7\u00f5es (15s de est\u00edmulo por 20s de pausa), com 2 minutos de intervalo completo (hidrata\u00e7\u00e3o na sombra) entre o 1\u00ba e o 2\u00ba bloco. Sob calor forte, reduza para 4 repeti\u00e7\u00f5es por bloco. 6 Por que esse treino funciona t\u00e3o bem na areia? Porque em vez de correr em volta da quadra em trote lento (que n\u00e3o existe no jogo), voc\u00ea ensina o corpo a explodir por 15 segundos e baixar os batimentos card\u00edacos em 20 segundos! Use os 20 segundos de pausa para treinar a respira\u00e7\u00e3o de recupera\u00e7\u00e3o (puxar o ar em 3s e soltar longo pela boca em 5s). Mantenha a t\u00e9cnica limpa no salto final de cada tiro de 15 segundos. Guia de Treinos \u2022 V\u00f4lei de Praia 249","meta":"","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, circuito de 15s simulando um rali: 1 (Salto de Bloqueio na rede), 2 (Retirada at\u00e9 o cone de 5,5m), 3 (Arrancada e peixinho controlado no cone de 2m) e 4 (Reajuste e Salto de Ataque na ponta). Na linha de fundo, zona de caminhada recuperativa de 20s.","codigo":"FIS-AVA-227"},{"numero":228,"secao":14,"nome":"Circuito F\u00edsico + Bola 1: pliometria lateral e defesa reativa","nivel":"Avan\u00e7ado","jogadores":"2 jogadores (1 executante J1 e 1 lan\u00e7ador/atacante T ou J2)","tempo":"11 minutos (4 s\u00e9ries de 4 sequ\u00eancias de saltos + defesa por 60s de descanso)","material":"4 bolas, 3 cones e 1 zona alvo ALVO 2m J1 T 1 12 2 Quadra 16x8m vista de cima. Na meia-quadra esquerda (aos 5,5m), J1 executa 4","objetivo":"Transferir a pot\u00eancia pliom\u00e9trica diretamente para a velocidade de rea\u00e7\u00e3o defensiva na bola com as pernas j\u00e1 exigidas pelo salto.","comoMontar":"Na meia-quadra esquerda, coloque 3 cones alinhados a 5,5m da rede para os saltos laterais de J1. Demarque uma Zona Alvo no centro a 2m da rede. O parceiro (T/J2) fica junto \u00e0 rede com 4 bolas.","passoAPasso":["\u00cd J1 posiciona-se nos cones de 5,5m e executa 4 saltos pliom\u00e9tricos laterais r\u00e1pidos sobre os cones.","No exato instante em que J1 aterrissa do 4\u00ba salto lateral, T/J2 (na rede) bate ou lan\u00e7a uma bola dif\u00edcil (ou uma bola curta aos 2,5m, ou uma bola r\u00e1pida na lateral oposta).","J1 transforma o amortecimento do 4\u00ba salto em arrancada explosiva, salva a bola (de manchete ou peixinho) colocando-a alta dentro da Zona Alvo central!","Sem pausa, J1 volta aos cones de 5,5m e repete imediatamente o ciclo (4 saltos laterais + 1 defesa dif\u00edcil) por 4 bolas seguidas (totalizando 16 saltos + 4 defesas na s\u00e9rie!).","Volume e Pausa: cada jogador cumpre 4 s\u00e9ries de 4 bolas (com 4 saltos antes de cada bola), descansando 60 a 75 segundos enquanto atua como lan\u00e7ador para o parceiro."],"pontosAtencao":["No 4\u00ba e \u00faltimo salto lateral antes da bola, j\u00e1 aterrisse com os olhos cravados na m\u00e3o do lan\u00e7ador na rede (fazendo o split-step de leitura).","Mesmo com a frequ\u00eancia card\u00edaca alta pelos saltos, na hora de tocar na bola amorte\u00e7a o impacto para a defesa subir limpa na Zona Alvo.","Se sentir perda de estabilidade no tornozelo na \u00faltima s\u00e9rie, substitua os saltos sobre cones por deslocamentos laterais rasantes."],"erroComum":"Olhar para os cones no ch\u00e3o durante os 4 saltos e perder o tempo de sa\u00edda da bola da m\u00e3o do lan\u00e7ador; corrija exigindo cabe\u00e7a erguida olhando para a rede durante os saltos. Varia\u00e7\u00f5es","variacaoFacil":"Fazer apenas 2 saltos laterais antes de cada uma das 4 bolas lan\u00e7adas.","variacaoDificil":"Ap\u00f3s defender a bola para a Zona Alvo, J1 ainda precisa levantar da areia e dar 1 salto de ataque na rede antes de voltar para os cones!","paraTurma":"Em turmas de 4 a 12 alunos, monte duas esta\u00e7\u00f5es (uma na esquerda e uma na direita da quadra). Dois lan\u00e7adores alimentam as filas que executam 2 ciclos de saltos + defesa por passagem.","meta":"Colocar pelo menos 3 das 4 bolas de cada s\u00e9rie dentro da Zona Alvo central mantendo explos\u00e3o nos saltos pr\u00e9vios.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda (aos 5,5m), J1 executa 4 saltos pliom\u00e9tricos sobre os cones (seta tracejada 1). Ao pousar do 4\u00ba salto, T junto \u00e0 rede envia uma bola curta ou lateral (seta de bola 1); J1 arranca em rea\u00e7\u00e3o (seta tracejada 2) e defende a bola para a Zona Alvo a 2m da rede (seta de bola 2).","codigo":"FIS-AVA-228"},{"numero":229,"secao":14,"nome":"Circuito F\u00edsico + Bola 2: agilidade em tri\u00e2ngulo, recep\u00e7\u00e3o e ataque","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (ou dupla J1 + J2 com bola lan\u00e7ada do outro lado)","tempo":"12 minutos (4 s\u00e9ries de 3 sequ\u00eancias completas por 75s de descanso)","material":"6 bolas, 3 cones e 2 zonas alvo ALVO ATAQUE 1 ALVO ATAQUE 2 J1 J2 T","objetivo":"Manter a precis\u00e3o da plataforma de recep\u00e7\u00e3o e a altura do salto de ataque imediatamente ap\u00f3s um est\u00edmulo intenso de agilidade na areia.","comoMontar":"Na meia-quadra esquerda, monte um tri\u00e2ngulo de 3 cones no fundo (entre 5m e 7,5m da rede) para J1. J2 fica como levantador na rede esquerda. Do outro lado da rede (direita), T (ou 3\u00ba jogador) fica com bolas e duas Zonas Alvo de ataque demarcadas.","passoAPasso":["\u00cd J1 inicia no tri\u00e2ngulo de cones no fundo e executa um giro explosivo de agilidade tocando nos 3 cones (sprint frontal de 2,5m + lateral de 3m + recuo diagonal de 3m).","Assim que J1 toca no 3\u00ba cone, T (do outro lado da rede) envia um saque/bola alta na dire\u00e7\u00e3o de J1.","J1 freia a corrida, controla a respira\u00e7\u00e3o por uma fra\u00e7\u00e3o de segundo, planta os dois p\u00e9s na areia e executa a recep\u00e7\u00e3o de manchete para J2 na rede.","Imediatamente ap\u00f3s passar, J1 faz a aproxima\u00e7\u00e3o de transi\u00e7\u00e3o at\u00e9 a rede, salta e ataca o levantamento de J2 mirando nas Zonas Alvo da quadra direita!","Assim que aterrissa do ataque, J1 corre de volta para o tri\u00e2ngulo de cones e emenda a 2\u00aa e a 3\u00aa sequ\u00eancia sem parar!","Volume e Pausa: cumpra 4 s\u00e9ries de 3 sequ\u00eancias cont\u00ednuas (Tri\u00e2ngulo + Passe + Ataque) com 75 segundos de descanso trocando de fun\u00e7\u00e3o com os parceiros."],"pontosAtencao":["O segredo t\u00e9cnico deste circuito est\u00e1 na transi\u00e7\u00e3o entre a correria nos cones e a calma na manchete: 'P\u00e9s r\u00e1pidos nos cones, corpo calmo e parado na hora do passe!'.","Na 3\u00aa bola da s\u00e9rie, quando a perna estiver pesada na chamada de ataque, use o impulso vigoroso dos dois bra\u00e7os para manter a altura do ponto de impacto.","Mire os ataques com seguran\u00e7a dentro das zonas alvo."],"erroComum":"Tocar na bola da recep\u00e7\u00e3o ainda ofegante e correndo do \u00faltimo cone, espalhando o passe para longe do levantador; corrija exigindo a parada dos dois p\u00e9s antes do toque na bola. Varia\u00e7\u00f5es","variacaoFacil":"Fazer apenas 2 cones de deslocamento lateral antes de receber e finalizar o ataque com golpe colocado (shot).","variacaoDificil":"Aumentar para 4 sequ\u00eancias cont\u00ednuas por s\u00e9rie com saque real vindo da linha de 8 metros.","paraTurma":"Em turmas de 4 a 12 alunos, mantenha 1 levantador fixo na rede e 2 sacadores do outro lado. A fila de atacantes passa pelo tri\u00e2ngulo, recepciona, ataca e recupera caminhando por fora at\u00e9 o fim da fila.","meta":"Converter pelo menos 2 das 3 sequ\u00eancias de cada s\u00e9rie com recep\u00e7\u00e3o na m\u00e3o do levantador e ataque v\u00e1lido no alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na esquerda, J1 percorre em sprint o tri\u00e2ngulo de 3 cones no fundo (setas tracejadas 1). T na direita envia o saque (seta de bola 1); J1 estanca os p\u00e9s e passa para J2 na rede (seta 2), J2 levanta (seta 3) e J1 avan\u00e7a (seta tracejada 2) atacando nas Zonas Alvo da direita (seta 4).","codigo":"FIS-AVA-229"},{"numero":230,"secao":14,"nome":"Circuito F\u00edsico + Bola 3: resist\u00eancia de Tie-Break (bloqueio, retirada, defesa e contra-ataque)","nivel":"Avan\u00e7ado","jogadores":"3 a 4 jogadores (Dupla J1 + J2 contra lan\u00e7ador/defensor T)","tempo":"12 minutos (3 s\u00e9ries de 4 transi\u00e7\u00f5es completas por 90s de descanso)","material":"3 cones e cesto de bolas ALVO CONTRA-ATAQUE J1 J1 J2 T","objetivo":"Integrar todos os esfor\u00e7os f\u00edsicos mais exigentes do v\u00f4lei de praia (salto de bloqueio, retirada na areia, defesa no fundo e salto de ataque) em fadiga controlada de final de partida.","comoMontar":"Na meia-quadra esquerda, coloque 2 cones na rede (para os saltos de bloqueio de J1) e 1 cone aos 6 metros na diagonal (ponto de defesa). J2 atua como parceiro/levantador. T fica do outro lado da rede com cesto de bolas.","passoAPasso":["J1 come\u00e7a na rede e realiza 2 saltos m\u00e1ximos de bloqueio deslocando-se entre os dois cones da fita.","Ao aterrissar do 2\u00ba bloqueio, J1 abre o quadril e faz a retirada em sprint m\u00e1ximo ('pulling') at\u00e9 o cone de 6 metros no fundo.","Quando J1 planta os p\u00e9s no cone de 6m, T bate/lan\u00e7a uma bola de ataque na dire\u00e7\u00e3o de J1.","J1 defende a bola alta para o centro da quadra (onde J2 aguarda), arranca do fundo de volta at\u00e9 a rede (6 metros de transi\u00e7\u00e3o na areia!) e salta para atacar o levantamento de J2!","Sem descanso, assim que J1 pousa do ataque na rede, ele j\u00e1 faz novamente os 2 saltos de bloqueio iniciando a 2\u00aa, 3\u00aa e 4\u00aa bola da bateria!","Volume e Pausa: realize 3 s\u00e9ries de 4 transi\u00e7\u00f5es completas ininterruptas (total por s\u00e9rie: 8 saltos de bloqueio + 4 retiradas de 6m + 4 defesas + 4 corridas e saltos de ataque!), seguidas de 90 segundos de descanso completo na sombra. Se a t\u00e9cnica de aterrissagem comprometer a seguran\u00e7a articular na 4\u00aa bola, reduza a s\u00e9rie para 3 bolas."],"pontosAtencao":["Este \u00e9 o est\u00edmulo f\u00edsico mais pr\u00f3ximo de um Tie-break disputado ponto a ponto sob sol: gerencie sua energia mantendo movimentos eficientes sem passos desperdi\u00e7ados.","Mande a sua defesa l\u00e1 dos 6 metros bem alta (5m de altura) para dar tempo \u00e0s suas pr\u00f3prias pernas de percorrerem a quadra de volta at\u00e9 a rede.","Na 3\u00aa e 4\u00aa bolas da s\u00e9rie, use a intelig\u00eancia t\u00e1tica no ataque (cut shot, lob ou cobra nos cantos vazios) se sentir que a impuls\u00e3o diminuiu."],"erroComum":"Retirar da rede olhando para o ch\u00e3o e ainda estar correndo de costas quando T bate a bola aos 6 metros; corrija virando de frente no cone de 6m um instante antes do envio da bola. Varia\u00e7\u00f5es","variacaoFacil":"Fazer apenas 1 salto de bloqueio na rede antes de cada retirada e realizar 3 bolas por s\u00e9rie.","variacaoDificil":"T e um parceiro defendem o contra-ataque de J1 do outro lado, mantendo o rali vivo at\u00e9 a bola cair na areia em todas as 4 bolas!","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a o grande fechamento f\u00edsico em duplas: J1 faz 2 bolas seguidas e imediatamente J2 faz as outras 2 bolas da bateria de 4, revezando as duplas na quadra a cada 90 segundos. J1 come\u00e7a na rede e realiza 2 saltos m\u00e1ximos de bloqueio deslocando-se entre os dois cones da fita. 1 Ao aterrissar do 2\u00ba bloqueio, J1 abre o quadril e faz a retirada em sprint m\u00e1ximo ('pulling') at\u00e9 o cone de 6 metros no fundo. 2 Quando J1 planta os p\u00e9s no cone de 6m, T bate/lan\u00e7a uma bola de ataque na dire\u00e7\u00e3o de J1. 3 J1 defende a bola alta para o centro da quadra (onde J2 aguarda), arranca do fundo de volta at\u00e9 a rede (6 metros de transi\u00e7\u00e3o na areia!) e salta para atacar o levantamento de J2! 4 Sem descanso, assim que J1 pousa do ataque na rede, ele j\u00e1 faz novamente os 2 saltos de bloqueio iniciando a 2\u00aa, 3\u00aa e 4\u00aa bola da bateria! 5 Volume e Pausa: realize 3 s\u00e9ries de 4 transi\u00e7\u00f5es completas ininterruptas (total por s\u00e9rie: 8 saltos de bloqueio + 4 retiradas de 6m + 4 defesas + 4 corridas e saltos de ataque!), seguidas de 90 segundos de descanso completo na sombra. Se a t\u00e9cnica de aterrissagem comprometer a seguran\u00e7a articular na 4\u00aa bola, reduza a s\u00e9rie para 3 bolas. 6 Este \u00e9 o est\u00edmulo f\u00edsico mais pr\u00f3ximo de um Tie-break disputado ponto a ponto sob sol: gerencie sua energia mantendo movimentos eficientes sem passos desperdi\u00e7ados. Mande a sua defesa l\u00e1 dos 6 metros bem alta (5m de altura) para dar tempo \u00e0s suas pr\u00f3prias pernas de percorrerem a quadra de volta at\u00e9 a rede. Na 3\u00aa e 4\u00aa bolas da s\u00e9rie, use a intelig\u00eancia t\u00e1tica no ataque (cut shot, lob ou cobra nos cantos vazios) se sentir que a impuls\u00e3o diminuiu. Guia de Treinos \u2022 V\u00f4lei de Praia 253","meta":"","descricaoDiagrama":"Quadra 16x8m vista de cima. Na esquerda, J1 executa 2 saltos de bloqueio nos cones da rede (seta tracejada 1) e retira em sprint at\u00e9 o cone de 6m no fundo (seta tracejada 2). T na direita ataca em J1 (seta de bola 1); J1 defende alto para J2 no centro (seta 2), J2 levanta (seta 3) e J1 atravessa os 6m de volta \u00e0 rede (seta tracejada 3) para finalizar o contra-ataque (seta 4).","codigo":"FIS-AVA-230"},{"numero":231,"secao":15,"nome":"Controle individual de manchete e toque em deslocamento pelas linhas (Solo)","nivel":"Iniciante","jogadores":"1 jogador (treino solo com 1 bola)","tempo":"8 minutos","material":"1 bola e 4 cones nos cantos da meia-quadra TREINO SOLO: Controle Cont\u00ednuo (1 Manchete + 1 Toque) percorrendo os 32m das linhas (8x8m) J1 1 2 3 4","objetivo":"Calibrar o controle de for\u00e7a da manchete e a limpeza do toque de dedos enquanto caminha e corre sobre as linhas da meia-quadra de 8x8m.","comoMontar":"Na meia-quadra esquerda, posicione 4 cones nos 4 v\u00e9rtices do quadrado de 8 x 8 metros (Cone 1 no canto fundo superior, Cone 2 na antena superior, Cone 3 na antena inferior e Cone 4 no canto fundo inferior). J1 inicia no Cone 1 com 1 bola.","passoAPasso":["J1 come\u00e7a no Cone 1 (canto fundo) e inicia uma sequ\u00eancia cont\u00ednua alternando obrigatoriamente 1 toque de manchete e 1 toque de dedos acima da testa para si mesmo.","Trecho 1 (Linha Lateral at\u00e9 a Rede - 8m): avan\u00e7a de frente ao longo da fita lateral controlando a bola a 3 metros de altura at\u00e9 chegar ao Cone 2 junto \u00e0 rede.","Trecho 2 (Travessia junto \u00e0 Rede - 8m): desloca-se lateralmente paralelo \u00e0 fita da rede do Cone 2 at\u00e9 o Cone 3 sem deixar a bola tocar na rede.","Trecho 3 (Recuo pela outra Lateral - 8m): recua em passos laterais/diagonais do Cone 3 at\u00e9 o Cone 4 no fundo mantendo a bola sempre \u00e0 frente da testa.","Trecho 4 (Fechamento na Linha de Fundo - 8m): fecha o circuito em passada lateral baixa do Cone 4 de volta ao Cone 1, totalizando 32 metros de per\u00edmetro sem a bola cair."],"pontosAtencao":["Mesmo caminhando pelo per\u00edmetro da quadra, pare os dois p\u00e9s por uma fra\u00e7\u00e3o de segundo no exato instante de cada toque de dedos para n\u00e3o cometer condu\u00e7\u00e3o.","Se houver vento na arena, incline levemente a plataforma contra o vento para que a bola n\u00e3o fuja para fora da linha.","Mantenha todos os toques na mesma altura padr\u00e3o (entre 2,5m e 3m) para ter tempo de olhar os cones no ch\u00e3o com a vis\u00e3o perif\u00e9rica."],"erroComum":"Bater na bola baixo demais (a 1 metro da cabe\u00e7a), sendo obrigado a correr desesperado e perder a linha das fitas; corrija exigindo altura m\u00ednima da borda superior da rede em cada toque. Varia\u00e7\u00f5es","variacaoFacil":"Realizar o percurso usando exclusivamente toques de manchete cont\u00ednua e permitindo 1 quique na areia batida caso perca o equil\u00edbrio.","variacaoDificil":"Incluir 1 giro completo de 360 graus na areia a cada 4 toques ou alternar: 1 manchete + 1 toque de dedos + 1 controle com um bra\u00e7o s\u00f3 (direito/esquerdo).","paraTurma":"Em turmas de 4 a 12 alunos, cada aluno pega 1 bola e entra no 'Carrossel do Per\u00edmetro' (distanciados 3 metros uns dos outros ao longo das linhas da quadra inteira 16x8m), girando todos no mesmo sentido ao apito do professor.","meta":"Completar 2 voltas inteiras no quadrado de 8x8m (64 metros totais e cerca de 40 toques alternados) sem deixar a bola cair na areia.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda (8x8m), 4 cones marcam os cantos (1, 2, 3 e 4). J1 parte do Cone 1 percorrendo as linhas em sentido hor\u00e1rio (setas tracejadas de deslocamento 1, 2, 3 e 4) enquanto mant\u00e9m a bola no ar em pequenos arcos cont\u00ednuos de manchete e toque ao redor de toda a meia- quadra.","codigo":"SOL-INI-231"},{"numero":232,"secao":15,"nome":"Auto-lan\u00e7amento, passada na areia e ataque em alvos (Solo)","nivel":"Iniciante","jogadores":"1 jogador (treino solo de ataque)","tempo":"10 minutos","material":"3 a 6 bolas (ou 1 bola com busca r\u00e1pida) e 6 cones demarcando 3 zonas alvo TREINO SOLO DE ATAQUE: Auto-lan\u00e7amento alto aos 1,5m + Passada 3 apoios + Ataque em 3 Alvos 1,5m REDE ALVO 1: LINHA ALVO 2: CUT ALVO 3: DIAG J1 1 2a 2b 2c","objetivo":"Treinar sozinho o tempo de entrada na bola, o salto equilibrado na areia e a pontaria dos golpes de ataque (cortada, cut shot e lob) nos cantos da quadra.","comoMontar":"Na meia-quadra esquerda, coloque 1 cone de sa\u00edda para J1 a 4 metros da rede na entrada esquerda (e outro na sa\u00edda direita). Na meia-quadra direita, demarque 3 Zonas Alvo com cones: Alvo 1 (Paralela Funda a 7m), Alvo 2 (Cut Shot na Diagonal Curta a 2m) e Alvo 3 (Diagonal Longa a 7m).","passoAPasso":["J1 posiciona-se no cone de 4 metros da rede segurando uma bola nas m\u00e3os.","Executa um auto-lan\u00e7amento alto (4,5 metros de altura) com as duas m\u00e3os para a frente, fazendo a bola subir e cair exatamente a 1,5 metro da rede e 1 metro da antena.","Enquanto a bola sobe ao ponto mais alto, J1 aguarda um instante na base e explode na passada de 3 apoios ('esquerda-direita-esquerda') na areia fofa.","Salta verticalmente a 1,5m da rede e finaliza o ataque mirando nos alvos em ordem obrigat\u00f3ria: 1\u00aa bola no Alvo 1 (Paralela), 2\u00aa bola no Alvo 2 (Cut Shot curto) e 3\u00aa bola no Alvo 3 (Diagonal longa).","Ap\u00f3s bater as bolas da entrada esquerda, J1 recolhe as bolas e executa a mesma s\u00e9rie saindo da ponta direita."],"pontosAtencao":["O segredo para treinar ataque sozinho na praia \u00e9 o AUTO- LAN\u00c7AMENTO: lance a bola alta e sem giro (como se fosse um levantamento de manchete do seu parceiro) para dar tempo de voc\u00ea fazer a passada completa de 3 passos!","N\u00e3o lance a bola baixa e saia correndo junto com ela: primeiro lance alto, veja o \u00e1pice da bola e s\u00f3 ent\u00e3o acelere os dois \u00faltimos passos.","Alterne entre cortada potente de m\u00e3o aberta e golpes colocados (poke, cobra e cut shot)."],"erroComum":"Lan\u00e7ar a bola muito colada na rede ou muito para frente, saltando desequilibrado e tocando na fita; corrija desenhando um X na areia a 1,5m da rede onde a bola lan\u00e7ada deveria cair. Varia\u00e7\u00f5es","variacaoFacil":"Iniciar a apenas 2,5 metros da rede, fazer o auto-lan\u00e7amento mais curto e atacar usando a passada r\u00e1pida de 2 apoios.","variacaoDificil":"Substituir o auto-lan\u00e7amento com as m\u00e3os por um 'auto- levantamento de manchete': J1 joga a bola na pr\u00f3pria frente, d\u00e1 uma manchete alta para a rede, corre em transi\u00e7\u00e3o e ataca!","paraTurma":"Em turmas de 4 a 12 alunos, posicione duas filas de auto-ataque (uma na ponta esquerda e outra na ponta direita). Os alunos que est\u00e3o no outro lado da quadra defendem as bolas dentro das 3 Zonas Alvo e devolvem para a fila.","meta":"Acertar pelo menos 7 de 10 ataques dentro das 3 Zonas Alvo demarcadas (acertando no m\u00ednimo 2 vezes cada alvo).","descricaoDiagrama":"Quadra 16x8m vista de cima. Na esquerda, J1 parte do cone a 4m da rede, faz o auto-lan\u00e7amento alto para a zona de 1,5m da rede (seta de bola 1), avan\u00e7a na passada de 3 passos (seta tracejada 1) e ataca (setas 2a, 2b e 2c) acertando as 3 Zonas Alvo na meia-quadra direita: Paralela Funda, Cut Shot Curto e Diagonal Longa.","codigo":"SOL-INI-232"},{"numero":233,"secao":15,"nome":"Rotina individual de saque em alvos com coleta ativa em sprint (Solo)","nivel":"Iniciante","jogadores":"1 jogador (treino solo de saque + condicionamento)","tempo":"10 minutos","material":"2 a 5 bolas e 8 cones demarcando 4 zonas t\u00e1ticas de saque TREINO SOLO DE SAQUE: 4 Zonas T\u00e1ticas + Sprint de Entrada em Defesa e Coleta Ativa ZONA 1: CURTA ZONA 2: COSTURA ZONA 3: FUNDO 8mZONA 4: CURTA J1 1","objetivo":"Aprimorar a precis\u00e3o do saque em zonas espec\u00edficas sob batimento card\u00edaco elevado, simulando o cansa\u00e7o real de uma partida quando voc\u00ea treina sozinho.","comoMontar":"J1 posiciona-se atr\u00e1s da linha de fundo esquerda (8m da rede). Na meia-quadra direita, monte 4 Zonas Alvo estrat\u00e9gicas do v\u00f4lei de praia: Zona 1 (Curta Esquerda a 2m), Zona 2 (Costura Central a 5,5m), Zona 3 (Fundo Linha Direita a 7,5m) e Zona 4 (Curta Direita a 2,5m).","passoAPasso":["J1 saca uma bateria de 4 bolas (ou saca 1 bola por vez caso s\u00f3 tenha uma bola na arena) mirando na sequ\u00eancia num\u00e9rica: Saque 1 na Zona 1, Saque 2 na Zona 2, Saque 3 na Zona 3 e Saque 4 na Zona 4.","Regra de Coleta Ativa (Simulador de Jogo): ap\u00f3s bater os saques da s\u00e9rie, \u00e9 PROIBIDO ir caminhando devagar buscar as bolas! J1 passa por baixo da rede em sprint, recolhe as bolas fazendo agachamento baixo na areia e volta trotando at\u00e9 a linha de fundo oposta.","Ao chegar na linha de fundo direita (agora no lado oposto do vento e do sol!), J1 tem exatamente 10 segundos para respirar fundo e sacar de volta para o outro lado!","Se J1 estiver treinando com apenas 1 \u00fanica bola: ele saca da esquerda para a direita, corre em transi\u00e7\u00e3o at\u00e9 a linha de 5,5m da sua quadra (simulando a entrada de defesa p\u00f3s- saque!), depois atravessa para pegar a bola e j\u00e1 saca do lado direito para o esquerdo!"],"pontosAtencao":["Quando treinamos saque parados e descansados, acertamos tudo; no jogo real, sacamos ofegantes!","A corrida de coleta ativa eleva a frequ\u00eancia card\u00edaca para deixar o treino id\u00eantico ao jogo.","A cada corrida para buscar a bola no outro lado, aproveite para sacar de volta de l\u00e1 mesmo: assim voc\u00ea treina 50% dos saques contra o vento e 50% a favor do vento!","Use os 5 segundos antes de cada saque para fazer sua rotina respirat\u00f3ria."],"erroComum":"Sacar r\u00e1pido demais assim que pega a bola na m\u00e3o ainda correndo, errando o lan\u00e7amento; corrija parando os dois p\u00e9s atr\u00e1s da linha de 8m e soltando o ar antes de al\u00e7ar a bola. Varia\u00e7\u00f5es","variacaoFacil":"Ampliar o tamanho das 4 Zonas Alvo para 3x3 metros e caminhar nos \u00faltimos 4 metros antes da linha de saque.","variacaoDificil":"Exigir saque viagem ou flutuante rasante: toda bola que errar o alvo exige 1 sprint extra de rede a fundo antes do pr\u00f3ximo saque.","paraTurma":"Em turmas de 4 a 12 alunos, divida metade da turma em cada linha de fundo. Todos sacam nas 4 zonas, correm at\u00e9 o meio da quadra para pegar a bola que veio do colega oposto e j\u00e1 sacam na sequ\u00eancia.","meta":"Acertar pelo menos 12 de 16 saques (4 passagens pelas 4 zonas) mantendo o ritmo de coleta ativa entre os lados.","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 atr\u00e1s da linha de fundo esquerda (8m) executa saques direcionados (setas de bola 1, 2, 3 e 4) para as 4 Zonas Alvo na meia- quadra direita (Curta Esq, Costura Central, Fundo Dir e Curta Dir). Seta tracejada mostra o sprint p\u00f3s-saque de J1 entrando em defesa e atravessando para coletar e sacar de volta.","codigo":"SOL-INI-233"},{"numero":234,"secao":15,"nome":"Controle cont\u00ednuo em dupla com toque na linha e chamada (Dupla)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (J1 e J2 na mesma meia-quadra ou um de cada lado)","tempo":"9 minutos","material":"1 bola e 4 cones laterais TREINO EM DUPLA: Controle Alto + Toque Obrigat\u00f3rio no Cone da Linha Lateral ap\u00f3s cada passe J1 J2 1 2 Passou no alto (4m) Toca na linha Parceiro chama: \"Direita / Esquerda!\"","objetivo":"Desenvolver o controle de bola alto sob fadiga de deslocamento na areia fofa e a comunica\u00e7\u00e3o constante com o parceiro.","comoMontar":"Na meia-quadra esquerda, posicione J1 e J2 frente a frente no centro da quadra (a 4 metros de dist\u00e2ncia um do outro). Coloque 2 cones sobre a linha lateral superior (atr\u00e1s de J1) e 2 cones sobre a linha lateral inferior (atr\u00e1s de J2), a 2 metros das costas de cada jogador.","passoAPasso":["J1 e J2 trocam passes cont\u00ednuos (de manchete ou toque limpo) mantendo a bola sempre alta no centro da meia- quadra (m\u00ednimo de 4 metros de altura).","Regra de Deslocamento Obrigat\u00f3rio: imediatamente ap\u00f3s tocar na bola e envi\u00e1-la para o parceiro, o jogador precisa abrir o quadril, correr 2 metros para tr\u00e1s, tocar com a m\u00e3o no cone da linha lateral e voltar r\u00e1pido para o centro antes que o parceiro devolva a bola!","Enquanto o jogador que acabou de passar est\u00e1 correndo para tocar na linha e voltando, o parceiro que est\u00e1 com a bola no centro grita a orienta\u00e7\u00e3o ('DIREITA!', 'ESQUERDA!' ou 'CURTA!') e envia a bola 1 metro deslocada para aquele lado.","O jogador retorna da linha lateral, freia os dois p\u00e9s na areia, responde 'MINHA!' e devolve a bola alta no centro antes de ir tocar no cone novamente."],"pontosAtencao":["Para dar tempo de o seu parceiro ir tocar o cone na linha lateral e voltar aos 4 metros, voc\u00ea \u00e9 OBRIGADO a mandar a bola com arco alto (4 a 5 metros de altura): passe baixo mata o exerc\u00edcio!","Plante sempre os dois p\u00e9s na areia ao voltar do cone antes de tocar na bola (nunca toque na bola ainda correndo).","Use chamadas reais de jogo a cada contato."],"erroComum":"Tocar na bola de qualquer jeito com o corpo caindo para tr\u00e1s e esquecer de dar altura para o colega que est\u00e1 voltando do cone; corrija invalidando a contagem se a bola subir menos que a altura da antena. Varia\u00e7\u00f5es","variacaoFacil":"Colocar os cones a apenas 1 metro atr\u00e1s de cada jogador ou permitir que cada jogador d\u00ea 2 toques (1\u00ba controla para o alto e 2\u00ba passa para o parceiro).","variacaoDificil":"Substituir o toque com a m\u00e3o no cone por 1 salto de bloqueio na rede ou 1 descida de peito na areia ap\u00f3s cada passe!","paraTurma":"Em turmas de 4 a 12 alunos, cabem at\u00e9 3 duplas por meia-quadra (total de 6 duplas = 12 alunos na quadra inteira) fazendo o desafio simultaneamente para ver qual dupla atinge 30 toques consecutivos primeiro.","meta":"Alcan\u00e7ar uma sequ\u00eancia ininterrupta de 24 contatos (12 toques na bola + 12 toques no cone por jogador) sem a bola cair na areia.","d
