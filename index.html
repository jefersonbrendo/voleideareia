<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E4B75">
<title>Código da Areia - Vôlei de Praia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
/* ===== CSS TOKENS ===== */
:root {
  /* Paleta da marca */
  --azul: #0E4B75;      /* marca */
  --laranja: #FF9F1C;   /* destaque */
  --coral: #FF4A3F;     /* ações principais */
  --ceu: #0284C7;       /* secundária */
  --areia: #F7F4EE;     /* fundo */
  --borda: #E2DBC9;
  --texto: #0F172A;

  /* Níveis */
  --c-ini: #1E9E5A;
  --c-int: #E08A00;
  --c-ava: #E5352B;

  /* Light theme */
  --bg: var(--areia);
  --bg-card: #FFFFFF;
  --bg-nav: #FFFFFF;
  --bg-bar: var(--azul);
  --bg-chip: #EFEAE0;
  --bg-overlay: rgba(14,75,117,0.05);
  --text: var(--texto);
  --text-sec: #475569;
  --text-muted: #8A94A6;
  --border: var(--borda);
  --shadow: 0 1px 2px rgba(15,23,42,0.05);
  --shadow-lg: 0 6px 20px rgba(15,23,42,0.08);
  --accent: var(--azul);
  --cta: var(--coral);
  --link: var(--ceu);
  --highlight: var(--laranja);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1B28;
    --bg-card: #12283A;
    --bg-nav: #0B1B28;
    --bg-bar: #0A3A5C;
    --bg-chip: #1B3549;
    --bg-overlay: rgba(255,255,255,0.05);
    --text: #F7F4EE;
    --text-sec: #C9D3DD;
    --text-muted: #7D90A3;
    --border: #22405A;
    --accent: #38A8E8;
    --cta: var(--coral);
    --link: #7CC4F0;
    --highlight: var(--laranja);
  }
}
:root[data-theme="dark"] {
  --bg: #0B1B28;
  --bg-card: #12283A;
  --bg-nav: #0B1B28;
  --bg-bar: #0A3A5C;
  --bg-chip: #1B3549;
  --bg-overlay: rgba(255,255,255,0.05);
  --text: #F7F4EE;
  --text-sec: #C9D3DD;
  --text-muted: #7D90A3;
  --border: #22405A;
  --accent: #38A8E8;
  --cta: var(--coral);
  --link: #7CC4F0;
  --highlight: var(--laranja);
}

/* ===== RESET / BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
}
a { color: inherit; text-decoration: none; }
button { cursor: pointer; font: inherit; border: none; background: none; }
input { font: inherit; }

/* ===== LAYOUT ===== */
#app { max-width: 600px; margin: 0 auto; position: relative; min-height: 100vh; }

/* ===== TOP BAR ===== */
.top-bar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg-bar); color: #fff;
  border-bottom: none;
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 12px;
  height: 56px;
}
.top-bar .back-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; flex-shrink: 0;
}
.top-bar .back-btn svg { width: 20px; height: 20px; }
.top-bar h1 {
  flex: 1; font-size: 0.95rem; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.logo-title {
  font-family: 'Inter', sans-serif;
  font-size: 18px; font-weight: 700; letter-spacing: 0.04em;
  color: #fff; flex: 1;
}
@media (max-width: 420px) {
  .logo-title { font-size: 15px; letter-spacing: 0.02em; }
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: var(--bg-nav);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px; padding: 8px 4px;
  color: var(--text-muted); font-size: 11px; font-weight: 500;
  transition: color 0.15s;
  min-height: 56px;
}
.nav-item.active { color: var(--cta); }
.nav-item svg { width: 22px; height: 22px; }

/* ===== PAGE CONTAINER ===== */
.page {
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
  padding-bottom: 24px;
}

/* ===== SEARCH BAR ===== */
.search-wrap {
  position: relative; margin: 12px 0;
}
.search-wrap svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; color: var(--text-muted); pointer-events: none;
}
.search-input {
  width: 100%; height: 44px;
  padding: 0 12px 0 40px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  background: var(--bg-card);
  color: var(--text);
  font-size: 0.9rem;
  transition: border-color 0.15s;
}
.search-input:focus { outline: none; border-color: var(--link); box-shadow: 0 0 0 3px rgba(2,132,199,0.15); }
.search-input::placeholder { color: var(--text-muted); }

/* ===== LEVEL CHIPS ===== */
.level-chips {
  display: flex; gap: 8px; margin: 8px 0 16px;
  overflow-x: auto; padding-bottom: 4px;
  scrollbar-width: none;
}
.level-chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; height: 32px; padding: 0 14px;
  border-radius: 6px; font-size: 13px; font-weight: 500;
  border: 1px solid var(--border);
  background: transparent; color: var(--text-sec);
  transition: all 0.15s;
  display: flex; align-items: center;
}
.chip-ini.active { background: var(--c-ini); color: #fff; border-color: var(--c-ini); }
.chip-int.active { background: var(--c-int); color: #fff; border-color: var(--c-int); }
.chip-ava.active { background: var(--c-ava); color: #fff; border-color: var(--c-ava); }
.chip-all.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.chip:disabled { opacity: 0.4; cursor: default; }

/* ===== SECTION LIST ===== */
.section-grid { display: flex; flex-direction: column; margin-top: 8px; }
.section-card {
  background: transparent;
  border-bottom: 1px solid var(--border);
  height: 56px; padding: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  cursor: pointer;
  transition: background 0.12s;
}
.section-card:hover { background: var(--bg-chip); }
.section-card:active { background: var(--bg-chip); }
.sec-left { display: flex; align-items: center; gap: 12px; }
.sec-num { font-size: 0.82rem; font-weight: 700; color: var(--accent); width: 32px; flex-shrink: 0; }
.sec-nome { font-size: 0.9rem; font-weight: 500; color: var(--text); }
.sec-count { font-size: 13px; color: var(--text-muted); flex-shrink: 0; }

/* ===== EXERCISE LIST ===== */
.ex-list { display: flex; flex-direction: column; margin-top: 8px; }
.ex-card {
  background: transparent;
  border-bottom: 1px solid var(--border);
  padding: 16px 0;
  cursor: pointer;
  transition: background 0.12s;
}
.ex-card:hover { background: var(--bg-chip); padding-left: 8px; padding-right: 8px; margin: 0 -8px; }
.ex-card:active { background: var(--bg-chip); }
.ex-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.ex-code { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
.ex-nome { font-size: 15px; font-weight: 600; margin: 4px 0 6px; line-height: 1.3; color: var(--text); }
.ex-meta { font-size: 13px; color: var(--text-muted); }
.nivel-badge {
  font-size: 12px; font-weight: 600; flex-shrink: 0; padding-top: 2px;
}
.nivel-Iniciante { color: var(--c-ini); }
.nivel-Intermediário { color: var(--c-int); }
.nivel-Avançado { color: var(--c-ava); }

/* ===== EXERCISE DETAIL ===== */
.ex-detail { padding: 0; }
.ex-detail .detail-header {
  background: var(--bg-card);
  padding: 16px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.ex-detail .code-big {
  font-family: 'Bebas Neue', monospace;
  font-size: 1.2rem;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.ex-detail .nome-big {
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 12px;
}
.ex-detail .chips-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.ex-detail .fav-btn {
  margin-left: auto;
  background: var(--bg-chip);
  border-radius: 50%; width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.ex-detail .fav-btn.active { background: rgba(255,74,63,0.14); }
.ex-detail .fav-btn svg { width: 22px; height: 22px; }
.ex-detail .fav-btn.active svg { fill: var(--cta); stroke: var(--cta); }

/* Diagram */
.diagrama-box {
  margin: 0 max(16px, env(safe-area-inset-left, 0px)) 12px;
  background: var(--bg-card);
  border-radius: 12px;
  padding: 14px;
  border: 1px solid var(--border);
  font-size: 0.82rem;
  color: var(--text-sec);
  line-height: 1.5;
  overflow: hidden;
}
.diagrama-box img { width: 100%; height: auto; display: block; border-radius: 8px; }

/* Collapsible sections */
.section-group {
  margin: 0 max(16px, env(safe-area-inset-left, 0px)) 8px;
  background: var(--bg-card);
  border-radius: 12px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.section-toggle {
  width: 100%; padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 0.88rem; font-weight: 700; color: var(--text);
  background: transparent;
}
.section-toggle .chevron {
  width: 18px; height: 18px; color: var(--text-muted);
  transition: transform 0.2s;
  flex-shrink: 0;
}
.section-toggle.open .chevron { transform: rotate(180deg); }
.section-body {
  padding: 0 16px 14px;
  font-size: 0.85rem; line-height: 1.6; color: var(--text-sec);
  display: none;
}
.section-body.open { display: block; }

/* Step list */
.step-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.step-item { display: flex; gap: 12px; align-items: flex-start; }
.step-num {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; font-weight: 700;
}
.step-text { flex: 1; padding-top: 2px; }

/* Bullet list */
.bullet-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.bullet-item { display: flex; gap: 10px; align-items: flex-start; }
.bullet-dot {
  flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%;
  background: var(--highlight); margin-top: 7px;
}

/* Prev/Next nav */
.prev-next {
  display: flex; gap: 10px;
  margin: 12px max(16px, env(safe-area-inset-left, 0px)) 0;
}
.prev-next button {
  flex: 1; height: 44px; border-radius: 12px;
  background: var(--bg-card); color: var(--text);
  border: 1.5px solid var(--border);
  font-size: 0.82rem; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 0.15s;
}
.prev-next button:hover { background: var(--bg-chip); }
.prev-next button:disabled { opacity: 0.35; pointer-events: none; }

/* ===== HOME ===== */
.home-hero {
  padding: 20px max(16px, env(safe-area-inset-left, 0px)) 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.home-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

/* ===== BUSCAR ===== */
.search-results { margin-top: 4px; }
.search-empty {
  text-align: center; color: var(--text-muted);
  padding: 40px 16px; font-size: 0.9rem;
}

/* ===== FAVORITOS ===== */
.fav-clear {
  display: flex; justify-content: flex-end; margin: 8px 0;
}
.fav-clear button {
  font-size: 0.78rem; color: var(--c-ava); font-weight: 600;
  padding: 6px 12px; border-radius: 8px;
  background: rgba(255,74,63,0.10);
}

/* ===== AULAS ===== */
.tabs {
  display: flex; background: var(--bg-card);
  border-bottom: 2px solid var(--border);
  position: sticky; top: 56px; z-index: 90;
  margin: 0 -16px; padding: 0 16px;
}
.tab-btn {
  flex: 1; padding: 12px 8px;
  font-size: 0.82rem; font-weight: 600;
  color: var(--text-muted); border-bottom: 2px solid transparent;
  margin-bottom: -2px; transition: color 0.15s;
  text-align: center;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { margin-top: 16px; }

/* Plan tabs (inside Aulas) */
.plan-tabs {
  display: flex; gap: 8px; margin-bottom: 16px;
  overflow-x: auto; scrollbar-width: none;
}
.plan-tabs::-webkit-scrollbar { display: none; }
.plan-tab {
  flex-shrink: 0; padding: 6px 16px; border-radius: 20px;
  font-size: 0.8rem; font-weight: 600;
  background: var(--bg-chip); color: var(--text-sec);
  transition: all 0.15s;
}
.plan-tab.active { background: var(--accent); color: #fff; }

/* 60min model */
.model-card {
  background: var(--bg-card); border-radius: 12px;
  border: 1px solid var(--border); margin-bottom: 10px;
  overflow: hidden;
}
.model-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px;
}
.model-time {
  background: var(--accent); color: #fff;
  border-radius: 8px; padding: 6px 10px;
  font-size: 0.78rem; font-weight: 700;
  flex-shrink: 0;
}
.model-title { font-size: 0.9rem; font-weight: 700; }
.model-links { padding: 0 14px 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.model-link {
  background: var(--bg-chip); border-radius: 8px;
  padding: 6px 12px; font-size: 0.78rem; font-weight: 500;
  color: var(--link); cursor: pointer;
  transition: background 0.15s;
}
.model-link:hover { background: var(--bg-overlay); }

/* Weekly plan */
.day-card {
  background: var(--bg-card); border-radius: 12px;
  border: 1px solid var(--border); margin-bottom: 10px;
}
.day-header {
  padding: 12px 14px; font-size: 0.88rem; font-weight: 700;
  border-bottom: 1px solid var(--border);
  color: var(--accent);
}
.day-exercises { padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.day-ex-chip {
  background: var(--bg-chip); border-radius: 8px;
  padding: 8px 10px; cursor: pointer;
  transition: background 0.15s;
  min-width: 90px;
}
.day-ex-chip:hover { background: var(--bg-overlay); }
.day-ex-chip .dex-code { font-size: 0.63rem; font-weight: 700; color: var(--text-muted); font-family: monospace; }
.day-ex-chip .dex-nome { font-size: 0.72rem; font-weight: 500; margin-top: 2px; line-height: 1.3; }

/* ===== COMO USAR ===== */
.info-card {
  border-left: 3px solid var(--highlight);
  margin-bottom: 16px; padding-left: 14px;
}
.info-card-header { padding: 0 0 6px; }
.info-card-title { font-size: 0.92rem; font-weight: 700; color: var(--text); }
.info-card-body {
  font-size: 0.85rem; line-height: 1.6; color: var(--text-sec);
}

/* Theme toggle */
.theme-btn {
  margin-left: auto;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.8); flex-shrink: 0;
}
.theme-btn svg { width: 18px; height: 18px; }

/* ===== EMPTY / LOADING ===== */
.empty-state {
  text-align: center; padding: 48px 16px;
  color: var(--text-muted); font-size: 0.9rem;
}
.empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }

/* ===== UTILITY ===== */
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

/* search input rounded */
.search-input { border-radius: 8px; }

/* chip count badge */
.chip-count {
  background: rgba(0,0,0,0.12); color: inherit;
  font-size: 11px; font-weight: 600;
  border-radius: 10px; padding: 1px 6px;
  margin-left: 4px; min-width: 20px; text-align: center;
}
.chip.active .chip-count { background: rgba(255,255,255,0.25); }

/* filter status bar */
.filter-status {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-muted);
  margin: -8px 0 12px;
  min-height: 20px;
  transition: opacity 0.2s;
}
.filter-status .fs-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.filter-status .fs-ini { background: var(--c-ini); }
.filter-status .fs-int { background: var(--c-int); }
.filter-status .fs-ava { background: var(--c-ava); }
.filter-status .fs-all { background: var(--accent); }

/* section list fade on filter change */
.section-grid { animation: fadeIn 0.18s ease; }
@keyframes fadeIn { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* =====================================================
   LAYOUT DE APP — v2 (fotos, guia, abas)
   ===================================================== */
body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
.bottom-nav { box-shadow: 0 -4px 16px rgba(15,23,42,0.05); }
.nav-item { min-height: 60px; font-size: 10.5px; }
.nav-item.active svg { stroke-width: 2.4; }
.nav-badge {
  position: absolute; top: 6px; left: 50%; margin-left: 6px;
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--cta); color: #fff; font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.nav-item { position: relative; }

:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

/* ---------- Espaço de foto ---------- */
.foto {
  position: relative; overflow: hidden;
  border-radius: 14px;
  background: var(--bg-card);
  aspect-ratio: 16 / 9;
  margin: 0;
}
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto-vazia {
  border: 1.5px dashed var(--border);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  color: var(--text-muted);
}
.foto-vazia svg { width: 26px; height: 26px; opacity: 0.55; }
.foto-vazia figcaption { font-size: 11.5px; font-weight: 500; opacity: 0.85; text-align: center; padding: 0 8px; }
.foto.r-4x3 { aspect-ratio: 4 / 3; }
.foto.r-1x1 { aspect-ratio: 1 / 1; }
.foto.r-wide { aspect-ratio: 21 / 9; }
.foto.mini { border-radius: 10px; }
.foto.mini svg { width: 20px; height: 20px; }
.foto.mini figcaption { display: none; }

/* ---------- Home ---------- */
.hero { margin-top: 16px; }
.hero-title {
  font-family: 'Bebas Neue', 'Inter', sans-serif;
  font-size: 2.1rem; line-height: 1; letter-spacing: 0.01em;
  color: var(--accent); margin: 16px 0 6px;
}
.hero-text { font-size: 0.92rem; line-height: 1.5; color: var(--text-sec); max-width: 46ch; }

.passos {
  list-style: none; margin: 16px 0 4px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.passos li {
  padding: 0 4px 0 0; font-size: 12px; line-height: 1.35; color: var(--text-sec);
}
.passos b {
  display: flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--highlight); color: var(--texto);
  font-size: 12px; margin-bottom: 6px;
}

.atalhos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 4px; }
.atalho {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  padding: 12px 10px; text-align: left; color: var(--text);
  display: flex; flex-direction: column; gap: 8px; min-height: 84px;
  transition: transform 0.12s, border-color 0.15s;
}
.atalho:active { transform: scale(0.97); }
.atalho:hover { border-color: var(--link); }
.atalho .at-ico {
  width: 32px; height: 32px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; color: #fff;
}
.atalho .at-ico svg { width: 18px; height: 18px; }
.atalho span.at-label { font-size: 12.5px; font-weight: 600; line-height: 1.25; }
.at-azul { background: var(--azul); }
.at-ceu { background: var(--ceu); }
.at-coral { background: var(--coral); }

.bloco-titulo {
  font-size: 1rem; font-weight: 700; color: var(--text);
  margin: 24px 0 4px;
}
.bloco-sub { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px; }

.nivel-ajuda {
  font-size: 0.8rem; color: var(--text-sec); line-height: 1.45;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 12px; margin: -4px 0 4px;
  display: flex; gap: 8px; align-items: flex-start;
}
.nivel-ajuda .fs-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }

.sec-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 520px) { .sec-tiles { grid-template-columns: repeat(3, 1fr); } }
.sec-tile {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  overflow: hidden; text-align: left; color: var(--text);
  display: flex; flex-direction: column;
  transition: transform 0.12s, border-color 0.15s;
}
.sec-tile:active { transform: scale(0.97); }
.sec-tile:hover { border-color: var(--link); }
.sec-tile .foto { border-radius: 0; border-width: 0 0 1.5px 0; }
.sec-tile-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.sec-tile-nome { font-size: 0.92rem; font-weight: 700; line-height: 1.2; }
.sec-tile-count { font-size: 12px; color: var(--text-muted); }
.sec-tile.vazio { opacity: 0.45; }

.nivel-barra { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--bg-chip); gap: 2px; }
.nivel-barra i { display: block; height: 100%; }
.nb-ini { background: var(--c-ini); }
.nb-int { background: var(--c-int); }
.nb-ava { background: var(--c-ava); }

/* ---------- Seção ---------- */
.secao-intro { margin: 16px 0 8px; }
.secao-intro .foto { margin-bottom: 14px; }
.secao-desc { font-size: 0.92rem; line-height: 1.5; color: var(--text); }
.dica {
  margin-top: 10px; font-size: 0.8rem; line-height: 1.45; color: var(--text-sec);
  border-left: 3px solid var(--highlight); padding: 2px 0 2px 10px;
}
.grupo-nivel {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.82rem; font-weight: 700; color: var(--text);
  margin: 20px 0 8px;
}
.grupo-nivel .fs-dot { width: 10px; height: 10px; border-radius: 50%; }
.grupo-nivel small { font-weight: 500; color: var(--text-muted); font-size: 0.78rem; }

.ex-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.ex-row {
  display: flex; gap: 12px; align-items: center;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  padding: 8px; padding-right: 12px; cursor: pointer; text-align: left; width: 100%;
  color: var(--text);
  transition: transform 0.12s, border-color 0.15s;
}
.ex-row:active { transform: scale(0.985); }
.ex-row:hover { border-color: var(--link); }
.ex-row .foto { width: 68px; flex-shrink: 0; }
.ex-row-body { flex: 1; min-width: 0; }
.ex-row-nome { font-size: 0.9rem; font-weight: 600; line-height: 1.3; }
.ex-row-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 5px; font-size: 12px; color: var(--text-muted); }
.ex-row-meta span { display: inline-flex; align-items: center; gap: 4px; }
.ex-row-meta svg { width: 13px; height: 13px; }
.ex-row .chev { width: 18px; height: 18px; color: var(--text-muted); flex-shrink: 0; }
.ex-ordem {
  font-size: 11px; font-weight: 700; color: var(--accent);
}
.ex-row.fav .ex-row-nome::after {
  content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--cta); margin-left: 6px; vertical-align: middle;
}

.pill {
  display: inline-flex; align-items: center; height: 22px; padding: 0 9px;
  border-radius: 11px; font-size: 11.5px; font-weight: 600; color: #fff;
}
.pill-ini { background: var(--c-ini); }
.pill-int { background: var(--c-int); }
.pill-ava { background: var(--c-ava); }

/* ---------- Exercício ---------- */
.top-bar .bar-btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
}
.top-bar .bar-btn svg { width: 21px; height: 21px; }
.top-bar .bar-btn.active svg { fill: var(--coral); stroke: var(--coral); }

.progresso { padding: 12px 0 0; }
.progresso-txt { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; }
.progresso-barra { height: 4px; border-radius: 2px; background: var(--bg-chip); margin-top: 6px; overflow: hidden; }
.progresso-barra i { display: block; height: 100%; background: var(--highlight); border-radius: 2px; }

.ex-hero { margin-top: 12px; }
.ex-titulo {
  font-family: 'Bebas Neue', 'Inter', sans-serif;
  font-size: 1.9rem; line-height: 1.02; letter-spacing: 0.01em;
  color: var(--text); margin: 14px 0 8px;
}
.ex-sub { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ex-codigo { font-size: 12px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.04em; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 4px; }
.info-tile {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
  padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start;
}
.info-tile.full { grid-column: 1 / -1; }
.info-tile svg { width: 18px; height: 18px; color: var(--ceu); flex-shrink: 0; margin-top: 1px; }
.info-tile small { display: block; font-size: 11px; color: var(--text-muted); font-weight: 500; }
.info-tile strong { display: block; font-size: 0.84rem; font-weight: 600; line-height: 1.35; margin-top: 1px; }

.seg {
  display: flex; background: var(--bg-chip); border-radius: 12px; padding: 4px;
  margin: 18px 0 14px; position: sticky; top: 64px; z-index: 50;
}
.seg button {
  flex: 1; height: 38px; border-radius: 9px;
  font-size: 0.82rem; font-weight: 600; color: var(--text-sec);
  transition: background 0.15s, color 0.15s;
}
.seg button.active { background: var(--bg-card); color: var(--accent); box-shadow: 0 1px 3px rgba(15,23,42,0.12); }

.bloco { margin-bottom: 18px; }
.bloco h3 {
  font-size: 0.92rem; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.bloco h3 svg { width: 18px; height: 18px; color: var(--accent); }
.bloco p { font-size: 0.88rem; line-height: 1.6; color: var(--text-sec); }
.caixa {
  border-radius: 12px; padding: 12px 14px;
  font-size: 0.88rem; line-height: 1.55;
}
.caixa-objetivo { background: rgba(2,132,199,0.08); color: var(--text); border: 1px solid rgba(2,132,199,0.2); }
.caixa-meta { background: rgba(255,159,28,0.12); color: var(--text); border: 1px solid rgba(255,159,28,0.35); }
.caixa-erro { background: rgba(255,74,63,0.08); color: var(--text); border: 1px solid rgba(255,74,63,0.25); }
.caixa-facil { background: rgba(30,158,90,0.08); border: 1px solid rgba(30,158,90,0.25); color: var(--text); }
.caixa-dificil { background: rgba(229,53,43,0.07); border: 1px solid rgba(229,53,43,0.22); color: var(--text); }
.caixa strong { display: block; font-size: 12px; margin-bottom: 4px; }

.fotos-passos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fotos-passos .foto { aspect-ratio: 3 / 4; border-radius: 12px; }
.fotos-passos .foto svg { width: 20px; height: 20px; }

.diagrama-box { margin: 0; padding: 0; }
.diagrama-box img { border-radius: 12px; }
.diag-fallback { padding: 14px; }

.step-list { gap: 12px; }
.step-num { width: 26px; height: 26px; font-size: 0.75rem; }
.step-text { font-size: 0.88rem; line-height: 1.55; color: var(--text); padding-top: 3px; }
.bullet-item { font-size: 0.88rem; line-height: 1.55; color: var(--text); }

.acao-bar {
  position: fixed; left: 0; right: 0;
  bottom: calc(60px + env(safe-area-inset-bottom, 0px));
  z-index: 150; pointer-events: none;
}
.acao-bar-inner {
  max-width: 600px; margin: 0 auto;
  padding: 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 8px; pointer-events: auto;
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.acao-bar button {
  height: 46px; border-radius: 12px; font-size: 0.86rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.acao-bar .btn-sec { flex: 0 0 auto; padding: 0 16px; background: var(--bg-card); color: var(--text); border: 1.5px solid var(--border); }
.acao-bar .btn-pri { flex: 1; background: var(--coral); color: #fff; }
.acao-bar button:disabled { opacity: 0.35; pointer-events: none; }
.acao-bar svg { width: 16px; height: 16px; }
.ex-page { padding-bottom: 80px; }

/* Aulas: linha do tempo */
.tempo-barra { display: flex; gap: 3px; height: 8px; margin: 4px 0 16px; border-radius: 4px; overflow: hidden; }
.tempo-barra i { display: block; height: 100%; }
.model-card .foto { border-radius: 0; border-width: 0 0 1.5px 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

<script>
'use strict';
/* ===== DATA ===== */
const EX = [{"numero":1,"secao":1,"nome":"Caminhada de ativa\u00e7\u00e3o do p\u00e9 e tornozelo","nivel":"Iniciante","jogadores":"2 jogadores (ou individual, lado a lado)","tempo":"5 minutos","material":"4 cones J1 J2 1 1 Corredores de 8m (Ponta / Calcanhar / Borda) Quadra 16x8m vista de cima. Na meia-quadra esquerda, 2 cones na linha de fundo (0m) e 2 cones junto \u00e0 rede (8m), formando dois corredores paralelos. J1 no corredor superior e J2 no corredor inferior. Setas tracejadas retas indicam o deslocamento de ida da linha de fundo at\u00e9 a rede e retorno paralelo.","objetivo":"Ativar a musculatura intr\u00ednseca dos p\u00e9s e preparar os tornozelos para a instabilidade da areia fofa.","comoMontar":"Posicione 2 cones na linha de fundo do lado esquerdo da quadra e outros 2 cones a 8 metros de dist\u00e2ncia (junto \u00e0 linha da rede), formando dois corredores paralelos de 8 metros de comprimento na parte de areia mais fofa.","passoAPasso":["Os dois jogadores come\u00e7am na linha de fundo, cada um alinhado ao seu cone de sa\u00edda.","Na primeira ida at\u00e9 a rede (8m), caminham apenas na ponta dos p\u00e9s, empurrando a areia para baixo a cada passo; voltam caminhando normalmente de frente.","Na segunda ida, caminham apenas sobre os calcanhares, mantendo a ponta do p\u00e9 bem levantada; voltam caminhando normalmente.","Na terceira ida, caminham apoiando a borda externa dos p\u00e9s com passos curtos e controlados.","Na quarta ida, caminham afundando o p\u00e9 inteiro e 'agarrando' a areia com os dedos antes de impulsionar o pr\u00f3ximo passo."],"pontosAtencao":["Manter os joelhos sempre levemente flexionados (destravados) durante todo o trajeto.","Postura alta e peito aberto, olhando para a linha da rede e n\u00e3o para os p\u00e9s.","Sentir os dedos do p\u00e9 empurrarem a areia no final de cada passada."],"erroComum":"Andar r\u00e1pido demais com o joelho travado e perder o equil\u00edbrio lateral; corrija pedindo passos lentos de 2 segundos cada e leve flex\u00e3o de joelho. Varia\u00e7\u00f5es","variacaoFacil":"Reduzir o corredor para 5 metros e realizar o exerc\u00edcio na faixa de areia mais batida e firme.","variacaoDificil":"Fazer a ida segurando uma bola acima da cabe\u00e7a com os cotovelos estendidos e voltar caminhando de costas na ponta dos p\u00e9s.","paraTurma":"Com 4 a 12 alunos, forme 2 ou 3 colunas na linha de fundo. O pr\u00f3ximo aluno da fila sai assim que o colega da frente passar da metade do caminho (4 metros), mantendo fluxo cont\u00ednuo sem fila parada.","meta":"Completar as 4 passagens de 8 metros sem desequilibrar ou apoiar a parte errada do p\u00e9 na areia.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 2 cones na linha de fundo (0m) e 2 cones junto \u00e0 rede (8m), formando dois corredores paralelos. J1 no corredor superior e J2 no corredor inferior. Setas tracejadas retas indicam o deslocamento de ida da linha de fundo at\u00e9 a rede e retorno paralelo.","codigo":"AQU-INI-001"},{"numero":2,"secao":1,"nome":"Afundo na areia com rota\u00e7\u00e3o de tronco","nivel":"Iniciante","jogadores":"2 jogadores (lado a lado)","tempo":"6 minutos","material":"2 bolas e 4 cones J1 J2 1 6m de Afundo + Giro Tor\u00e1cico com Bola Quadra 16x8m vista de cima. Na meia-quadra esquerda, 2 cones na linha de fundo e 2 cones a 6 metros dentro da quadra. J1 e J2 posicionados na linha de fundo com bola. Setas tracejadas avan\u00e7am em passos alternados at\u00e9 os cones de 6 metros com pequenos arcos laterais indicando a rota\u00e7\u00e3o de tronco. Objetivo: Destravar os flexores de quadril e","objetivo":"Destravar os flexores de quadril e ganhar mobilidade na coluna tor\u00e1cica para os giros de levantamento e ataque.","comoMontar":"Coloque 2 cones na linha de fundo e 2 cones a 6 metros de dist\u00e2ncia em dire\u00e7\u00e3o ao centro da meia- quadra esquerda. Cada jogador segura uma bola de v\u00f4lei de praia nas m\u00e3os.","passoAPasso":["J1 e J2 saem da linha de fundo segurando a bola \u00e0 frente do peito com os bra\u00e7os semiflexionados.","D\u00e3o um passo amplo \u00e0 frente entrando em afundo at\u00e9 o joelho de tr\u00e1s quase tocar a areia.","Com a base firme na areia, giram o tronco e a bola lentamente para o lado da perna que est\u00e1 na frente e voltam ao centro.","Impulsionam o p\u00e9 da frente contra a areia para subir e avan\u00e7am com a outra perna, repetindo o giro para o novo lado at\u00e9 chegar ao cone de 6 metros."],"pontosAtencao":["O joelho da frente deve apontar na mesma dire\u00e7\u00e3o da ponta do p\u00e9, sem cair para dentro.","Girar apenas os ombros e o t\u00f3rax com a bola, mantendo o quadril firme apontado para a rede.","Soltar o ar pela boca no momento de m\u00e1xima rota\u00e7\u00e3o do tronco."],"erroComum":"Curvar as costas para frente ao descer no afundo; corrija pedindo para manter o umbigo firme e a bola na altura dos ombros. Varia\u00e7\u00f5es","variacaoFacil":"Realizar o afundo mais curto sem bola nas m\u00e3os, mantendo as m\u00e3os apoiadas nos ombros.","variacaoDificil":"Estender os bra\u00e7os completamente \u00e0 frente e, ap\u00f3s girar para o lado, elevar a bola acima da cabe\u00e7a olhando para o c\u00e9u (simulando a busca da bola sob o sol).","paraTurma":"Organize a turma de 4 a 12 alunos lado a lado sobre a linha de fundo inteira (8 metros de largura). Todos avan\u00e7am juntos ao comando do professor em ondas de 6 passadas.","meta":"Executar 12 afundos completos (6 para cada perna) em cada s\u00e9rie mantendo o equil\u00edbrio na subida.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 2 cones na linha de fundo e 2 cones a 6 metros dentro da quadra. J1 e J2 posicionados na linha de fundo com bola. Setas tracejadas avan\u00e7am em passos alternados at\u00e9 os cones de 6 metros com pequenos arcos laterais indicando a rota\u00e7\u00e3o de tronco.","codigo":"AQU-INI-002"},{"numero":3,"secao":1,"nome":"Despertar de ombros e esc\u00e1pulas com bola","nivel":"Iniciante","jogadores":"2 jogadores (frente a frente)","tempo":"6 minutos","material":"1 bola e 2 cones J1 J2 12 Dist\u00e2ncia: 4m Quadra 16x8m vista de cima. No centro da meia-quadra esquerda, 2 cones separados por 4 metros. J1 no cone superior e J2 no cone inferior. Setas cont\u00ednuas numeradas 1 (ida de J1 para J2) e 2 (volta de J2 para J1) mostram a trajet\u00f3ria da bola entre a dupla. Objetivo: Lubrificar a articula\u00e7\u00e3o do ombro e ativar o manguito rotador antes dos movimentos","objetivo":"Lubrificar a articula\u00e7\u00e3o do ombro e ativar o manguito rotador antes dos movimentos de saque e ataque.","comoMontar":"No centro de uma meia-quadra, posicione 2 cones frente a frente a 4 metros de dist\u00e2ncia um do outro. J1 fica em um cone e J2 no outro, paralelos \u00e0 linha lateral.","passoAPasso":["J1 segura a bola com as duas m\u00e3os, leva atr\u00e1s da nuca abrindo bem os cotovelos e o peito, e lan\u00e7a com as duas m\u00e3os para o alto em dire\u00e7\u00e3o a J2.","J2 recebe a bola com os bra\u00e7os estendidos acima da cabe\u00e7a, faz uma circundu\u00e7\u00e3o ampla dos ombros e repete o lan\u00e7amento de nuca para J1 (10 repeti\u00e7\u00f5es).","Em seguida, trocam para arremesso unilateral com o bra\u00e7o de ataque: armam o cotovelo alto atr\u00e1s da linha da orelha e lan\u00e7am a bola direto no peito do parceiro.","Finalizam lan\u00e7ando a bola com quique forte na areia a 1 metro dos p\u00e9s do parceiro, mas como a areia amortece a bola, o colega precisa baixar o quadril r\u00e1pido para apanh\u00e1- la antes que pare."],"pontosAtencao":["Manter o cotovelo do bra\u00e7o de ataque sempre acima da linha do ombro na fase de armar.","Usar a m\u00e3o n\u00e3o dominante apontando para o parceiro para alinhar os ombros.","Acompanhar o movimento at\u00e9 o final ap\u00f3s soltar a bola, cruzando o bra\u00e7o \u00e0 frente do corpo."],"erroComum":"Arremessar apenas com a for\u00e7a do bra\u00e7o e cotovelo baixo; corrija pedindo para girar o tronco e levantar o cotovelo antes de soltar a bola. Varia\u00e7\u00f5es","variacaoFacil":"Diminuir a dist\u00e2ncia entre os cones para 2,5 metros e fazer todos os lan\u00e7amentos com as duas m\u00e3os.","variacaoDificil":"Antes de cada lan\u00e7amento unilateral, o jogador deve dar um pequeno salto na areia e lan\u00e7ar a bola no ponto mais alto antes de tocar o solo.","paraTurma":"Em turmas de 4 a 12 alunos, forme duplas espalhadas pelas duas meias-quadras a 4 metros de dist\u00e2ncia. Caso haja n\u00famero \u00edmpar, forme um trio em tri\u00e2ngulo.","meta":"Completar 20 arremessos certos na m\u00e3o do parceiro (10 com duas m\u00e3os e 10 unilaterais) sem deixar a bola cair na areia.","descricaoDiagrama":"Quadra 16x8m vista de cima. No centro da meia-quadra esquerda, 2 cones separados por 4 metros. J1 no cone superior e J2 no cone inferior. Setas cont\u00ednuas numeradas 1 (ida de J1 para J2) e 2 (volta de J2 para J1) mostram a trajet\u00f3ria da bola entre a dupla.","codigo":"AQU-INI-003"},{"numero":4,"secao":1,"nome":"Passada lateral baixa arrastando a areia","nivel":"Iniciante","jogadores":"2 jogadores (revezando na mesma esta\u00e7\u00e3o)","tempo":"6 minutos","material":"2 cones e 1 bola J1 J2 1 2 4m Lateral Quadra 16x8m vista de cima. No meio da meia-quadra esquerda (a 4m da rede), 2 cones alinhados na largura, distantes 4m entre si. J1 entre os cones com setas tracejadas de vai e vem lateral. J2 pr\u00f3ximo \u00e0 rede observando. Objetivo: Aquecer adutores, gl\u00fateos e quadr\u00edceps na postura baixa de defesa espec\u00edfica da areia.","objetivo":"Aquecer adutores, gl\u00fateos e quadr\u00edceps na postura baixa de defesa espec\u00edfica da areia.","comoMontar":"Coloque 2 cones no meio da meia-quadra esquerda, afastados 4 metros lateralmente (um pr\u00f3ximo \u00e0 linha lateral esquerda e outro pr\u00f3ximo ao centro da quadra).","passoAPasso":["J1 come\u00e7a no cone da esquerda em base baixa de defesa (quadril baixo, costas retas, m\u00e3os \u00e0 frente). J2 aguarda a 2 metros de dist\u00e2ncia marcando o ritmo.","J1 se desloca lateralmente at\u00e9 o cone da direita sem cruzar as pernas e sem saltar, mantendo os p\u00e9s pr\u00f3ximos da superf\u00edcie e empurrando a areia lateralmente.","Ao chegar no cone da direita, J1 toca o topo do cone com a m\u00e3o de fora e retorna imediatamente em passada lateral para o cone da esquerda.","Ap\u00f3s 4 idas e vindas cont\u00ednuas, J1 entrega a vez para J2 enquanto recupera o f\u00f4lego por 20 segundos."],"pontosAtencao":["Nunca cruzar os p\u00e9s nem bater um calcanhar no outro durante o deslocamento lateral.","Manter a cabe\u00e7a na mesma altura do in\u00edcio ao fim, sem subir e descer o quadril (evitar 'galopar').","Tocar o cone flexionando os joelhos e o quadril, e n\u00e3o dobrando apenas a coluna para baixo."],"erroComum":"Saltitar para cima em vez de deslizar baixo na areia; corrija pedindo para deixar um rastro cont\u00ednuo na areia com a lateral do p\u00e9. Varia\u00e7\u00f5es","variacaoFacil":"Diminuir a dist\u00e2ncia entre os cones para 3 metros e tocar o cone apenas na altura da cintura.","variacaoDificil":"J2 fica junto \u00e0 rede com uma bola e, toda vez que J1 toca um cone, J2 mostra 1 ou 2 dedos para J1 gritar o n\u00famero em voz alta enquanto muda de dire\u00e7\u00e3o.","paraTurma":"Monte 3 esta\u00e7\u00f5es de 4 metros (duas na quadra esquerda e uma na direita). Em cada esta\u00e7\u00e3o ficam de 2 a 4 alunos revezando a cada 20 segundos de trabalho intenso.","meta":"Realizar 6 toques nos cones em menos de 18 segundos mantendo o quadril abaixo da linha do quadril inicial.","descricaoDiagrama":"Quadra 16x8m vista de cima. No meio da meia-quadra esquerda (a 4m da rede), 2 cones alinhados na largura, distantes 4m entre si. J1 entre os cones com setas tracejadas de vai e vem lateral. J2 pr\u00f3ximo \u00e0 rede observando.","codigo":"AQU-INI-004"},{"numero":5,"secao":1,"nome":"Corrida com toque nos cones e abertura de quadril","nivel":"Iniciante","jogadores":"2 jogadores","tempo":"7 minutos","material":"4 cones J1 J2 1 2 3 Quadra 16x8m vista de cima. Quatro cones formam um quadrado de 4x4m no centro da meia-quadra esquerda. J1 e J2 nos cones de fundo. Setas tracejadas mostram avan\u00e7o frontal at\u00e9 os cones da frente, troca lateral entre eles e recuo de costas at\u00e9 o fundo.","objetivo":"Aumentar a frequ\u00eancia card\u00edaca e ganhar amplitude articular no quadril para sa\u00eddas de bola curta e bolas no fundo.","comoMontar":"Monte um quadrado de 4 x 4 metros no centro da meia-quadra esquerda usando os 4 cones (2 cones mais pr\u00f3ximos da rede e 2 cones mais pr\u00f3ximos do fundo).","passoAPasso":["J1 inicia no cone traseiro esquerdo; J2 inicia no cone traseiro direito.","Ao sinal, correm de frente at\u00e9 o cone da frente e realizam 2 movimentos amplos de abertura de quadril (elevando o joelho \u00e0 frente e girando para fora).","Deslocam-se lateralmente trocando de lugar com o parceiro entre os cones da frente.","Voltam de costas at\u00e9 os cones traseiros realizando abertura de quadril de fora para dentro (fechando a porteira) a cada dois passos.","Tocam o cone de fundo com a m\u00e3o e iniciam o pr\u00f3ximo giro invertendo o sentido."],"pontosAtencao":["No recuo de costas, manter o peso do corpo na ponta dos p\u00e9s e o tronco levemente inclinado \u00e0 frente para n\u00e3o sentar na areia.","Fazer o giro do joelho bem amplo, como se estivesse passando a perna por cima de um obst\u00e1culo baixo.","Olhar por cima do ombro ao recuar para localizar o cone de fundo."],"erroComum":"Correr de costas apoiando o calcanhar e cair sentado na areia; corrija pedindo que o queixo fique alinhado \u00e0 frente dos joelhos no recuo. Varia\u00e7\u00f5es","variacaoFacil":"Fazer todo o trajeto em trote leve, realizando a abertura de quadril parado ao chegar em cada cone.","variacaoDificil":"Adicionar um salto vertical simulando bloqueio nos cones da frente antes de fazer a troca lateral.","paraTurma":"Monte dois quadrados de 4x4m (um em cada lado da rede). Coloque at\u00e9 6 alunos por quadrado, saindo em duplas a cada 5 segundos.","meta":"Completar 5 voltas completas no quadrado sem esbarrar no parceiro e mantendo a coordena\u00e7\u00e3o do quadril.","descricaoDiagrama":"Quadra 16x8m vista de cima. Quatro cones formam um quadrado de 4x4m no centro da meia-quadra esquerda. J1 e J2 nos cones de fundo. Setas tracejadas mostram avan\u00e7o frontal at\u00e9 os cones da frente, troca lateral entre eles e recuo de costas at\u00e9 o fundo.","codigo":"AQU-INI-005"},{"numero":6,"secao":1,"nome":"Jogo de espelho na rede","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (1 l\u00edder e 1 espelho, um de cada lado da rede)","tempo":"7 minutos","material":"4 cones J1 J2 1 1 L\u00edder (J1) x Espelho (J2) Quadra 16x8m vista de cima. Junto \u00e0 rede central, 2 cones no lado esquerdo e 2 cones no lado direito afastados 5m na largura. J1 \u00e0 esquerda da rede e J2 \u00e0 direita da rede, frente a frente. Setas tracejadas espelhadas para cima e para baixo indicam os deslocamentos sincronizados. Objetivo: Ativar a velocidade de rea\u00e7\u00e3o visual, a","objetivo":"Ativar a velocidade de rea\u00e7\u00e3o visual, a leitura perif\u00e9rica e a explos\u00e3o lateral curta junto \u00e0 rede.","comoMontar":"Coloque 2 cones de cada lado da rede (a 50 cm da linha central), afastados 5 metros um do outro, delimitando a faixa de atua\u00e7\u00e3o do bloqueador.","passoAPasso":["J1 (l\u00edder) e J2 (espelho) posicionam-se frente a frente, separados pela rede, com as m\u00e3os altas na altura da fita.","J1 se movimenta livremente entre seus dois cones usando passadas laterais, passadas cruzadas curtas ou fintas de corpo.","J2 precisa copiar exatamente a posi\u00e7\u00e3o de J1 em tempo real, mantendo-se sempre alinhado peito a peito com ele atrav\u00e9s da rede.","Sempre que J1 saltar para tocar pr\u00f3ximo \u00e0 fita superior, J2 deve saltar junto no mesmo ponto; a cada 30 segundos, invertem-se os pap\u00e9is."],"pontosAtencao":["Manter as m\u00e3os sempre acima da linha dos ombros durante todo o deslocamento na rede.","Frear na areia cravando a borda interna do p\u00e9 de fora antes de mudar de dire\u00e7\u00e3o ou saltar.","Focar o olhar no centro do peito do advers\u00e1rio, e n\u00e3o nos p\u00e9s ou nas m\u00e3os."],"erroComum":"Tocar na rede por projetar o corpo para frente ao saltar; corrija exigindo salto estritamente vertical ap\u00f3s estancar a passada na areia. Varia\u00e7\u00f5es","variacaoFacil":"Apenas deslocamento lateral sem saltos, em faixa reduzida de 3 metros.","variacaoDificil":"O l\u00edder segura uma bola e pode fingir que vai pass\u00e1-la por cima da fita ou abaixar rapidamente tocando a areia, obrigando o espelho a reagir ao n\u00edvel alto e baixo.","paraTurma":"Com 4 a 12 alunos, forme duplas ao longo da rede (cabem 2 duplas simult\u00e2neas dividindo os 8m de rede em duas faixas de 4m). Enquanto 4 trabalham por 25 segundos, os outros 4 a 8 aguardam a 3 metros da rede prontos para entrar.","meta":"Acompanhar o l\u00edder durante 3 s\u00e9ries de 25 segundos com atraso visual m\u00ednimo e realizar pelo menos 4 saltos simult\u00e2neos sem tocar na rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. Junto \u00e0 rede central, 2 cones no lado esquerdo e 2 cones no lado direito afastados 5m na largura. J1 \u00e0 esquerda da rede e J2 \u00e0 direita da rede, frente a frente. Setas tracejadas espelhadas para cima e para baixo indicam os deslocamentos sincronizados.","codigo":"AQU-INT-006"},{"numero":7,"secao":1,"nome":"Prancha din\u00e2mica na areia com disputa de bola","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (frente a frente)","tempo":"6 minutos","material":"1 bola e 2 cones J1 J2 1 Prancha Din\u00e2mica + Disputa da Bola Central Quadra 16x8m vista de cima. No centro da meia-quadra esquerda, J1 e J2 frente a frente separados por 1,5m com uma bola centralizada entre eles. Pequenas setas laterais indicam o deslocamento curto em prancha e setas n\u00famero 1 apontam de ambos os jogadores para a bola no centro. Objetivo: Ativar intensamente o core (abd\u00f4men e lombar), a estabilidade escapular e o tempo de","objetivo":"Ativar intensamente o core (abd\u00f4men e lombar), a estabilidade escapular e o tempo de rea\u00e7\u00e3o r\u00e1pida.","comoMontar":"Na meia-quadra esquerda, posicione 2 cones afastados 1,5 metro para marcar onde ficam os apoios de m\u00e3o de cada jogador e coloque 1 bola parada na areia exatamente no meio entre eles.","passoAPasso":["J1 e J2 ficam em posi\u00e7\u00e3o de prancha alta (apoio nas m\u00e3os e na ponta dos p\u00e9s na areia), de frente um para o outro, com a bola no ch\u00e3o a igual dist\u00e2ncia dos dois.","Ao comando, ambos tocam alternadamente: m\u00e3o direita no ombro esquerdo, m\u00e3o esquerda no ombro direito, m\u00e3o direita no quadril, m\u00e3o esquerda no quadril.","Em seguida, realizam 2 passos laterais curtos em prancha (m\u00e3o e p\u00e9 juntos) para a direita e 2 para a esquerda, voltando ao centro.","Quando um dos jogadores (ou o professor) gritar 'BOLA!', vence o ponto quem puxar a bola para o seu lado primeiro sem apoiar os joelhos na areia."],"pontosAtencao":["Manter os p\u00e9s afastados na largura dos ombros para impedir que o quadril balance ao tirar uma m\u00e3o da areia.","Empurrar a areia com for\u00e7a com a m\u00e3o de apoio, mantendo o ombro longe da orelha.","Contrair o abd\u00f4men e os gl\u00fateos para n\u00e3o deixar a lombar afundar em dire\u00e7\u00e3o \u00e0 areia."],"erroComum":"Levantar demais o quadril formando uma pir\u00e2mide para facilitar o apoio; corrija alinhando ombros, quadril e tornozelos numa linha reta. Varia\u00e7\u00f5es","variacaoFacil":"Apoiar os joelhos na areia durante os toques no ombro e s\u00f3 tirar os joelhos no momento do comando final.","variacaoDificil":"Antes do comando 'BOLA!', incluir uma flex\u00e3o de bra\u00e7o r\u00e1pida com subida explosiva em um p\u00e9 s\u00f3 antes de puxar a bola.","paraTurma":"Em turmas de 4 a 12 alunos, coloque todas as duplas frente a frente ao longo da linha central ou lateral, cada dupla com 1 bola no meio. O professor d\u00e1 os comandos em voz alta variando a ordem (ombro, cabe\u00e7a, joelho, BOLA!).","meta":"Vencer 3 disputas de bola em uma melhor de 5 s\u00e9ries mantendo a postura de prancha \u00edntegra sem cair com o quadril na areia.","descricaoDiagrama":"Quadra 16x8m vista de cima. No centro da meia-quadra esquerda, J1 e J2 frente a frente separados por 1,5m com uma bola centralizada entre eles. Pequenas setas laterais indicam o deslocamento curto em prancha e setas n\u00famero 1 apontam de ambos os jogadores para a bola no centro.","codigo":"AQU-INT-007"},{"numero":8,"secao":1,"nome":"Controle de manchete e toque caminhando na areia","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"8 minutos","material":"1 bola e 4 cones J1 J2 1 2 3 4 Quadra 16x8m vista de cima. Na meia-quadra esquerda, 2 cones no fundo e 2 cones na rede (3m de largura). J1 e J2 avan\u00e7am do fundo para a rede (setas tracejadas paralelas) enquanto a bola faz um zigue-zague numerado 1, 2, 3, 4","objetivo":"Calibrar o toque na bola em movimento enquanto as pernas vencem a resist\u00eancia da areia fofa.","comoMontar":"Coloque 2 cones na linha de fundo (afastados 3 metros entre si) e outros 2 cones junto \u00e0 rede (tamb\u00e9m afastados 3 metros), criando uma pista da linha de fundo at\u00e9 a rede.","passoAPasso":["J1 e J2 posicionam-se nos cones da linha de fundo, de frente um para o outro (a 3 metros de dist\u00e2ncia lateral).","J1 inicia passando a bola de manchete para J2; imediatamente ap\u00f3s tocar na bola, ambos d\u00e3o dois passos laterais em dire\u00e7\u00e3o \u00e0 rede.","J2 devolve a bola de toque limpo (m\u00e3os acima da testa) para a frente de J1, obrigando a dupla a continuar avan\u00e7ando sem parar de caminhar na areia.","Ao tocarem a linha da rede ap\u00f3s 8 metros de troca cont\u00ednua, retornam at\u00e9 a linha de fundo mantendo a bola no ar."],"pontosAtencao":["Sempre parar os p\u00e9s na areia por uma fra\u00e7\u00e3o de segundo no instante exato do contato com a bola, voltando a caminhar logo depois.","Direcionar a bola meio metro \u00e0 frente do ombro do parceiro para guiar o avan\u00e7o rumo \u00e0 rede.","No toque, finalizar com as duas m\u00e3os sim\u00e9tricas e limpas, respeitando o rigor da arbitragem de praia."],"erroComum":"Golpear a bola enquanto ainda est\u00e1 dando o passo, fazendo a bola escapar para tr\u00e1s; corrija com a regra 'desloca, planta os p\u00e9s na areia, toca na bola'. Varia\u00e7\u00f5es","variacaoFacil":"Permitir que cada jogador d\u00ea um controle para o alto para si mesmo antes de passar a bola ao colega.","variacaoDificil":"Exigir que todo passe seja precedido por uma batida de palmas atr\u00e1s das costas ou um toque de uma m\u00e3o na areia antes de entrar debaixo da bola.","paraTurma":"Com 4 a 12 alunos, as duplas saem em ondas da linha de fundo em dire\u00e7\u00e3o \u00e0 rede. Ao chegarem na rede, saem pelas laterais externas da quadra trotando por fora at\u00e9 a linha de fundo para nova sa\u00edda.","meta":"Completar o trajeto de ida e volta (16 metros totais) com pelo menos 14 contatos consecutivos sem deixar a bola cair na areia.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 2 cones no fundo e 2 cones na rede (3m de largura). J1 e J2 avan\u00e7am do fundo para a rede (setas tracejadas paralelas) enquanto a bola faz um zigue-zague numerado 1, 2, 3, 4 entre eles.","codigo":"AQU-INT-008"},{"numero":9,"secao":1,"nome":"Mergulho curto controlado (peixinho de aquecimento)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (1 lan\u00e7ador e 1 defensor)","tempo":"8 minutos","material":"2 bolas, 2 cones e 1 zona alvo ALVO J1J2 12 3 Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 junto \u00e0 rede com zona alvo ao lado. J2 a 4m da rede entre 2 cones. Seta 1 mostra bola curta lan\u00e7ada por J1; seta tracejada mostra avan\u00e7o diagonal de J2; seta 2 mostra a bola subindo de volta para a zona alvo na rede.","objetivo":"Perder o receio de ir ao ch\u00e3o e aquecer a mec\u00e2nica segura de queda e recupera\u00e7\u00e3o r\u00e1pida na areia.","comoMontar":"J1 (lan\u00e7ador) fica junto \u00e0 rede no centro da quadra com as bolas e uma zona alvo demarcada ao seu lado. J2 (defensor) posiciona-se a 4 metros da rede, entre 2 cones afastados 2 metros lateralmente.","passoAPasso":["J2 come\u00e7a em postura bem baixa de defesa, com um joelho quase tocando a areia.","J1 lan\u00e7a uma bola curta e baixa, cerca de 1,5 metro \u00e0 frente e na diagonal de J2.","J2 d\u00e1 um passo rasante afundando a perna da frente, toca a bola de baixo para cima (manchete ou dorso da m\u00e3o) em dire\u00e7\u00e3o \u00e0 zona alvo na rede e desliza o peito/abd\u00f4men na areia amortecendo com as m\u00e3os.","Imediatamente ap\u00f3s tocar a areia, J2 empurra o ch\u00e3o, levanta r\u00e1pido e volta \u00e0 base para receber a segunda bola no lado oposto; trocam de fun\u00e7\u00e3o a cada 6 bolas."],"pontosAtencao":["Deslizar para frente sobre o peito e abd\u00f4men com o queixo erguido, nunca batendo a ponta do joelho ou o cotovelo de cima para baixo na areia.","Tocar na bola antes que o peito encoste na areia.","Usar o impulso dos bra\u00e7os contra a areia para j\u00e1 levantar em posi\u00e7\u00e3o atl\u00e9tica."],"erroComum":"Saltar para o alto e cair pesado de barriga na areia; corrija pedindo para afundar o centro de gravidade pr\u00f3ximo ao ch\u00e3o antes de projetar o corpo \u00e0 frente. Varia\u00e7\u00f5es","variacaoFacil":"Iniciar o movimento j\u00e1 ajoelhado na areia para treinar apenas o deslizamento de peito e o toque na bola sem impacto.","variacaoDificil":"J2 come\u00e7a de costas para a rede; J1 bate na bola fazendo barulho e J2 vira r\u00e1pido para buscar a bola curta no peixinho.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 lan\u00e7adores na rede (um em cada metade da largura da quadra) e duas filas de defensores a 4 metros. Cada aluno defende 2 bolas seguidas e vai para o fim da fila.","meta":"Recuperar 7 de 10 bolas curtas enviando-as com altura m\u00ednima da fita da rede at\u00e9 a zona alvo ao lado do lan\u00e7ador.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 junto \u00e0 rede com zona alvo ao lado. J2 a 4m da rede entre 2 cones. Seta 1 mostra bola curta lan\u00e7ada por J1; seta tracejada mostra avan\u00e7o diagonal de J2; seta 2 mostra a bola subindo de volta para a zona alvo na rede.","codigo":"AQU-INT-009"},{"numero":10,"secao":1,"nome":"Toque de costas e giro r\u00e1pido de pesco\u00e7o e tronco","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (ou 2 jogadores usando 2 alvos fixos)","tempo":"8 minutos","material":"1 bola e 3 cones J1 J2 J3 1 2 3 Toque de Costas + Giro de 180\u00b0 na Areia Quadra 16x8m vista de cima. Na meia-quadra esquerda, 3 cones alinhados da linha de fundo at\u00e9 a rede: J1 no fundo, J2 no meio e J3 junto \u00e0 rede. Seta 1 vai de J1 para J2; seta 2 vai de costas de J2 para J3; seta circular ao redor de J2 indica o giro de 180 graus na areia. Objetivo: Ativar a mobilidade cervical, o","objetivo":"Ativar a mobilidade cervical, o equil\u00edbrio na areia fofa e a orienta\u00e7\u00e3o espacial ap\u00f3s giros de 180 graus.","comoMontar":"Disponha 3 cones em linha reta do fundo at\u00e9 a rede na meia-quadra esquerda, com 3,5 metros entre cada cone (cone 1 a 1m do fundo, cone 2 no centro a 4,5m, cone 3 junto \u00e0 rede). J1 no fundo, J2 no meio e J3 na rede.","passoAPasso":["J1 (no fundo) passa a bola alta para J2 (no centro), que est\u00e1 de frente para J1.","J2 entra embaixo da bola, estabiliza os p\u00e9s na areia e executa um levantamento de toque de costas limpo para J3 (na rede).","Assim que a bola sai de suas m\u00e3os, J2 gira 180 graus rapidamente na areia para ficar de frente para J3.","J3 devolve a bola para J2, que agora faz novo toque de costas enviando a bola de volta para J1 no fundo e gira 180 graus novamente; trocam o jogador do meio a cada 90 segundos."],"pontosAtencao":["Entrar bem embaixo da bola para que ela esteja exatamente acima da testa antes de arquear levemente a coluna tor\u00e1cica.","N\u00e3o girar o corpo durante o toque de costas; o giro de 180 graus acontece somente depois que a bola sai limpa das m\u00e3os.","Usar passos curtos de ajuste na areia ap\u00f3s cada giro para achar a bola no ar rapidamente."],"erroComum":"Deixar a bola cair atr\u00e1s da cabe\u00e7a e carregar (conduzir) a bola para tr\u00e1s; corrija exigindo parada total dos p\u00e9s e finaliza\u00e7\u00e3o r\u00e1pida de punhos para cima. Varia\u00e7\u00f5es","variacaoFacil":"Fazer o exerc\u00edcio usando manchete para frente, depois girar 180 graus para receber do outro lado tamb\u00e9m de manchete.","variacaoDificil":"Antes de J2 tocar de costas, o jogador que vai receber grita 'DIREITA' ou 'ESQUERDA', e J2 precisa deslocar 1 metro para o lado pedido ap\u00f3s o giro.","paraTurma":"Em apenas uma meia-quadra cabem 2 trios trabalhando em linhas paralelas (6 alunos), ou at\u00e9 4 trios usando a quadra inteira (12 alunos). Se estiver apenas em dupla (2 jogadores), coloque uma zona alvo no cone 3 para o jogador do meio acertar de costas.","meta":"Executar 10 levantamentos de costas limpos e precisos seguidos na m\u00e3o dos colegas sem cometer dupla falta ou condu\u00e7\u00e3o.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 3 cones alinhados da linha de fundo at\u00e9 a rede: J1 no fundo, J2 no meio e J3 junto \u00e0 rede. Seta 1 vai de J1 para J2; seta 2 vai de costas de J2 para J3; seta circular ao redor de J2 indica o giro de 180 graus na areia.","codigo":"AQU-AVA-010"},{"numero":11,"secao":1,"nome":"Mini-jogo de aquecimento s\u00f3 com poke e largada de falange","nivel":"Avan\u00e7ado","jogadores":"2 jogadores (1 contra 1 em quadra curta)","tempo":"9 minutos","material":"1 bola e 4 cones ZONA 4x4m ZONA 4x4m J1 J2 1 2 Quadra 16x8m vista de cima. Cones delimitam duas zonas de 4x4m coladas \u00e0 rede (esquerda e direita). J1 na zona esquerda e J2 na zona direita. Setas tracejadas mostram avan\u00e7os e recuos r\u00e1pidos; setas 1 e 2 cruzam a rede com trajet\u00f3rias arqueadas curtas (poke).","objetivo":"Aquecer as articula\u00e7\u00f5es dos dedos e a explos\u00e3o de pernas usando exclusivamente os golpes curtos oficiais da praia.","comoMontar":"Use os 4 cones para demarcar uma quadra curta de 4 x 4 metros de cada lado da rede (da linha central at\u00e9 4 metros de profundidade e 4 metros de largura).","passoAPasso":["J1 e J2 iniciam o rally passando a bola por cima da rede a partir da linha de 4 metros.","O jogo acontece com no m\u00e1ximo 2 toques seguidos por jogador (1\u00ba contato de manchete para o alto e 2\u00ba contato passando a bola para o outro lado).","Regra obrigat\u00f3ria: para passar a bola por cima da rede, s\u00f3 vale usar 'poke' (cotovelada/n\u00f3 dos dedos r\u00edgidos), 'cobra' (pontas dos dedos unidas e r\u00edgidas) ou manchete.","\u00c9 proibido largar a bola com a palma da m\u00e3o aberta ou empurr\u00e1-la com os dedos moles (infra\u00e7\u00e3o na praia); vence o rally quem fizer a bola tocar na areia dentro do quadrado de 4x4m advers\u00e1rio."],"pontosAtencao":["Manter os dedos rigidamente unidos no golpe de cobra ou as falanges dobradas e firmes no poke para n\u00e3o caracterizar condu\u00e7\u00e3o.","Elevar bem o cotovelo como se fosse atacar forte antes de aplicar o poke curto para enganar o advers\u00e1rio.","Voltar imediatamente ao centro do quadrado de 4x4m ap\u00f3s cada golpe na rede."],"erroComum":"Empurrar a bola com a ponta dos dedos mole (largada de quadra indoor); corrija parando o ponto imediatamente e mostrando o contato seco com os n\u00f3s dos dedos (falanges). Varia\u00e7\u00f5es","variacaoFacil":"Permitir exclusivamente 2 contatos obrigat\u00f3rios e diminuir a largura da mini-quadra para 3 x 3 metros.","variacaoDificil":"Permitir passar de primeira ou de segunda bola, obrigando o jogador a tocar a m\u00e3o na linha da rede ap\u00f3s cada bola enviada para o outro lado.","paraTurma":"Divida a largura de 8 metros da quadra ao meio com uma linha de cones: ficam duas mini-quadras de 4x4m lado a lado. Jogam 4 alunos simultaneamente em partidas curtas de 'rei da quadra' at\u00e9 3 pontos, com rod\u00edzio r\u00e1pido dos alunos de fora.","meta":"Disputar um set curto at\u00e9 7 pontos sem cometer nenhuma infra\u00e7\u00e3o de toque irregular ou largada aberta.","descricaoDiagrama":"Quadra 16x8m vista de cima. Cones delimitam duas zonas de 4x4m coladas \u00e0 rede (esquerda e direita). J1 na zona esquerda e J2 na zona direita. Setas tracejadas mostram avan\u00e7os e recuos r\u00e1pidos; setas 1 e 2 cruzam a rede com trajet\u00f3rias arqueadas curtas (poke).","codigo":"AQU-AVA-011"},{"numero":12,"secao":1,"nome":"Circuito reativo de sol, vento e bola curta","nivel":"Avan\u00e7ado","jogadores":"2 jogadores (ou trio em rod\u00edzio)","tempo":"10 minutos","material":"3 bolas, 4 cones e 1 zona alvo na rede SOL / VENTO ALVO J1 J2 1 2 3 4 Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 no cone central a 5m","objetivo":"Concluir o aquecimento integrando explos\u00e3o m\u00e1xima na areia, leitura visual contra o sol/vento e precis\u00e3o de manchete.","comoMontar":"Escolha o lado da quadra em que o jogador olhe contra o sol ou contra o vento. Coloque 1 cone central a 5 metros da rede (base), 1 cone na lateral esquerda, 1 cone na lateral direita e uma zona alvo junto \u00e0 rede.","passoAPasso":["J1 fica na base central (a 5m da rede) em skipping baixo (trote acelerado no lugar movendo a areia); J2 fica na rede com 3 bolas.","Ao comando de J2 ('ESQUERDA!' ou 'DIREITA!'), J1 corre em velocidade m\u00e1xima at\u00e9 o cone lateral correspondente e toca-o com a m\u00e3o.","Imediatamente ap\u00f3s o toque no cone, J2 lan\u00e7a uma bola alta no centro da quadra (for\u00e7ando J1 a olhar para o alto contra o sol/vento) seguida de uma bola curta pr\u00f3xima \u00e0 rede.","J1 ajusta os passos conforme o vento, passa a bola alta de manchete para a zona alvo, arranca para frente e salva a bola curta de poke sobre a rede.","Ap\u00f3s a sequ\u00eancia de 3 bolas, J1 e J2 invertem as fun\u00e7\u00f5es."],"pontosAtencao":["Dar o \u00faltimo passo largo e est\u00e1vel na areia antes de fazer a manchete na bola alta, compensando a a\u00e7\u00e3o do vento.","Usar a m\u00e3o livre como viseira r\u00e1pida ou virar levemente a linha dos ombros para n\u00e3o perder a bola no sol antes do contato.","N\u00e3o esperar a primeira bola cair no alvo para j\u00e1 iniciar a arrancada rumo \u00e0 bola curta na rede."],"erroComum":"Correr olhando para o ch\u00e3o e perder o tempo da bola alta que o vento carrega; corrija pedindo para localizar a bola no instante em que ela sai da m\u00e3o do lan\u00e7ador. Varia\u00e7\u00f5es","variacaoFacil":"Fazer apenas 1 bola por sa\u00edda (alternando uma sa\u00edda para bola alta e outra para bola curta) com intervalo de 10 segundos.","variacaoDificil":"J1 come\u00e7a deitado de peito na areia; ao sinal, levanta, toca no cone lateral e executa a sequ\u00eancia de bola alta + bola curta sem pausa.","paraTurma":"Em turmas de 4 a 12 alunos, o professor comanda os lan\u00e7amentos na rede enquanto os alunos saem em fila da linha de fundo. Assim que o aluno da frente ataca a bola curta na rede, ele recolhe as duas bolas, entrega na cesta do professor e o pr\u00f3ximo j\u00e1 est\u00e1 no cone central em skipping.","meta":"Acertar pelo menos 5 das 6 bolas da s\u00e9rie (3 altas na zona alvo e 3 curtas por cima da rede) em ritmo m\u00e1ximo.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 no cone central a 5m da rede, com cones nas duas laterais. J2 junto \u00e0 rede ao lado da zona alvo. Seta tracejada vai de J1 ao cone lateral, depois ao centro e avan\u00e7a \u00e0 rede. Setas 1 e 2 mostram os lan\u00e7amentos de J2 e seta 3 a resposta para a zona alvo.","codigo":"AQU-AVA-012"},{"numero":13,"secao":2,"nome":"Base ativa e destrave na areia","nivel":"Iniciante","jogadores":"2 jogadores (1 em base de defesa e 1 dando o est\u00edmulo na rede)","tempo":"6 minutos","material":"2 cones e 1 bola J1 J2 1 2 5m da rede: Destrave (Split-Step) ao toque na bola Quadra 16x8m vista de cima. Na meia-quadra esquerda, 2 cones a 5m da rede. J1 posicionado no cone superior (5m da rede) e J2 junto \u00e0 rede com bola. Seta tracejada 1 indica o micro-avan\u00e7o e abertura de base de J1 no momento do","objetivo":"Automatizar a postura de prontid\u00e3o e o micro-passo de destrave ('split-step' da areia) no instante do contato advers\u00e1rio.","comoMontar":"Na meia-quadra esquerda, posicione 2 cones a 5 metros da rede, afastados 3 metros entre si (um na diagonal e outro na paralela). J1 fica sobre um dos cones e J2 fica junto \u00e0 rede de frente para ele segurando uma bola.","passoAPasso":["J1 assume a posi\u00e7\u00e3o de base: p\u00e9s ligeiramente mais largos que os ombros, joelhos flexionados, quadril baixo, tronco inclinado \u00e0 frente e m\u00e3os livres \u00e0 frente da cintura.","J1 mant\u00e9m os p\u00e9s vivos mexendo levemente a areia com a ponta dos p\u00e9s, sem enterrar os calcanhares.","J2 levanta a bola acima da cabe\u00e7a e bate com a palma da m\u00e3o nela (simulando o momento exato do ataque ou saque).","No exato instante da batida na bola, J1 executa o destrave (pequena abertura r\u00e1pida dos dois p\u00e9s na areia baixando 5 cm o quadril) e d\u00e1 1 passo curto de leitura para frente estabilizando a base.","Ap\u00f3s 10 repeti\u00e7\u00f5es no cone da esquerda, J1 muda para o cone da direita; depois invertem os pap\u00e9is."],"pontosAtencao":["Manter 70% do peso corporal nas pontas dos p\u00e9s (antep\u00e9) e os calcanhares apenas ro\u00e7ando na areia.","O destrave n\u00e3o \u00e9 um pulo alto para cima: \u00e9 um desbloqueio r\u00e1pido das articula\u00e7\u00f5es de tornozelo e joelho rente \u00e0 areia.","Os cotovelos devem ficar \u00e0 frente da linha das costelas, prontos para fechar a manchete ou subir para a cabe\u00e7a."],"erroComum":"Ficar com os p\u00e9s chapados e enterrados na areia esperando a bola sair; corrija exigindo que os dois p\u00e9s abram um dedo de largura exatamente quando a m\u00e3o de J2 tocar a bola. Varia\u00e7\u00f5es","variacaoFacil":"J2 conta '1, 2 e 3!' em voz alta antes de bater na bola para ajudar J1 a sincronizar o tempo do destrave.","variacaoDificil":"Ap\u00f3s o destrave, J2 aponta para a esquerda ou para a direita e J1 precisa cravar o primeiro passo lateral al\u00e9m do avan\u00e7o.","paraTurma":"Com 4 a 12 alunos, posicione todos espalhados na meia-quadra esquerda a 4 e 6 metros da rede olhando para o professor na rede. Todos executam o destrave juntos a cada batida na bola do professor.","meta":"Sincronizar 9 de 10 destraves exatamente no milissegundo da batida na bola sem atrasar nem pular alto.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 2 cones a 5m da rede. J1 posicionado no cone superior (5m da rede) e J2 junto \u00e0 rede com bola. Seta tracejada 1 indica o micro-avan\u00e7o e abertura de base de J1 no momento do est\u00edmulo; depois J1 alterna para o cone inferior (seta tracejada 2).","codigo":"DES-INI-013"},{"numero":14,"secao":2,"nome":"Primeiro passo explosivo de empurr\u00e3o","nivel":"Iniciante","jogadores":"2 jogadores (lado a lado)","tempo":"7 minutos","material":"4 cones J1 J2 1 1 2 Explos\u00e3o de 3m (6m 3m da rede) Quadra 16x8m vista de cima. Na meia-quadra esquerda, 2 cones a 6m da rede (sa\u00edda) e 2 cones a 3m da rede (chegada). J1 e J2 nos cones de 6m. Setas tracejadas retas numeradas 1 mostram a explos\u00e3o de 3 metros para frente at\u00e9 os","objetivo":"Aprender a tracionar a areia empurrando com a borda interna do p\u00e9 de tr\u00e1s sem dar passo em falso para tr\u00e1s.","comoMontar":"Coloque 2 cones de sa\u00edda a 6 metros da rede na meia- quadra esquerda e outros 2 cones de chegada 3 metros \u00e0 frente (a 3 metros da rede), formando duas raias curtas de explos\u00e3o.","passoAPasso":["J1 e J2 posicionam-se nos cones de sa\u00edda (a 6m da rede) em base baixa de defesa.","Ao sinal visual ou sonoro, empurram a areia com for\u00e7a usando a bola do p\u00e9 e a borda interna do p\u00e9 de tr\u00e1s, projetando o peito e o joelho da frente rumo ao cone de 3 metros.","Chegam ao cone da frente em no m\u00e1ximo 3 passadas r\u00e1pidas e param equilibrados em postura baixa de manchete, tocando a ponta do cone.","Retornam caminhando devagar at\u00e9 a marca de 6 metros, alisam a areia com o p\u00e9 no ponto de sa\u00edda e repetem trocando a perna que inicia a explos\u00e3o."],"pontosAtencao":["Proibido dar o 'passo negativo' (recuar um p\u00e9 para tr\u00e1s antes de arrancar para frente).","Inclinarem o tronco a 45 graus \u00e0 frente no primeiro passo para vencer a in\u00e9rcia da areia fofa.","Usar os bra\u00e7os de forma vigorosa (cotovelo puxando para tr\u00e1s) no primeiro segundo de arrancada."],"erroComum":"Tentar puxar o ch\u00e3o com o p\u00e9 da frente em vez de empurrar a areia com o p\u00e9 de tr\u00e1s; corrija observando o buraco na areia que deve ficar atr\u00e1s do p\u00e9 de impuls\u00e3o. Varia\u00e7\u00f5es","variacaoFacil":"Iniciar j\u00e1 com um p\u00e9 20 cm \u00e0 frente do outro (base assim\u00e9trica) para facilitar a aplica\u00e7\u00e3o de for\u00e7a.","variacaoDificil":"Sair sentado de frente na areia; ao sinal, levantar sem apoiar os dois joelhos juntos e explodir nos 3 metros.","paraTurma":"Em turmas de 4 a 12 alunos, forme 3 ou 4 filas na linha de 6 metros. Os alunos saem em ondas de 3 ou 4 ao comando do professor, estancam na linha de 3 metros e voltam pelas laterais externas da quadra.","meta":"Completar 8 de 10 sa\u00eddas de 3 metros sem nenhum passo em falso para tr\u00e1s e parando equilibrado no cone final.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 2 cones a 6m da rede (sa\u00edda) e 2 cones a 3m da rede (chegada). J1 e J2 nos cones de 6m. Setas tracejadas retas numeradas 1 mostram a explos\u00e3o de 3 metros para frente at\u00e9 os cones de 3m; setas tracejadas 2 mostram o retorno tranquilo pelas laterais.","codigo":"DES-INI-014"},{"numero":15,"secao":2,"nome":"Passada lateral curta entre cones","nivel":"Iniciante","jogadores":"2 jogadores (trabalhando simultaneamente em faixas paralelas)","tempo":"7 minutos","material":"4 cones J1J2 1 21 Quadra 16x8m vista de cima. Na meia-quadra esquerda, corredor lateral de 3m com 2 cones a 3m da rede (J1) e outro corredor de 3m com 2 cones a 6m da rede (J2). Setas tracejadas 1 (ida lateral) e 2 (volta lateral) mostram o movimento paralelo \u00e0 rede. Objetivo: Dominar o deslocamento lateral curto de ajuste mantendo o quadril nivelado e o peito","objetivo":"Dominar o deslocamento lateral curto de ajuste mantendo o quadril nivelado e o peito voltado para a rede.","comoMontar":"Na meia-quadra esquerda, monte duas linhas laterais de 3 metros de largura: 2 cones a 3 metros da rede (para J1) e 2 cones a 6 metros da rede (para J2).","passoAPasso":["J1 posiciona-se no cone esquerdo da linha de 3m; J2 posiciona-se no cone esquerdo da linha de 6m.","Ao sinal, deslocam-se em passada lateral ('abre-fecha') at\u00e9 o cone da direita (3 metros), mantendo o peito sempre apontado para a rede.","O p\u00e9 da dire\u00e7\u00e3o do movimento abre rasante na areia e o p\u00e9 oposto empurra a areia aproximando-se sem encostar um calcanhar no outro.","Ao chegar no cone da direita, cravam a borda interna do p\u00e9 de fora na areia, simulam a plataforma de manchete por 1 segundo e voltam em passada lateral para a esquerda.","Realizam 6 idas e vindas cont\u00ednuas e depois trocam de linha (quem estava nos 3m vai para os 6m)."],"pontosAtencao":["O p\u00e9 que avan\u00e7a nunca deve cruzar \u00e0 frente ou atr\u00e1s do outro p\u00e9 nem tocar os tornozelos.","Manter os olhos na fita superior da rede durante todo o percurso, nunca olhando para os cones no ch\u00e3o.","Sentir a coxa trabalhando com o quadril sempre na mesma altura, sem quicar a cabe\u00e7a para cima."],"erroComum":"Juntar os dois p\u00e9s no meio da passada ficando com a base estreita; corrija exigindo que sempre exista pelo menos um palmo e meio de dist\u00e2ncia entre os p\u00e9s. Varia\u00e7\u00f5es","variacaoFacil":"Reduzir a dist\u00e2ncia entre os cones para 2 metros e diminuir a velocidade de execu\u00e7\u00e3o.","variacaoDificil":"Segurar uma bola com os bra\u00e7os estendidos \u00e0 frente na posi\u00e7\u00e3o de manchete durante todo o deslocamento lateral.","paraTurma":"Com 4 a 12 alunos, utilize tamb\u00e9m a meia-quadra direita para criar 4 corredores laterais simult\u00e2neos (trabalham 4 alunos por vez a cada 25 segundos enquanto os demais recuperam).","meta":"Fazer as 6 travessias de 3 metros em menos de 16 segundos sem cruzar os p\u00e9s e sem levantar o quadril.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, corredor lateral de 3m com 2 cones a 3m da rede (J1) e outro corredor de 3m com 2 cones a 6m da rede (J2). Setas tracejadas 1 (ida lateral) e 2 (volta lateral) mostram o movimento paralelo \u00e0 rede.","codigo":"DES-INI-015"},{"numero":16,"secao":2,"nome":"Virada de quadril e passo cruzado longo","nivel":"Iniciante","jogadores":"2 jogadores (revezando na largura total da quadra)","tempo":"8 minutos","material":"2 cones J1 J2 12 6m Largura (Passo Cruzado) Quadra 16x8m vista de cima. Na meia-quadra esquerda, a 5m da rede, 1 cone pr\u00f3ximo \u00e0 lateral superior e 1 cone pr\u00f3ximo \u00e0 lateral inferior (6m de dist\u00e2ncia). J1 sai do cone superior com passo cruzado (seta tracejada 1) at\u00e9 o cone inferior e retorna (seta tracejada 2). J2 aguarda no fundo. Objetivo: Aprender quando e como girar o quadril e cruzar a perna para cobrir grandes dist\u00e2ncias laterais na areia fofa.","objetivo":"Aprender quando e como girar o quadril e cruzar a perna para cobrir grandes dist\u00e2ncias laterais na areia fofa.","comoMontar":"Coloque 2 cones a 5 metros da rede na meia-quadra esquerda, afastados 6 metros um do outro (quase de uma linha lateral at\u00e9 a outra).","passoAPasso":["J1 come\u00e7a no cone da esquerda em base baixa olhando para a rede; J2 aguarda atr\u00e1s da linha de fundo pronto para entrar na vez seguinte.","Ao sinal, J1 gira rapidamente a ponta do p\u00e9 direito e o quadril para a direita, cruzando a perna esquerda de forma ampla pela frente do corpo (passo cruzado).","Corre de lado/frente com passadas longas e potentes pelos 6 metros da largura da quadra, mantendo apenas a cabe\u00e7a e o olhar virados para a rede.","Nos \u00faltimos 80 cent\u00edmetros antes do cone da direita, J1 volta o quadril de frente para a rede e planta os dois p\u00e9s paralelos na areia em base de defesa.","Na sequ\u00eancia imediata, faz o passo cruzado para o lado oposto retornando ao cone inicial e d\u00e1 lugar a J2."],"pontosAtencao":["Para dist\u00e2ncias acima de 2,5 metros na areia, o passo lateral \u00e9 lento demais: \u00e9 obrigat\u00f3rio girar o quadril e usar o passo cruzado seguido de corrida.","Desacoplar o tronco do quadril: as pernas correm para a lateral, mas os olhos continuam vigiando o outro lado da rede.","A parada final deve ser com os dois p\u00e9s equilibrados e o quadril voltado para o centro da rede."],"erroComum":"Chegar no cone ainda correndo de lado e tentar fazer a manchete com as pernas cruzadas; corrija exigindo que os dois \u00faltimos apoios squared (enquadrem) o quadril para a rede. Varia\u00e7\u00f5es","variacaoFacil":"Diminuir a dist\u00e2ncia entre os cones para 4,5 metros e fazer uma parada completa de 3 segundos em cada cone.","variacaoDificil":"J2 fica na rede com uma bola e s\u00f3 aponta o lado no \u00faltimo instante; J1 cruza a quadra e precisa tocar a bola parada na m\u00e3o de um terceiro colega ou num cone alto.","paraTurma":"Em turmas de 4 a 12 alunos, forme duas filas nas laterais da linha de 5 metros. Dois alunos saem por vez (um a 4m e outro a 6m da rede) atravessando os 6 metros de largura sem se chocar.","meta":"Cruzar os 6 metros de areia em no m\u00e1ximo 4 passadas amplas e terminar 100% equilibrado de frente para a rede em 8 de 10 tentativas.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, a 5m da rede, 1 cone pr\u00f3ximo \u00e0 lateral superior e 1 cone pr\u00f3ximo \u00e0 lateral inferior (6m de dist\u00e2ncia). J1 sai do cone superior com passo cruzado (seta tracejada 1) at\u00e9 o cone inferior e retorna (seta tracejada 2). J2 aguarda no fundo.","codigo":"DES-INI-016"},{"numero":17,"secao":2,"nome":"Arrancada para bola curta (pingo na frente)","nivel":"Iniciante","jogadores":"2 jogadores (1 defensor e 1 marcador de alvo)","tempo":"7 minutos","material":"3 cones e 1 bola J1 J2 1 2 3 Quadra 16x8m vista de cima. Na meia-quadra esquerda, 1 cone central a 6m da rede (J1) e 2 cones a 2m da rede nas diagonais. J2 junto ao cone frontal superior com bola. Seta tracejada 1 mostra a arrancada de 4m de J1 at\u00e9 o cone superior; seta tracejada 2 mostra o retorno ao centro; seta tracejada 3 mostra a ida ao cone","objetivo":"Desenvolver a explos\u00e3o frontal e a entrada baixa de afundo para salvar bolas largadas perto da rede.","comoMontar":"Coloque 1 cone central a 6 metros da rede (sa\u00edda de J1) e 2 cones pr\u00f3ximos da rede (a 2 metros da linha central, um na diagonal esquerda e outro na diagonal direita). J2 fica junto \u00e0 rede segurando 1 bola na altura do quadril.","passoAPasso":["J1 posiciona-se no cone de 6 metros em base de defesa; J2 fica perto de um dos cones de 2 metros segurando a bola a 30 cm da areia.","Ao sinal de J2 (quando ele estende o bra\u00e7o com a bola para baixo), J1 arranca em velocidade m\u00e1xima de frente por
