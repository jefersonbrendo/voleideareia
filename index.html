75 a 80 graus.","Bate na parte de baixo da bola com a base da m\u00e3o fechada (ou punho firme lateral) usando toda a extens\u00e3o das pernas para lan\u00e7ar a bola o mais alto poss\u00edvel no c\u00e9u.","A bola deve subir acima da linha dos postes de ilumina\u00e7\u00e3o/sol e descer quase na vertical dentro da Zona Alvo, onde J2 tenta acompanhar a queda protegendo os olhos do sol.","Realizam 8 saques e trocam de lado."],"pontosAtencao":["Para a bola subir 12 a 15 metros e ainda atravessar a quadra, voc\u00ea precisa empurrar o ch\u00e3o com as pernas de baixo para cima no momento do impacto.","Quando a bola desce de uma altura extrema na praia, o vento atua sobre ela na queda e ela chega pesada nos bra\u00e7os do passador.","Bata com a articula\u00e7\u00e3o r\u00edgida do punho/base do polegar para n\u00e3o machucar os dedos."],"erroComum":"Bater s\u00f3 para o alto sem transfer\u00eancia m\u00ednima para frente, fazendo a bola cair na pr\u00f3pria quadra ou na rede; corrija inclinando o ombro da frente levemente para o lado advers\u00e1rio na subida. Varia\u00e7\u00f5es","variacaoFacil":"Sacar a 6 metros da rede focando primeiro em atingir pelo menos o dobro da altura da antena.","variacaoDificil":"Colocar uma Zona Alvo nos \u00faltimos 2 metros da linha de fundo para que o saque alto caia quase verticalmente sobre a linha final.","paraTurma":"Em turmas de 4 a 12 alunos, todos os alunos de um lado batem o saque 'Jornada nas Estrelas' e os colegas do outro lado praticam o acompanhamento visual contra o sol pegando a bola acima da testa com as duas m\u00e3os sem deix\u00e1-la pingar.","meta":"Acertar 6 de 10 saques com arco alt\u00edssimo (m\u00ednimo 3 vezes a altura da rede) caindo dentro da Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima com \u00edcone de Sol e Vento no topo. J1 atr\u00e1s da linha de fundo esquerda (8m). Seta de bola 1 com grande arco curvo (indicando altura extrema de 12-15m passando pelo sol) cruza a rede e cai na Zona Alvo (5m a 7,5m) diante de J2.","codigo":"SAQ-INT-042"},{"numero":43,"secao":3,"nome":"Adapta\u00e7\u00e3o ao vento contra e vento a favor","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (1 sacando a favor do vento e 1 sacando contra o vento)","tempo":"10 minutos","material":"6 bolas, 4 cones e 2 zonas alvo \u25c4\u25c4\u25c4","objetivo":"Ajustar o \u00e2ngulo de sa\u00edda e a for\u00e7a da batida ao trocar de lado na quadra em dias de vento forte na praia.","comoMontar":"Identifique a dire\u00e7\u00e3o do vento na arena. J1 posiciona- se na linha de fundo que saca CONTRA o vento (lado esquerdo); J2 posiciona-se na linha de fundo que saca A FAVOR do vento (lado direito). Marque uma Zona Alvo no meio-fundo (4,5m a 7m) de cada lado.","passoAPasso":["J1 (sacando CONTRA o vento) executa um saque agressivo com 95% de for\u00e7a e trajet\u00f3ria mais baixa e tensa: o vento contra vai frear a bola e faz\u00ea-la cair dentro da quadra no final.","J2 agarra a bola na Zona Alvo direita e vai para a linha de fundo para sacar A FAVOR do vento.","J2 (sacando A FAVOR do vento) reduz a for\u00e7a para 60- 70% ou usa um saque curto/com rota\u00e7\u00e3o para baixo (topspin), pois o vento pelas costas empurra qualquer bola forte para fora.","Ambos fazem 6 saques consecutivos de cada lado e imediatamente trocam de quadra (simulando a troca de lado a cada 7 pontos do jogo).","Na troca de lado, o primeiro saque ap\u00f3s a mudan\u00e7a vale o dobro de pontos para treinar a adapta\u00e7\u00e3o imediata do c\u00e9rebro."],"pontosAtencao":["Regra cl\u00e1ssica da areia: CONTRA o vento voc\u00ea pode bater forte e fundo; A FAVOR do vento voc\u00ea deve sacar curto na rede ou usar topspin controlado.","Contra o vento, o saque flutuante oscila muito mais e cai de repente como uma pedra.","A favor do vento, lance a bola um pouco mais baixa porque o vento j\u00e1 empurra a bola para frente na al\u00e7ada."],"erroComum":"Trocar de lado da quadra e continuar batendo com a mesma for\u00e7a que usava contra o vento, mandando a bola 2 metros para fora; corrija obrigando o aluno a olhar as fitas das antenas antes de cada saque. Varia\u00e7\u00f5es","variacaoFacil":"Fazer 8 saques seguidos no mesmo lado antes de trocar de quadra para acostumar o bra\u00e7o.","variacaoDificil":"Obrigar os jogadores a trocarem de lado da quadra a cada 2 saques correndo por fora dos postes.","paraTurma":"Em turmas de 4 a 12 alunos, coloque metade da turma na linha de fundo esquerda (contra o vento) e metade na direita (a favor do vento). A cada 3 saques, o professor apita 'TROCA DE LADO!' e as duas turmas trocam de fundo em trote r\u00e1pido.","meta":"Manter 7 de 10 saques dentro da Zona Alvo somando os 5 saques contra o vento e os 5 saques a favor do vento.","descricaoDiagrama":"Quadra 16x8m vista de cima com setas de Vento soprando da direita para a esquerda. J1 na esquerda saca CONTRA o vento com trajet\u00f3ria tensa e forte (seta 1) at\u00e9 a Zona Alvo direita. J2 na direita saca A FAVOR do vento com toque controlado/curto (seta 2) at\u00e9 a Zona Alvo esquerda.","codigo":"SAQ-INT-043"},{"numero":44,"secao":3,"nome":"Saque com vento lateral (usando a deriva da brisa)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"5 bolas, 4 cones e 2 zonas alvo nas laterais VENTO LATERAL \u2b07\u2b07\u2b07ALVO SUPERIOR ALVO INFERIOR J1 J1 J2 1 2 Quadra 16x8m vista de cima com setas de Vento Lateral soprando de cima para baixo. J1 atr\u00e1s da linha de fundo esquerda. Seta de bola 1 sai apontada para o","objetivo":"Aprender a mirar no meio para o vento levar a bola at\u00e9 a linha lateral, ou mirar fora da antena para a bola fazer curva para dentro.","comoMontar":"J1 atr\u00e1s da linha de fundo esquerda (8m). Na meia- quadra direita, marque duas Zonas Alvo junto \u00e0s duas linhas laterais (Alvo Superior e Alvo Inferior). J2 fica no centro da quadra direita.","passoAPasso":["Observe para qual linha lateral o vento est\u00e1 soprando (ou imagine que o vento sopra de cima para baixo na quadra).","Nos primeiros 5 saques (a favor da corrente lateral), J1 mira no centro da quadra com um saque flutuante mais alto para que o vento empurre a bola nos \u00faltimos metros at\u00e9 cair na Zona Alvo lateral inferior.","Nos 5 saques seguintes (contra a corrente lateral), J1 posiciona-se no canto superior e mira na dire\u00e7\u00e3o da pr\u00f3pria linha lateral (ou quase na antena), deixando o vento empurrar a bola de volta para dentro da Zona Alvo superior.","J2 observa a curva da bola e d\u00e1 feedback imediato sobre o ponto de partida da mira.","Invertem os pap\u00e9is ap\u00f3s 10 saques."],"pontosAtencao":["O vento lateral \u00e9 o mais trai\u00e7oeiro para o passador porque a bola sai na dire\u00e7\u00e3o do peito dele e foge meio metro para o lado no \u00faltimo segundo.","Quanto mais tempo a bola ficar no ar (arco um pouco mais alto), mais o vento lateral vai carreg\u00e1-la.","Nunca mire colado na linha para onde o vento j\u00e1 est\u00e1 soprando, sen\u00e3o a bola sai pela lateral."],"erroComum":"Ignorar o vento lateral e mirar direto na linha onde o vento empurra para fora; corrija colocando um cone de 'mira visual' 1,5 metro antes da zona onde a bola deve cair. Varia\u00e7\u00f5es","variacaoFacil":"Usar apenas o saque do meio deixando o vento carregar para o lado favor\u00e1vel.","variacaoDificil":"Colocar J2 como receptor real que tenta passar de manchete a bola que faz curva com o vento lateral.","paraTurma":"Com 4 a 12 alunos, posicione cones visuais sobre a fita da rede indicando onde a bola deve cruzar a rede para cair na lateral l\u00e1 no fundo com a a\u00e7\u00e3o do vento do dia.","meta":"Acertar 6 de 10 saques nas zonas laterais calculando corretamente a deriva do vento.","descricaoDiagrama":"Quadra 16x8m vista de cima com setas de Vento Lateral soprando de cima para baixo. J1 atr\u00e1s da linha de fundo esquerda. Seta de bola 1 sai apontada para o centro e faz curva com o vento caindo na Zona Alvo inferior; seta de bola 2 sai pr\u00f3xima \u00e0 linha superior e curva para dentro na Zona Alvo superior.","codigo":"SAQ-INT-044"},{"numero":45,"secao":3,"nome":"Passada, lan\u00e7amento alto com giro e saque viagem na areia","nivel":"Avan\u00e7ado","jogadores":"2 jogadores","tempo":"10 minutos","material":"5 bolas, 2 cones e 1 zona alvo no fundo 1 2 Aproxima\u00e7\u00e3o de 2,5m + Salto Viagem com Topspin Quadra 16x8m vista de cima. J1 inicia a 10,5m da rede (2,5m atr\u00e1s da linha de fundo esquerda). Seta tracejada 1 mostra a corrida de aproxima\u00e7\u00e3o e salto antes da linha de 8m. Seta de bola 1 potente cruza a rede e mergulha na Zona Alvo de fundo (5m a 8m) na meia-quadra direita, onde est\u00e1 J2. Objetivo: Dominar o lan\u00e7amento com rota\u00e7\u00e3o","objetivo":"Dominar o lan\u00e7amento com rota\u00e7\u00e3o para frente (topspin), a chamada de 2 ou 3 passos na areia fofa e a mucada no ar do saque viagem.","comoMontar":"J1 come\u00e7a a 2,5 metros atr\u00e1s da linha de fundo esquerda (a 10,5 metros da rede), com 2 cones marcando seu corredor de aproxima\u00e7\u00e3o. Na meia- quadra direita, demarque uma Zona Alvo nos \u00faltimos 3 metros do fundo (5m a 8m da rede). J2 aguarda no fundo direito.","passoAPasso":["J1 segura a bola com a m\u00e3o dominante (ou ambas as m\u00e3os) a 2,5 metros da linha de fundo.","D\u00e1 o primeiro passo e lan\u00e7a a bola para o alto e para frente (para cair pr\u00f3ximo \u00e0 linha de fundo) rodando o punho para a bola j\u00e1 subir girando para frente (topspin).","Executa os dois \u00faltimos passos r\u00e1pidos e potentes na areia ('esquerda-direita' para destros) afundando os calcanhares antes da linha de fundo para saltar.","Salta para cima e para frente (sem pisar na linha antes de decolar) e golpeia a bola no ponto mais alto chicoteando o punho por cima da bola para gerar m\u00e1xima rota\u00e7\u00e3o.","A bola passa r\u00e1pida sobre a rede e mergulha no fundo da Zona Alvo pelo efeito Magnus (topspin); trocam a cada 8 viagens."],"pontosAtencao":["Na areia fofa voc\u00ea salta menos do que na quadra dura: por isso o lan\u00e7amento do viagem na praia n\u00e3o pode ser exageradamente alto nem muito longe para frente.","O giro de punho ('quebrada de munheca') por cima da bola \u00e9 obrigat\u00f3rio para fazer a bola mergulhar dentro dos 8 metros.","Plante os dois p\u00e9s quase juntos no \u00faltimo passo para n\u00e3o afundar um p\u00e9 s\u00f3 na areia antes do salto."],"erroComum":"Lan\u00e7ar a bola muito para dentro da quadra e ter que saltar para frente quase de peixinho, batendo na bola baixa na rede; corrija marcando na areia que o lan\u00e7amento deve subir a apenas 1 passo da linha de fundo. Varia\u00e7\u00f5es","variacaoFacil":"Fazer o 'meio-viagem' (apenas 1 passo curto e salto vertical com giro de punho) para ganhar tempo de bola na areia.","variacaoDificil":"Exigir saque viagem com pot\u00eancia acima de 80% mirando exclusivamente nos cantos de fundo.","paraTurma":"Em turmas de 4 a 12 alunos, divida 3 corredores de aproxima\u00e7\u00e3o atr\u00e1s da linha de fundo esquerda. Os alunos treinam em ondas de 3 sacadores por vez, focando na coordena\u00e7\u00e3o lan\u00e7amento-passada-quebrada de punho.","meta":"Colocar 6 de 10 saques viagem com rota\u00e7\u00e3o evidente (topspin) dentro da Zona Alvo de fundo sem pisar na linha.","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 inicia a 10,5m da rede (2,5m atr\u00e1s da linha de fundo esquerda). Seta tracejada 1 mostra a corrida de aproxima\u00e7\u00e3o e salto antes da linha de 8m. Seta de bola 1 potente cruza a rede e mergulha na Zona Alvo de fundo (5m a 8m) na meia-quadra direita, onde est\u00e1 J2.","codigo":"SAQ-AVA-045"},{"numero":46,"secao":3,"nome":"Saque viagem potenciado nas diagonais (curta e longa)","nivel":"Avan\u00e7ado","jogadores":"2 jogadores","tempo":"10 minutos","material":"5 bolas, 4 cones e 2 zonas alvo na diagonal DIAG LONGA (7,5m)DIAG CURTA (3,5m) J1 J2 1 2 Quadra 16x8m vista de cima. J1 no canto inferior da linha de fundo esquerda com seta tracejada 1 de aproxima\u00e7\u00e3o. Na meia-quadra direita superior, duas Zonas Alvo: Alvo 1 no canto de fundo (7,5m) e Alvo 2 na lateral curta (3,5m). Setas de bola 1 e 2 cruzam a quadra em diagonal at\u00e9 os dois alvos.","objetivo":"Usar o maior comprimento da diagonal da quadra para bater o saque viagem com m\u00e1xima pot\u00eancia ou cortar o \u00e2ngulo na diagonal curta.","comoMontar":"J1 posiciona-se no canto direito da linha de fundo esquerda. Na meia-quadra direita, monte duas Zonas Alvo na diagonal esquerda (superior): Alvo 1 na Diagonal Longa (canto de fundo a 7,5m) e Alvo 2 na Diagonal Curta (junto \u00e0 linha lateral a 3,5m da rede). J2 fica entre os dois alvos.","passoAPasso":["J1 faz a corrida de aproxima\u00e7\u00e3o j\u00e1 em \u00e2ngulo diagonal apontando para o canto oposto da quadra.","Nos primeiros 5 saques (Diagonal Longa), J1 bate cheio atr\u00e1s/em cima da bola aproveitando que a diagonal tem quase 18 metros de espa\u00e7o \u00fatil.","Nos 5 saques seguintes (Diagonal Curta), J1 usa o mesmo lan\u00e7amento e salto, mas gira o polegar para baixo na batida ('corte lateral' com topspin), fazendo a bola cruzar a rede e sair pela linha lateral aos 3,5 metros.","Depois, J1 muda para o canto esquerdo da linha de fundo e repete o trabalho para a outra diagonal.","J1 e J2 invertem os pap\u00e9is ap\u00f3s as s\u00e9ries."],"pontosAtencao":["A diagonal da quadra 16x8m \u00e9 quase 2 metros mais longa que a paralela: \u00e9 o caminho mais seguro para soltar o bra\u00e7o a 100% no saque viagem.","Para a diagonal curta, entre com a m\u00e3o na 'orelha externa' da bola e puxe o punho para baixo para ela cair r\u00e1pido perto da linha lateral.","N\u00e3o denuncie com o corpo antes do salto se a bola vai longa ou curta."],"erroComum":"Deixar a bola atr\u00e1s do ombro na hora do salto e tentar puxar para a diagonal, mandando a bola na antena; corrija mantendo a bola sempre \u00e0 frente do ombro de ataque. Varia\u00e7\u00f5es","variacaoFacil":"Treinar apenas a diagonal longa de fundo dos dois lados da linha de saque.","variacaoDificil":"Colocar 1 cone alto dentro de cada zona alvo e pontuar 3x quando acertar o cone.","paraTurma":"Em turmas de 4 a 12 alunos, forme uma fila no canto direito e outra no canto esquerdo da linha de fundo. Os alunos sacam alternadamente (um da direita cruzando e depois um da esquerda cruzando) nas duas diagonais.","meta":"Acertar 6 de 10 saques viagem somando as tentativas na diagonal longa e na diagonal curta.","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 no canto inferior da linha de fundo esquerda com seta tracejada 1 de aproxima\u00e7\u00e3o. Na meia-quadra direita superior, duas Zonas Alvo: Alvo 1 no canto de fundo (7,5m) e Alvo 2 na lateral curta (3,5m). Setas de bola 1 e 2 cruzam a quadra em diagonal at\u00e9 os dois alvos.","codigo":"SAQ-AVA-046"},{"numero":47,"secao":3,"nome":"Saque h\u00edbrido (finta de viagem para flutuante curto)","nivel":"Avan\u00e7ado","jogadores":"2 jogadores (1 sacador e 1 receptor lendo a finta)","tempo":"10 minutos","material":"5 bolas, 4 cones e 2 zonas alvo VIAGEM (7m)CURTO (2,5m)J1 J2 1 2 Mesmo Lan\u00e7amento: 1 (Viagem Forte) ou 2 (Largada H\u00edbrida) Quadra 16x8m vista de cima. J1 faz corrida de saque viagem (seta tracejada 1) na linha de fundo esquerda. Na meia-quadra direita, Zona Alvo 1 no fundo (7m) e Zona Alvo 2 curta (2,5m), com J2 a 6,5m. Do mesmo salto saem a seta de bola 1","objetivo":"Enganar o recebedor que recua esperando uma pancada de saque viagem, mudando a batida no ar para um flutuante curto.","comoMontar":"J1 atr\u00e1s da linha de fundo esquerda. Na meia-quadra direita, marque a Zona Alvo 1 no fundo (7m da rede) e a Zona Alvo 2 curta (2,5m da rede). J2 posiciona-se a 6,5 metros da rede preparado para defender saque viagem.","passoAPasso":["J1 realiza o ritual id\u00eantico ao saque viagem: recua 2,5 metros, lan\u00e7a a bola alta para frente e corre explosivo na areia saltando alto.","Ao ver o lan\u00e7amento alto e a corrida agressiva de J1, J2 naturalmente firma os calcanhares aos 6,5 metros esperando uma bomba no fundo.","No ar, J1 escolhe: ou solta o bra\u00e7o no viagem forte na Zona Alvo 1 (fundo), ou abre a m\u00e3o r\u00edgida desacelerando o bra\u00e7o e d\u00e1 um tapa flutuante curto que cai na Zona Alvo 2 (2,5m).","J2 tenta reagir e tocar na bola antes que ela caia na areia.","A cada 8 saques h\u00edbridos, trocam as fun\u00e7\u00f5es."],"pontosAtencao":["O lan\u00e7amento do saque h\u00edbrido precisa ser neutro (com pouco giro ou giro leve) para permitir tanto o tapa flutuante quanto a batida com topspin no ar.","Mantenha a velocidade de corrida e a eleva\u00e7\u00e3o do cotovelo id\u00eanticas at\u00e9 o \u00faltimo milissegundo no ar.","Mire o h\u00edbrido curto sempre na diagonal ou nos p\u00e9s do receptor que est\u00e1 longe da bola."],"erroComum":"Lan\u00e7ar a bola diferente ou pular baixinho quando vai fazer o curto, avisando o recebedor; corrija dando ponto para J2 toda vez que ele adivinhar o saque curto antes do contato na bola. Varia\u00e7\u00f5es","variacaoFacil":"Fazer o h\u00edbrido a partir do saque flutuante em suspens\u00e3o (1 passo e salto curto, variando entre fundo tenso e largada curta).","variacaoDificil":"J2 ganha ponto se conseguir passar a bola h\u00edbrida na zona de levantamento da rede; J1 ganha ponto se quebrar o passe ou fizer ace.","paraTurma":"Em turmas de 4 a 12 alunos, coloque uma dupla real recepcionando do outro lado (R1 e R2) enquanto os sacadores se revezam tentando enganar a dupla com o saque h\u00edbrido.","meta":"Conseguir 6 de 10 saques h\u00edbridos bem disfar\u00e7ados que caiam nas duas zonas alvo (3 longos e 3 curtos).","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 faz corrida de saque viagem (seta tracejada 1) na linha de fundo esquerda. Na meia-quadra direita, Zona Alvo 1 no fundo (7m) e Zona Alvo 2 curta (2,5m), com J2 a 6,5m. Do mesmo salto saem a seta de bola 1 (viagem forte no fundo) e a seta de bola 2 (finta curta aos 2,5m).","codigo":"SAQ-AVA-047"},{"numero":48,"secao":3,"nome":"Saque t\u00e1tico no 'ombro ruim' e no atacante escolhido","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (1 sacador e 2 receptores posicionados)","tempo":"10 minutos","material":"5 bolas, 4 cones e 2 zonas alvo espec\u00edficas OMBRO EXT OMBRO INT J1 R1 R2 1 2 R2 evitado pela t\u00e1tica","objetivo":"Treinar a precis\u00e3o cir\u00fargica de sacar sempre no jogador designado pela estrat\u00e9gia e especificamente no ombro externo ou interno dele.","comoMontar":"J1 saca da linha de fundo esquerda. Na meia-quadra direita, R1 (na esquerda) e R2 (na direita) ficam a 5,5 metros da rede. Coloque 2 cones ao lado de R1: um a 1 metro \u00e0 esquerda dele (ombro externo/linha) e outro a 1 metro \u00e0 direita dele (ombro interno/costura).","passoAPasso":["A t\u00e1tica da rodada determina que R1 \u00e9 o alvo obrigat\u00f3rio (por exemplo: o jogador mais cansado, o mais baixo na rede ou o menos regular no passe).","Nos 4 primeiros saques, J1 precisa sacar na altura do ombro esquerdo de R1 (for\u00e7ando-o a manchetar fora do corpo perto da linha lateral).","Nos 4 saques seguintes, J1 precisa sacar na altura do ombro direito de R1 (invadindo o meio da quadra para atrapalhar a chamada com R2).","R1 e R2 n\u00e3o podem trocar de lado antes do saque, mas R1 precisa realizar o passe de manchete ou toque alto para o centro da rede.","Rodam as posi\u00e7\u00f5es a cada 8 saques para que todos passem pelo saque t\u00e1tico."],"pontosAtencao":["No v\u00f4lei de praia, voc\u00ea quase nunca saca 'na quadra': voc\u00ea saca em um dos dois jogadores conforme o plano de jogo.","Sacar na altura do ombro (meia-altura r\u00e1pida) \u00e9 muito mais dif\u00edcil de passar na areia do que sacar na altura da cintura, pois for\u00e7a o advers\u00e1rio a decidir entre manchete alta ou toque de dedos.","Se voc\u00ea sacar no ombro externo de R1, ele \u00e9 obrigado a entrar para atacar vindo de fora da antena."],"erroComum":"Errar o lado e entregar a bola de gra\u00e7a para R2 (o jogador que a dupla combinou de N\u00c3O acionar); corrija penalizando em -1 ponto qualquer saque que v\u00e1 na metade de quadra de R2. Varia\u00e7\u00f5es","variacaoFacil":"Mirar apenas na metade de quadra de R1 sem exigir o ombro espec\u00edfico.","variacaoDificil":"Antes de J1 sacar, R1 d\u00e1 1 passo lateral para tentar esconder o ombro alvo e J1 precisa ajustar a mira no \u00faltimo segundo.","paraTurma":"Com 4 a 12 alunos, mantenha duas duplas fixas na recep\u00e7\u00e3o (revezando a cada 4 bolas) e uma fila de sacadores. O professor anuncia antes de cada saque: 'R1 ombro de fora!' ou 'R2 ombro de dentro!'.","meta":"Acertar 7 de 10 saques exatamente no receptor escolhido e no ombro determinado pela t\u00e1tica.","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 atr\u00e1s da linha de fundo esquerda. Na meia-quadra direita, R1 (superior) e R2 (inferior) a 5,5m da rede. Ao lado dos dois ombros de R1 h\u00e1 duas pequenas Zonas Alvo (Ombro Externo e Ombro Interno). Setas de bola 1 e 2 saem de J1 direto nos dois ombros de R1.","codigo":"SAQ-AVA-048"},{"numero":49,"secao":3,"nome":"Saque tirando o receptor do lugar + passe na rede (Saque + Recep\u00e7\u00e3o 1)","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (1 sacador, 1 receptor e 1 levantador na rede)","tempo":"11 minutos","material":"5 bolas, 3 cones e 1 zona alvo de levantamento LEVANTEJ1 R1 J2 1 1 2 Quadra 16x8m vista de cima. J1 na linha de fundo esquerda. Na meia-quadra","objetivo":"Combinar o saque que obriga o receptor a dar pelo menos 2 passos na areia com a resposta real de recep\u00e7\u00e3o para a zona de levantamento.","comoMontar":"J1 atr\u00e1s da linha de fundo esquerda. Na meia-quadra direita, R1 come\u00e7a no cone central da sua metade (a 5,5m da rede). A 2,5m para a frente e 2m para a lateral de R1, marque duas zonas onde J1 deve sacar. J2 (levantador) aguarda junto \u00e0 rede dentro da Zona Alvo de passe.","passoAPasso":["J1 saca da linha de fundo esquerda buscando obrigar R1 a se deslocar na areia (proibido sacar em cima do cone onde R1 est\u00e1 parado).","J1 escolhe sacar ou na curta diagonal (3m da rede) ou na lateral funda (7m perto da linha).","R1 l\u00ea a sa\u00edda da bola da m\u00e3o de J1, faz o destrave na areia, desloca-se r\u00e1pido para tr\u00e1s da bola, estanca os p\u00e9s e realiza a recep\u00e7\u00e3o de manchete para J2 na Zona Alvo da rede.","Contagem competitiva: se o saque de J1 fizer R1 dar 2 ou mais passos e o passe n\u00e3o chegar na Zona Alvo de J2, ponto do sacador (J1); se R1 deslocar e colocar a bola na m\u00e3o de J2, ponto do receptor (R1).","A cada 6 bolas, rodam entre sacador, receptor e levantador."],"pontosAtencao":["Para o sacador (J1): observe a posi\u00e7\u00e3o inicial de R1 antes de sacar e mire no espa\u00e7o vazio mais distante dele.","Para o receptor (R1): mesmo quando o saque vem curto ou longe, pare os dois p\u00e9s na areia no \u00faltimo milissegundo antes da manchete.","Um saque que faz o atacante correr 3 metros na areia fofa j\u00e1 reduz em 40% a impuls\u00e3o de ataque dele."],"erroComum":"O sacador bater forte demais no peito do receptor parado, facilitando o passe perfeito; corrija validando o ponto do sacador somente se o saque cair fora do raio de 1,5 metro do cone inicial de R1. Varia\u00e7\u00f5es","variacaoFacil":"J1 avisa antes se o saque ser\u00e1 curto ou fundo no corredor lateral.","variacaoDificil":"R1, ap\u00f3s passar a bola para J2, precisa continuar a corrida para atacar a bola levantada por J2 por cima da rede.","paraTurma":"Em turmas de 4 a 12 alunos, divida a quadra direita em duas faixas (duas duplas de receptor + levantador trabalhando alternadamente) enquanto uma fila de sacadores atua da linha de fundo esquerda.","meta":"Sacador: for\u00e7ar deslocamento e quebrar 5 de 10 passes; Receptor: colocar 6 de 10 bolas deslocadas na Zona Alvo de J2.","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 na linha de fundo esquerda. Na meia-quadra direita, R1 a 5,5m da rede e J2 na Zona Alvo junto \u00e0 rede. Seta de bola 1 (saque de J1) vai no espa\u00e7o curto/lateral longe de R1; R1 desloca-se (seta tracejada 1) e envia a recep\u00e7\u00e3o (seta de bola 2) para J2 na rede.","codigo":"SAQ-AVA-049"},{"numero":50,"secao":3,"nome":"Saque na costura contra dupla receptora real (Saque + Recep\u00e7\u00e3o 2)","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (1 sacador contra 2 receptores R1 e R2)","tempo":"11 minutos","material":"5 bolas, 2 cones e 1 zona alvo na rede LEVANTEJ1 R1 R2 1 1 2","objetivo":"Testar o saque flutuante ou viagem no corredor central contra dois recebedores reais, treinando quem chama a bola e quem infiltra para levantar.","comoMontar":"J1 na linha de fundo esquerda. Na meia-quadra direita, R1 (esquerda) e R2 (direita) posicionam-se a 5,5 metros da rede. Demarque uma Zona Alvo de levantamento no centro da rede (a 1,5m da fita).","passoAPasso":["J1 saca buscando exclusivamente a faixa central de 2 metros entre R1 e R2 (variando entre bola curta no meio, meia-altura nos ombros internos ou fundo na costura).","Assim que a bola sai da m\u00e3o de J1, R1 e R2 precisam definir em voz alta ('MINHA!' / 'VAI!') antes de a bola cruzar a linha da rede.","O jogador que chamou a bola fecha o passo para o meio e passa a bola alta para a Zona Alvo da rede.","O parceiro que N\u00c3O recepcionou arranca imediatamente para a Zona Alvo na rede, estanca os p\u00e9s e agarra a bola em posi\u00e7\u00e3o de levantamento.","Rodam as fun\u00e7\u00f5es a cada 6 saques (J1 entra na recep\u00e7\u00e3o, R1 vai para o saque)."],"pontosAtencao":["Para o sacador: mude o ponto de sa\u00edda na linha de fundo a cada saque (canto esquerdo, meio, canto direito) para mudar o \u00e2ngulo de entrada da bola na costura.","Para a dupla receptora: na d\u00favida na costura, a regra mais usada na praia \u00e9 'quem est\u00e1 com o ombro de dentro mais pr\u00f3ximo da rede ou quem tem o bra\u00e7o dominante no meio chama primeiro'.","Chamada tardia na areia resulta nos dois jogadores parando os p\u00e9s e olhando a bola cair."],"erroComum":"Os dois receptores darem o primeiro passo para a bola e pararem juntos com medo de bater cabe\u00e7a; corrija exigindo o grito 'MINHA!' antes da bola passar por cima da fita. Varia\u00e7\u00f5es","variacaoFacil":"J1 saca apenas flutuante do centro da linha de fundo em velocidade moderada.","variacaoDificil":"Ap\u00f3s o segundo jogador agarrar/levantar a bola na rede, o passador precisa completar a batida de ataque para o outro lado.","paraTurma":"Em turmas de 4 a 12 alunos, coloque duplas completas na recep\u00e7\u00e3o (R1 e R2). A dupla permanece na quadra por 4 saques; se sofrerem 2 aces ou erros de comunica\u00e7\u00e3o na costura, saem imediatamente dando lugar \u00e0 pr\u00f3xima dupla.","meta":"Sacador: causar indecis\u00e3o ou passe fora do alvo em 5 de 10 saques; Dupla: comunicar e acertar 7 de 10 passes na Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 saca da linha de fundo esquerda (seta de bola 1) exatamente no meio entre R1 e R2 (a 5,5m da rede no lado direito). R1 fecha para passar (seta tracejada 1) enviando a bola (seta 2) para a Zona Alvo na rede, enquanto R2 infiltra correndo (seta tracejada 2) at\u00e9 a Zona Alvo.","codigo":"SAQ-AVA-050"},{"numero":51,"secao":3,"nome":"Saque combinado com sinal do bloqueador e corrida de defesa (Saque + Recep\u00e7\u00e3o 3)","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (Dupla A: sacador + bloqueador x Dupla B: 2 receptores)","tempo":"12 minutos","material":"5 bolas e 4 cones J1 J2 R1 R2 1 1 2","objetivo":"Conectar o saque t\u00e1tico com o sinal do parceiro na rede e a entrada imediata do sacador na posi\u00e7\u00e3o de defesa na quadra.","comoMontar":"No lado esquerdo: J1 na linha de fundo para sacar e J2 junto \u00e0 rede pronto para bloquear (com as m\u00e3os atr\u00e1s das costas). No lado direito: R1 e R2 em posi\u00e7\u00e3o de recep\u00e7\u00e3o a 5,5 metros da rede. Coloque 2 cones de refer\u00eancia de defesa no lado esquerdo (a 5,5m da rede).","passoAPasso":["Antes do saque, J2 (na rede) faz o sinal nas costas com ambas as m\u00e3os: a m\u00e3o esquerda mostra o que ele vai bloquear para R1 e a m\u00e3o direita para R2, al\u00e9m de piscar os dedos indicando em qual receptor J1 deve sacar.","J1 confirma visualmente o sinal, saca taticamente no receptor combinado (por exemplo, for\u00e7ando R1 para a linha lateral).","No exato instante em que a bola sai de sua m\u00e3o no saque, J1 N\u00c3O fica parado na linha de fundo olhando a bola: ele arranca para dentro da quadra at\u00e9 o cone de defesa do corredor livre (deixado pelo bloqueio de J2).","Do outro lado, R1 passa a bola, R2 levanta e R1 ataca na dire\u00e7\u00e3o onde J2 bloqueia e J1 j\u00e1 est\u00e1 plantado defendendo.","Jogam o ponto at\u00e9 o fim; ap\u00f3s 5 saques, a Dupla B passa a sacar."],"pontosAtencao":["O maior erro de jogadores amadores ap\u00f3s sacar \u00e9 dar 2 passos pregui\u00e7osos e ainda estar andando quando o advers\u00e1rio ataca de segunda ou de terceira bola.","O saque precisa 'conversar' com o bloqueio: se J2 vai fechar a paralela, J1 saca perto da linha lateral para empurrar o atacante para cima do bloqueio de J2.","J1 deve fazer o destrave (split-step) no cone de defesa aos 5,5m exatamente quando o atacante advers\u00e1rio salta."],"erroComum":"Sacar no jogador errado (diferente do que o bloqueador pediu no sinal), deixando o parceiro na rede vendido; corrija dando ponto autom\u00e1tico para a dupla receptora se o saque for na metade errada da quadra. Varia\u00e7\u00f5es","variacaoFacil":"Finalizar a jogada logo ap\u00f3s o levantamento de R2, avaliando se J1 j\u00e1 chegou equilibrado no cone de defesa correto.","variacaoDificil":"Permitir que a dupla receptora passe a bola de segunda (ataque de segunda bola), obrigando J1 a entrar na quadra em sprint m\u00e1ximo ap\u00f3s o saque.","paraTurma":"Com 4 a 12 alunos, jogue em duplas reais (2x2). Enquanto duas duplas est\u00e3o em quadra fazendo 4 pontos de saque-bloqueio- defesa contra recep\u00e7\u00e3o-ataque, as outras duplas aguardam no fundo e entram no sistema 'venceu-ficou'.","meta":"Acertar 8 de 10 saques no receptor combinado no sinal e estar 100% plantado no cone de defesa antes do ataque advers\u00e1rio.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na esquerda, J1 atr\u00e1s da linha de fundo e J2 na rede mostrando sinal. J1 saca em R1 no lado direito (seta de bola 1) e corre imediatamente para o cone de defesa na diagonal (seta tracejada 1). R1 passa para R2 na rede (seta de bola 2) e corre para atacar contra o bloqueio de J2.","codigo":"SAQ-AVA-051"},{"numero":52,"secao":3,"nome":"Desafio sob press\u00e3o: 'Fechando o Set' com frequ\u00eancia card\u00edaca alta","nivel":"Avan\u00e7ado","jogadores":"2 a 4 jogadores","tempo":"12 minutos","material":"6 bolas, 6 cones e 4 zonas alvo nos cantos ALVO 1 ALVO 2 ALVO 3 ALVO 4 J1 1 2","objetivo":"Manter a rotina respirat\u00f3ria e a precis\u00e3o t\u00e9cnica do saque quando as pernas est\u00e3o pesadas pela areia e o ponto decide o jogo.","comoMontar":"Marque 4 Zonas Alvo de alto valor na meia-quadra direita: Curta Esquerda (Alvo 1), Curta Direita (Alvo 2), Fundo Esquerdo (Alvo 3) e Fundo Direito (Alvo 4). Na meia-quadra esquerda, coloque 1 cone a 4 metros da rede para o sprint pr\u00e9-saque.","passoAPasso":["Simula\u00e7\u00e3o de fim de jogo (placar em 19x19): antes de cada saque, J1 precisa correr da linha de fundo at\u00e9 o cone de 4 metros da rede, tocar a m\u00e3o na areia e voltar de costas at\u00e9 a linha de fundo (elevando o batimento card\u00edaco).","Ao chegar na linha de fundo, J1 tem exatamente 5 segundos (tempo oficial da regra do v\u00f4lei de praia ap\u00f3s o apito) para controlar a respira\u00e7\u00e3o, olhar o alvo e sacar.","J2 (ou o parceiro) grita qual dos 4 alvos J1 precisa acertar para 'fechar o jogo' (ex.: 'FUNDO DIREITO!').","Se J1 acertar a Zona Alvo chamada: +2 pontos; se cair na quadra mas fora do alvo: +1 ponto; se errar o saque na rede ou fora: -2 pontos.","Vence o desafio quem atingir 10 pontos primeiro ap\u00f3s os sprints na areia."],"pontosAtencao":["Na praia, voc\u00ea quase sempre vai sacar ofegante depois de um rally longo no sol: crie um ritual fixo de soltar o ar lentamente pela boca antes de lan\u00e7ar a bola.","Quando as pernas est\u00e3o cansadas da corrida na areia, a tend\u00eancia \u00e9 n\u00e3o usar as pernas no saque e bater s\u00f3 com o bra\u00e7o (mandando na rede): force a transfer\u00eancia de peso do p\u00e9 de tr\u00e1s para o da frente.","Nunca apresse a al\u00e7ada da bola: use os seus 5 segundos para limpar a areia da m\u00e3o e focar na mira."],"erroComum":"Pegar a bola ainda correndo e j\u00e1 jogar para cima sem estabilizar a respira\u00e7\u00e3o e a base na areia; corrija exigindo uma parada est\u00e1tica de 2 segundos com uma expira\u00e7\u00e3o profunda antes do lan\u00e7amento. Varia\u00e7\u00f5es","variacaoFacil":"Fazer apenas um deslocamento lateral de 3 metros na linha de fundo antes de cada saque e valer qualquer uma das 4 zonas.","variacaoDificil":"Para fechar o desafio no \u00faltimo ponto (Match Point), o jogador \u00e9 obrigado a acertar dois saques seguidos (1 curto e 1 no fundo) ap\u00f3s o sprint.","paraTurma":"Em turmas de 4 a 12 alunos, divida a turma em duas equipes (Equipe Azul x Equipe Amarela). Os alunos saem um por vez fazendo o sprint at\u00e9 os 4m, voltam e sacam nos alvos somando pontos no placar coletivo da equipe.","meta":"Alcan\u00e7ar os 10 pontos do desafio acertando pelo menos 7 de 10 saques em quadra (e 5 nas zonas chamadas) mesmo sob fadiga.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 faz sprint de ida e volta at\u00e9 o cone de 4m (setas tracejadas 1 e 2) e posiciona-se na linha de fundo (8m). Na meia-quadra direita, 4 Zonas Alvo demarcadas nos 4 cantos (2 curtas e 2 no fundo). Setas de bola 1, 2, 3 e 4 apontam para os 4 alvos decisivos.","codigo":"SAQ-AVA-052"},{"numero":53,"secao":4,"nome":"Travamento de plataforma e base de manchete na areia","nivel":"Iniciante","jogadores":"2 jogadores (1 lan\u00e7ador e 1 receptor frente a frente)","tempo":"7 minutos","material":"2 bolas e 2 cones J1 J2 1 2 Dist\u00e2ncia de 4m: Prancha firme e extens\u00e3o de joelhos Quadra 16x8m vista de cima. Na meia-quadra esquerda, J2 posicionado no cone junto \u00e0 rede (1m) e J1 no cone a 5m da rede. Seta de bola 1 sai de J2 para a cintura de J1; seta de bola 2 retorna alta e controlada da plataforma de J1 direto para as m\u00e3os de J2. Objetivo: Construir a prancha plana dos","objetivo":"Construir a prancha plana dos antebra\u00e7os com ombros projetados \u00e0 frente e base firme na areia fofa.","comoMontar":"Na meia-quadra esquerda, posicione 1 cone a 5 metros da rede (J1 - receptor) e 1 cone junto \u00e0 rede no centro (J2 - lan\u00e7ador), separados por 4 metros de dist\u00e2ncia.","passoAPasso":["J1 posiciona-se no cone de 5m com os p\u00e9s ligeiramente mais largos que os ombros, um p\u00e9 meio passo \u00e0 frente do outro na areia e joelhos flexionados.","Antes do lan\u00e7amento, J1 mant\u00e9m as m\u00e3os soltas \u00e0 frente da cintura (n\u00e3o junta as m\u00e3os antes da hora).","J2 lan\u00e7a a bola com as duas m\u00e3os em arco suave diretamente na linha do umbigo de J1.","J1 une as m\u00e3os (polegares paralelos apontando para a areia), gira os cotovelos para dentro expondo a parte carnuda e plana dos antebra\u00e7os e eleva os ombros at\u00e9 quase encostar no queixo.","Usando apenas a extens\u00e3o suave dos joelhos na areia (sem chicotear os bra\u00e7os), J1 devolve a bola alta nas m\u00e3os de J2; trocam a cada 10 bolas."],"pontosAtencao":["Apontar a ponta dos polegares para baixo em dire\u00e7\u00e3o \u00e0 areia: isso trava automaticamente os cotovelos e deixa a plataforma reta.","Manter um espa\u00e7o constante de um palmo entre os cotovelos e o tronco (n\u00e3o colar os bra\u00e7os na barriga).","Empurrar a areia com as pernas de baixo para cima sem balan\u00e7ar os bra\u00e7os acima da linha dos ombros."],"erroComum":"Dobrar os cotovelos no momento do contato jogando a bola para tr\u00e1s da pr\u00f3pria cabe\u00e7a; corrija pedindo para congelar a prancha dos bra\u00e7os por 2 segundos ap\u00f3s a bola sair. Varia\u00e7\u00f5es","variacaoFacil":"Diminuir a dist\u00e2ncia para 3 metros e permitir que a bola d\u00ea um quique em uma t\u00e1bua ou na areia batida antes do contato.","variacaoDificil":"J2 lan\u00e7a a bola meio metro \u00e0 esquerda ou \u00e0 direita do corpo de J1, exigindo 1 passo de ajuste mantendo a bola sempre no meio do umbigo.","paraTurma":"Em turmas de 4 a 12 alunos, forme duplas frente a frente a 4 metros de dist\u00e2ncia ocupando as duas meias-quadras. A cada 10 passes limpos na m\u00e3o do colega, os dois trocam de fun\u00e7\u00e3o.","meta":"Devolver 9 de 10 bolas lan\u00e7adas diretamente nas m\u00e3os do parceiro na altura da testa sem dobrar os cotovelos.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J2 posicionado no cone junto \u00e0 rede (1m) e J1 no cone a 5m da rede. Seta de bola 1 sai de J2 para a cintura de J1; seta de bola 2 retorna alta e controlada da plataforma de J1 direto para as m\u00e3os de J2.","codigo":"REC-INI-053"},{"numero":54,"secao":4,"nome":"Amortecimento e controle de arco alto no centro","nivel":"Iniciante","jogadores":"2 jogadores (1 lan\u00e7ador do outro lado da rede e 1 receptor)","tempo":"8 minutos","material":"3 bolas, 2 cones e 1 zona alvo ALVO 1,5mJ1 J21 2 Amortecimento aos 5,5m + Arco Alto na Zona Central Quadra 16x8m vista de cima. J2 na meia-quadra direita (a 3m da rede) envia a bola 1 por cima da rede at\u00e9 J1 no cone a 5,5m da rede na meia-quadra esquerda. J1 amortece e envia a manchete alta (seta de bola 2) para a Zona Alvo (2x2m) a 1,5m da rede.","objetivo":"Aprender a controlar a velocidade da bola que cruza a rede, transformando um lan\u00e7amento tenso em uma bola alta com tempo para o parceiro chegar.","comoMontar":"J2 fica do outro lado da rede (a 3 metros da fita, na meia-quadra direita) com as bolas. J1 fica no cone a 5,5 metros da rede na meia-quadra esquerda. Demarque uma Zona Alvo de 2x2 metros no centro da quadra esquerda, a 1,5 metro da rede.","passoAPasso":["J2 lan\u00e7a a bola com uma m\u00e3o (como um arremesso firme por cima da rede) diretamente no peito/cintura de J1 aos 5,5 metros.","J1 faz o destrave na areia, firma os dois p\u00e9s e apresenta a plataforma de manchete com \u00e2ngulo de cerca de 45 graus para o alto.","Como a bola j\u00e1 vem com velocidade, J1 N\u00c3O empurra a bola para frente: ele apenas sustenta os ombros firmes ou cede levemente 2 cent\u00edmetros absorvendo o impacto.","A bola deve subir no m\u00ednimo 1,5 metro acima da antena e cair macia dentro da Zona Alvo central (a 1,5m da rede).","Ap\u00f3s 8 bolas, J1 e J2 invertem as fun\u00e7\u00f5es."],"pontosAtencao":["Na praia, passe baixo e r\u00e1pido (passe 'tenso' de quadra) \u00e9 ruim porque o seu parceiro vem correndo da areia fofa: o passe precisa ter arco alto (entre 3,5m e 4,5m de altura).","Para dar altura sem mandar a bola para o outro lado da rede, pare o movimento dos bra\u00e7os abaixo da linha do peito.","Acompanhe a bola com os olhos at\u00e9 ela tocar exatamente o ter\u00e7o m\u00e9dio do antebra\u00e7o."],"erroComum":"Balan\u00e7ar os bra\u00e7os contra uma bola que j\u00e1 vem forte, devolvendo a bola de primeira para a quadra advers\u00e1ria ('bola de gra\u00e7a'); corrija pedindo para deixar a bola bater nos bra\u00e7os parados. Varia\u00e7\u00f5es","variacaoFacil":"J2 lan\u00e7a a bola com as duas m\u00e3os por cima da cabe\u00e7a em trajet\u00f3ria mais lenta.","variacaoDificil":"J2 alterna entre uma bola lan\u00e7ada forte e tensa (exigindo amortecimento) e uma bola lan\u00e7ada fraca (exigindo empurr\u00e3o de pernas).","paraTurma":"Com 4 a 12 alunos, posicione 2 lan\u00e7adores na meia-quadra direita, 1 aluno coletor dentro da Zona Alvo na rede esquerda (segurando os bra\u00e7os para o alto como medida de altura) e o restante em fila no cone de 5,5m.","meta":"Colocar 8 de 10 bolas dentro da Zona Alvo central com arco alto (acima do topo da antena).","descricaoDiagrama":"Quadra 16x8m vista de cima. J2 na meia-quadra direita (a 3m da rede) envia a bola 1 por cima da rede at\u00e9 J1 no cone a 5,5m da rede na meia-quadra esquerda. J1 amortece e envia a manchete alta (seta de bola 2) para a Zona Alvo (2x2m) a 1,5m da rede.","codigo":"REC-INI-054"},{"numero":55,"secao":4,"nome":"Inclina\u00e7\u00e3o de ombros: direcionando dos cantos para o centro","nivel":"Iniciante","jogadores":"2 jogadores","tempo":"8 minutos","material":"4 bolas, 3 cones e 1 zona alvo ALVO 1,5m J1 J1 J2 1 2 2","objetivo":"Aprender a inclinar o ombro de fora para direcionar a bola em diagonal das laterais da quadra para a zona central de levantamento.","comoMontar":"Na meia-quadra esquerda, coloque 2 cones de recep\u00e7\u00e3o a 5,5 metros da rede: Cone 1 perto da linha lateral esquerda (entrada) e Cone 2 perto da linha lateral direita (sa\u00edda). Demarque a Zona Alvo no centro da quadra a 1,5 metro da rede. J2 lan\u00e7a do outro lado da rede.","passoAPasso":["J1 come\u00e7a no Cone 1 (corredor esquerdo, a 5,5m da rede).","J2 lan\u00e7a a bola por cima da rede em cima do Cone 1.","Como a Zona Alvo est\u00e1 \u00e0 direita de J1 (no centro da rede), J1 mant\u00e9m os p\u00e9s apontados para o centro ou levanta levemente o ombro esquerdo (ombro de fora), criando um 'espelho' inclinado para a direita.","Ap\u00f3s acertar 5 bolas no alvo a partir do Cone 1, J1 vai para o Cone 2 (corredor direito) e faz o oposto: levanta levemente o ombro direito para redirecionar a bola para o centro.","Trocam de fun\u00e7\u00e3o ap\u00f3s 10 recep\u00e7\u00f5es completas."],"pontosAtencao":["Pense na sua manchete como um espelho: a bola bate e reflete para onde os dois antebra\u00e7os est\u00e3o inclinados.","Sempre levante o ombro de fora (o ombro mais pr\u00f3ximo da linha lateral) para trazer a bola para dentro da quadra.","Nunca gire os bra\u00e7os chicoteando para o lado: monte a inclina\u00e7\u00e3o dos ombros ANTES de a bola tocar no antebra\u00e7o."],"erroComum":"Manter a manchete reta de frente para a linha lateral, mandando o passe para cima da antena; corrija pedindo para apontar o esterno (meio do peito) diretamente para a Zona Alvo central. Varia\u00e7\u00f5es","variacaoFacil":"Virar os dois p\u00e9s completamente na diagonal apontando para a Zona Alvo antes de a bola chegar.","variacaoDificil":"J1 come\u00e7a no meio entre os dois cones e J2 escolhe em qual dos dois cantos vai lan\u00e7ar a bola.","paraTurma":"Em turmas de 4 a 12 alunos, forme duas filas (uma no Cone 1 da esquerda e outra no Cone 2 da direita). Dois lan\u00e7adores atuam do outro lado da rede alternadamente; quem passa no Cone 1 vai para o fim da fila do Cone 2.","meta":"Direcionar 7 de 10 bolas dos corredores laterais para dentro da Zona Alvo central a 1,5m da rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. J2 no lado direito envia bolas (setas 1) para os Cones 1 (superior) e 2 (inferior) a 5,5m da rede na esquerda. J1 nos cones laterais inclina o ombro externo e direciona o passe em diagonal (setas de bola 2) para a Zona Alvo central a 1,5m da rede.","codigo":"REC-INI-055"},{"numero":56,"secao":4,"nome":"Recep\u00e7\u00e3o de saque por baixo oficial na zona de levantamento","nivel":"Iniciante","jogadores":"2 jogadores (1 sacador na linha de 8m e 1 receptor)","tempo":"9 minutos","material":"5 bolas, 2 cones e 1 zona alvo ALVO 1,5mJ1 J2 1 2 Saque por baixo da linha de 8m Quadra 16x8m vista de cima. J2 atr\u00e1s da linha de fundo direita (8m) saca por baixo","objetivo":"Fazer a leitura de trajet\u00f3ria e tempo de bola de um saque real vindo da linha de fundo (8m) at\u00e9 a zona de levantamento.","comoMontar":"J2 (sacador) fica atr\u00e1s da linha de fundo direita (a 8 metros da rede). Na meia-quadra esquerda, J1 fica no cone de base a 5,5 metros da rede. Demarque a Zona Alvo central de 2x2 metros a 1,5 metro da rede.","passoAPasso":["J2 executa um saque por baixo oficial da linha de fundo direita buscando a metade de quadra onde est\u00e1 J1.","No instante em que a m\u00e3o de J2 bate na bola l\u00e1 no fundo, J1 executa o destrave (split-step) na areia.","J1 l\u00ea a velocidade e a profundidade da bola nos primeiros 2 metros de voo, ajusta os p\u00e9s com passadas curtas para ficar exatamente atr\u00e1s da bola e para os dois p\u00e9s.","Executa a manchete alta colocando a bola dentro da Zona Alvo central a 1,5 metro da rede (sem encostar na fita).","Ap\u00f3s 8 saques, invertem sacador e receptor."],"pontosAtencao":["Nunca passe a bola colada na fita da rede na praia: o vento pode jogar a bola para o outro lado e seu parceiro fica sem espa\u00e7o para levantar.","O ponto perfeito \u00e9 a 1,5m da rede.","Comece a se mexer quando a bola sai da m\u00e3o do sacador, n\u00e3o quando ela j\u00e1 passou da rede.","Toque na bola sempre \u00e0 frente da linha dos seus quadris."],"erroComum":"Esperar a bola chegar parado no lugar e tentar alcan\u00e7ar esticando os bra\u00e7os para o lado sem mexer os p\u00e9s; corrija exigindo que a bola sempre seja recebida entre os dois joelhos. Varia\u00e7\u00f5es","variacaoFacil":"J2 saca por baixo a partir de 6 metros da rede para reduzir o tempo de voo e aumentar a precis\u00e3o do envio.","variacaoDificil":"Reduzir a Zona Alvo na rede para um quadrado de 1,5 x 1,5 metro.","paraTurma":"Com 4 a 12 alunos, coloque 2 sacadores na linha de fundo direita, 1 levantador fixo na Zona Alvo agarrando as bolas acima da cabe\u00e7a e os demais em duas filas de recep\u00e7\u00e3o na quadra esquerda. Rod\u00edzio a cada 4 recep\u00e7\u00f5es.","meta":"Acertar 8 de 10 recep\u00e7\u00f5es de saque por baixo dentro da Zona Alvo a 1,5m da rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. J2 atr\u00e1s da linha de fundo direita (8m) saca por baixo (seta de bola 1) para a meia-quadra esquerda. J1 no cone a 5,5m da rede ajusta a base e envia a recep\u00e7\u00e3o (seta de bola 2) para a Zona Alvo (2x2m) a 1,5m da rede no centro.","codigo":"REC-INI-056"},{"numero":57,"secao":4,"nome":"Recep\u00e7\u00e3o com deslocamento lateral e parada de dois p\u00e9s","nivel":"Iniciante","jogadores":"2 jogadores","tempo":"9 minutos","material":"5 bolas, 3 cones e 1 zona alvo ALVO 1,5mJ1 J2 1 1 2 Quadra 16x8m vista de cima. J2 saca da direita (setas de bola 1) para os cones laterais na esquerda (a 5,5m da rede). J1 sai do cone central e desloca-se 2,5m para a lateral (setas tracejadas 1), estanca os p\u00e9s e passa a bola (setas de bola 2) para a Zona Alvo central a 1,5m da rede. Objetivo: Coordenar 2 a 3 metros de","objetivo":"Coordenar 2 a 3 metros de deslocamento lateral na areia com a frenagem completa dos p\u00e9s antes do contato da manchete.","comoMontar":"Na meia-quadra esquerda, coloque 1 cone central a 5,5m da rede (sa\u00edda de J1) e 2 cones laterais a 2,5 metros para cada lado (tamb\u00e9m a 5,5m da rede). Zona Alvo a 1,5m da rede no centro. J2 saca da linha de fundo direita.","passoAPasso":["J1 come\u00e7a no cone central (a 5,5m da rede) em postura de prontid\u00e3o.","J2 saca por baixo ou por cima controlado mirando em um dos dois cones laterais (2,5 metros \u00e0 esquerda ou \u00e0 direita de J1).","J1 identifica o lado, usa passada lateral r\u00e1pida ou passo cruzado curto para chegar ao cone lateral ANTES da bola.","Crava os dois p\u00e9s na areia ('direita-esquerda' parando o corpo), levanta o ombro de fora e passa a bola alta para a Zona Alvo central.","Volta trotando ao cone central para o saque seguinte; trocam a cada 8 bolas."],"pontosAtencao":["Deslocar e passar s\u00e3o duas fases separadas: primeiro voc\u00ea corre na areia, depois voc\u00ea planta os p\u00e9s e s\u00f3 ent\u00e3o a bola toca no seu bra\u00e7o.","Se voc\u00ea ainda estiver deslizando para o lado no momento do contato, a bola vai fugir na dire\u00e7\u00e3o da sua corrida.","Use o p\u00e9 de fora (mais pr\u00f3ximo da linha lateral) como freio na areia e piv\u00f4 para apontar os ombros para o alvo."],"erroComum":"Cruzar a perna na \u00faltima passada e bater na bola com os p\u00e9s cruzados e desequilibrados; corrija pedindo para ouvir o barulho dos dois p\u00e9s cravando paralelos na areia antes do toque na bola. Varia\u00e7\u00f5es","variacaoFacil":"J2 avisa antes do saque para qual dos dois cones laterais vai enviar a bola.","variacaoDificil":"Aumentar a dist\u00e2ncia dos cones laterais para 3,5 metros do centro (quase sobre as linhas laterais).","paraTurma":"Em turmas de 4 a 12 alunos, 2 sacadores alternam os saques do lado direito, 1 aluno fica como alvo/levantador na rede e a fila de receptores sai do cone central (faz 2 bolas \u2014 uma para cada lado \u2014 e vai para o fim da fila).","meta":"Recepcionar 7 de 10 bolas deslocadas com os p\u00e9s parados no momento do impacto e caindo na Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. J2 saca da direita (setas de bola 1) para os cones laterais na esquerda (a 5,5m da rede). J1 sai do cone central e desloca-se 2,5m para a lateral (setas tracejadas 1), estanca os p\u00e9s e passa a bola (setas de bola 2) para a Zona Alvo central a 1,5m da rede.","codigo":"REC-INI-057"},{"numero":58,"secao":4,"nome":"Avan\u00e7o explosivo para recep\u00e7\u00e3o de saque curto","nivel":"Iniciante","jogadores":"2 jogadores","tempo":"9 minutos","material":"5 bolas, 2 cones e 1 zona alvo ALVO 1,5m J1 J2 1 1 2 Quadra 16x8m vista de cima. J2 no lado direito envia saque curto (seta de bola 1) caindo no cone a 2,5m da rede no lado esquerdo. J1 arranca do cone de 6m at\u00e9 os 2,5m (seta tracejada 1), freia em afundo e levanta a bola (seta de bola 2) para a","objetivo":"Arrancar para frente na areia fofa, frear em afundo baixo e levantar a bola curta no centro sem devolv\u00ea-la de gra\u00e7a.","comoMontar":"Na meia-quadra esquerda, coloque 1 cone de base a 6 metros da rede (J1) e 1 cone de refer\u00eancia curta a 2,5 metros da rede. Demarque a Zona Alvo central a 1,5m da rede. J2 fica na linha de fundo direita (ou a 6m no lado direito) para executar saques curtos.","passoAPasso":["J1 aguarda na base normal de recep\u00e7\u00e3o a 6 metros da rede.","J2 executa um saque curto ('pingado') que cruza a fita e cai por volta dos 2,5 a 3 metros da rede.","J1 faz o destrave, empurra a areia com o p\u00e9 de tr\u00e1s e corre de frente com o quadril baixo.","No \u00faltimo passo (aos 2,5m), J1 entra em afundo longo afundando a perna da frente na areia para frear a corrida horizontal.","Apresenta a plataforma quase paralela \u00e0 areia (apontando para o c\u00e9u) para a bola subir verticalmente e cair na Zona Alvo ao lado; trocam a cada 8 bolas."],"pontosAtencao":["Quando voc\u00ea corre r\u00e1pido para frente, a sua velocidade j\u00e1 empurra a bola para a rede: por isso, na bola curta, aponte a manchete quase para tr\u00e1s/para o alto.","Se a bola estiver muito baixa perto da areia, n\u00e3o tenha vergonha de apoiar o joelho de tr\u00e1s no ch\u00e3o para estabilizar a plataforma.","Depois de passar a bola curta, levante r\u00e1pido da areia porque voc\u00ea j\u00e1 est\u00e1 perto da rede para atacar."],"erroComum":"Tocar na bola ainda correndo para frente com a manchete inclinada, jogando a bola direto na rede ou no bra\u00e7o do bloqueador advers\u00e1rio; corrija exigindo que os polegares apontem para a areia abrindo o \u00e2ngulo da plataforma. Varia\u00e7\u00f5es","variacaoFacil":"J1 come\u00e7a um pouco mais adiantado (a 4,5 metros da rede) para encurtar a corrida at\u00e9 a bola curta.","variacaoDificil":"J2 pode variar livremente entre o saque curto aos 2,5m e o saque normal no peito aos 6m, proibindo J1 de adivinhar e sair antes.","paraTurma":"Em turmas de 4 a 12 alunos, divida a quadra esquerda em dois corredores (esquerdo e direito). Dois sacadores mandam bolas curtas do outro lado e duas filas de receptores avan\u00e7am simultaneamente dos 6m at\u00e9 os 2,5m.","meta":"Colocar 7 de 10 saques curtos para o alto dentro da Zona Alvo sem que nenhuma bola passe direto para o outro lado.","descricaoDiagrama":"Quadra 16x8m vista de cima. J2 no lado direito envia saque curto (seta de bola 1) caindo no cone a 2,5m da rede no lado esquerdo. J1 arranca do cone de 6m at\u00e9 os 2,5m (seta tracejada 1), freia em afundo e levanta a bola (seta de bola 2) para a Zona Alvo a 1,5m da rede.","codigo":"REC-INI-058"},{"numero":59,"secao":4,"nome":"Recuo para bola funda e leitura de linha ('dentro ou fora')","nivel":"Iniciante","jogadores":"2 jogadores","tempo":"9 minutos","material":"5 bolas, 3 cones e 1 zona alvo ALVO 1,5mJ1 J2 1 1 2 Recuo at\u00e9 7,5m: Decis\u00e3o \"DENTRO!\" ou \"FORA!\" Quadra 16x8m vista de cima. J2 na linha de fundo direita saca fundo (seta de bola 1) at\u00e9 os 7,5m da meia-quadra esquerda. J1 recua do cone de 4,5m at\u00e9 perto da linha de fundo de 8m (seta tracejada 1), firma o p\u00e9 de tr\u00e1s e envia a manchete longa (seta de bola 2) at\u00e9 a Zona Alvo a 1,5m da rede.","objetivo":"Recuar em passo lateral/cruzado sem correr de costas, passando as bolas que v\u00e3o dentro e deixando sair as bolas longas demais.","comoMontar":"Na meia-quadra esquerda, coloque 1 cone de base a 4,5 metros da rede (posi\u00e7\u00e3o adiantada de J1) e 2 cones sobre a linha de fundo (8m). Demarque a Zona Alvo a 1,5m da rede. J2 saca da linha de fundo direita.","passoAPasso":["J1 come\u00e7a a 4,5 metros da rede (simulando quem estava cobrindo o saque curto).","J2 bate um saque longo em dire\u00e7\u00e3o aos \u00faltimos 2 metros do fundo da quadra esquerda (algumas bolas caindo aos 7,5m dentro e outras passando 50 cm fora da linha de 8m).","J1 gira o quadril imediatamente (ficando de lado para a rede) e recua r\u00e1pido em passo cruzado/lateral at\u00e9 a linha de fundo.","D\u00e9cimos de segundo antes do contato, J1 toma a decis\u00e3o e grita: se a bola vai cair dentro, grita 'DENTRO!', planta o p\u00e9 de tr\u00e1s e faz uma manchete alta para a Zona Alvo; se a bola veio na altura do ombro/cabe\u00e7a l\u00e1 nos 7,5m com for\u00e7a, grita 'FORA!' e se esquiva.","Cada leitura certa de bola fora ou passe certo na Zona Alvo vale 1 ponto; trocam a cada 10 saques."],"pontosAtencao":["Regra pr\u00e1tica da linha de fundo na praia: se voc\u00ea est\u00e1 a 1 passo da linha de fundo e o saque vem r\u00e1pido acima da linha do seu peito/ombro, 95% das vezes \u00e9 bola FORA.","Ao recuar para passar uma bola funda que vai cair dentro, incline o tronco para frente no momento da manchete para a bola viajar os 6 metros at\u00e9 a rede.","Nunca recue dando pulinhos de costas: vire o quadril de lado para enxergar a bola e a linha de fundo com a vis\u00e3o perif\u00e9rica."],"erroComum":"Passar de manchete bolas que iam cair 1 metro fora da quadra ou recuar com o tronco inclinado para tr\u00e1s mandando o passe curto no meio do caminho; corrija exigindo que o p\u00e9 de tr\u00e1s pare em cima da linha de fundo. Varia\u00e7\u00f5es","variacaoFacil":"J2 lan\u00e7a as bolas fundas a partir do meio da sua quadra para facilitar a leitura do arco.","variacaoDificil":"Se a bola cair dentro da quadra sem que J1 toque nela (erro de leitura achando que ia fora), J1 perde 2 pontos e paga 3 burpees na areia.","paraTurma":"Em turmas de 4 a 12 alunos, 2 sacadores batem saques fundos do lado direito enquanto duas filas de receptores saem dos 4,5m no lado esquerdo tomando a decis\u00e3o 'Dentro/Fora' e passando para o levantador na rede.","meta":"Acertar 8 de 10 decis\u00f5es (somando passes colocados na Zona Alvo e bolas fora deixadas sair corretamente).","descricaoDiagrama":"Quadra 16x8m vista de cima. J2 na linha de fundo direita saca fundo (seta de bola 1) at\u00e9 os 7,5m da meia-quadra esquerda. J1 recua do cone de 4,5m at\u00e9 perto da linha de fundo de 8m (seta tracejada 1), firma o p\u00e9 de tr\u00e1s e envia a manchete longa (seta de bola 2) at\u00e9 a Zona Alvo a 1,5m da rede.","codigo":"REC-INI-059"},{"numero":60,"secao":4,"nome":"Divis\u00e3o b\u00e1sica da quadra em dupla e chamada precoce","nivel":"Iniciante","jogadores":"3 jogadores (1 sacador e 2 receptores J1 e J2)","tempo":"9 minutos","material":"5 bolas, 4 cones e 1 zona alvo ALVO 1,5m J1 J2 S1 1 1 2 \"MINHA!\" (antes da rede)","objetivo":"Organizar o posicionamento inicial lado a lado (4 metros para cada um) e criar o reflexo de gritar 'MINHA!' antes da bola passar da rede.","comoMontar":"Na meia-quadra esquerda, divida a quadra ao meio no sentido do comprimento com 2 cones imagin\u00e1rios e posicione J1 no centro da metade esquerda (a 5,5m da rede e 2m da lateral) e J2 no centro da metade direita. Zona Alvo a 1,5m da rede. S1 saca do lado direito.","passoAPasso":["J1 e J2 assumem a base de recep\u00e7\u00e3o lado a lado a 5,5m da rede, mantendo 4 metros de dist\u00e2ncia entre si e 2 metros de cada linha lateral.","S1 saca por cima controlado variando entre o lado de J1 e o lado de J2.","Regra obrigat\u00f3ria: o jogador na dire\u00e7\u00e3o de quem a bola saiu precisa gritar alto 'MINHA!' ANTES que a bola cruze por cima da fita da rede.","No exato instante em que ouve o grito 'MINHA!' do parceiro, o outro jogador abandona a postura de recep\u00e7\u00e3o e corre em diagonal para a Zona Alvo na rede para ser o levantador.","O passador coloca a bola na Zona Alvo e o parceiro a agarra acima da testa em posi\u00e7\u00e3o de levantamento; rodam a cada 8 saques."],"pontosAtencao":["No v\u00f4lei de praia, o grito 'MINHA!' n\u00e3o serve s\u00f3 para evitar que os dois batam cabe\u00e7a: ele \u00e9 o gatilho que avisa o seu parceiro que ele j\u00e1 pode correr para a rede para levantar!","Se voc\u00ea demorar para gritar 'MINHA!', o seu parceiro fica preso l\u00e1 no fundo e chega atrasado para levantar.","Mantenha a disciplina espacial: cada um cuida dos seus 4 metros de largura."],"erroComum":"Recepcionar a bola em sil\u00eancio absoluto, deixando o parceiro parado no fundo sem saber se vai levantar; corrija invalidando o ponto toda vez que o grito acontecer depois que a bola j\u00e1 passou da rede. Varia\u00e7\u00f5es","variacaoFacil":"S1 lan\u00e7a a bola com as duas m\u00e3os do meio da quadra advers\u00e1ria dando mais tempo para a leitura e o grito.","variacaoDificil":"Se nenhum dos dois gritar antes da bola cruzar a fita, ambos precisam tocar a m\u00e3o na linha de fundo antes do pr\u00f3ximo saque.","paraTurma":"Em turmas de 4 a 12 alunos, posicione 2 sacadores no lado direito e organize os demais em duplas de recep\u00e7\u00e3o no lado esquerdo. Cada dupla recebe 4 bolas seguidas (com chamada e infiltra\u00e7\u00e3o do parceiro) e d\u00e1 lugar \u00e0 dupla seguinte.","meta":"Completar 8 de 10 recep\u00e7\u00f5es com chamada aud\u00edvel antes da rede e parceiro esperando na Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 na direita saca (seta de bola 1) na metade superior da quadra esquerda. J1 (a 5,5m da rede superior) grita 'MINHA!' e passa a bola (seta 2) para a Zona Alvo na rede, enquanto J2 (inferior) dispara em diagonal (seta tracejada 1) at\u00e9 a Zona Alvo para levantar.","codigo":"REC-INI-060"},{"numero":61,"secao":4,"nome":"Recep\u00e7\u00e3o de saque por cima nos dois corredores mirando o centro","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (1 sacador e 2 receptores)","tempo":"10 minutos","material":"5 bolas, 2 cones e 1 zona alvo ALVO 1,5m J1 J2 S1 1 2","objetivo":"Calibrar o peso e o \u00e2ngulo da manchete contra saques por cima reais enviados nos corredores laterais da dupla.","comoMontar":"S1 atr\u00e1s da linha de fundo direita (8m). Na meia- quadra esquerda, J1 (entrada/esquerda) e J2 (sa\u00edda/direita) posicionados a 5,5 metros da rede. Demarque a Zona Alvo de levantamento no centro a 1,5m da rede.","passoAPasso":["S1 executa saques por cima firmes alternando entre o corredor lateral de J1 e o corredor lateral de J2.","Quando o saque vai perto da linha lateral, o receptor se desloca, planta o p\u00e9 externo pr\u00f3ximo \u00e0 fita lateral e inclina o ombro de fora.","O passador envia a bola com arco alto mirando exatamente a Zona Alvo central (a 1,5m da rede) para que o parceiro n\u00e3o precise correr at\u00e9 a antena para levantar.","O parceiro que n\u00e3o passou infiltra at\u00e9 a Zona Alvo e faz um toque de controle para o alto confirmando que a bola chegou limpa na zona.","A cada 10 saques, rodam as fun\u00e7\u00f5es entre os tr\u00eas."],"pontosAtencao":["Quanto mais perto da linha lateral voc\u00ea estiver recebendo, mais cuidado precisa ter para n\u00e3o passar a bola reta (porque se o parceiro vem do outro lado, ele n\u00e3o alcan\u00e7a na antena).","Mire sempre o passe 1 metro para dentro do centro da quadra, nunca colado na antena.","Contra saque por cima firme, trave o abd\u00f4men no momento do impacto."],"erroComum":"Receber na linha lateral e mandar o passe cruzado demais, atravessando toda a quadra at\u00e9 o outro lado; corrija pedindo para amortecer a for\u00e7a e mirar no centro da rede. Varia\u00e7\u00f5es","variacaoFacil":"S1 saca do centro da linha de fundo com 70% de for\u00e7a.","variacaoDificil":"S1 saca dos cantos da linha de fundo cruzando em diagonal forte nos ombros externos de J1 e J2.","paraTurma":"Em turmas de 4 a 12 alunos, mantenha 2 sacadores na linha de fundo direita e duplas revezando a cada 4 saques no lado esquerdo. Os alunos que aguardam na fila fora da quadra contam em voz alta quantos passes ca\u00edram cravados na Zona Alvo.","meta":"Colocar 7 de 10 recep\u00e7\u00f5es de saque por cima dentro da Zona Alvo central a 1,5m da rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 na linha de fundo direita envia saques por cima nos dois corredores laterais (setas de bola 1). J1 (superior) e J2 (inferior) a 5,5m da rede abrem at\u00e9 a linha lateral (setas tracejadas 1) e direcionam a manchete (setas de bola 2) para a mesma Zona Alvo central a 1,5m da rede.","codigo":"REC-INT-061"},{"numero":62,"secao":4,"nome":"Dominando a bola na 'costura' (regra de conflito entre a dupla)","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (1 sacador mirando o meio e 2 receptores)","tempo":"10 minutos","material":"5 bolas, 2 cones e 1 zona alvo ALVO 1,5m J1 J2 S1 1 1","objetivo":"Eliminar a hesita\u00e7\u00e3o nas bolas sacadas exatamente no meio entre os dois jogadores aplicando uma regra clara de prioridade da dupla.","comoMontar":"S1 na linha de fundo direita com a miss\u00e3o de sacar exclusivamente na faixa central de 2 metros ('costura'). Na meia-quadra esquerda, J1 (esquerda) e J2 (direita) a 5,5m da rede. Coloque 2 cones delimitando o corredor central e a Zona Alvo a 1,5m da rede.","passoAPasso":["Antes de come\u00e7ar, a dupla define a regra oficial da costura: Regra A (padr\u00e3o de dois destros): J1 (jogador da esquerda) d\u00e1 meio passo \u00e0 frente e \u00e9 o dono da costura porque entra com o lado direito/forehand e j\u00e1 abre para atacar na entrada; ou Regra B: quem o sacador N\u00c3O est\u00e1 olhando fecha a costura.","S1 saca todas as bolas exatamente no meio entre J1 e J2.","Aplicando a regra combinada, o respons\u00e1vel pela costura (ex.: J1) d\u00e1 1 passo firme em diagonal para dentro gritando 'MINHA!' e toma a frente do parceiro.","J2 imediatamente recolhe os bra\u00e7os para n\u00e3o atrapalhar e j\u00e1 contorna por tr\u00e1s ou pela frente rumo \u00e0 Zona Alvo na rede.","Ap\u00f3s 6 bolas com J1 respons\u00e1vel pela costura, invertem a combina\u00e7\u00e3o fazendo J2 assumir a costura por mais 6 bolas."],"pontosAtencao":["Quando voc\u00ea chama a bola na costura, d\u00ea um passo levemente para FRENTE e para dentro (corte a trajet\u00f3ria da bola antes do seu parceiro).","Se os dois derem um passo para tr\u00e1s na costura, os dois v\u00e3o esperar um pelo outro e a bola vai cair no meio.","Depois de passar uma bola na costura central, o passador precisa abrir r\u00e1pido de volta para o seu lado da quadra para n\u00e3o atacar embolado no meio."],"erroComum":"Tocar na bola na costura apenas esticando o bra\u00e7o de lado sem levar o corpo para tr\u00e1s da bola; corrija exigindo que o umbigo do passador chegue na linha central dos cones. Varia\u00e7\u00f5es","variacaoFacil":"S1 saca da marca de 6 metros com trajet\u00f3ria arqueada no centro.","variacaoDificil":"S1 pode sacar na costura curta (3,5m) ou na costura funda (7,5m), exigindo comunica\u00e7\u00e3o de quem entra na frente e quem fecha atr\u00e1s.","paraTurma":"Em turmas de 4 a 12 alunos, coloque duplas na recep\u00e7\u00e3o recebendo s\u00e9ries de 4 saques seguidos na costura. Se a bola pingar no meio sem que ningu\u00e9m toque nela por indecis\u00e3o, a dupla sai imediatamente da quadra.","meta":"Resolver 8 de 10 saques na costura sem choque entre os parceiros e com passe dentro da Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 na linha de fundo direita saca pelo centro (seta de bola 1) na 'Costura' entre J1 e J2 (a 5,5m da rede na esquerda). J1 avan\u00e7a em diagonal fechando o meio (seta tracejada 1) e passa a bola (seta 2) para a Zona Alvo na rede, para onde J2 se desloca (seta tracejada 2).","codigo":"REC-INT-062"},{"numero":63,"secao":4,"nome":"Recep\u00e7\u00e3o em 'V': alternando saque curto e saque fundo","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (2 sacadores alternados e 1 receptor em trabalho intenso)","tempo":"10 minutos","material":"6 bolas, 3 cones e 1 zona alvo ALVO 1,5mJ1 S1 S2 1 2 1 2 3","objetivo":"Desenvolver a leitura r\u00e1pida de profundidade (curto vs. longo) e a recupera\u00e7\u00e3o imediata para a base central ap\u00f3s cada passe.","comoMontar":"No lado direito, S1 e S2 ficam com 3 bolas cada na linha de saque. No lado esquerdo, J1 come\u00e7a no cone central a 5,5m da rede. Coloque 1 cone a 2,5m da rede na diagonal esquerda (curta) e 1 cone a 7,5m da rede na diagonal direita (funda). Zona Alvo a 1,5m da rede.","passoAPasso":["J1 come\u00e7a no cone base (5,5m).","S1 executa um saque curto em dire\u00e7\u00e3o ao cone de 2,5m; J1 arranca para frente, freia baixo e passa a bola alta na Zona Alvo.","Assim que a bola sai do bra\u00e7o de J1, S2 j\u00e1 lan\u00e7a a bola para sacar fundo em dire\u00e7\u00e3o ao cone de 7,5m.","J1 abre o quadril, corre dos 2,5m at\u00e9 os 7,5m no fundo, planta o p\u00e9 de tr\u00e1s e passa a segunda bola na Zona Alvo.","Cada s\u00e9rie tem 6 bolas alternadas sem pausa (Curta - Funda - Curta - Funda - Curta - Funda); depois rodam os jogadores."],"pontosAtencao":["Na bola curta, a manchete aponta para o alto para amortecer a corrida; na bola funda, o tronco inclina \u00e0 frente para empurrar a bola at\u00e9 a rede.","N\u00e3o fique parado olhando se a sua primeira recep\u00e7\u00e3o caiu no alvo: passe a bola e j\u00e1 vire os olhos para o segundo sacador.","Controle a respira\u00e7\u00e3o soltando o ar no momento de cada manchete."],"erroComum":"Usar o mesmo golpe de bra\u00e7o na bola curta e na bola funda (mandando a curta de gra\u00e7a para o outro lado e deixando a funda morrer no meio da quadra); corrija gritando 'AMORTECE!' na curta e 'PERNA!' na funda. Varia\u00e7\u00f5es","variacaoFacil":"Dar 3 segundos de intervalo entre o saque de S1 e o saque de S2 para J1 voltar ao cone de 5,5m primeiro.","variacaoDificil":"S1 e S2 n\u00e3o seguem ordem fixa: cada um pode escolher na hora se saca curto ou fundo, exigindo leitura visual pura de J1.","paraTurma":"Em turmas de 4 a 12 alunos, 2 alunos sacam do lado direito, 1 aluno fica na Zona Alvo recolhendo e os demais formam fila no fundo esquerdo. Cada aluno faz uma sequ\u00eancia intensa de 4 bolas (2 curtas e 2 fundas) e troca.","meta":"Colocar pelo menos 4 das 6 bolas de cada s\u00e9rie cont\u00ednua dentro da Zona Alvo a 1,5m da rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 e S2 na direita enviam bola curta (seta 1 no cone de 2,5m) e bola funda (seta 2 no cone de 7,5m). Na esquerda, J1 avan\u00e7a para o cone curto (seta tracejada 1), passa para a Zona Alvo (bola 3) e recua em diagonal at\u00e9 o cone de 7,5m (seta tracejada 2) passando novamente ao alvo.","codigo":"REC-INT-063"},{"numero":64,"secao":4,"nome":"Recep\u00e7\u00e3o de saque flutuante: p\u00e9s vivos at\u00e9 o \u00faltimo segundo","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (ou 3 com levantador na rede)","tempo":"10 minutos","material":"5 bolas, 2 cones e 1 zona alvo ALVO 1,5m J1 S1 1 1 2","objetivo":"Evitar montar a manchete cedo demais contra saques flutuantes que mudam de dire\u00e7\u00e3o no ar, ajustando os p\u00e9s para manter a bola na linha do umbigo.","comoMontar":"S1 atr\u00e1s da linha de fundo direita (a 9 metros da rede) batendo saques flutuantes rasantes e sem giro. J1 no cone de recep\u00e7\u00e3o a 5,5 metros da rede na meia-quadra esquerda. Zona Alvo a 1,5m da rede.","passoAPasso":["J1 aguarda em postura ativa com os bra\u00e7os SEPARADOS e relaxados ao lado do corpo (proibido juntar as m\u00e3os antes de a bola cruzar a rede).","S1 bate um saque flutuante seco que oscila com o vento da praia.","Enquanto a bola viaja, J1 faz micro-passos r\u00e1pidos na areia ('p\u00e9s de boxeador') acompanhando o desvio de \u00faltima hora da bola para mant\u00ea-la alinhada com o centro do seu corpo.","Somente no \u00faltimo metro antes do impacto, J1 fecha e trava a plataforma firme, recebendo a bola com um contato s\u00f3lido e curto para a Zona Alvo.","Trocam de fun\u00e7\u00e3o a cada 8 saques flutuantes."],"pontosAtencao":["Contra saque flutuante na praia, quem junta as m\u00e3os cedo demais corre com os bra\u00e7os travados e toma ace quando a bola desvia 30 cm no \u00faltimo metro.","Mova os p\u00e9s at\u00e9 o \u00faltimo instante para receber a bola no meio do corpo: manchete lateral fora do corpo contra saque flutuante quase sempre espirra.","Fa\u00e7a uma plataforma 'dura' e firme para vencer a oscila\u00e7\u00e3o da bola."],"erroComum":"Cruzar os bra\u00e7os e estic\u00e1-los para frente assim que o sacador bate na bola, ficando lento nas pernas; corrija pedindo para bater uma palma r\u00e1pida quando a bola passar por cima da fita da rede e s\u00f3 ent\u00e3o montar a manchete. Varia\u00e7\u00f5es","variacaoFacil":"S1 saca flutuante com velocidade moderada mirando na metade de quadra de J1.","variacaoDificil":"J1 usa \u00f3culos escuros e S1 saca contra o vento (fazendo a bola flutuar e cair de repente no meio do caminho).","paraTurma":"Em turmas de 4 a 12 alunos, 3 sacadores batem saques flutuantes da linha de fundo direita para 2 receptores na quadra esquerda (que contam quantas bolas conseguiram receber no eixo do umbigo e colocar na Zona Alvo).","meta":"Dominar 7 de 10 saques flutuantes enviando a bola limpa e alta para dentro da Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 a 9m da rede na direita bate saque flutuante com trajet\u00f3ria ondulada (seta de bola 1). J1 a 5,5m da rede na esquerda faz micro- ajustes laterais r\u00e1pidos de p\u00e9s (setas tracejadas curtas 1) para enquadrar a bola no corpo e passa (seta de bola 2) para a Zona Alvo a 1,5m da rede.","codigo":"REC-INT-064"},{"numero":65,"secao":4,"nome":"Manchete alta lateral (recurso para saque r\u00e1pido no peito e ombro)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"5 bolas, 2 cones e 1 zona alvo ALVO 1,5mJ1 S1 1 1 2 Manchete alta lateral na altura do ombro/pesco\u00e7o Quadra 16x8m vista de cima. S1 a 6m da rede na direita envia bola tensa na linha","objetivo":"Dominar a manchete alta na linha do ombro/rosto para defender saques tensos sem cometer falta de toque sujo da regra da praia.","comoMontar":"S1 posiciona-se mais perto (a 6 metros da rede no lado direito, sobre um caixote ou sacando firme do ch\u00e3o) para enviar bolas tensas na altura do peito/ombro. J1 fica a 6 metros da rede no lado esquerdo. Zona Alvo a 1,5m da rede.","passoAPasso":["J1 fica na linha de 6 metros; S1 envia bolas r\u00e1pidas e retas mirando especificamente na linha dos ombros e do peito de J1.","Como no v\u00f4lei de praia \u00e9 muito arriscado tentar recepcionar um saque r\u00e1pido de toque de dedos (o \u00e1rbitro marca dois toques ou condu\u00e7\u00e3o ao menor deslize), J1 treina a 'manchete alta de ombro'.","J1 gira o tronco levemente de lado, afasta o quadril da trajet\u00f3ria da bola, levanta um dos cotovelos e inclina a plataforma na altura do ombro/pesco\u00e7o.","A bola bate no antebra\u00e7o inclinado ao lado do rosto e sobe amortecida em dire\u00e7\u00e3o \u00e0 Zona Alvo central.","Realizam 5 bolas no ombro direito e 5 bolas no ombro esquerdo; depois invertem os pap\u00e9is."],"pontosAtencao":["Esse \u00e9 um movimento 100% t\u00edpico do v\u00f4lei de praia: na quadra indoor o atleta usaria o toque de dedos, mas na areia voc\u00ea gira o tronco e usa a manchete alta lateral.","Nunca tente fazer manchete alta na frente do nariz com os dois cotovelos apontados para frente (a bola bate no seu rosto); vire os dois bra\u00e7os para um dos lados do corpo.","Relaxar os ombros no impacto para a bola n\u00e3o voltar forte para o outro lado."],"erroComum":"Dar um passo para tr\u00e1s tentando baixar a bola at\u00e9 a cintura e ser atingido no peito; corrija pedindo para manter a base e girar os bra\u00e7os para a lateral na altura do ombro. Varia\u00e7\u00f5es","variacaoFacil":"S1 lan\u00e7a a bola com uma m\u00e3o na altura do ombro de J1 avisando antes qual ombro vai acionar.","variacaoDificil":"S1 saca da linha de fundo (8m) mirando alto e tenso na linha da cabe\u00e7a de J1, que precisa decidir em meio segundo entre abaixar (se for fora) ou usar a manchete alta (se for dentro).","paraTurma":"Em turmas de 4 a 12 alunos, forme duplas: um aluno a 5 metros lan\u00e7a bolas r\u00e1pidas na linha do ombro do colega, que executa 8 manchetes altas laterais (4 de cada lado) mirando um terceiro colega na rede.","meta":"Amortecer e colocar 7 de 10 bolas altas na altura do ombro dentro da Zona Alvo central sem usar os dedos.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 a 6m da rede na direita envia bola tensa na linha do ombro (seta de bola 1) de J1 a 6m da rede na esquerda. J1 gira o tronco lateralmente (seta curva 1) executando manchete alta de ombro e envia a bola (seta 2) para a Zona Alvo a 1,5m da rede.","codigo":"REC-INT-065"},{"numero":66,"secao":4,"nome":"Recep\u00e7\u00e3o limpa de toque de dedos (quando e como usar na praia)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"5 bolas, 2 cones e 1 zona alvo ALVO 1,5mJ1 S1 1 1 2 Toque de recep\u00e7\u00e3o 100% sim\u00e9trico e sem rota\u00e7\u00e3o Quadra 16x8m vista de cima. S1 na linha de fundo direita envia saque arqueado acima da cabe\u00e7a (seta de bola 1) para J1 a 5m da rede na esquerda. J1 entra exatamente debaixo da bola (seta tracejada 1) e executa toque de dedos limpo (seta","objetivo":"Executar a recep\u00e7\u00e3o por cima com as duas m\u00e3os perfeitamente sim\u00e9tricas e firmes em bolas altas ou freadas pelo vento, sem cometer dois toques.","comoMontar":"J1 no cone a 5 metros da rede na meia-quadra esquerda. S1 na linha de fundo direita enviando saques mais altos ou saques que sobem contra o vento acima da cabe\u00e7a de J1. Zona Alvo a 1,5m da rede.","passoAPasso":["S1 saca bolas com arco m\u00e9dio/alto que chegam acima da linha da testa de J1 com velocidade moderada.","J1 se desloca r\u00e1pido na areia para colocar a testa exatamente debaixo da bola com os dois p\u00e9s 100% plantados no ch\u00e3o.","Levanta as duas m\u00e3os acima da testa em formato de concha firme (dedos mais r\u00edgidos do que no levantamento comum).","Executa um toque r\u00e1pido, simult\u00e2neo e sim\u00e9trico com os 10 dedos, sem deixar a bola girar nem afundar na palma da m\u00e3o, enviando-a para a Zona Alvo.","Regra de rigor da praia: se a bola der mais de 1 giro completo no ar ap\u00f3s sair da m\u00e3o de J1, conta como falta (dois toques) e n\u00e3o vale ponto."],"pontosAtencao":["Quando vale a pena usar toque na recep\u00e7\u00e3o na praia?","Apenas quando o saque vem mais lento/alto (ou freado pelo vento contra) e voc\u00ea consegue parar os dois p\u00e9s debaixo da bola.","Nunca tente recepcionar de toque na praia se estiver correndo ou com os bra\u00e7os esticados longe da testa \u2014 nesses casos, use a manchete alta do exerc\u00edcio anterior.","Deixe os punhos mais firmes (toque 'seco') para que os dois polegares e indicadores toquem a bola no exato mesmo milissegundo."],"erroComum":"Amortecer demais a bola descendo as m\u00e3os at\u00e9 o peito (condu\u00e7\u00e3o/carregada); corrija exigindo o contato alto acima da testa com expuls\u00e3o r\u00e1pida da bola. Varia\u00e7\u00f5es","variacaoFacil":"S1 lan\u00e7a a bola alta a partir do outro lado da rede para J1 calibrar a limpeza do toque.","variacaoDificil":"S1 alterna entre um saque forte (obrigando J1 a usar manchete) e um saque mais alto acima da cabe\u00e7a (permitindo o toque limpo).","paraTurma":"Em turmas de 4 a 12 alunos, o professor ou os colegas na rede atuam como '\u00e1rbitros de praia rigorosos', apitando qualquer m\u00ednima rota\u00e7\u00e3o da bola para educar a limpeza de m\u00e3os da turma.","meta":"Executar 7 de 10 recep\u00e7\u00f5es de toque acima da testa totalmente limpas (sem giro da bola) caindo na Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 na linha de fundo direita envia saque arqueado acima da cabe\u00e7a (seta de bola 1) para J1 a 5m da rede na esquerda. J1 entra exatamente debaixo da bola (seta tracejada 1) e executa toque de dedos limpo (seta de bola 2) para a Zona Alvo a 1,5m da rede.","codigo":"REC-INT-066"},{"numero":67,"secao":4,"nome":"Recep\u00e7\u00e3o do saque alto 'Jornada nas Estrelas' contra o sol e vento","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (ou 3 com levantador na rede)","tempo":"10 minutos","material":"5 bolas, 2 cones e 1 zona alvo (recomendado uso de bon\u00e9/viseira e \u00f3culos) SOL + VENTO ALVO 1,5m J1 S1 1 1 2","objetivo":"Aprender a rastrear a bola que sobe 15 metros no c\u00e9u sob o sol e o vento, posicionando- se com passos curtos para amortecer a queda vertical.","comoMontar":"Coloque o receptor (J1) no lado da quadra que olha contra o sol. S1 fica na linha de fundo oposta batendo o saque 'Jornada nas Estrelas' (ou lan\u00e7ando alt\u00edssimo do meio da quadra). Zona Alvo a 1,5m da rede.","passoAPasso":["S1 bate o saque alt\u00edssimo por baixo fazendo a bola subir entre 12 e 15 metros de altura.","Assim que a bola sobe, J1 N\u00c3O corre desesperado para onde acha que ela vai cair (pois o vento vai mexer nela l\u00e1 no alto): J1 acompanha a trajet\u00f3ria usando a m\u00e3o livre como viseira contra o sol at\u00e9 a bola atingir o ponto mais alto (\u00e1pice).","Quando a bola come\u00e7a a descer do \u00e1pice, J1 ajusta a posi\u00e7\u00e3o com passadas r\u00e1pidas mantendo a bola \u00e0 frente do corpo (nunca em cima da cabe\u00e7a).","Como a bola cai quase a 90 graus (vertical) e muito pesada, J1 flexiona bem os joelhos na areia e apresenta a plataforma firme e levemente inclinada \u00e0 frente, usando a subida das pernas para levar a bola at\u00e9 a Zona Alvo.","Trocam de lado a cada 8 bolas."],"pontosAtencao":["Se voc\u00ea ficar exatamente debaixo da bola que cai verticalmente do c\u00e9u, ela vai bater no seu bra\u00e7o e subir para tr\u00e1s da sua cabe\u00e7a: pare meio passo ATR\u00c1S da linha de queda da bola.","Na hora em que a bola cruza a frente do sol, olhe de relance para a sombra da bola na areia ou espere meio segundo para ela sair do disco solar.","Use as pernas no momento do impacto, pois a bola que cai verticalmente n\u00e3o tem impulso horizontal para chegar sozinha at\u00e9 a rede."],"erroComum":"Tentar pegar o saque 'Jornada nas Estrelas' de toque de dedos
