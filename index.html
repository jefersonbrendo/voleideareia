escricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 (superior) e J2 (inferior) frente a frente separados por 4m, com cones nas linhas laterais a 2m atr\u00e1s de cada um. Seta de bola 1 vai de J1 para J2 enquanto J1 corre para tocar o cone superior e volta (seta tracejada 1); seta de bola 2 volta de J2 para J1 enquanto J2 toca o cone inferior e retorna (seta tracejada 2).","codigo":"SOL-INT-234"},{"numero":235,"secao":15,"nome":"Auto-defesa de rea\u00e7\u00e3o na rede, giro e transi\u00e7\u00e3o individual (Solo)","nivel":"Intermedi\u00e1rio","jogadores":"1 jogador (treino solo usando a elasticidade da rede)","tempo":"9 minutos","material":"1 ou 2 bolas, 2 cones e 2 zonas alvo do outro lado TREINO SOLO DE REA\u00c7\u00c3O: Rebote na Malha da Rede + Defesa (1\u00ba) + Auto-levante (2\u00ba) + Ataque (3\u00ba) ALVO ATAQUE 1 ALVO ATAQUE 2 J1 1 2","objetivo":"Usar o rebote da malha da rede como um 'parceiro lan\u00e7ador' para treinar defesa reflexa, auto-levantamento e ataque quando voc\u00ea est\u00e1 sozinho na quadra.","comoMontar":"Certifique-se de que a rede da quadra esteja bem esticada. Na meia-quadra esquerda, coloque 1 cone a 2,5 metros da rede no centro. Na meia-quadra direita, demarque 2 Zonas Alvo nos cantos de fundo.","passoAPasso":["Dica de Ouro do Treino Solo na Areia: quando voc\u00ea n\u00e3o tem ningu\u00e9m para bater bola em voc\u00ea, a malha central da rede funciona como um 'pared\u00e3o el\u00e1stico' que devolve a bola de forma imprevis\u00edvel!","Passo 1 (O Rebote na Rede): J1 posiciona-se a 2,5 metros da rede e arremessa (ou bate) a bola com for\u00e7a contra o meio da malha da rede (a cerca de 30 cm abaixo da fita branca superior).","Passo 2 (1\u00ba Toque \u2014 Defesa Reflexa): a rede estufa e cospe a bola de volta r\u00e1pida e baixa! J1 faz o split-step na areia e defende de manchete amortecida jogando a bola 4 metros para o alto no centro da sua quadra.","Passo 3 (2\u00ba Toque \u2014 Auto-levantamento): J1 entra embaixo da bola que subiu, planta os dois p\u00e9s e faz um levantamento de toque limpo (ou manchete) para a entrada da rede (a 1,5m da fita).","Passo 4 (3\u00ba Toque \u2014 Ataque): J1 d\u00e1 os 2 passos finais na areia, salta e ataca a bola por cima da rede acertando as Zonas Alvo do lado direito!"],"pontosAtencao":["Jogue a bola contra a malha da rede em um \u00e2ngulo levemente de baixo para cima para que a rede devolva a bola subindo um pouco, e n\u00e3o cravada no seu p\u00e9.","Como voc\u00ea est\u00e1 sozinho fazendo os 3 toques reais (Defesa + Levantamento + Ataque), capriche na altura da defesa e do levantamento para ter tempo de saltar!","Se a bola voltar muito curta da rede, use o mergulho controlado (peixinho) para subi-la bem alta."],"erroComum":"Bater a bola fraco na rede ou na fita branca superior (que n\u00e3o tem elasticidade), fazendo a bola morrer colada na rede; corrija mirando na malha preta a um palmo abaixo da fita superior. Varia\u00e7\u00f5es","variacaoFacil":"Pular o 2\u00ba toque: ap\u00f3s defender o rebote da rede no 1\u00ba toque bem alto perto da fita, j\u00e1 atacar direto no 2\u00ba toque.","variacaoDificil":"Antes de jogar a bola na malha da rede, J1 d\u00e1 1 salto de bloqueio na fita, aterrissa recuando aos 3 metros, arremessa na rede com giro de 360 graus e defende no reflexo!","paraTurma":"Em turmas de 4 a 12 alunos, \u00e9 uma excelente esta\u00e7\u00e3o aut\u00f4noma: coloque 4 alunos (2 de cada lado da rede, em corredores separados) usando a malha da rede para treinar rea\u00e7\u00e3o + auto-transi\u00e7\u00e3o.","meta":"Completar 8 de 10 sequ\u00eancias completas de Rebote na Rede + Defesa + Auto-levantamento + Ataque v\u00e1lido nas Zonas Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 a 2,5m da rede arremessa a bola contra a malha da rede (seta 1); a rede rebate a bola de volta (seta 2). J1 defende para o alto no 1\u00ba toque, auto-levanta para a ponta no 2\u00ba toque (seta 3), avan\u00e7a (seta tracejada) e ataca por cima da rede no 3\u00ba toque (seta 4) nas Zonas Alvo da direita.","codigo":"SOL-INT-235"},{"numero":236,"secao":15,"nome":"Saque, recep\u00e7\u00e3o na zona alvo e auto-ataque entre parceiros (Dupla)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (J1 de um lado da rede e J2 do outro lado)","tempo":"10 minutos","material":"4 bolas, 4 cones e 2 zonas alvo de recep\u00e7\u00e3o na rede TREINO EM DUPLA: Saque Real de J2 vs. Recep\u00e7\u00e3o na Zona (1\u00ba) + Auto-levante (2\u00ba) + Ataque de J1 (3\u00ba) ZONA PASSE 1,5m ZONA PASSE 1,5m J1 J2 1 2","objetivo":"Treinar em dupla o duelo direto de Saque vs. Recep\u00e7\u00e3o seguido de auto-transi\u00e7\u00e3o de ataque, sem precisar de um terceiro jogador para levantar.","comoMontar":"J1 posiciona-se na meia-quadra esquerda (a 5,5m da rede) e J2 posiciona-se na linha de fundo da meia- quadra direita (8m da rede). Em cada lado da rede, demarque com cones uma 'Zona de Recep\u00e7\u00e3o Perfeita' (2x2m no centro, a 1,5m da fita).","passoAPasso":["Como treinar recep\u00e7\u00e3o e ataque de side-out quando s\u00f3 existem 2 jogadores na quadra? Usando a regra do 'Auto- side-out de 3 Toques Individuais'!","J2 saca da linha de fundo direita (8m) buscando dificultar a recep\u00e7\u00e3o de J1 na quadra esquerda.","1\u00ba Toque de J1 (A Recep\u00e7\u00e3o): J1 faz o destrave, desloca-se na areia e precisa recepcionar de manchete alta fazendo a bola subir e cair rumo \u00e0 'Zona de Recep\u00e7\u00e3o Perfeita' (no centro a 1,5m da rede).","2\u00ba Toque de J1 (O Auto-levantamento): assim que a bola sai dos antebra\u00e7os na recep\u00e7\u00e3o, J1 corre atr\u00e1s da pr\u00f3pria bola at\u00e9 a Zona Central (1,5m), para os p\u00e9s e levanta de toque limpo (ou manchete) para a sua pr\u00f3pria ponta!","3\u00ba Toque de J1 (O Ataque): J1 d\u00e1 os 2 passos finais e ataca para a quadra direita (onde J2 j\u00e1 entrou para defender e emendar os seus 3 toques de volta!)."],"pontosAtencao":["Por que esse exerc\u00edcio em dupla \u00e9 t\u00e3o eficiente?","Porque se voc\u00ea errar a dire\u00e7\u00e3o ou a altura da sua recep\u00e7\u00e3o (1\u00ba toque), \u00e9 VOC\u00ca MESMO quem vai ter que correr feito louco na areia para salvar o seu 2\u00ba toque!","Isso educa o passador a mandar a recep\u00e7\u00e3o alta (4,5m) e cravada no centro!","Para o sacador (J2): logo ap\u00f3s sacar, entre na quadra aos 5,5m para defender o ataque de J1 e manter o rali vivo!","Use levantamentos altos para ter tempo de encadear o 2\u00ba e o 3\u00ba toque sozinho."],"erroComum":"Recepcionar o saque baixo demais (2 metros de altura), tornando imposs\u00edvel sair dos 5,5m e chegar aos 1,5m antes de a bola cair; corrija exigindo arco de recep\u00e7\u00e3o acima de 4,5 metros. Varia\u00e7\u00f5es","variacaoFacil":"Permitir que a bola d\u00ea 1 quique \u00fanico dentro da Zona Central de 1,5m ap\u00f3s a recep\u00e7\u00e3o antes de J1 peg\u00e1-la para levantar e atacar.","variacaoDificil":"Se a recep\u00e7\u00e3o (1\u00ba toque) j\u00e1 cair perfeita a 1,5m da rede com altura \u00f3tima, J1 pode atacar direto de 2\u00aa bola tentando surpreender J2!","paraTurma":"Em turmas de 4 a 12 alunos, divida a quadra longitudinalmente em dois corredores de 16x4m: 4 alunos jogam esse formato ao mesmo tempo com rod\u00edzio a cada 2 pontos.","meta":"Converter 7 de 10 auto-side-outs (Recep\u00e7\u00e3o alta na Zona Central + Auto-levantamento + Ataque v\u00e1lido) contra o saque real do parceiro.","descricaoDiagrama":"Quadra 16x8m vista de cima. J2 saca da linha de fundo direita (seta 1) para J1 aos 5,5m na esquerda. J1 recepciona alto para a Zona Alvo a 1,5m da rede (seta 2), corre at\u00e9 o centro (seta tracejada 1) para auto-levantar no 2\u00ba toque (seta 3), abre na passada (seta tracejada 2) e ataca no 3\u00ba toque (seta 4) contra a defesa de J2.","codigo":"SOL-INT-236"},{"numero":237,"secao":15,"nome":"Sequ\u00eancia cooperativa-competitiva em dupla: lan\u00e7amento de defesa, levantamento e ataque (Dupla)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (J1 e J2 trabalhando juntos na mesma dupla)","tempo":"10 minutos","material":"5 bolas, 4 cones e 4 zonas alvo nos cantos advers\u00e1rios SEQU\u00caNCIA EM DUPLA: J1 bate p/ Defesa de J2 (1) J2 defende (2) J1 levanta e canta alvo (3) J2 ataca (4) 4a: CURTA LINHA 4b: CUT SHOT 4c: FUNDO LINHA 4d: FUNDO DIAG J1","objetivo":"Treinar em dupla toda a mec\u00e2nica de Defesa + Levantamento + Ataque na velocidade real de jogo usando o pr\u00f3prio parceiro como batedor inicial.","comoMontar":"Na meia-quadra esquerda: J1 come\u00e7a junto \u00e0 rede no centro com uma bola na m\u00e3o, e J2 come\u00e7a na base de defesa no fundo (a 5,5m da rede). Na meia-quadra direita: demarque 4 Zonas Alvo nos 4 cantos (2 curtas a 2m da rede e 2 fundas a 7,5m).","passoAPasso":["Como uma dupla treina defesa e contra-ataque de 3 toques quando n\u00e3o h\u00e1 advers\u00e1rio do outro lado da rede? O pr\u00f3prio levantador (J1) inicia a jogada batendo contra o seu defensor (J2)!","Passo 1 (O Est\u00edmulo de Defesa): J1 (na rede, virado de frente para J2 no fundo da mesma quadra!) bate uma cortada controlada, solta uma largada curta aos 3m ou joga um lob alto nas costas de J2.","Passo 2 (1\u00ba Toque \u2014 A Defesa de J2): J2 l\u00ea o golpe de J1, desloca-se na areia e defende a bola alta (4,5m) de volta para o centro da rede onde est\u00e1 J1.","Passo 3 (2\u00ba Toque \u2014 O Levantamento de J1): assim que bateu a bola inicial, J1 j\u00e1 assume o papel de levantador da dupla! Ele entra embaixo da defesa de J2, para os p\u00e9s e levanta na medida (toque ou manchete).","Passo 4 (3\u00ba Toque \u2014 O Ataque + Canto de Alvo): enquanto J2 corre para atacar, J1 grita qual das 4 Zonas Alvo do outro lado J2 deve acertar ('CURTA LINHA!', 'FUNDO DIAGO!') e J2 crava a bola no alvo pedido!"],"pontosAtencao":["Essa \u00e9 a rotina n\u00famero 1 das duplas profissionais quando treinam sozinhas: em uma \u00fanica bola, J1 treina batida de controle + levantamento + chamada de vis\u00e3o, e J2 treina leitura de defesa + transi\u00e7\u00e3o + ataque direcionado!","J1 deve variar o est\u00edmulo inicial: 1 bola forte no peito de J2, 1 bola curta obrigando J2 a avan\u00e7ar e 1 bola no canto.","Troquem de papel (J2 vai para a rede bater/levantar e J1 vai para o fundo defender/atacar) a cada 8 bolas."],"erroComum":"J1 bater a primeira bola forte demais e sem controle para fora da quadra, estragando a repeti\u00e7\u00e3o; corrija batendo a 70% de for\u00e7a na dire\u00e7\u00e3o do raio de alcance de J2. Varia\u00e7\u00f5es","variacaoFacil":"J1 inicia lan\u00e7ando a bola com as duas m\u00e3os nas laterais e na curta para J2 defender.","variacaoDificil":"Se J2 acertar a Zona Alvo cantada por J1 no ataque final, J1 j\u00e1 pega imediatamente uma 2\u00aa bola do cesto aos seus p\u00e9s e solta um pingo curto para J2 salvar no peixinho sem descanso!","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 duplas na meia-quadra esquerda (uma no corredor superior e outra no inferior) executando essa rotina e 2 duplas na direita defendendo os ataques reais e contra-atacando!","meta":"Completar 12 de 16 sequ\u00eancias com defesa controlada, levantamento limpo e ataque certeiro na Zona Alvo chamada por J1.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 junto \u00e0 rede bate/lan\u00e7a a bola para tr\u00e1s (seta 1) desafiando J2 aos 5,5m. J2 defende alto de volta para o centro (seta 2); J1 vira levantador e levanta na ponta (seta 3) gritando o alvo, e J2 avan\u00e7a (seta tracejada) atacando por cima da rede (setas 4a, 4b, 4c, 4d) nas 4 Zonas Alvo da direita.","codigo":"SOL-INT-237"},{"numero":238,"secao":15,"nome":"Transi\u00e7\u00e3o completa em dupla saindo da rede: bloqueio, retirada, defesa e ataque (Dupla)","nivel":"Avan\u00e7ado","jogadores":"2 jogadores (J1 e J2 trabalhando a transi\u00e7\u00e3o completa da rede para o fundo)","tempo":"11 minutos","material":"5 bolas, 2 cones de fundo e 2 zonas alvo TRANSI\u00c7\u00c3O COMPLETA EM DUPLA: J1 Salta Bloco + Retira aos 5,5m J2 ataca J1 J1 defende, J2 levanta e J1 ataca! ALVO ATAQUE 1 ALVO ATAQUE 2 J1J1 J2 1","objetivo":"Treinar em dupla o movimento mais exigente da praia (saltar no bloqueio, retirar at\u00e9 os 5,5m, defender e voltar atacando) sem precisar de um treinador.","comoMontar":"Na meia-quadra esquerda, TANTO J1 QUANTO J2 come\u00e7am juntos perto da rede! Coloque 2 cones a 5,5 metros da rede (Ponto de Retirada). Na meia-quadra direita, demarque duas Zonas Alvo de ataque.","passoAPasso":["J1 come\u00e7a colado na rede (bloqueador que vai retirar e atacar); J2 fica a 2 metros da rede com uma bola nas m\u00e3os.","Passo 1 (O Salto de Bloqueio + Retirada): J1 executa um salto vertical m\u00e1ximo de bloqueio na fita. Assim que os p\u00e9s de J1 tocam a areia, J1 abre o quadril e dispara em retirada ('pulling') at\u00e9 o cone de 5,5 metros no fundo!","Passo 2 (O Ataque Simulado de J2): exatamente quando J1 chega e planta os p\u00e9s no cone de 5,5m, J2 (que estava na frente com a bola) bate ou lan\u00e7a uma bola dif\u00edcil na dire\u00e7\u00e3o de J1 (ou uma bola curta, ou um lob, ou forte no corpo).","Passo 3 (A Defesa + Levantamento): J1 defende a bola alta para o centro da quadra (a 2m da rede); J2 entra embaixo da bola e faz o levantamento na ponta.","Passo 4 (O Contra-ataque): J1 arranca dos 5,5m de volta at\u00e9 a rede, salta e finaliza o contra-ataque nas Zonas Alvo da direita! Fazem 6 repeti\u00e7\u00f5es seguidas e invertem os pap\u00e9is."],"pontosAtencao":["Sincronia perfeita de J2: J2 deve esperar J1 saltar na rede e correr at\u00e9 os 5,5m para bater a bola no exato momento em que J1 faz o split-step no cone de fundo!","Para J1: n\u00e3o corte caminho na retirada!","Toque o p\u00e9 na linha do cone de 5,5m antes de defender para simular a dist\u00e2ncia real de jogo.","Ap\u00f3s defender aos 5,5m, mande a bola com 4,5m a 5m de altura para dar tempo de voc\u00ea mesmo voltar \u00e0 rede para bater."],"erroComum":"J2 lan\u00e7ar a bola cedo demais enquanto J1 ainda est\u00e1 de costas correndo da rede para o fundo; corrija esperando J1 girar o peito de frente para a rede no cone de 5,5m. Varia\u00e7\u00f5es","variacaoFacil":"Reduzir a dist\u00e2ncia do cone de retirada para 4,5 metros da rede e enviar bolas em arco controlado.","variacaoDificil":"Incluir a 'Quebra de Padr\u00e3o' (Se\u00e7\u00e3o 10): em metade das bolas, ap\u00f3s J1 saltar no bloqueio, J2 joga uma bola curt\u00edssima aos 2m obrigando J1 a mergulhar na frente e J2 a levantar!","paraTurma":"Em turmas de 4 a 12 alunos, forme duplas em ambas as meias-quadras (duas duplas trabalhando na esquerda e duas na direita simultaneamente), trocando a fun\u00e7\u00e3o entre parceiros a cada 5 bolas.","meta":"Completar 5 de 6 transi\u00e7\u00f5es completas (Bloqueio + Retirada 5,5m + Defesa + Levantamento + Ataque no alvo) por s\u00e9rie.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na esquerda, J1 salta no bloqueio junto \u00e0 rede e retira em sprint at\u00e9 o cone a 5,5m (seta tracejada 1). J2 (a 2m da rede) envia a bola de ataque para J1 no fundo (seta de bola 1). J1 defende alto para o centro (seta 2), J2 levanta na ponta (seta 3) e J1 avan\u00e7a do fundo \u00e0 rede (seta tracejada 2) cravando o ataque nas Zonas Alvo da direita (seta 4).","codigo":"SOL-AVA-238"},{"numero":239,"secao":15,"nome":"Desafio cooperativo-competitivo em dupla: 'Rali de 3 Toques + Jogo Livre' (Dupla)","nivel":"Avan\u00e7ado","jogadores":"2 jogadores (1 contra 1 em meia-quadra com fase cooperativa pr\u00e9via)","tempo":"12 minutos","material":"3 bolas e 4 cones delimitando o corredor de 16x5m (ou 16x4m) DUELO 1x1 COOPERATIVO-COMPETITIVO (16x5m): 2 Trocas Cooperativas de 3 Toques Grito 'VALENDO!' abre o ponto! FAIXA INATIVA DE 3m (CORREDOR ATIVO DE 16x5m) CURTA J1 J2 1 2","objetivo":"Transformar o treino de 2 jogadores em um jogo de alt\u00edssimo volume de toques onde os dois primeiro cooperam mantendo a bola viva e depois competem pelo ponto.","comoMontar":"Use cones para delimitar um corredor longitudinal de 5 metros de largura por 16 metros de comprimento (8x5m de cada lado da rede). J1 fica no lado esquerdo e J2 fica no lado direito.","passoAPasso":["Quando voc\u00ea s\u00f3 tem 1 amigo para jogar (1 contra 1), se cada um tentar matar a bola de primeira o rali acaba em 2 segundos e ningu\u00e9m treina! Este formato une Coopera\u00e7\u00e3o + Competi\u00e7\u00e3o no mesmo rali:","Fase 1 (Coopera\u00e7\u00e3o Obrigat\u00f3ria \u2014 As 2 primeiras idas e vindas sobre a rede): J1 saca para J2; J2 \u00e9 obrigado a fazer 3 toques individuais (1\u00ba recepciona, 2\u00ba auto-levanta, 3\u00ba passa uma bola atacada/controlada na dire\u00e7\u00e3o de J1). J1 tamb\u00e9m defende e faz 3 toques individuais devolvendo na m\u00e3o de J2!","Fase 2 (Grito de 'VALENDO!' \u2014 A Competi\u00e7\u00e3o Abre!): a partir do momento em que a bola cruza a rede pela 3\u00aa vez (ap\u00f3s ambos j\u00e1 terem feito uma sequ\u00eancia completa de defesa + auto-levantamento + ataque!), quem est\u00e1 com a bola grita 'VALENDO!'.","Ap\u00f3s o grito de 'VALENDO!', vale matar o ponto nos cantos (usando 2 ou 3 toques individuais, cut shot, lob na linha de 8m ou poke curto aos 2m)!","Se algu\u00e9m errar durante a Fase 1 cooperativa, perde 1 ponto; quem vencer o rali na Fase 2 competitiva ganha +2 pontos!"],"pontosAtencao":["Olha a riqueza desse jogo para 2 pessoas: em TODO ponto disputado, cada jogador \u00e9 garantido de fazer pelo menos 6 a 9 toques na bola antes de o ponto acabar!","Na Fase 1 (Cooperativa), bata firme no peito do seu parceiro para aquecer a defesa dele; na Fase 2 ('Valendo!'), tire a bola dele mirando nos 4 cantos do corredor de 8x5m!","Nos 3 toques individuais, capriche na altura do 1\u00ba e do 2\u00ba toque para atacar equilibrado no 3\u00ba."],"erroComum":"Tentar matar o ponto antes de completar a Fase 1 cooperativa ou relaxar os p\u00e9s depois de gritar 'Valendo!'; corrija contando em voz alta: 'Bola 1... Bola 2... VALENDO!'. Varia\u00e7\u00f5es","variacaoFacil":"Exigir apenas 2 toques individuais por vez no corredor mais estreito de 16x4m.","variacaoDificil":"Na Fase 2 ('Valendo!'), para o ponto valer, o jogador precisa tocar a m\u00e3o na fita da rede (ou na linha de fundo) ap\u00f3s passar a bola para o outro lado!","paraTurma":"Em turmas de 4 a 12 alunos, divida a quadra em duas pistas de 16x4m: duas partidas cooperativo-competitivas rolam ao mesmo tempo com troca de advers\u00e1rios a cada 4 minutos.","meta":"Disputar um set at\u00e9 15 pontos com zero erros na Fase 1 cooperativa e ralis m\u00e9dios acima de 12 toques na bola.","descricaoDiagrama":"Quadra 16x8m reduzida para um corredor ativo de 16x5m (faixa inferior de 3m fora de jogo). J1 na esquerda e J2 na direita executam primeiro a Fase 1 Cooperativa com 3 toques individuais de cada lado (setas 1, 2 e 3), seguida do grito 'VALENDO!' que abre a Fase 2 Competitiva buscando os cantos curtos e fundos (setas 4a e 4b).","codigo":"SOL-AVA-239"},{"numero":240,"secao":15,"nome":"Treino Aut\u00f4nomo Completo de 30 Minutos para Dupla (O 'Treino Perfeito' sem Professor)","nivel":"Avan\u00e7ado","jogadores":"2 jogadores (J1 e J2 seguindo o cronograma completo de 4 blocos)","tempo":"30 minutos (divididos em 4 blocos cronometrados de 6 a 8 minutos)","material":"2 a 4 bolas, 4 cones e 1 rel\u00f3gio/celular marcando os blocos J1 J2 1,5mJ1 J2","objetivo":"Fornecer \u00e0 dupla um roteiro estruturado de 30 minutos do in\u00edcio ao fim para realizar um treino t\u00e9cnico, t\u00e1tico e f\u00edsico completo na arena mesmo quando est\u00e3o apenas em dois.","comoMontar":"Monte a quadra oficial 16x8m com 2 cones marcando a Zona Central de Levantamento (a 1,5m da rede) e 2 cones marcando alvos nos cantos opostos. Deixe o cron\u00f4metro vis\u00edvel junto ao poste.","passoAPasso":["Sempre que voc\u00ea e seu parceiro chegarem na arena e estiverem apenas em dois, sigam este Protocolo Oficial de 30 Minutos em 4 Blocos:","BLOCO 1 \u2014 Aquecimento e Controle em Movimento (Minutos 0 a 6): 3 minutos de mobilidade articular na areia (Se\u00e7\u00e3o 1) + 3 minutos do controle cont\u00ednuo com toque nos cones laterais (Exerc\u00edcio 234), aquecendo toque e manchete.","BLOCO 2 \u2014 Calibragem de Levantamento de Precis\u00e3o (Minutos 6 a 13): 20 levantamentos de manchete e 20 de toque limpo (Se\u00e7\u00f5es 5 e 6) saindo do fundo (5,5m) at\u00e9 a rede (1,5m) ap\u00f3s passe do parceiro, cravando a bola na Zona Alvo.","BLOCO 3 \u2014 Duelo de Saque, Recep\u00e7\u00e3o e Auto-Side-out (Minutos 13 a 21): 10 saques de J1 contra a recep\u00e7\u00e3o + auto-levantamento + ataque de J2 (Exerc\u00edcio 236), seguidos de 10 saques de J2 contra J1, trocando de lado na metade para treinar nos dois ventos!","BLOCO 4 \u2014 Transi\u00e7\u00e3o de Guerra e Jogo 'Valendo!' (Minutos 21 a 30): 5 minutos da transi\u00e7\u00e3o de bloqueio + retirada + defesa + ataque (Exerc\u00edcio 238) e fechamento nos \u00faltimos 4 minutos com um Tie-Break at\u00e9 15 pontos no corredor 1x1 Cooperativo-Competitivo (Exerc\u00edcio 239)!"],"pontosAtencao":["O segredo de treinar em dupla sem treinador \u00e9 o REL\u00d3GIO: n\u00e3o fiquem 25 minutos s\u00f3 batendo bola parados um na frente do outro!","Respeitem a troca de bloco a cada 7 minutos com 1 minuto de \u00e1gua na sombra.","Cobrem um do outro a limpeza do toque de dedos (zero giro) e a chamada verbal ('Minha!', 'Linha!', 'Cruzado!') durante todos os 4 blocos.","Ao final dos 30 minutos, voc\u00eas ter\u00e3o executado mais de 150 contatos reais de jogo na bola!"],"erroComum":"Chegar na quadra em dois, bater bola sem objetivo por 10 minutos e parar para conversar porque 'n\u00e3o tem mais dois para jogar'; corrija salvando este card #240 no celular para seguir os 4 blocos na areia. Varia\u00e7\u00f5es","variacaoFacil":"Reduzir cada bloco para 5 minutos (treino express de 20 /* ===== LOCALSTORAGE ===== */
function lsGet(k, def) {
  try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : def; }
  catch(e) { return def; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
}

let favorites = new Set(lsGet('favs', []));
let levelFilter = lsGet('level', '');
let theme = lsGet('theme', '');

function saveFavs() { lsSet('favs', [...favorites]); }

/* ===== THEME ===== */
function applyTheme() {
  if (theme) document.documentElement.setAttribute('data-theme', theme);
  else document.documentElement.removeAttribute('data-theme');
}
function toggleTheme() {
  theme = theme === 'dark' ? 'light' : theme === 'light' ? '' : 'dark';
  lsSet('theme', theme);
  applyTheme();
  render();
}
applyTheme();

/* ===== ROUTER ===== */
function getRoute() {
  const h = location.hash.replace('#', '');
  if (!h) return { name: 'home' };
  if (h.startsWith('secao-')) return { name: 'secao', n: parseInt(h.slice(6)) };
  if (h.startsWith('ex-')) return { name: 'ex', num: parseInt(h.slice(3)) };
  return { name: h };
}
function go(hash) { location.hash = hash; }

/* ===== HELPERS ===== */
function e(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'cls') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === 'string') el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  }
  return el;
}
function html(s) { const d = document.createElement('div'); d.innerHTML = s; return d; }

function filteredEx(filter) {
  if (!filter) return EX;
  return EX.filter(ex => ex.nivel === filter);
}
function secaoName(n) { const s = SECOES.find(s => s.n === n); return s ? s.nome : ''; }
function exInSecao(n) {
  const all = EX.filter(ex => ex.secao === n);
  if (!levelFilter) return all;
  return all.filter(ex => ex.nivel === levelFilter);
}

function renderLevelChips(onChange, pool = EX) {
  const wrap = document.createElement('div');
  wrap.className = 'level-chips';
  const counts = {
    '': pool.length,
    'Iniciante': pool.filter(e => e.nivel === 'Iniciante').length,
    'Intermediário': pool.filter(e => e.nivel === 'Intermediário').length,
    'Avançado': pool.filter(e => e.nivel === 'Avançado').length,
  };
  const opts = [
    ['', 'Todos', 'chip-all'],
    ['Iniciante', 'Iniciante', 'chip-ini'],
    ['Intermediário', 'Intermediário', 'chip-int'],
    ['Avançado', 'Avançado', 'chip-ava'],
  ];
  for (const [val, label, cls] of opts) {
    const btn = document.createElement('button');
    btn.className = `chip ${cls}${levelFilter === val ? ' active' : ''}`;
    btn.dataset.val = val;
    btn.innerHTML = `${label}<span class="chip-count">${counts[val]}</span>`;
    if (val && !counts[val]) { btn.disabled = true; btn.title = 'Nenhum exercício deste nível aqui'; }
    btn.addEventListener('click', () => {
      levelFilter = val;
      lsSet('level', val);
      wrap.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b.dataset.val === levelFilter));
      onChange();
    });
    wrap.appendChild(btn);
  }
  return wrap;
}

      h += bloco(ICON.list, 'Passo a passo', passos);

    } else if (exTab === 'corrigir') {
      h += bloco(ICON.alert, 'Pontos de atenção', bullets);

    conteudo.innerHTML = h;

  pintarAba();

  // Barra de ação fixa
  const prevEx = idx > 0 ? secExs[idx - 1] : null;

  bNext.addEventListener('click', () => go(nextEx ? `ex-${nextEx.numero}` : `secao-${ex.secao}`));
  frag.appendChild(acao);
  return frag;
}

  const inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'search-input';
  inp.placeholder = 'Nome, objetivo, material...';
  const saved = lsGet('searchq', '');
  if (saved) inp.value = saved;
  sw.appendChild(inp);
  page.appendChild(sw);

  // Level chips
  const results = document.createElement('div');
  results.className = 'search-results';
  const chips = renderLevelChips(() => doSearch(inp.value, results));
  page.appendChild(chips);
  page.appendChild(results);

  inp.addEventListener('input', () => {
    lsSet('searchq', inp.value);
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => doSearch(inp.value, results), 200);
  });

  if (saved) doSearch(saved, results);
  else results.innerHTML = '<div class="search-empty"><div class="empty-icon">🔍</div>Digite para buscar exercícios</div>';

  frag.appendChild(page);

  setTimeout(() => inp.focus(), 100);
  return frag;
}

function doSearch(q, container) {
  container.innerHTML = '';
  const t = q.trim().toLowerCase();
  const matches = t
    ? EX.filter(e =>
        e.nome.toLowerCase().includes(t) ||
        e.objetivo.toLowerCase().includes(t) ||
        e.material.toLowerCase().includes(t) ||
        e.codigo.toLowerCase().includes(t))
    : EX;
  // Atualiza os números dos filtros para refletir o resultado da busca
  document.querySelectorAll('.level-chips .chip').forEach(btn => {
    const v = btn.dataset.val;
    const n = v ? matches.filter(e => e.nivel === v).length : matches.length;
    btn.querySelector('.chip-count').textContent = n;
    btn.disabled = !!v && n === 0 && levelFilter !== v;
  });
  let results = levelFilter ? matches.filter(e => e.nivel === levelFilter) : matches;

  if (!results.length) {
    container.innerHTML = `<div class="search-empty"><div class="empty-icon">😕</div>Nenhum resultado para "${escHtml(q)}"</div>`;
    return;
  }
  const list = document.createElement('div');
  list.className = 'ex-list';
  for (const ex of results.slice(0, 80)) list.appendChild(renderExCard(ex));
  container.appendChild(list);
  if (results.length > 80) {
    const more = document.createElement('p');
    more.style.cssText = 'text-align:center;color:var(--text-muted);padding:8px;font-size:.8rem';
    more.textContent = `+${results.length - 80} resultados. Refine a busca.`;
    container.appendChild(more);
  }
}

          const sec = SECOES.find(s => s.n === n);
          if (!sec) continue;
          const lnk = document.createElement('div');
          lnk.className = 'model-link';
          lnk.textContent = sec.nome;
          lnk.addEventListener('click', () => go(`secao-${n}`));
          links.appendChild(lnk);
        }
        card.appendChild(links);
        body.appendChild(card);
      }
    } else {
      // Plan tabs
      const ptabs = document.createElement('div');
      ptabs.className = 'plan-tabs';
      for (const nivel of ['Iniciante','Intermediário','Avançado']) {
        const btn = document.createElement('button');
        btn.className = `plan-tab${activePlan === nivel ? ' active' : ''}`;
        btn.textContent = nivel;
        btn.addEventListener('click', () => { activePlan = nivel; renderTabContent(); });
        ptabs.appendChild(btn);
      }
      body.appendChild(ptabs);

      const days = PLANO_SEMANAL[activePlan];
      for (const day of days) {
        const card = document.createElement('div');
        card.className = 'day-card';
        const dh = document.createElement('div');
        dh.className = 'day-header';
        dh.textContent = day.dia;
        card.appendChild(dh);
        const exRow = document.createElement('div');
        exRow.className = 'day-exercises';
        for (const num of day.nums) {
          const ex = EX.find(e => e.numero === num);
          if (!ex) continue;
          const chip = document.createElement('div');
          chip.className = 'day-ex-chip';
          chip.innerHTML = `<div class="dex-code">${ex.codigo}</div><div class="dex-nome">${ex.nome}</div>`;
          chip.addEventListener('click', () => go(`ex-${num}`));
          exRow.appendChild(chip);
        }
        card.appendChild(exRow);
        body.appendChild(card);
      }
    }
  }

  tabs.addEventListener('click', ev => {
    const t = ev.target.dataset.t;
    if (!t) return;
    activeTab = t;
    tabs.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.t === t));
    renderTabContent();
  });

  renderTabContent();
  frag.appendChild(page);
  return frag;
}

<strong>NIV</strong> = Nível (<span style="color:var(--c-ini)">INI</span> Iniciante · <span style="color:var(--c-int)">INT</span> Intermediário · <span style="color:var(--c-ava)">AVA</span> Avançado)<br>

/* ===== RENDER ===== */
function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function updateNavBadge() {
  const item = document.querySelector('.nav-item[data-route="favoritos"]');
  if (!item) return;
  let b = item.querySelector('.nav-badge');
  if (!favorites.size) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('span'); b.className = 'nav-badge'; item.appendChild(b); }
  b.textContent = favorites.size;
}
function updateNav(route) {
  const map = { home: 'home', secao: 'home', ex: 'home', buscar: 'buscar', aulas: 'aulas', favoritos: 'favoritos', 'como-usar': 'como-usar' };
  const active = map[route.name] || route.name;
  updateNavBadge();
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.route === active);
  });
}

function render() {
  const route = getRoute();
  const main = document.getElementById('main');
  main.innerHTML = '';

  let frag;
  if (route.name === 'home') frag = renderHome();
  else if (route.name === 'secao') frag = renderSecao(route.n);
  else if (route.name === 'ex') frag = renderEx(route.num);
  else if (route.name === 'buscar') frag = renderBuscar();
  else if (route.name === 'favoritos') frag = renderFavoritos();
  else if (route.name === 'aulas') frag = renderAulas();
  else if (route.name === 'como-usar') frag = renderComoUsar();
  else frag = renderHome();

  main.appendChild(frag);
  updateNav(route);
  window.scrollTo(0, 0);
}

function renderPage() { render(); }

/* ===== INIT ===== */
window.addEventListener('hashchange', render);
document.querySelector('.bottom-nav').addEventListener('click', ev => {
  const btn = ev.target.closest('[data-route]');
  if (btn) go(btn.dataset.route);
});
render();
</script>
