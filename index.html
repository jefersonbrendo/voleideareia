f3ria da bola. Varia\u00e7\u00f5es","variacaoFacil":"L1 faz um autoteste lan\u00e7ando a bola para si mesmo e dando um toque vertical de 3 metros de altura sem giro antes de passar para J2.","variacaoDificil":"J2 lan\u00e7a a bola j\u00e1 girando muito no ar (simulando um passe com efeito), e L1 precisa 'matar o giro' com um toque limpo e sim\u00e9trico.","paraTurma":"Em turmas de 4 a 12 alunos, forme trios: dois alunos trocam levantamentos de toque a 3,5m e o terceiro aluno fica de lado a 2m atuando como \u00e1rbitro oficial de praia (rodando a fun\u00e7\u00e3o de \u00e1rbitro a cada 8 bolas).","meta":"Conseguir 8 de 10 toques validados pelo parceiro como 100% limpos (sem giro e sem condu\u00e7\u00e3o).","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, L1 e J2 posicionados em 2 cones afastados 3,5m a 2m da rede. Seta de bola 1 (lan\u00e7amento de J2 para L1) e seta de bola 2 (toque limpo sem rota\u00e7\u00e3o de L1 para J2).","codigo":"LTO-INI-092"},{"numero":93,"secao":6,"nome":"Levantamento de toque de frente na zona ideal","nivel":"Iniciante","jogadores":"2 jogadores (1 passador/atacante A1 e 1 levantador L1)","tempo":"8 minutos","material":"4 bolas, 2 cones e 1 zona alvo ALVO 1,5m L1 A1 1 2 Toque de frente a 1,5m da rede com 3,5m\u20134m de altura Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 no cone a 5m da rede passa a bola (seta 1) para L1 no cone central a 1,5m da rede. L1 executa o levantamento de toque frontal (seta 2) caindo na Zona Alvo (1,5x1,5m) a 1,5m da","objetivo":"Calibrar a altura (3,5m a 4m) e a dist\u00e2ncia da rede (1,5m) no levantamento de toque frontal para o parceiro.","comoMontar":"Na meia-quadra esquerda, posicione L1 no cone central a 1,5 metro da rede. A1 fica no cone a 5 metros da rede na entrada esquerda. Demarque uma Zona Alvo de 1,5x1,5m na entrada da rede (a 1,5m da fita e 1,5m da linha lateral).","passoAPasso":["A1 faz um passe controlado de manchete dos 5 metros em dire\u00e7\u00e3o a L1 no centro da rede.","L1 enquadra os p\u00e9s e os ombros de frente para a Zona Alvo antes que a bola des\u00e7a.","Com a testa embaixo da bola, L1 flexiona levemente os joelhos na areia e estende pernas, cotovelos e punhos simultaneamente em um \u00e2ngulo de 70 graus.","A bola faz uma par\u00e1bola limpa de 3,5 a 4 metros de altura e cai dentro da Zona Alvo a 1,5 metro da rede.","Ap\u00f3s 8 bolas na entrada esquerda, invertem o lado treinando para a sa\u00edda direita; depois trocam de fun\u00e7\u00e3o."],"pontosAtencao":["A dire\u00e7\u00e3o do toque \u00e9 dada pelo alinhamento da sua testa, do seu umbigo e da ponta dos seus p\u00e9s: aponte tudo para a Zona Alvo.","Na areia fofa, se voc\u00ea usar apenas a for\u00e7a dos dedos para levantar uma bola a 3,5 metros de dist\u00e2ncia, voc\u00ea acaba 'empurrando/conduzindo' a bola: use o impulso dos joelhos para a bola sair r\u00e1pida e limpa da m\u00e3o!","Mantenha a bola a 1,5 metro da rede para dar vis\u00e3o ampla ao atacante."],"erroComum":"Receber a bola atr\u00e1s da linha da cabe\u00e7a e tentar empurr\u00e1-la para frente com o pesco\u00e7o torto (condu\u00e7\u00e3o clara); corrija dando meio passo para tr\u00e1s para atacar a bola de baixo para frente. Varia\u00e7\u00f5es","variacaoFacil":"A1 lan\u00e7a a bola com as duas m\u00e3os para garantir que ela chegue exatamente na testa de L1.","variacaoDificil":"A1 avan\u00e7a ap\u00f3s o passe e salta dentro da Zona Alvo para pegar a bola no ponto mais alto.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 1 levantador no centro e duas filas (entrada esquerda e sa\u00edda direita). O levantador levanta de toque alternando esquerda e direita e troca a cada 10 bolas.","meta":"Colocar 8 de 10 levantamentos de toque limpos dentro da Zona Alvo a 1,5m da rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 no cone a 5m da rede passa a bola (seta 1) para L1 no cone central a 1,5m da rede. L1 executa o levantamento de toque frontal (seta 2) caindo na Zona Alvo (1,5x1,5m) a 1,5m da rede na entrada esquerda.","codigo":"LTO-INI-093"},{"numero":94,"secao":6,"nome":"Deslocamento para frente e parada equilibrada antes do toque","nivel":"Iniciante","jogadores":"2 jogadores","tempo":"9 minutos","material":"4 bolas, 2 cones e 1 zona alvo ALVO 1,5m L1 A1 1 1 2 Parada total dos 2 p\u00e9s no cone central antes do toque","objetivo":"Eliminar o h\u00e1bito de tocar na bola ainda correndo na areia, aprendendo a chegar antes, cravar os dois p\u00e9s e s\u00f3 ent\u00e3o levantar de toque.","comoMontar":"Na meia-quadra esquerda, coloque 1 cone de sa\u00edda para L1 a 5 metros da rede (lado direito) e 1 cone de levantamento a 1,5 metro da rede no centro. A1 fica a 5,5m da rede na esquerda. Zona Alvo na entrada esquerda a 1,5m da rede.","passoAPasso":["L1 come\u00e7a no fundo (5m da rede) ao lado de A1.","Quando A1 passa a bola alta para o cone de 1,5m da rede, L1 dispara em velocidade pela areia fofa.","Regra t\u00e9cnica inegoci\u00e1vel: L1 precisa chegar no cone de 1,5m ANTES da bola descer, cravar os dois p\u00e9s na areia ('um-dois' de frenagem) j\u00e1 virado para a Zona Alvo e fazer uma pausa vis\u00edvel de equil\u00edbrio.","Com o corpo 100% est\u00e1tico na areia, L1 executa o toque de dedos limpo para a Zona Alvo.","Se L1 ainda estiver dando passo ou caindo para frente na hora do toque, o ponto \u00e9 anulado; trocam a cada 8 bolas."],"pontosAtencao":["90% das faltas de toque no v\u00f4lei de praia acontecem porque o jogador tenta tocar de dedos enquanto ainda est\u00e1 correndo ou deslizando na areia.","Corra forte nos primeiros 3 metros com os bra\u00e7os livres e suba as m\u00e3os para a testa apenas quando plantar os dois p\u00e9s no ch\u00e3o.","Plante o p\u00e9 direito ligeiramente \u00e0 frente (p\u00e9 da rede) para travar a corrida e proteger a fita."],"erroComum":"Correr devagar olhando para a bola no c\u00e9u e chegar no \u00faltimo instante se jogando embaixo dela; corrija pedindo para olhar primeiro para o cone de destino, correr r\u00e1pido e esperar a bola l\u00e1 na frente. Varia\u00e7\u00f5es","variacaoFacil":"L1 sai de 3,5 metros da rede (corrida curta de apenas 2 metros).","variacaoDificil":"A1 avan\u00e7a ap\u00f3s o passe e finaliza a jogada com um ataque controlado por cima da rede.","paraTurma":"Em turmas de 4 a 12 alunos, forme duas filas na linha de 5 metros (fila da esquerda passa, fila da direita corre para frear e levantar de toque). Os colegas da fila gritam 'PAROU!' no momento em que L1 trava os p\u00e9s na areia.","meta":"Realizar 7 de 10 levantamentos de toque ap\u00f3s corrida de 3,5m com parada total dos p\u00e9s e bola na Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 (a 5,5m superior) passa a bola (seta 1) para o cone central a 1,5m da rede. L1 sai do cone a 5m inferior, corre em diagonal (seta tracejada 1), estanca os dois p\u00e9s no cone central e levanta de toque (seta 2) para a Zona Alvo superior a 1,5m da rede.","codigo":"LTO-INI-094"},{"numero":95,"secao":6,"nome":"Deslocamento lateral e giro de ombros para o parceiro","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"4 bolas, 2 cones e 1 zona alvo ALVO 1,5m L1 A1 1 1 2 Giro de 180\u00b0 alinhando ombros para A1 Quadra 16x8m vista de cima. A1 (a 5,5m superior) envia passe deslocado (seta 1) para o cone lateral inferior (a 2m da rede). L1 desloca-se do centro at\u00e9 o cone","objetivo":"Correr lateralmente para buscar um passe deslocado e girar os ombros no \u00faltimo apoio para n\u00e3o levantar de toque com o tronco torto.","comoMontar":"Coloque L1 no centro da rede (a 1,5m da fita) e coloque 1 cone de passe deslocado perto da linha lateral direita (a 2m da rede e 1m da lateral). A1 come\u00e7a na esquerda (a 5,5m da rede). Demarque a Zona Alvo para A1 na entrada esquerda a 1,5m da rede.","passoAPasso":["A1 passa a bola deslocada para o lado direito da quadra (em dire\u00e7\u00e3o ao cone lateral direito).","L1 est\u00e1 no centro e precisa correr 3 metros para a direita (de costas para A1).","Ao se aproximar do cone lateral direito, L1 N\u00c3O toca na bola virado para fora da quadra: no \u00faltimo passo na areia, L1 planta o p\u00e9 direito por fora da bola e gira 180 graus o quadril e os ombros de frente para A1 (na esquerda).","J\u00e1 enquadrado de frente para a Zona Alvo esquerda, L1 executa um levantamento de toque longo atravessando a quadra at\u00e9 a Zona Alvo de A1.","Trocam de fun\u00e7\u00e3o a cada 8 repeti\u00e7\u00f5es."],"pontosAtencao":["Se voc\u00ea tentar levantar de toque com os ombros virados para um lado e empurrar as m\u00e3os para o outro (torcendo os punhos), o \u00e1rbitro de praia vai marcar dois toques na hora!","Na praia, os seus dois ombros e os seus dois quadris precisam apontar como um farol exatamente para onde voc\u00ea vai mandar o toque.","Use bastante impulso das pernas na areia porque a bola vai viajar 5 metros de uma ponta \u00e0 outra."],"erroComum":"Parar de lado e jogar a bola 'de orelha' (puxando as m\u00e3os para o lado da cabe\u00e7a); corrija exigindo que o peito de L1 termine apontado diretamente para a Zona Alvo. Varia\u00e7\u00f5es","variacaoFacil":"Reduzir a dist\u00e2ncia do passe deslocado para apenas 1,5 metro do centro.","variacaoDificil":"A1 alterna sem avisar se quer a bola longa na entrada esquerda ou se vai correr atr\u00e1s de L1 para bater na direita.","paraTurma":"Em turmas de 4 a 12 alunos, 1 levantador trabalha 6 bolas seguidas enquanto a fila de passadores/atacantes envia a bola no cone lateral e corre para pegar o levantamento na Zona Alvo.","meta":"Conseguir 7 de 10 levantamentos longos de toque sem falta de giro ap\u00f3s o deslocamento lateral e rota\u00e7\u00e3o de ombros.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 (a 5,5m superior) envia passe deslocado (seta 1) para o cone lateral inferior (a 2m da rede). L1 desloca-se do centro at\u00e9 o cone inferior (seta tracejada 1), gira 180 graus os ombros de frente para cima e levanta de toque longo (seta 2) para a Zona Alvo superior a 1,5m da rede.","codigo":"LTO-INT-095"},{"numero":96,"secao":6,"nome":"Recuo em diagonal e toque de dentro para fora (a 4 metros da rede)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"4 bolas, 2 cones e 1 zona alvo ALVO 1,5m L1 A1 1 1 2 Recuo at\u00e9 os 4m + Toque em diagonal at\u00e9 a rede (1,5m)","objetivo":"Recuar quando o passe fica no meio da quadra (4m), posicionar a cabe\u00e7a embaixo da bola e empurrar o toque em diagonal at\u00e9 a rede sem conduzir.","comoMontar":"Na meia-quadra esquerda, posicione L1 no cone a 1,5m da rede e coloque um segundo cone a 4 metros da rede no centro. A1 fica a 6m da rede na esquerda. Demarque a Zona Alvo na entrada esquerda a 1,5m da rede.","passoAPasso":["L1 come\u00e7a perto da rede (1,5m); A1 envia uma recep\u00e7\u00e3o alta que fica curta no meio da quadra (no cone de 4 metros da rede).","L1 abre o quadril e recua r\u00e1pido at\u00e9 o cone de 4 metros, ultrapassando meio passo a linha da bola.","Antes do toque, L1 planta o p\u00e9 esquerdo atr\u00e1s e aponta o p\u00e9 direito e os dois ombros em diagonal para a Zona Alvo perto da rede.","Quando a bola chega acima da testa, L1 transfere o peso das pernas de tr\u00e1s para frente e executa um toque limpo e firme que viaja dos 4 metros at\u00e9 cair a 1,5 metro da rede na Zona Alvo.","Trocam de fun\u00e7\u00e3o a cada 8 bolas."],"pontosAtencao":["Para mandar um toque dos 4 metros at\u00e9 a rede sem 'carregar' a bola nas m\u00e3os, o segredo \u00e9 transferir o peso do corpo do p\u00e9 de tr\u00e1s para o p\u00e9 da frente no momento exato do contato.","N\u00e3o deixe a bola cair atr\u00e1s da sua testa durante o recuo: voc\u00ea precisa recuar MAIS R\u00c1PIDO que a bola para atac\u00e1-la de tr\u00e1s para frente.","Mantenha o arco alto para que o atacante consiga ajustar o tempo da bola que vem de tr\u00e1s."],"erroComum":"Tocar na bola ainda andando de costas com o peso nos calcanhares, fazendo a bola subir frouxa ou ser conduzida; corrija exigindo que ap\u00f3s o toque L1 d\u00ea 1 passo para FRENTE na dire\u00e7\u00e3o da Zona Alvo. Varia\u00e7\u00f5es","variacaoFacil":"Posicionar o cone de recuo a 3 metros da rede.","variacaoDificil":"A1 ataca a bola levantada dos 4 metros mirando nos cantos da quadra advers\u00e1ria.","paraTurma":"Em turmas de 4 a 12 alunos, divida em dois trios por meia-quadra (1 passa, 1 recua para levantar de toque dos 4m e 1 recebe na Zona Alvo), rodando a cada 5 repeti\u00e7\u00f5es.","meta":"Colocar 7 de 10 levantamentos de toque saindo dos 4m dentro da Zona Alvo a 1,5m da rede sem cometer condu\u00e7\u00e3o.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, L1 come\u00e7a no cone a 1,5m da rede. A1 (a 6m) envia passe no meio da quadra (seta 1) no cone a 4m da rede. L1 recua at\u00e9 os 4m (seta tracejada 1), enquadra os ombros em diagonal e levanta de toque (seta 2) at\u00e9 a Zona Alvo a 1,5m da rede.","codigo":"LTO-INT-096"},{"numero":97,"secao":6,"nome":"Levantamento de toque de costas (invers\u00e3o de jogo)","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (ou 2 jogadores com troca de corredor do atacante)","tempo":"10 minutos","material":"4 bolas, 2 cones e 2 zonas alvo ZONA 1 (FRENTE) ZONA 2 (COSTAS) L1 A1 1 1 2 Toque de costas limpo acima da testa Quadra 16x8m vista de cima. Na meia-quadra esquerda, L1 no centro a 1,5m da","objetivo":"Executar o toque de costas limpo acima da testa para inverter o lado do ataque ou alimentar o parceiro que trocou de corredor.","comoMontar":"Na meia-quadra esquerda, posicione L1 no centro a 1,5m da rede olhando para a entrada esquerda (Zona Alvo 1). Atr\u00e1s das costas de L1, marque a Zona Alvo 2 na sa\u00edda direita (a 1,5m da rede). A1 come\u00e7a no meio- fundo (a 5,5m da rede).","passoAPasso":["A1 passa a bola alta para L1 no centro da rede e imediatamente corre para atacar na sa\u00edda direita (atr\u00e1s das costas de L1).","L1 mant\u00e9m o corpo alinhado olhando para a Zona Alvo 1 (esquerda), mas deixa a bola entrar 5 cent\u00edmetros mais para tr\u00e1s (exatamente acima do topo da testa/cabelo).","No contato, L1 empurra a areia com as pernas, projeta levemente o quadril \u00e0 frente, arqueia o alto das costas e estende os bra\u00e7os para cima e para tr\u00e1s, virando os polegares para tr\u00e1s.","A bola sai limpa e sem giro por cima da cabe\u00e7a de L1, caindo dentro da Zona Alvo 2 para A1.","Para treinar o disfarce t\u00e1tico, A1 varia a chamada: se gritar 'FRENTE!', corre para a Zona 1; se gritar 'BOLA DE COSTAS!', corre para a Zona 2."],"pontosAtencao":["No toque de costas na praia, a arbitragem observa muito se as duas m\u00e3os saem juntas: n\u00e3o jogue um ombro mais alto que o outro; suba os dois bra\u00e7os sim\u00e9tricos.","Se a bola n\u00e3o estiver 100% em cima da sua cabe\u00e7a (se ela tiver ficado longe \u00e0 sua frente), N\u00c3O tente puxar de toque para tr\u00e1s porque \u00e9 condu\u00e7\u00e3o certa \u2014 nesse caso, levante para frente ou use a manchete.","Congele os bra\u00e7os estendidos para o alto/tr\u00e1s no final do movimento."],"erroComum":"Jogar o pesco\u00e7o e a cabe\u00e7a violentamente para tr\u00e1s antes de tocar na bola, perdendo a refer\u00eancia; corrija mantendo o olhar na bola debaixo dela e acompanhando apenas com os olhos. Varia\u00e7\u00f5es","variacaoFacil":"Trabalhar apenas o toque de costas parado com bolas lan\u00e7adas na m\u00e3o de L1.","variacaoDificil":"Adicionar 1 defensor do outro lado da rede que tenta adivinhar se L1 vai levantar de frente ou de costas.","paraTurma":"Em turmas de 4 a 12 alunos, forme trios na rede (J1 na Zona 1, L1 no meio, J2 na Zona 2). J1 passa para L1 levantar de costas para J2; na sequ\u00eancia J2 passa para L1 levantar de costas para J1.","meta":"Acertar 7 de 10 levantamentos de toque de costas limpos (sem giro da bola) dentro da Zona Alvo 2.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, L1 no centro a 1,5m da rede olhando para a Zona Alvo 1 (superior). A1 (a 5,5m) passa a bola (seta 1) para L1 e corre para a direita (seta tracejada 1). L1 executa o toque de costas (seta 2) colocando a bola na Zona Alvo 2 (inferior) a 1,5m da rede.","codigo":"LTO-INT-097"},{"numero":98,"secao":6,"nome":"Decis\u00e3o r\u00e1pida no ar: toque ou manchete?","nivel":"Intermedi\u00e1rio","jogadores":"2 ou 3 jogadores (1 lan\u00e7ador/passador variando a bola, 1 levantador e 1 atacante)","tempo":"10 minutos","material":"6 bolas, 2 cones e 1 zona alvo ALVO 1,5m L1 A1 1a 1b 1 2 1a (Alta/Limpa) = Toque | 1b (Baixa/R\u00e1pida) = Manchete","objetivo":"Desenvolver o filtro mental instant\u00e2neo para usar o toque apenas nas bolas favor\u00e1veis e abortar para a manchete nas bolas baixas, r\u00e1pidas ou sujas.","comoMontar":"Na meia-quadra esquerda, L1 come\u00e7a a 3 metros da rede no lado direito. A1 (ou o treinador) fica a 5,5m da rede na esquerda com um cesto de bolas. Zona Alvo na entrada esquerda a 1,5m da rede.","passoAPasso":["Regra de Ouro do Levantador de Praia: voc\u00ea NUNCA decide que vai levantar de toque antes de ver como o passe saiu do bra\u00e7o do seu parceiro!","A1 envia bolas variadas para o centro da quadra misturando dois tipos de passe sem avisar:","Tipo A ('Bola Limpa'): passe alto, com pouco giro e onde L1 consegue parar os dois p\u00e9s com a testa embaixo da bola -> L1 \u00e9 OBRIGADO a levantar de TOQUE.","Tipo B ('Bola Armadilha'): passe baixo na linha do peito, passe r\u00e1pido chutado, bola girando muito no vento ou bola que obriga L1 a tocar nela ainda correndo -> L1 \u00e9 OBRIGADO a abortar as m\u00e3os altas e levantar de MANCHETE.","Sistema de pontua\u00e7\u00e3o: acertar a escolha t\u00e9cnica + colocar na Zona Alvo = +1 ponto; tentar dar toque numa 'Bola Armadilha' e cometer falta = -2 pontos!"],"pontosAtencao":["Essa tomada de decis\u00e3o evita 95% dos pontos perdidos de gra\u00e7a por infra\u00e7\u00e3o de toque em torneios de v\u00f4lei de praia.","Corra para a bola com as m\u00e3os na altura do peito (prontas tanto para subir para a testa no toque quanto para fechar os antebra\u00e7os na manchete).","Se voc\u00ea chegou atrasado e um dos p\u00e9s ainda est\u00e1 no ar, feche a manchete sem hesitar."],"erroComum":"Teimosia t\u00e9cnica: j\u00e1 correr com as m\u00e3os na testa querendo dar toque de qualquer jeito e tentar pegar de dedos uma bola na altura do queixo; corrija gritando 'ABORTA!' quando o passe sair baixo. Varia\u00e7\u00f5es","variacaoFacil":"A1 grita 'ALTA!' ou 'BAIXA!' no momento em que solta a bola para ajudar na velocidade de rea\u00e7\u00e3o inicial.","variacaoDificil":"A1 faz a recep\u00e7\u00e3o real de saques dif\u00edceis vindos do outro lado da rede, gerando passes imprevis\u00edveis reais para L1 decidir.","paraTurma":"Em turmas de 4 a 12 alunos, o professor controla o envio das bolas variadas (ora altas, ora tensas/girando) para uma fila de levantadores que precisam tomar a decis\u00e3o correta em fra\u00e7\u00e3o de segundo.","meta":"Tomar a decis\u00e3o correta em 9 de 10 bolas, colocando pelo menos 7 na Zona Alvo com zero faltas de toque.","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 (a 5,5m) envia dois tipos de passe para o centro: Seta 1a (alta e limpa) ou Seta 1b (baixa/r\u00e1pida). L1 avan\u00e7a dos 3m at\u00e9 o centro (seta tracejada 1), decide entre Toque ou Manchete no \u00faltimo segundo e coloca a bola (seta 2) na Zona Alvo a 1,5m da rede.","codigo":"LTO-INT-098"},{"numero":99,"secao":6,"nome":"Toque de dedos com vento contra e vento a favor","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"10 minutos","material":"5 bolas, 2 cones e 2 zonas alvo ZONA 1 (CONTRA) ZONA 2 (FAVOR) L1A1 1 2 3 2: Toque firme e mais baixo 3: Toque curto e suave Quadra 16x8m vista de cima com setas de Vento soprando da Zona 1 para a Zona","objetivo":"Ajustar o tempo de espera da bola e a firmeza da extens\u00e3o dos dedos quando o vento sopra contra ou a favor do levantamento.","comoMontar":"Identifique a dire\u00e7\u00e3o do vento na quadra. Posicione L1 no centro da rede (1,5m) e marque a Zona Alvo 1 (lado para onde o vento sopra CONTRA o levantamento) e a Zona Alvo 2 (lado para onde o vento sopra A FAVOR do levantamento).","passoAPasso":["Detalhe t\u00e9cnico vital: o vento afeta a bola ANTES mesmo de ela tocar na sua m\u00e3o (na descida do passe) e DEPOIS que ela sai da sua m\u00e3o.","Nos primeiros 6 levantamentos (para a Zona 1 - CONTRA o vento): L1 espera um milissegundo a mais porque o vento empurra a bola que est\u00e1 caindo em cima dele, e executa um toque mais firme, r\u00e1pido e com arco mais baixo (3 metros) para furar o vento.","Nos 6 levantamentos seguintes (para a Zona 2 - A FAVOR do vento): L1 d\u00e1 meio passo para frente buscando a bola e faz um toque curto e suave para o alto, deixando o vento carregar a bola at\u00e9 a Zona Alvo 2.","Durante todo o exerc\u00edcio, L1 mant\u00e9m os p\u00e9s 100% plantados na areia para n\u00e3o deixar o vento causar um contato assim\u00e9trico nas m\u00e3os.","Trocam de fun\u00e7\u00e3o ap\u00f3s as 12 bolas."],"pontosAtencao":["O maior perigo do toque em dia de vento \u00e9 a bola mudar de lugar nos \u00faltimos 20 cent\u00edmetros antes de tocar nos seus dedos, fazendo ela pegar s\u00f3 em uma m\u00e3o (dois toques): olhe fixamente para a bola at\u00e9 ela encaixar nos 10 dedos.","Com vento forte contra, empurre mais com as pernas na areia para n\u00e3o ser tentado a 'conduzir' a bola com os bra\u00e7os.","Deixe os dedos um pouco mais firmes (tens\u00e3o muscular) nos dias de vento."],"erroComum":"Relaxar demais os dedos no vento e a bola bater torta no polegar fazendo barulho e girando; corrija pedindo uma moldura mais compacta e firme acima da testa. Varia\u00e7\u00f5es","variacaoFacil":"Treinar apenas o toque curto a 2 metros de dist\u00e2ncia do parceiro para sentir o efeito do vento na bola.","variacaoDificil":"A1 ataca todas as bolas levantadas, avaliando se o levantamento n\u00e3o fugiu da antena com o vento.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 levantadores (um em cada meia-quadra) levantando simultaneamente para os dois lados do vento com filas de passadores/atacantes.","meta":"Colocar 7 de 10 levantamentos de toque limpos nas Zonas Alvo (somando contra e a favor do vento).","descricaoDiagrama":"Quadra 16x8m vista de cima com setas de Vento soprando da Zona 1 para a Zona 2. A1 passa a bola (seta 1) para L1 no centro. L1 executa toque firme e mais baixo contra o vento para a Zona Alvo 1 (seta 2) ou toque curto e alto a favor do vento para a Zona Alvo 2 (seta 3).","codigo":"LTO-INT-099"},{"numero":100,"secao":6,"nome":"Toque com vento lateral (segurando a bola dentro da quadra)","nivel":"Avan\u00e7ado","jogadores":"2 ou 3 jogadores","tempo":"10 minutos","material":"5 bolas, 3 cones e 1 zona alvo ALVO 1,5m L1 A1 1 1 2 Mira nos 2,5m (cone) para o vento entregar nos 1,5m Quadra 16x8m vista de cima com setas de Vento soprando do fundo para a rede.","objetivo":"Compensar o vento que sopra das costas do levantador para a rede (ou da rede para a quadra), mantendo o toque na dist\u00e2ncia perfeita da fita.","comoMontar":"Escolha o lado da quadra onde o vento sopra da linha de fundo em dire\u00e7\u00e3o \u00e0 rede (vento pelas costas) ou da rede para o fundo. L1 no centro (a 2m da rede), A1 na entrada (5,5m) e Zona Alvo a 1,5m da rede.","passoAPasso":["Quando o vento sopra das costas da dupla em dire\u00e7\u00e3o \u00e0 rede, qualquer levantamento de toque normal \u00e9 empurrado pelo vento para cima da fita ou para a m\u00e3o do bloqueador advers\u00e1rio.","A1 passa a bola para o centro; L1 se posiciona virado em diagonal (apontando o ombro direito levemente para DENTRO da pr\u00f3pria quadra, aos 2,5m da rede, e n\u00e3o para a fita).","L1 executa o toque limpo mirando a 2,5 metros da rede: enquanto a bola sobe e desce, o vento a empurra 1 metro para frente e ela cai exatamente na Zona Alvo aos 1,5m da rede.","Em seguida, trocam de lado na quadra (agora o vento sopra da rede para o fundo): L1 mira o toque mais perto da fita (a 80 cm) para que o vento a traga para os 1,5m ideais.","A1 faz a aproxima\u00e7\u00e3o e salta para pegar ou atacar a bola no ponto ajustado."],"pontosAtencao":["O segredo da compensa\u00e7\u00e3o de vento no toque de praia \u00e9: NUNCA entorte os punhos para compensar o vento!","Gire os seus P\u00c9S e os seus OMBROS para o ponto compensado e fa\u00e7a o toque reto na dire\u00e7\u00e3o do seu peito.","Se voc\u00ea tentar jogar a bola para tr\u00e1s/lado s\u00f3 mexendo a munheca, o \u00e1rbitro apita condu\u00e7\u00e3o.","Comunique com o atacante: 'T\u00f4 segurando ela pra dentro por causa do vento!'."],"erroComum":"Mirar direto na Zona Alvo ignorando o vento de costas e jogar a bola para o outro lado da rede; corrija colocando um cone de 'mira de p\u00e9s' a 2,5m da rede para L1 apontar o corpo. Varia\u00e7\u00f5es","variacaoFacil":"Manter a dupla no mesmo lado da quadra por 8 bolas seguidas at\u00e9 calibrar o \u00e2ngulo dos p\u00e9s.","variacaoDificil":"Trocar de lado da quadra a cada 3 bolas com ataque real contra bloqueio.","paraTurma":"Em turmas de 4 a 12 alunos, monte uma esta\u00e7\u00e3o no lado esquerdo e outra no lado direito da rede: as duplas treinam 4 bolas com vento pelas costas e 4 bolas com vento de frente na rede.","meta":"Acertar 7 de 10 levantamentos de toque dentro da Zona Alvo (1,5m) usando o alinhamento compensado dos p\u00e9s.","descricaoDiagrama":"Quadra 16x8m vista de cima com setas de Vento soprando do fundo para a rede. A1 passa a bola (seta 1) para L1 no centro. L1 aponta os p\u00e9s e o toque para o cone de mira a 2,5m da rede (seta tracejada de mira) e o vento curva a trajet\u00f3ria da bola (seta 2) at\u00e9 cair exatamente na Zona Alvo a 1,5m da rede.","codigo":"LTO-AVA-100"},{"numero":101,"secao":6,"nome":"Bola de segunda de toque limpa no fundo da quadra","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (A1 passador, L1 levantador e D1 defensor advers\u00e1rio)","tempo":"10 minutos","material":"5 bolas, 2 cones e 2 zonas alvo no fundo advers\u00e1rio L1 A1 D1 1 1 2a","objetivo":"Usar a finta de levantamento de toque para enviar a bola de segunda nos cantos do fundo advers\u00e1rio cumprindo a regra da trajet\u00f3ria perpendicular aos ombros.","comoMontar":"Na meia-quadra esquerda, A1 a 5,5m da rede e L1 pr\u00f3ximo \u00e0 rede (a 1,5m). Na meia-quadra direita, D1 posiciona-se no meio e h\u00e1 duas Zonas Alvo nos dois cantos da linha de fundo (a 7,5m da rede).","passoAPasso":["Aten\u00e7\u00e3o m\u00e1xima \u00e0 Regra do V\u00f4lei de Praia para Bola de Segunda de Toque: voc\u00ea S\u00d3 pode passar a bola para o outro lado de toque se o toque n\u00e3o for conduzido/girado E se a trajet\u00f3ria da bola for PERPENDICULAR \u00e0 linha dos seus ombros (direto para frente ou direto para tr\u00e1s de voc\u00ea), a menos que voc\u00ea esteja tentando levantar para o seu parceiro!","A1 faz uma recep\u00e7\u00e3o alta que chega perto da rede (a 1m ou 1,5m da fita).","Para passar a bola de segunda dentro da regra, L1 tem duas t\u00e9cnicas leg\u00edtimas que vai alternar:","T\u00e9cnica 1 (Giro de \u00faltima hora): L1 entra embaixo da bola, gira os p\u00e9s e os dois ombros de frente para o canto do fundo advers\u00e1rio no \u00faltimo instante e executa um toque alto e limpo reto \u00e0 sua frente na Zona Alvo do fundo.","T\u00e9cnica 2 (Toque de costas / em dire\u00e7\u00e3o ao parceiro com vento): L1 fica de costas para o canto fundo advers\u00e1rio (de frente para A1) e d\u00e1 um toque de costas limpo e alto que passa por cima do bloqueio e cai na Zona Alvo de fundo."],"pontosAtencao":["O que \u00e9 FALTA na bola de segunda de toque na praia?","Ficar de frente para a linha lateral (como se fosse levantar para o parceiro) e entortar as m\u00e3os de lado jogando a bola para o outro lado da rede \u2014 isso \u00e9 falta imediata!","Se quiser passar de toque para o outro lado, vire os dois ombros de frente (ou de costas) para o alvo advers\u00e1rio e fa\u00e7a um toque alto de trajet\u00f3ria de levantamento.","Se n\u00e3o der tempo de virar os ombros, use o 'poke' (n\u00f3 dos dedos) ou uma cortada de m\u00e3o aberta!"],"erroComum":"Virar apenas o pesco\u00e7o e o punho jogando a bola de lado por cima da rede (infra\u00e7\u00e3o cl\u00e1ssica de quem vem do v\u00f4lei de quadra); corrija exigindo que o peito ou as costas de L1 apontem 100% para a Zona Alvo no fundo. Varia\u00e7\u00f5es","variacaoFacil":"Treinar primeiro apenas a T\u00e9cnica 1 (enquadrar o peito para o canto de fundo advers\u00e1rio e tocar alto l\u00e1 atr\u00e1s).","variacaoDificil":"D1 no outro lado tenta ler os ombros de L1: se D1 recuar cedo, L1 levanta normal para A1 atacar; se D1 ficar parado ou correr para bloquear A1, L1 passa de segunda no fundo.","paraTurma":"Em turmas de 4 a 12 alunos, coloque uma dupla defendendo no lado direito enquanto as duplas do lado esquerdo t\u00eam 4 bolas para misturar levantamentos reais com bolas de segunda de toque leg\u00edtimas.","meta":"Acertar 6 de 10 bolas de segunda de toque nos cantos de fundo com 100% de aprova\u00e7\u00e3o na regra (ombros alinhados e toque limpo).","descricaoDiagrama":"Quadra 16x8m vista de cima. A1 passa a bola (seta 1) para L1 junto \u00e0 rede. L1 alinha a linha dos ombros perpendicularmente ao alvo (seta curva 1) e envia a bola de segunda de toque limpo (setas 2a e 2b) para as Zonas Alvo nos dois cantos de fundo da quadra direita (7,5m), fugindo de D1.","codigo":"LTO-AVA-101"},{"numero":102,"secao":6,"nome":"Sequ\u00eancia completa: recep\u00e7\u00e3o, toque de frente e ataque (Side-out 1)","nivel":"Avan\u00e7ado","jogadores":"3 ou 4 jogadores (Dupla A1 + L1 contra Sacador S1 + Bloqueador B1)","tempo":"11 minutos","material":"5 bolas, 2 cones e 2 zonas alvo de ataque TOQUE PARALELA DIAGONAL A1 L1 B1 S1","objetivo":"Executar o side-out completo aproveitando uma recep\u00e7\u00e3o alta para levantar de toque com ritmo acelerado ou bola na antena, vencendo o bloqueio.","comoMontar":"No lado direito: S1 na linha de saque e B1 na rede para bloquear. No lado esquerdo: A1 e L1 a 5,5m da rede. Marque duas Zonas Alvo de Ataque no lado direito (Paralela e Diagonal).","passoAPasso":["S1 saca em dire\u00e7\u00e3o a A1 na meia-quadra esquerda.","A1 faz uma recep\u00e7\u00e3o alta e controlada para o centro da quadra (a 1,5m da rede).","L1 infiltra r\u00e1pido, estanca os dois p\u00e9s na areia embaixo da bola e levanta de toque limpo de frente para A1.","Como o levantamento de toque segura o bloqueador B1 no meio por mais tempo (pois o toque sai mais r\u00e1pido da m\u00e3o do que a manchete), A1 faz a chamada agressiva e ataca na paralela ou diagonal livre.","A cada 6 side-outs (3 passando com A1 e 3 passando com L1), as duplas invertem de lado."],"pontosAtencao":["A grande vantagem de dominar o levantamento de toque no side-out \u00e9 poder levantar uma bola um pouco mais 'esticada' (3 metros de altura) que chega na antena antes de o bloqueador advers\u00e1rio conseguir sair da rede ou fechar o canto.","Mesmo acelerando um pouco a bola, nunca a deixe colada na fita: mantenha a linha de 1,2m a 1,5m da rede.","Se a recep\u00e7\u00e3o de A1 sair ruim ou baixa, L1 aplica o aprendizado do exerc\u00edcio 098 e usa a manchete."],"erroComum":"Tentar acelerar demais o levantamento de toque ('bola chutada de quadra') enquanto o parceiro ainda est\u00e1 preso na areia l\u00e1 nos 5 metros; corrija olhando de relance para o parceiro antes de decidir a altura da bola. Varia\u00e7\u00f5es","variacaoFacil":"S1 saca controlado por cima e B1 apenas marca bloqueio passivo na rede.","variacaoDificil":"L1 varia entre levantar para A1 na ponta ou inverter de toque de costas caso A1 chame a troca de corredor ('Cruza!').","paraTurma":"Em turmas de 4 a 12 alunos, jogue 2x2 de side-out: a dupla receptora recebe 4 saques seguidos tentando virar com levantamento de toque e roda com a fila de espera.","meta":"Converter 7 de 10 side-outs usando levantamento de toque limpo e ataque certeiro nas zonas alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. S1 saca da direita (seta 1) para A1 na esquerda. A1 passa alto no centro (seta 2); L1 infiltra (seta tracejada 1), para os p\u00e9s e levanta de toque de frente (seta 3) para a entrada. A1 avan\u00e7a (seta tracejada 2) e ataca (seta 4) vencendo o bloqueio B1 rumo \u00e0s Zonas Alvo.","codigo":"LTO-AVA-102"},{"numero":103,"secao":6,"nome":"Defesa no fundo, transi\u00e7\u00e3o e levantamento de toque no contra-ataque","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (A1 defensor/atacante, L1 bloqueador/levantador e P/T atacando do outro lado)","tempo":"11 minutos","material":"5 bolas, 2 cones e 1 zona alvo ALVO 1,5m L1 A1 P/T 1 2","objetivo":"Transformar uma boa defesa de fundo em um levantamento de toque de transi\u00e7\u00e3o que coloca o parceiro no ponto alto sobre a rede.","comoMontar":"Na meia-quadra esquerda, L1 come\u00e7a na rede (bloqueando) e A1 come\u00e7a a 6 metros da rede (defendendo). P/T fica do outro lado da rede com bolas. Zona Alvo de levantamento a 1,5m da rede na entrada.","passoAPasso":["L1 salta no bloqueio (ou faz a retirada r\u00e1pida); P/T ataca uma bola firme na diagonal em cima de A1.","A1 amortece a pancada defendendo a bola bem alta (5 metros de altura) para o centro da quadra (entre 2m e 3m da rede).","Como a bola defendida por A1 subiu alta, L1 sai da rede em sprint curto, chega embaixo da bola com tempo de sobra e planta os dois p\u00e9s na areia.","Em vez de usar a manchete comum, L1 aproveita a altura da defesa, arma a moldura acima da testa e entrega um levantamento de toque perfeito na Zona Alvo para A1.","A1 faz a aproxima\u00e7\u00e3o do fundo e crava o contra-ataque na quadra de P/T; rodam a cada 6 bolas."],"pontosAtencao":["Bolas que sobem muito alto na defesa (4 a 6 metros de altura) ganham velocidade na queda: quando usar o toque de dedos nessa bola, flexione os joelhos JUNTOS com a entrada da bola nas m\u00e3os para amortecer sem fazer barulho de tapa!","Dobre levemente os cotovelos e os joelhos de forma el\u00e1stica e j\u00e1 empurre para o alto em um movimento cont\u00ednuo (sem parar a bola l\u00e1 embaixo).","Esse levantamento de toque na transi\u00e7\u00e3o d\u00e1 uma precis\u00e3o absurda para o defensor que vem cansado do fundo."],"erroComum":"Esperar a bola que cai de 6 metros de altura com os bra\u00e7os e dedos duros, fazendo a bola bater e espirrar nos dedos (dois toques); corrija amortecendo com as pernas no instante do contato. Varia\u00e7\u00f5es","variacaoFacil":"P/T lan\u00e7a a bola em arco para A1 defender com tranquilidade no centro.","variacaoDificil":"P/T ataca forte variando diagonal e paralela, e depois tenta defender o contra-ataque de A1.","paraTurma":"Em turmas de 4 a 12 alunos, o professor bate bolas de ataque do lado direito para duplas no lado esquerdo. A dupla precisa defender, levantar de toque limpo e contra-atacar 2 bolas seguidas antes de dar lugar \u00e0 pr\u00f3xima dupla.","meta":"Completar 6 de 10 contra-ataques com levantamento de toque limpo na transi\u00e7\u00e3o ap\u00f3s defesa real.","descricaoDiagrama":"Quadra 16x8m vista de cima. P/T na direita ataca (seta 1) em A1 no fundo esquerdo (6m). A1 defende bem alto para o centro aos 2,5m (seta 2). L1 sai do bloqueio na rede at\u00e9 o centro (seta tracejada 1), amortece nas pernas levantando de toque (seta 3) na Zona Alvo, e A1 avan\u00e7a (seta tracejada 2) finalizando o contra-ataque (seta 4).","codigo":"LTO-AVA-103"},{"numero":104,"secao":6,"nome":"Desafio sob press\u00e3o: Side-out com toque limpo valendo ponto dobrado","nivel":"Avan\u00e7ado","jogadores":"4 jogadores (2 contra 2 em jogo condicionado)","tempo":"12 minutos","material":"5 bolas e 4 cones VALE 2 PTS VALE 2 PTS J1 J2 B1 D1 1","objetivo":"Incentivar o uso confiante e limpo do levantamento de toque em situa\u00e7\u00e3o real de jogo sob press\u00e3o de arbitragem rigorosa.","comoMontar":"Quadra oficial 16x8m pronta para jogo 2x2 entre Dupla A (lado esquerdo) e Dupla B (lado direito).","passoAPasso":["Disputa de um set at\u00e9 15 pontos com regra especial de pontua\u00e7\u00e3o para o levantamento de toque:","Regra 1 (B\u00f4nus de Toque): todo ponto de side-out ou contra-ataque vencido ap\u00f3s um levantamento de TOQUE DE DEDOS 100% limpo vale 2 PONTOS no placar!","Regra 2 (Seguran\u00e7a de Manchete): pontos vencidos com levantamento de manchete valem 1 ponto normal.","Regra 3 (Rigor da Praia): se o jogador tentar levantar de toque (buscando os 2 pontos) e a bola sair girando mais de 1 volta ou for conduzida, a dupla advers\u00e1ria (ou o professor) grita 'SUJA!' e a dupla que cometeu a falta PERDE 1 ponto e entrega o saque.","As duplas precisam equilibrar coragem t\u00e9cnica (entrar r\u00e1pido com as pernas para ganhar 2 pontos no toque) e intelig\u00eancia (usar a manchete quando o passe n\u00e3o permitir o toque)."],"pontosAtencao":["Para ganhar os 2 pontos do toque sob press\u00e3o, o passador/defensor precisa ajudar o parceiro mandando a primeira bola alta no meio da quadra.","O levantador deve gritar cedo 'VOU DE TOQUE!' quando v\u00ea que j\u00e1 est\u00e1 com os dois p\u00e9s plantados embaixo da bola.","N\u00e3o force o toque quando estiver desequilibrado na areia fofa com placar apertado."],"erroComum":"Querer ganhar 2 pontos em todas as bolas e for\u00e7ar o toque em recep\u00e7\u00f5es baixas ou longe do corpo, perdendo pontos por falta; corrija lembrando a regra do exerc\u00edcio 098 ('P\u00e9s parados e bola alta = Toque; correndo ou bola baixa = Manchete'). Varia\u00e7\u00f5es","variacaoFacil":"A falta de toque apenas d\u00e1 1 ponto normal ao advers\u00e1rio sem descontar do placar acumulado.","variacaoDificil":"Nos \u00faltimos 3 pontos do set (a partir do 12\u00ba ponto), a dupla S\u00d3 pode fechar o jogo atrav\u00e9s de um ponto constru\u00eddo com levantamento de toque limpo.","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a o formato 'Rei da Praia do Toque Limpo' em sets curtos at\u00e9 7 pontos: os alunos que est\u00e3o esperando fora da quadra atuam como \u00e1rbitros de cadeira julgando a limpeza de cada toque.","meta":"Conquistar pelo menos 3 ataques de 2 pontos (constru\u00eddos com toque limpo) por set mantendo menos de 2 faltas de toque.","descricaoDiagrama":"Quadra 16x8m vista de cima em jogo 2x2. Dupla B saca da direita (seta 1) e monta bloqueio/defesa. Na esquerda, J1 recepciona alto no centro (seta 2), J2 infiltra plantando os p\u00e9s (seta tracejada 1) para levantar de toque limpo de frente ou de costas (setas 3a/3b), e J1 avan\u00e7a (seta tracejada 2) atacando para valer 2 pontos (seta 4).","codigo":"LTO-AVA-104"},{"numero":105,"secao":7,"nome":"Ritmo de passada de 3 passos e salto vertical na areia fofa","nivel":"Iniciante","jogadores":"2 jogadores (1 atacante A1 e 1 levantador/refer\u00eancia L1)","tempo":"7 minutos","material":"2 bolas, 4 cones e 1 zona alvo de salto SALTO 1,5mA1 L1 1 Chamada de 3 passos (Esq-Dir-Esq) + Salto Vertical a 1,5m Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 sai do cone a 4,5m da rede na entrada superior. Seta tracejada 1 mostra a passada de 3 apoios at\u00e9 a Zona Alvo de Decolagem a 1,5m da rede, onde L1 segura a bola ao lado para o salto vertical.","objetivo":"Automatizar a passada de 3 apoios (esquerda-direita-esquerda para destros) na areia, transformando o avan\u00e7o em salto estritamente vertical sem invadir a rede.","comoMontar":"Na meia-quadra esquerda, posicione 1 cone de sa\u00edda a 4,5 metros da rede (entrada esquerda) e demarque uma Zona de Decolagem com cones a 1,5 metro da rede. L1 fica no centro a 1,5m da rede segurando uma bola no alto.","passoAPasso":["A1 posiciona-se no cone de 4,5 metros com o p\u00e9 direito levemente \u00e0 frente (para atacantes destros; canhotos invertem os p\u00e9s).","Passo 1 (Direcionamento): A1 d\u00e1 um passo curto com o p\u00e9 esquerdo na dire\u00e7\u00e3o da bola.","Passos 2 e 3 (Chamada 'Direita-Esquerda'): A1 acelera os dois \u00faltimos passos quase simult\u00e2neos na areia, levando os dois bra\u00e7os estendidos bem para tr\u00e1s do quadril.","Decolagem: A1 planta os dois p\u00e9s paralelos dentro da Zona de Decolagem (a 1,5m da rede), lan\u00e7a os dois bra\u00e7os com for\u00e7a para cima e salta verticalmente para tocar na bola erguida por L1, caindo no mesmo buraco de onde pulou.","Ap\u00f3s 8 saltos na entrada esquerda, A1 faz 8 saltos na sa\u00edda direita; depois troca com L1."],"pontosAtencao":["Na areia fofa, se voc\u00ea cravar apenas o calcanhar no pen\u00faltimo passo como na quadra dura, o seu p\u00e9 afunda 15 cm e voc\u00ea perde o salto: apoie a planta inteira dos dois p\u00e9s quase juntos na areia.","Os dois bra\u00e7os precisam subir juntos como uma alavanca para tirar o peso do corpo da areia.","Salte para CIMA e n\u00e3o para frente: o ponto de aterrissagem na areia deve ser o mesmo ponto da decolagem."],"erroComum":"Saltar para a frente ('salto em dist\u00e2ncia') e cair quase encostando a barriga na rede; corrija olhando as marcas na areia e exigindo que os p\u00e9s aterrissem dentro da Zona de Decolagem a 1,5m da fita. Varia\u00e7\u00f5es","variacaoFacil":"Desenhar dois c\u00edrculos na areia aos 1,5m da rede onde os dois \u00faltimos p\u00e9s devem pisar antes de subir.","variacaoDificil":"L1 lan\u00e7a a bola para o alto a 1,5m da rede e A1 precisa coordenar o in\u00edcio dos 3 passos com a queda da bola para agarr\u00e1-la no ponto mais alto.","paraTurma":"Em turmas de 4 a 12 alunos, monte 3 corredores de passada ao longo da rede (entrada, meio e sa\u00edda). Os alunos saem em ondas de 3 a cada comando do professor, saltam tocando nas bolas erguidas e voltam pelas laterais.","meta":"Executar 9 de 10 chamadas de 3 passos aterrissando equilibrado exatamente no mesmo ponto da decolagem (a 1,5m da rede).","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 sai do cone a 4,5m da rede na entrada superior. Seta tracejada 1 mostra a passada de 3 apoios at\u00e9 a Zona Alvo de Decolagem a 1,5m da rede, onde L1 segura a bola ao lado para o salto vertical.","codigo":"ATQ-INI-105"},{"numero":106,"secao":7,"nome":"Passada curta e explosiva de 2 passos na areia","nivel":"Iniciante","jogadores":"2 jogadores (A1 atacante e L1 levantador)","tempo":"7 minutos","material":"3 bolas, 2 cones e 1 zona alvo ZONA ALVO A1 L1 1 1 2 Sa\u00edda explosiva a 3m da rede em apenas 2 passos Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 aguarda no cone a 3m","objetivo":"Dominar a chamada curta de apenas 2 passos ('direita-esquerda' para destros), ideal para bolas levantadas perto do atacante ou quando a areia \u00e9 muito fofa.","comoMontar":"Na meia-quadra esquerda, posicione 1 cone de espera mais pr\u00f3ximo da rede (a 3 metros da fita, na entrada esquerda). L1 fica no centro a 1,5m da rede. Zona Alvo de queda da bola no centro da quadra advers\u00e1ria.","passoAPasso":["A1 aguarda no cone de 3 metros da rede em base baixa e viva, esperando a defini\u00e7\u00e3o do levantamento de L1.","L1 lan\u00e7a (ou levanta) a bola a 1,5 metro da rede.","Como A1 esperou at\u00e9 a bola subir, ele usa a passada r\u00e1pida de 2 apoios: d\u00e1 um passo explosivo com o p\u00e9 direito levando os bra\u00e7os para tr\u00e1s e imediatamente fecha o p\u00e9 esquerdo ao lado.","Impulsiona a areia com as duas pernas e os dois bra\u00e7os subindo r\u00e1pido, agarra a bola no topo do salto e a arremessa com as duas m\u00e3os por cima da rede na Zona Alvo advers\u00e1ria.","Realizam 8 repeti\u00e7\u00f5es e invertem as fun\u00e7\u00f5es."],"pontosAtencao":["No v\u00f4lei de praia, a passada de 2 passos \u00e9 muito usada porque voc\u00ea primeiro espera ver onde o vento vai levar o levantamento e s\u00f3 explode no \u00faltimo segundo.","Mesmo sendo apenas 2 passos, o balan\u00e7o duplo dos bra\u00e7os (para tr\u00e1s no 1\u00ba passo e para cima no 2\u00ba) \u00e9 obrigat\u00f3rio para ganhar altura.","Mantenha o peito levemente aberto para o levantador (em diagonal de 45 graus para a rede)."],"erroComum":"Pular de um p\u00e9 s\u00f3 na areia por pressa nos 2 passos; corrija exigindo o som simult\u00e2neo dos dois p\u00e9s empurrando a areia antes da subida. Varia\u00e7\u00f5es","variacaoFacil":"Fazer os 2 passos sem bola, focando no ritmo verbal 'UM- DOIS-SOBE!'.","variacaoDificil":"L1 varia a altura do lan\u00e7amento (ora mais baixo, ora mais alto), exigindo que A1 espere no cone de 3m antes de dar os 2 passos.","paraTurma":"Em turmas de 4 a 12 alunos, posicione duas filas aos 3 metros da rede (esquerda e direita) com dois levantadores no centro. Os alunos entram nos 2 passos, saltam arremessando a bola para o outro lado e buscam a bola seguinte.","meta":"Completar 8 de 10 entradas de 2 passos no tempo exato da bola arremessando do ponto mais alto na Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 aguarda no cone a 3m da rede. L1 no centro (1,5m) lan\u00e7a a bola (seta 1); A1 explode em 2 passos curtos (seta tracejada 1) at\u00e9 os 1,5m da rede e arremessa do alto do salto (seta 2) para a Zona Alvo na quadra direita.","codigo":"ATQ-INI-106"},{"numero":107,"secao":7,"nome":"Mec\u00e2nica do bra\u00e7o ('arco e flecha') e contato alto com autolan\u00e7amento","nivel":"Iniciante","jogadores":"2 jogadores (trabalhando na linha de 3 metros em dire\u00e7\u00e3o ao outro lado)","tempo":"8 minutos","material":"4 bolas, 2 cones e 2 zonas alvo ALVO 1 ALVO 2 J1 J2 1 2","objetivo":"Coordenar a abertura de peito ('arco e flecha'), o ponto de impacto com o bra\u00e7o totalmente estendido e a quebrada de punho na cortada.","comoMontar":"Coloque 2 cones a 2,5 metros da rede na meia-quadra esquerda (um na esquerda para J1 e outro na direita para J2). Na meia-quadra direita, demarque duas Zonas Alvo a 5 metros da rede.","passoAPasso":["J1 e J2 posicionam-se nos cones a 2,5m da rede segurando uma bola cada um.","Ainda com os p\u00e9s na areia (ou com um pequeno salto vertical), lan\u00e7am a bola 1 metro acima e levemente \u00e0 frente do ombro de ataque.","Armam o movimento de 'arco e flecha': a m\u00e3o n\u00e3o dominante aponta para a bola no alto (mira) enquanto o cotovelo do bra\u00e7o de ataque puxa alto para tr\u00e1s da linha da orelha, abrindo o peito.","Giram o tronco e golpeiam a bola no ponto mais alto poss\u00edvel com a palma da m\u00e3o aberta, envolvendo a parte superior da bola com o punho para faz\u00ea-la girar para frente (topspin).","A bola cruza a rede e cai dentro da Zona Alvo advers\u00e1ria; buscam as bolas e repetem 10 vezes."],"pontosAtencao":["Regra fundamental da praia: bater na bola com a m\u00e3o aberta em movimento r\u00e1pido de percuss\u00e3o (cortada) \u00e9 100% legal!","S\u00f3 \u00e9 falta se voc\u00ea empurrar ou conduzir a bola com os dedos moles.","Bata na bola sempre \u00c0 FRENTE do seu ombro de ataque (\u00e0s '11 horas' do rel\u00f3gio), nunca atr\u00e1s da cabe\u00e7a.","A m\u00e3o guia (m\u00e3o esquerda para os destros) puxa para o peito enquanto a m\u00e3o direita sobe para bater."],"erroComum":"Bater na bola com o cotovelo dobrado ('bra\u00e7o de dinossauro'), mandando a bola na rede; corrija pedindo para tentar 'alcan\u00e7ar o c\u00e9u' com o bra\u00e7o esticado no impacto. Varia\u00e7\u00f5es","variacaoFacil":"Executar a batida com os dois p\u00e9s plantados na areia a 3 metros da rede at\u00e9 sentir a m\u00e3o envolver a bola com topspin.","variacaoDificil":"Autolan\u00e7ar a bola mais alta, dar os 2 passos na areia, saltar e bater no topo do salto.","paraTurma":"Em turmas de 4 a 12 alunos, posicione at\u00e9 4 alunos lado a lado na linha de 2,5 metros da quadra esquerda e outros 4 na quadra direita. Um lado bate para o outro ao apito do professor.","meta":"Acertar 8 de 10 cortadas com bra\u00e7o totalmente estendido e rota\u00e7\u00e3o topspin dentro da Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 e J2 posicionados em cones a 2,5m da rede. Fazem autolan\u00e7amento curto (setas 1) e executam a cortada de m\u00e3o aberta com topspin (setas 2) cruzando a rede at\u00e9 as Zonas Alvo a 5m da rede na meia-quadra direita.","codigo":"ATQ-INI-107"},{"numero":108,"secao":7,"nome":"Cortada de m\u00e3o aberta a partir de bola lan\u00e7ada pelo levantador","nivel":"Iniciante","jogadores":"2 jogadores (1 levantador L1 e 1 atacante A1)","tempo":"8 minutos","material":"5 bolas, 2 cones e 1 zona alvo ZONA ALVO 4x4m A1 L1 1 1 2","objetivo":"Sincronizar a chamada de p\u00e9s na areia com a bola que vem da m\u00e3o do parceiro, batendo firme no centro da quadra advers\u00e1ria.","comoMontar":"Na meia-quadra esquerda, L1 fica no centro a 1,5m da rede com o cesto de bolas. A1 come\u00e7a no cone a 4 metros da rede na entrada esquerda. Demarque uma grande Zona Alvo central (4x4m) no meio-fundo da quadra direita.","passoAPasso":["A1 aguarda no cone de 4 metros olhando para L1.","L1 lan\u00e7a a bola com as duas m\u00e3os em arco limpo de 4 metros de altura para cair a 1,5 metro da rede na frente de A1.","Regra de tempo de bola na areia: A1 espera a bola atingir o ponto mais alto do lan\u00e7amento de L1 para s\u00f3 ent\u00e3o acelerar os \u00faltimos dois passos na areia.","A1 salta equilibrado, mant\u00e9m a bola \u00e0 frente do ombro e executa a cortada firme de m\u00e3o aberta mirando o meio da Zona Alvo advers\u00e1ria (passando com margem de 1 metro acima da fita).","Ap\u00f3s 8 ataques de A1, trocam de fun\u00e7\u00e3o."],"pontosAtencao":["Como a areia prende o p\u00e9, os iniciantes costumam sair correndo cedo demais e chegam embaixo da bola antes de ela cair: lembre-se da frase 'Bola no alto, p\u00e9 na areia; bola descendo, eu subo!'.","No v\u00f4lei de praia, n\u00e3o tente cravar a bola nos 2 metros da frente: bata longo mirando nos 5 a 7 metros da quadra advers\u00e1ria.","Aterrisse sobre os dois p\u00e9s semiflexionados sem tocar na rede."],"erroComum":"Passar por baixo da bola (ultrapassar a linha da bola) e ter que bater arqueando as costas para tr\u00e1s, jogando a bola fora; corrija atrasando meio segundo a sa\u00edda do cone de 4m. Varia\u00e7\u00f5es","variacaoFacil":"L1 segura a bola com o bra\u00e7o estendido em cima de um caixote (ou lan\u00e7a bem pr\u00f3ximo) para A1 calibrar o ponto de impacto.","variacaoDificil":"Em vez de L1 lan\u00e7ar direto, A1 primeiro faz um passe de manchete para L1, que levanta de toque ou manchete para o ataque.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 1 levantador/professor lan\u00e7ando no centro e duas filas de atacantes (entrada esquerda e sa\u00edda direita). Dois alunos do outro lado recolhem as bolas na Zona Alvo e rodam a cada 10 ataques.","meta":"Converter 7 de 10 cortadas limpas passando sobre a rede e caindo dentro da Zona Alvo central.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, L1 no centro (1,5m da rede) lan\u00e7a a bola alta (seta 1) para a entrada. A1 sai do cone a 4m da rede (seta tracejada 1), salta a 1,5m da fita e bate a cortada (seta 2) para a Zona Alvo (4x4m) na meia-quadra direita.","codigo":"ATQ-INI-108"},{"numero":109,"secao":7,"nome":"Golpe de n\u00f3 dos dedos ('poke' / coquinho) na zona curta","nivel":"Iniciante","jogadores":"2 jogadores","tempo":"8 minutos","material":"5 bolas, 3 cones e 2 zonas alvo curtas ALVO 1 (CURTA) ALVO 2 (MEIO) A1 L1 1 1 2a 2b Golpe de \"Poke\" (n\u00f3 dos dedos r\u00edgidos) a 1,5m\u20133m","objetivo":"Aprender a largada curta oficial do v\u00f4lei de praia usando as falanges dobradas e r\u00edgidas (poke), sem cometer falta de m\u00e3o aberta.","comoMontar":"L1 no centro da meia-quadra esquerda (a 1,5m da rede) e A1 no cone de ataque a 4m da rede. Na meia- quadra direita, demarque duas Zonas Alvo curtas logo atr\u00e1s da rede (entre 1,5m e 3m da fita): Alvo 1 na paralela curta e Alvo 2 no meio curto.","passoAPasso":["Instru\u00e7\u00e3o t\u00e9cnica na areia: como na praia \u00e9 proibido 'largar' a bola com as pontas dos dedos abertas e moles (como no v\u00f4lei de quadra), usamos o 'POKE' (dobrar os 4 dedos principais ao meio e tocar na bola com os n\u00f3s r\u00edgidos das falanges m\u00e9dias, com o polegar fechado ao lado).","L1 levanta a bola para a entrada esquerda (a 1,5m da rede).","A1 faz a passada normal de ataque e sobe armando o bra\u00e7o alto exatamente como se fosse dar uma cortada forte.","No topo do salto, A1 fecha os dedos em posi\u00e7\u00e3o de 'poke' e d\u00e1 um toque seco e curto de baixo para frente na bola, fazendo-a passar rasante \u00e0 fita e cair morta na Zona Alvo 1 ou 2 (a 2 metros da rede).","Ap\u00f3s 10 repeti\u00e7\u00f5es (5 na paralela curta e 5 no meio curto), invertem os pap\u00e9is."],"pontosAtencao":["O contato do poke precisa ser um 'tec' seco e instant\u00e2neo com os n\u00f3s dos dedos r\u00edgidos: nunca empurre nem acompanhe demais a bola.","Mantenha o cotovelo alto na subida: se voc\u00ea baixar o cotovelo antes de pular, o defensor advers\u00e1rio j\u00e1 sabe que voc\u00ea vai largar curto.","Use o poke tamb\u00e9m para passar bolas que vieram muito coladas na rede sem tocar na fita."],"erroComum":"Tentar fazer a largadinha com a m\u00e3o aberta e dedos separados (falta imediata apitada na praia); corrija mostrando os n\u00f3s dos dedos brancos e firmes antes de cada sa\u00edda. Varia\u00e7\u00f5es","variacaoFacil":"Treinar primeiro 5 pokes sem saltar (apenas na ponta dos p\u00e9s a 1,5m da rede) para sentir o contato seco dos n\u00f3s dos dedos.","variacaoDificil":"Colocar um cone ou obst\u00e1culo alto na frente de A1 simulando as m\u00e3os do bloqueio para ele encobrir de poke por cima do bloqueio.","paraTurma":"Em turmas de 4 a 12 alunos, duas filas de ataque (esquerda e direita) executam o poke curto mirando dentro de aros ou quadrados desenhados na areia a 2 metros da rede advers\u00e1ria.","meta":"Acertar 8 de 10 pokes curtos dentro das Zonas Alvo (1,5m a 3m da rede) com contato 100% r\u00edgido e legal.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na esquerda, L1 levanta (seta 1) para A1 que avan\u00e7a do cone de 4m (seta tracejada 1). No salto a 1,5m da rede, A1 aplica o golpe de 'poke' curto (setas arqueadas 2a e 2b) caindo nas Zonas Alvo 1 e 2 logo ap\u00f3s a rede (1,5m a 3m) na quadra direita.","codigo":"ATQ-INI-109"},{"numero":110,"secao":7,"nome":"Golpe de ponta de dedos r\u00edgidos ('cobra') mirando as linhas","nivel":"Iniciante","jogadores":"2 jogadores","tempo":"8 minutos","material":"5 bolas, 4 cones e 2 zonas alvo nas linhas ALVO 1 (LINHA) ALVO 2 (DIAG) A1 L1 1 1 2a 2b Golpe de \"Cobra\" (5 dedos unidos e duros) nas linhas","objetivo":"Dominar o golpe de 'cobra' (5 dedos unidos e totalmente estendidos e duros) para alcan\u00e7ar bolas altas e coloc\u00e1-las com precis\u00e3o nas linhas.","comoMontar":"L1 no centro da rede esquerda (1,5m) e A1 no cone de aproxima\u00e7\u00e3o (4m). Na meia-quadra direita, marque a Zona Alvo 1 no fundo da linha paralela (a 7m da rede) e a Zona Alvo 2 na lateral diagonal (a 5m da rede).","passoAPasso":["Explica\u00e7\u00e3o t\u00e9cnica: na 'COBRA', voc\u00ea junta os 5 dedos bem colados uns nos outros (como a cabe\u00e7a de uma cobra ou uma faca r\u00edgida) com o punho travado. Isso d\u00e1 10 cm a mais de alcance no alto sem cometer falta!","L1 levanta a bola alta a 1,5m da rede.","A1 faz a chamada de salto, estende o bra\u00e7o ao m\u00e1ximo e toca na bola com as pontas dos dedos rigidamente unidas e duras.","Nos primeiros 5 ataques, A1 empurra a 'cobra' com arco por cima de um bloqueio imagin\u00e1rio at\u00e9 cair na Zona Alvo 1 (fundo da paralela).","Nos 5 ataques seguintes, A1 gira o ombro no ar e aplica a 'cobra' na Zona Alvo 2 (lateral diagonal); depois trocam."],"pontosAtencao":["Os dedos na 'cobra' N\u00c3O podem dobrar nem amortecer a bola no impacto: eles funcionam como uma t\u00e1bua dura batendo na bola.","A grande vantagem da cobra sobre o poke \u00e9 que voc\u00ea alcan\u00e7a a bola 10 cent\u00edmetros mais alto, \u00f3timo para passar por cima do bloqueio.","Termine com os dedos apontando exatamente para o cone do alvo escolhido."],"erroComum":"Deixar os dedos separados ou moles na hora do toque, fazendo a bola afundar na m\u00e3o (falta de largada aberta); corrija pedindo para colar o polegar ao lado do indicador formando um bloco \u00fanico. Varia\u00e7\u00f5es","variacaoFacil":"Mirar em uma \u00fanica zona maior no meio-fundo da quadra advers\u00e1ria.","variacaoDificil":"Alternar obrigatoriamente: 1 ataque de poke curto (exerc\u00edcio 109) e 1 ataque de cobra longo no fundo (exerc\u00edcio 110).","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 alvos nos cantos de fundo e 2 alvos nas laterais do outro lado. Os alunos atacam em fila somando 1 ponto para a turma a cada golpe de cobra limpo que cair dentro das zonas.","meta":"Colocar 7 de 10 golpes de cobra dentro das Zonas Alvo das linhas com dedos unidos e r\u00edgidos.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 levanta (seta 1) para A1 que avan\u00e7a na esquerda (seta tracejada 1). No ponto mais alto, A1 usa o golpe de 'cobra' (dedos r\u00edgidos unidos) enviando a bola para a Zona Alvo 1 no fundo da paralela (seta 2a) ou Zona Alvo 2 na lateral diagonal (seta 2b).","codigo":"ATQ-INI-110"},{"numero":111,"secao":7,"nome":"Cortada potente no corredor da paralela","nivel":"Iniciante","jogadores":"2 ou 3 jogadores (A1 atacante, L1 levantador e 1 coletor)","tempo":"9 minutos","material":"5 bolas, 4 cones e 2 corredores alvo nas paralelas CORREDOR PARALELA 1,5m CORREDOR PARALELA 1,5m A1 L1 1 2 1 3","objetivo":"Aprender a manter a bola \u00e0 frente do ombro de ataque e finalizar com o bra\u00e7o reto para cravar a cortada no corredor lateral de 1,5m.","comoMontar":"Na meia-quadra esquerda, A1 come\u00e7a a 4,5m da rede e a 1m da linha lateral esquerda; L1 no centro a 1,5m da rede. Na meia-quadra direita, demarque um corredor alvo de 1,5m de largura ao longo da linha lateral superior (dos 4m aos 8m de fundo) e outro na linha lateral inferior.","passoAPasso":["A1 passa a bola para L1 e se posiciona aberto pr\u00f3ximo \u00e0 linha lateral esquerda.","L1 levanta a bola alta at\u00e9 1 metro da antena esquerda (a 1,5m da rede).","Para atacar na paralela sem jogar a bola na antena nem para fora, A1 faz a chamada mantendo a bola exatamente em frente ao seu ombro direito (n\u00e3o deixa a bola passar demais para fora).","No ar, A1 aponta a m\u00e3o guia para o corredor reto \u00e0 sua frente e bate de m\u00e3o aberta quebrando o punho reto na linha da coxa, fazendo a bola cair dentro do corredor de 1,5m da paralela.","Ap\u00f3s 6 ataques na paralela esquerda, mudam para a sa\u00edda de rede direita e treinam 6 ataques na paralela direita."],"pontosAtencao":["Na praia, para bater na paralela quando voc\u00ea entra aberto na ponta, voc\u00ea precisa girar levemente o peito no ar de volta para a linha lateral (ou bater por fora da bola).","Olhe com a vis\u00e3o perif\u00e9rica a antena antes de bater: a bola na paralela passa a 50 cm por dentro da antena.","Use bastante topspin (quebrada de munheca) para a bola mergulhar antes da linha de fundo de 8 metros."],"erroComum":"Entrar na diagonal apontando os p\u00e9s para o meio da quadra e tentar bater na paralela s\u00f3 entortando o bra\u00e7o, jogando a bola fora pela lateral; corrija alinhando os dois \u00faltimos passos mais retos em dire\u00e7\u00e3o \u00e0 antena. Varia\u00e7\u00f5es","variacaoFacil":"Alargar o corredor alvo da paralela para 2 metros de largura.","variacaoDificil":"Colocar 1 cone alto em cima da rede a 1,5m da antena (simulando um bloqueio que deixou o corredor da linha aberto) para A1 bater entre o cone e a antena.","paraTurma":"Em turmas de 4 a 12 alunos, monte duas filas (entrada esquerda e sa\u00edda direita) com 1 levantador central. Um aluno bate na paralela esquerda, o seguinte bate na paralela direita, sem cruzar as bolas.","meta":"Acertar 6 de 10 cortadas potentes dentro do corredor de 1,5m da paralela sem tocar na antena.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, A1 passa para L1 (seta 1) e entra pela ponta superior (seta tracejada 1) recebendo o levantamento (seta 2). A1 bate a cortada reta na paralela (seta 3) dentro da Zona Alvo de 1,5m ao longo da linha lateral superior direita (4m a 8m).","codigo":"ATQ-INI-111"},{"numero":112,"secao":7,"nome":"Cortada potente na diagonal longa","nivel":"Iniciante","jogadores":"2 ou 3 jogadores","tempo":"9 minutos","material":"5 bolas, 4 cones e 2 zonas alvo nas diagonais DIAGONAL LONGA DIAGONAL LONGA A1 L1 1 1 2 Aproxima\u00e7\u00e3o em \u00e2ngulo de 45\u00b0 + Pot\u00eancia m\u00e1xima Quadra 16x8m vista de cima. Na esquerda, A1 abre para a lateral superior e entra","objetivo":"Aproveitar o \u00e2ngulo natural da corrida de dentro para fora (ou de fora para dentro) para atacar com for\u00e7a m\u00e1xima na diagonal da quadra.","comoMontar":"Na meia-quadra esquerda, A1 come\u00e7a a 5m da rede e L1 no centro (1,5m). Na meia-quadra direita, demarque uma Zona Alvo de 3x3m na diagonal longa inferior (canto direito do fundo) e outra na diagonal longa superior (para quando atacarem da direita).","passoAPasso":["A1 come\u00e7a a corrida de aproxima\u00e7\u00e3o abrindo 1 passo para fora da linha lateral esquerda para ganhar \u00e2ngulo natural de diagonal.","L1 levanta a bola a 1,5m da rede e 1,5m da antena.","A1 entra em um \u00e2ngulo de 45 graus em rela\u00e7\u00e3o \u00e0 rede (os dois p\u00e9s e o peito j\u00e1 apontam naturalmente para a Zona Alvo na diagonal oposta).","No ponto mais alto do salto, A1 solta o bra\u00e7o em pot\u00eancia m\u00e1xima na dire\u00e7\u00e3o do seu peito, fazendo a bola cruzar toda a quadra at\u00e9 a Zona Alvo da diagonal longa.","Fazem 6 ataques da esquerda para a diagonal direita e 6 ataques da direita para a diagonal esquerda; depois trocam com L1."],"pontosAtencao":["A cortada na diagonal \u00e9 o golpe de for\u00e7a mais seguro da praia porque a quadra tem quase 10 metros de comprimento em diagonal do ponto do salto at\u00e9 o canto oposto.","Para um destro atacando na direita (sa\u00edda de rede), a bola j\u00e1 vem pelo lado do bra\u00e7o forte: cuidado para n\u00e3o bater cedo demais e mandar fora na lateral; espere a bola cruzar a frente do seu rosto.","Finalize o movimento do bra\u00e7o ao lado do quadril oposto."],"erroComum":"Saltar muito perto da bola (debaixo dela) e n\u00e3o conseguir jogar o peso do tronco na diagonal; corrija mantendo a bola meio bra\u00e7o \u00e0 frente do ombro. Varia\u00e7\u00f5es","variacaoFacil":"L1 lan\u00e7a a bola manualmente na altura ideal para A1 focar 100% na corrida em \u00e2ngulo de 45 graus.","variacaoDificil":"Exigir que a cortada diagonal quique primeiro entre os 5 e 7 metros da quadra advers\u00e1ria com velocidade alta.","paraTurma":"Em turmas de 4 a 12 alunos, duas filas de ataque nas duas pontas da quadra esquerda cruzam ataques alternados nas duas Zonas Alvo diagonais do lado direito (com comando do levantador).","meta":"Cravar 7 de 10 cortadas em pot\u00eancia dentro da Zona Alvo da diagonal longa.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na esquerda, A1 abre para a lateral superior e entra em \u00e2ngulo de 45 graus (seta tracejada 1) recebendo o levantamento de L1 (seta 1). A1 bate a cortada cruzada potente (seta 2) atingindo a Zona Alvo (3x3m) na diagonal longa inferior da quadra direita.","codigo":"ATQ-INI-112"},{"numero":113,"secao":7,"nome":"Bola de 'cut shot' (diagonal curt\u00edssima rente \u00e0 rede)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"5 bolas, 4 cones e 2 zonas alvo de cut shot CUT SHOT (1-3m) CUT SHOT (1-3m)A1 L1 1 1 2 Giro fino de punho na diagonal curt\u00edssima (1m a 3m) Quadra 16x8m vista de cima. Na esquerda, L1 levanta (seta 1) para A1 que entra pela esquerda (seta tracejada 1). No salto, A1 corta o \u00e2ngulo da bola enviando um","objetivo":"Executar o giro fino de punho (ou golpe de ponta de dedo r\u00edgida lateral) para fazer a bola cruzar a rede em \u00e2ngulo fechado e cair nos primeiros 2 metros da lateral oposta.","comoMontar":"L1 no centro da meia-quadra esquerda (1,5m) e A1 na entrada esquerda (4,5m). Na meia-quadra direita, demarque a Zona Alvo de Cut Shot colada \u00e0 linha lateral oposta, entre 1 metro e 3 metros da rede (logo atr\u00e1s da antena oposta).","passoAPasso":["O 'Cut Shot' (diagonal curt\u00edssima) \u00e9 um dos golpes mais famosos e letais do v\u00f4lei de praia quando o bloqueador fecha a paralela e o defensor fica l\u00e1 no fundo da diagonal.","A1 faz a aproxima\u00e7\u00e3o de ataque exatamente igual \u00e0 da cortada forte na diagonal (peito apontado em 45 graus).","No topo do salto, em vez de bater atr\u00e1s da bola, A1 desacelera o bra\u00e7o a 30% de for\u00e7a e 'corta' a face externa da bola girando o polegar para baixo (para destros na esquerda, gira o punho da esquerda para a direita como se virasse uma ma\u00e7aneta).","A bola sai com efeito lateral/topspin, cruza a fita em \u00e2ngulo agudo e cai a 2 metros da rede perto da linha lateral oposta (Zona de Cut Shot).","Realizam 6 cuts da esquerda e 6 cuts da direita (onde o destro puxa o punho para dentro do peito); depois trocam."],"pontosAtencao":["Para o cut shot funcionar no jogo real, voc\u00ea N\u00c3O pode virar o corpo antes de pular: suba fingindo que vai dar uma bomba no fundo e gire apenas o ombro/punho no \u00faltimo milissegundo.","N\u00e3o bata por baixo da bola no cut shot (sen\u00e3o ela faz um bal\u00e3o alto e o defensor alcan\u00e7a correndo): toque do meio para cima da bola com rota\u00e7\u00e3o para ela cair r\u00e1pido na areia.","Voc\u00ea pode executar o cut shot batendo leve de m\u00e3o aberta (com giro r\u00e1pido de punho sem conduzir) ou usando a 'cobra' r\u00edgida cortando o lado da bola."],"erroComum":"Empurrar a bola com os dedos moles tentando coloc\u00e1-la na diagonal curta (infra\u00e7\u00e3o de toque na praia); corrija exigindo um tapa curto de punho que fa\u00e7a a bola sair rodando. Varia\u00e7\u00f5es","variacaoFacil":"Aumentar a Zona de Cut Shot para at\u00e9 4 metros da rede.","variacaoDificil":"Colocar 1 jogador ou cone alto bloqueando a paralela e 1 defensor aos 6,5m na diagonal que tenta arrancar para salvar o cut shot.","paraTurma":"Em turmas de 4 a 12 alunos, posicione dois tapetes ou quadrados de cones nas duas zonas de cut shot (a 2m da rede nas laterais). Os alunos competem em duplas para ver quem acerta mais cuts na s\u00e9rie de 6 bolas.","meta":"Colocar 6 de 10 bolas de cut shot dentro da zona curta lateral (1m a 3m da rede) sem bater na rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na esquerda, L1 levanta (seta 1) para A1 que entra pela esquerda (seta tracejada 1). No salto, A1 corta o \u00e2ngulo da bola enviando um 'cut shot' agudo (seta 2) que cruza a rede e cai na Zona Alvo colada \u00e0 linha lateral inferior direita (entre 1m e 3m da rede).","codigo":"ATQ-INT-113"},{"numero":114,"secao":7,"nome":"Bola alta por cima do bloqueio ('lob' / chute para o canto de fundo)","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (A1 atacante, L1 levantador e B1 bloqueador de refer\u00eancia)","tempo":"9 minutos","material":"5 bolas, 4 cones e 2 zonas alvo nos cantos de 8m LOB 8m LOB 8m A1 L1 B1 1","objetivo":"Encobrir o bloqueador na rede com um golpe alto de topspin ou cobra que caia exatamente nos \u00faltimos 1,5 metro dos cantos de fundo.","comoMontar":"Na meia-quadra esquerda, L1 no centro (1,5m) e A1 na entrada esquerda (5m). Na meia-quadra direita, posicione B1 junto \u00e0 rede com os bra\u00e7os levantados (bloqueando a linha de A1) e demarque duas Zonas Alvo (2x2m) nos dois cantos extremos da linha de fundo (aos 8m).","passoAPasso":["A1 passa a bola para L1 e inicia a aproxima\u00e7\u00e3o de ataque.","B1 (do outro lado da rede) posiciona-se fechando a frente de A1 e salta com os bra\u00e7os bem altos.","Vendo o pared\u00e3o de B1 \u00e0 sua frente, A1 mant\u00e9m o bra\u00e7o alto e executa o 'Lob de Praia' (usando um tapa de m\u00e3o aberta de baixo para cima com muito giro de punho topspin, ou um golpe de 'cobra/poke' firme de baixo para cima).","A bola passa 1 metro acima da ponta dos dedos do bloqueio de B1 e viaja at\u00e9 cair dentro da Zona Alvo no canto da linha de fundo (a 7,5m\u20138m da rede).","A1 alterna 4 lobs no canto fundo da paralela (por cima da cabe\u00e7a de B1) e 4 lobs no canto fundo da diagonal; rodam a cada 8 bolas."],"pontosAtencao":["O bom lob na praia N\u00c3O \u00e9 um bal\u00e3o lento que sobe 10 metros: ele tem a altura exata para passar a 50 cm das m\u00e3os do bloqueador e viaja r\u00e1pido com rota\u00e7\u00e3o topspin para cair antes de o defensor chegar!","Bata na parte traseira-inferior da bola e quebre o punho por cima dela para ela mergulhar em cima da fita de fundo.","Mire sempre nos 2 cantos da linha de fundo (onde as duas fitas se encontram), que s\u00e3o os pontos mais distantes da quadra."],"erroComum":"Bater reto demais tentando encobrir o bloqueio e levar um bloqueio na cabe\u00e7a, ou bater sem giro de punho mandando a bola 2 metros para fora; corrija olhando para a ponta dos dedos de B1 e quebrando a munheca no alto. Varia\u00e7\u00f5es","variacaoFacil":"B1 fica em p\u00e9 na areia com os bra\u00e7os erguidos sem saltar (obst\u00e1culo mais baixo).","variacaoDificil":"B1 salta para bloquear e, assim que a bola passa por cima dele, B1 precisa abrir o quadril e correr at\u00e9 o canto de fundo tentando salvar o lob!","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 bloqueadores na rede direita (um na esquerda e um na direita) e duas filas de ataque no lado esquerdo treinando o lob nos dois cantos de fundo.","meta":"Acertar 6 de 10 lobs por cima do bloqueio de B1 caindo dentro dos quadrados de 2x2m nos cantos da linha de fundo.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na esquerda, L1 levanta (seta 1) para A1 que avan\u00e7a (seta tracejada 1). B1 salta bloqueando na rede direita. A1 executa o 'lob' alto por cima de B1 enviando a bola para a Zona Alvo no canto fundo da paralela (seta 2a) ou no canto fundo da diagonal (seta 2b) a 8m da rede.","codigo":"ATQ-INT-114"},{"numero":115,"secao":7,"nome":"Ataque de segunda bola (surpresa ap\u00f3s recep\u00e7\u00e3o alta no centro)","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (A1 passador, J2 atacante de segunda e D1 defensor advers\u00e1rio)","tempo":"9 minutos","material":"5 bolas, 2 cones e 2 zonas alvo ALVO 1 ALVO 2 A1 J2 D1 1","objetivo":"Aproveitar uma recep\u00e7\u00e3o ou defesa que subiu alta perto da rede para atacar de segunda bola pegando o bloqueio e a defesa advers\u00e1ria desprevenidos.","comoMontar":"Na meia-quadra esquerda, A1 (receptor) fica a 5,5m da rede na esquerda e J2 (parceiro que seria o levantador) come\u00e7a a 5m da rede na direita. Na meia-quadra direita, D1 aguarda na defesa com duas Zonas Alvo abertas.","passoAPasso":["D1 saca ou envia uma bola para A1 na meia-quadra esquerda.","A1 faz uma recep\u00e7\u00e3o alta e perfeita que sobe a 1,5 metro da rede no centro da quadra.","Em vez de entrar devagar para levantar, J2 l\u00ea que a bola est\u00e1 perfeita, grita 'MINHA DE SEGUNDA!' e acelera em ritmo de passada de ataque ('direita-esquerda' na areia).","J2 salta no ponto mais alto e ataca a segunda bola de m\u00e3o aberta (ou aplica um cut shot/poke se D1 estiver plantado no fundo) mirando nas Zonas Alvo da quadra direita.","A cada 6 bolas, invertem quem passa e quem ataca de segunda."],"pontosAtencao":["No v\u00f4lei de praia, como os dois jogadores s\u00e3o permitidos atacar de qualquer posi\u00e7\u00e3o (n\u00e3o existe zona de frente ou de fundo), a bola de segunda \u00e9 uma jogada mortal para quebrar o ritmo de bloqueio do advers\u00e1rio.","Quando voc\u00ea vai atacar de segunda vindo do fundo em diagonal para a rede, a bola est\u00e1 caindo de frente para voc\u00ea: tome cuidado para n\u00e3o saltar cedo demais.","Avise o seu parceiro (A1) gritando 'DEIXA!' ou 'VOU BATER!' para ele n\u00e3o correr para a rede \u00e0 toa e j\u00e1 ficar cobrindo o seu ataque."],"erroComum":"Decidir atacar de segunda uma bola que ficou longe da rede (aos 3,5m) ou muito baixa, entregando uma bola f\u00e1cil para o advers\u00e1rio; corrija permitindo o ataque de segunda apenas quando o passe cair dentro da faixa de 1m a 2m da rede. Varia\u00e7\u00f5es","variacaoFacil":"A1 lan\u00e7a a bola alta no centro da rede para J2 treinar exclusivamente o tempo de corrida e batida de segunda.","variacaoDificil":"Colocar uma dupla completa do outro lado (bloqueador + defensor): J2 pode fingir que vai levantar (olhando para A1) e atacar de segunda, ou fingir que vai bater de segunda e levantar no ar para A1!","paraTurma":"Em turmas de 4 a 12 alunos, jogue em duplas: a dupla recebe o saque e ganha 2 pontos se conseguir finalizar de segunda bola quando o passe for bom, ou 1 ponto se fizer os 3 toques normais.","meta":"Converter 7 de 10 ataques de segunda bola dentro das Zonas Alvo sem tocar na rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. D1 na direita envia bola (seta 1) para A1 (a 5,5m superior na esquerda). A1 passa alto para o centro da rede (seta 2). J2 (que estava a 5m inferior) acelera em passada de ataque (seta tracejada 1) e ataca de segunda bola (setas 3a e 3b) nas Zonas Alvo da quadra direita.","codigo":"ATQ-INT-115"},{"numero":116,"secao":7,"nome":"Ataque de bola mal levantada: afastada da rede (a 3,5 metros)","nivel":"Intermedi\u00e1rio","jogadores":"2 ou 3 jogadores (A1 atacante, L1 levantador e D1 defensor)","tempo":"10 minutos","material":"5 bolas, 2 cones e 2 zonas alvo no fundo A1 L1 1 1","objetivo":"Ajustar o freio da passada para n\u00e3o correr para debaixo da rede quando o levantamento fica curto (aos 3,5m), atacando com arco alto e topspin no fundo.","comoMontar":"Na meia-quadra esquerda, coloque 1 cone de refer\u00eancia aos 3,5 metros da rede (onde o levantamento ruim vai cair). A1 come\u00e7a aos 5,5m da rede. Na meia-quadra direita, marque duas Zonas Alvo nos \u00faltimos 2,5 metros do fundo (dos 5,5m aos 8m).","passoAPasso":["A1 passa a bola para L1; L1 simula um levantamento em dia dif\u00edcil que fica preso atr\u00e1s na quadra (caindo no cone de 3,5 metros da rede, longe da fita).","Disciplina de p\u00e9s na areia: A1 N\u00c3O corre at\u00e9 a rede! Ele l\u00ea que a bola ficou atr\u00e1s, faz apenas 1 ou 2 passos curtos freando aos 3,5 metros (atr\u00e1s da linha da bola).","A1 salta equilibrado aos 3,5 metros da rede e golpeia a bola de baixo para a frente/cima, aplicando m\u00e1ximo giro de punho (topspin).","A bola faz um arco que limpa a rede com seguran\u00e7a e mergulha pesada nas Zonas Alvo do fundo da quadra direita (aos 7 metros).","Ap\u00f3s 8 bolas afastadas, trocam os pap\u00e9is."],"pontosAtencao":["O maior erro de ataque no v\u00f4lei de praia amador \u00e9 o jogador correr no autom\u00e1tico at\u00e9 a rede antes de ver o levantamento, deixando a bola cair nas suas costas aos 3,5m!","Quando voc\u00ea ataca dos 3,5 metros da rede, \u00e9 proibido bater para baixo (a bola vai direto na fita): bata para FRENTE e para o ALTO com muito topspin mirando nos \u00faltimos 2 metros do fundo.","Nos 3,5 metros da rede o bloqueador advers\u00e1rio n\u00e3o consegue te alcan\u00e7ar \u2014 use a quadra toda a seu favor."],"erroComum":"Correr para a frente, perceber que a bola ficou atr\u00e1s e tentar pular andando de costas (perdendo toda a for\u00e7a e errando na rede); corrija exigindo que A1 espere no cone de 5,5m at\u00e9 a bola sair da m\u00e3o de L1. Varia\u00e7\u00f5es","variacaoFacil":"L1 avisa 'FICOU ATR\u00c1S!' no momento do levantamento para A1 frear os p\u00e9s.","variacaoDificil":"L1 alterna sem avisar entre uma bola normal na rede (1,5m) e uma bola afastada (3,5m), testando a leitura de corrida de A1.","paraTurma":"Em turmas de 4 a 12 alunos, 1 levantador distribui bolas aos 3,5m para duas filas de ataque. Quem bate na rede paga 3 saltos na areia antes de voltar para a fila.","meta":"Colocar 7 de 10 bolas levantadas aos 3,5m da rede dentro das Zonas Alvo de fundo com topspin e zero bolas na rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na esquerda, L1 envia um levantamento afastado (seta 1) que cai no cone a 3,5m da rede. A1 sai dos 5,5m e freia a corrida aos 3,5m (seta tracejada curta 1), saltando longe da rede e atacando com topspin longo (setas 2a e 2b) nas Zonas Alvo de fundo (5,5m a 8m) na direita.","codigo":"ATQ-INT-116"},{"numero":117,"secao":7,"nome":"Ataque de bola baixa ou passada demais perto da antena","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"5 bolas, 2 cones e 2 zonas alvo ZONA 1 (DIAG) ZONA 2 (CURTA) A1 L1 1 1 2a 2b Bola passada na antena: Cruzar na diagonal com seguran\u00e7a","objetivo":"Resolver bolas levantadas muito baixas ou que fugiram para fora da antena usando velocidade de p\u00e9s e golpes t\u00e9cnicos de seguran\u00e7a (poke/cobra diagonal).","comoMontar":"Na meia-quadra esquerda, L1 no centro (1,5m) e A1 na entrada esquerda (4,5m). Coloque 1 cone colado \u00e0 linha lateral esquerda a 1,5m da rede. Na meia-quadra direita, marque a Zona Alvo 1 (meio-fundo) e a Zona Alvo 2 (diagonal curta).","passoAPasso":["L1 envia propositalmente dois tipos de 'bolas de sufoco' na ponta esquerda:","Bola Sufoco 1 (Bola Baixa/Chutada): o levantamento sai baixo, mal passando da altura da fita. A1 n\u00e3o perde tempo armando um salto lento: d\u00e1 1 passo r\u00e1pido, sobe enxuto e usa o 'poke' ou 'cobra' de baixo para cima enviando a bola na Zona Alvo 2 (diagonal curta).","Bola Sufoco 2 (Bola Passada na Antena): o levantamento corre demais para a linha lateral. A1 abre os passos para fora da quadra, n\u00e3o tenta bater na paralela (pois bateria na antena) e vira o punho/cobra para dentro da quadra na Zona Alvo 1 (diagonal).","Realizam 8 bolas de sufoco e invertem as fun\u00e7\u00f5es."],"pontosAtencao":["Mentalidade de campe\u00e3o na areia: 'Bola boa eu mato; bola ruim eu coloco no ponto mais dif\u00edcil para o advers\u00e1rio e mantenho o rally vivo!'.","Quando a bola passa demais para fora perto da antena, o \u00fanico caminho seguro que n\u00e3o toca na antena \u00e9 cruzar na diagonal.","Nunca tente dar uma pancada para baixo quando o levantamento vier na altura da fita."],"erroComum":"Frustrar-se com o levantamento ruim do parceiro e sentar o bra\u00e7o na rede ou na antena; corrija premiando com ponto dobrado o atacante que transformar uma bola horr\u00edvel em uma largada perfeita na diagonal. Varia\u00e7\u00f5es","variacaoFacil":"Treinar primeiro 5 bolas baixas seguidas e depois 5 bolas abertas na antena.","variacaoDificil":"Colocar 1 bloqueador na rede fechando a antena para obrigar A1 a contornar o bloqueio com golpe t\u00e9cnico.","paraTurma":"Em turmas de 4 a 12 alunos, fa\u00e7a o jogo da 'Bola Queimada': o levantador manda levantamentos dif\u00edceis de prop\u00f3sito e o atacante precisa manter 5 bolas seguidas vivas nas zonas alvo.","meta":"Salvar e colocar nas Zonas Alvo pelo menos 7 de 10 levantamentos ruins (baixos ou abertos demais) sem errar na rede ou antena.","descricaoDiagrama":"Quadra 16x8m vista de cima. L1 no centro envia levantamento baixo ou aberto demais at\u00e9 o cone junto \u00e0 antena superior esquerda (seta 1). A1 abre r\u00e1pido at\u00e9 a lateral (seta tracejada 1) e salva com golpe t\u00e9cnico (poke/cobra) cruzando longe da antena para a Zona Alvo 1 ou Zona Alvo 2 na diagonal direita (setas 2a e 2b).","codigo":"ATQ-INT-117"},{"numero":118,"secao":7,"nome":"Leitura visual do bloqueio fixo (fechando paralela vs. fechando diagonal)","nivel":"Intermedi\u00e1rio","jogadores":"3 jogadores (A1 atacante, L1 levantador e B1 bloqueador na rede)","tempo":"10 minutos","material":"5 bolas, 2 cones e 2 zon
