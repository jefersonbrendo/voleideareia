 4 metros.","No \u00faltimo passo antes de chegar ao cone de 2 metros, J1 d\u00e1 uma passada longa em afundo (perna da frente dobrada e bra\u00e7o estendido rente \u00e0 areia).","J1 toca a parte de baixo da bola que est\u00e1 na m\u00e3o de J2 com o dorso da m\u00e3o ou manchete sem deixar o peito desabar na areia.","J1 empurra a areia com a perna da frente e trota de costas de volta ao cone de 6 metros para atacar o cone do outro lado."],"pontosAtencao":["Manter o centro de gravidade baixo desde o primeiro passo: n\u00e3o suba o corpo para depois tentar abaixar em cima da bola.","No \u00faltimo passo, deslizar o p\u00e9 da frente na areia fofa como um esqui para frear sem travar o joelho.","Estender o bra\u00e7o longe do corpo para ganhar 50 cm extras de alcance na bola curta."],"erroComum":"Correr ereto e dobrar apenas a coluna para baixo na \u00faltima hora, perdendo o alcance; corrija pedindo para afundar o joelho de tr\u00e1s quase at\u00e9 a areia no \u00faltimo passo. Varia\u00e7\u00f5es","variacaoFacil":"Posicionar o cone de sa\u00edda a 4,5 metros da rede (deslocamento de apenas 2,5 metros).","variacaoDificil":"J2 solta a bola da altura da cintura e J1 precisa tocar nela antes que a bola encoste na areia.","paraTurma":"Com 4 a 12 alunos, coloque 2 alunos na rede segurando bolas nos dois cones da frente e o restante em fila no cone de 6 metros. Cada aluno faz direita e esquerda seguidas e troca de lugar com quem estava segurando a bola.","meta":"Alcan\u00e7ar e tocar por baixo da bola em 9 de 10 sa\u00eddas mantendo o equil\u00edbrio na frenagem.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 1 cone central a 6m da rede (J1) e 2 cones a 2m da rede nas diagonais. J2 junto ao cone frontal superior com bola. Seta tracejada 1 mostra a arrancada de 4m de J1 at\u00e9 o cone superior; seta tracejada 2 mostra o retorno ao centro; seta tracejada 3 mostra a ida ao cone inferior.","codigo":"DES-INI-017"},{"numero":18,"secao":2,"nome":"Recuo em diagonal para bola funda (lob)","nivel":"Iniciante","jogadores":"2 jogadores","tempo":"8 minutos","material":"3 cones J1 J2 1 2 3 Quadra 16x8m vista de cima. Na meia-quadra esquerda, 1 cone central a 3m da rede (J1) e 2 cones nos cantos da linha de fundo (8m). J2 junto \u00e0 rede. Seta tracejada 1 mostra o giro e recuo diagonal at\u00e9 o canto superior do fundo; seta tracejada 2 mostra o retorno ao centro; seta tracejada 3 mostra o recuo at\u00e9 o canto inferior do fundo.","objetivo":"Aprender a abrir o quadril e correr de frente olhando por cima do ombro para buscar bolas que encobrem o defensor.","comoMontar":"Coloque 1 cone central a 3 metros da rede (posi\u00e7\u00e3o adiantada) e 2 cones nos dois cantos da linha de fundo (a 8 metros da rede) na meia-quadra esquerda.","passoAPasso":["J1 come\u00e7a no cone de 3 metros da rede em base baixa; J2 fica junto \u00e0 rede de frente para J1.","J2 aponta com o bra\u00e7o estendido para o canto esquerdo ou direito do fundo da quadra (simulando um lob por cima da cabe\u00e7a de J1).","J1 abre imediatamente o quadril para o lado indicado (girando 135 graus) e corre de frente/diagonal em dire\u00e7\u00e3o ao cone da linha de fundo, nunca correndo de costas.","Durante a corrida at\u00e9 o fundo (cerca de 5,5 metros), J1 mant\u00e9m o queixo sobre o ombro interno olhando para o alto como se acompanhasse a bola no c\u00e9u.","Ao chegar no cone do fundo, J1 gira o quadril de frente para a rede, planta os dois p\u00e9s na areia simulando uma manchete alta para o meio da quadra e retorna ao cone de 3m."],"pontosAtencao":["Jamais recuar correndo de costas para bolas longas na areia: correr de costas \u00e9 lento e faz o jogador trope\u00e7ar nos montinhos de areia.","No final do recuo, o p\u00e9 mais pr\u00f3ximo da linha lateral deve plantar atr\u00e1s da linha da bola para virar o corpo de volta para o centro da quadra.","Manter os bra\u00e7os livres para correr forte e s\u00f3 juntar as m\u00e3os da manchete quando parar os p\u00e9s no fundo."],"erroComum":"Dar 3 passos de costas antes de virar o corpo; corrija exigindo que o primeiro movimento j\u00e1 seja o giro completo do quadril apontando o peito para o cone de fundo. Varia\u00e7\u00f5es","variacaoFacil":"Marcar os cones de fundo a 6,5 metros da rede (diagonal mais curta) e fazer em velocidade moderada.","variacaoDificil":"J1 come\u00e7a ajoelhado a 3 metros da rede de frente para a fita; ao sinal, levanta j\u00e1 abrindo o quadril e corre at\u00e9 o canto de 8 metros.","paraTurma":"Em turmas de 4 a 12 alunos, forme uma fila no cone central de 3 metros da rede. O professor aponta os cantos alternadamente; o aluno corre at\u00e9 o cone de fundo e volta por fora da linha lateral para o fim da fila.","meta":"Chegar aos cones da linha de fundo em menos de 3 segundos com os dois p\u00e9s virados de volta para a rede em 8 de 10 repeti\u00e7\u00f5es.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 1 cone central a 3m da rede (J1) e 2 cones nos cantos da linha de fundo (8m). J2 junto \u00e0 rede. Seta tracejada 1 mostra o giro e recuo diagonal at\u00e9 o canto superior do fundo; seta tracejada 2 mostra o retorno ao centro; seta tracejada 3 mostra o recuo at\u00e9 o canto inferior do fundo.","codigo":"DES-INI-018"},{"numero":19,"secao":2,"nome":"Frenagem na areia fofa e troca de dire\u00e7\u00e3o em V","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (revezando na esta\u00e7\u00e3o)","tempo":"8 minutos","material":"3 cones J1 J2 1 2 3 4 Quadra 16x8m vista de cima. Na meia-quadra esquerda, 1 cone central a 6,5m da rede (J1) e 2 cones a 2,5m da rede nas laterais formando um V. Seta tracejada 1 vai do centro ao cone frontal superior; seta 2 volta ao centro; seta 3 vai ao cone frontal","objetivo":"Treinar a t\u00e9cnica de estancar o movimento afundando a borda do p\u00e9 na areia para mudar de dire\u00e7\u00e3o sem escorregar.","comoMontar":"Monte um formato de 'V' na meia-quadra esquerda: 1 cone central a 6,5 metros da rede (v\u00e9rtice de sa\u00edda) e 2 cones a 2,5 metros da rede afastados 5 metros entre si (pontas do V).","passoAPasso":["J1 sai em explos\u00e3o do cone central (6,5m) em dire\u00e7\u00e3o ao cone frontal esquerdo (2,5m).","Ao chegar no cone esquerdo, J1 baixa o quadril e crava o calcanhar e a borda interna do p\u00e9 esquerdo (p\u00e9 de fora) na areia, levantando um leque de areia para frear.","Usando essa mesma perna esquerda como mola, J1 muda de dire\u00e7\u00e3o imediatamente em diagonal para tr\u00e1s voltando ao cone central de 6,5m.","No cone central, freia com o p\u00e9 de tr\u00e1s e j\u00e1 explode para o cone frontal direito (2,5m), completando o desenho do 'V' completo.","Ap\u00f3s completar ida e volta nos dois bra\u00e7os do V, J2 assume a esta\u00e7\u00e3o enquanto J1 descansa."],"pontosAtencao":["Sempre frear com o p\u00e9 de fora (mais distante do novo destino) para que o peso do corpo j\u00e1 fique inclinado para a dire\u00e7\u00e3o de volta.","Baixar o quadril no pen\u00faltimo passo antes do cone: se tentar frear com a perna esticada, o p\u00e9 desliza demais na areia fofa.","Tocar a base do cone com a m\u00e3o de fora para garantir o abaixamento real do centro de gravidade."],"erroComum":"Dar v\u00e1rios passinhos mi\u00fados ao redor do cone fazendo uma curva redonda em vez de um corte seco em \u00e2ngulo agudo; corrija exigindo uma \u00fanica travada firme com o p\u00e9 de fora. Varia\u00e7\u00f5es","variacaoFacil":"Fazer apenas um lado do V por vez, com 10 segundos de pausa no cone central.","variacaoDificil":"Fazer o retorno do cone da frente at\u00e9 o cone central abrindo o quadril para fora como se buscasse uma bola de lob ap\u00f3s uma finta curta.","paraTurma":"Monte dois circuitos em 'V' (um na meia-quadra esquerda e outro na direita). Divida os 4 a 12 alunos nas duas esta\u00e7\u00f5es; cada aluno executa o V completo e o pr\u00f3ximo j\u00e1 sai quando o anterior tocar o \u00faltimo cone.","meta":"Completar o circuito em 'V' completo (4 pernas de deslocamento) abaixo de 9 segundos com frenagens limpas nos 3 cones.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 1 cone central a 6,5m da rede (J1) e 2 cones a 2,5m da rede nas laterais formando um V. Seta tracejada 1 vai do centro ao cone frontal superior; seta 2 volta ao centro; seta 3 vai ao cone frontal inferior; seta 4 retorna ao centro. J2 aguarda ao lado.","codigo":"DES-INT-019"},{"numero":20,"secao":2,"nome":"Vai-e-vem frente-fundo (gangorra de defesa)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"8 minutos","material":"3 cones J1 J2 1 2 3 4 Quadra 16x8m vista de cima. Na meia-quadra esquerda, 3 cones alinhados horizontalmente: Cone A no fundo (8m), Cone B no meio (4,5m, onde inicia J1) e Cone C perto da rede (1,5m). Setas tracejadas mostram: 1 (B para C), 2 (C at\u00e9 A no","objetivo":"Condicionar a troca r\u00e1pida de padr\u00e3o motor entre a arrancada frontal baixa e o recuo profundo na mesma linha.","comoMontar":"Alinhe 3 cones em linha reta do fundo at\u00e9 a rede no corredor esquerdo da meia-quadra: Cone A na linha de fundo (8m da rede), Cone B no meio (4,5m da rede) e Cone C pr\u00f3ximo \u00e0 rede (1,5m da rede).","passoAPasso":["J1 inicia no Cone B (meio da quadra, a 4,5m da rede) em base baixa; J2 fica ao lado marcando o tempo e corrigindo a postura.","Ao sinal, J1 explode de frente at\u00e9 o Cone C (1,5m da rede) e toca o ch\u00e3o com as duas m\u00e3os simulando salvar uma bola curta.","Imediatamente abre o quadril e corre em velocidade m\u00e1xima at\u00e9 o Cone A na linha de fundo (8m da rede), percorrendo 6,5 metros.","Ao pisar no Cone A, vira de frente para a rede, toca a areia e arranca novamente at\u00e9 o Cone C (1,5m) e termina recuperando no Cone B (4,5m).","J1 e J2 revezam a cada s\u00e9rie completa."],"pontosAtencao":["Na transi\u00e7\u00e3o da rede para o fundo (do Cone C para o Cone A), n\u00e3o recuar de costas: gire os quadris 180 graus e corra de frente olhando por cima do ombro.","No Cone A (fundo), frear plantando o p\u00e9 de tr\u00e1s sobre a linha de fundo para n\u00e3o sair da quadra pela in\u00e9rcia.","Respirar de forma ritmada durante a corrida para n\u00e3o travar os ombros."],"erroComum":"Apoiar as m\u00e3os nos joelhos ou levantar o tronco totalmente ao chegar no cone do meio; corrija exigindo que a finaliza\u00e7\u00e3o no Cone B seja em posi\u00e7\u00e3o pronta de defesa. Varia\u00e7\u00f5es","variacaoFacil":"Reduzir as dist\u00e2ncias colocando o Cone A a 7 metros e o Cone C a 2,5 metros da rede.","variacaoDificil":"Realizar duas passagens cont\u00ednuas (Rede -> Fundo -> Rede -> Fundo -> Base) antes de trocar com o parceiro.","paraTurma":"Em uma meia-quadra \u00e9 poss\u00edvel montar 3 linhas paralelas de 3 cones (corredor esquerdo, centro e corredor direito). Tr\u00eas alunos trabalham juntos a cada sinal do professor, atendendo facilmente at\u00e9 12 alunos em 4 baterias.","meta":"Cumprir a sequ\u00eancia (Meio -> Rede -> Fundo -> Rede -> Meio) em menos de 11 segundos mantendo a t\u00e9cnica de giro.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 3 cones alinhados horizontalmente: Cone A no fundo (8m), Cone B no meio (4,5m, onde inicia J1) e Cone C perto da rede (1,5m). Setas tracejadas mostram: 1 (B para C), 2 (C at\u00e9 A no fundo), 3 (A de volta para C) e 4 (recupera\u00e7\u00e3o em B).","codigo":"DES-INT-020"},{"numero":21,"secao":2,"nome":"Toca no cone e recupera para a base central","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (1 executante e 1 comandante na rede)","tempo":"9 minutos","material":"5 cones J1 J2 1 2 3 4 Quadra 16x8m vista de cima. Na meia-quadra esquerda, 1 cone central a 5m da rede (J1) e 4 cones nos cantos (2 a 2m da rede e 2 a 7,5m no fundo). J2 na rede. Setas tracejadas numeradas 1, 2, 3 e 4 mostram a ida e volta do cone central para cada um dos 4 cantos em formato de estrela.","objetivo":"Criar o h\u00e1bito autom\u00e1tico de nunca admirar a pr\u00f3pria jogada e sempre voltar imediatamente ao ponto central de leitura.","comoMontar":"Monte uma estrela na meia-quadra esquerda: 1 cone central a 5 metros da rede (base) e 4 cones ao redor formando os 4 cantos (curta esquerda a 2m, curta direita a 2m, fundo esquerdo a 7,5m e fundo direito a 7,5m), numerados de 1 a 4.","passoAPasso":["J1 fica no cone central (5m da rede) em base ativa; J2 fica junto \u00e0 rede de frente para J1.","J2 chama um n\u00famero de 1 a 4 (por exemplo: '2!').","J1 usa o deslocamento correto para aquele canto (arrancada frontal para os cones 1 e 2; giro de quadril e recuo para os cones 3 e 4) e toca o cone chamado.","Assim que toca o cone perif\u00e9rico, J1 recupera em velocidade at\u00e9 o cone central (5m) e j\u00e1 faz o destrave de frente para J2.","No exato instante em que J1 pisa na base central, J2 chama o pr\u00f3ximo n\u00famero (sequ\u00eancia de 5 chamadas seguidas por s\u00e9rie)."],"pontosAtencao":["Ao retornar dos cones da frente (1 e 2) para o centro, recuar em diagonal olhando para J2 na rede sem dar as costas para a bola.","Ao retornar dos cones de fundo (3 e 4) para o centro, avan\u00e7ar de frente e j\u00e1 desacelerar no \u00faltimo passo para fazer o destrave equilibrado.","Nunca parar em cima do cone perif\u00e9rico: o toque no cone j\u00e1 \u00e9 o impulso de volta para a base."],"erroComum":"Voltar caminhando devagar para o cone central como se o ponto tivesse acabado; corrija chamando o pr\u00f3ximo n\u00famero antes mesmo de o jogador chegar ao centro caso ele diminua o ritmo. Varia\u00e7\u00f5es","variacaoFacil":"Chamar os 4 cones na ordem fixa (1, 2, 3 e 4) para o jogador focar apenas na qualidade dos apoios.","variacaoDificil":"J2 chama dois n\u00fameros seguidos ('1 e 4!'), obrigando J1 a ir na curta, passar pela base central e j\u00e1 buscar o fundo oposto.","paraTurma":"Monte uma estrela de 5 cones em cada meia-quadra (esquerda e direita). Coloque metade da turma em cada lado; cada aluno responde a 4 chamadas r\u00e1pidas e sai pela lateral enquanto o pr\u00f3ximo j\u00e1 assume o cone central.","meta":"Completar a s\u00e9rie de 5 chamadas aleat\u00f3rias com retorno perfeito \u00e0 base central em menos de 15 segundos.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 1 cone central a 5m da rede (J1) e 4 cones nos cantos (2 a 2m da rede e 2 a 7,5m no fundo). J2 na rede. Setas tracejadas numeradas 1, 2, 3 e 4 mostram a ida e volta do cone central para cada um dos 4 cantos em formato de estrela.","codigo":"DES-INT-021"},{"numero":22,"secao":2,"nome":"Sa\u00edda por est\u00edmulo visual do parceiro","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (1 bloqueador sinalizando na rede e 1 defensor no fundo)","tempo":"8 minutos","material":"4 cones J1 J2 1 2 3 Sinal nas costas (J2) Quadra 16x8m vista de cima. Na meia-quadra esquerda, J2 junto \u00e0 rede e J1 no cone central a 5,5m da rede. Tr\u00eas cones de destino: lateral superior (1), frontal a 2,5m (2) e lateral inferior (3). Setas tracejadas 1, 2 e 3 partem de J1 para os tr\u00eas","objetivo":"Treinar a partida explosiva guiada exclusivamente pela vis\u00e3o perif\u00e9rica e pelo sinal t\u00e1tico na rede, sem comando de voz.","comoMontar":"J2 fica junto \u00e0 rede (simulando o bloqueador de costas para J1, com as m\u00e3os atr\u00e1s do quadril). J1 fica no cone central de leitura a 5,5 metros da rede. Posicione 3 cones de destino: Cone Esquerdo (paralela), Cone Frontal (curta a 2,5m) e Cone Direito (diagonal).","passoAPasso":["J1 mant\u00e9m o foco visual nas m\u00e3os de J2 atr\u00e1s das costas enquanto movimenta a ponta dos p\u00e9s na areia.","J2 mostra um sinal silencioso com os dedos e depois salta para bloquear na rede: 1 dedo = sair para a Paralela (cone esquerdo); 2 dedos = sair para a Diagonal (cone direito); m\u00e3o fechada = avan\u00e7ar na Bola Curta (cone frontal).","No momento em que J2 salta na rede, J1 faz o destrave e explode para o cone correspondente ao sinal que acabou de ler.","J1 chega ao cone de destino plantando a base baixa de defesa como se fosse amortecer uma pancada e recupera ao centro.","Realizam 6 repeti\u00e7\u00f5es silenciosas seguidas e depois trocam de fun\u00e7\u00e3o."],"pontosAtencao":["N\u00e3o sair antes do salto do parceiro na rede para n\u00e3o entregar a movimenta\u00e7\u00e3o de defesa ao atacante advers\u00e1rio.","Sincronizar o destrave na areia com o momento em que os p\u00e9s do bloqueador saem do ch\u00e3o.","Chegar no cone de destino e parar 100% im\u00f3vel antes do momento imagin\u00e1rio do ataque."],"erroComum":"Come\u00e7ar a correr assim que v\u00ea os dedos nas costas do parceiro (saindo cedo demais); corrija instruindo: 'L\u00ea o sinal primeiro, espera o parceiro saltar, explode para o ponto'. Varia\u00e7\u00f5es","variacaoFacil":"Usar apenas duas op\u00e7\u00f5es de sa\u00edda (Paralela esquerda ou Diagonal direita).","variacaoDificil":"J2 muda o sinal no \u00faltimo segundo antes de saltar, exigindo leitura r\u00e1pida e adapta\u00e7\u00e3o imediata da dire\u00e7\u00e3o de sa\u00edda.","paraTurma":"Com 4 a 12 alunos, posicione 2 bloqueadores na rede (um na esquerda e um na direita) e duas filas de defensores a 5,5 metros. O defensor l\u00ea o sinal, executa a sa\u00edda e passa a ser o bloqueador da rodada seguinte.","meta":"Acertar 10 de 10 leituras visuais no tempo exato do salto do parceiro sem que nenhuma palavra seja dita na quadra.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J2 junto \u00e0 rede e J1 no cone central a 5,5m da rede. Tr\u00eas cones de destino: lateral superior (1), frontal a 2,5m (2) e lateral inferior (3). Setas tracejadas 1, 2 e 3 partem de J1 para os tr\u00eas cones conforme o sinal visual de J2.","codigo":"DES-INT-022"},{"numero":23,"secao":2,"nome":"Deslocamento ao comando de voz na transi\u00e7\u00e3o","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (1 atacante/chamador do outro lado da rede e 1 defensor)","tempo":"8 minutos","material":"3 cones e 1 bola J1 J2 1 2 3 Voz no salto: \"Curta / Diag / Fundo!\" Quadra 16x8m vista de cima. J2 no lado direito da rede com bola. No lado esquerdo, J1 no centro (5m da rede) cercado por 3 cones: Curta (2,5m), Diagonal (5m inferior) e Fundo (7,5m superior). Setas tracejadas 1, 2 e 3 indicam as rotas de","objetivo":"Reagir instantaneamente ao chamado verbal do parceiro quando o defensor est\u00e1 olhando para o atacante advers\u00e1rio.","comoMontar":"Coloque 3 cones na meia-quadra esquerda: Paralela Curta (a 2,5m da rede), Diagonal M\u00e9dia (a 5m da rede) e Fundo Linha (a 7,5m da rede). J1 come\u00e7a no centro da quadra (a 5m da rede). J2 fica do outro lado da rede com uma bola nas m\u00e3os.","passoAPasso":["J1 fica em base de defesa olhando para J2 atrav\u00e9s da rede.","J2 lan\u00e7a a bola para o alto para si mesmo e salta como se fosse atacar.","No ponto mais alto do salto, J2 grita em voz alta um dos tr\u00eas destinos: 'CURTA!', 'DIAGONAL!' ou 'FUNDO!'.","J1 destrava os p\u00e9s no ar e explode imediatamente para tocar o cone correspondente ao grito antes que J2 toque os p\u00e9s de volta na areia ap\u00f3s uma segunda bola imagin\u00e1ria.","Ap\u00f3s tocar o cone na postura correta (afundo na curta, base baixa na diagonal ou giro de quadril no fundo), J1 volta ao centro para a pr\u00f3xima chamada."],"pontosAtencao":["Manter os olhos na bola e no ombro de J2 at\u00e9 ouvir a chamada, unindo vis\u00e3o e audi\u00e7\u00e3o.","Na chamada 'FUNDO!', girar imediatamente o quadril e correr de frente at\u00e9 a linha de 7,5 metros.","Na chamada 'DIAGONAL!', usar 2 passos cruzados r\u00e1pidos e estancar a base antes que a bola imagin\u00e1ria chegue."],"erroComum":"Adivinhar o lado antes do grito e ficar com o peso no p\u00e9 errado; corrija fazendo J2 gritar exatamente para o lado oposto caso perceba que J1 adiantou o corpo. Varia\u00e7\u00f5es","variacaoFacil":"J2 n\u00e3o salta: apenas levanta o bra\u00e7o no ch\u00e3o e grita o destino com anteced\u00eancia de 1 segundo.","variacaoDificil":"Adicionar um 3\u00ba jogador (ou o professor) atr\u00e1s de J1 que d\u00e1 o comando de voz nas costas dele enquanto J2 salta em sil\u00eancio do outro lado da rede.","paraTurma":"Em turmas de 4 a 12 alunos, o professor fica do outro lado da rede saltando ou batendo na bola sobre um caixote, enquanto duplas de defensores (um na esquerda e um na direita da quadra) reagem juntas ao grito para os seus respectivos cones.","meta":"Reagir e tocar no cone chamado em menos de 1,8 segundo em pelo menos 8 de 10 chamadas.","descricaoDiagrama":"Quadra 16x8m vista de cima. J2 no lado direito da rede com bola. No lado esquerdo, J1 no centro (5m da rede) cercado por 3 cones: Curta (2,5m), Diagonal (5m inferior) e Fundo (7,5m superior). Setas tracejadas 1, 2 e 3 indicam as rotas de rea\u00e7\u00e3o de J1 ao comando de voz.","codigo":"DES-INT-023"},{"numero":24,"secao":2,"nome":"Retirada simples do bloqueio para a diagonal","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (revezando na fun\u00e7\u00e3o de bloqueador que retira)","tempo":"9 minutos","material":"2 cones J1 J2 1 2 Retirada da Rede at\u00e9 5,5m Quadra 16x8m vista de cima. Na meia-quadra esquerda, 1 cone junto \u00e0 rede (J1 inicial) e 1 cone na diagonal superior a 5,5m da rede. Seta tracejada 1 mostra o giro e corrida de retirada de J1 da rede at\u00e9 o cone de 5,5m; seta 2 mostra o","objetivo":"Aprender a mec\u00e2nica de sair da rede (pull-off) ap\u00f3s o salto ou finta de bloqueio para defender a quadra aberta.","comoMontar":"Coloque 1 cone junto \u00e0 rede no centro da meia-quadra esquerda (ponto de bloqueio) e 1 cone a 5,5 metros da rede na diagonal esquerda (ponto de defesa p\u00f3s- retirada).","passoAPasso":["J1 posiciona-se no cone da rede com os dois p\u00e9s paralelos a 30 cm da linha central e as m\u00e3os na altura dos ombros.","Ao sinal de J2, J1 realiza um salto vertical r\u00e1pido de bloqueio (ou finta alta de bra\u00e7os) sem tocar na rede.","Assim que as pontas dos p\u00e9s tocam a areia na descida, J1 j\u00e1 abre o p\u00e9 esquerdo e o quadril apontando o peito para o cone de 5,5 metros na diagonal.","J1 corre de frente/diagonal por 4 passadas explosivas olhando por cima do ombro direito (mantendo a rede no campo de vis\u00e3o).","A 1 metro do cone de 5,5m, J1 gira o quadril de frente para a rede, afunda a base na areia e estanca os dois p\u00e9s prontos para defender."],"pontosAtencao":["Nunca recuar da rede pulando de costas: voc\u00ea perde totalmente a velocidade na areia fofa.","O segredo da retirada r\u00e1pida est\u00e1 na aterrissagem do bloqueio: des\u00e7a j\u00e1 girando o quadril 120 graus para a diagonal de sa\u00edda.","\u00c9 obrigat\u00f3rio parar totalmente os dois p\u00e9s no cone de 5,5m antes do momento do ataque advers\u00e1rio."],"erroComum":"Continuar correndo para tr\u00e1s na hora em que o atacante bate na bola; corrija com o comando verbal 'CORRE, CORRE, PLANTA!' exigindo congelamento total no cone final. Varia\u00e7\u00f5es","variacaoFacil":"N\u00e3o saltar na rede: fazer apenas a finta de bra\u00e7os no ch\u00e3o (amea\u00e7a de bloqueio) e j\u00e1 abrir o quadril para retirar.","variacaoDificil":"Ap\u00f3s parar na base aos 5,5 metros, J2 d\u00e1 um segundo sinal obrigando J1 a mergulhar 1,5 metro \u00e0 frente para buscar uma largada curta.","paraTurma":"Divida a rede em duas esta\u00e7\u00f5es (lado esquerdo e lado direito da meia-quadra). Duas filas de alunos saem da rede simultaneamente ao apito do professor: um retira para a diagonal esquerda e o outro para a diagonal direita.","meta":"Sair da aterrissagem na rede e estar com os dois p\u00e9s plantados no cone de 5,5m em menos de 2,2 segundos em 8 de 10 repeti\u00e7\u00f5es.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, 1 cone junto \u00e0 rede (J1 inicial) e 1 cone na diagonal superior a 5,5m da rede. Seta tracejada 1 mostra o giro e corrida de retirada de J1 da rede at\u00e9 o cone de 5,5m; seta 2 mostra o enquadramento frontal dos p\u00e9s para a rede. J2 observa na lateral.","codigo":"DES-INT-024"},{"numero":25,"secao":2,"nome":"Retirada do bloqueio com escolha de corredor","nivel":"Avan\u00e7ado","jogadores":"2 jogadores (1 bloqueador na rede e 1 defensor de fundo coordenando a dupla)","tempo":"9 minutos","material":"3 cones J1J2 1 2 J2 chama corredor (1) e J1 retira no corredor livre (2) Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 no cone da rede e J2 no centro a 6m da rede. Dois cones a 5m da rede (Paralela superior e Diagonal inferior). Seta tracejada 1 mostra J2 fechando o cone inferior; seta tracejada 2 mostra J1 retirando da rede para o cone superior livre.","objetivo":"Coordenar a retirada da rede com a movimenta\u00e7\u00e3o do parceiro de fundo, cobrindo o corredor que ficar livre.","comoMontar":"Na meia-quadra esquerda, coloque 1 cone na rede (posi\u00e7\u00e3o de J1) e 2 cones a 5 metros da rede: um no corredor da Paralela (esquerda) e outro no corredor da Diagonal (direita). J2 (defensor) inicia a 6 metros da rede no centro.","passoAPasso":["J1 est\u00e1 na rede apresentando bloqueio; J2 est\u00e1 no fundo a 6 metros da rede.","Ao iniciar a jogada, J2 grita qual corredor ELE vai cobrir no fundo ('MINHA PARALELA!' ou 'MINHA DIAGONAL!') e corre para aquele cone.","J1 amea\u00e7a o bloqueio na rede, ouve a chamada de J2, abre o quadril para o corredor oposto que sobrou livre e retira em velocidade at\u00e9 a linha de 5 metros.","Ambos estancam os p\u00e9s simultaneamente a 5 metros da rede ocupando perfeitamente as duas metades da quadra sem deixar buraco nem bater cabe\u00e7a.","Ap\u00f3s 6 repeti\u00e7\u00f5es, trocam quem come\u00e7a na rede e quem come\u00e7a no fundo."],"pontosAtencao":["A comunica\u00e7\u00e3o de J2 precisa ser alta, curta e acontecer antes de J1 iniciar o giro de retirada.","Se J1 retirar para a paralela (linha reta para tr\u00e1s), ainda assim deve abrir o quadril lateralmente e correr de lado/frente olhando para a bola.","Os dois jogadores devem terminar alinhados na profundidade de 5 metros com 4 metros de dist\u00e2ncia lateral entre si."],"erroComum":"Os dois jogadores correrem para o mesmo cone por falta de escuta ou chamada tardia; corrija obrigando J2 a gritar no instante em que faz o primeiro passo. Varia\u00e7\u00f5es","variacaoFacil":"Combinar antes da sa\u00edda por sinais de dedos nas costas quem vai para qual lado, treinando primeiro a mec\u00e2nica coordenada.","variacaoDificil":"Incluir uma 3\u00aa chamada: 'FICA!', na qual J1 salta de verdade para bloquear na rede e J2 cruza o fundo sozinho cobrindo a diagonal longa.","paraTurma":"Em turmas de 4 a 12 alunos, trabalhe em duplas reais. Uma dupla faz 3 sa\u00eddas seguidas na meia-quadra esquerda enquanto a pr\u00f3xima dupla aguarda a 2 metros fora da linha de fundo pronta para entrar.","meta":"Executar 9 de 10 retiradas coordenadas com ocupa\u00e7\u00e3o correta dos dois cones opostos sem nenhuma confus\u00e3o de lado.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 no cone da rede e J2 no centro a 6m da rede. Dois cones a 5m da rede (Paralela superior e Diagonal inferior). Seta tracejada 1 mostra J2 fechando o cone inferior; seta tracejada 2 mostra J1 retirando da rede para o cone superior livre.","codigo":"DES-AVA-025"},{"numero":26,"secao":2,"nome":"Arrancada lateral com recep\u00e7\u00e3o de manchete na zona alvo","nivel":"Avan\u00e7ado","jogadores":"2 jogadores (1 lan\u00e7ador/sacador e 1 passador)","tempo":"10 minutos","material":"3 bolas, 2 cones e 1 zona alvo ALVO J1 J2 1 1 2 Quadra 16x8m vista de cima. J2 no lado direito sacando/lan\u00e7ando. No lado esquerdo, J1 sai do cone superior (a 6m da rede), desloca 4m pelo passo cruzado","objetivo":"Unir o passo cruzado de deslocamento na areia com a parada total dos p\u00e9s para entregar uma recep\u00e7\u00e3o perfeita na rede.","comoMontar":"Na meia-quadra esquerda, coloque 1 cone de sa\u00edda pr\u00f3ximo \u00e0 linha lateral esquerda (a 6m da rede) e 1 cone de recep\u00e7\u00e3o a 4 metros de dist\u00e2ncia lateral para o lado direito (tamb\u00e9m a 6m da rede). Demarque uma Zona Alvo junto \u00e0 rede no centro da quadra. J2 fica do outro lado da rede com as bolas.","passoAPasso":["J1 come\u00e7a no cone esquerdo (a 6m da rede) em postura de recep\u00e7\u00e3o.","J2 lan\u00e7a (ou saca f\u00e1cil) uma bola alta arqueada por cima da rede em dire\u00e7\u00e3o ao cone da direita (4 metros longe de J1).","Assim que a bola sai da m\u00e3o de J2, J1 gira o quadril, usa o passo cruzado r\u00e1pido para atravessar os 4 metros de areia fofa e chega atr\u00e1s da linha da bola.","Antes de a bola descer na altura da cintura, J1 estanca completamente os dois p\u00e9s na areia, nivela os ombros e executa a manchete alta direcionada para a Zona Alvo junto \u00e0 rede.","J1 recupera para o cone inicial e repete; a cada 6 bolas, trocam as fun\u00e7\u00f5es."],"pontosAtencao":["Regra de ouro na areia: chegue cedo com as pernas para poder tocar na bola com os p\u00e9s 100% parados no ch\u00e3o.","Incline o ombro de fora (ombro direito) levemente para cima na hora da manchete para que a bola volte para o centro da rede e n\u00e3o escape para a antena.","Use o empurr\u00e3o das pernas na areia para dar altura \u00e0 bola, sem balan\u00e7ar os bra\u00e7os acima do ombro."],"erroComum":"Tocar na bola ainda correndo de lado, fazendo a bola espirrar para fora da quadra; corrija exigindo um 'freio de dois p\u00e9s' aud\u00edvel na areia um instante antes do contato. Varia\u00e7\u00f5es","variacaoFacil":"Diminuir o deslocamento lateral para 2,5 metros e fazer lan\u00e7amento alto com as duas m\u00e3os.","variacaoDificil":"J1 come\u00e7a no centro da linha de 6m e J2 saca sem avisar se a bola vai nos 3 metros da esquerda ou nos 3 metros da direita.","paraTurma":"Em turmas de 4 a 12 alunos, 2 alunos ficam do outro lado da rede sacando/lan\u00e7ando, 1 aluno fica na Zona Alvo agarrando as bolas passadas e os demais formam fila no cone de sa\u00edda, rodando a cada 2 recep\u00e7\u00f5es.","meta":"Colocar 7 de 10 bolas altas dentro da Zona Alvo junto \u00e0 rede ap\u00f3s o deslocamento de 4 metros.","descricaoDiagrama":"Quadra 16x8m vista de cima. J2 no lado direito sacando/lan\u00e7ando. No lado esquerdo, J1 sai do cone superior (a 6m da rede), desloca 4m pelo passo cruzado (seta tracejada 1) at\u00e9 o cone inferior para interceptar a bola 1 enviada por J2, e envia a manchete (seta de bola 2) para a Zona Alvo junto \u00e0 rede.","codigo":"DES-AVA-026"},{"numero":27,"secao":2,"nome":"Entrada na bola curta com defesa controlada","nivel":"Avan\u00e7ado","jogadores":"2 jogadores (1 lan\u00e7ador na rede e 1 defensor)","tempo":"10 minutos","material":"3 bolas, 2 cones e 1 zona alvo ALVO J1 J2 1 1 2 Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 no cone central a 6m da rede e J2 junto \u00e0 rede. J2 solta bola curta (seta de bola 1) no cone a 2m da rede;","objetivo":"Transformar a arrancada m\u00e1xima para frente em uma defesa alta e jog\u00e1vel no centro da quadra ap\u00f3s uma largada curta.","comoMontar":"Coloque 1 cone a 6 metros da rede no centro da meia- quadra esquerda (base de J1) e 1 cone a 2 metros da rede (ponto da largada curta). Demarque uma Zona Alvo no meio da quadra (a 3 metros da rede). J2 fica junto \u00e0 rede com as bolas.","passoAPasso":["J1 inicia a 6 metros da rede em base baixa, movendo os p\u00e9s na areia.","J2 finge que vai bater forte e solta uma bola curta ('pingo') que cai em dire\u00e7\u00e3o ao cone de 2 metros da rede.","J1 destrava, explode 4 metros para frente em velocidade m\u00e1xima e entra em afundo rasante no \u00faltimo passo.","Com a base baixa e o pulso firme, J1 entra por baixo da bola (de manchete ou toque de uma m\u00e3o fechada/dorso) levantando a bola com arco alto para dentro da Zona Alvo central.","Imediatamente ap\u00f3s o contato, J1 levanta da areia e j\u00e1 se posiciona para atacar a bola se necess\u00e1rio; trocam a cada 8 bolas."],"pontosAtencao":["Como o jogador vem correndo forte para frente, se ele balan\u00e7ar o bra\u00e7o a bola vai passar direto para o outro lado de gra\u00e7a: apenas apresente a plataforma firme e deixe a bola subir.","Colocar o \u00e2ngulo da manchete apontado quase para o c\u00e9u (70 graus) para amortecer a velocidade da corrida frontal.","Manter o queixo alto para enxergar o contato da bola no antebra\u00e7o."],"erroComum":"Bater na bola para frente em cima da rede enquanto corre; corrija pedindo para frear o p\u00e9 da frente na areia e apontar os polegares para baixo criando um 'trampolim' para o alto. Varia\u00e7\u00f5es","variacaoFacil":"J1 sai de 4,5 metros da rede e J2 lan\u00e7a a bola com um arco um pouco mais alto.","variacaoDificil":"J1 toca primeiro a m\u00e3o na linha de fundo (8m) antes de J2 soltar a bola curta aos 2,5 metros da rede.","paraTurma":"Com 4 a 12 alunos, divida a quadra em duas faixas (esquerda e direita). Dois alunos lan\u00e7am na rede e duas filas saem da linha de 6 metros; quem defende a bola curta j\u00e1 corre para pegar a bola que subiu na Zona Alvo e entra na fila oposta.","meta":"Salvar 7 de 10 bolas curtas fazendo a bola subir acima da altura da fita e cair dentro da Zona Alvo central.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 no cone central a 6m da rede e J2 junto \u00e0 rede. J2 solta bola curta (seta de bola 1) no cone a 2m da rede; J1 arranca 4m para frente (seta tracejada 1), defende antes de cair e levanta a bola (seta de bola 2) para a Zona Alvo no centro da quadra.","codigo":"DES-AVA-027"},{"numero":28,"secao":2,"nome":"Recuo para bola de lob com resposta de manchete","nivel":"Avan\u00e7ado","jogadores":"2 jogadores (1 lan\u00e7ador na rede e 1 defensor)","tempo":"10 minutos","material":"3 bolas, 2 cones e 1 zona alvo ALVO J1 J2 1 1 2 Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 come\u00e7a adiantado no cone a 3m da rede e J2 junto \u00e0 rede. J2 lan\u00e7a bola de lob (seta de bola 1) por cima de J1 at\u00e9 o cone de 7,5m no fundo; J1 abre o quadril e corre at\u00e9 o fundo (seta","objetivo":"Dominar a corrida de costas virando de frente para buscar o 'lob' no fundo da quadra e devolver a bola alta no centro.","comoMontar":"Na meia-quadra esquerda, coloque 1 cone a 3 metros da rede (posi\u00e7\u00e3o adiantada de J1) e 1 cone no canto do fundo a 7,5 metros da rede. Demarque a Zona Alvo no centro da meia-quadra (a 3m da rede). J2 fica junto \u00e0 rede com as bolas.","passoAPasso":["J1 come\u00e7a adiantado no cone de 3 metros da rede (como se tivesse fechado para a largada curta).","J2 lan\u00e7a uma bola alta por cobertura (lob) encobrindo a cabe\u00e7a de J1 em dire\u00e7\u00e3o ao cone de 7,5 metros no fundo da quadra.","J1 abre o quadril instantaneamente, corre de frente olhando para a bola por cima do ombro e ultrapassa a linha de queda da bola.","No \u00faltimo passo antes da linha de fundo, J1 planta o p\u00e9 de fora na areia, gira os ombros de frente para o centro da quadra e executa uma manchete alta de recupera\u00e7\u00e3o para a Zona Alvo.","Realizam 6 bolas para o canto esquerdo e 6 bolas para o canto direito, depois invertem os pap\u00e9is."],"pontosAtencao":["N\u00e3o tente tocar na bola correndo de costas para a rede a menos que seja o \u00faltimo recurso: tente sempre dar um passo a mais para contornar a bola e virar o peito para o alvo.","Se n\u00e3o der tempo de virar o corpo todo, gire fortemente os ombros na dire\u00e7\u00e3o da Zona Alvo no momento da manchete lateral.","Mandar a bola bem alta (m\u00ednimo 4 metros de altura) para dar tempo ao parceiro de chegar para levantar."],"erroComum":"Correr olhando exatamente para baixo do ponto onde a bola vai cair e a bola passar por cima da cabe\u00e7a; corrija pedindo para correr mirando 1 metro atr\u00e1s do ponto de queda previsto (compensando o vento e o arco). Varia\u00e7\u00f5es","variacaoFacil":"J1 come\u00e7a a 4,5 metros da rede (recuo mais curto de apenas 3 metros at\u00e9 o fundo).","variacaoDificil":"J2 primeiro mostra a bola curta obrigando J1 a dar 1 passo \u00e0 frente e s\u00f3 ent\u00e3o lan\u00e7a o lob no fundo.","paraTurma":"Em turmas de 4 a 12 alunos, o professor lan\u00e7a os lobs a partir da rede alternando canto esquerdo e canto direito. Os alunos saem em fila do cone de 3 metros; quem defende coloca a bola na Zona Alvo para um colega que faz o papel de levantador.","meta":"Recuperar 7 de 10 bolas de lob no fundo da quadra colocando-as dentro da Zona Alvo a 3m da rede.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 come\u00e7a adiantado no cone a 3m da rede e J2 junto \u00e0 rede. J2 lan\u00e7a bola de lob (seta de bola 1) por cima de J1 at\u00e9 o cone de 7,5m no fundo; J1 abre o quadril e corre at\u00e9 o fundo (seta tracejada 1), gira e devolve de manchete (seta de bola 2) para a Zona Alvo central.","codigo":"DES-AVA-028"},{"numero":29,"secao":2,"nome":"Deslocamento do levantador saindo do fundo at\u00e9 a rede","nivel":"Avan\u00e7ado","jogadores":"2 jogadores (1 passador/defensor e 1 levantador infiltrando)","tempo":"10 minutos","material":"2 bolas, 2 cones e 1 zona alvo ALVOJ1 J2 1 1 2 Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 e J2 em cones a 6m da rede. J1 envia a bola alta (seta de bola 1) para o cone central a 1,5m da rede; J2 corre em diagonal do fundo at\u00e9 esse cone (seta tracejada 1), freia os p\u00e9s e levanta","objetivo":"Treinar a corrida longa de transi\u00e7\u00e3o do jogador que n\u00e3o passou a bola, freando com equil\u00edbrio junto \u00e0 rede para levantar sem conduzir.","comoMontar":"Coloque 2 cones a 6 metros da rede (J1 na esquerda como passador e J2 na direita como levantador que vai infiltrar). Coloque 1 cone de refer\u00eancia de levantamento a 1,5 metro da rede no centro e uma Zona Alvo de ataque na entrada da rede (esquerda).","passoAPasso":["J1 e J2 come\u00e7am alinhados no fundo a 6 metros da rede.","J1 lan\u00e7a a bola alta para o centro da quadra (simulando uma recep\u00e7\u00e3o ou defesa que subiu a 2 metros da rede) e grita 'SEU LEVANTE!'.","No instante em que a bola sobe da m\u00e3o de J1, J2 arranca em diagonal do fundo (6m) at\u00e9 o cone de levantamento (1,5m da rede), percorrendo cerca de 5 metros na areia.","J2 chega meio segundo antes da bola cair, estanca completamente os dois p\u00e9s na areia (p\u00e9 direito ligeiramente \u00e0 frente), vira os ombros para a entrada da rede e levanta de toque limpo ou manchete para a Zona Alvo de J1.","Ap\u00f3s 8 repeti\u00e7\u00f5es, invertem de lado e de fun\u00e7\u00e3o."],"pontosAtencao":["No v\u00f4lei de praia, se voc\u00ea tocar de dedos ainda correndo, a bola quase sempre gira ou caracteriza condu\u00e7\u00e3o: pare os dois p\u00e9s na areia antes de tocar na bola.","Corra olhando primeiro para o ponto onde a bola vai cair e ajuste os \u00faltimos dois passos curtos ('passos de freio') debaixo da bola.","Nunca cole na fita da rede: pare a 1 ou 1,5 metro de dist\u00e2ncia da rede para n\u00e3o tocar nela e deixar espa\u00e7o para o atacante."],"erroComum":"Correr em linha reta para a rede e depois ter que correr de lado perseguindo a bola; corrija ensinando a ler a trajet\u00f3ria da bola no primeiro segundo e correr em linha reta diretamente para o ponto de queda. Varia\u00e7\u00f5es","variacaoFacil":"J2 inicia a 4 metros da rede e realiza todos os levantamentos de manchete estancando os p\u00e9s.","variacaoDificil":"J1 varia a qualidade do passe (ora mais colado na rede, ora a 3,5 metros da rede), obrigando J2 a ajustar o freio e escolher entre toque ou manchete.","paraTurma":"Em turmas de 4 a 12 alunos, forme duas filas nos cones de 6 metros (fila da esquerda passa e vai atacar; fila da direita infiltra para levantar). Ap\u00f3s a sequ\u00eancia completa com chamada de ataque na Zona Alvo, os dois alunos trocam de fila.","meta":"Chegar com os dois p\u00e9s parados e acertar 8 de 10 levantamentos limpos dentro da Zona Alvo de ataque.","descricaoDiagrama":"Quadra 16x8m vista de cima. Na meia-quadra esquerda, J1 e J2 em cones a 6m da rede. J1 envia a bola alta (seta de bola 1) para o cone central a 1,5m da rede; J2 corre em diagonal do fundo at\u00e9 esse cone (seta tracejada 1), freia os p\u00e9s e levanta a bola (seta de bola 2) para a Zona Alvo na entrada da rede.","codigo":"DES-AVA-029"},{"numero":30,"secao":2,"nome":"Sequ\u00eancia completa: retirada de bloqueio, defesa e aproxima\u00e7\u00e3o de transi\u00e7\u00e3o","nivel":"Avan\u00e7ado","jogadores":"3 jogadores (ou 2 jogadores + professor/lan\u00e7ador do outro lado da rede)","tempo":"12 minutos","material":"3 bolas, 2 cones e 1 zona alvo ALVO J1 J2 P/T 1 2","objetivo":"Encadear os tr\u00eas deslocamentos mais exigentes da areia em um \u00fanico ponto: sair do bloqueio, defender no fundo e abrir para atacar.","comoMontar":"J1 come\u00e7a no cone junto \u00e0 rede (bloqueador); J2 come\u00e7a a 5 metros da rede no lado direito (parceiro/levantador); P/T (ou 3\u00ba jogador) fica do outro lado da rede com bolas. Coloque 1 cone de defesa na diagonal esquerda a 5,5m da rede e uma Zona Alvo junto \u00e0 rede na esquerda.","passoAPasso":["J1 salta ou finta o bloqueio na rede; quando P/T prepara o ataque do outro lado, J1 abre o quadril e retira em velocidade at\u00e9 o cone de 5,5m na diagonal.","J1 estanca os dois p\u00e9s na areia aos 5,5m exatamente quando P/T ataca/lan\u00e7a a bola firme na diagonal dele.","J1 defende a bola de manchete alta para o centro da quadra (onde J2 j\u00e1 est\u00e1 se posicionando para levantar).","Sem admirar a defesa, J1 imediatamente abre 2 passos para fora da linha lateral (ajustando o \u00e2ngulo de entrada) e acelera em dire\u00e7\u00e3o \u00e0 Zona Alvo na rede para receber o levantamento de J2.","J1 salta equilibrado na Zona Alvo e passa a bola controlada para o outro lado; a cada 5 sequ\u00eancias completas, rodam as posi\u00e7\u00f5es."],"pontosAtencao":["Existem duas paradas obrigat\u00f3rias de p\u00e9s nessa sequ\u00eancia: a parada da defesa aos 5,5m e os dois \u00faltimos passos de chamada do salto de ataque na rede.","Ap\u00f3s defender a bola para o alto, n\u00e3o corra reto para a rede debaixo da bola: abra ligeiramente para a linha lateral para enxergar o levantador e a quadra advers\u00e1ria.","Mantenha a comunica\u00e7\u00e3o constante com o parceiro ('Subiu!', 'Aqui na entrada!')."],"erroComum":"Gastar toda a energia na retirada e na defesa, ficando parado no fundo sem perna para entrar no ataque; corrija exigindo que o impulso de recupera\u00e7\u00e3o ap\u00f3s a defesa j\u00e1 seja o primeiro passo de abertura para o ataque. Varia\u00e7\u00f5es","variacaoFacil":"P/T lan\u00e7a uma bola mais lenta em arco na diagonal e J1 apenas faz a aproxima\u00e7\u00e3o de passada at\u00e9 a rede sem precisar saltar.","variacaoDificil":"P/T pode alternar entre bater na diagonal funda (5,5m) ou soltar um pingo curto na diagonal (3m) durante a retirada de J1.","paraTurma":"Em turmas de 4 a 12 alunos, o professor ataca/lan\u00e7a do outro lado da rede sobre um caixote. As duplas entram na quadra e jogam 2 transi\u00e7\u00f5es completas seguidas; assim que a 2\u00aa bola passa a rede, a dupla seguinte j\u00e1 est\u00e1 posicionada na rede e no fundo.","meta":"Completar 6 de 8 sequ\u00eancias completas (retirada + defesa alta + chamada de ataque equilibrada na Zona Alvo) sem a bola cair.","descricaoDiagrama":"Quadra 16x8m vista de cima. P/T no lado direito da rede envia a bola 1 para a diagonal esquerda. No lado esquerdo, J1 retira da rede at\u00e9 o cone de 5,5m (seta tracejada 1), defende a bola 2 para J2 no centro, e avan\u00e7a em curva (seta tracejada 2) para receber o levantamento (bola 3) na Zona Alvo junto \u00e0 rede.","codigo":"DES-AVA-030"},{"numero":31,"secao":3,"nome":"Mec\u00e2nica e p\u00eandulo do saque por baixo","nivel":"Iniciante","jogadores":"2 jogadores (1 sacador de cada lado da rede, frente a frente)","tempo":"8 minutos","material":"2 bolas, 4 cones e 2 zonas alvo ALVO 4x4mALVO 4x4m J1 J2 1 2 Sa\u00edda a 5m da rede Quadra 16x8m vista de cima. J1 posicionado em um cone a 5m da rede na meia- quadra esquerda; J2 posicionado em um cone a 5m da rede na meia-quadra direita.","objetivo":"Aprender a coordena\u00e7\u00e3o de base na areia, o movimento de p\u00eandulo do bra\u00e7o e o contato limpo no saque por baixo.","comoMontar":"Posicione 1 cone a 5 metros da rede no lado esquerdo (para J1) e 1 cone a 5 metros da rede no lado direito (para J2). Demarque uma grande Zona Alvo de 4x4 metros no centro de cada meia-quadra.","passoAPasso":["J1 posiciona-se no cone de 5 metros da rede com o p\u00e9 contr\u00e1rio ao bra\u00e7o que bate \u00e0 frente (destros colocam o p\u00e9 esquerdo na frente) bem firme na areia.","Segura a bola na altura da cintura com a m\u00e3o n\u00e3o dominante estendida \u00e0 frente do quadril do bra\u00e7o de batida.","Leva o bra\u00e7o dominante esticado para tr\u00e1s (movimento de p\u00eandulo de rel\u00f3gio) enquanto transfere o peso para a perna de tr\u00e1s.","Avan\u00e7a o bra\u00e7o de tr\u00e1s para frente sem jogar a bola para o alto (apenas tira a m\u00e3o de apoio no \u00faltimo instante) e bate por baixo da bola com a base firme da m\u00e3o fechada.","A bola passa por cima da rede e cai na Zona Alvo de J2, que agarra a bola e executa o mesmo movimento de volta."],"pontosAtencao":["N\u00e3o lance a bola para o alto no saque por baixo: no vento da praia ela sai do lugar; apenas solte a m\u00e3o da frente milissegundos antes do impacto.","Mantenha o cotovelo do bra\u00e7o de batida estendido e o punho travado no momento do contato.","Transfira o peso do p\u00e9 de tr\u00e1s para o p\u00e9 da frente acompanhando a bola em dire\u00e7\u00e3o \u00e0 rede."],"erroComum":"Dobrar o cotovelo na hora de bater, fazendo a bola subir verticalmente sem passar a rede; corrija pedindo para terminar o movimento com a m\u00e3o apontando para a fita superior da rede. Varia\u00e7\u00f5es","variacaoFacil":"Posicionar o cone de sa\u00edda a 3,5 metros da rede para reduzir a for\u00e7a exigida.","variacaoDificil":"Dar um passo para tr\u00e1s na areia a cada 2 acertos at\u00e9 chegar \u00e0 linha de fundo real (8 metros da rede).","paraTurma":"Em turmas de 4 a 12 alunos, divida metade dos alunos de cada lado da rede sobre a linha de 5 metros (cabem at\u00e9 6 lado a lado nos 8m de largura). Todos sacam ao comando do professor e buscam a bola que veio do lado oposto.","meta":"Acertar 8 de 10 saques por baixo passando sobre a rede e caindo dentro da Zona Alvo central.","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 posicionado em um cone a 5m da rede na meia- quadra esquerda; J2 posicionado em um cone a 5m da rede na meia-quadra direita. Seta de bola 1 sai de J1 cruzando a rede at\u00e9 a Zona Alvo (4x4m) no centro da quadra direita; seta de bola 2 faz o caminho inverso de J2 para a Zona Alvo da quadra esquerda.","codigo":"SAQ-INI-031"},{"numero":32,"secao":3,"nome":"Saque por baixo direcionado: esquerda e direita","nivel":"Iniciante","jogadores":"2 jogadores (1 sacador na linha de fundo e 1 coletor/receptor)","tempo":"8 minutos","material":"4 bolas, 4 cones e 2 zonas alvo ALVO 1 (DIAG) ALVO 2 (PARAL) J1 J2 1 2 Quadra 16x8m vista de cima. J1 atr\u00e1s da linha de fundo esquerda (8m da rede). Na meia-quadra direita, duas Zonas Alvo (3x3m a 4,5m da rede): Alvo 1 na parte","objetivo":"Controlar o alinhamento dos p\u00e9s e do ombro para direcionar o saque por baixo na paralela ou na diagonal da linha de fundo.","comoMontar":"J1 posiciona-se atr\u00e1s da linha de fundo esquerda (a 8 metros da rede). No lado direito da quadra, monte duas Zonas Alvo de 3x3 metros no meio da quadra (a 4,5m da rede): Alvo 1 na esquerda (diagonal) e Alvo 2 na direita (paralela). J2 fica entre os alvos recolhendo as bolas.","passoAPasso":["J1 come\u00e7a atr\u00e1s da linha de fundo no corredor direito da sua quadra.","Para os 5 primeiros saques (Alvo 2 - Paralela), J1 aponta a ponta do p\u00e9 da frente e o quadril diretamente em linha reta para a Zona Alvo 2.","Executa o p\u00eandulo do saque por baixo acompanhando o bra\u00e7o na linha reta do p\u00e9 da frente.","Para os 5 saques seguintes (Alvo 1 - Diagonal), J1 gira a base na areia apontando a ponta do p\u00e9 da frente e os ombros na diagonal para a Zona Alvo 1.","Ap\u00f3s os 10 saques, J1 e J2 invertem as fun\u00e7\u00f5es."],"pontosAtencao":["Na areia, a bola vai para onde o seu p\u00e9 da frente e o seu ombro apontam: alinhe a base antes de iniciar o movimento.","Como agora o saque sai de 8 metros (linha de fundo), use mais o impulso da perna de tr\u00e1s empurrando a areia.","Finalize com o bra\u00e7o de batida apontado exatamente para o cone central da zona escolhida."],"erroComum":"Tentar virar o punho na \u00faltima hora para mudar a dire\u00e7\u00e3o da bola sem virar os p\u00e9s; corrija obrigando o aluno a desenhar um risco na areia com o p\u00e9 da frente apontando para o alvo. Varia\u00e7\u00f5es","variacaoFacil":"Permitir dar 1 passo dentro da quadra (sacar a 6,5 metros da rede) para alunos que ainda n\u00e3o t\u00eam for\u00e7a para vencer os 8 metros.","variacaoDificil":"J2 grita 'PARALELA!' ou 'DIAGONAL!' quando J1 j\u00e1 est\u00e1 preparando a base na linha de fundo.","paraTurma":"Com 4 a 12 alunos, coloque 2 filas de sacadores atr\u00e1s da linha de fundo esquerda e 2 alunos no lado direito recolhendo bolas nos alvos e rolando por baixo da rede. Rod\u00edzio a cada 4 saques por aluno.","meta":"Acertar pelo menos 7 de 10 saques nas zonas chamadas (m\u00ednimo de 3 na paralela e 3 na diagonal).","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 atr\u00e1s da linha de fundo esquerda (8m da rede). Na meia-quadra direita, duas Zonas Alvo (3x3m a 4,5m da rede): Alvo 1 na parte superior (diagonal) e Alvo 2 na parte inferior (paralela), com J2 entre elas. Seta de bola 1 vai de J1 ao Alvo 1 (diagonal) e seta de bola 2 vai de J1 ao Alvo 2 (paralela).","codigo":"SAQ-INI-032"},{"numero":33,"secao":3,"nome":"Lan\u00e7amento consistente para o saque por cima","nivel":"Iniciante","jogadores":"2 jogadores (lado a lado na linha de fundo)","tempo":"7 minutos","material":"2 bolas e 4 cones (ou 2 aros/marcas na areia) J1 J2 1 1 Al\u00e7ada precisa 50 cm \u00e0 frente do ombro Quadra 16x8m vista de cima. Atr\u00e1s da linha de fundo esquerda (8m da rede), J1 e J2 posicionados lado a lado. \u00c0 frente de cada jogador (a 0,5m dentro da quadra), pequenos alvos circulares demarcados na areia. Setas curtas 1 indicam o","objetivo":"Automatizar a al\u00e7ada (lan\u00e7amento) baixa e precisa da bola \u00e0 frente do ombro de ataque, evitando que o vento da praia espalhe a bola.","comoMontar":"Na linha de fundo esquerda, posicione 2 cones para marcar os p\u00e9s de J1 e J2. Exatamente 50 cm \u00e0 frente do p\u00e9 direito de cada jogador (para destros), desenhe um c\u00edrculo na areia ou coloque um cone chato como alvo de queda da bola.","passoAPasso":["J1 e J2 ficam em posi\u00e7\u00e3o de saque por cima: p\u00e9 esquerdo \u00e0 frente, p\u00e9 direito atr\u00e1s, bola na m\u00e3o esquerda na altura do peito e bra\u00e7o direito j\u00e1 armado alto com o cotovelo acima da linha da orelha.","Sem dobrar o punho da m\u00e3o que segura a bola, elevam a bola suavemente apenas 40 a 50 cm acima do ponto de contato (muito mais baixo do que na quadra indoor).","Na primeira s\u00e9rie de 8 repeti\u00e7\u00f5es, o jogador N\u00c3O bate na bola: ele mant\u00e9m o bra\u00e7o direito armado l\u00e1 no alto e deixa a bola cair no ch\u00e3o.","A bola deve cair exatamente sobre a marca desenhada na areia (50 cm \u00e0 frente do ombro direito) sem rolar para os lados.","Na segunda s\u00e9rie, lan\u00e7am a bola e a agarram no ponto mais alto com a m\u00e3o direita totalmente estendida, conferindo o alcance."],"pontosAtencao":["No v\u00f4lei de praia \u00e9 proibido lan\u00e7ar a bola e peg\u00e1-la de volta ap\u00f3s o apito do \u00e1rbitro: por isso o lan\u00e7amento precisa ser curto, limpo e sem giro.","Levante a bola com o bra\u00e7o esticado usando o ombro (como um elevador), sem jogar com os dedos para ela n\u00e3o girar no vento.","Arme o cotovelo do bra\u00e7o de batida ANTES de levantar a bola."],"erroComum":"Lan\u00e7ar a bola 2 metros para o alto ou atr\u00e1s da cabe\u00e7a, obrigando o jogador a arquear as costas e perder a bola no vento; corrija limitando a altura da al\u00e7ada a dois palmos acima da m\u00e3o estendida. Varia\u00e7\u00f5es","variacaoFacil":"Fazer o exerc\u00edcio a 3 metros da rede olhando para a fita para ter refer\u00eancia visual de altura.","variacaoDificil":"Fazer o lan\u00e7amento de olhos fechados no momento de soltar a bola e abrir os olhos para cravar a m\u00e3o no ponto mais alto.","paraTurma":"Posicione todos os 4 a 12 alunos distribu\u00eddos nas duas linhas de fundo (at\u00e9 6 em cada lado). Cada aluno desenha seu alvo na areia a 50 cm \u00e0 frente do p\u00e9 de ataque e executa as s\u00e9ries sob contagem do professor.","meta":"Fazer 8 de 10 lan\u00e7amentos ca\u00edrem exatamente dentro do c\u00edrculo de 30 cm na areia \u00e0 frente do ombro de batida.","descricaoDiagrama":"Quadra 16x8m vista de cima. Atr\u00e1s da linha de fundo esquerda (8m da rede), J1 e J2 posicionados lado a lado. \u00c0 frente de cada jogador (a 0,5m dentro da quadra), pequenos alvos circulares demarcados na areia. Setas curtas 1 indicam o lan\u00e7amento vertical preciso \u00e0 frente do ombro direito.","codigo":"SAQ-INI-033"},{"numero":34,"secao":3,"nome":"Saque por cima parado a curta dist\u00e2ncia","nivel":"Iniciante","jogadores":"2 jogadores (um de cada lado da rede a 5 metros)","tempo":"8 minutos","material":"2 bolas, 2 cones e 2 zonas alvo ZONA 4-6mZONA 4-6mJ1 J2 1 2 Quadra 16x8m vista de cima. J1 no cone a 5m da rede na esquerda; J2 no cone a 5m da rede na direita. Duas Zonas Alvo (entre 4m e 6m da rede) em cada lado. Seta de bola 1 vai de J1 por cima da rede at\u00e9 a Zona Alvo de J2; seta de bola 2 retorna de J2 para a Zona Alvo de J1. Objetivo: Conectar o lan\u00e7amento curto com a","objetivo":"Conectar o lan\u00e7amento curto com a batida de m\u00e3o aberta e r\u00edgida por cima da rede sem precisar for\u00e7ar o ombro.","comoMontar":"Coloque 1 cone a 5 metros da rede na meia-quadra esquerda (J1) e 1 cone a 5 metros da rede na meia- quadra direita (J2). Marque uma Zona Alvo entre os 4 e 6 metros de cada lado.","passoAPasso":["J1 posiciona-se no cone de 5 metros com a bola na m\u00e3o esquerda e o cotovelo direito j\u00e1 armado alto.","Lan\u00e7a a bola meio metro \u00e0 frente do ombro direito com pouca altura.","Transfere o peso do p\u00e9 de tr\u00e1s para o p\u00e9 da frente na areia enquanto gira o tronco e leva a palma da m\u00e3o aberta e dura contra o centro da bola.","A bola passa por cima da rede em trajet\u00f3ria firme at\u00e9 a Zona Alvo de J2.","J2 recebe a bola, posiciona-se no seu cone de 5 metros e executa o saque por cima de volta para J1."],"pontosAtencao":["Dedos da m\u00e3o de batida abertos mas totalmente r\u00edgidos, batendo com a base da palma da m\u00e3o no centro da bola.","N\u00e3o cruzar o bra\u00e7o para baixo ap\u00f3s o contato: empurre a bola para frente em dire\u00e7\u00e3o ao alvo.","Manter os dois p\u00e9s plantados na areia (o calcanhar de tr\u00e1s levanta na transfer\u00eancia de peso, mas n\u00e3o sai do lugar)."],"erroComum":"Bater na bola com a m\u00e3o mole ou dedos dobrados, perdendo pot\u00eancia; corrija pedindo para bater na bola parada na m\u00e3o do parceiro antes para sentir a rigidez do punho. Varia\u00e7\u00f5es","variacaoFacil":"Come\u00e7ar a 3,5 metros da rede focando exclusivamente no som seco da palma da m\u00e3o na bola.","variacaoDificil":"Exigir que a bola passe a no m\u00e1ximo 1 metro acima da fita da rede antes de cair na zona de 5 metros.","paraTurma":"Em turmas de 4 a 12 alunos, posicione duas fileiras frente a frente na linha de 5 metros de cada lado da rede. Sacam em duplas simultaneamente a cada apito do professor.","meta":"Conseguir 8 de 10 saques por cima limpos que passem a rede e caiam dentro da zona de 4 a 6 metros.","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 no cone a 5m da rede na esquerda; J2 no cone a 5m da rede na direita. Duas Zonas Alvo (entre 4m e 6m da rede) em cada lado. Seta de bola 1 vai de J1 por cima da rede at\u00e9 a Zona Alvo de J2; seta de bola 2 retorna de J2 para a Zona Alvo de J1.","codigo":"SAQ-INI-034"},{"numero":35,"secao":3,"nome":"Saque por cima parado da linha de fundo (8 metros)","nivel":"Iniciante","jogadores":"2 jogadores (1 sacador na linha de fundo e 1 no lado oposto)","tempo":"9 minutos","material":"4 bolas, 2 cones e 1 zona alvo ZONA FUNDO (4m-7,5m)J1 J2 1 1 Quadra 16x8m vista de cima. J1 atr\u00e1s da linha de fundo esquerda (8,5m da rede) entre 2 cones. Seta tracejada 1 indica o passo de transfer\u00eancia at\u00e9 a linha de 8m. Seta de bola 1 cruza toda a quadra esquerda e a rede, caindo na Zona Alvo (entre 4m e 7,5m da rede) na meia-quadra direita, onde J2 aguarda. Objetivo: Executar o saque por cima na dist\u00e2ncia","objetivo":"Executar o saque por cima na dist\u00e2ncia oficial da quadra de areia (8 metros at\u00e9 a rede) usando a cadeia cin\u00e9tica das pernas e tronco.","comoMontar":"Posicione 2 cones na linha de fundo esquerda (a 8 metros da rede) formando um portal de sa\u00edda para J1. Na meia-quadra direita, demarque uma grande Zona Alvo no centro-fundo (entre 4 e 7,5 metros da rede). J2 fica no lado direito recolhendo e devolvendo as bolas.","passoAPasso":["J1 come\u00e7a 1 passo atr\u00e1s da linha de fundo (a 8,5m da rede) entre os dois cones.","Armar o cotovelo alto, lan\u00e7ar a bola \u00e0 frente e dar 1 passo firme com o p\u00e9 contr\u00e1rio ao bra\u00e7o de batida em dire\u00e7\u00e3o \u00e0 linha de fundo (sem pisar na fita).","Impulsionar a areia com a perna de tr\u00e1s, girar o quadril e o ombro com velocidade e golpear a bola no ponto mais alto.","Fazer a bola atravessar os 8 metros da sua quadra mais 5 a 7 metros da quadra advers\u00e1ria, caindo na Zona Alvo.","Ap\u00f3s 8 saques, J1 corre para o outro lado e J2 assume a linha de saque."],"pontosAtencao":["A for\u00e7a para vencer os 14 metros totais na areia vem do passo \u00e0 frente e do giro de quadril, n\u00e3o apenas do ombro.","Aponte o contato levemente de baixo para o centro da bola (cerca de 15 graus para cima) para vencer a altura da rede.","Cuidado para n\u00e3o pisar sobre ou por baixo da fita da linha de fundo antes de tocar na bola (falta de p\u00e9)."],"erroComum":"Jogar a cabe\u00e7a para baixo no momento da batida, fazendo a bola bater no meio da rede; corrija pedindo para manter o queixo alto olhando para o fundo da quadra advers\u00e1ria. Varia\u00e7\u00f5es","variacaoFacil":"Dar 2 passos de embalada antes do lan\u00e7amento (caminhar e sacar) para gerar mais in\u00e9rcia para frente.","variacaoDificil":"Dividir a Zona Alvo ao meio (metade esquerda e metade direita) e exigir altern\u00e2ncia a cada saque.","paraTurma":"Com 4 a 12 alunos, forme 2 ou 3 colunas atr\u00e1s da linha de fundo esquerda. Os alunos da frente sacam juntos ao sinal; 2 alunos do outro lado recolhem as bolas para o cesto e trocam a cada 10 saques.","meta":"Colocar 7 de 10 saques por cima oficiais dentro da Zona Alvo de fundo sem cometer falta na linha.","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 atr\u00e1s da linha de fundo esquerda (8,5m da rede) entre 2 cones. Seta tracejada 1 indica o passo de transfer\u00eancia at\u00e9 a linha de 8m. Seta de bola 1 cruza toda a quadra esquerda e a rede, caindo na Zona Alvo (entre 4m e 7,5m da rede) na meia-quadra direita, onde J2 aguarda.","codigo":"SAQ-INI-035"},{"numero":36,"secao":3,"nome":"Contato seco para o saque flutuante (sem rota\u00e7\u00e3o)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (1 sacador e 1 observador/receptor do efeito)","tempo":"9 minutos","material":"4 bolas, 2 cones e 1 zona alvo ALVO 5mJ1 J2 1 Efeito Flutuante (Sem Giro) Quadra 16x8m vista de cima. J1 atr\u00e1s da linha de fundo esquerda (8m). Seta de bola 1 em linha ondulada (representando o efeito flutuante sem giro) atravessa a rede at\u00e9 a Zona Alvo a 5m da rede no lado direito, onde J2 observa e recebe. Objetivo: Eliminar o giro da bola atrav\u00e9s de um impacto curto e seco no centro de gravidade da","objetivo":"Eliminar o giro da bola atrav\u00e9s de um impacto curto e seco no centro de gravidade da bola, fazendo-a oscilar no ar.","comoMontar":"J1 atr\u00e1s da linha de fundo esquerda (8m). Na meia- quadra direita, demarque uma Zona Alvo central (a 5m da rede). J2 fica a 6 metros da rede no lado direito com a miss\u00e3o de observar os gomos da bola no ar.","passoAPasso":["J1 prepara o saque por cima e lan\u00e7a a bola com as duas m\u00e3os (ou uma m\u00e3o em bandeja) totalmente parada, sem nenhuma rota\u00e7\u00e3o.","Golpeia exatamente o centro da bola com a base da palma da m\u00e3o r\u00edgida e freia o bra\u00e7o imediatamente ap\u00f3s o contato (como um 'tapa seco' ou soco de karat\u00ea com a m\u00e3o aberta).","O punho n\u00e3o deve dobrar para baixo no final do movimento.","J2 acompanha a bola cruzando a rede e grita 'FLUTUOU!' se a v\u00e1lvula/costura da bola vier parada no ar (sem girar), ou 'GIROU!' se ela vier rodando.","S\u00f3 conta ponto no exerc\u00edcio se a bola cair na Zona Alvo E J2 confirmar que ela veio sem rota\u00e7\u00e3o; trocam a cada 8 saques."],"pontosAtencao":["O segredo do saque flutuante \u00e9 o tempo de contato m\u00ednimo: bata no centro da bola e congele a m\u00e3o aberta apontada para o alvo.","Se voc\u00ea 'pentear' a bola dobrando o punho, ela vai girar com topspin e perder\u00e1 o efeito de flutua\u00e7\u00e3o.","Contra o vento da praia, o saque flutuante balan\u00e7a duas vezes mais do que na quadra coberta."],"erroComum":"Continuar o movimento do bra\u00e7o at\u00e9 bater na pr\u00f3pria coxa, gerando rota\u00e7\u00e3o na bola; corrija pedindo para terminar o golpe com a palma da m\u00e3o parada \u00e0 frente do rosto como se dissesse 'PARE'. Varia\u00e7\u00f5es","variacaoFacil":"Realizar o saque a 6 metros da rede para focar 100% na freada do punho e na bola sem giro.","variacaoDificil":"Dar um pequeno salto para frente (flutuante em suspens\u00e3o) mantendo o contato seco sem rota\u00e7\u00e3o.","paraTurma":"Em turmas de 4 a 12 alunos, trabalhe em duplas (um saca da linha de fundo e o parceiro fica do outro lado avaliando o giro e recepcionando). Podem sacar 3 alunos ao mesmo tempo na largura da linha de fundo.","meta":"Conseguir 6 de 10 saques que caiam na Zona Alvo com rota\u00e7\u00e3o zero (flutuando visivelmente no ar).","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 atr\u00e1s da linha de fundo esquerda (8m). Seta de bola 1 em linha ondulada (representando o efeito flutuante sem giro) atravessa a rede at\u00e9 a Zona Alvo a 5m da rede no lado direito, onde J2 observa e recebe.","codigo":"SAQ-INT-036"},{"numero":37,"secao":3,"nome":"Saque flutuante rasante \u00e0 fita da rede","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"4 bolas, 2 cones de antena e 1 zona alvo ALVO 5m-7mJ1 J2 1 Sa\u00edda a 9m (Rasante \u00e0 fita: m\u00e1x 50cm) Quadra 16x8m vista de cima. J1 posicionado a 9m da rede (1m atr\u00e1s da linha de fundo esquerda). Seta de bola 1 reta e tensa passa pelo ponto demarcado sobre a rede central (observado por J2 junto ao poste) e atinge a Zona Alvo (5m a 7m da rede) no lado direito. Objetivo: Baixar o arco da trajet\u00f3ria do saque","objetivo":"Baixar o arco da trajet\u00f3ria do saque flutuante para que a bola passe no m\u00e1ximo a 50 cm acima da fita superior, tirando o tempo de rea\u00e7\u00e3o do passador.","comoMontar":"J1 posiciona-se a 1 metro atr\u00e1s da linha de fundo esquerda (a 9 metros da rede). Na meia-quadra direita, marque uma Zona Alvo entre os 5 e 7 metros da rede. J2 fica na lateral da rede olhando a altura de passagem da bola sobre a fita.","passoAPasso":["J1 recua 1 metro al\u00e9m da linha de fundo (totalizando 9 metros da rede): na f\u00edsica da areia, afastar-se um pouco da linha permite bater mais reto na bola sem que ela saia no fundo.","Fixa o olhar exatamente 30 cm acima da fita branca superior da rede.","Lan\u00e7a a bola baixa e executa o golpe flutuante horizontal, mirando rasante \u00e0 fita.","J2, posicionado ao lado do poste da rede, valida se a bola passou dentro da 'janela baixa' (at\u00e9 50 cm acima da fita) e caiu na Zona Alvo.","Realizam 10 tentativas e invertem as fun\u00e7\u00f5es."],"pontosAtencao":["Quando voc\u00ea saca colado na linha de fundo, precisa bater para cima e a bola faz um bal\u00e3o lento; recuando 1 metro, voc\u00ea bate reto e a bola passa r\u00e1pida e baixa.","Contato no centro-superior da bola com o tronco firme.","Se a bola tocar na fita e cair do outro lado, no v\u00f4lei de praia o ponto vale normalmente \u2014 n\u00e3o tenha medo de raspar a fita."],"erroComum":"Bater de baixo para cima fazendo a bola subir 3 metros acima da rede; corrija pedindo para mirar na borda superior da fita branca. Varia\u00e7\u00f5es","variacaoFacil":"Permitir uma janela de at\u00e9 1 metro acima da fita superior da rede.","variacaoDificil":"Amarrar um el\u00e1stico ou fita entre as duas antenas a 60 cm acima da rede para criar um t\u00fanel f\u00edsico real por onde a bola deve passar.","paraTurma":"Com 4 a 12 alunos, estique uma corda el\u00e1stica 60 cm acima da fita da rede (presa nas antenas). Os alunos sacam em fila das duas linhas de fundo tentando passar a bola entre a fita da rede e o el\u00e1stico.","meta":"Passar 7 de 10 saques flutuantes rasantes (abaixo de 50-60 cm da fita) caindo dentro da Zona Alvo.","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 posicionado a 9m da rede (1m atr\u00e1s da linha de fundo esquerda). Seta de bola 1 reta e tensa passa pelo ponto demarcado sobre a rede central (observado por J2 junto ao poste) e atinge a Zona Alvo (5m a 7m da rede) no lado direito.","codigo":"SAQ-INT-037"},{"numero":38,"secao":3,"nome":"Saque curto ('pingado') logo atr\u00e1s da rede","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"5 bolas, 4 cones e 2 zonas alvo curtas CURTA (1,5-3m) CURTA (1,5-3m) J1 J2 1 2 Quadra 16x8m vista de cima. J1 na linha de fundo esquerda (8m). Na meia-quadra direita, duas Zonas Alvo curtas coladas \u00e0 rede (1,5m a 3m de profundidade). Setas de bola arqueadas 1 e 2 saem de J1 e caem logo ap\u00f3s a rede nos dois alvos curtos, \u00e0 frente de J2 que est\u00e1 a 6m.","objetivo":"Dominar o amortecimento do contato para derrubar a bola entre os 1,5 e 3 metros da rede, obrigando o advers\u00e1rio a correr na areia fofa.","comoMontar":"J1 na linha de fundo esquerda (8m). No lado direito da rede, monte duas Zonas Alvo curtas (de 1,5m a 3m da rede): uma na esquerda e outra na direita, demarcadas com cones. J2 fica a 6 metros da rede no lado direito.","passoAPasso":["J1 prepara a mesma postura e o mesmo lan\u00e7amento de um saque forte de fundo (para n\u00e3o denunciar que vai sacar curto).","Inicia o movimento do bra\u00e7o r\u00e1pido, mas desacelera o ombro no \u00faltimo instante ou toca levemente na parte inferior-traseira da bola.","A bola deve subir apenas o suficiente para vencer a fita da rede e 'morrer' logo depois de cruzar, caindo dentro da faixa de 1,5 a 3 metros.","Como exerc\u00edcio complementar, sempre que a bola cair na zona curta, J2 tenta arrancar dos 6 metros apenas para sentir o qu\u00e3o dif\u00edcil \u00e9 buscar essa bola na areia.","Trocam de fun\u00e7\u00e3o a cada 8 saques."],"pontosAtencao":["Nunca mude a postura nem o lan\u00e7amento antes de sacar curto: o advers\u00e1rio l\u00ea o seu bra\u00e7o lento se voc\u00ea desacelerar cedo demais.","Mire para a bola atingir seu ponto mais alto ANTES de cruzar a rede, para que ela j\u00e1 esteja caindo quando passar a fita.","O saque curto na diagonal \u00e9 mais seguro porque o caminho sobre a rede \u00e9 mais longo."],"erroComum":"Empurrar a bola com medo de bater na rede, fazendo ela viajar at\u00e9 os 5 metros (direto no peito do recebedor); corrija pedindo para aceitar errar 1 bola na fita at\u00e9 calibrar a m\u00e3o leve. Varia\u00e7\u00f5es","variacaoFacil":"Colocar uma fileira de cones a 3,5 metros da rede: qualquer bola que cair entre a rede e a linha de 3,5m vale ponto.","variacaoDificil":"Alternar obrigatoriamente 1 saque curto (at\u00e9 3m) na diagonal esquerda e 1 saque curto na paralela direita.","paraTurma":"Em turmas de 4 a 12 alunos, coloque dois tapetes ou zonas de cones a 2,5 metros da rede em ambos os lados da quadra. Alunos sacam de ambos os lados tentando 'estacionar' as bolas na zona curta.","meta":"Fazer 6 de 10 saques ca\u00edrem dentro da zona curta (entre a rede e a marca de 3 metros).","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 na linha de fundo esquerda (8m). Na meia-quadra direita, duas Zonas Alvo curtas coladas \u00e0 rede (1,5m a 3m de profundidade). Setas de bola arqueadas 1 e 2 saem de J1 e caem logo ap\u00f3s a rede nos dois alvos curtos, \u00e0 frente de J2 que est\u00e1 a 6m.","codigo":"SAQ-INT-038"},{"numero":39,"secao":3,"nome":"Saque profundo no \u00faltimo metro da linha de fundo","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"5 bolas, 4 cones e 1 faixa alvo de fundo 1 2 Quadra 16x8m vista de cima. J1 atr\u00e1s da linha de fundo esquerda (8m). No extremo direito da quadra, uma Zona Alvo estreita e comprida ocupa os \u00faltimos 1,5m antes da linha de fundo (6,5m a 8m da rede). Setas de bola 1 e 2 atravessam toda a quadra at\u00e9 o fundo, com J2 conferindo a linha. Objetivo: Calibrar a for\u00e7a do saque para que a bola caia no corredor de 1,5 metro antes da linha","objetivo":"Calibrar a for\u00e7a do saque para que a bola caia no corredor de 1,5 metro antes da linha de fundo advers\u00e1ria, gerando d\u00favida se a bola vai dentro ou fora.","comoMontar":"J1 atr\u00e1s da linha de fundo esquerda (8m). Na meia- quadra direita, coloque 4 cones a 6,5 metros da rede, criando uma faixa alvo de 1,5m de profundidade colada \u00e0 linha de fundo (dos 6,5m aos 8m). J2 fica pr\u00f3ximo \u00e0 linha de fundo direita conferindo o quique na fita.","passoAPasso":["J1 posiciona-se na linha de fundo olhando para a fita de fundo advers\u00e1ria (a 16 metros de dist\u00e2ncia total).","Executa o saque flutuante tenso com pot\u00eancia de 85%, mirando na altura do peito de um recebedor que estaria a 5 metros da rede.","A bola deve passar da linha de recep\u00e7\u00e3o normal e cair nos \u00faltimos 1,5 metro da quadra (entre os cones de 6,5m e a fita de 8m).","Se a bola bater exatamente em cima da fita da linha de fundo (que mexe na areia), vale 2 pontos extras.","Trocam de lado a cada 10 saques."],"pontosAtencao":["No v\u00f4lei de praia, o receptor fica a 5 ou 5,5 metros da rede; uma bola que vai a 7,5 metros na altura do ombro dele o obriga a decidir em meio segundo se mancheta alto ou se abaixa para a bola sair.","Bata com o bra\u00e7o r\u00e1pido e punho firme, usando o passo \u00e0 frente na areia.","Observe a fita de fundo advers\u00e1ria: se o vento estiver mexendo a fita, ajuste 10% da for\u00e7a."],"erroComum":"Subir demais o arco da bola para ela chegar no fundo, dando tempo de o advers\u00e1rio recuar tranquilo; corrija exigindo trajet\u00f3ria tensa que passe a at\u00e9 80 cm da rede. Varia\u00e7\u00f5es","variacaoFacil":"Ampliar a faixa alvo de fundo para os \u00faltimos 2 metros da quadra (dos 6m aos 8m da rede).","variacaoDificil":"Colocar 2 alvos espec\u00edficos de 2x1,5m apenas nos dois cantos extremos da linha de fundo.","paraTurma":"Com 4 a 12 alunos, estique uma corda ou fita reserva na areia a 1,5 metro da linha de fundo em ambos os lados. Todos os alunos sacam tentando acertar o 'corredor de ouro' do fundo.","meta":"Acertar 6 de 10 saques dentro da faixa final de 1,5 metro sem ultrapassar a linha de fundo.","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 atr\u00e1s da linha de fundo esquerda (8m). No extremo direito da quadra, uma Zona Alvo estreita e comprida ocupa os \u00faltimos 1,5m antes da linha de fundo (6,5m a 8m da rede). Setas de bola 1 e 2 atravessam toda a quadra at\u00e9 o fundo, com J2 conferindo a linha.","codigo":"SAQ-INT-039"},{"numero":40,"secao":3,"nome":"Saque nas linhas laterais (corredor externo de 1 metro)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"9 minutos","material":"5 bolas, 6 cones e 2 corredores alvo CORREDOR LATERAL 1m J1 J1 J2 1 2 Quadra 16x8m vista de cima. J1 atr\u00e1s da linha de fundo esquerda. Na meia-quadra direita, duas Zonas Alvo estreitas de 1m de largura acompanham a linha lateral superior e a linha lateral inferior (dos 4m aos 7m). Seta de bola 1 vai para o","objetivo":"Acertar os corredores laterais de 1 metro de largura para afastar o recebedor do centro da quadra e alongar o levantamento dele.","comoMontar":"J1 saca da linha de fundo esquerda. Na meia-quadra direita, posicione cones a 1 metro de dist\u00e2ncia de cada linha lateral (entre os 4m e 7m de profundidade), formando dois corredores estreitos de 1m de largura colados \u00e0s fitas laterais. J2 fica no centro recolhendo as bolas.","passoAPasso":["J1 posiciona-se no canto direito da sua linha de fundo para sacar na paralela (corredor lateral direito advers\u00e1rio).","Alinha o p\u00e9 da frente e o ombro com a antena da direita e saca 5 bolas buscando o corredor de 1 metro ao longo da linha lateral.","Em seguida, J1 se desloca para o canto esquerdo da sua linha de fundo e saca outras 5 bolas na paralela oposta (corredor lateral esquerdo advers\u00e1rio).","Na segunda rodada, J1 saca do meio da linha de fundo buscando abrir \u00e2ngulo para as duas laterais em diagonal.","Trocam de fun\u00e7\u00e3o ap\u00f3s as duas rodadas."],"pontosAtencao":["Quando voc\u00ea tira o recebedor para a linha lateral na areia, o parceiro dele precisa correr o dobro para levantar ou o levantamento vem de longe da rede.","Use a antena como mira vertical: a bola na paralela deve passar a 30-50 cm por dentro da antena.","Mantenha o equil\u00edbrio na perna da frente para o corpo n\u00e3o cair para o lado no momento do golpe."],"erroComum":"Cruzar o bra\u00e7o na frente do peito na hora da batida, puxando a bola para o meio da quadra; corrija pedindo para terminar com a m\u00e3o apontada para a bandeirinha/canto da linha lateral. Varia\u00e7\u00f5es","variacaoFacil":"Aumentar a largura dos corredores laterais para 1,5 metro.","variacaoDificil":"Colocar 3 cones em p\u00e9 sobre a linha lateral e dar pontua\u00e7\u00e3o b\u00f4nus para quem derrubar um cone com o saque.","paraTurma":"Em turmas de 4 a 12 alunos, divida os sacadores nos dois cantos da linha de fundo esquerda (uma fila saca na paralela esquerda e a outra na paralela direita simultaneamente, sem as bolas se cruzarem).","meta":"Colocar 6 de 10 saques dentro dos corredores laterais de 1 metro de largura.","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 atr\u00e1s da linha de fundo esquerda. Na meia-quadra direita, duas Zonas Alvo estreitas de 1m de largura acompanham a linha lateral superior e a linha lateral inferior (dos 4m aos 7m). Seta de bola 1 vai para o corredor lateral superior e seta de bola 2 vai para o corredor lateral inferior. J2 no centro.","codigo":"SAQ-INT-040"},{"numero":41,"secao":3,"nome":"Saque na 'costura' (corredor central entre os receptores)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores (ou 3 jogadores posicionando os alvos humanos)","tempo":"9 minutos","material":"5 bolas, 4 cones e 1 zona alvo central COSTURA (1,5m)J1 J2 1 2 R1 (Cone) R2 (Cone) Quadra 16x8m vista de cima. J1 no centro da linha de fundo esquerda (8m). Na meia-quadra direita, a 5,5m da rede, dois cones marcam as posi\u00e7\u00f5es dos receptores e, exatamente no meio deles, uma Zona Alvo de 1,5m de largura","objetivo":"Cravar o saque exatamente na faixa central de 1,5 metro entre os dois recebedores para gerar hesita\u00e7\u00e3o e conflito de comunica\u00e7\u00e3o.","comoMontar":"J1 saca da linha de fundo esquerda. Na meia-quadra direita, a 5,5 metros da rede, coloque 2 cones grandes representando a posi\u00e7\u00e3o padr\u00e3o dos dois recebedores (a 2m de cada lateral) e demarque uma Zona Alvo de 1,5m de largura exatamente no meio entre eles (a 'costura'). J2 fica atr\u00e1s da zona central.","passoAPasso":["J1 posiciona-se no centro da linha de fundo esquerda (a 8,5m da rede).","Visualiza o espa\u00e7o exato de 1,5 metro entre os dois cones que simulam os recebedores advers\u00e1rios.","Executa um saque flutuante r\u00e1pido e reto que passe pelo meio da rede e caia exatamente dentro da Zona Alvo da costura.","Varie a profundidade dentro da costura: 1 bola na altura dos p\u00e9s da linha de passe (5,5m) e 1 bola no fundo da costura (7m, passando entre os ombros deles).","Ap\u00f3s 10 saques, J1 e J2 trocam de posi\u00e7\u00e3o."],"pontosAtencao":["No v\u00f4lei de praia, 70% dos aces acontecem na costura central porque um jogador acha que \u00e9 do parceiro ou os dois se fecham e perdem a linha de corrida para atacar.","A bola na costura precisa ter velocidade ou flutua\u00e7\u00e3o: se for um bal\u00e3o alto no meio, facilita a chamada deles.","Varie o seu ponto de sa\u00edda na linha de fundo (ora do meio, ora da ponta) mas continue mirando no centro da quadra."],"erroComum":"Espalhar o saque para a esquerda ou direita caindo direto no peito do cone/receptor; corrija alinhando o umbigo e a ponta do p\u00e9 da frente exatamente com o centro da quadra. Varia\u00e7\u00f5es","variacaoFacil":"Sacar sempre do centro da linha de fundo com faixa alvo central de 2 metros de largura.","variacaoDificil":"J1 precisa correr da lateral esquerda at\u00e9 o canto direito da linha de fundo, parar em 2 segundos e cravar o saque em diagonal dentro da costura.","paraTurma":"Em turmas de 4 a 12 alunos, coloque 2 alunos parados com os bra\u00e7os cruzados nas posi\u00e7\u00f5es de R1 e R2 (eles n\u00e3o podem se mexer). Os sacadores ganham ponto toda vez que a bola passa exatamente entre os dois colegas sem tocar neles.","meta":"Acertar 7 de 10 saques dentro do corredor central de 1,5 metro (a costura).","descricaoDiagrama":"Quadra 16x8m vista de cima. J1 no centro da linha de fundo esquerda (8m). Na meia-quadra direita, a 5,5m da rede, dois cones marcam as posi\u00e7\u00f5es dos receptores e, exatamente no meio deles, uma Zona Alvo de 1,5m de largura ('Costura'). Seta de bola 1 vai reta pelo eixo central at\u00e9 a Zona Alvo, com J2 ao fundo.","codigo":"SAQ-INT-041"},{"numero":42,"secao":3,"nome":"Saque alto 'Jornada nas Estrelas' (usando o sol e o vento)","nivel":"Intermedi\u00e1rio","jogadores":"2 jogadores","tempo":"10 minutos","material":"5 bolas, 4 cones e 1 zona alvo SOL NO Z\u00caNITE + VENTO ALVO QUEDA VERTICAL J1 J2 1 Arco de 12m a 15m (\"Jornada nas Estrelas\") Quadra 16x8m vista de cima com \u00edcone de Sol e Vento no topo. J1 atr\u00e1s da linha de fundo esquerda (8m). Seta de bola 1 com grande arco curvo (indicando altura extrema de 12-15m passando pelo sol) cruza a rede e cai na Zona Alvo (5m a","objetivo":"Executar o saque alt\u00edssimo por baixo (ou lateral) para fazer a bola subir acima de 12 metros, cruzar a linha do sol e despencar quase verticalmente com o vento.","comoMontar":"Escolha o lado da quadra em que o recebedor (J2) tenha que olhar diretamente contra o sol ou onde haja vento lateral/contra. J1 fica na linha de fundo esquerda (8m). Na meia-quadra direita, demarque uma Zona Alvo de 5m a 7,5m da rede.","passoAPasso":["J1 posiciona-se de lado para a rede (ombro esquerdo apontado para a rede se for destro) com os p\u00e9s bem afastados na areia.","Afunda bem os joelhos, segura a bola na linha do quadril de tr\u00e1s e faz um p\u00eandulo longo de baixo para cima em \u00e2ngulo de
